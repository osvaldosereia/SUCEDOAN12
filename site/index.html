<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6ef">
  <meta name="description" content="Peça cestas básicas e produtos de mercado da Dona Antônia em Cuiabá e Várzea Grande.">
  <link rel="canonical" href="https://donaantonia.com.br/site/">
  <link rel="preload" href="/img/logoantonia5.png" as="image">
  <link rel="preload" href="/img/CESTA-GRANDE-ALVINO.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="/site/styles.css?v=9">
  <title>Pedidos · Dona Antônia</title>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/site/" aria-label="Dona Antônia, início"><img src="/img/logoantonia5.png" width="168" height="58" alt="Super Cestas Básicas Dona Antônia"></a>
      <div class="location"><span class="icon" aria-hidden="true" data-icon="pin"></span><span>Entrega em<br><strong>Cuiabá e Várzea Grande</strong></span></div>
      <button class="cart-top" id="openCart" type="button" aria-label="Abrir pedido"><span class="icon" data-icon="cart" aria-hidden="true"></span><span id="cartCount" class="cart-badge">0</span></button>
    </div>
  </header>
  <main id="app" class="page" aria-live="polite">
    <form id="searchForm" class="search" role="search"><label class="sr-only" for="searchInput">Buscar produto</label><span class="icon" data-icon="search" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="O que você precisa hoje?" autocomplete="off"><button type="submit">Buscar</button></form>
    <section class="welcome"><div><h1>Cestas básicas<br>para sua casa</h1><a href="#content" class="hero-link">Ver cestas <span class="icon" data-icon="arrow" aria-hidden="true"></span></a></div></section>
    <nav class="category-nav" id="categoryNav" aria-label="Categorias"></nav>
    <section id="content" class="content"><div class="section-title"><h2>Nossas cestas</h2><p>Produtos essenciais com qualidade e economia.</p></div><div class="loading-cards" aria-label="Carregando cestas"><i></i><i></i></div></section>
  </main>
  <aside id="notice" class="notice" role="status" aria-live="polite"></aside>
  <div id="dialogRoot"></div>
  <div class="floating-cart" id="floatingCart"><span class="floating-icon"><span class="icon" data-icon="cart" aria-hidden="true"></span><b id="cartCountBottom">0</b></span><strong id="floatingCount">Seu pedido · 0 itens</strong><button id="openCartBottom" type="button">Ver pedido <span class="icon" data-icon="arrow" aria-hidden="true"></span></button><span class="floating-total" id="floatingTotal">R$ 0,00</span></div>
  <footer class="footer"><p><strong>Super Cestas Básicas Dona Antônia</strong><br>Pedido sujeito à confirmação de disponibilidade. Pagamento na entrega.</p></footer>
  <script type="module" src="/site/src/app.js?v=12"></script>
</body>
</html>
