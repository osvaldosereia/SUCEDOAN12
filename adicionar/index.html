<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f8f6">
  <title>Acrescentar ao pedido · Dona Antônia</title>
  <style>
    :root{--ink:#18221c;--muted:#657069;--line:#dde5df;--soft:#f3f6f3;--brand:#176b43;--brand2:#0f5233;--danger:#9d2235;--ok:#eaf5ee}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f8f6;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(100%,1040px);margin:auto;padding:14px 14px 120px}.head{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}.logo{width:78px;height:42px;object-fit:contain}.head div{flex:1}.head strong{display:block;font-size:18px}.head small,.muted{color:var(--muted)}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.hero h1{font-size:22px;line-height:1.15;margin:0 0 6px}.hero p{margin:0}.order-chip{display:inline-flex;margin-top:10px;padding:6px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:850}.timer{font-size:12px;color:var(--muted);margin-top:8px}.search{position:sticky;top:0;z-index:4;background:#f7f8f6;padding:10px 0 8px}.searchbox{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 10px;box-shadow:0 5px 18px rgba(23,54,37,.06)}.searchbox input{width:100%;border:0;outline:0;font:inherit;background:transparent;min-height:38px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product{display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px}.product img,.placeholder{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px;background:#fff}.placeholder{background:var(--soft)}.product-name{font-weight:800;line-height:1.25;margin-top:9px}.product-meta{font-size:11px;color:var(--muted);min-height:16px;margin-top:3px}.prices{display:flex;align-items:baseline;gap:6px;margin-top:7px}.current-price{font-size:18px;font-weight:950}.regular-price{text-decoration:line-through;color:var(--muted);font-size:11px}.qty-row{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:6px;margin-top:auto;padding-top:10px}.qty-btn{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:21px;font-weight:800;cursor:pointer}.qty-value{text-align:center;font-size:16px;font-weight:900}.more{width:100%;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-weight:800;margin-top:14px;cursor:pointer}.empty,.error,.loading{text-align:center;padding:34px 18px;color:var(--muted)}.success{background:var(--ok);border:1px solid #bad9c5;border-radius:14px;padding:13px;margin:12px 0}.success strong{display:block}.bottom{position:fixed;z-index:9;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -8px 28px rgba(20,44,29,.1);padding:max(10px,env(safe-area-inset-top)) max(12px,calc((100vw - 1040px)/2 + 14px)) max(10px,env(safe-area-inset-bottom))}.bottom-inner{display:grid;grid-template-columns:1fr minmax(210px,360px);align-items:center;gap:12px}.basket-summary small{display:block;color:var(--muted)}.basket-summary strong{font-size:19px}.cta{min-height:50px;border:0;border-radius:13px;background:var(--brand);color:#fff;font:inherit;font-weight:950;cursor:pointer}.cta:hover{background:var(--brand2)}.cta:disabled{opacity:.45;cursor:not-allowed}.closed{text-align:center;padding:38px 18px}.closed h1{font-size:22px;margin:0 0 8px}.closed .back{display:inline-flex;margin-top:12px;min-height:44px;align-items:center;justify-content:center;padding:0 16px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:850}.retry{background:#fff4e8;border:1px solid #e5c49c;border-radius:14px;padding:12px;margin:12px 0}.retry button{margin-top:8px;min-height:40px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:850;padding:0 14px}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom-inner{grid-template-columns:1fr 1.3fr}}
    @media(max-width:640px){.wrap{padding:10px 10px 116px}.hero,.panel{padding:12px}.grid{grid-template-columns:1fr;gap:9px}.product{display:grid;grid-template-columns:86px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:11px;padding:9px}.product img,.placeholder{grid-column:1;grid-row:1/5;width:86px;height:86px;aspect-ratio:auto}.product-name{grid-column:2;margin-top:0}.product-meta,.prices,.qty-row{grid-column:2}.qty-row{grid-template-columns:36px 48px 36px;justify-content:end;padding-top:6px}.qty-btn{height:34px}.bottom-inner{grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:8px}.cta{font-size:13px}.basket-summary strong{font-size:16px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="head"><img class="logo" src="/img/logoantonia5.png" alt="Dona Antônia"><div><strong>Dona Antônia</strong><small>Vitrine rápida do seu pedido</small></div></div>
  <div id="app"><div class="panel loading">Abrindo sua vitrine rápida…</div></div>
</main>
<div id="bottom" class="bottom" hidden><div class="bottom-inner"><div class="basket-summary"><small id="countLabel">Nenhum item</small><strong id="addValue">R$ 0,00</strong></div><button id="submitBtn" class="cta" disabled>Adicionar ao mesmo pedido</button></div></div>
<script>
(()=>{'use strict';
const API='https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/order-addon-public-v1';
const app=document.getElementById('app'),bottom=document.getElementById('bottom'),submitBtn=document.getElementById('submitBtn'),countLabel=document.getElementById('countLabel'),addValue=document.getElementById('addValue');
const TOKEN_KEY='da_order_addon_token_v1',PENDING_KEY='da_order_addon_pending_v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moneyCents=v=>(Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const state={token:'',session:null,products:[],cart:new Map(),offset:0,nextOffset:null,query:'',loading:false,pending:null,timer:null};
function takeToken(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const fromHash=(hash.get('t')||'').trim();
  if(fromHash){sessionStorage.setItem(TOKEN_KEY,fromHash);history.replaceState(null,'',location.pathname+location.search)}
  return fromHash||sessionStorage.getItem(TOKEN_KEY)||'';
}
function loadPending(){try{const raw=sessionStorage.getItem(PENDING_KEY);return raw?JSON.parse(raw):null}catch{return null}}
function savePending(value){state.pending=value;if(value)sessionStorage.setItem(PENDING_KEY,JSON.stringify(value));else sessionStorage.removeItem(PENDING_KEY)}
async function api(action,{method='GET',body=null,query=''}={}){
  const response=await fetch(API+'?action='+encodeURIComponent(action)+(query?'&'+query:''),{
    method,
    headers:{'X-Addon-Token':state.token,...(body?{'Content-Type':'application/json'}:{})},
    body:body?JSON.stringify(body):undefined,
    cache:'no-store',referrerPolicy:'no-referrer'
  });
  const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
  if(!response.ok){const e=new Error(data.error||'request_failed');e.data=data;e.status=response.status;throw e}
  return data;
}
function closed(reason){
  clearInterval(state.timer);bottom.hidden=true;
  const message=reason==='feature_disabled'?'Esta opção ainda não está disponível para este pedido.':
    reason==='session_expired'||reason==='addon_window_expired'?'O tempo para acrescentar produtos a este pedido terminou.':
    reason==='operation_limit_reached'?'Este pedido já recebeu o máximo de acréscimos permitidos.':
    'Este pedido já avançou para a próxima etapa e não pode mais receber produtos por esta vitrine.';
  app.innerHTML='<section class="panel closed"><h1>Vitrine encerrada</h1><p class="muted">'+esc(message)+'</p><a class="back" href="/">Voltar para a Dona Antônia</a></section>';
}
function renderHero(){
  const s=state.session||{};
  return '<section class="hero"><h1>Acrescentar ao pedido</h1><p class="muted">Escolha o que faltou. Os produtos serão incluídos no mesmo pedido, sem criar uma nova compra.</p><span class="order-chip">Pedido '+esc(s.order_number||'')+'</span><div id="timer" class="timer"></div></section>';
}
function productCard(p){
  const q=Number(state.cart.get(p.product_id)||0),regular=p.regular_price_cents?'<span class="regular-price">'+esc(moneyCents(p.regular_price_cents))+'</span>':'';
  const image=p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy">':'<div class="placeholder" aria-hidden="true"></div>';
  return '<article class="product" data-product="'+esc(p.product_id)+'">'+image+'<div class="product-name">'+esc(p.name)+'</div><div class="product-meta">'+esc([p.brand,p.packaging].filter(Boolean).join(' · '))+'</div><div class="prices"><span class="current-price">'+esc(moneyCents(p.price_cents))+'</span>'+regular+'</div><div class="qty-row"><button class="qty-btn" data-delta="-1" aria-label="Diminuir">−</button><div class="qty-value">'+q+'</div><button class="qty-btn" data-delta="1" aria-label="Aumentar">+</button></div></article>';
}
function renderCatalog(){
  const cards=state.products.map(productCard).join('');
  const more=state.nextOffset!=null?'<button id="loadMore" class="more">Ver mais produtos</button>':'';
  const success=document.getElementById('successMessage')?.outerHTML||'';
  const retry=state.pending?'<div id="retryMessage" class="retry"><strong>Não foi possível confirmar a resposta.</strong><div>Para evitar duplicidade, use o botão abaixo para repetir exatamente a mesma tentativa.</div><button id="retryBtn">Tentar novamente com segurança</button></div>':'';
  app.innerHTML=renderHero()+success+retry+'<div class="search"><div class="searchbox"><input id="searchInput" type="search" autocomplete="off" placeholder="Buscar produto" value="'+esc(state.query)+'"></div></div><section id="catalog">'+(cards?'<div class="grid">'+cards+'</div>'+more:'<div class="panel empty">Nenhum produto disponível nesta busca.</div>')+'</section>';
  bind();startTimer();updateBottom();
}
function bind(){
  document.querySelectorAll('.product').forEach(card=>card.addEventListener('click',event=>{
    const button=event.target.closest('[data-delta]');if(!button||state.pending)return;
    const id=card.dataset.product,delta=Number(button.dataset.delta||0),current=Number(state.cart.get(id)||0),next=Math.max(0,Math.min(30,current+delta));
    if(next)state.cart.set(id,next);else state.cart.delete(id);
    card.querySelector('.qty-value').textContent=String(next);updateBottom();
  }));
  const input=document.getElementById('searchInput');let searchTimer;
  if(input)input.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.query=input.value.trim();state.offset=0;state.products=[];loadProducts(false)},320)});
  document.getElementById('loadMore')?.addEventListener('click',()=>loadProducts(true));
  document.getElementById('retryBtn')?.addEventListener('click',()=>submit(true));
}
function cartRows(){
  return [...state.cart.entries()].map(([product_id,quantity])=>({product_id,quantity}));
}
function updateBottom(){
  const rows=cartRows(),byId=new Map(state.products.map(p=>[p.product_id,p])),cents=rows.reduce((sum,row)=>sum+Number(byId.get(row.product_id)?.price_cents||0)*row.quantity,0),count=rows.reduce((sum,row)=>sum+row.quantity,0);
  countLabel.textContent=count?count+' item(ns) para acrescentar':'Nenhum item selecionado';
  addValue.textContent=moneyCents(cents);
  submitBtn.disabled=!count||Boolean(state.pending);bottom.hidden=false;
}
function startTimer(){
  clearInterval(state.timer);
  const tick=()=>{const node=document.getElementById('timer');if(!node||!state.session?.expires_at)return;const left=new Date(state.session.expires_at).getTime()-Date.now();if(left<=0){closed('session_expired');return}const min=Math.floor(left/60000),sec=Math.floor((left%60000)/1000);node.textContent='Tempo disponível: '+min+':'+String(sec).padStart(2,'0')};
  tick();state.timer=setInterval(tick,1000);
}
async function loadSession(){
  const data=await api('session');
  state.session=data;
  if(data.eligible!==true){closed(data.reason);return false}
  return true;
}
async function loadProducts(append){
  if(state.loading)return;state.loading=true;
  try{
    const offset=append&&state.nextOffset!=null?state.nextOffset:0;
    const params=new URLSearchParams({limit:'12',offset:String(offset)});if(state.query)params.set('q',state.query);
    const data=await api('products',{query:params.toString()});
    state.session=data.session;
    if(data.session?.eligible!==true){closed(data.session?.reason);return}
    state.products=append?[...state.products,...(data.products||[])]:data.products||[];
    state.nextOffset=data.next_offset??null;renderCatalog();
  }catch(error){app.innerHTML=renderHero()+'<div class="panel error">Não consegui carregar os produtos. Tente novamente.</div>'}
  finally{state.loading=false}
}
function showSuccess(data){
  const box='<div id="successMessage" class="success"><strong>Itens adicionados ao mesmo pedido '+esc(data.order_number||'')+'.</strong><div>Valor acrescentado: '+esc(money(data.added_total))+' · Novo total: '+esc(money(data.total))+'</div></div>';
  const hero=app.querySelector('.hero');if(hero)hero.insertAdjacentHTML('afterend',box);
}
async function submit(isRetry=false){
  const rows=state.pending?.items||cartRows();if(!rows.length)return;
  if(!state.pending){
    savePending({request_key:crypto.randomUUID().replace(/-/g,''),items:rows});
  }
  submitBtn.disabled=true;submitBtn.textContent='Adicionando…';
  try{
    const data=await api('add_items',{method:'POST',body:{action:'add_items',request_key:state.pending.request_key,items:state.pending.items}});
    savePending(null);state.cart.clear();state.session={...state.session,operation_count:data.operation_count,expires_at:data.expires_at,current_total:data.total};
    renderCatalog();showSuccess(data);updateBottom();
  }catch(error){
    if(error?.status===409&&['session_closed','session_expired','order_status_closed','order_already_confirmed','bling_sync_started','separation_started','stock_already_consumed','operation_limit_reached','feature_disabled'].includes(error?.data?.error)){savePending(null);closed(error.data.error);return}
    if(error?.data?.error==='stock_changed'){savePending(null);alert('O estoque mudou enquanto você escolhia. Atualize os produtos e tente novamente.');state.cart.clear();await loadProducts(false);return}
    renderCatalog();
  }finally{submitBtn.textContent='Adicionar ao mesmo pedido';submitBtn.disabled=!state.cart.size||Boolean(state.pending)}
}
async function init(){
  state.token=takeToken();state.pending=loadPending();
  if(!/^[A-Za-z0-9_-]{32,96}$/.test(state.token)){sessionStorage.removeItem(TOKEN_KEY);closed('invalid_token');return}
  try{if(!await loadSession())return;await loadProducts(false)}catch{app.innerHTML='<section class="panel closed"><h1>Não consegui abrir a vitrine</h1><p class="muted">Tente novamente pelo link recebido.</p></section>'}
}
submitBtn.addEventListener('click',()=>submit(false));
init();
})();
</script>
</body>
</html>
