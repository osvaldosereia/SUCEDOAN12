<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Dona Antônia · Admin</title>
  <link rel="stylesheet" href="./simple.css?v=20260912-v4">
  <link rel="stylesheet" href="./ops-v3.css?v=20260911-v1">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span>DA</span><div><strong>Dona Antônia</strong><small>Admin</small></div></div>
    <nav id="nav" aria-label="Menu principal">
      <button class="nav active" data-route="products" type="button"><span>PR</span>Produtos</button>
      <button class="nav" data-route="baskets" type="button"><span>CE</span>Cestas básicas</button>
      <button class="nav" data-route="customers" type="button"><span>CL</span>Clientes</button>
      <a class="nav" href="../contagem/" target="_blank" rel="noopener"><span>BA</span>Balanço rápido</a>
    </nav>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button id="menuButton" class="icon mobile-only" type="button" aria-label="Abrir menu">☰</button>
      <div><h1 id="pageTitle">Produtos</h1><p id="pageSubtitle">Produtos cadastrados, incluindo inativos e revisão automática por EAN.</p></div>
      <button id="refreshButton" class="button secondary" type="button">Atualizar</button>
    </header>

    <main>
      <section class="view active" data-view="products">
        <div class="toolbar">
          <div class="search"><span>⌕</span><input id="productSearch" type="search" placeholder="Buscar produto, SKU ou marca"></div>
          <select id="productStatus" aria-label="Status">
            <option value="">Todos</option>
            <option value="active">Ativos</option>
            <option value="inactive">Inativos</option>
            <option value="ai-review">Revisão IA</option>
            <option value="offer">Ofertas</option>
            <option value="no-stock">Sem estoque</option>
          </select>
          <select id="productSort" aria-label="Ordenação"><option value="">Ordem da vitrine</option><option value="name">Nome</option><option value="stock">Menor estoque</option><option value="price">Menor preço</option></select>
        </div>
        <details class="panel filters-panel">
          <summary>Mais filtros</summary>
          <div class="toolbar filters-inner"><input id="productCategory" type="search" placeholder="Categoria"><input id="productBrand" type="search" placeholder="Marca"></div>
        </details>
        <section class="panel table-panel">
          <div class="table-summary"><strong id="productCount">0 produtos</strong><span id="productPage"></span></div>
          <div class="table-wrap"><table class="products-table"><thead><tr><th>Produto</th><th>Estoque</th><th>Preço normal</th><th>Ativo</th><th>Oferta</th><th>Preço da oferta</th><th>Ações</th></tr></thead><tbody id="productRows"></tbody></table></div>
          <div class="pager"><button id="prevProducts" class="button secondary small" type="button">Anterior</button><button id="nextProducts" class="button secondary small" type="button">Próxima</button></div>
        </section>
      </section>

      <section class="view" data-view="baskets">
        <div class="toolbar"><div class="search"><span>⌕</span><input id="basketSearch" type="search" placeholder="Buscar cesta"></div><button id="newBasketButton" class="button primary" type="button">Nova cesta</button></div>
        <section class="panel"><div class="panel-head"><div><div class="eyebrow">Vitrine</div><h2>Cestas básicas</h2></div><span id="basketSummary" class="muted"></span></div><div id="basketRows" class="basket-grid"></div></section>
      </section>

      <section class="view" data-view="customers">
        <div class="toolbar"><div class="search"><span>⌕</span><input id="customerSearch" type="search" placeholder="Buscar nome, telefone ou CPF"></div><button id="newCustomerButton" class="button primary" type="button">Novo cliente</button></div>
        <section class="panel table-panel"><div class="table-summary"><strong id="customerCount">0 clientes</strong><span id="customerPage"></span></div><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>CPF/CNPJ</th><th>Compras</th><th></th></tr></thead><tbody id="customerRows"></tbody></table></div><div class="pager"><button id="prevCustomers" class="button secondary small" type="button">Anterior</button><button id="nextCustomers" class="button secondary small" type="button">Próxima</button></div></section>
      </section>
    </main>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop hidden"></div>
<section id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <header><div><div id="modalEyebrow" class="eyebrow">Editar</div><h2 id="modalTitle"></h2></div><button id="modalClose" class="icon" type="button" aria-label="Fechar">×</button></header>
  <div id="modalBody" class="modal-body"></div>
  <footer id="modalFooter"></footer>
</section>
<div id="toastRegion" class="toasts" aria-live="polite"></div>

<script src="./config.js?v=20260911-v3"></script>
<script src="./app-lite.js?v=20260912-v4"></script>
</body>
</html>
