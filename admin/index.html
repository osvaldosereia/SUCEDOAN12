<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Dona Antônia · Admin</title>
  <link rel="stylesheet" href="/admin-v3/styles.css?v=20260911-2">
  <link rel="stylesheet" href="/admin-v3/products-inline-controls-v4.css?v=20260912-1">
</head>
<body>
  <header class="topbar">
    <button id="menuButton" class="menu-button" type="button" aria-label="Abrir menu">☰</button>
    <a class="brand" href="#dashboard"><img src="../img/logoantonia5.png" alt="" width="44" height="44"><span><strong>Dona Antônia</strong><b>Admin</b></span></a>
    <a class="view-storefront" href="../comprar/" target="_blank" rel="noopener">Abrir Comprar</a>
  </header>

  <div class="admin-layout">
    <aside id="sidebar" class="sidebar" aria-label="Menu principal">
      <nav>
        <button type="button" data-route="dashboard">Início</button>
        <a href="../comprar/" target="_blank" rel="noopener">Comprar</a>
        <button type="button" data-route="baskets">Cestas</button>
        <button type="button" data-route="products">Produtos</button>
        <a href="/admin-v3/nomes-produtos-v3.html">Nomes dos produtos</a>
        <a href="/admin-v3/imagens-ia.html">Imagens IA</a>
        <button type="button" data-route="categories">Categorias</button>
        <button type="button" data-route="orders">Pedidos</button>
        <button type="button" data-route="customers">Clientes</button>
        <a href="/admin-v3/atendimento.html">Atendimento</a>
        <a href="../contagem/">Balanço rápido</a>
        <button id="commercialTruthNav" class="nav hidden" type="button" hidden aria-hidden="true">Central comercial</button>
        <button id="logisticsNav" class="nav hidden" type="button" hidden aria-hidden="true">Logística</button>
      </nav>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>
    <main id="app" class="content" tabindex="-1"></main>
    <section id="commercialTruthMount" hidden aria-hidden="true"></section>
    <section id="logisticsMount" hidden aria-hidden="true"></section>
    <section id="automationBuilderMount" hidden aria-hidden="true"></section>
  </div>

  <dialog id="editorDialog" class="editor-dialog"><div id="editorBody"></div></dialog>
  <div id="toastRegion" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="noscript">Ative o JavaScript para usar o Admin.</div></noscript>

  <script src="./config.js?v=20260915-1"></script>
  <script>
    if(window.DA_ADMIN_V3_CONFIG?.commercialTruthUiEnabled){import('/admin-v3/commercial-truth.js')}
    if(window.DA_ADMIN_V3_CONFIG?.logisticsUiEnabled){import('/admin-v3/logistics.js')}
    if(window.DA_ADMIN_V3_CONFIG?.automationBuilderUiEnabled){import('/admin-v3/automation-builder.js')}
  </script>
  <script type="module" src="/admin-v3/comprar-ui.js?v=20260914-1"></script>
  <script type="module" src="/admin-v3/app.js?v=20260912-4"></script>
  <script type="module" src="/admin-v3/orders-integrated-v2.js?v=20260915-1"></script>
  <script type="module" src="/admin-v3/products-inline-controls-v4.js?v=20260912-1"></script>
  <script type="module" src="/admin-v3/nav-fix.js?v=20260911-3"></script>
  <script type="module" src="/admin-v3/basket-editor.js?v=20260911-2"></script>
</body>
</html>
