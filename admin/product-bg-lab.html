<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório de Recorte · Dona Antônia</title><style>
*{box-sizing:border-box}body{margin:0;background:#101116;color:#f5f5f7;font:14px system-ui}header{padding:16px;position:sticky;top:0;background:#101116ee;backdrop-filter:blur(12px);z-index:4;border-bottom:1px solid #292b33}header b{display:block;font-size:16px}header small{color:#969ba6}main{max-width:1100px;margin:auto;padding:14px}.tools{background:#191b21;border:1px solid #30323a;border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:sticky;top:70px;z-index:3}label{display:grid;gap:6px;color:#c5c8cf;font-size:12px}input{width:100%;accent-color:white}.key{display:flex;align-items:center;gap:8px}.key i{width:26px;height:26px;border-radius:7px;border:1px solid #555}.actions{display:flex;gap:8px;grid-column:1/-1}button{border:0;border-radius:10px;background:#292c35;color:#fff;padding:11px 14px;font-weight:700}.primary{background:#f5f5f7;color:#111}.status{color:#9ba0aa}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}.card{background:#181a20;border:1px solid #2d3038;border-radius:16px;overflow:hidden}.card h3{font-size:12px;padding:10px 12px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#333}.pane{position:relative;aspect-ratio:1;background:#e8e8e8;display:grid;place-items:center;overflow:hidden}.pane:after{content:attr(data-label);position:absolute;top:7px;left:7px;background:#111c;color:#fff;padding:4px 6px;border-radius:6px;font-size:9px}.pane img,.pane canvas{max-width:94%;max-height:94%;object-fit:contain}.checker{background-color:#eee;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}.meta{padding:8px 12px;color:#8f949f;font-size:10px}.bad{outline:2px solid #ff5252}.ok{outline:2px solid #5de287}@media(max-width:700px){.tools{grid-template-columns:1fr 1fr;top:60px}.cards{grid-template-columns:1fr}.compare{grid-template-columns:1fr 1fr}main{padding:8px}.tools{padding:10px}}
</style></head><body><header><b>RECORTE DE PRODUTOS · LAB</b><small>Homologação — não altera imagens oficiais</small></header><main><section class="tools">
<label>Tolerância <output id="tolOut">34</output><input id="tol" type="range" min="8" max="80" value="34"></label>
<label>Neutralidade <output id="neuOut">34</output><input id="neu" type="range" min="10" max="80" value="34"></label>
<label>Suavização <output id="softOut">2 px</output><input id="soft" type="range" min="0" max="6" value="2"></label>
<label>Fundo detectado <span class="key"><i id="key"></i><code id="rgb">—</code></span></label>
<div class="actions"><button class="primary" id="load">Carregar amostra</button><button id="rerun">Reprocessar</button><span class="status" id="status"></span></div>
</section><section class="cards" id="cards"></section></main><script src="config.js"></script><script src="product-bg-lab.js?v=1"></script></body></html>
