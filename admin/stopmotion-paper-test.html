<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stop Motion Lab · Dona Antônia</title><link rel="stylesheet" href="stopmotion-paper-test.css?v=5"></head><body>
<header><div><b>STOP MOTION LAB</b><small>Dona Antônia · vídeo vertical 10 s</small></div><span class="pill">9:16</span></header>
<main>
<section class="preview"><canvas id="stage" width="540" height="960"></canvas><div class="progress"><i id="bar"></i></div><button id="play" class="primary">▶ Assistir 10 s</button><p id="status">Preparando produtos…</p></section>
<section class="controls">
<details open><summary>Produtos</summary><div class="grid">
<label>Quantidade<select id="count"><option>10</option><option selected>15</option><option>20</option><option>25</option><option>30</option></select></label>
<label>Visual<select id="cutout"><option value="cut" selected>Recortado sem fundo</option><option value="paper">Papel recortado</option><option value="original">Original</option></select></label>
<label class="wide">Tamanho <output id="sizeOut">82%</output><input id="productSize" type="range" min="45" max="115" value="82"></label>
<label class="wide">Troca dos produtos <output id="prodOut">650 ms</output><input id="productSpeed" type="range" min="250" max="1500" step="50" value="650"></label>
</div><button id="shuffle">↻ Sortear produtos</button></details>
<details open><summary>Cores</summary><div id="palettes" class="paletteList"></div><label>Troca do fundo <output id="bgOut">180 ms</output><input id="bgSpeed" type="range" min="80" max="700" step="20" value="180"></label></details>
<details open><summary>Elementos animados</summary><div class="grid"><label>Quantidade<select id="elementLevel"><option value="0">Nenhum</option><option value="1">Discreto</option><option value="2" selected>Médio</option><option value="3">Intenso</option><option value="4">Automático</option></select></label><label>Estilo<select id="elementStyle"><option value="mix" selected>Misturar</option><option value="spark">Brilhos</option><option value="geo">Formas</option><option value="motion">Movimento</option><option value="celebrate">Celebração</option></select></label></div><div id="elementChips" class="chips"></div><small>Toque numa categoria para ativar/desativar. A configuração vale para o vídeo inteiro.</small></details>
<details><summary>Som</summary><div class="grid"><label>Trilha<select id="track"><option value="pop">Pop percussivo</option><option value="paper">Clicks</option><option value="none">Sem trilha</option></select></label><label class="check"><input id="sfx" type="checkbox" checked> Efeitos sonoros</label></div></details>
</section></main>
<script src="config.js"></script><script src="stopmotion-paper-test.js?v=5"></script></body></html>
