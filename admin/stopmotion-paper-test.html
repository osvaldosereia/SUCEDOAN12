<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stop Motion Lab · Dona Antônia</title><link rel="stylesheet" href="stopmotion-paper-test.css?v=7"></head><body>
<header><div><b>STOP MOTION LAB</b><small>Dona Antônia · vídeo vertical 10 s</small></div><span class="pill">9:16</span></header>
<main>
<section class="preview"><canvas id="stage" width="540" height="960"></canvas><div class="progress"><i id="bar"></i></div><button id="play" class="primary">▶ Assistir 10 s</button><p id="status">Preparando produtos…</p></section>
<section class="controls">
<details open><summary>Produtos</summary><div class="grid">
<label>Quantidade<select id="count"><option>10</option><option selected>15</option><option>20</option><option>25</option><option>30</option></select></label>
<label>Produto<select id="cutout"><option value="graycut" selected>Recorte do fundo cinza</option><option value="original">Foto original</option></select></label>
<label class="wide">Tamanho <output id="sizeOut">82%</output><input id="productSize" type="range" min="45" max="115" value="82"></label>
<label class="wide">Troca dos produtos <output id="prodOut">650 ms</output><input id="productSpeed" type="range" min="250" max="1500" step="50" value="650"></label>
</div><button id="shuffle">↻ Sortear produtos</button></details>
<details open><summary>Fundo e Pattern</summary><div id="palettes" class="paletteList"></div><div class="grid"><label>Pattern<select id="pattern"><option value="auto" selected>Automático</option><option value="dots">Bolinhas</option><option value="stripes">Listras</option><option value="waves">Ondas</option><option value="confetti">Confete geométrico</option><option value="grid">Grade viva</option></select></label><label>Densidade <output id="densityOut">40%</output><input id="density" type="range" min="10" max="90" value="40"></label><label>Movimento <output id="motionOut">45%</output><input id="motion" type="range" min="0" max="100" value="45"></label><label>Escala <output id="patternSizeOut">50%</output><input id="patternSize" type="range" min="20" max="100" value="50"></label></div></details><details open><summary>Elementos animados</summary><div class="grid"><label>Quantidade<select id="elementLevel"><option value="0">Nenhum</option><option value="1">Discreto</option><option value="2" selected>Médio</option><option value="3">Intenso</option><option value="4">Automático</option></select></label><label>Estilo<select id="elementStyle"><option value="mix" selected>Misturar</option><option value="spark">Brilhos</option><option value="geo">Formas</option><option value="motion">Movimento</option><option value="celebrate">Celebração</option></select></label></div><div id="elementChips" class="chips"></div><small>Toque numa categoria para ativar/desativar. A configuração vale para o vídeo inteiro.</small></details>

</section></main>
<script src="config.js"></script><script src="stopmotion-paper-test.js?v=7"></script></body></html>
