<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Conexão Marketing · Dona Antônia</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173f2a;background:#f6f3ea}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:520px;background:#fff;border:1px solid #e3e6e3;border-radius:24px;padding:28px;box-shadow:0 16px 50px rgba(18,49,34,.08)}
    h1{font-size:22px;margin:0 0 10px}p{color:#5f6a65;line-height:1.55;margin:0}.ok{color:#176b43}.error{color:#a12c25}
  </style>
</head>
<body>
<main>
  <h1 id="title">Concluindo conexão…</h1>
  <p id="message">Você já pode voltar ao Admin da Dona Antônia.</p>
</main>
<script>
(()=>{
  const params=new URLSearchParams(location.search);
  const payload={
    type:'marketing-oauth-callback',
    code:params.get('code')||'',
    state:params.get('state')||'',
    error:params.get('error')||'',
    error_description:params.get('error_description')||params.get('error_reason')||''
  };
  history.replaceState({},document.title,location.pathname);
  const title=document.getElementById('title'),message=document.getElementById('message');
  if(payload.error){title.textContent='Conexão não concluída';title.className='error';message.textContent=payload.error_description||'A autorização foi cancelada ou recusada.'}
  else if(!payload.code||!payload.state){title.textContent='Retorno inválido';title.className='error';message.textContent='Não recebemos os dados necessários da autorização.'}
  else{title.textContent='Autorização recebida';title.className='ok';message.textContent='Voltando ao Admin para descobrir suas contas…'}
  if(window.opener&&!window.opener.closed){
    window.opener.postMessage(payload,location.origin);
    setTimeout(()=>window.close(),700);
  }
})();
</script>
</body>
</html>
