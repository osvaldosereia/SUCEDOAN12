<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Dona Antônia · Pedidos</title>
  <link rel="stylesheet" href="/admin-v3/styles.css?v=20260911-2">
  <link rel="stylesheet" href="/admin-v3/pedidos-v2.css?v=20260915-2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./#dashboard"><img src="../img/logoantonia5.png" alt="" width="44" height="44"><span><strong>Dona Antônia</strong><b>Admin</b></span></a>
    <a class="view-storefront" href="../comprar/" target="_blank" rel="noopener">Abrir Comprar</a>
  </header>
  <div class="admin-layout">
    <aside class="sidebar" aria-label="Menu principal">
      <nav>
        <a href="./#dashboard">Início</a>
        <a href="../comprar/" target="_blank" rel="noopener">Comprar</a>
        <a href="./#baskets">Cestas</a>
        <a href="./#products">Produtos</a>
        <a href="/admin-v3/nomes-produtos-v3.html">Nomes dos produtos</a>
        <a href="./imagens-ia.html">Imagens IA</a>
        <a href="./#categories">Categorias</a>
        <a class="active" href="./pedidos.html">Pedidos</a>
        <a href="./#customers">Clientes</a>
        <a href="/admin-v3/atendimento.html">Atendimento</a>
        <a href="../contagem/">Balanço rápido</a>
      </nav>
    </aside>
    <main class="content orders-page">
      <div class="page-head"><div><h1>Pedidos</h1><p>Pedidos mais recentes do Comprar, com cliente, pagamento e dados para conferência.</p></div><div class="page-actions"><button id="refreshOrders" class="secondary" type="button">Atualizar</button></div></div>
      <form id="filterForm" class="toolbar orders-toolbar">
        <div class="search"><input name="q" type="search" placeholder="Buscar pedido ou telefone"></div>
        <select name="source" aria-label="Origem"><option value="">Todas as origens</option><option value="shopping_room">Comprar</option><option value="storefront_v2">Vitrine antiga</option></select>
        <select name="status" aria-label="Status"><option value="">Todos os status</option><option value="confirmed">Confirmado</option><option value="storefront_received">Recebido</option><option value="sent_to_bling">Enviado ao Bling</option><option value="processing">Em processamento</option><option value="ready">Pronto</option><option value="out_for_delivery">Em entrega</option><option value="delivered">Entregue</option><option value="cancelled">Cancelado</option></select>
        <button class="primary" type="submit">Buscar</button>
      </form>
      <section class="panel">
        <div class="orders-meta"><span id="pageInfo" class="muted"></span><div class="pagination"><button id="prevPage" class="secondary" type="button">Anterior</button><button id="nextPage" class="secondary" type="button">Próxima</button></div></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Pedido</th><th>Data</th><th>Cliente</th><th>Telefone</th><th>Total</th><th>Pagamento</th><th>Status</th><th>Ações</th></tr></thead><tbody id="orderRows"></tbody></table></div>
      </section>
    </main>
  </div>
  <dialog id="orderDialog" class="editor-dialog"><div id="orderDialogBody"></div></dialog>
  <div id="toastRegion" class="toasts" aria-live="polite"></div>
  <script type="module" src="/admin-v3/pedidos-v2.js?v=20260915-2"></script>
</body>
</html>
