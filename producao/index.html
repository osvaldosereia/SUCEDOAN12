<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Dona Antônia — Admin Oficial</title>
  <script>
    try {
      const key = 'da_admin_v2_config';
      const current = JSON.parse(localStorage.getItem(key) || '{}');
      localStorage.setItem(key, JSON.stringify({
        ...current,
        writeMode: true,
        stockWriteMode: true,
        collectionsWriteMode: true,
        offerWriteMode: true,
        githubBranch: 'main'
      }));
      localStorage.setItem('da_admin_v2_producao_oficial_20260724_v1', '1');
    } catch (error) {
      console.warn('Não foi possível preparar o modo oficial:', error);
    }
    const target = new URL('../producao-v2/', window.location.href);
    const params = new URLSearchParams(window.location.search);
    params.set('versao', 'oficial-20260724-3');
    target.search = params.toString();
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</head>
<body>
  <p>Abrindo o novo Admin Dona Antônia…</p>
  <p><a href="../producao-v2/?versao=oficial-20260724-3">Continuar</a></p>
</body>
</html>
