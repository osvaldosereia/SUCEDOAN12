<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Dona Antônia</title>
  <script>
    (function(){
      var match=location.pathname.match(/^\/catalogo_(\d{4})\/?$/i);
      if(match){
        location.replace('/?catalogo='+encodeURIComponent(match[1]));
        return;
      }
      location.replace('/');
    })();
  </script>
</head>
<body></body>
</html>
