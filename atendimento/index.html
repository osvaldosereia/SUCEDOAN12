<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f58220" />
  <title>Atendimento | Dona Antônia</title>
  <meta name="description" content="Escolha, personalize e envie seu pedido pelo WhatsApp." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Dona Antônia">
      <img src="/img/logoantonia5.png" alt="Dona Antônia" />
    </a>
    <button id="resetCart" class="ghost" type="button">Recomeçar</button>
  </header>

  <main>
    <section id="basketGridScreen" class="screen">
      <h1>Cestas</h1>
      <div id="basketGrid" class="grid-cards"></div>
    </section>

    <section id="basketEditScreen" class="screen" hidden>
      <article class="basket-hero">
        <img id="basketImage" alt="" />
        <div class="hero-info">
          <h1 id="basketTitle">Cesta</h1>
          <strong id="basketPrice">R$ 0,00</strong>
        </div>
      </article>
      <div id="basketItems" class="item-list" aria-live="polite"></div>
    </section>

    <section id="productsScreen" class="screen" hidden>
      <h1 id="productsTitle">Produtos</h1>
      <div id="categoryGrid" class="grid-cards"></div>
      <div id="productGrid" class="grid-cards products"></div>
    </section>
  </main>

  <div class="bottom-bar">
    <div>
      <small id="bottomLabel">Pedido</small>
      <strong id="bottomTotal">R$ 0,00</strong>
    </div>
    <button id="sendWhatsapp" class="whatsapp" type="button">Enviar no WhatsApp</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
