<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Dona Antônia</title>
  <link rel="icon" href="/img/logoantonia5.png" />
  <link rel="stylesheet" href="./styles.css?v=20260906-navlazy" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Início do atendimento Dona Antônia"><img src="/img/logoantonia5.png" alt="Dona Antônia" width="160" height="44" /></a>
    <button id="resetCart" class="ghost" type="button">Recomeçar</button>
  </header>

  <main>
    <form class="search-bar" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Buscar cestas, ofertas e produtos" autocomplete="off" aria-label="Buscar cestas, ofertas e produtos" />
      <button id="clearSearch" type="button" aria-label="Limpar busca" hidden>×</button>
    </form>

    <section id="basketMode">
      <div id="detailNav" class="detail-nav" hidden></div>
      <article class="basket-hero">
        <div class="basket-image-wrap"><img id="basketImage" class="basket-image" alt="" decoding="async" /></div>
        <div class="basket-title-row"><h1 id="basketTitle">Cesta</h1><strong id="basketPrice">R$ 0,00</strong></div>
      </article>
      <section class="section"><h2>Itens da cesta</h2><div id="basketItems" class="basket-items"></div></section>
    </section>

    <section id="offersMode" class="section" hidden>
      <div id="categoryTabs" class="chips"></div>
      <div id="offersList" class="offer-grid"></div>
    </section>

    <section class="summary">
      <div id="summaryItems" class="summary-items"></div>
      <div class="total-row"><span>Total</span><strong id="grandTotal">R$ 0,00</strong></div>
    </section>
  </main>

  <div class="bottom-bar"><strong id="bottomTotal">R$ 0,00</strong><button id="sendWhatsapp" class="whatsapp" type="button">Enviar no WhatsApp</button></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=20260906-navlazy"></script>
</body>
</html>
