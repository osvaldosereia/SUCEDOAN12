<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Abrindo ofertas | Dona Antônia</title>
  <link rel="icon" href="../img/logoantonia5.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;font-family:Arial,sans-serif;color:#222}.box{width:min(430px,100%);text-align:center}.logo{width:170px;max-width:65%;height:auto}.spinner{width:42px;height:42px;margin:28px auto 16px;border:4px solid #e5e7eb;border-top-color:#128c4a;border-radius:50%;animation:spin .8s linear infinite}.box h1{font-size:22px;margin:0 0 8px}.box p{margin:0;color:#667085;line-height:1.5}.error{padding:18px;border:1px solid #fecaca;border-radius:16px;background:#fff7f7}.error a{display:inline-flex;margin-top:16px;padding:12px 16px;border-radius:12px;background:#128c4a;color:#fff;text-decoration:none;font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box" id="status">
    <img class="logo" src="../img/logoantonia5.png" alt="Dona Antônia">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Abrindo suas ofertas</h1>
    <p>Estamos validando o link e preparando o mini catálogo.</p>
  </main>
  <script>
  (() => {
    'use strict';
    const CONFIG_URL = '../site/mini-catalogo-links.json';
    const status = document.getElementById('status');
    const code = decodeURIComponent((location.hash || '').replace(/^#\/?/, '')).trim().toUpperCase();

    function fallbackShortCode(token) {
      return String(token || '').replace(/[^a-z0-9]/gi, '').slice(0, 7).toUpperCase();
    }

    function normalizeShortCode(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 32)
        .replace(/-+$/g, '');
    }

    function destinationHash(campaign) {
      const destination = campaign.destination || {};
      const type = String(destination.type || campaign.tipo || 'home').toLowerCase();
      const value = String(destination.value || campaign.destino || '').trim();
      if (type === 'offers') return '#/ofertas';
      if (type === 'category') return `#/categoria/${encodeURIComponent(value)}`;
      if (type === 'search') return `#/busca/${encodeURIComponent(value)}`;
      if (type === 'product') return `#/produto/${encodeURIComponent(value)}`;
      if (type === 'categories') return '#/categorias';
      return '#/';
    }

    function showError(message) {
      status.className = 'box error';
      status.innerHTML = `<img class="logo" src="../img/logoantonia5.png" alt="Dona Antônia"><h1>Link não encontrado</h1><p>${message}</p><a href="../complemente/#/">Ver ofertas disponíveis</a>`;
    }

    async function start() {
      if (!code) {
        showError('Este link curto está incompleto.');
        return;
      }
      try {
        const response = await fetch(`${CONFIG_URL}?t=${Date.now()}`, { cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const campaigns = Array.isArray(data) ? data : Array.isArray(data.campaigns) ? data.campaigns : [];
        const campaign = campaigns.find(item => {
          const codes = [item.shortCode || item.short_code || fallbackShortCode(item.token), ...(Array.isArray(item.aliases) ? item.aliases : [])];
          return codes.some(value => normalizeShortCode(value) === normalizeShortCode(code));
        });
        if (!campaign?.id || !campaign?.token) {
          showError('O endereço pode ter sido digitado incorretamente ou a campanha foi removida.');
          return;
        }
        const reference = encodeURIComponent(`${campaign.id}.${campaign.token}`);
        location.replace(`../complemente/${destinationHash(campaign)}?c=${reference}`);
      } catch (error) {
        console.error(error);
        showError('Não foi possível validar este link agora. Tente novamente.');
      }
    }

    start();
  })();
  </script>
</body>
</html>
