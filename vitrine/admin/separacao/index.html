<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f7f8f7">
  <title>Separação do pedido · Dona Antônia</title>
  <style>
    :root{--ink:#18221c;--muted:#66716a;--line:#e3e8e4;--soft:#f5f7f5;--brand:#176b43;--brand2:#0f5836;--danger:#9d2235;--danger-bg:#fff1f0;--warn:#8a5d09;--warn-bg:#fff7e6}
    *{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.wrap{width:min(100%,1100px);margin:auto;padding:14px 12px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.logo{width:82px;height:42px;object-fit:contain}.top-copy{flex:1}.top-copy strong{display:block;font-size:19px}.top-copy small{color:var(--muted)}.back{border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;border-radius:10px;padding:10px 12px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.hero h1{font-size:22px;margin:0}.muted{color:var(--muted)}.badge{display:inline-flex;border-radius:999px;background:#edf5f0;color:#135938;padding:6px 9px;font-size:11px;font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.summary-box{background:var(--soft);border-radius:11px;padding:9px}.summary-box small{display:block;color:var(--muted);font-size:10px}.summary-box strong{display:block;margin-top:2px;font-size:15px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:9px;background:#fff;display:flex;flex-direction:column;min-width:0}.item.separated{border-color:#a8d6ba;background:#f7fcf8}.item.missing{border-color:#efb9b4;background:#fff8f7}.item img,.placeholder{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:10px}.placeholder{background:var(--soft)}.item-name{font-weight:850;margin-top:8px;line-height:1.25}.item-meta{color:var(--muted);font-size:11px;margin-top:3px}.item-price{font-size:12px;font-weight:800;margin-top:5px}.state-label{display:inline-flex;width:max-content;margin-top:8px;border-radius:999px;padding:5px 8px;background:#f0f2f0;color:#59625c;font-size:10px;font-weight:900}.item.separated .state-label{background:#e3f2e8;color:#145b38}.item.missing .state-label{background:#fde8e5;color:var(--danger)}.item-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto;padding-top:10px}.state-btn{min-height:42px;border-radius:10px;font-size:11px;font-weight:900}.state-btn.separated{border:1px solid #8fc5a5;background:#fff;color:#145b38}.state-btn.missing{border:1px solid #e4a49f;background:#fff;color:var(--danger)}.state-btn.separated.active{background:var(--brand);border-color:var(--brand);color:#fff}.state-btn.missing.active{background:var(--danger);border-color:var(--danger);color:#fff}.state-btn:disabled{opacity:.55;cursor:wait}.complete-card{position:sticky;bottom:8px;box-shadow:0 10px 35px rgba(0,0,0,.12)}.complete-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}.complete-summary div{background:var(--soft);border-radius:10px;padding:9px}.complete-summary small{display:block;color:var(--muted);font-size:10px}.complete-summary strong{font-size:15px}.complete{width:100%;min-height:50px;border:0;border-radius:11px;background:var(--brand);color:#fff;font-weight:950}.complete:hover{background:var(--brand2)}.complete:disabled{opacity:.6;cursor:wait}.notice{border-radius:11px;padding:10px 11px;margin-top:10px;background:var(--warn-bg);color:var(--warn);font-weight:750}.notice.error{background:var(--danger-bg);color:var(--danger)}.empty{text-align:center;padding:40px 16px;color:var(--muted)}
    @media(min-width:760px){.items{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:650px){.hero{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.complete-summary{grid-template-columns:1fr}.back{padding:8px 10px}.top-copy strong{font-size:17px}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><img class="logo" src="/img/logoantonia5.png" alt="Dona Antônia"><div class="top-copy"><strong>Separação do pedido</strong><small>Área operacional do Admin</small></div><a class="back" href="/vitrine/admin/">Voltar</a></header>
  <section class="card hero"><div><div class="muted">Pedido</div><h1 id="orderNumber">Carregando…</h1><div id="customer" class="muted"></div></div><span id="orderStatus" class="badge">Separação</span></section>
  <section id="summary" class="card summary" aria-live="polite"></section>
  <div id="notice" class="notice" hidden></div>
  <section class="card"><div id="items" class="items"><div class="empty">Carregando produtos…</div></div></section>
  <section id="completeCard" class="card complete-card" hidden>
    <div id="completeSummary" class="complete-summary"></div>
    <button id="completeSeparation" class="complete" type="button">CONCLUIR SEPARAÇÃO</button>
  </section>
</main>
<script src="./separation.js"></script>
</body></html>
