  function cuiabaDayKey(v){

    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Cuiaba',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
    const map=Object.fromEntries(parts.map(p=>[p.type,p.value]));

  function relativeAge(v){
    if(!v)return '';
    const ms=Date.now()-new Date(v).getTime();
    if(!Number.isFinite(ms)||ms<0)return '';
    const min=Math.floor(ms/60000);
    if(min<1)return 'agora';
    if(min<60)return 'há '+min+' min';
    const hours=Math.floor(min/60);
    if(hours<24)return 'há '+hours+' h';
    return 'há '+Math.floor(hours/24)+' d';
  }

    const payment=o?.payment_method_snapshot?.label||o?.payment_method_snapshot?.method||'';

  async function returnOrderToExpedition(id,fromDetail=false){
    const o=(fromDetail?state.currentOrder?.order:null)||state.orders.find(x=>x.id===id);
    if(!o||o.status!=='out_for_delivery'){toast('Este pedido não está mais em entrega');return}
    const choice=prompt(
      'Por que a entrega não foi concluída?\n\n1 - Cliente ausente\n2 - Endereço não encontrado\n3 - Cliente pediu reagendamento\n4 - Problema no pagamento\n5 - Veículo / rota\n6 - Outro\n\nDigite o número ou escreva o motivo:'
    );
    if(choice===null)return;
    const value=String(choice||'').trim();
    const reasons={
      '1':'Cliente ausente',
      '2':'Endereço não encontrado',
      '3':'Cliente pediu reagendamento',
      '4':'Problema no pagamento',
      '5':'Veículo / rota',
      '6':'Outro'
    };
    const reason=reasons[value]||value;
    if(!reason){toast('Informe o motivo da entrega não concluída');return}
    const noteInput=prompt('Observação opcional sobre a tentativa de entrega:', '');
    if(noteInput===null)return;
    const note=String(noteInput||'').trim();
    const ok=confirm('Registrar entrega não concluída por "'+reason+'"?\n\nO pedido voltará para Aguardando saída. O estoque continuará baixado.');
    if(!ok)return;
    try{
      await api('order_update',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:o.id,status:'ready',delivery_return_reason:reason,delivery_return_note:note})
      });
      if(fromDetail){
        const fresh=await api('order',{id:o.id});state.currentOrder=fresh;
        await loadCurrentOrderFiscal(false);
        paintOrderDetail();
        loadOrders();
      }else{
        const data=await api('orders');state.orders=data.orders||[];
        paintExpeditionBody();
      }
      toast('Pedido voltou para Aguardando saída · motivo registrado');
    }catch(e){toast(errorMessage(e.message))}
  }
  function returnCurrentOrderToExpedition(){
    const id=state.currentOrder?.order?.id;if(id)returnOrderToExpedition(id,true);
  }

  async function confirmDeliveryFromExpedition(id){
    const o=state.orders.find(x=>x.id===id);
    if(!o||o.status!=='out_for_delivery'){toast('Este pedido não está mais em entrega');return}
    const name=o.customer_name||'Cliente';
    const payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'Pagamento não informado';
    const ok=confirm('Confirmar entrega do pedido #'+shortOrder(o.order_number)+'?\n\n'+name+' · '+money(o.total_cents)+' · '+payment);
    if(!ok)return;
    const btn=document.querySelector('[data-confirm-delivery="'+CSS.escape(id)+'"]');
    if(btn){btn.disabled=true;btn.textContent='Confirmando…'}
    try{
      await api('order_update',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id,status:'delivered'})
      });
      let paymentConfirmed=false;
      const confirmPayment=confirm('Entrega confirmada.\n\nO pagamento de '+money(o.total_cents)+' via '+payment+' também foi recebido?\n\nOK = confirmar recebimento agora.\nCancelar = deixar pagamento pendente no Fechamento.');
      if(confirmPayment){
        try{
          state.fiscalByOrder[id]=await api('order_fiscal_confirm_payment',{},{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id,payment_method:payment})
          });
          paymentConfirmed=true;
        }catch(e){
          delete state.fiscalByOrder[id];
        }
      }else{
        delete state.fiscalByOrder[id];
      }
      const data=await api('orders');state.orders=data.orders||[];
      paintExpeditionBody();
      toast(paymentConfirmed?'Entrega e recebimento confirmados':'Entrega confirmada · pagamento pendente no Fechamento');
    }catch(e){
      toast(errorMessage(e.message));
      if(btn){btn.disabled=false;btn.textContent='Confirmar entrega'}
    }
  }

  function dispatchPaymentSummary(rows){
    const map=new Map();
    for(const o of rows||[]){
      const label=String(o?.payment_method_snapshot?.label||o?.payment_method_snapshot?.method||'Não informado').trim()||'Não informado';
      map.set(label,(map.get(label)||0)+Number(o?.total_cents||0));
    }
    return [...map.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt-BR'));
  }
  function dispatchPaymentSummaryText(rows){
    return dispatchPaymentSummary(rows).map(([label,total])=>label+': '+money(total)).join(' · ');
  }

  async function bulkDispatchSelected(){
    const selected=state.orders.filter(o=>o.status==='ready'&&fiscalAuthorizedForDispatch(o)&&state.expeditionSelected.includes(o.id));
    if(!selected.length){toast('Selecione ao menos um pedido pronto');return}

    if(!confirm('Marcar '+selected.length+' pedido(s) como saiu para entrega?\n\nTotal da saída: '+money(total)))return;
    const btn=$('#bulkDispatchBtn');if(btn){btn.disabled=true;btn.textContent='Atualizando…'}
    let ok=0;const failed=[];
    for(const o of selected){
      try{
        await api('order_update',{},{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:o.id,status:'out_for_delivery'})
        });
        ok++;
        state.expeditionSelected=state.expeditionSelected.filter(id=>id!==o.id);
      }catch(e){failed.push('#'+shortOrder(o.order_number))}

  function fiscalClosureLabel(f){
    if(!f||f.error)return {title:'Verificar',detail:'Controle fiscal indisponível',kind:'warn'};
    if(f.payment_status!=='confirmed')return {title:'Pagamento pendente',detail:'Confirmar recebimento',kind:'warn'};
    if(f.fiscal_status==='issued'||f.bling_invoice_id)return {title:'Concluído',detail:f.bling_invoice_number?'NF-e '+f.bling_invoice_number:'Fiscal concluído',kind:'ok'};
    if(f.fiscal_status==='review_required')return {title:'Precisa de revisão',detail:f.fiscal_block_reason?fiscalBlockReasonLabel(f.fiscal_block_reason):'Revisar fiscal',kind:'warn'};
    if(f.fiscal_status==='ready')return {title:'Fiscal pronto',detail:f.config?.send_enabled?'Pronto para emissão':'Emissão permanece desligada',kind:'ok'};
    return {title:'Fiscal bloqueado',detail:f.fiscal_block_reason?fiscalBlockReasonLabel(f.fiscal_block_reason):'Aguardando requisitos',kind:'warn'};
  }
  function closureBucket(o){
    const f=state.fiscalByOrder[o.id];
    if(!f||f.error)return 'fiscal';
    if(f.payment_status!=='confirmed')return 'payment';
    if(f.fiscal_status==='issued'||f.bling_invoice_id)return 'complete';
    return 'fiscal';
  }
  function closurePriority(o){
    const f=state.fiscalByOrder[o.id],label=fiscalClosureLabel(f);
    if(label.title==='Pagamento pendente')return 0;
    if(label.title==='Precisa de revisão'||label.title==='Verificar')return 1;
    if(label.title==='Fiscal pronto'||label.title==='Fiscal bloqueado')return 2;
    return 3;
  }
  function closureRow(o){
    const f=state.fiscalByOrder[o.id],label=fiscalClosureLabel(f);
    const cls=label.kind==='ok'?'ok-text':'warn-text';
    const canConfirmPayment=o.status==='delivered'&&f&&!f.error&&f.payment_status!=='confirmed';
    return '<div class="closure-row">'+
      '<div><strong>#'+esc(shortOrder(o.order_number))+'</strong><span class="sub">'+esc(dateTime(o.delivered_at))+'</span></div>'+
      '<div class="history-main"><strong>'+esc(o.customer_name||'Sem cliente')+'</strong><small>'+esc(o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'Pagamento não informado')+'</small></div>'+
      '<strong>'+money(o.total_cents)+'</strong>'+
      '<div class="closure-status"><strong class="'+cls+'">'+esc(label.title)+'</strong><small>'+esc(label.detail)+'</small></div>'+
      '<div class="dispatch-actions">'+
        (canConfirmPayment?'<button class="quick-link primary-link" type="button" data-closure-payment="'+esc(o.id)+'">Confirmar recebimento</button>':'')+
        '<button class="text" type="button" data-closure-order="'+esc(o.id)+'">Abrir</button>'+
      '</div>'+
    '</div>';
  }
  async function confirmClosurePayment(id){
    const o=state.closureOrders.find(x=>x.id===id)||state.orders.find(x=>x.id===id);
    const f=state.fiscalByOrder[id];
    if(!o||o.status!=='delivered'||!f||f.error||f.payment_status==='confirmed'){
      toast('Este recebimento não está mais pendente');return;
    }
    const payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'Pagamento não informado';
    if(!confirm('Confirmar recebimento de '+money(o.total_cents)+' via '+payment+'?\n\nPedido #'+shortOrder(o.order_number)))return;
    const btn=document.querySelector('[data-closure-payment="'+CSS.escape(id)+'"]');
    if(btn){btn.disabled=true;btn.textContent='Confirmando…'}
    try{
      state.fiscalByOrder[id]=await api('order_fiscal_confirm_payment',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id,payment_method:payment})
      });
      renderClosure();
      toast(state.fiscalByOrder[id]?.fiscal_status==='ready'?'Recebimento confirmado · fiscal pronto':'Recebimento confirmado');
    }catch(e){
      toast(errorMessage(e.message));
      if(btn){btn.disabled=false;btn.textContent='Confirmar recebimento'}
    }
  }
  async function loadFiscalForOrders(rows){
    const queue=(rows||[]).filter(o=>!state.fiscalByOrder[o.id]);
    let cursor=0;
    async function worker(){
      while(cursor<queue.length){
        const o=queue[cursor++];
        if(state.fiscalByOrder[o.id])continue;
        try{
          state.fiscalByOrder[o.id]=await api('order_fiscal_status',{},{
            method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id})
          });
        }catch(e){

  function blingOperationalIssues(b){
    const issues=[];
    const cred=b?.credentials||{},domains=b?.domains||{},queue=b?.hub_queue||{},orderLinks=b?.order_links||{};
    if(cred.ready===false)issues.push('Credenciais do Bling precisam de atenção');
    if(b?.hub_enabled===false)issues.push('Integração direta com o Bling está pausada');
    if(b?.hub_enabled!==false&&domains.orders===false)issues.push('Envio de pedidos ao Bling está pausado');
    const queueReview=Number(queue.review_required||0)+Number(queue.failed||0);
    if(queueReview>0)issues.push(queueReview+' item(ns) da fila precisam de revisão');
    const orderReview=Number(orderLinks.review_required||0);
    if(orderReview>0)issues.push(orderReview+' pedido(s) precisam de revisão no Bling');
    return [...new Set(issues)];
  }

  async function adminStepUp(){return await financeStepUp()}
  async function financeStepUp(){
    const existing=financeSessionToken();
    if(existing)return existing;
    if(state.financeAuthPromise)return await state.financeAuthPromise;
    state.financeAuthPromise=new Promise((resolve,reject)=>{
      financeOpenDialog('Acesso administrativo',
        '<div class="rule-notice warn"><strong>Confirmação de segurança</strong><div>Para acessar e alterar dados do Admin, confirme o PIN administrativo. A sessão fica restrita a esta aba e expira automaticamente.</div></div>'+
        '<form id="financePinForm" class="form-grid" autocomplete="off">'+
          '<label class="span-2"><span>PIN administrativo</span><input id="financePinInput" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="••••••" required></label>'+
          '<div class="span-2"><small class="sub" id="financePinStatus">A sessão fica somente nesta aba e expira automaticamente.</small></div>'+
        '</form>',
        '<button class="secondary" id="financePinCancel" type="button">Cancelar</button><button class="primary" id="financePinSubmit" type="button">Liberar Admin</button>'
      );
      const finish=(ok,value)=>{
        state.financeAuthPromise=null;
        if($('#editor')?.open)$('#editor').close();
        ok?resolve(value):reject(value);
      };
      $('#financePinCancel').onclick=()=>finish(false,new Error('finance_auth_cancelled'));
      const submit=async()=>{
        const pin=$('#financePinInput').value.trim(),button=$('#financePinSubmit'),status=$('#financePinStatus');
        if(!/^\d{6}$/.test(pin)){status.textContent='Digite os 6 números do PIN.';return}
        button.disabled=true;status.textContent='Validando…';
        try{
          const authRes=await fetch(FINANCE_AUTH_API,{
            method:'POST',
            headers:{'Content-Type':'application/json','apikey':FINANCE_PUBLIC_KEY},
            body:JSON.stringify({pin}),
            cache:'no-store'
          });
          const auth=await authRes.json().catch(()=>({}));
          if(!authRes.ok||!auth?.ok){
            if(authRes.status===429)throw new Error('Muitas tentativas. Aguarde antes de tentar novamente.');
            throw new Error(auth?.error==='invalid_pin'?'PIN inválido.':auth?.error||'Não foi possível validar o PIN.');
          }
          const verifyRes=await fetch(FINANCE_VERIFY_API,{
            method:'POST',
            headers:{'Content-Type':'application/json','apikey':FINANCE_PUBLIC_KEY},
            body:JSON.stringify({token_hash:auth.token_hash,type:auth.verification_type||'email'}),
            cache:'no-store'
          });
          const verified=await verifyRes.json().catch(()=>({}));
          const token=verified?.access_token||verified?.session?.access_token||'';
          if(!verifyRes.ok||!token)throw new Error(verified?.msg||verified?.error_description||verified?.error||'Não foi possível abrir a sessão financeira.');
          sessionStorage.setItem('da_finance_access_token_v1',token);
          finish(true,token);
        }catch(e){
          button.disabled=false;status.textContent=String(e?.message||'Não foi possível liberar o financeiro.');
          $('#financePinInput').value='';
          $('#financePinInput').focus();
        }
      };
      $('#financePinSubmit').onclick=submit;
      $('#financePinForm').onsubmit=e=>{e.preventDefault();submit()};
      setTimeout(()=>$('#financePinInput')?.focus(),0);
    });
    return await state.financeAuthPromise;
  }
  async function financeApi(operation,payload={},retryAuth=true){
    const token=await financeStepUp();
    const u=new URL(API);u.searchParams.set('action','bling_finance_action');
    const response=await fetch(u,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({operation,...payload}),
      cache:'no-store'
    });
    const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
    if(response.status===401&&retryAuth){
      clearFinanceSession();
      return await financeApi(operation,payload,false);
    }
    if(!response.ok||data.ok===false)throw new Error(data.error||'service_error');
    return data;
  }

  async function financeOverviewApi(token,retryAuth=true){
    const u=new URL(API);u.searchParams.set('action','bling_finance_overview');
    const response=await fetch(u,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:'{}',
      cache:'no-store'
    });
    const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
    if(response.status===401&&retryAuth){
      clearFinanceSession();
      return await financeOverviewApi(await financeStepUp(),false);
    }
    if(!response.ok||data.ok===false)throw new Error(data.error||'service_error');
    return data;
  }

    let token='';

        toast('Financeiro continua bloqueado');

    const content=$('#content');
    content.innerHTML='<div class="page-head"><div><h1>Financeiro · Bling</h1><p>Área protegida. Bling é a fonte oficial; inclusões, edições e baixas exigem prévia e confirmação humana.</p></div><div class="dispatch-actions"><button class="secondary" id="newPayable" type="button">+ A pagar</button><button class="secondary" id="newReceivable" type="button">+ A receber</button><button class="secondary" id="lockFinance" type="button">Bloquear financeiro</button><button class="secondary" id="refreshFinance">Atualizar</button></div></div>'+

    $('#refreshFinance').onclick=renderFinance;

  async function loadProducts(q='',append=false){
    const host=$('#productRows');if(!append)host.innerHTML='<div class="loading">Carregando…</div>';

      const data=await api('products',{

        subcategory:state.productFilters.subcategory,
        active:state.productFilters.active,
        offset,limit:60
      });
      state.products=append?[...state.products,...data.products]:data.products;
      state.productNext=data.next_offset;
      host.innerHTML=state.products.length?state.products.map(productRow).join(''):'<div class="empty">Nenhum produto encontrado com esses filtros.</div>';
      host.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>openProductEditor(state.products.find(p=>p.id===b.dataset.editProduct)));

      const more=$('#productMore');more.innerHTML=state.productNext!=null?'<button class="secondary" id="moreProducts">Mostrar mais</button>':'';
      if($('#moreProducts'))$('#moreProducts').onclick=()=>loadProducts(q,true);

  async function toggleProductActive(id,btn){
    const product=state.products.find(p=>p.id===id);
    if(!product)return;
    const next=product.active===false;
    const expired=Boolean(product.expiration_date&&String(product.expiration_date)<cuiabaDayKey(new Date()));
    if(next&&expired){
      toast('Produto vencido · corrija a validade antes de ativar');
      openProductEditor(product);
      return;
    }
    if(!next&&!confirm('Desativar "'+product.name+'"?\n\nEle sairá da vitrine e a validade deixará de entrar nos controles e ofertas automáticas enquanto estiver inativo.'))return;
    const operator=requireOperator();if(!operator)return;
    btn.disabled=true;
    try{
      const data=await api('product_save',{},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        id:product.id,name:product.name,sku:product.sku,gtin:product.gtin,
        sale_price_cents:Number(product.sale_price_cents||0),stock_quantity:Number(product.stock_quantity||0),
        expiration_date:product.expiration_date||null,
        auto_expiry_offer_enabled:product.auto_expiry_offer_enabled===true,
        category:product.category||'',subcategory:product.subcategory||'',packaging:product.packaging||'',
        image_url:product.image_url||'',description:product.description||'',active:next,operator
      })});
      const saved=data.product;
      if(next&&saved?.active===false&&saved?.deactivation_reason==='expired'){
        toast('Produto vencido · permanece inativo');
      }else{
        toast(next?'Produto ativado':'Produto desativado · fora da vitrine e das validades');
      }
      await loadProducts($('#productSearch')?.value.trim()||'',false);
    }catch(e){
      toast(errorMessage(e.message));
      btn.disabled=false;
    }
  }

    const offer=p?.offer||null;
    const manualOffer=offer&&offer?.metadata?.source!=='expiry_auto'?offer:null;
    const regular=Number(p?.sale_price_cents||0);
    const derivedDiscount=manualOffer&&regular>0?Math.max(0,Math.round((1-Number(manualOffer.sale_price_cents||0)/regular)*1000)/10):'';
    const offerDiscount=manualOffer?.metadata?.discount_percent??derivedDiscount;
    const offerPrice=manualOffer?((Number(manualOffer.sale_price_cents||0)/100).toFixed(2)).replace('.',','):'';
    const offerDuration=manualOffer?.metadata?.duration_mode||'stock_zero';
    $('#editorTitle').textContent=p?'Editar produto':'Novo produto';

    $('#editorBody').innerHTML='<form id="productForm" class="form-grid">'+
      (expiredLifecycle?'<div class="offer-note span-2"><strong>Produto desativado automaticamente por vencimento.</strong><br>Corrija a data de validade antes de reativá-lo.</div>':'')+
      '<label class="span-2"><span>Nome *</span><input name="name" required value="'+esc(p?.name||'')+'"></label>'+
      '<label><span>Código / SKU</span><input name="sku" value="'+esc(p?.sku||'')+'"></label>'+
      '<label><span>EAN / GTIN</span><input name="gtin" inputmode="numeric" value="'+esc(p?.gtin||'')+'"></label>'+
      '<label><span>Preço de venda</span><input name="price" inputmode="decimal" value="'+esc(((Number(p?.sale_price_cents||0)/100).toFixed(2)).replace('.',','))+'"></label>'+
      '<label><span>Estoque</span><input name="stock" inputmode="decimal" value="'+esc(fmtQty(p?.stock_quantity||0))+'"></label>'+
      '<label><span>Data de validade</span><input name="expiration_date" type="date" value="'+esc(p?.expiration_date||'')+'"></label>'+
      '<label><span>Categoria da vitrine</span><select name="category">'+categoryOptions(p?.category||'')+'</select></label>'+
      '<label><span>Subcategoria</span><input name="subcategory" value="'+esc(p?.subcategory||'')+'"></label>'+

      '<div class="section-title span-2">Oferta manual</div>'+
      '<div class="offer-note" id="autoOfferNote">'+(autoExpiry?'A oferta automática está ligada. Desative-a acima para configurar uma oferta manual.':'Você pode definir uma oferta manual. Ao ativá-la, a oferta automática por validade será desligada.')+'</div>'+
      '<label class="check span-2"><input name="offer_active" type="checkbox" '+(manualOffer?.active?'checked':'')+'><strong>Oferta manual ativa</strong></label>'+
      '<label><span>Desconto (%)</span><input name="offer_discount" type="number" min="1" max="95" step="0.1" inputmode="decimal" value="'+esc(offerDiscount)+'"></label>'+
      '<label><span>Valor da oferta</span><input name="offer_price" inputmode="decimal" value="'+esc(offerPrice)+'"></label>'+
      '<label class="span-2"><span>Validade da oferta</span><select name="offer_duration">'+offerDurationOptions(offerDuration)+'</select></label>'+
      '</form>';
    $('#editorActions').innerHTML='<button class="secondary" id="cancelEditor">Cancelar</button><button class="primary" id="saveProduct">Salvar produto</button>';
    $('#cancelEditor').onclick=()=>$('#editor').close();
    $('#saveProduct').onclick=()=>saveProduct(p?.id||'');
    $('#editor').showModal();

    const form=$('#productForm');
    const auto=form.querySelector('[name="auto_expiry_offer_enabled"]');
    const manualControls=[...form.querySelectorAll('[name="offer_active"],[name="offer_discount"],[name="offer_price"],[name="offer_duration"]')];
    const syncAutoState=()=>{
      const disabled=auto.checked;
      manualControls.forEach(el=>el.disabled=disabled);
      $('#autoOfferNote').textContent=disabled
        ?'A oferta automática está ligada. Desative-a acima para configurar uma oferta manual.'
        :'Você pode definir uma oferta manual. Ao ativá-la, a oferta automática por validade será desligada.';
    };
    auto.onchange=syncAutoState;
    syncAutoState();

    const discount=form.querySelector('[name="offer_discount"]');
    const offerPriceEl=form.querySelector('[name="offer_price"]');
    const regularPrice=form.querySelector('[name="price"]');
    discount.oninput=()=>{
      const base=centsFromInput(regularPrice.value),d=Number(discount.value);
      if(base>0&&Number.isFinite(d)&&d>0&&d<100)offerPriceEl.value=((Math.round(base*(100-d)/100))/100).toFixed(2).replace('.',',');
    };
    offerPriceEl.oninput=()=>{
      const base=centsFromInput(regularPrice.value),sale=centsFromInput(offerPriceEl.value);
      if(base>0&&sale>0&&sale<base)discount.value=(Math.round((1-sale/base)*1000)/10).toString();
    };
    regularPrice.oninput=()=>{if(discount.value)discount.oninput()};
  }

  function categoryOptions(current){

  }
  function centsFromInput(v){
    const clean=String(v||'0').replace(/\./g,'').replace(',','.');
    const n=Number(clean);return Number.isFinite(n)?Math.max(0,Math.round(n*100)):0;
  }
  function offerDurationOptions(current){

  function expiryRangeSummary(products,inventory={}){
    return {
      expired:products.filter(p=>Number(p.days_left)<0).length,
      under_30:products.filter(p=>Number(p.days_left)>=0&&Number(p.days_left)<30).length,
      days_30_59:products.filter(p=>Number(p.days_left)>=30&&Number(p.days_left)<60).length,
      days_60_90:products.filter(p=>Number(p.days_left)>=60&&Number(p.days_left)<=90).length,
      without_expiration:inventory.without_expiration??'—',
      auto_enabled:inventory.auto_enabled??'—',
      total_products:inventory.total_products??'—'
    };
  }
  async function activeValidityInventorySummary(){
    let offset=0,pages=0,total=0,without=0,auto=0;
    while(offset!=null&&pages<100){
      const page=await api('products',{offset,limit:100});
      const rows=page.products||[];
      for(const p of rows){
        if(p.active===false)continue;
        total++;
        if(!p.expiration_date)without++;
        if(p.auto_expiry_offer_enabled===true)auto++;
      }
      offset=page.next_offset;
      pages++;
    }
    return {total_products:total,without_expiration:without,auto_enabled:auto};
  }
  function renderExpiredDeactivatedNotice(rows=[],summary={}){
    const total=Number(summary.expired_deactivated??summary.expired??0);
    if(!total)return '';
    const examples=rows.slice(0,6).map(p=>esc(p.name)+' · '+esc(fmtDate(p.expiration_date))).join(' · ');
    return '<div class="bling-banner" style="margin-bottom:14px"><strong>'+esc(total)+' produto(s) vencido(s) já foram desativados automaticamente</strong><small>Estão fora da vitrine, com estoque zerado e ofertas desligadas.'+(examples?' Recentes: '+examples+(total>rows.length?'…':''):'')+'</small></div>';
  }

  function lifecycleAuditRow(r){

  async function loadExpirations(){
    const host=$('#expiryRows');
    try{
      const data=await api('expirations');
      state.expiryProducts=(data.products||[]).filter(p=>p.active!==false);
      state.expiredDeactivated=data.expired_deactivated||[];
      if(data.active_only===true){
        state.expirySummary=data.summary||{};
      }else{
        let inventory={};
        try{inventory=await activeValidityInventorySummary()}catch{}
        state.expirySummary=expiryRangeSummary(state.expiryProducts,inventory);
      }
      $('#expirySummary').innerHTML=renderExpirySummary(state.expirySummary);
      if($('#expiryExpiredNotice'))$('#expiryExpiredNotice').innerHTML=renderExpiredDeactivatedNotice(state.expiredDeactivated,state.expirySummary);
      host.innerHTML=state.expiryProducts.length?state.expiryProducts.map(expiryRow).join(''):'<div class="empty">Nenhum produto ativo com validade nos próximos 90 dias.</div>';
      host.querySelectorAll('[data-expiry-date]').forEach(el=>el.onchange=()=>saveExpiryRow(el.closest('[data-expiry-row]')));
      host.querySelectorAll('[data-expiry-auto]').forEach(el=>el.onchange=()=>saveExpiryRow(el.closest('[data-expiry-row]')));
      host.querySelectorAll('[data-expiry-edit]').forEach(btn=>btn.onclick=()=>openProductEditor(state.expiryProducts.find(p=>p.id===btn.dataset.expiryEdit)));
    }catch(e){
      host.innerHTML='<div class="empty">Não consegui carregar as validades. <button class="text" id="retryExpiry">Tentar novamente</button></div>';
      if($('#retryExpiry'))$('#retryExpiry').onclick=loadExpirations;
    }
  }

  function selectShortageForBalance(productId){

  function bindBalancePad(){
    document.querySelectorAll('[data-balance-key]').forEach(b=>b.onclick=()=>balanceKey(b.dataset.balanceKey));
    $('#balanceConfirm').onclick=confirmBalance;

  function balanceKey(key){
    if(!state.balanceProduct)return;
    if(key==='clear') state.balanceQty='';
    else if(key==='back') state.balanceQty=state.balanceQty.slice(0,-1);
    else if(/^\d$/.test(key) && state.balanceQty.length<7) state.balanceQty=(state.balanceQty==='0'?'':state.balanceQty)+key;
    paintBalance();
  }

  function paintBalance(){
    if(state.tab!=='balance')return;
    const hero=$('#balanceScanner'),qty=$('#balanceQty'),confirm=$('#balanceConfirm'),history=$('#balanceHistory');
    if(state.balanceProduct){
      hero.className='scanner-hero ready';
      hero.innerHTML='<div class="scan-title"><span class="scan-dot"></span>PRODUTO LIDO</div><div class="scan-value">'+esc(state.balanceProduct.name)+'</div><div class="scan-sub">EAN '+esc(state.balanceProduct.gtin||'—')+' · estoque atual '+esc(fmtQty(state.balanceProduct.stock_quantity||0))+(state.balanceProduct.gondola_number?' · Gôndola '+esc(state.balanceProduct.gondola_number):'')+'</div>';

      confirm.disabled=state.balanceQty==='';
    }else{
      hero.className='scanner-hero';
      hero.innerHTML='<div class="scan-title"><span class="scan-dot"></span>AGUARDANDO EAN</div><div class="scan-value">Leia um produto</div><div class="scan-sub">Depois use somente o teclado numérico abaixo.</div>';
      qty.textContent='—';confirm.disabled=true;
    }

      '<div class="simple-row"><div class="simple-main"><strong>'+esc(x.name)+'</strong><small>'+esc(x.gtin||'')+(x.gondola_number?' · Gôndola '+esc(x.gondola_number):'')+'</small></div><div class="simple-number">'+esc(fmtQty(x.stock_quantity))+'</div></div>'

  async function confirmBalance(){
    if(!state.balanceProduct||state.balanceQty==='')return;
    const btn=$('#balanceConfirm');btn.disabled=true;btn.textContent='Salvando…';
    try{
      const data=await api('balance_confirm',{},{

  async function handleGondolaScan(ean){
    if(state.tab!=='gondolas'||!state.gondola){toast('Abra uma gôndola antes de ler os produtos.');return}
    try{
      const data=await api('gondola_assign',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({gondola_id:state.gondola.id,ean})
      });
      state.gondolaProducts=state.gondolaProducts.filter(p=>p.id!==data.product.id);
      state.gondolaProducts.unshift(data.product);
      const moved=data.previous_gondola_number?' · movido da Gôndola '+data.previous_gondola_number:'';
      toast(data.product.name+moved);
      paintGondolas();
    }catch(e){toast(errorMessage(e.message))}

  async function saveGondolaShelf(productId,btn){
    if(!state.gondola)return;
    const input=document.querySelector('[data-gondola-shelf-input="'+CSS.escape(productId)+'"]');
    if(!input)return;
    if(btn){btn.disabled=true;btn.textContent='Salvando…'}
    try{
      const data=await api('gondola_shelf_update',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({gondola_id:state.gondola.id,product_id:productId,shelf_label:input.value})
      });
      const product=state.gondolaProducts.find(p=>p.id===productId);
      if(product)product.shelf_label=data.shelf_label||null;
      paintGondolas();
      toast(data.shelf_label?'Prateleira '+data.shelf_label+' salva':'Prateleira removida');
    }catch(e){
      toast(errorMessage(e.message));
      if(btn){btn.disabled=false;btn.textContent='Salvar'}
    }
  }

  async function removeGondolaProduct(productId){
    if(!state.gondola)return;
    try{
      await api('gondola_remove',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({gondola_id:state.gondola.id,product_id:productId})
      });
      state.gondolaProducts=state.gondolaProducts.filter(p=>p.id!==productId);paintGondolas();toast('Produto removido da gôndola');
    }catch(e){toast(errorMessage(e.message))}
  }

  async function importPurchaseXmlFiles(files){
    if(!files?.length)return;
    const input=$('#purchaseXmlInput');if(input)input.value='';
    const valid=files.filter(f=>/\.xml$/i.test(f.name)||/xml/i.test(f.type||''));
    if(!valid.length){toast('Selecione arquivos XML');return}
    let ok=0,fail=0;
    try{
      for(let i=0;i<valid.length;i+=10){
        const chunk=valid.slice(i,i+10),payload=[];
        for(const file of chunk)payload.push({name:file.name,xml:await file.text()});
        const r=await purchaseApi('manual_import',{files:payload});
        ok+=Number(r.processed||0)+Number(r.duplicates||0);fail+=Number(r.failed||0);
      }
      toast('XML: '+ok+' concluído(s)'+(fail?' · '+fail+' falha(s)':''));
      await loadPurchases();
    }catch(e){toast(errorMessage(e.message))}
  }

  async function setPurchaseConversion(id){
    const row=(state.purchaseXml?.review_items||[]).find(x=>x.id===id)||{};
    const factorRaw=prompt('Quantas unidades de venda existem em 1 '+String(row.purchase_unit||'embalagem')+'? Ex.: fardo com 10 displays de 10 unidades = 100','');
    if(factorRaw===null)return;
    const factor=Number(String(factorRaw).replace(',','.'));
    if(!Number.isFinite(factor)||factor<1){toast('Fator inválido');return}
    const base=prompt('Unidade final de venda (ex.: UN, PCT, KG, L):',row.base_unit||'UN');
    if(base===null)return;
    try{

      toast('Conversão salva');

    const host=$('#blingStatus');if(!host)return;

    const probes=probe.probes||{};
    const banner=$('#blingRuntimeBanner');

      const active=[
        domains.products?'Produtos':null,
        domains.stock?'Estoque':null,
        domains.customers?'Clientes':null,
        domains.orders?'Pedidos':null

      const firstOrderCanary=Boolean(domains.orders)&&String(rollout.state||'')==='armed_first_canary';
      const headline=b.hub_enabled

        firstOrderCanary?'Pedidos aguardando o primeiro canário real':'',

      const cls=p.ok?'ok-text':'danger-text';
      const txt=p.ok?'Acesso confirmado':p.insufficient_scope?'Escopo ausente':'HTTP '+esc(p.http_status||'erro');
      return '<div class="bling-scope"><strong>'+esc(label)+'</strong><small class="'+cls+'">'+txt+'</small></div>';
    };
    host.innerHTML=
      '<div class="bling-grid">'+
        '<div class="bling-card"><small>Credenciais OAuth</small><strong>'+yesNo(cred.ready,'Configuradas','Incompletas')+'</strong><span class="sub">Client ID · Secret · Refresh token</span></div>'+

        '<div class="bling-card"><small>Pedidos vinculados</small><strong>'+esc(orderLinks.matched||0)+' / '+esc(orderLinks.total||0)+'</strong><span class="sub">'+esc(orderLinks.review_required||0)+' para revisar</span></div>'+
        '<div class="bling-card"><small>Pedidos · homologação</small><strong class="'+(String(rollout.state||'')==='canary_passed'?'ok-text':String(rollout.state||'')==='paused_after_canary_failure'?'danger-text':'warn-text')+'">'+esc(String(rollout.state||'')==='canary_passed'?'Canário validado':String(rollout.state||'')==='paused_after_canary_failure'?'Pausado após falha':String(rollout.state||'')==='armed_first_canary'?'Aguardando 1º pedido real':'Ainda não validado')+'</strong><span class="sub">'+(String(rollout.state||'')==='armed_first_canary'?'O primeiro pedido elegível será processado sozinho e verificado antes de liberar a sequência.':String(rollout.state||'')==='canary_passed'?'Primeiro pedido real criado/verificado com segurança.':String(rollout.state||'')==='paused_after_canary_failure'?'Novos pedidos ficam protegidos até revisão técnica.':'Estado do rollout ainda não foi confirmado.')+'</span></div>'+

  async function confirmAllReadyOrders(){
    const rows=confirmableNewOrders();
    if(!rows.length){toast('Nenhum pedido novo está apto para confirmar');return}
    const total=rows.reduce((sum,o)=>sum+Number(o.total_cents||0),0);
    if(!confirm('Confirmar '+rows.length+' pedido(s) apto(s)?\n\nTotal: '+money(total)+'\n\nA confirmação reserva o estoque para estes pedidos, mas NÃO dá baixa física e NÃO envia pedido ao Bling.'))return;
    const btn=$('#confirmReadyOrders');
    if(btn){btn.disabled=true;btn.textContent='Confirmando…'}
    let ok=0;const failed=[];
    for(const o of rows){
      try{
        await api('order_update',{},{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:o.id,status:'confirmed'})
        });
        ok++;
      }catch(e){
        failed.push('#'+shortOrder(o.order_number));
      }
    }
    try{
      const data=await api('orders');state.orders=data.orders||[];
      paintOrderFilters();paintOrderRows();paintConfirmableOrdersButton();
    }catch{}
    if(failed.length)toast(ok+' confirmado(s) · '+failed.length+' precisa(m) revisão');
    else toast(ok+' pedido(s) confirmado(s)');
  }
  async function quickConfirmOrder(id,btn){
    const o=state.orders.find(x=>x.id===id);
    if(!o||o.status!=='created'){toast('Este pedido não está mais aguardando confirmação');return}
    const problems=orderProblemReasons(o);
    if(problems.length){toast('Corrija os dados do pedido antes de confirmar');return}
    if(btn){btn.disabled=true;btn.textContent='Confirmando…'}
    try{
      await api('order_update',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id,status:'confirmed'})
      });
      const data=await api('orders');state.orders=data.orders||[];
      paintOrderFilters();paintOrderRows();paintConfirmableOrdersButton();
      toast('Pedido #'+shortOrder(o.order_number)+' confirmado');
    }catch(e){
      toast(errorMessage(e.message));
      if(btn){btn.disabled=false;btn.textContent='Confirmar'}
    }
  }
  async function quickStartSeparation(id,btn){
    const o=state.orders.find(x=>x.id===id);
    if(!o||!['confirmed','processing'].includes(o.status)){toast('Este pedido não está mais aguardando separação');return}
    const problems=orderProblemReasons(o);
    if(problems.length){
      const shortcut=orderIssueShortcut(problems);
      if(shortcut)openOrderForIssue(id,shortcut[0]);else openOrder(id);
      return;
    }
    const w=window.open('','_blank','width=420,height=700');
    if(!w){toast('Libere pop-ups para iniciar a separação');return}
    try{
      w.document.open();
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Preparando separação</title></head><body style="font:16px system-ui;padding:30px;text-align:center"><strong>Carregando pedido…</strong><p>Validando estoque e Bling antes de iniciar.</p></body></html>');
      w.document.close();
      if(btn){btn.disabled=true;btn.textContent='Preparando…'}
      state.currentOrder=null;
      await openOrder(id);
      const detail=state.currentOrder;
      if(!detail?.order||detail.order.id!==id)throw new Error('order_not_found');
      await printSeparation(detail,true,w);
    }catch(e){
      try{w.close()}catch{}
      toast(errorMessage(e?.message||'order_not_found'));
    }finally{
      if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent=orderNextAction(o)}
    }
  }

  function orderIssueShortcut(problems){
    if(problems.includes('Endereço incompleto'))return ['address','Corrigir endereço'];
    if(problems.includes('Cliente não identificado'))return ['customer','Vincular cliente'];
    if(problems.includes('Pagamento não informado'))return ['payment','Corrigir pagamento'];
    if(problems.includes('Histórico pendente do cliente'))return ['history','Revisar histórico'];
    if(problems.includes('Estoque insuficiente'))return ['stock','Revisar estoque'];
    return null;
  }
  function orderRowPrimaryActionHtml(o,problems,shortcut){
    const next=orderNextAction(o);
    const consumed=o?.payment_method_snapshot?.stock_consumed===true;
    if(problems.length&&shortcut){
      return '<button class="row-next-action issue" type="button" data-order-issue-open="'+esc(o.id)+'" data-order-issue-kind="'+esc(shortcut[0])+'">'+esc(shortcut[1])+'</button>';
    }
    if(o.status==='created'){
      return '<button class="row-next-action" type="button" data-quick-confirm="'+esc(o.id)+'">Confirmar pedido</button>';

    if(['confirmed','processing'].includes(o.status)&&!consumed){
      return '<button class="row-next-action" type="button" data-quick-separation="'+esc(o.id)+'">'+esc(next)+'</button>';
    }
    if(['confirmed','processing','ready','out_for_delivery','delivered'].includes(o.status)){
      return '<button class="row-next-action" type="button" data-open-order="'+esc(o.id)+'">'+esc(next)+'</button>';

  async function openOrder(id){

    $('#editorBody').innerHTML='<div class="loading">Carregando pedido…</div>';
    $('#editorActions').innerHTML='<button class="secondary" id="cancelEditor">Fechar</button>';

      const data=await api('order',{id});state.currentOrder=data;state.currentOrderBlingPreview=null;state.currentOrderFiscal=null;
      state.customers=[];state.orderCustomerSuggestion=null;

      if(sourceId){
        try{const one=await customerApi('vitrine_customer_get',{id:sourceId});if(one.customer)state.customers=[one.customer]}catch{}
      }else{
        const phone=data.order?.whatsapp_phone_e164||data.order?.delivery_address_snapshot?.phone||'';
        if(phone){
          try{
            const found=await customerApi('vitrine_customers_list',{q:phone,limit:10});
            const target=phoneDigits(phone);
            const matches=(found.customers||[]).filter(c=>c?.id&&c?.status!=='inactive'&&phoneDigits(c.phone)===target);
            if(matches.length===1){
              state.customers=[matches[0]];
              state.orderCustomerSuggestion=matches[0].id;
            }
          }catch{}
        }
      }
      await loadCurrentOrderFiscal(false);

  function paintOrderDetail(){
    const d=state.currentOrder,o=d.order,c=d.customer||{},payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'';
    const currentCustomerId=c.source_customer_id||o.delivery_address_snapshot?.source_customer_id||o.customer_id||'';
    const syncFailed=d.history_sync?.state==='failed';
    const syncAlert=syncFailed?'<div class="sync-alert"><div><strong>Histórico do cliente ainda não sincronizado</strong><small>'+esc(d.history_sync?.last_error||'Falha temporária de sincronização.')+'</small></div><button class="secondary" type="button" id="retryHistorySync">Tentar novamente</button></div>':'';
    const consumed=o.payment_method_snapshot?.stock_consumed===true;
    const linked=d.bling_link?.linked===true;
    const delivery=o.delivery_address_snapshot||c.address||{};
    const deliveryProblems=orderProblemReasons(o).some(x=>['Cliente não identificado','Endereço incompleto'].includes(x));
    const cancellation=o.payment_method_snapshot?.cancellation||null;
    const deliveryFailure=o.payment_method_snapshot?.last_delivery_failure||null;
    const deliveryFailureAlert=deliveryFailure&&o.status==='ready'
      ? '<div class="rule-notice warn"><strong>Última entrega não concluída · '+esc(deliveryFailure.reason||'Motivo não informado')+'</strong><div>'+(deliveryFailure.note?esc(deliveryFailure.note)+' · ':'')+(deliveryFailure.at?esc(dateTime(deliveryFailure.at)):'')+'</div></div>'
      : '';
    const cancellationAlert=cancellation&&o.status==='cancelled'
      ? '<div class="rule-notice warn"><strong>Pedido cancelado · '+esc(cancellation.reason||'Motivo não informado')+'</strong><div>'+(cancellation.note?esc(cancellation.note)+' · ':'')+(cancellation.at?esc(dateTime(cancellation.at)):'')+'</div></div>'

  function blingPreflightOperationalBlockers(p){
    if(!p||p.error)return [];
    const expected=new Set(['first_separation_required','stock_not_consumed']);
    const blockers=Array.isArray(p.write_blockers)&&p.write_blockers.length?p.write_blockers:(p.blockers||[]);
    return [...new Set(blockers)].filter(code=>!expected.has(code));
  }
  function blingPreflightAlertHtml(p){
    const blockers=blingPreflightOperationalBlockers(p);
    if(!blockers.length)return '';
    const canReconcile=blockers.some(x=>['customer_missing_bling_contact_id','unresolved_products'].includes(x));
    const needsCustomer=blockers.includes('customer_not_linked');
    const needsDocument=blockers.includes('customer_document_required');
    const needsBlingCustomer=blockers.includes('customer_missing_bling_contact_id');
    const needsProducts=blockers.includes('unresolved_products');
    const actions=(needsDocument?'<button class="secondary" id="completeCustomerDocument" type="button">Completar CPF</button>':'')+
      (needsBlingCustomer?'<button class="secondary" id="createBlingOrderCustomer" type="button">Cadastrar cliente no Bling</button>':'')+
      (needsProducts?'<button class="secondary" id="createBlingOrderProducts" type="button">Cadastrar produtos no Bling</button>':'')+
      (canReconcile?'<button class="secondary" id="resolveBlingDependencies" type="button">Tentar resolver vínculos</button>':'')+
      (needsCustomer?'<button class="secondary" id="focusOrderCustomer" type="button">Vincular cliente</button>':'');
    return '<div class="sync-alert"><div><strong>Antes de separar, revise o Bling</strong><small>'+blockers.slice(0,3).map(blingOrderBlockerLabel).map(esc).join(' · ')+(blockers.length>3?' · +'+(blockers.length-3):'')+'</small></div><div class="dispatch-actions">'+actions+'<span class="pill warn">Somente leitura</span></div></div>';
  }

  function fiscalBlockReasonLabel(code){
    const map={
      delivery_not_confirmed:'Aguardando confirmação da entrega',
      payment_not_confirmed:'Aguardando confirmação do pagamento',
      payment_review_required:'Pagamento precisa de revisão',
      settled_amount_missing:'Valor recebido não informado',
      settled_amount_mismatch:'Valor recebido diferente do pedido',
      order_cancelled:'Pedido cancelado',
      order_returned:'Pedido devolvido',
      fiscal_control_missing:'Controle fiscal ainda não iniciado'
    };
    return map[code]||String(code||'').replaceAll('_',' ');
  }

  function orderFiscalHtml(f,o){
    if(!f)return '<div class="rule-notice"><strong>Carregando controle fiscal…</strong><div>Consultando o gate de saída e o fechamento.</div></div>';
    if(f.error)return '<div class="rule-notice warn"><strong>Controle fiscal indisponível</strong><div>A saída deve aguardar a conferência fiscal.</div></div>';

    const gate=f.dispatch_gate||{};
    const gateAuthorized=gate.authorized===true;
    const gateEnforced=gate.enforced===true;
    const gateObserve=gate.mode==='observe';
    const gateTitle=gateAuthorized?'Documento fiscal autorizado':gateEnforced?'Fiscal pendente · saída bloqueada':gateObserve?'Fiscal em observação antes da saída':'Gate fiscal ainda desligado';
    const gateKind=gateAuthorized?'ok-text':gateEnforced?'warn-text':'';
    const gateDetail=gateAuthorized
      ? ((gate.bling_invoice_number?'NF-e '+gate.bling_invoice_number+' · ':'')+'liberado para expedição')
      : gateEnforced
        ? 'A mercadoria não pode ser marcada como saída até existir autorização fiscal.'
        : gateObserve
          ? 'Estrutura pronta; nesta fase ainda não bloqueia a operação enquanto o canário fiscal não estiver ativo.'
          : 'A autorização fiscal antes da saída ainda não está sendo exigida pelo sistema.';

    const delivered=f.delivery_status==='delivered';
    const paid=f.payment_status==='confirmed';
    const ready=f.fiscal_status==='ready';
    const issued=f.fiscal_status==='issued'||Boolean(f.bling_invoice_id);
    const fiscalLabel=issued?'Emitida':ready?'Pronto':f.fiscal_status==='review_required'?'Revisar':'Pendente';
    const reason=f.fiscal_block_reason?'<div class="sub" style="margin-top:5px">'+esc(fiscalBlockReasonLabel(f.fiscal_block_reason))+'</div>':'';

    return '<div class="rule-notice">'+
      '<strong class="'+gateKind+'">'+esc(gateTitle)+'</strong>'+
      '<div style="margin-top:5px">'+esc(gateDetail)+'</div>'+
      (gate.sefaz_status?'<div class="sub" style="margin-top:5px">SEFAZ: '+esc(gate.sefaz_status)+'</div>':'')+
      (!f.config?.send_enabled?'<div class="sub" style="margin-top:5px">Emissão de NF-e permanece desligada nesta etapa. O gate está preparado, mas não envia nota automaticamente.</div>':'')+
      '</div>'+
      fiscalDispatchPreviewHtml(f.dispatch_preview)+
      '<div class="rule-notice" style="margin-top:8px">'+
      '<strong>Fechamento: Entrega '+(delivered?'✓':'pendente')+' · Recebimento '+(paid?'✓':'pendente')+' · Fiscal '+esc(fiscalLabel)+'</strong>'+
      '<div style="margin-top:5px">Total: '+money(f.total_cents||o.total_cents||0)+(paid&&f.settled_amount_cents!=null?' · Recebido: '+money(f.settled_amount_cents):'')+'</div>'+
      reason+
      '<div class="sub" style="margin-top:5px">Entrega e recebimento continuam sendo fatos separados do documento exigido para a saída.</div>'+
      '</div>';
  }

  function fiscalDispatchPreviewHtml(p){
    if(!p)return '';
    if(p.error)return '<div class="rule-notice warn" style="margin-top:8px"><strong>Prévia fiscal indisponível</strong><div>Não foi possível conferir o Bling agora. Nenhuma emissão foi feita.</div></div>';
    const inv=p.invoice||null;
    const blockers=Array.isArray(p.hard_blockers)?p.hard_blockers:[];
    const labels={
      order_not_ready_for_fiscal_dispatch:'Pedido ainda não está pronto para expedição',
      bling_order_not_linked:'Pedido ainda não está vinculado ao Bling',
      external_order_key_missing:'Chave externa do pedido não encontrada',
      multiple_invoices_for_external_key:'Mais de uma NF-e encontrada para o mesmo pedido',
      invoice_terminal_state:'A NF-e encontrada está em situação que precisa de revisão'
    };
    if(inv?.situation?.authorized){
      return '<div class="rule-notice" style="margin-top:8px"><strong class="ok-text">NF-e localizada e autorizada ✓</strong><div>'+(inv.numero?'NF-e '+esc(inv.numero)+' · ':'')+esc(inv.situation.label||'Autorizada')+'</div>'+(inv.chaveAcesso?'<div class="sub" style="margin-top:4px">Chave: '+esc(inv.chaveAcesso)+'</div>':'')+'</div>';
    }
    if(inv){
      return '<div class="rule-notice warn" style="margin-top:8px"><strong>NF-e localizada · '+esc(inv.situation?.label||'situação pendente')+'</strong><div>O sistema apenas consultou o Bling. Nenhum envio à SEFAZ foi feito por esta ação.</div></div>';
    }
    if(blockers.length){
      return '<div class="rule-notice warn" style="margin-top:8px"><strong>Prévia fiscal precisa de revisão</strong><div>'+blockers.map(x=>esc(labels[x]||String(x).replaceAll('_',' '))).join(' · ')+'</div></div>';
    }
    return '<div class="rule-notice" style="margin-top:8px"><strong>Nenhuma NF-e encontrada para este pedido</strong><div>Pedido Bling identificado. O canário de emissão continua desligado e esta consulta não gera nota.</div></div>';
  }

  function fiscalCanaryActionHtml(f,o){
    const p=f?.dispatch_preview||null;
    if(!p||p.error||o?.status!=='ready')return '';
    const inv=p.invoice||null;
    const blockers=Array.isArray(p.hard_blockers)?p.hard_blockers:[];
    const cfg=p.config||{};
    const job=p.job||{};
    if(inv?.situation?.authorized)return '';
    if(job.status==='authorizing'){
      return '<div class="rule-notice warn" style="margin-top:8px"><strong>NF-e enviada · aguardando retorno da SEFAZ</strong><div>Não será feito novo envio. Use Atualizar fiscal para apenas consultar a situação.</div><div class="print-actions"><button class="secondary" id="refreshFiscalCanary" type="button">Atualizar fiscal</button></div></div>';
    }
    if(inv){
      return '<div class="rule-notice warn" style="margin-top:8px"><strong>NF-e gerada · autorização pendente</strong><div>O sistema não repetirá a geração. A próxima ação será somente consultar/autorizar esta nota já identificada.</div><div class="print-actions"><button class="secondary" id="refreshFiscalCanary" type="button">Atualizar fiscal</button></div></div>';
    }
    if(blockers.length)return '';
    if(cfg.canary_enabled===true&&cfg.canary_selected!==true){
      return '<div class="rule-notice warn" style="margin-top:8px"><strong>Outra emissão fiscal está em andamento</strong><div>Aguarde a conclusão antes de emitir a NF-e deste pedido.</div><div class="print-actions"><button class="secondary" id="refreshFiscalCanary" type="button">Atualizar fiscal</button></div></div>';
    }
    const humanReady=cfg.human_issue_enabled===true&&cfg.dispatch_gate_mode==='enforce';
    const selectedCanary=cfg.canary_enabled===true&&cfg.canary_selected===true;
    if(!humanReady&&!selectedCanary)return '';
    return '<div class="rule-notice warn" style="margin-top:8px"><strong>Emissão fiscal pronta para este pedido</strong><div>A NF-e só será gerada após confirmação humana. O sistema trabalha um pedido fiscal por vez e não repete geração automaticamente.</div><div class="print-actions"><button class="primary" id="executeFiscalCanary" type="button">Emitir NF-e deste pedido</button></div></div>';
  }

  async function executeCurrentOrderFiscalCanary(){
    const o=state.currentOrder?.order;if(!o)return;
    const p=state.currentOrderFiscal?.dispatch_preview||{};
    const cfg=p.config||{};
    const eligible=o.status==='ready'&&!(p.hard_blockers||[]).length&&(
      (cfg.human_issue_enabled===true&&cfg.dispatch_gate_mode==='enforce')||
      (cfg.canary_enabled===true&&cfg.canary_selected===true)
    );
    if(!eligible){
      toast('Este pedido ainda não está apto para emissão fiscal');return;
    }
    const ok=confirm('Emitir e autorizar a NF-e do pedido #'+shortOrder(o.order_number)+' no Bling e enviar à SEFAZ?\n\nEsta ação tem efeito fiscal real. O sistema processa apenas um pedido por vez e não repetirá a geração automaticamente.');
    if(!ok)return;
    const btn=$('#executeFiscalCanary');
    if(btn){btn.disabled=true;btn.textContent='Emitindo NF-e…'}
    try{
      const result=await api('order_fiscal_dispatch_canary_execute',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:o.id,confirmation:'EMITIR_NFE'})
      });
      await loadCurrentOrderFiscal(false);
      paintOrderDetail();
      if(result?.authorized===true)toast('NF-e autorizada · saída fiscal liberada');
      else if(result?.pending===true)toast('NF-e enviada · aguardando retorno da SEFAZ');
      else toast('Canário fiscal processado com segurança');
    }catch(e){
      await loadCurrentOrderFiscal(false);
      paintOrderDetail();
      toast(errorMessage(e?.message||'fiscal_canary_failed'));
    }
  }

  async function openDanfeForOrder(id,orderNumber=''){
    if(!id)return;
    const w=window.open('','_blank','width=900,height=900');
    if(!w){toast('Libere pop-ups para abrir o DANFE');return}
    try{
      w.document.open();
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>DANFE</title></head><body style="font:16px system-ui;padding:30px;text-align:center"><strong>Carregando DANFE…</strong><p>Buscando o PDF oficial no Bling.</p></body></html>');
      w.document.close();
      const data=await api('order_fiscal_document_pdf',{},{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})
      });
      const raw=atob(String(data.base64||''));
      if(!raw)throw new Error('fiscal_document_empty');
      const bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      const blob=new Blob([bytes],{type:'application/pdf'});
      const url=URL.createObjectURL(blob);
      w.location.replace(url);
      setTimeout(()=>URL.revokeObjectURL(url),120000);
      toast('DANFE '+(data.invoice_number?data.invoice_number+' ':orderNumber?'#'+shortOrder(orderNumber)+' ':'')+'aberto para impressão');
    }catch(e){
      try{w.close()}catch{}
      toast(errorMessage(e?.message||'fiscal_document_download_failed'));
    }
  }

  function orderStockAlertHtml(readiness){
    if(!readiness||readiness.ok!==false)return '';
    const rows=Array.isArray(readiness.shortages)?readiness.shortages:[];
    const detail=rows.length

  function orderBlingLinkHtml(link){
    if(!link)return '<div class="rule-notice"><strong>Aguardando primeira separação</strong><div>O pedido ainda não foi enviado ao Bling. O envio acontece automaticamente quando a separação começar e todas as validações estiverem corretas.</div></div>';
    const job=link.job||{};
    const jobAttention=job.status==='review_required'||job.status==='failed';
    const statusAttention=job.operation==='sync_order_status'&&jobAttention;
    if(link.linked&&statusAttention){
      return '<div class="rule-notice warn"><strong>Pedido vinculado · situação pendente no Bling</strong><div>'+esc(blingOrderJobErrorLabel(job.error_code))+'</div><div class="sub" style="margin-top:6px">O pedido continua válido no Admin. Confira a situação no Bling enquanto essa permissão estiver indisponível.</div></div>';
    }
    if(link.linked){
      return '<div class="rule-notice"><strong class="ok-text">Bling #'+esc(link.bling_order_id)+' ✓</strong><div>Pedido vinculado e verificado'+(link.last_verified_at?' · '+esc(dateTime(link.last_verified_at)):'')+'.</div></div>';
    }
    if(job.status==='pending'||job.status==='processing'||job.status==='retry'){
      return '<div class="rule-notice"><strong>Sincronização Bling em andamento</strong><div>Status: '+esc(job.status||'pendente')+'.</div></div>';
    }
    if(jobAttention){
      return '<div class="rule-notice warn"><strong>Bling precisa de revisão</strong><div>'+esc(blingOrderJobErrorLabel(job.error_code))+'</div></div>';
    }
    return '<div class="rule-notice"><strong>Ainda não vinculado</strong><div>Será processado automaticamente após a primeira separação elegível.</div></div>';
  }

  function orderActionButtonsHtml(o){
    const consumed=o.payment_method_snapshot?.stock_consumed===true;
    const problems=orderProblemReasons(o);
    const mustFix=problems.length>0&&['created','confirmed','ready','out_for_delivery'].includes(o.status);
    const dispatchGate=state.currentOrderFiscal?.dispatch_gate||null;
    const fiscalDispatchBlocked=o.status==='ready'&&dispatchGate?.enforced===true&&dispatchGate?.allowed!==true;
    let primary='';
    if(mustFix)primary='<button class="primary" type="button" disabled>Corrija os dados antes de avançar</button>';
    if(!mustFix&&o.status==='created')primary='<button class="primary" id="advanceOrder" data-next="confirmed" type="button">Confirmar pedido</button>';
    else if(!mustFix&&o.status==='confirmed'&&!consumed)primary='<button class="primary" id="startSeparation" type="button">Iniciar separação</button>';
    else if(!mustFix&&o.status==='confirmed'&&consumed)primary='<button class="primary" id="advanceOrder" data-next="processing" type="button">Continuar separação</button>';
    else if(o.status==='processing'&&!consumed)primary='<button class="primary" id="startSeparation" type="button">Regularizar separação</button>';
    else if(o.status==='processing')primary='<button class="primary" id="advanceOrder" data-next="ready" type="button">Finalizar separação</button>';
    else if(!mustFix&&o.status==='ready'&&fiscalDispatchBlocked)primary='<button class="primary" type="button" disabled>Fiscal pendente antes da saída</button>';
    else if(!mustFix&&o.status==='ready')primary='<button class="primary" id="advanceOrder" data-next="out_for_delivery" type="button">Marcar saída para entrega</button>';
    else if(!mustFix&&o.status==='out_for_delivery')primary='<button class="primary" id="advanceOrder" data-next="delivered" type="button">Confirmar entrega</button>';
    const docs=[];
    if(o.status==='out_for_delivery')docs.push('<button class="secondary" id="returnToExpedition" type="button">Entrega não concluída</button>');
    if(consumed)docs.push('<button class="secondary" id="reprintSeparation" type="button">Reimprimir separação</button>');
    if(['ready','out_for_delivery','delivered'].includes(o.status))docs.push('<button class="secondary" id="printDelivery" type="button">Imprimir via do entregador</button>');
    const cancel=!['delivered','cancelled'].includes(o.status)?'<button class="text danger" id="cancelOrder" type="button">Cancelar pedido</button>':'';
    return '<div class="order-action-zone"><strong>'+esc(orderNextAction(o))+'</strong><small>Use a próxima ação abaixo; o sistema atualiza estoque e integrações quando necessário.</small><div class="print-actions">'+(primary||'')+docs.join('')+'</div>'+cancel+'</div>';
  }

    if($('#orderDeliveryStreet'))payload.delivery_address={
      customer_name:$('#orderDeliveryName')?.value||'',
      phone:$('#orderDeliveryPhone')?.value||'',
      postal_code:$('#orderDeliveryPostalCode')?.value||'',
      street:$('#orderDeliveryStreet')?.value||'',
      number:$('#orderDeliveryNumber')?.value||'',
      district:$('#orderDeliveryDistrict')?.value||'',
      complement:$('#orderDeliveryComplement')?.value||'',
      city:$('#orderDeliveryCity')?.value||'',
      state:$('#orderDeliveryState')?.value||'',
      raw_text:$('#orderDeliveryRawText')?.value||''
    };
    if(status)payload.status=status;
    return payload;
  }
  async function persistCurrentOrder(status,extra={}){
    const payload={...currentOrderEditablePayload(status),...(extra&&typeof extra==='object'?extra:{})};
    await api('order_update',{},{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const fresh=await api('order',{id:payload.id});state.currentOrder=fresh;
    await loadCurrentOrderFiscal(false);
    await loadCurrentOrderBlingPreview(false);
    return fresh;
  }
  async function advanceCurrentOrder(next){
    const btn=$('#advanceOrder');if(btn){btn.disabled=true;btn.textContent='Atualizando…'}
    try{
      await persistCurrentOrder(next);
      paintOrderDetail();loadOrders();
      toast('Pedido atualizado · '+orderNextAction(state.currentOrder.order));
    }catch(e){
      toast(errorMessage(e.message));
      if(btn){btn.disabled=false;btn.textContent='Tentar novamente'}
    }
  }
  async function cancelCurrentOrder(){
    const linked=state.currentOrder?.bling_link?.linked===true;
    const choice=prompt(
      'Motivo do cancelamento:\n\n1 - Cliente desistiu\n2 - Produto indisponível\n3 - Endereço / área de entrega\n4 - Pedido duplicado\n5 - Problema de pagamento\n6 - Erro no pedido\n7 - Outro\n\nDigite o número ou escreva o motivo:'
    );
    if(choice===null)return;
    const value=String(choice||'').trim();
    const reasons={
      '1':'Cliente desistiu',
      '2':'Produto indisponível',
      '3':'Endereço / área de entrega',
      '4':'Pedido duplicado',
      '5':'Problema de pagamento',
      '6':'Erro no pedido',
      '7':'Outro'
    };
    const reason=reasons[value]||value;
    if(!reason){toast('Informe o motivo do cancelamento');return}
    const noteInput=prompt('Observação opcional sobre o cancelamento:', '');
    if(noteInput===null)return;
    const note=String(noteInput||'').trim();
    const message=linked
      ? 'Cancelar este pedido por "'+reason+'"?\n\nO estoque reservado será devolvido quando aplicável. Como o pedido já está vinculado ao Bling, qualquer situação que não puder ser atualizada automaticamente ficará registrada para revisão.'
      : 'Cancelar este pedido por "'+reason+'"? O estoque reservado será devolvido quando aplicável.';
    if(!confirm(message))return;
    try{
      await persistCurrentOrder('cancelled',{cancellation_reason:reason,cancellation_note:note});
      paintOrderDetail();loadOrders();
      toast(linked?'Pedido cancelado · Bling será conferido':'Pedido cancelado');
    }catch(e){toast(errorMessage(e.message))}
  }
  async function saveOrder(){
    const btn=$('#saveOrder');btn.disabled=true;btn.textContent='Salvando…';
    try{
      await persistCurrentOrder();
      paintOrderDetail();toast('Dados do pedido salvos');loadOrders();
    }catch(e){toast(errorMessage(e.message));btn.disabled=false;btn.textContent='Salvar dados'}
  }

  function customerSummary(c,snapshot){
    const a=snapshot||c?.address||{};
    if(!c?.id&&!snapshot)return '<span class="muted">Cliente ainda não vinculado. Cadastre em Clientes e selecione acima.</span>';
    const address=[a.street,a.number,a.complement,a.district,a.city,a.state].filter(Boolean).join(', ')||a.raw_text||'Endereço não informado';
    return '<strong>'+esc(c.display_name||a.recipient_name||'Cliente')+'</strong><br>'+
      (c.phone?'Telefone: '+esc(formatPhone(c.phone))+'<br>':'')+
      (c.cpf?'CPF: '+esc(formatCpf(c.cpf))+'<br>':'')+
      (c.email?'E-mail: '+esc(c.email)+'<br>':'')+
      'Endereço: '+esc(address);
  }

  function separationItems(detail){
    const map=new Map();
    const add=(key,name,qty,image,gondola,shelf)=>{
      const k=key||name;const old=map.get(k);
      if(old)old.quantity+=Number(qty||0);
      else map.set(k,{name,quantity:Number(qty||0),image_url:image||'/img/logoantonia5.png',gondola_number:gondola??null,shelf_label:String(shelf||'').trim()||null});
    };
    for(const item of detail.items||[]){
      if(item.item_kind==='basket'&&item.components?.length){
        for(const c of item.components)add(c.product_id||c.name_snapshot,c.name_snapshot,Number(c.quantity)*Number(item.quantity),c.image_url,c.gondola_number,c.shelf_label);
      }else add(item.product_id||item.name_snapshot,item.name_snapshot,item.quantity,item.image_url,item.gondola_number,item.shelf_label);
    }
    return [...map.values()].sort((a,b)=>{
      const ga=a.gondola_number??999999,gb=b.gondola_number??999999;
      if(ga!==gb)return ga-gb;
      const sa=a.shelf_label||'~~~~',sb=b.shelf_label||'~~~~';
      const shelfOrder=sa.localeCompare(sb,'pt-BR',{numeric:true,sensitivity:'base'});
      return shelfOrder||a.name.localeCompare(b.name,'pt-BR');
    });
  }
  async function validateBlingBeforeSeparation(orderId){
    try{
      const preview=await api('bling_preview_order_sync',{},{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:orderId})
      });
      state.currentOrderBlingPreview=preview;
      const blockers=blingPreflightOperationalBlockers(preview);
      if(blockers.length){
        paintOrderDetail();
        toast('Corrija as pendências da integração antes de separar');
        return false;
      }
      return true;
    }catch(e){
      state.currentOrderBlingPreview={error:String(e?.message||'bling_preview_unavailable')};
      paintOrderDetail();
      toast('Não consegui validar o Bling · separação não iniciada');
      return false;
    }
  }

  async function printSeparation(detail,consumeStock=false,existingWindow=null){
    const o=detail.order;
    const w=existingWindow||window.open('','_blank','width=420,height=700');
    if(!w){toast('Libere pop-ups para imprimir');return}
    try{
      w.document.open();
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Preparando separação</title></head><body style="font:16px system-ui;padding:30px;text-align:center"><strong>Preparando separação…</strong><p>'+(consumeStock?'Iniciando a separação e atualizando o estoque.':'Preparando a reimpressão sem alterar o estoque.')+'</p></body></html>');
      w.document.close();

      let consumed={already_consumed:true};
      if(consumeStock){
        await persistCurrentOrder();
        const blingReady=await validateBlingBeforeSeparation(o.id);
        if(!blingReady){
          try{w.close()}catch{}
          return;
        }
        consumed=await api('order_consume_stock',{},{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id})
        });
        await api('order_update',{},{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id,status:'processing'})
        });
      }
      const items=separationItems(detail);
      const groups=[];
    for(const item of items){
      const key=item.gondola_number??'none';
      let group=groups.find(g=>g.key===key);
      if(!group){group={key,label:item.gondola_number?'GÔNDOLA '+item.gondola_number:'SEM GÔNDOLA',shelves:[]};groups.push(group)}
      const shelfKey=item.shelf_label||'none';
      let shelf=group.shelves.find(s=>s.key===shelfKey);
      if(!shelf){shelf={key:shelfKey,label:item.shelf_label?'PRATELEIRA '+item.shelf_label:'SEM PRATELEIRA',items:[]};group.shelves.push(shelf)}
      shelf.items.push(item);
    }
    const sections=groups.map(g=>'<div class="gondola-title">'+esc(g.label)+'</div>'+g.shelves.map(s=>'<div class="shelf-title-print">'+esc(s.label)+'</div><div class="sep-grid">'+s.items.map(i=>'<div class="sep-card"><img src="'+esc(i.image_url||'/img/logoantonia5.png')+'" alt=""><div class="sep-name">'+esc(i.name)+'</div><div class="sep-qty">'+esc(fmtQty(i.quantity))+'×</div></div>').join('')+'</div>').join('')).join('');
      const body='<div class="ticket-head"><strong>DONA ANTÔNIA</strong><span>SEPARAÇÃO · Pedido #'+esc(shortOrder(o.order_number))+'</span><small>'+esc(dateTime(o.created_at))+'</small></div>'+sections+'<div class="foot">'+items.length+' produtos diferentes</div>';
      openPrint('Separação #'+shortOrder(o.order_number),body,'separation',w);
      if(consumeStock&&!consumed.already_consumed)toast('Separação iniciada · estoque atualizado');
      else if(consumeStock)toast('Separação retomada · estoque já estava atualizado');
      else toast('Separação reimpressa · nenhum estoque alterado');
      const fresh=await api('order',{id:o.id});state.currentOrder=fresh;
      await loadCurrentOrderFiscal(false);
      paintOrderDetail();loadOrders();
    }catch(e){
      try{w.close()}catch{}
      toast(errorMessage(e.message));
    }
  }
  function printDelivery(detail){
    const o=detail.order,c=detail.customer||{},a=o.delivery_address_snapshot||c.address||{},payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'—';
    const products=separationItems(detail).map(i=>'<div class="delivery-item"><b>'+esc(fmtQty(i.quantity))+'×</b><span>'+esc(i.name)+'</span></div>').join('');
    const address=[a.street,a.number,a.complement,a.district,a.city,a.state].filter(Boolean).join(', ')||a.raw_text||'NÃO INFORMADO';
    const body='<div class="ticket-head"><strong>DONA ANTÔNIA</strong><span>ENTREGA · Pedido #'+esc(shortOrder(o.order_number))+'</span><small>'+esc(dateTime(o.created_at))+'</small></div>'+
      '<div class="block"><b>CLIENTE</b><div>'+esc(c.display_name||a.recipient_name||'NÃO VINCULADO')+'</div>'+(c.phone?'<div>Tel: '+esc(formatPhone(c.phone))+'</div>':'')+(c.cpf?'<div>CPF: '+esc(formatCpf(c.cpf))+'</div>':'')+(c.email?'<div>E-mail: '+esc(c.email)+'</div>':'')+'</div>'+
      '<div class="block"><b>ENDEREÇO</b><div>'+esc(address)+'</div>'+(a.postal_code?'<div>CEP: '+esc(a.postal_code)+'</div>':'')+'</div>'+
      '<div class="block"><b>PAGAMENTO</b><div>'+esc(payment)+'</div><div>Status: '+esc(o.status||'')+'</div><div class="big-total">TOTAL: '+money(o.total_cents)+'</div></div>'+
      '<div class="block"><b>PRODUTOS</b>'+products+'</div>'+
      '<div class="block lines"><div>Observações:</div><br><br><div>Recebido por: __________________</div></div>';
    openPrint('Entrega #'+shortOrder(o.order_number),body,'delivery');
  }
  function openPrint(title,body,mode,existingWindow=null){
    const w=existingWindow||window.open('','_blank','width=420,height=700');
    if(!w){toast('Libere pop-ups para imprimir');return}
    const css='@page{size:80mm auto;margin:2mm}*{box-sizing:border-box}html,body{margin:0;padding:0;width:76mm;background:#fff;color:#000;font-family:Arial,sans-serif}body{font-size:10px}.ticket-head{text-align:center;border-bottom:1px dashed #000;padding:1mm 0 2mm;margin-bottom:2mm}.ticket-head strong{display:block;font-size:15px}.ticket-head span{display:block;font-weight:700;font-size:11px;margin-top:1mm}.ticket-head small{display:block;margin-top:.6mm}.gondola-title{font-weight:900;font-size:13px;border:2px solid #000;padding:1.5mm;margin:2mm 0 1.5mm;text-align:center}.shelf-title-print{font-weight:800;font-size:10px;border-bottom:1px solid #000;padding:1mm 0 .8mm;margin:1.5mm 0 1mm}.sep-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8mm}.sep-card{border:1px solid #000;padding:1mm;min-height:48mm;display:flex;flex-direction:column;align-items:center;text-align:center;break-inside:avoid}.sep-card img{width:32mm;height:26mm;object-fit:contain;filter:grayscale(1);margin:auto}.sep-name{font-weight:700;font-size:9px;line-height:1.15;min-height:10mm}.sep-qty{font-weight:900;font-size:20px;line-height:1}.foot{text-align:center;border-top:1px dashed #000;margin-top:2mm;padding-top:1.5mm}.block{border-bottom:1px dashed #000;padding:2mm 0}.block>b{display:block;font-size:10px;margin-bottom:1mm}.big-total{font-size:15px;font-weight:900;margin-top:1mm}.delivery-item{display:grid;grid-template-columns:9mm 1fr;gap:1mm;padding:1mm 0;border-bottom:1px dotted #777}.delivery-item b{font-size:11px}.lines{min-height:28mm}@media print{button{display:none!important}}';
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+css+'</style></head><body class="'+esc(mode)+'">'+body+'<script>window.addEventListener("load",()=>setTimeout(()=>window.print(),350));<\/script></body></html>');
    w.document.close();
  }

  function shortOrder(n){const s=String(n||'');return s.length>8?s.slice(-8):s}
  function phoneDigits(v){
    let d=String(v||'').replace(/\D/g,'');
    if((d.length===10||d.length===11)&&!d.startsWith('55'))d='55'+d;
    return d;
  }
  function formatPhone(v){
    const d=String(v||'').replace(/\D/g,'');
    const local=d.startsWith('55')?d.slice(2):d;
    if(local.length===11)return '('+local.slice(0,2)+') '+local.slice(2,7)+'-'+local.slice(7);
    if(local.length===10)return '('+local.slice(0,2)+') '+local.slice(2,6)+'-'+local.slice(6);
    return v||'';
  }
  function formatCpf(v){const d=String(v||'').replace(/\D/g,'');return d.length===11?d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9):v||''}
  function errorMessage(code){
    const map={name_required:'Informe o nome.',phone_already_in_use:'Telefone já pertence a outro cliente.',cpf_already_in_use:'CPF já pertence a outro cliente.',email_already_in_use:'E-mail já pertence a outro cliente.',duplicate_value:'Código, EAN ou outro valor já está em uso.',invalid_ean:'EAN inválido.',product_not_found:'Produto não encontrado para este EAN.',duplicate_ean:'Há mais de um produto com este EAN.',invalid_quantity:'Quantidade inválida.',invalid_expiration_date:'Data de validade inválida.',product_inactive:'Produto inativo não pode ter oferta ativa.',product_expired:'Produto vencido não pode ter oferta ativa.',invalid_offer_price:'O valor da oferta deve ser menor que o preço normal.',invalid_offer_duration:'Validade da oferta inválida.',invalid_gondola:'Número de gôndola inválido.',gondola_not_found:'Gôndola não encontrada.',order_cancelled:'Pedido cancelado não pode ser separado.',order_not_ready_for_separation:'Confirme o pedido antes de iniciar a separação.',invalid_component_replacement:'Não consegui identificar a troca.',order_component_edit_requires_created:'Só é possível substituir item enquanto o pedido está Novo.',order_stock_reserved_edit_forbidden:'Este pedido já tem estoque reservado. Cancele/reabra com cuidado antes de alterar itens.',component_edit_requires_basket:'Esta troca é permitida apenas dentro de uma cesta.',order_component_not_found:'Item da cesta não encontrado.',replacement_same_product:'Escolha um produto diferente.',replacement_duplicate_component:'Esse produto já existe nesta cesta.',replacement_product_unavailable:'O produto escolhido não está disponível.',replacement_insufficient_stock:'O produto escolhido também não tem estoque livre suficiente.',invalid_component_quantity:'Quantidade do item da cesta inválida.',insufficient_stock:'Estoque disponível insuficiente para confirmar este pedido. Faça um balanço ou ajuste o estoque.',insufficient_physical_stock:'Estoque físico insuficiente para separar este pedido. Faça um balanço ou ajuste o pedido.',stock_reservation_released:'A reserva deste pedido foi liberada. Reabra o pedido antes de separar.',stock_reservation_not_found:'Não encontrei a reserva de estoque deste pedido.',stock_consume_failed:'Não consegui dar baixa no estoque.',invalid_status_transition:'Este pedido precisa seguir a ordem normal das etapas.',stock_not_consumed_for_status:'Inicie ou regularize a separação antes de avançar.',order_operational_data_incomplete:'Complete cliente, endereço e pagamento antes de avançar.',legacy_order_read_only:'Este pedido é anterior ao corte operacional e ficou somente leitura.',fiscal_human_confirmation_required:'Confirme explicitamente a emissão fiscal.',fiscal_canary_not_armed_for_order:'Este pedido não está armado para emissão fiscal.',fiscal_canary_arm_race:'O canário fiscal mudou durante a operação. Atualize e tente novamente.',fiscal_human_issue_not_enabled:'A emissão fiscal humana ainda não está habilitada.',fiscal_operation_in_progress:'Outra emissão fiscal está em andamento. Aguarde e atualize.',fiscal_operation_lock_lost:'A trava de emissão fiscal mudou. Atualize antes de tentar novamente.',fiscal_dispatch_not_eligible:'O pedido ainda não está apto para emissão fiscal.',fiscal_generation_gate_closed:'A geração da NF-e está bloqueada pelo gate fiscal.',fiscal_generation_already_attempted:'A geração já foi tentada. O sistema não repetirá automaticamente.',invoice_generation_failed:'O Bling recusou a geração da NF-e. Revise os dados fiscais.',invoice_generation_uncertain:'O resultado da geração ficou incerto. O sistema não fará nova tentativa automática.',invoice_authorization_failed:'A NF-e foi gerada, mas a autorização precisa de revisão.',fiscal_document_not_authorized:'O DANFE só fica disponível depois da autorização da NF-e.',fiscal_document_access_key_missing:'A NF-e está autorizada, mas a chave de acesso ainda não foi localizada.',fiscal_document_download_failed:'Não consegui baixar o DANFE do Bling agora.',empty_danfe_document:'O Bling retornou um DANFE vazio.',invalid_danfe_pdf:'O documento retornado pelo Bling não é um PDF válido.',danfe_document_too_large:'O DANFE retornado é maior que o limite de segurança.',fiscal_document_empty:'O DANFE retornado está vazio.',bling_finance_scope_missing:'A autorização atual do Bling não liberou o módulo financeiro.',bling_finance_unavailable:'Não consegui consultar o financeiro do Bling agora.',fiscal_canary_failed:'O canário fiscal foi interrompido com segurança.'};
    return map[code]||'Não consegui salvar agora.';
  }

  const scanner={buffer:'',timer:null};
  document.addEventListener('keydown',e=>{
    if(!['balance','gondolas'].includes(state.tab))return;
    const tag=e.target?.tagName||'';
    if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
    if(/^\d$/.test(e.key)){
      scanner.buffer+=e.key;
      clearTimeout(scanner.timer);
      scanner.timer=setTimeout(()=>{scanner.buffer=''},900);
      e.preventDefault();
      return;
    }
    if(e.key==='Enter'){
      const ean=scanner.buffer;scanner.buffer='';clearTimeout(scanner.timer);
      if(ean.length>=4){
        if(state.tab==='balance')handleBalanceScan(ean);
        if(state.tab==='gondolas')handleGondolaScan(ean);
      }
      e.preventDefault();
    }
  });

  $('#closeEditor').onclick=()=>$('#editor').close();
  $('#editor').addEventListener('click',e=>{if(e.target===$('#editor'))$('#editor').close()});

  async function start(){
    try{
      await api('health');
      setTab('today');
    }catch(e){
      $('#content').innerHTML='<div class="empty">Não consegui abrir o Admin agora. <button class="text" id="retryAdmin">Tentar novamente</button></div>';
      if($('#retryAdmin'))$('#retryAdmin').onclick=()=>location.reload();
    }
  }
  start();
})();
