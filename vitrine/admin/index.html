  <title>Dona Antônia · Admin da Vitrine</title>

        <div class="brand"><strong>Dona Antônia · Operação</strong><small>Pedidos, estoque, expedição e entrega</small></div>
        <button class="operator-badge unset" id="operatorBadge" type="button" title="Identificação usada no histórico operacional"><span class="operator-prefix">Operador: </span><span class="operator-name">identificar</span></button>
        <a class="store-link" href="/vitrine/" target="_blank" rel="noopener">Abrir vitrine ↗</a>
      </div>
    </header>
      <nav class="admin-sidebar" id="adminNav" aria-label="Admin">
        <section class="admin-sidebar-section">
          <div class="admin-sidebar-title">Operação</div>
          <div class="admin-sidebar-list">
            <button class="admin-sidebar-item" data-tab="today" type="button"><span class="nav-item-icon" aria-hidden="true">⌂</span><span>Central</span></button>
            <button class="admin-sidebar-item" data-tab="attendance" type="button"><span class="nav-item-icon" aria-hidden="true">☏</span><span>Atendimento</span></button>
            <button class="admin-sidebar-item" data-tab="ana" type="button"><span class="nav-item-icon" aria-hidden="true">✦</span><span>ANA</span></button>
            <button class="admin-sidebar-item" data-tab="orders" type="button"><span class="nav-item-icon" aria-hidden="true">▤</span><span>Pedidos</span></button>
            <button class="admin-sidebar-item" data-tab="expedition" type="button"><span class="nav-item-icon" aria-hidden="true">↗</span><span>Expedição</span></button>
            <button class="admin-sidebar-item" data-tab="driver" type="button"><span class="nav-item-icon" aria-hidden="true">◆</span><span>Entregador</span></button>
            <button class="admin-sidebar-item" data-tab="closure" type="button"><span class="nav-item-icon" aria-hidden="true">◎</span><span>Fechamento</span></button>

        </section>
        <section class="admin-sidebar-section">
          <div class="admin-sidebar-title">Catálogo</div>

            <button class="admin-sidebar-item" data-tab="baskets" type="button"><span class="nav-item-icon" aria-hidden="true">◇</span><span>Cestas</span></button>

          </div>
        </section>
        <section class="admin-sidebar-section">
          <div class="admin-sidebar-title">Comercial</div>
          <div class="admin-sidebar-list">
            <button class="admin-sidebar-item" data-tab="quotes" type="button"><span class="nav-item-icon" aria-hidden="true">$</span><span>Orçamentos</span></button>
            <button class="admin-sidebar-item" data-tab="customers" type="button"><span class="nav-item-icon" aria-hidden="true">♙</span><span>Clientes</span></button>
            <button class="admin-sidebar-item" data-tab="marketing" type="button"><span class="nav-item-icon" aria-hidden="true">◉</span><span>Marketing</span></button>
          </div>
        </section>
        <section class="admin-sidebar-section">
          <div class="admin-sidebar-title">Estoque</div>
          <div class="admin-sidebar-list">
            <button class="admin-sidebar-item" data-tab="purchases" type="button"><span class="nav-item-icon" aria-hidden="true">↓</span><span>Compras/XML</span></button>
            <a class="admin-sidebar-item" href="/vitrine/admin/leitura-ean/" aria-label="Abrir Leitura EAN"><span class="nav-item-icon" aria-hidden="true">▥</span><span>Leitura EAN</span></a>
            <button class="admin-sidebar-item" data-tab="balance" type="button"><span class="nav-item-icon" aria-hidden="true">⌗</span><span>Balanço</span></button>
            <button class="admin-sidebar-item" data-tab="gondolas" type="button"><span class="nav-item-icon" aria-hidden="true">▦</span><span>Gôndolas</span></button>
          </div>
        </section>
        <section class="admin-sidebar-section">
          <div class="admin-sidebar-title">Sistema</div>
          <div class="admin-sidebar-list">
            <button class="admin-sidebar-item" data-tab="finance" type="button"><span class="nav-item-icon" aria-hidden="true">$</span><span>Financeiro</span></button>
            <button class="admin-sidebar-item" data-tab="bling" type="button"><span class="nav-item-icon" aria-hidden="true">⚙</span><span>Bling técnico</span></button>
            <a class="admin-sidebar-store" href="/vitrine/" target="_blank" rel="noopener"><span class="nav-item-icon" aria-hidden="true">↗</span><span>Abrir vitrine</span></a>
          </div>
        </section>

      <button class="admin-nav-backdrop" id="adminNavBackdrop" type="button" aria-label="Fechar menu" tabindex="-1"></button>
    <main class="wrap" id="content"></main>

  <div class="toast" id="toast"></div>
  <div class="order-chat-overlay" id="orderChatOverlay" hidden></div>
  <section class="order-chat-sheet" id="orderChatSheet" role="dialog" aria-modal="true" aria-labelledby="orderChatTitle" hidden>
    <header class="order-chat-head">
      <div class="order-chat-heading"><strong id="orderChatTitle">Conversa do cliente</strong><small id="orderChatSubtitle">Atendimento Dona Antônia</small></div>
      <button type="button" class="order-chat-close" id="orderChatClose" aria-label="Fechar conversa">×</button>
    </header>
    <iframe id="orderChatFrame" title="Atendimento do cliente" referrerpolicy="same-origin"></iframe>
  </section>




  <dialog id="editor">
    <div class="modal-head"><strong id="editorTitle">Editar</strong><button class="close" id="closeEditor" type="button" aria-label="Fechar">×</button></div>
    <div class="modal-body" id="editorBody"></div>
    <div class="modal-actions" id="editorActions"></div>
  </dialog>
