        <img class="logo" src="/img/logoantonia5.png" width="88" height="40" alt="Dona Antônia" fetchpriority="high">
        <div class="brand"><strong>Dona Antônia · Operação</strong><small>Pedidos, estoque, expedição e entrega</small></div>
        <a class="store-link" href="/vitrine/" target="_blank" rel="noopener">Abrir vitrine ↗</a>
      </div>
      <nav class="tabs wrap" aria-label="Admin">
        <button class="tab" data-tab="today" type="button">Hoje</button>
        <button class="tab" data-tab="orders" type="button">Pedidos</button>
        <button class="tab" data-tab="expedition" type="button">Expedição</button>
        <button class="tab" data-tab="products" type="button">Produtos</button>
        <button class="tab" data-tab="expiry" type="button">Validades</button>
        <button class="tab" data-tab="balance" type="button">Balanço</button>
        <button class="tab" data-tab="gondolas" type="button">Gôndolas</button>
        <button class="tab" data-tab="customers" type="button">Clientes</button>
        <button class="tab" data-tab="more" type="button">Mais</button>
      </nav>
    </header>
    <main class="wrap" id="content"></main>
  </div>

  <div class="toast" id="toast"></div>

  <dialog id="editor">
    <div class="modal-head"><strong id="editorTitle">Editar</strong><button class="close" id="closeEditor" type="button" aria-label="Fechar">×</button></div>
    <div class="modal-body" id="editorBody"></div>
    <div class="modal-actions" id="editorActions"></div>
  </dialog>

<script>
(()=>{
  const API='https://qxstkwshuvplmmftrctj.supabase.co/functions/v1/vitrine-admin-v1';
  const CUSTOMER_API='https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/admin-service-intelligence-v1';
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const fmtQty=n=>Number.isInteger(Number(n))?String(Number(n)):String(Number(n).toFixed(3)).replace(/\.?0+$/,'');
  const dateTime=v=>v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
  const state={tab:'today',orderFilter:'all',products:[],productOffset:0,productNext:null,productFilters:{category:'',subcategory:''},productFacets:{categories:[],subcategories:[]},expiryProducts:[],expirySummary:null,customers:[],customerProfile:null,customerHistoryOffset:0,orders:[],currentOrder:null,currentOrderBlingPreview:null,currentOrderFiscal:null,balanceProduct:null,balanceQty:'',balanceHistory:[],gondolas:[],gondola:null,gondolaProducts:[],gondolaCreateNumber:'',bling:null,blingProbe:null};
  function toast(msg){
    const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800);
  }
  async function api(action,params={},options={}){
    const u=new URL(API);u.searchParams.set('action',action);
    Object.entries(params).forEach(([k,v])=>{if(v!==''&&v!=null)u.searchParams.set(k,String(v))});
    const response=await fetch(u,{...options,headers:{...(options.headers||{})},cache:'no-store'});
    const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
    if(!response.ok||data.ok===false)throw new Error(data.error||'service_error');
    return data;
  }
  async function customerApi(action,payload={}){
    const response=await fetch(CUSTOMER_API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,...payload}),
      cache:'no-store'
    });
    const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
    if(!response.ok||data.ok===false)throw new Error(data.error||'service_error');
    return data;
  }
  function setTab(tab){
    state.tab=tab;
    document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    if(tab==='today')renderToday();
    if(tab==='products')renderProducts();
    if(tab==='expiry')renderExpirations();
    if(tab==='balance')renderBalance();
    if(tab==='gondolas')renderGondolas();
    if(tab==='customers')renderCustomers();
    if(tab==='bling')renderBling();
    if(tab==='orders')renderOrders();
    if(tab==='expedition')renderExpedition();
    if(tab==='more')renderMore();
  }
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

  function statusPill(status){
    const map={created:'Novo',storefront_received:'Recebido',confirmed:'Confirmado',sent_to_bling:'Bling',processing:'Separando',ready:'Pronto',out_for_delivery:'Em entrega',delivered:'Entregue',cancelled:'Cancelado',returned:'Devolvido'};
    const cls=status==='cancelled'?'danger':status==='created'?'warn':'';
    return '<span class="pill '+cls+'">'+esc(map[status]||status||'—')+'</span>';
  }

  function orderProblemReasons(o){
    const reasons=[];
    if(o?.history_sync?.state==='failed')reasons.push('Histórico do cliente pendente');
    if(!String(o?.customer_name||'').trim())reasons.push('Cliente não identificado');
    const a=o?.delivery_address_snapshot||{};
    if(!String(a.street||'').trim()||!String(a.number||'').trim()||!String(a.city||'').trim()||!String(a.state||'').trim())reasons.push('Endereço incompleto');
    const payment=o?.payment_method_snapshot?.label||o?.payment_method_snapshot?.method||'';
    if(!String(payment).trim())reasons.push('Pagamento não informado');
    return reasons;
  }
  function orderNextAction(o){
    const problems=orderProblemReasons(o);
    if(problems.length)return 'Corrigir: '+problems[0];
    const consumed=o?.payment_method_snapshot?.stock_consumed===true;
    const map={
      created:'Confirmar pedido',
      confirmed:consumed?'Continuar separação':'Iniciar separação',
      processing:consumed?'Finalizar separação':'Regularizar separação',
      ready:'Liberar para entrega',
      out_for_delivery:'Confirmar entrega',
      delivered:'Conferir pagamento / fiscal',
      cancelled:'Nenhuma ação'
    };
    return map[o?.status]||'Revisar pedido';
  }
  function orderFilterMatch(o,filter){
    if(filter==='all')return true;
    if(filter==='new')return o.status==='created';
    if(filter==='separate')return ['confirmed','processing'].includes(o.status);
    if(filter==='ready')return o.status==='ready';
    if(filter==='delivery')return o.status==='out_for_delivery';
    if(filter==='delivered')return o.status==='delivered';
    if(filter==='problems')return orderProblemReasons(o).length>0;
    return true;
  }
  function orderFilterCount(filter){return state.orders.filter(o=>orderFilterMatch(o,filter)).length}
  function renderTodayCards(){
    const cards=[
      ['new','Novos','Pedidos para confirmar'],
      ['separate','Separação','Pedidos para separar'],
      ['ready','Prontos','Aguardando saída'],
      ['delivery','Em entrega','Pedidos na rua'],
      ['delivered','Entregues','Conferir fechamento'],
      ['problems','Precisa de você','Pendências operacionais']
    ];
    return '<div class="ops-cards">'+cards.map(([key,label,sub])=>'<button class="ops-card '+(key==='problems'&&orderFilterCount(key)?'danger':'')+'" type="button" data-today-filter="'+key+'"><small>'+esc(label)+'</small><strong>'+orderFilterCount(key)+'</strong><span>'+esc(sub)+'</span></button>').join('')+'</div>';
  }
  async function renderToday(){
    const content=$('#content');
    content.innerHTML='<div class="page-head"><div><h1>Hoje</h1><p>O que precisa ser feito agora, em ordem operacional.</p></div><button class="secondary" id="refreshToday">Atualizar</button></div><div id="todayBody"><div class="loading">Carregando operação…</div></div>';
    $('#refreshToday').onclick=renderToday;
    try{
      const data=await api('orders');state.orders=data.orders||[];
      const host=$('#todayBody');
      host.innerHTML=renderTodayCards()+
        '<div class="panel"><div class="history-title" style="padding:14px 14px 0"><strong>Próximos pedidos</strong><span class="muted">prioridade para trabalho pendente</span></div><div id="todayOrders"></div></div>';
      host.querySelectorAll('[data-today-filter]').forEach(b=>b.onclick=()=>{state.orderFilter=b.dataset.todayFilter;setTab('orders')});
      const pending=state.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).slice(0,8);
      $('#todayOrders').innerHTML=pending.length?pending.map(o=>'<button class="history-row today-order-row" type="button" data-today-order="'+esc(o.id)+'"><strong>#'+esc(shortOrder(o.order_number))+'</strong><div class="history-main"><strong>'+esc(o.customer_name||'Sem cliente')+'</strong><small>'+money(o.total_cents)+' · '+esc(o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'Pagamento não informado')+'</small></div><span class="next-action">'+esc(orderNextAction(o))+'</span><span class="today-status">'+statusPill(o.status)+'</span></button>').join(''):'<div class="history-empty">Nenhum pedido pendente agora.</div>';
      host.querySelectorAll('[data-today-order]').forEach(b=>b.onclick=()=>openOrder(b.dataset.todayOrder));
    }catch(e){
      $('#todayBody').innerHTML='<div class="empty">Não consegui carregar o resumo operacional. <button class="text" id="retryToday">Tentar novamente</button></div>';
      if($('#retryToday'))$('#retryToday').onclick=renderToday;
    }
  }
  function expeditionRow(o){
    const a=o.delivery_address_snapshot||{};
    const address=[a.street,a.number,a.district,a.city].filter(Boolean).join(', ')||'Endereço não informado';
    const payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'Pagamento não informado';
    return '<button class="history-row dispatch-row" type="button" data-expedition-order="'+esc(o.id)+'">'+
      '<strong>#'+esc(shortOrder(o.order_number))+'</strong>'+
      '<div class="history-main"><strong>'+esc(o.customer_name||'Sem cliente')+'</strong><small>'+esc(address)+'</small></div>'+
      '<div class="history-main"><strong>'+money(o.total_cents)+'</strong><small>'+esc(payment)+'</small></div>'+
      '<span>'+statusPill(o.status)+'</span>'+
    '</button>';
  }
  function expeditionSection(title,subtitle,rows,empty){
    return '<section class="panel dispatch-section"><div class="history-title dispatch-head"><div><strong>'+esc(title)+'</strong><span>'+esc(subtitle)+'</span></div><b>'+rows.length+'</b></div>'+
      '<div>'+(rows.length?rows.map(expeditionRow).join(''):'<div class="history-empty">'+esc(empty)+'</div>')+'</div></section>';
  }
  async function renderExpedition(){
    const content=$('#content');
    content.innerHTML='<div class="page-head"><div><h1>Expedição</h1><p>Pedidos prontos, em entrega e entregues em uma única fila operacional.</p></div><button class="secondary" id="refreshExpedition">Atualizar</button></div><div id="expeditionBody"><div class="loading">Carregando expedição…</div></div>';
    $('#refreshExpedition').onclick=renderExpedition;
    try{
      const data=await api('orders');state.orders=data.orders||[];
      const ready=state.orders.filter(o=>o.status==='ready');
      const delivery=state.orders.filter(o=>o.status==='out_for_delivery');
      const delivered=state.orders.filter(o=>o.status==='delivered').slice(0,10);
      $('#expeditionBody').innerHTML='<div class="ops-cards">'+
        '<div class="ops-card"><small>Aguardando saída</small><strong>'+ready.length+'</strong><span>Pedidos já separados</span></div>'+
        '<div class="ops-card"><small>Em entrega</small><strong>'+delivery.length+'</strong><span>Pedidos na rua</span></div>'+
        '<div class="ops-card"><small>Entregues</small><strong>'+state.orders.filter(o=>o.status==='delivered').length+'</strong><span>Fechamento e fiscal</span></div>'+
      '</div>'+
      '<div class="dispatch-grid">'+
        expeditionSection('Aguardando saída','prontos para expedir',ready,'Nenhum pedido aguardando saída.')+
        expeditionSection('Em entrega','acompanhar até a confirmação',delivery,'Nenhum pedido em entrega.')+
        expeditionSection('Últimos entregues','pagamento e fiscal',delivered,'Nenhuma entrega concluída.')+
      '</div>';
      document.querySelectorAll('[data-expedition-order]').forEach(b=>b.onclick=()=>openOrder(b.dataset.expeditionOrder));
    }catch(e){
      $('#expeditionBody').innerHTML='<div class="empty">Não consegui carregar a expedição. <button class="text" id="retryExpedition">Tentar novamente</button></div>';
      if($('#retryExpedition'))$('#retryExpedition').onclick=renderExpedition;
    }
  }

  function renderMore(){
    const content=$('#content');
    content.innerHTML='<div class="page-head"><div><h1>Mais</h1><p>Configurações e ferramentas que não fazem parte da rotina principal.</p></div></div>'+
      '<div class="ops-cards">'+
        '<button class="ops-card" id="openBlingAdmin" type="button"><small>Integrações</small><strong style="font-size:18px">Bling</strong><span>Saúde, vínculos, filas e diagnóstico técnico.</span></button>'+
      '</div>';
    $('#openBlingAdmin').onclick=renderBling;
  }

  async function renderProducts(q=''){
    const content=$('#content');
    content.innerHTML='<div class="page-head"><div><h1>Produtos</h1><p>Consulte por categoria, subcategoria, nome, EAN ou código.</p></div><button class="primary" id="newProduct">+ Produto</button></div>'+
      '<div class="toolbar">'+
        '<input id="productSearch" type="search" placeholder="Buscar nome, EAN, código…">'+
        '<select id="productCategory" aria-label="Categoria"><option value="">Todas as categorias</option></select>'+
        '<select id="productSubcategory" aria-label="Subcategoria"><option value="">Todas as subcategorias</option></select>'+
        '<button class="secondary" id="productSearchBtn">Buscar</button>'+
      '</div>'+
      '<div class="panel"><div class="list-head products-layout"><span></span><span>Produto</span><span>Preço</span><span>Estoque</span><span>Status</span><span></span></div><div id="productRows"><div class="loading">Carregando…</div></div><div class="more" id="productMore"></div></div>';
    $('#newProduct').onclick=()=>openProductEditor();
    $('#productSearch').value=q;
    await loadProductFacets(state.productFilters.category);
    $('#productSearchBtn').onclick=()=>loadProducts($('#productSearch').value.trim(),false);
    $('#productSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();loadProducts(e.currentTarget.value.trim(),false)}};
    $('#productCategory').onchange=async e=>{
      state.productFilters.category=e.currentTarget.value;
      state.productFilters.subcategory='';
      await loadProductFacets(state.productFilters.category);
      await loadProducts($('#productSearch').value.trim(),false);
    };
    $('#productSubcategory').onchange=e=>{
      state.productFilters.subcategory=e.currentTarget.value;
      loadProducts($('#productSearch').value.trim(),false);
    };
    await loadProducts(q,false);
  }

  async function loadProductFacets(category=''){
    try{
      const data=await api('product_facets',{category});
      state.productFacets=data;
      const cat=$('#productCategory'),sub=$('#productSubcategory');
      if(cat){
        const current=state.productFilters.category;
        cat.innerHTML='<option value="">Todas as categorias</option>'+(data.categories||[]).map(x=>'<option value="'+esc(x.value)+'" '+(x.value===current?'selected':'')+'>'+esc(x.label)+' ('+esc(x.count)+')</option>').join('');
        cat.value=current;
      }
      if(sub){
        const current=state.productFilters.subcategory;
        sub.innerHTML='<option value="">Todas as subcategorias</option>'+(data.subcategories||[]).map(x=>'<option value="'+esc(x.value)+'" '+(x.value===current?'selected':'')+'>'+esc(x.label)+' ('+esc(x.count)+')</option>').join('');
        sub.value=current;
      }
    }catch(e){toast('Não consegui carregar os filtros de produtos')}
  }

  async function loadProducts(q='',append=false){
    const host=$('#productRows');if(!append)host.innerHTML='<div class="loading">Carregando…</div>';
    try{
      const offset=append?state.productNext||0:0;
      const data=await api('products',{
        q,
        category:state.productFilters.category,
        subcategory:state.productFilters.subcategory,
        offset,limit:60
      });
      state.products=append?[...state.products,...data.products]:data.products;
      state.productNext=data.next_offset;
      host.innerHTML=state.products.length?state.products.map(productRow).join(''):'<div class="empty">Nenhum produto encontrado com esses filtros.</div>';
      host.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>openProductEditor(state.products.find(p=>p.id===b.dataset.editProduct)));
      const more=$('#productMore');more.innerHTML=state.productNext!=null?'<button class="secondary" id="moreProducts">Mostrar mais</button>':'';
      if($('#moreProducts'))$('#moreProducts').onclick=()=>loadProducts(q,true);
    }catch(e){
      host.innerHTML='<div class="empty">Erro ao carregar produtos. <button class="text" id="retryProducts">Tentar novamente</button></div>';
      if($('#retryProducts'))$('#retryProducts').onclick=()=>loadProducts(q,false);
    }
  }

  function categoryLabel(value){
    const map={mercearia:'Mercearia',limpeza_lavanderia:'Limpeza e lavanderia',higiene_beleza:'Higiene e beleza',casa_pet:'Casa e pet'};
    return map[value]||value||'Sem categoria';
  }

  function productRow(p){
    const classification=[categoryLabel(p.category),p.detailed_subcategory||p.subcategory].filter(Boolean).join(' › ');
    const identity=[p.sku,p.gtin,p.packaging].filter(Boolean).join(' · ');
    return '<div class="list-row products-layout">'+
      '<img class="thumb" src="'+esc(p.image_url||'/img/logoantonia5.png')+'" alt="" loading="lazy">'+
      '<div><span class="row-title">'+esc(p.name)+'</span><span class="sub">'+esc(classification)+'</span>'+(identity?'<span class="sub">'+esc(identity)+'</span>':'')+'</div>'+
      '<span class="money mobile-wide">'+money(p.sale_price_cents)+'</span>'+
      '<span class="desktop-extra">'+esc(fmtQty(p.stock_quantity||0))+'</span>'+
      '<span class="desktop-extra">'+(p.active?'<span class="pill">Ativo</span>':'<span class="pill off">Inativo</span>')+'</span>'+
      '<button class="text" data-edit-product="'+esc(p.id)+'">Editar</button></div>';
  }

  function openProductEditor(p=null){
    const autoExpiry=Boolean(p?.auto_expiry_offer_enabled);
    const offer=p?.offer||null;
    const manualOffer=offer&&offer?.metadata?.source!=='expiry_auto'?offer:null;
    const regular=Number(p?.sale_price_cents||0);
    const derivedDiscount=manualOffer&&regular>0?Math.max(0,Math.round((1-Number(manualOffer.sale_price_cents||0)/regular)*1000)/10):'';
    const offerDiscount=manualOffer?.metadata?.discount_percent??derivedDiscount;
    const offerPrice=manualOffer?((Number(manualOffer.sale_price_cents||0)/100).toFixed(2)).replace('.',','):'';
    const offerDuration=manualOffer?.metadata?.duration_mode||'stock_zero';
    $('#editorTitle').textContent=p?'Editar produto':'Novo produto';
    $('#editorBody').innerHTML='<form id="productForm" class="form-grid">'+
      '<label class="span-2"><span>Nome *</span><input name="name" required value="'+esc(p?.name||'')+'"></label>'+
      '<label><span>Código / SKU</span><input name="sku" value="'+esc(p?.sku||'')+'"></label>'+
      '<label><span>EAN / GTIN</span><input name="gtin" inputmode="numeric" value="'+esc(p?.gtin||'')+'"></label>'+
      '<label><span>Preço de venda</span><input name="price" inputmode="decimal" value="'+esc(((Number(p?.sale_price_cents||0)/100).toFixed(2)).replace('.',','))+'"></label>'+
      '<label><span>Estoque</span><input name="stock" inputmode="decimal" value="'+esc(fmtQty(p?.stock_quantity||0))+'"></label>'+
      '<label><span>Data de validade</span><input name="expiration_date" type="date" value="'+esc(p?.expiration_date||'')+'"></label>'+
      '<label><span>Categoria da vitrine</span><select name="category">'+categoryOptions(p?.category||'')+'</select></label>'+
      '<label><span>Subcategoria</span><input name="subcategory" value="'+esc(p?.subcategory||'')+'"></label>'+
      '<label><span>Embalagem</span><input name="packaging" value="'+esc(p?.packaging||'')+'"></label>'+
      '<label class="span-2"><span>URL da imagem</span><input name="image_url" value="'+esc(p?.image_url||'')+'"></label>'+
      '<label class="span-2"><span>Descrição</span><textarea name="description">'+esc(p?.description||'')+'</textarea></label>'+
      '<label class="check span-2"><input name="active" type="checkbox" '+(p?.active!==false?'checked':'')+'><strong>Produto ativo na vitrine</strong></label>'+
      '<div class="section-title span-2">Oferta por validade</div>'+
      '<label class="check span-2"><input name="auto_expiry_offer_enabled" type="checkbox" '+(autoExpiry?'checked':'')+'><span><strong>Ativar oferta automática pela validade</strong><small>60–90 dias: 10% · 30–59 dias: 20% · menos de 30 dias: 40%</small></span></label>'+
      '<div class="section-title span-2">Oferta manual</div>'+
      '<div class="offer-note" id="autoOfferNote">'+(autoExpiry?'A oferta automática está ligada. Desative-a acima para configurar uma oferta manual.':'Você pode definir uma oferta manual. Ao ativá-la, a oferta automática por validade será desligada.')+'</div>'+
      '<label class="check span-2"><input name="offer_active" type="checkbox" '+(manualOffer?.active?'checked':'')+'><strong>Oferta manual ativa</strong></label>'+
      '<label><span>Desconto (%)</span><input name="offer_discount" type="number" min="1" max="95" step="0.1" inputmode="decimal" value="'+esc(offerDiscount)+'"></label>'+
      '<label><span>Valor da oferta</span><input name="offer_price" inputmode="decimal" value="'+esc(offerPrice)+'"></label>'+
      '<label class="span-2"><span>Validade da oferta</span><select name="offer_duration">'+offerDurationOptions(offerDuration)+'</select></label>'+
      '</form>';
    $('#editorActions').innerHTML='<button class="secondary" id="cancelEditor">Cancelar</button><button class="primary" id="saveProduct">Salvar produto</button>';
    $('#cancelEditor').onclick=()=>$('#editor').close();
    $('#saveProduct').onclick=()=>saveProduct(p?.id||'');
    $('#editor').showModal();

    const form=$('#productForm');
    const auto=form.querySelector('[name="auto_expiry_offer_enabled"]');
    const manualControls=[...form.querySelectorAll('[name="offer_active"],[name="offer_discount"],[name="offer_price"],[name="offer_duration"]')];
    const syncAutoState=()=>{
      const disabled=auto.checked;
      manualControls.forEach(el=>el.disabled=disabled);
      $('#autoOfferNote').textContent=disabled
        ?'A oferta automática está ligada. Desative-a acima para configurar uma oferta manual.'
        :'Você pode definir uma oferta manual. Ao ativá-la, a oferta automática por validade será desligada.';
    };
    auto.onchange=syncAutoState;
    syncAutoState();

    const discount=form.querySelector('[name="offer_discount"]');
    const offerPriceEl=form.querySelector('[name="offer_price"]');
    const regularPrice=form.querySelector('[name="price"]');
    discount.oninput=()=>{
      const base=centsFromInput(regularPrice.value),d=Number(discount.value);
      if(base>0&&Number.isFinite(d)&&d>0&&d<100)offerPriceEl.value=((Math.round(base*(100-d)/100))/100).toFixed(2).replace('.',',');
    };
    offerPriceEl.oninput=()=>{
      const base=centsFromInput(regularPrice.value),sale=centsFromInput(offerPriceEl.value);
      if(base>0&&sale>0&&sale<base)discount.value=(Math.round((1-sale/base)*1000)/10).toString();
    };
    regularPrice.oninput=()=>{if(discount.value)discount.oninput()};
  }

  function paintBling(){
    const host=$('#blingStatus');if(!host)return;
    const b=state.bling||{},cred=b.credentials||{},legacy=b.legacy||{},queue=b.hub_queue||{},domains=b.domains||{},probe=state.blingProbe||{},links=b.product_links||{},customerLinks=b.customer_links||{},orderLinks=b.order_links||{},webhooks=b.webhook_inbox||{},fiscal=b.fiscal_readiness||{},fiscalCfg=fiscal.config||{},fiscalControls=fiscal.controls||{},fiscalJobs=fiscal.jobs||{};
    const probes=probe.probes||{};
    const banner=$('#blingRuntimeBanner');
    if(banner){
      const active=[
        domains.products?'Produtos':null,
        domains.stock?'Estoque':null,
        domains.customers?'Clientes':null,
        domains.orders?'Pedidos':null
      ].filter(Boolean);
      const firstOrderCanary=Boolean(domains.orders)&&Number(orderLinks.matched||0)===0;
      const headline=b.hub_enabled
        ? 'Integração direta Bling ativa'
        : 'Integração direta Bling pausada';
      const detail=[
        active.length?'Ativos: '+active.join(', '):'Nenhum domínio de escrita ativo',
        firstOrderCanary?'Pedidos aguardando o primeiro canário real':'',
        domains.webhooks?'Webhooks ON':'Webhooks OFF',
        domains.fiscal?'Fiscal ON':'Fiscal OFF',
        'Make preservado e fora do novo runtime'
      ].filter(Boolean).join(' · ');
      banner.innerHTML='<strong>'+esc(headline)+'</strong><small>'+esc(detail)+'</small>';
    }
    const scope=(key,label)=>{
      const p=probes[key];
      if(!p)return '<div class="bling-scope"><strong>'+esc(label)+'</strong><small>Ainda não verificado</small></div>';
      const cls=p.ok?'ok-text':'danger-text';
      const txt=p.ok?'Acesso confirmado':p.insufficient_scope?'Escopo ausente':'HTTP '+esc(p.http_status||'erro');
      return '<div class="bling-scope"><strong>'+esc(label)+'</strong><small class="'+cls+'">'+txt+'</small></div>';
    };
    host.innerHTML=

  async function loadCustomerHistory(customerId,append=false){
    const offset=append?state.customerHistoryOffset:0;
    try{
      const data=await customerApi('vitrine_customer_history',{id:customerId,limit:20,offset});
      if(!append){
        state.customerProfile={customer:data.customer,summary:data.summary,orders:data.orders||[],top_products:data.top_products||[],next_offset:data.pagination?.next_offset??null};
      }else{
        state.customerProfile.orders=[...(state.customerProfile.orders||[]),...(data.orders||[])];
        state.customerProfile.next_offset=data.pagination?.next_offset??null;
      }
      state.customerHistoryOffset=data.pagination?.next_offset??offset;

    }catch(e){
      $('#editorBody').innerHTML='<div class="empty">Não consegui carregar o histórico deste cliente.<br><button class="text" id="retryCustomerHistory">Tentar novamente</button></div>';

  function orderFiscalHtml(f,o){
    if(!f)return '<div class="rule-notice"><strong>Carregando controle fiscal…</strong><div>Esta etapa não emite nota.</div></div>';
    if(f.error)return '<div class="rule-notice warn"><strong>Controle fiscal indisponível</strong><div>O pedido continua normal. Tente novamente depois.</div></div>';

    const delivered=f.delivery_status==='delivered';
    const paid=f.payment_status==='confirmed';
    const ready=f.fiscal_status==='ready';
    const issued=f.fiscal_status==='issued'||Boolean(f.bling_invoice_id);
    const fiscalLabel=issued?'Emitida':ready?'Pronto':f.fiscal_status==='review_required'?'Revisar':'Bloqueado';
    const reason=f.fiscal_block_reason?'<div class="sub" style="margin-top:5px">'+esc(fiscalBlockReasonLabel(f.fiscal_block_reason))+'</div>':'';
    const emissionOff=!f.config?.send_enabled;

    return '<div class="rule-notice">'+
      '<strong>Entrega '+(delivered?'✓':'pendente')+' · Pagamento '+(paid?'✓':'pendente')+' · Fiscal '+esc(fiscalLabel)+'</strong>'+
      '<div style="margin-top:5px">Total fiscal: '+money(f.total_cents||o.total_cents||0)+(paid&&f.settled_amount_cents!=null?' · Recebido: '+money(f.settled_amount_cents):'')+'</div>'+
      reason+
      (emissionOff?'<div class="sub" style="margin-top:5px">Emissão de NF-e permanece desligada nesta etapa. Nenhuma nota é enviada ao Bling automaticamente.</div>':'')+
      (issued&&f.bling_invoice_number?'<div class="sub" style="margin-top:5px">NF-e '+esc(f.bling_invoice_number)+'</div>':'')+
    '</div>';
  }

  function orderActionButtonsHtml(o){
    const consumed=o.payment_method_snapshot?.stock_consumed===true;
    let primary='';
    if(o.status==='created')primary='<button class="primary" id="advanceOrder" data-next="confirmed" type="button">Confirmar pedido</button>';
    else if(o.status==='confirmed'&&!consumed)primary='<button class="primary" id="startSeparation" type="button">Iniciar separação</button>';
    else if(o.status==='confirmed'&&consumed)primary='<button class="primary" id="advanceOrder" data-next="processing" type="button">Continuar separação</button>';
    else if(o.status==='processing'&&!consumed)primary='<button class="primary" id="startSeparation" type="button">Regularizar separação</button>';
    else if(o.status==='processing')primary='<button class="primary" id="advanceOrder" data-next="ready" type="button">Finalizar separação</button>';
    else if(o.status==='ready')primary='<button class="primary" id="advanceOrder" data-next="out_for_delivery" type="button">Marcar saída para entrega</button>';
    else if(o.status==='out_for_delivery')primary='<button class="primary" id="advanceOrder" data-next="delivered" type="button">Confirmar entrega</button>';
    const docs=[];
    if(consumed)docs.push('<button class="secondary" id="reprintSeparation" type="button">Reimprimir separação</button>');
    if(['ready','out_for_delivery','delivered'].includes(o.status))docs.push('<button class="secondary" id="printDelivery" type="button">Imprimir via do entregador</button>');
    const cancel=!['delivered','cancelled'].includes(o.status)?'<button class="text danger" id="cancelOrder" type="button">Cancelar pedido</button>':'';
    return '<div class="order-action-zone"><strong>'+esc(orderNextAction(o))+'</strong><small>Use a próxima ação abaixo; o sistema atualiza estoque e integrações quando necessário.</small><div class="print-actions">'+(primary||'')+docs.join('')+'</div>'+cancel+'</div>';
  }

  function currentOrderEditablePayload(status){
    const order=state.currentOrder?.order||{};
    const currentCustomer=state.currentOrder?.customer||{};
    const currentCustomerId=currentCustomer.source_customer_id||order.delivery_address_snapshot?.source_customer_id||order.customer_id||'';
    const id=order.id;
    const selectedId=$('#orderCustomer')?.value||'';
    const selectedCustomer=state.customers.find(c=>c.id===selectedId)||null;
    const payload={id,payment_method:$('#orderPayment')?.value||''};
    if(selectedCustomer)payload.customer_snapshot=selectedCustomer;
    else if(!currentCustomerId)payload.customer_snapshot=null;
    if(status)payload.status=status;
    return payload;
  }

  function separationItems(detail){
    const map=new Map();
    const add=(key,name,qty,image,gondola)=>{
      const k=key||name;const old=map.get(k);
      if(old)old.quantity+=Number(qty||0);
      else map.set(k,{name,quantity:Number(qty||0),image_url:image||'/img/logoantonia5.png',gondola_number:gondola??null});
    };
    for(const item of detail.items||[]){
      if(item.item_kind==='basket'&&item.components?.length){
        for(const c of item.components)add(c.product_id||c.name_snapshot,c.name_snapshot,Number(c.quantity)*Number(item.quantity),c.image_url,c.gondola_number);
      }else add(item.product_id||item.name_snapshot,item.name_snapshot,item.quantity,item.image_url,item.gondola_number);
    }
    return [...map.values()].sort((a,b)=>{
      const ga=a.gondola_number??999999,gb=b.gondola_number??999999;
      return ga-gb||a.name.localeCompare(b.name,'pt-BR');
    });
  }
  async function printSeparation(detail,consumeStock=false){
    const o=detail.order;
    const w=window.open('','_blank','width=420,height=700');
    if(!w){toast('Libere pop-ups para imprimir');return}
    try{
      w.document.open();
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Preparando separação</title></head><body style="font:16px system-ui;padding:30px;text-align:center"><strong>Preparando separação…</strong><p>'+(consumeStock?'Iniciando a separação e atualizando o estoque.':'Preparando a reimpressão sem alterar o estoque.')+'</p></body></html>');
      w.document.close();

      let consumed={already_consumed:true};
      if(consumeStock){
        await persistCurrentOrder();
        consumed=await api('order_consume_stock',{},{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id})
        });
        await api('order_update',{},{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id,status:'processing'})
        });
      }
      const items=separationItems(detail);
      const groups=[];
    for(const item of items){
      const key=item.gondola_number??'none';
      let group=groups.find(g=>g.key===key);
      if(!group){group={key,label:item.gondola_number?'GÔNDOLA '+item.gondola_number:'SEM GÔNDOLA',items:[]};groups.push(group)}
      group.items.push(item);
    }
    const sections=groups.map(g=>'<div class="gondola-title">'+esc(g.label)+'</div><div class="sep-grid">'+g.items.map(i=>'<div class="sep-card"><img src="'+esc(i.image_url||'/img/logoantonia5.png')+'" alt=""><div class="sep-name">'+esc(i.name)+'</div><div class="sep-qty">'+esc(fmtQty(i.quantity))+'×</div></div>').join('')+'</div>').join('');
      const body='<div class="ticket-head"><strong>DONA ANTÔNIA</strong><span>SEPARAÇÃO · Pedido #'+esc(shortOrder(o.order_number))+'</span><small>'+esc(dateTime(o.created_at))+'</small></div>'+sections+'<div class="foot">'+items.length+' produtos diferentes</div>';
      openPrint('Separação #'+shortOrder(o.order_number),body,'separation',w);
      if(consumeStock&&!consumed.already_consumed)toast('Separação iniciada · estoque atualizado');
      else if(consumeStock)toast('Separação retomada · estoque já estava atualizado');
      else toast('Separação reimpressa · nenhum estoque alterado');
      const fresh=await api('order',{id:o.id});state.currentOrder=fresh;
      await loadCurrentOrderFiscal(false);
      paintOrderDetail();loadOrders();
    }catch(e){
      try{w.close()}catch{}
      toast(errorMessage(e.message));
    }
  }
  function printDelivery(detail){
    const o=detail.order,c=detail.customer||{},a=c.address||o.delivery_address_snapshot||{},payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'—';
    const products=separationItems(detail).map(i=>'<div class="delivery-item"><b>'+esc(fmtQty(i.quantity))+'×</b><span>'+esc(i.name)+'</span></div>').join('');
    const address=[a.street,a.number,a.complement,a.district,a.city,a.state].filter(Boolean).join(', ')||a.raw_text||'NÃO INFORMADO';
    const body='<div class="ticket-head"><strong>DONA ANTÔNIA</strong><span>ENTREGA · Pedido #'+esc(shortOrder(o.order_number))+'</span><small>'+esc(dateTime(o.created_at))+'</small></div>'+
      '<div class="block"><b>CLIENTE</b><div>'+esc(c.display_name||a.recipient_name||'NÃO VINCULADO')+'</div>'+(c.phone?'<div>Tel: '+esc(formatPhone(c.phone))+'</div>':'')+(c.cpf?'<div>CPF: '+esc(formatCpf(c.cpf))+'</div>':'')+(c.email?'<div>E-mail: '+esc(c.email)+'</div>':'')+'</div>'+
      '<div class="block"><b>ENDEREÇO</b><div>'+esc(address)+'</div>'+(a.postal_code?'<div>CEP: '+esc(a.postal_code)+'</div>':'')+'</div>'+
      '<div class="block"><b>PAGAMENTO</b><div>'+esc(payment)+'</div><div>Status: '+esc(o.status||'')+'</div><div class="big-total">TOTAL: '+money(o.total_cents)+'</div></div>'+
      '<div class="block"><b>PRODUTOS</b>'+products+'</div>'+
      '<div class="block lines"><div>Observações:</div><br><br><div>Recebido por: __________________</div></div>';
    openPrint('Entrega #'+shortOrder(o.order_number),body,'delivery');
  }
  function openPrint(title,body,mode,existingWindow=null){
    const w=existingWindow||window.open('','_blank','width=420,height=700');
    if(!w){toast('Libere pop-ups para imprimir');return}
    const css='@page{size:80mm auto;margin:2mm}*{box-sizing:border-box}html,body{margin:0;padding:0;width:76mm;background:#fff;color:#000;font-family:Arial,sans-serif}body{font-size:10px}.ticket-head{text-align:center;border-bottom:1px dashed #000;padding:1mm 0 2mm;margin-bottom:2mm}.ticket-head strong{display:block;font-size:15px}.ticket-head span{display:block;font-weight:700;font-size:11px;margin-top:1mm}.ticket-head small{display:block;margin-top:.6mm}.gondola-title{font-weight:900;font-size:13px;border:2px solid #000;padding:1.5mm;margin:2mm 0 1.5mm;text-align:center}.sep-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8mm}.sep-card{border:1px solid #000;padding:1mm;min-height:48mm;display:flex;flex-direction:column;align-items:center;text-align:center;break-inside:avoid}.sep-card img{width:32mm;height:26mm;object-fit:contain;filter:grayscale(1);margin:auto}.sep-name{font-weight:700;font-size:9px;line-height:1.15;min-height:10mm}.sep-qty{font-weight:900;font-size:20px;line-height:1}.foot{text-align:center;border-top:1px dashed #000;margin-top:2mm;padding-top:1.5mm}.block{border-bottom:1px dashed #000;padding:2mm 0}.block>b{display:block;font-size:10px;margin-bottom:1mm}.big-total{font-size:15px;font-weight:900;margin-top:1mm}.delivery-item{display:grid;grid-template-columns:9mm 1fr;gap:1mm;padding:1mm 0;border-bottom:1px dotted #777}.delivery-item b{font-size:11px}.lines{min-height:28mm}@media print{button{display:none!important}}';
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+css+'</style></head><body class="'+esc(mode)+'">'+body+'<script>window.addEventListener("load",()=>setTimeout(()=>window.print(),350));<\/script></body></html>');
    w.document.close();
  }

  function shortOrder(n){const s=String(n||'');return s.length>8?s.slice(-8):s}
  function formatPhone(v){
    const d=String(v||'').replace(/\D/g,'');
    const local=d.startsWith('55')?d.slice(2):d;
    if(local.length===11)return '('+local.slice(0,2)+') '+local.slice(2,7)+'-'+local.slice(7);
    if(local.length===10)return '('+local.slice(0,2)+') '+local.slice(2,6)+'-'+local.slice(6);
    return v||'';
  }
  function formatCpf(v){const d=String(v||'').replace(/\D/g,'');return d.length===11?d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9):v||''}
  function errorMessage(code){
    const map={name_required:'Informe o nome.',phone_already_in_use:'Telefone já pertence a outro cliente.',cpf_already_in_use:'CPF já pertence a outro cliente.',email_already_in_use:'E-mail já pertence a outro cliente.',duplicate_value:'Código, EAN ou outro valor já está em uso.',invalid_ean:'EAN inválido.',product_not_found:'Produto não encontrado para este EAN.',duplicate_ean:'Há mais de um produto com este EAN.',invalid_quantity:'Quantidade inválida.',invalid_expiration_date:'Data de validade inválida.',invalid_offer_price:'O valor da oferta deve ser menor que o preço normal.',invalid_offer_duration:'Validade da oferta inválida.',invalid_gondola:'Número de gôndola inválido.',gondola_not_found:'Gôndola não encontrada.',order_cancelled:'Pedido cancelado não pode ser separado.',insufficient_physical_stock:'Estoque físico insuficiente para separar este pedido. Faça um balanço ou ajuste o pedido.',stock_reservation_released:'A reserva deste pedido foi liberada. Reabra o pedido antes de separar.',stock_reservation_not_found:'Não encontrei a reserva de estoque deste pedido.',stock_consume_failed:'Não consegui dar baixa no estoque.',invalid_status_transition:'Este pedido precisa seguir a ordem normal das etapas.',stock_not_consumed_for_status:'Inicie ou regularize a separação antes de avançar.'};
    return map[code]||'Não consegui salvar agora.';
  }

  const scanner={buffer:'',timer:null};
  document.addEventListener('keydown',e=>{
    if(!['balance','gondolas'].includes(state.tab))return;
    const tag=e.target?.tagName||'';
    if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
    if(/^\d$/.test(e.key)){
      scanner.buffer+=e.key;
      clearTimeout(scanner.timer);
      scanner.timer=setTimeout(()=>{scanner.buffer=''},900);
      e.preventDefault();
      return;
    }
    if(e.key==='Enter'){
      const ean=scanner.buffer;scanner.buffer='';clearTimeout(scanner.timer);
      if(ean.length>=4){
        if(state.tab==='balance')handleBalanceScan(ean);
        if(state.tab==='gondolas')handleGondolaScan(ean);
      }
      e.preventDefault();
    }
  });

  $('#closeEditor').onclick=()=>$('#editor').close();
  $('#editor').addEventListener('click',e=>{if(e.target===$('#editor'))$('#editor').close()});

  async function start(){
    try{
      await api('health');
      setTab('today');
    }catch(e){
      $('#content').innerHTML='<div class="empty">Não consegui abrir o Admin agora. <button class="text" id="retryAdmin">Tentar novamente</button></div>';
      if($('#retryAdmin'))$('#retryAdmin').onclick=()=>location.reload();
    }
  }
  start();
})();
</script>
