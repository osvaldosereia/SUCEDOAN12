<style>

  /* Compras/XML: lista de notas em primeiro plano, fluxo familiar ao Bling. */
  .purchase-simple-toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-bottom:10px}
  .purchase-toolbar-period{display:flex;flex-direction:column;gap:4px}
  .purchase-toolbar-period label{font-size:11px;font-weight:700;color:var(--muted)}
  .purchase-toolbar-period select{min-height:42px;min-width:160px}
  .purchase-custom-range{align-items:end;gap:8px;flex-wrap:wrap}
  .purchase-custom-range label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
  .purchase-custom-range input{min-height:42px}
  .purchase-toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .purchase-import-options{padding:11px 14px;margin:0 0 14px}
  .purchase-import-options summary,.purchase-extra summary{cursor:pointer;font-weight:700;font-size:12px}
  .purchase-import-options .purchase-toolbar-actions{margin:12px 0}
  .purchase-simple-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .purchase-simple-stats>div{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px}
  .purchase-simple-stats small{display:block;color:var(--muted);font-size:11px}
  .purchase-simple-stats strong{display:block;font-size:23px;line-height:1.25;margin-top:4px}
  .purchase-notes-panel{overflow:hidden}
  .purchase-notes-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}
  .purchase-notes-header>div:first-child{display:flex;flex-direction:column;gap:4px}
  .purchase-notes-search{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
  .purchase-notes-search input{min-width:220px;max-width:390px;flex:1}
  .purchase-notes-search select{min-width:150px}
  .purchase-simple-row{display:grid;grid-template-columns:minmax(90px,130px) minmax(140px,1fr) minmax(128px,170px) auto;gap:12px;align-items:center}
  .purchase-note-ref small,.purchase-note-status small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
  .purchase-note-status .pill{white-space:nowrap}
  .purchase-simple-row .purchase-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .purchase-simple-row .purchase-actions button{min-height:36px}
  .purchase-extra{margin-top:12px;padding:13px}
  .purchase-extra>summary{padding:3px 0}
  .purchase-extra>section,.purchase-extra>details{margin-top:12px}
  @media(max-width:800px){
    .purchase-simple-row{grid-template-columns:minmax(90px,120px) minmax(130px,1fr) auto}
    .purchase-simple-row .purchase-note-status{grid-column:2}
    .purchase-simple-row .purchase-actions{grid-column:3;grid-row:1/3}
  }
  @media(max-width:620px){
    .purchase-simple-toolbar{align-items:stretch}
    .purchase-toolbar-period{flex:1;min-width:130px}
    .purchase-toolbar-period select{width:100%}
    .purchase-toolbar-actions{width:100%}
    .purchase-toolbar-actions button{flex:1 1 140px}
    .purchase-simple-stats{gap:6px}
    .purchase-simple-stats>div{padding:10px}
    .purchase-simple-stats small{font-size:10px}
    .purchase-simple-stats strong{font-size:20px}
    .purchase-notes-search,.purchase-notes-search input,.purchase-notes-search select{width:100%;max-width:none;min-width:0}
    .purchase-simple-row{grid-template-columns:1fr auto;gap:8px}
    .purchase-simple-row .history-main,.purchase-simple-row .purchase-note-status{grid-column:1}
    .purchase-simple-row .purchase-actions{grid-column:2;grid-row:1/4;align-self:center;flex-direction:column}
    .purchase-simple-row .purchase-actions button{min-height:38px}
  }
  .purchase-source-note{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 13px;padding:0 4px}
  .purchase-source-note strong,.purchase-source-note b{color:var(--ink)}
  .purchase-sync-timestamp{font-size:11px;color:var(--muted);padding:0 3px;margin:-3px 0 12px}
  /* Consulta rápida do Atendimento a partir dos cards de Pedidos */
  .order-chat-overlay[hidden],.order-chat-sheet[hidden]{display:none!important}
  .order-chat-overlay{position:fixed;inset:0;z-index:6000;background:rgba(13,30,20,.55);opacity:0;transition:opacity .22s ease}
  .order-chat-overlay.open{opacity:1}
  .order-chat-sheet{position:fixed;z-index:6001;left:50%;bottom:0;width:min(1080px,100%);height:min(88dvh,920px);min-height:300px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #dae4dd;border-radius:20px 20px 0 0;background:#fff;box-shadow:0 -16px 56px rgba(14,38,23,.24);transform:translate(-50%,105%);transition:transform .23s ease}
  .order-chat-sheet.open{transform:translate(-50%,0)}
  .order-chat-head{flex:0 0 auto;min-height:60px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e2e9e4;background:#f6faf7}
  .order-chat-heading{min-width:0;display:flex;flex-direction:column;gap:2px}
  .order-chat-heading strong{color:#173f2a;font-size:15px}
  .order-chat-heading small{color:#66766c;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .order-chat-close{width:42px;height:42px;flex:0 0 auto;border:1px solid #d6e2d9;background:#fff;border-radius:12px;color:#263d30;font-size:24px;line-height:1}
  .order-chat-sheet iframe{border:0;width:100%;flex:1;min-height:0;background:#f6faf7}
  @media(max-width:700px){.order-chat-sheet{height:94dvh;height:94svh;border-radius:17px 17px 0 0}.order-chat-head{padding:8px 12px}.order-chat-heading strong{font-size:14px}.order-chat-close{width:40px;height:40px}}
  .purchase-review-reminder{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid #e7d9ad;border-radius:12px;background:#fffaf0;padding:13px 15px;margin:0 0 12px}
  .purchase-review-reminder strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
  .purchase-review-reminder small{display:block;line-height:1.5;font-size:11px;color:var(--muted)}
  .purchase-review-reminder.reviewed{background:#f6faf7;border-color:#d4e2d8}
  .purchase-review-actions{display:flex;gap:8px;flex-wrap:wrap}
  .purchase-review-actions button{min-height:40px}
  @media(max-width:620px){.purchase-review-actions{width:100%}.purchase-review-actions button{flex:1 1 125px}}
</style>
</head>
