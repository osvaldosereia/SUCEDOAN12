<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Dona Antônia · Admin da Vitrine</title>
  <link rel="preload" href="/img/logoantonia5.png" as="image">
  <link rel="preconnect" href="https://qxstkwshuvplmmftrctj.supabase.co" crossorigin>
  <style>
    :root{--ink:#18221c;--muted:#66716a;--line:#e5e9e6;--soft:#f5f7f5;--brand:#176b43;--brand2:#0f5836;--danger:#9d2235;--warn:#96650b;--radius:14px}
    *{box-sizing:border-box}
    html{background:#f7f8f7}
    body{margin:0;color:var(--ink);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8f7;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    .wrap{width:min(100%,1180px);margin:auto;padding-inline:14px}
    .top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
    .top-row{height:64px;display:flex;align-items:center;gap:10px}
    .logo{width:88px;height:40px;object-fit:contain}
    .brand{min-width:0;flex:1}.brand strong{font-size:18px;display:block}.brand small{color:var(--muted)}
    .store-link{min-height:42px;display:inline-flex;align-items:center;text-decoration:none;color:var(--brand);font-weight:800;padding:0 10px}
    .tabs{display:flex;gap:7px;overflow:auto;padding:0 14px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
    .tab{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 16px;font-weight:850;color:var(--ink);white-space:nowrap}
    .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
    main{padding-block:16px 80px}
    .page-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
    .page-head h1{font-size:24px;margin:0;letter-spacing:-.03em}.page-head p{margin:3px 0 0;color:var(--muted)}
    .toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}.toolbar input{min-width:0;flex:1}.toolbar select{width:auto;min-width:180px}.filter-count{color:var(--muted);font-size:11px}
    .field,input,select,textarea{width:100%}
    input,select,textarea{border:1px solid #dce2de;background:#fff;color:var(--ink);border-radius:11px;min-height:44px;padding:10px 11px;outline:none}
    textarea{min-height:86px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:#86a996;box-shadow:0 0 0 3px #eaf3ed}
    button.primary,.primary{border:0;background:var(--brand);color:#fff;border-radius:11px;min-height:44px;padding:0 15px;font-weight:900}
    button.primary:hover{background:var(--brand2)}
    button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;min-height:44px;padding:0 14px;font-weight:850}
    button.text{border:0;background:transparent;color:var(--brand);min-height:40px;padding:0 8px;font-weight:850}
    button.danger{color:var(--danger)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .list-head,.list-row{display:grid;align-items:center;gap:10px;padding:10px 12px}
    .list-head{background:var(--soft);color:var(--muted);font-size:12px;font-weight:800;border-bottom:1px solid var(--line)}
    .list-row{border-bottom:1px solid #eef1ef}.list-row:last-child{border-bottom:0}.list-row:hover{background:#fbfcfb}
    .products-layout{grid-template-columns:54px minmax(220px,1.7fr) minmax(110px,.6fr) minmax(100px,.5fr) minmax(95px,.45fr) 82px}
    .customers-layout{grid-template-columns:minmax(180px,1.3fr) minmax(130px,.8fr) minmax(110px,.7fr) minmax(150px,1fr) 82px}
    .orders-layout{grid-template-columns:95px 130px minmax(170px,1.2fr) 120px 150px 115px 82px}
    .thumb{width:48px;height:48px;border-radius:9px;border:1px solid var(--line);object-fit:contain;background:#fff}
    .row-title{font-weight:850}.sub{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .money{font-weight:900;font-size:15px}.muted{color:var(--muted)}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#edf5f0;color:#135938;font-size:11px;font-weight:900}
    .pill.off{background:#f1f1f1;color:#6f6f6f}.pill.warn{background:#fff5dd;color:#7c5407}.pill.danger{background:#fff0f2;color:#912035}
    .empty{padding:32px 18px;text-align:center;color:var(--muted)}
    .loading{padding:24px;text-align:center;color:var(--muted)}
    .more{padding:12px;text-align:center}
    dialog{width:min(96vw,760px);max-height:92vh;border:0;padding:0;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.22);color:var(--ink)}
    dialog::backdrop{background:rgba(15,23,18,.48)}
    .modal-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 14px}
    .modal-head strong{font-size:18px;flex:1}.close{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);font-size:20px}
    .modal-body{padding:14px;overflow:auto}.modal-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;padding:12px 14px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.span-2{grid-column:1/-1}
    label>span{display:block;font-size:12px;font-weight:800;color:#465149;margin-bottom:5px}
    .check{display:flex;align-items:center;gap:8px;min-height:44px}.check input{width:20px;height:20px;min-height:0}
    .section-title{font-size:15px;font-weight:900;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
    .order-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.summary-box{background:var(--soft);border-radius:12px;padding:10px}.summary-box small{display:block;color:var(--muted)}.summary-box strong{font-size:16px}
    .order-items{display:grid;gap:8px}.order-item{border:1px solid var(--line);border-radius:12px;padding:10px}.order-item-head{display:flex;justify-content:space-between;gap:10px}.composition{color:var(--muted);font-size:12px;margin-top:6px;padding-left:10px;border-left:2px solid var(--line)}
    .print-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.print-actions button{min-height:52px}
    .toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#18221c;color:#fff;border-radius:999px;padding:11px 16px;font-weight:800;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:780px){
      .wrap{padding-inline:10px}.top-row{height:58px}.logo{width:72px;height:34px}.store-link{font-size:12px}
      .page-head h1{font-size:21px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.toolbar select{flex:1 1 46%;min-width:0}
      .list-head{display:none}.list-row{display:grid!important;grid-template-columns:52px 1fr auto!important;gap:8px}
      .list-row>*{min-width:0}.list-row .mobile-wide{grid-column:2/4}.list-row .desktop-extra{display:none}
      .form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}
      .order-summary{grid-template-columns:1fr 1fr}.print-actions{grid-template-columns:1fr}
    }
  
    /* Material-like operational shell */
    :root{--ink:#202124;--muted:#5f6368;--line:#dadce0;--soft:#f8f9fa;--brand:#1a73e8;--brand2:#1558b0;--danger:#d93025;--warn:#b06000;--radius:8px}
    html,body{background:#f8f9fa}
    .wrap{width:min(100%,1240px);padding-inline:18px}
    .top{box-shadow:0 1px 2px rgba(60,64,67,.08)}
    .top-row{height:60px}
    .logo{width:74px;height:34px}
    .brand strong{font-size:17px;font-weight:600;letter-spacing:0}.brand small{font-size:12px}
    .store-link{color:#1967d2;font-weight:600;border-radius:4px}
    .tabs{gap:4px;padding:0 18px 8px}
    .tab{border:0;background:transparent;border-radius:6px;min-height:40px;padding:0 14px;font-weight:600;color:#3c4043}
    .tab:hover{background:#f1f3f4}.tab.active{background:#e8f0fe;color:#1967d2}
    main{padding-top:22px}
    .page-head{align-items:center;margin-bottom:16px}.page-head h1{font-size:22px;font-weight:600;letter-spacing:0}.page-head p{margin-top:5px}
    .panel{border-radius:8px;box-shadow:0 1px 2px rgba(60,64,67,.08)}
    input,select,textarea{border-radius:6px;min-height:42px}
    button.primary,.primary,button.secondary{border-radius:6px;font-weight:600}
    button.primary,.primary{background:#1a73e8}button.primary:hover{background:#1558b0}
    button.text{color:#1967d2;font-weight:600}
    .list-head{background:#f8f9fa}.row-title{font-weight:600}.money{font-weight:600}
    .tool-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.7fr);gap:16px;align-items:start}
    .tool-card{padding:20px}
    .scanner-hero{border:1px solid #d2e3fc;background:#f8fbff;border-radius:8px;padding:20px;text-align:center}
    .scanner-hero.ready{border-color:#b7dfc7;background:#f6fff8}
    .scan-dot{width:10px;height:10px;border-radius:50%;background:#188038;display:inline-block;margin-right:7px;box-shadow:0 0 0 5px rgba(24,128,56,.1)}
    .scan-title{font-size:13px;color:#5f6368;font-weight:600}.scan-value{font-size:26px;font-weight:600;margin-top:7px;word-break:break-word}.scan-sub{margin-top:6px;color:#5f6368}
    .qty-label{font-size:12px;color:#5f6368;font-weight:600;margin-top:18px}.qty-display{height:72px;border:1px solid #dadce0;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 22px;font-size:36px;font-weight:500;margin-top:7px}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.keypad button{height:58px;border:1px solid #dadce0;background:#fff;border-radius:8px;font-size:22px;font-weight:500;color:#202124}.keypad button:active{background:#e8f0fe}.keypad button.utility{font-size:16px;color:#5f6368;background:#f8f9fa}
    .confirm-wide{width:100%;height:58px;margin-top:10px;border:0;border-radius:8px;background:#188038;color:#fff;font-size:17px;font-weight:600}.confirm-wide:disabled,.keypad button:disabled{opacity:.4}
    .simple-list{display:grid}.simple-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #eceff1}.simple-row:last-child{border-bottom:0}.simple-main{min-width:0;flex:1}.simple-main strong{display:block;font-size:14px;font-weight:600}.simple-main small{display:block;color:#5f6368;margin-top:3px}.simple-number{font-variant-numeric:tabular-nums;font-weight:600}
    .gondola-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:12px}.gondola-card{border:1px solid #dadce0;background:#fff;border-radius:8px;padding:16px;text-align:left;min-height:112px}.gondola-card:hover{border-color:#a8c7fa;background:#f8fbff}.gondola-card strong{display:block;font-size:22px;font-weight:600}.gondola-card span{display:block;color:#5f6368;margin-top:7px;font-size:12px}
    .gondola-workspace{margin-bottom:16px}.gondola-badge{display:inline-flex;align-items:center;background:#e8f0fe;color:#1967d2;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;margin-bottom:10px}
    .big-number{height:76px;border:1px solid #dadce0;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding:0 22px;font-size:38px;font-weight:500;margin:10px 0 12px}
    .history-empty{padding:26px;text-align:center;color:#5f6368}
    .gondola-title-print{font-weight:900;font-size:13px;border:2px solid #000;padding:1.5mm;margin:2mm 0 1.5mm;text-align:center}
    @media(max-width:780px){.wrap{padding-inline:10px}.tabs{padding-inline:10px}.tool-grid{grid-template-columns:1fr}.tool-card{padding:14px}.keypad button{height:62px}.scan-value{font-size:22px}}

  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row wrap">
        <img class="logo" src="/img/logoantonia5.png" width="88" height="40" alt="Dona Antônia" fetchpriority="high">
        <div class="brand"><strong>Dona Antônia · Operação</strong><small>Vitrine, estoque e separação</small></div>
        <a class="store-link" href="/vitrine/" target="_blank" rel="noopener">Abrir vitrine ↗</a>
      </div>
      <nav class="tabs wrap" aria-label="Admin">
        <button class="tab" data-tab="orders" type="button">Pedidos</button>
        <button class="tab" data-tab="products" type="button">Produtos</button>
        <button class="tab" data-tab="balance" type="button">Balanço</button>
        <button class="tab" data-tab="gondolas" type="button">Gôndolas</button>
        <button class="tab" data-tab="customers" type="button">Clientes</button>
      </nav>
    </header>
    <main class="wrap" id="content"></main>
  </div>

  <div class="toast" id="toast"></div>

  <dialog id="editor">
    <div class="modal-head"><strong id="editorTitle">Editar</strong><button class="close" id="closeEditor" type="button" aria-label="Fechar">×</button></div>
    <div class="modal-body" id="editorBody"></div>
    <div class="modal-actions" id="editorActions"></div>
  </dialog>

<script>
(()=>{
  const API='https://qxstkwshuvplmmftrctj.supabase.co/functions/v1/vitrine-admin-v1';
  const CUSTOMER_API='https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/admin-service-intelligence-v1';
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const fmtQty=n=>Number.isInteger(Number(n))?String(Number(n)):String(Number(n).toFixed(3)).replace(/\.?0+$/,'');
  const dateTime=v=>v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
  const state={tab:'orders',products:[],productOffset:0,productNext:null,productFilters:{category:'',subcategory:''},productFacets:{categories:[],subcategories:[]},customers:[],orders:[],currentOrder:null,balanceProduct:null,balanceQty:'',balanceHistory:[],gondolas:[],gondola:null,gondolaProducts:[],gondolaCreateNumber:''};
  function toast(msg){
    const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800);
  }
  async function api(action,params={},options={}){
    const u=new URL(API);u.searchParams.set('action',action);
    Object.entries(params).forEach(([k,v])=>{if(v!==''&&v!=null)u.searchParams.set(k,String(v))});
    const response=await fetch(u,{...options,headers:{...(options.headers||{})},cache:'no-store'});
    const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
    if(!response.ok||data.ok===false)throw new Error(data.error||'service_error');
    return data;
  }
  async function customerApi(action,payload={}){
    const response=await fetch(CUSTOMER_API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,...payload}),
      cache:'no-store'
    });
    const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
    if(!response.ok||data.ok===false)throw new Error(data.error||'service_error');
    return data;
  }
  function setTab(tab){
    state.tab=tab;
    document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    if(tab==='products')renderProducts();
    if(tab==='balance')renderBalance();
    if(tab==='gondolas')renderGondolas();
    if(tab==='customers')renderCustomers();
    if(tab==='orders')renderOrders();
  }
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

  function statusPill(status){
    const map={created:'Novo',confirmed:'Confirmado',processing:'Separando',ready:'Pronto',out_for_delivery:'Em entrega',delivered:'Entregue',cancelled:'Cancelado'};
    const cls=status==='cancelled'?'danger':status==='created'?'warn':'';
    return '<span class="pill '+cls+'">'+esc(map[status]||status||'—')+'</span>';
  }

  async function renderProducts(q=''){
    const content=$('#content');
    content.innerHTML='<div class="page-head"><div><h1>Produtos</h1><p>Consulte por categoria, subcategoria, nome, EAN ou código.</p></div><button class="primary" id="newProduct">+ Produto</button></div>'+
      '<div class="toolbar">'+
        '<input id="productSearch" type="search" placeholder="Buscar nome, EAN, código…">'+
        '<select id="productCategory" aria-label="Categoria"><option value="">Todas as categorias</option></select>'+
        '<select id="productSubcategory" aria-label="Subcategoria"><option value="">Todas as subcategorias</option></select>'+
        '<button class="secondary" id="productSearchBtn">Buscar</button>'+
      '</div>'+
      '<div class="panel"><div class="list-head products-layout"><span></span><span>Produto</span><span>Preço</span><span>Estoque</span><span>Status</span><span></span></div><div id="productRows"><div class="loading">Carregando…</div></div><div class="more" id="productMore"></div></div>';
    $('#newProduct').onclick=()=>openProductEditor();
    $('#productSearch').value=q;
    await loadProductFacets(state.productFilters.category);
    $('#productSearchBtn').onclick=()=>loadProducts($('#productSearch').value.trim(),false);
    $('#productSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();loadProducts(e.currentTarget.value.trim(),false)}};
    $('#productCategory').onchange=async e=>{
      state.productFilters.category=e.currentTarget.value;
      state.productFilters.subcategory='';
      await loadProductFacets(state.productFilters.category);
      await loadProducts($('#productSearch').value.trim(),false);
    };
    $('#productSubcategory').onchange=e=>{
      state.productFilters.subcategory=e.currentTarget.value;
      loadProducts($('#productSearch').value.trim(),false);
    };
    await loadProducts(q,false);
  }

  async function loadProductFacets(category=''){
    try{
      const data=await api('product_facets',{category});
      state.productFacets=data;
      const cat=$('#productCategory'),sub=$('#productSubcategory');
      if(cat){
        const current=state.productFilters.category;
        cat.innerHTML='<option value="">Todas as categorias</option>'+(data.categories||[]).map(x=>'<option value="'+esc(x.value)+'" '+(x.value===current?'selected':'')+'>'+esc(x.label)+' ('+esc(x.count)+')</option>').join('');
        cat.value=current;
      }
      if(sub){
        const current=state.productFilters.subcategory;
        sub.innerHTML='<option value="">Todas as subcategorias</option>'+(data.subcategories||[]).map(x=>'<option value="'+esc(x.value)+'" '+(x.value===current?'selected':'')+'>'+esc(x.label)+' ('+esc(x.count)+')</option>').join('');
        sub.value=current;
      }
    }catch(e){toast('Não consegui carregar os filtros de produtos')}
  }

  async function loadProducts(q='',append=false){
    const host=$('#productRows');if(!append)host.innerHTML='<div class="loading">Carregando…</div>';
    try{
      const offset=append?state.productNext||0:0;
      const data=await api('products',{
        q,
        category:state.productFilters.category,
        subcategory:state.productFilters.subcategory,
        offset,limit:60
      });
      state.products=append?[...state.products,...data.products]:data.products;
      state.productNext=data.next_offset;
      host.innerHTML=state.products.length?state.products.map(productRow).join(''):'<div class="empty">Nenhum produto encontrado com esses filtros.</div>';
      host.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>openProductEditor(state.products.find(p=>p.id===b.dataset.editProduct)));
      const more=$('#productMore');more.innerHTML=state.productNext!=null?'<button class="secondary" id="moreProducts">Mostrar mais</button>':'';
      if($('#moreProducts'))$('#moreProducts').onclick=()=>loadProducts(q,true);
    }catch(e){
      host.innerHTML='<div class="empty">Erro ao carregar produtos. <button class="text" id="retryProducts">Tentar novamente</button></div>';
      if($('#retryProducts'))$('#retryProducts').onclick=()=>loadProducts(q,false);
    }
  }

  function categoryLabel(value){
    const map={mercearia:'Mercearia',limpeza_lavanderia:'Limpeza e lavanderia',higiene_beleza:'Higiene e beleza',casa_pet:'Casa e pet'};
    return map[value]||value||'Sem categoria';
  }

  function productRow(p){
    const classification=[categoryLabel(p.category),p.detailed_subcategory||p.subcategory].filter(Boolean).join(' › ');
    const identity=[p.sku,p.gtin,p.packaging].filter(Boolean).join(' · ');
    return '<div class="list-row products-layout">'+
      '<img class="thumb" src="'+esc(p.image_url||'/img/logoantonia5.png')+'" alt="" loading="lazy">'+
      '<div><span class="row-title">'+esc(p.name)+'</span><span class="sub">'+esc(classification)+'</span>'+(identity?'<span class="sub">'+esc(identity)+'</span>':'')+'</div>'+
      '<span class="money mobile-wide">'+money(p.sale_price_cents)+'</span>'+
      '<span class="desktop-extra">'+esc(fmtQty(p.stock_quantity||0))+'</span>'+
      '<span class="desktop-extra">'+(p.active?'<span class="pill">Ativo</span>':'<span class="pill off">Inativo</span>')+'</span>'+
      '<button class="text" data-edit-product="'+esc(p.id)+'">Editar</button></div>';
  }

  function openProductEditor(p=null){
    $('#editorTitle').textContent=p?'Editar produto':'Novo produto';
    $('#editorBody').innerHTML='<form id="productForm" class="form-grid">'+
      '<label class="span-2"><span>Nome *</span><input name="name" required value="'+esc(p?.name||'')+'"></label>'+
      '<label><span>Código / SKU</span><input name="sku" value="'+esc(p?.sku||'')+'"></label>'+

  function balanceKey(key){
    if(!state.balanceProduct)return;
    if(key==='clear') state.balanceQty='';

    else if(/^\d$/.test(key) && state.balanceQty.length<7) state.balanceQty=(state.balanceQty==='0'?'':state.balanceQty)+key;

  }

  function paintBalance(){
    if(state.tab!=='balance')return;

      qty.textContent=state.balanceQty||'0';
      confirm.disabled=state.balanceQty==='';
    }else{
      hero.className='scanner-hero';
      hero.innerHTML='<div class="scan-title"><span class="scan-dot"></span>AGUARDANDO EAN</div><div class="scan-value">Leia um produto</div><div class="scan-sub">Depois use somente o teclado numérico abaixo.</div>';
      qty.textContent='—';confirm.disabled=true;

      '<div class="simple-row"><div class="simple-main"><strong>'+esc(x.name)+'</strong><small>'+esc(x.gtin||'')+(x.gondola_number?' · Gôndola '+esc(x.gondola_number):'')+'</small></div><div class="simple-number">'+esc(fmtQty(x.stock_quantity))+'</div></div>'

  async function openOrder(id){
    $('#editorTitle').textContent='Pedido';
    $('#editorBody').innerHTML='<div class="loading">Carregando pedido…</div>';
    $('#editorActions').innerHTML='<button class="secondary" id="cancelEditor">Fechar</button>';
    $('#cancelEditor').onclick=()=>$('#editor').close();
    $('#editor').showModal();
    try{
      const data=await api('order',{id});state.currentOrder=data;
      if(!state.customers.length){try{const c=await customerApi('vitrine_customers_list',{limit:150});state.customers=c.customers||[]}catch{}}
      const sourceId=data.customer?.source_customer_id||data.order?.delivery_address_snapshot?.source_customer_id||'';
      if(sourceId&&!state.customers.some(c=>c.id===sourceId)){
        try{const one=await customerApi('vitrine_customer_get',{id:sourceId});if(one.customer)state.customers.push(one.customer)}catch{}
      }
      paintOrderDetail();
    }catch(e){$('#editorBody').innerHTML='<div class="empty">Não consegui abrir este pedido.</div>'}
  }
  function paintOrderDetail(){
    const d=state.currentOrder,o=d.order,c=d.customer||{},payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'';
    const currentCustomerId=c.source_customer_id||o.delivery_address_snapshot?.source_customer_id||o.customer_id||'';
    $('#editorTitle').textContent='Pedido #'+shortOrder(o.order_number);
    $('#editorBody').innerHTML=
      '<div class="order-summary"><div class="summary-box"><small>Total</small><strong>'+money(o.total_cents)+'</strong></div><div class="summary-box"><small>Data</small><strong>'+esc(dateTime(o.created_at))+'</strong></div><div class="summary-box"><small>Itens</small><strong>'+esc(String(d.items?.length||0))+'</strong></div></div>'+
      '<div class="form-grid">'+
        '<label><span>Status</span><select id="orderStatus">'+orderStatusOptions(o.status)+'</select></label>'+
        '<label><span>Forma de pagamento</span><select id="orderPayment">'+paymentOptions(payment)+'</select></label>'+
        '<label class="span-2"><span>Cliente</span><select id="orderCustomer"><option value="">Sem cliente vinculado</option>'+customerOptions(currentCustomerId)+'</select></label>'+
      '</div>'+
      '<div class="section-title">Itens do pedido</div>'+
      '<div class="order-items">'+(d.items||[]).map(orderItemHtml).join('')+'</div>'+
      '<div class="section-title">Cliente / entrega</div>'+
      '<div>'+customerSummary(c,o.delivery_address_snapshot)+'</div>'+
      '<div class="print-actions"><button class="primary" id="printSeparation">Imprimir separação 80 mm</button><button class="secondary" id="printDelivery">Imprimir via do entregador</button></div>';
    $('#editorActions').innerHTML='<button class="secondary" id="cancelEditor">Fechar</button><button class="primary" id="saveOrder">Salvar pedido</button>';
    $('#cancelEditor').onclick=()=>$('#editor').close();
    $('#saveOrder').onclick=saveOrder;
    $('#printSeparation').onclick=()=>printSeparation(d);
    $('#printDelivery').onclick=()=>printDelivery(d);
  }
  function orderItemHtml(i){
    const comp=i.components?.length?'<div class="composition">'+i.components.map(c=>fmtQty(Number(c.quantity)*Number(i.quantity))+'× '+esc(c.name_snapshot)).join('<br>')+'</div>':'';
    return '<div class="order-item"><div class="order-item-head"><strong>'+fmtQty(i.quantity)+'× '+esc(i.name_snapshot)+'</strong><b>'+money(i.total_cents)+'</b></div>'+comp+'</div>';
  }
  function customerOptions(current){
    return state.customers.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===current?'selected':'')+'>'+esc(c.display_name||'Sem nome')+(c.phone?' · '+esc(formatPhone(c.phone)):'')+'</option>').join('');
  }
  function orderStatusOptions(current){
    return [['created','Novo'],['confirmed','Confirmado'],['processing','Separando'],['ready','Pronto'],['out_for_delivery','Em entrega'],['delivered','Entregue'],['cancelled','Cancelado']].map(([v,l])=>'<option value="'+v+'" '+(v===current?'selected':'')+'>'+l+'</option>').join('');
  }
  function paymentOptions(current){
    return ['PIX','Dinheiro','Cartão de crédito','Cartão alimentação/refeição'].map(v=>'<option value="'+esc(v)+'" '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join('');
  }
  async function saveOrder(){
    const btn=$('#saveOrder');btn.disabled=true;btn.textContent='Salvando…';
    try{
      const id=state.currentOrder.order.id;
      const selectedId=$('#orderCustomer').value;
      const selectedCustomer=state.customers.find(c=>c.id===selectedId)||null;
      await api('order_update',{},{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id,status:$('#orderStatus').value,payment_method:$('#orderPayment').value,customer_snapshot:selectedCustomer})
      });
      const fresh=await api('order',{id});state.currentOrder=fresh;paintOrderDetail();toast('Pedido salvo');loadOrders();
    }catch(e){toast(errorMessage(e.message));btn.disabled=false;btn.textContent='Salvar pedido'}
  }

  function customerSummary(c,snapshot){
    const a=c?.address||snapshot||{};
    if(!c?.id&&!snapshot)return '<span class="muted">Cliente ainda não vinculado. Cadastre em Clientes e selecione acima.</span>';
    const address=[a.street,a.number,a.complement,a.district,a.city,a.state].filter(Boolean).join(', ')||a.raw_text||'Endereço não informado';
    return '<strong>'+esc(c.display_name||a.recipient_name||'Cliente')+'</strong><br>'+
      (c.phone?'Telefone: '+esc(formatPhone(c.phone))+'<br>':'')+
      (c.cpf?'CPF: '+esc(formatCpf(c.cpf))+'<br>':'')+
      (c.email?'E-mail: '+esc(c.email)+'<br>':'')+
      'Endereço: '+esc(address);
  }

  function separationItems(detail){
    const map=new Map();
    const add=(key,name,qty,image,gondola)=>{
      const k=key||name;const old=map.get(k);
      if(old)old.quantity+=Number(qty||0);
      else map.set(k,{name,quantity:Number(qty||0),image_url:image||'/img/logoantonia5.png',gondola_number:gondola??null});
    };
    for(const item of detail.items||[]){
      if(item.item_kind==='basket'&&item.components?.length){
        for(const c of item.components)add(c.product_id||c.name_snapshot,c.name_snapshot,Number(c.quantity)*Number(item.quantity),c.image_url,c.gondola_number);
      }else add(item.product_id||item.name_snapshot,item.name_snapshot,item.quantity,item.image_url,item.gondola_number);
    }
    return [...map.values()].sort((a,b)=>{
      const ga=a.gondola_number??999999,gb=b.gondola_number??999999;
      return ga-gb||a.name.localeCompare(b.name,'pt-BR');
    });
  }
  async function printSeparation(detail){
    const o=detail.order;
    const w=window.open('','_blank','width=420,height=700');
    if(!w){toast('Libere pop-ups para imprimir');return}
    try{
      w.document.open();
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Preparando separação</title></head><body style="font:16px system-ui;padding:30px;text-align:center"><strong>Preparando separação…</strong><p>Atualizando o estoque antes de imprimir.</p></body></html>');
      w.document.close();

      const consumed=await api('order_consume_stock',{},{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id})
      });
      const items=separationItems(detail);
      const groups=[];
    for(const item of items){
      const key=item.gondola_number??'none';
      let group=groups.find(g=>g.key===key);
      if(!group){group={key,label:item.gondola_number?'GÔNDOLA '+item.gondola_number:'SEM GÔNDOLA',items:[]};groups.push(group)}
      group.items.push(item);
    }
    const sections=groups.map(g=>'<div class="gondola-title">'+esc(g.label)+'</div><div class="sep-grid">'+g.items.map(i=>'<div class="sep-card"><img src="'+esc(i.image_url||'/img/logoantonia5.png')+'" alt=""><div class="sep-name">'+esc(i.name)+'</div><div class="sep-qty">'+esc(fmtQty(i.quantity))+'×</div></div>').join('')+'</div>').join('');
      const body='<div class="ticket-head"><strong>DONA ANTÔNIA</strong><span>SEPARAÇÃO · Pedido #'+esc(shortOrder(o.order_number))+'</span><small>'+esc(dateTime(o.created_at))+'</small></div>'+sections+'<div class="foot">'+items.length+' produtos diferentes</div>';
      openPrint('Separação #'+shortOrder(o.order_number),body,'separation',w);
      if(!consumed.already_consumed)toast('Estoque baixado e separação liberada');
      else toast('Separação reimpressa · estoque já estava baixado');
      const fresh=await api('order',{id:o.id});state.currentOrder=fresh;paintOrderDetail();loadOrders();
    }catch(e){
      try{w.close()}catch{}
      toast(errorMessage(e.message));
    }
  }
  function printDelivery(detail){
    const o=detail.order,c=detail.customer||{},a=c.address||o.delivery_address_snapshot||{},payment=o.payment_method_snapshot?.label||o.payment_method_snapshot?.method||'—';
    const products=separationItems(detail).map(i=>'<div class="delivery-item"><b>'+esc(fmtQty(i.quantity))+'×</b><span>'+esc(i.name)+'</span></div>').join('');
    const address=[a.street,a.number,a.complement,a.district,a.city,a.state].filter(Boolean).join(', ')||a.raw_text||'NÃO INFORMADO';
    const body='<div class="ticket-head"><strong>DONA ANTÔNIA</strong><span>ENTREGA · Pedido #'+esc(shortOrder(o.order_number))+'</span><small>'+esc(dateTime(o.created_at))+'</small></div>'+
      '<div class="block"><b>CLIENTE</b><div>'+esc(c.display_name||a.recipient_name||'NÃO VINCULADO')+'</div>'+(c.phone?'<div>Tel: '+esc(formatPhone(c.phone))+'</div>':'')+(c.cpf?'<div>CPF: '+esc(formatCpf(c.cpf))+'</div>':'')+(c.email?'<div>E-mail: '+esc(c.email)+'</div>':'')+'</div>'+
      '<div class="block"><b>ENDEREÇO</b><div>'+esc(address)+'</div>'+(a.postal_code?'<div>CEP: '+esc(a.postal_code)+'</div>':'')+'</div>'+
      '<div class="block"><b>PAGAMENTO</b><div>'+esc(payment)+'</div><div>Status: '+esc(o.status||'')+'</div><div class="big-total">TOTAL: '+money(o.total_cents)+'</div></div>'+
      '<div class="block"><b>PRODUTOS</b>'+products+'</div>'+
      '<div class="block lines"><div>Observações:</div><br><br><div>Recebido por: __________________</div></div>';
    openPrint('Entrega #'+shortOrder(o.order_number),body,'delivery');
  }
  function openPrint(title,body,mode,existingWindow=null){
    const w=existingWindow||window.open('','_blank','width=420,height=700');
    if(!w){toast('Libere pop-ups para imprimir');return}
    const css='@page{size:80mm auto;margin:2mm}*{box-sizing:border-box}html,body{margin:0;padding:0;width:76mm;background:#fff;color:#000;font-family:Arial,sans-serif}body{font-size:10px}.ticket-head{text-align:center;border-bottom:1px dashed #000;padding:1mm 0 2mm;margin-bottom:2mm}.ticket-head strong{display:block;font-size:15px}.ticket-head span{display:block;font-weight:700;font-size:11px;margin-top:1mm}.ticket-head small{display:block;margin-top:.6mm}.gondola-title{font-weight:900;font-size:13px;border:2px solid #000;padding:1.5mm;margin:2mm 0 1.5mm;text-align:center}.sep-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8mm}.sep-card{border:1px solid #000;padding:1mm;min-height:48mm;display:flex;flex-direction:column;align-items:center;text-align:center;break-inside:avoid}.sep-card img{width:32mm;height:26mm;object-fit:contain;filter:grayscale(1);margin:auto}.sep-name{font-weight:700;font-size:9px;line-height:1.15;min-height:10mm}.sep-qty{font-weight:900;font-size:20px;line-height:1}.foot{text-align:center;border-top:1px dashed #000;margin-top:2mm;padding-top:1.5mm}.block{border-bottom:1px dashed #000;padding:2mm 0}.block>b{display:block;font-size:10px;margin-bottom:1mm}.big-total{font-size:15px;font-weight:900;margin-top:1mm}.delivery-item{display:grid;grid-template-columns:9mm 1fr;gap:1mm;padding:1mm 0;border-bottom:1px dotted #777}.delivery-item b{font-size:11px}.lines{min-height:28mm}@media print{button{display:none!important}}';
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+css+'</style></head><body class="'+esc(mode)+'">'+body+'<script>window.addEventListener("load",()=>setTimeout(()=>window.print(),350));<\/script></body></html>');
    w.document.close();
  }

  function shortOrder(n){const s=String(n||'');return s.length>8?s.slice(-8):s}
  function formatPhone(v){
    const d=String(v||'').replace(/\D/g,'');
    const local=d.startsWith('55')?d.slice(2):d;
    if(local.length===11)return '('+local.slice(0,2)+') '+local.slice(2,7)+'-'+local.slice(7);
    if(local.length===10)return '('+local.slice(0,2)+') '+local.slice(2,6)+'-'+local.slice(6);
    return v||'';
  }
  function formatCpf(v){const d=String(v||'').replace(/\D/g,'');return d.length===11?d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9):v||''}
  function errorMessage(code){
    const map={name_required:'Informe o nome.',phone_already_in_use:'Telefone já pertence a outro cliente.',cpf_already_in_use:'CPF já pertence a outro cliente.',email_already_in_use:'E-mail já pertence a outro cliente.',duplicate_value:'Código, EAN ou outro valor já está em uso.',invalid_ean:'EAN inválido.',product_not_found:'Produto não encontrado para este EAN.',duplicate_ean:'Há mais de um produto com este EAN.',invalid_quantity:'Quantidade inválida.',invalid_gondola:'Número de gôndola inválido.',gondola_not_found:'Gôndola não encontrada.',order_cancelled:'Pedido cancelado não pode ser separado.',insufficient_physical_stock:'Estoque físico insuficiente para separar este pedido. Faça um balanço ou ajuste o pedido.',stock_reservation_released:'A reserva deste pedido foi liberada. Reabra o pedido antes de separar.',stock_reservation_not_found:'Não encontrei a reserva de estoque deste pedido.',stock_consume_failed:'Não consegui dar baixa no estoque.'};
    return map[code]||'Não consegui salvar agora.';
  }

  const scanner={buffer:'',timer:null};
  document.addEventListener('keydown',e=>{
    if(!['balance','gondolas'].includes(state.tab))return;
    const tag=e.target?.tagName||'';
    if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
    if(/^\d$/.test(e.key)){
      scanner.buffer+=e.key;
      clearTimeout(scanner.timer);
      scanner.timer=setTimeout(()=>{scanner.buffer=''},900);
      e.preventDefault();
      return;
    }
    if(e.key==='Enter'){
      const ean=scanner.buffer;scanner.buffer='';clearTimeout(scanner.timer);
      if(ean.length>=4){
        if(state.tab==='balance')handleBalanceScan(ean);
        if(state.tab==='gondolas')handleGondolaScan(ean);
      }
      e.preventDefault();
    }
  });

  $('#closeEditor').onclick=()=>$('#editor').close();
  $('#editor').addEventListener('click',e=>{if(e.target===$('#editor'))$('#editor').close()});

  async function start(){
    try{
      await api('health');
      setTab('orders');
    }catch(e){
      $('#content').innerHTML='<div class="empty">Não consegui abrir o Admin agora. <button class="text" id="retryAdmin">Tentar novamente</button></div>';
      if($('#retryAdmin'))$('#retryAdmin').onclick=()=>location.reload();
    }
  }
  start();
})();
</script>
</body>
</html>
