      const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);

      const key=String(date.month).padStart(2,'0')+'-'+String(date.day).padStart(2,'0');

    function stockNumber(value){const n=Number(value);return Number.isFinite(n)?Math.max(0,n):null}
    function knownStock(productId,fallback=null){const listed=state.productsById.get(productId),listedStock=stockNumber(listed?.stock_quantity);if(listedStock!==null)return listedStock;for(const item of state.cart){if(item.type==='product'&&item.id===productId){const n=stockNumber(item.stock_quantity);if(n!==null)return n}for(const c of item.components||[])if(c.product_id===productId){const n=stockNumber(c.stock_quantity);if(n!==null)return n}}return stockNumber(fallback)}
    function basketGroupChanged(item,group){if(!item?.split_mode)return false;const rows=(item.components||[]).filter(c=>c.component_group===group);return rows.some(c=>Number(c.quantity||0)!==Number(c.base_quantity||0))}

    function cartDemandForProduct(productId,excludeItemIndex=-1){let total=0;state.cart.forEach((item,index)=>{if(index===excludeItemIndex)return;if(item.type==='product'&&item.id===productId)total+=Number(item.qty||0);if(item.type==='basket_mold'){for(const comp of item.components||[])if(comp.product_id===productId)total+=Number(comp.quantity||0)*Number(item.qty||0);return}if(item.type!=='basket')return;for(const comp of item.components||[]){if(comp.product_id!==productId)continue;if(item.split_mode){const changed=basketGroupChanged(item,comp.component_group);if(changed)total+=Number(comp.quantity||0)*Number(item.qty||0)}else{const extra=Math.max(0,Number(comp.quantity||0)-Number(comp.base_quantity||0));total+=extra*Number(item.qty||0)}}});return total}
    function remainingStock(productId,excludeItemIndex=-1,fallback=null){const stock=knownStock(productId,fallback);return stock===null?null:Math.max(0,stock-cartDemandForProduct(productId,excludeItemIndex))}
    function splitBasketGroupLooseCapacity(item,itemIndex,group){const rows=(item.components||[]).filter(c=>c.component_group===group&&Number(c.quantity||0)>0);if(!rows.length)return 30;let max=30;for(const comp of rows){const remaining=remainingStock(comp.product_id,itemIndex,comp.stock_quantity);if(remaining!==null)max=Math.min(max,Math.floor((remaining+1e-9)/Number(comp.quantity||1)))}return Math.max(0,max)}
    function maxBasketQty(item,itemIndex){if(item?.type==='basket_mold'){let max=30;for(const comp of item.components||[]){const remaining=remainingStock(comp.product_id,itemIndex,comp.stock_quantity);if(remaining!==null)max=Math.min(max,Math.floor((remaining+1e-9)/Math.max(.001,Number(comp.quantity||1))))}return Math.max(0,max)}if(item?.split_mode){let max=30;const foodChanged=basketGroupChanged(item,'food');if(foodChanged)max=Math.min(max,splitBasketGroupLooseCapacity(item,itemIndex,'food'));else max=Math.min(max,Math.max(0,Math.floor(Number(item.food_lot_quantity||item.basket_stock_quantity||0)-cartLotUsed(item.food_lot_id,itemIndex,'food'))));if(item.uses_hygiene_kit){const hygieneChanged=basketGroupChanged(item,'hygiene');if(hygieneChanged)max=Math.min(max,splitBasketGroupLooseCapacity(item,itemIndex,'hygiene'));else max=Math.min(max,Math.max(0,Math.floor(Number(item.hygiene_lot_quantity||item.basket_stock_quantity||0)-cartLotUsed(item.hygiene_lot_id,itemIndex,'hygiene'))))}return Math.max(0,max)}if(item?.lot_id)return Math.max(0,Math.min(30,Math.floor(Number(item.basket_stock_quantity||0)-cartLotUsed(item.lot_id,itemIndex,''))));const comps=(item.components||[]).filter(c=>Number(c.quantity||0)>0);if(!comps.length)return 0;let max=30;for(const comp of comps){const base=Number(comp.base_quantity||0),extra=Math.max(0,Number(comp.quantity||0)-base),remaining=remainingStock(comp.product_id,itemIndex,comp.stock_quantity);if(extra>0&&remaining!==null)max=Math.min(max,Math.floor((remaining+1e-9)/extra))}return Math.max(0,max)}

    async function api(action,params={},options={}){

      const attempts=retryableRead&&!options.signal?2:1;
      for(let attempt=0;attempt<attempts;attempt++){
        const controller=options.signal?null:new AbortController();
        const timeoutMs=action==='home_priority'?6000:retryableRead?9000:12000;
        const timer=controller?setTimeout(()=>controller.abort(),timeoutMs):null;

    function checkoutComponentQty(key,delta){const [itemIndex,componentIndex]=String(key).split(':').map(Number),item=state.cart[itemIndex],component=item?.components?.[componentIndex];if(!item||!component)return;const previous=Number(component.quantity||0),remaining=remainingStock(component.product_id,itemIndex,component.stock_quantity),basketQty=Math.max(1,Number(item.qty||1));let max=remaining===null?30:Math.max(0,Math.floor((remaining+1e-9)/basketQty));if(!item.split_mode){const base=Number(component.base_quantity||0);max=Math.max(base,base+max)}else if(component.max_quantity!=null)max=Math.min(max,Number(component.max_quantity));const next=Math.max(0,Math.min(max,previous+delta));if(delta>0&&next===previous){toast('Limite do estoque disponível.');return}component.quantity=next;if(item.split_mode){const group=component.component_group,changed=basketGroupChanged(item,group);if(changed){const enough=(item.components||[]).filter(c=>c.component_group===group).every(c=>{const avail=remainingStock(c.product_id,itemIndex,c.stock_quantity);return avail===null||Number(c.quantity||0)*basketQty<=avail});if(!enough){component.quantity=previous;toast('Essa personalização não tem estoque disponível suficiente.');return}}item.food_changed=basketGroupChanged(item,'food');item.hygiene_changed=basketGroupChanged(item,'hygiene')}saveCart();paintCheckout();const old=state.checkoutQuoteTimers.get(itemIndex);if(old)clearTimeout(old);state.checkoutQuoteTimers.set(itemIndex,setTimeout(()=>requoteCheckoutBasket(itemIndex),160))}
