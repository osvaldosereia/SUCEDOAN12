<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Vitrine rápida Dona Antônia. Cestas básicas, ofertas e produtos para entrega em Cuiabá e Várzea Grande.">
  <title>Dona Antônia · Vitrine rápida</title>
  <link rel="preload" href="/img/logoantonia5.png" as="image">
  <link rel="preconnect" href="https://qxstkwshuvplmmftrctj.supabase.co" crossorigin>
  <link rel="preconnect" href="https://ssbesxgaijknwsjbsbcz.supabase.co" crossorigin>
  <style>
    :root{--ink:#18221c;--muted:#66716a;--line:#e7ebe8;--soft:#f6f8f6;--brand:#176b43;--brand2:#0f5836;--offer:#b31e2d;--radius:16px;--shadow:0 10px 30px rgba(16,40,25,.08)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#fff}
    body{margin:0;color:var(--ink);background:#fff;font:15px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    .wrap{width:min(100%,1180px);margin:auto;padding-inline:14px}
    .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
    .top-row{height:64px;display:flex;align-items:center;gap:10px}
    .logo{width:88px;height:40px;object-fit:contain}
    .brand{min-width:0;flex:1}.brand strong{display:block;font-size:18px;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
    .cart-top{min-height:44px;border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:9px 12px;font-weight:850;display:flex;align-items:center;gap:7px}
    .badge{min-width:24px;height:24px;border-radius:999px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;padding:0 6px}
    .top-search{padding-bottom:8px}
    .global-search{display:flex;gap:7px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px}
    .global-search:focus-within{border-color:#9ab7a7;box-shadow:0 0 0 3px #edf5f0}
    .global-search input{min-width:0;flex:1;min-height:44px;border:0;background:transparent;padding:0 10px;outline:none;font-size:16px}
    .global-search button{min-width:68px;min-height:44px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:850}
    .nav-shell{overflow:auto;scrollbar-width:none;border-top:1px solid #f3f4f3}.nav-shell::-webkit-scrollbar{display:none}
    .nav-wrap{min-width:0}
    .nav{display:flex;gap:8px;padding:8px 0 10px;width:max-content;min-width:100%}
    .chip{min-height:44px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 13px;font-weight:750;white-space:nowrap}
    .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
    .section{padding:20px 0;content-visibility:auto;contain-intrinsic-size:500px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
    .section-head h2{font-size:21px;letter-spacing:-.02em;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .text-btn{min-height:44px;border:0;background:transparent;color:var(--brand);font-weight:800;padding:8px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;min-width:0}
    .photo{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden}
    .photo img{width:100%;height:100%;object-fit:contain;padding:4px}
    .card-body{padding:10px}
    .name{font-weight:800;font-size:14px;line-height:1.22;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .meta{display:block;color:var(--muted);font-size:12px;margin-top:4px;min-height:16px}
    .price{font-size:18px;font-weight:900;margin-top:7px;letter-spacing:-.02em}
    .old{color:#888;text-decoration:line-through;font-size:11px;font-weight:600;margin-left:5px}
    .offer-tag{display:inline-flex;background:#fff1f2;color:var(--offer);border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;margin-bottom:5px}
    .product-action{margin-top:9px}
    .add{width:100%;min-height:46px;border:0;border-radius:11px;background:var(--brand);color:#fff;padding:10px 8px;font-weight:900}
    .add:active{background:var(--brand2);transform:translateY(1px)}
    .card-qty{min-height:46px;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;border:1px solid #bdd2c5;border-radius:11px;overflow:hidden;background:#f7fbf8}
    .card-qty button{height:46px;border:0;background:transparent;color:var(--brand);font-size:22px;font-weight:900}
    .card-qty b{text-align:center;font-size:15px}
    .basket-card .name{font-size:15px;min-height:37px}
    .category-list{display:grid;gap:9px}
    .category{width:100%;min-height:58px;display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-weight:850}
    .category span{color:var(--muted);font-size:19px}
    .empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
    .loader{height:220px;border-radius:var(--radius);background:linear-gradient(90deg,#f5f6f5 25%,#fafbfa 37%,#f5f6f5 63%);background-size:400% 100%;animation:load 1.1s infinite}
    .deferred-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .deferred-grid .loader{height:290px}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @keyframes load{0%{background-position:100% 0}100%{background-position:0 0}}
    .cartbar{position:fixed;z-index:25;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);transform:translateY(120%);transition:transform .18s ease}
    .cartbar.show{transform:none}.cartbar-inner{width:min(100%,980px);margin:auto;display:flex;align-items:center;gap:10px}.cartbar-copy{min-width:0;flex:1}.cartbar-copy small{display:block;color:var(--muted)}.cartbar-copy strong{font-size:17px}.cartbar button{border:0;border-radius:13px;background:var(--brand);color:#fff;font-weight:900;padding:13px 18px}
    .spacer{height:92px}
    .overlay{position:fixed;z-index:60;inset:0;background:rgba(8,18,12,.46);display:none;align-items:end}.overlay.open{display:flex}
    .sheet{background:#fff;width:100%;max-height:min(88dvh,760px);border-radius:22px 22px 0 0;overflow:hidden;box-shadow:var(--shadow)}
    .sheet-inner{width:min(100%,720px);margin:auto;max-height:min(88dvh,760px);display:flex;flex-direction:column}
    .sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.sheet-head strong{font-size:18px;flex:1}.close{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);font-size:21px}
    .sheet-scroll{padding:14px;overflow:auto;overscroll-behavior:contain}
    .basket-hero{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center;margin-bottom:14px}.basket-hero img{width:100px;height:100px;object-fit:contain;border:1px solid var(--line);border-radius:14px}.basket-hero h3{font-size:19px;margin:0 0 5px}.basket-total{font-size:22px;font-weight:950}
    .items{border-top:1px solid var(--line)}.item-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item-row strong{font-size:13px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:18px;font-weight:900}.qty b{min-width:24px;text-align:center}
    .sheet-action{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.action-stack{display:grid;gap:8px}.primary,.secondary{width:100%;min-height:50px;border-radius:14px;font-weight:950;padding:12px}.primary{border:0;background:var(--brand);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
    .cart-list{display:grid;gap:11px}.cart-line{border:1px solid var(--line);border-radius:14px;padding:11px}.cart-line-top{display:flex;align-items:start;gap:10px}.cart-line-top>div:first-child{flex:1}.cart-line small{color:var(--muted)}.cart-controls{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.remove{min-height:44px;border:0;background:transparent;color:#9a2231;font-weight:800;padding:8px 0}
    .composition{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:12px;color:#455148}.composition div+div{margin-top:4px}
    .checkout-title{margin:16px 0 8px;font-size:15px}
    .checkout-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
    .checkout-item-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 9px;border-bottom:1px solid var(--line);min-height:66px}
    .checkout-item-row:last-child{border-bottom:0}
    .checkout-thumb{width:52px;height:52px;border:0;border-radius:10px;background:#fff;padding:0;overflow:hidden}
    .checkout-thumb img{width:100%;height:100%;object-fit:contain}
    .checkout-copy{min-width:0}
    .checkout-name{display:block;width:100%;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-size:12px;font-weight:800;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .checkout-meta{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .checkout-qty{display:grid;grid-template-columns:36px 30px 36px;align-items:center;border:1px solid #cbd8cf;border-radius:10px;overflow:hidden;background:#f8faf8}
    .checkout-qty button{width:36px;height:38px;border:0;background:transparent;color:var(--brand);font-size:18px;font-weight:950;padding:0}
    .checkout-qty b{text-align:center;font-size:13px}
    .checkout-basket{border-bottom:1px solid var(--line)}
    .checkout-basket-head{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 9px;background:var(--soft)}
    .checkout-basket-head img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff}
    .checkout-basket-head strong{font-size:12px;line-height:1.15}
    .checkout-basket-items{padding-left:14px}
    .checkout-basket-items .checkout-item-row{grid-template-columns:44px minmax(0,1fr) auto;min-height:58px;border-left:2px solid #e2e9e4}
    .checkout-basket-items .checkout-thumb{width:44px;height:44px}
    .checkout-total{display:flex;justify-content:space-between;padding:11px 12px;background:var(--soft);font-weight:950;font-size:16px}
    .payments{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pay{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px;font-size:12px;min-height:44px}.pay input{width:17px;height:17px;accent-color:var(--brand);flex:0 0 auto}
    .note{font-size:11px;color:var(--muted);margin:9px 0 0}
    .product-open{border:0;background:transparent;padding:0;display:block;width:100%;text-align:inherit;color:inherit}
    .product-open.photo{cursor:pointer}
    .detail-photo{width:min(100%,420px);aspect-ratio:1/1;margin:0 auto 14px;background:#fff;border-radius:16px;overflow:hidden}
    .detail-photo img{width:100%;height:100%;object-fit:contain}
    .detail-title{font-size:20px;line-height:1.18;margin:0 0 6px}.detail-price{font-size:22px;font-weight:950;margin:0 0 12px}.detail-description{font-size:13px;line-height:1.45;color:#435048;margin:0 0 14px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.detail-attr{border:1px solid var(--line);border-radius:10px;padding:8px}.detail-attr small{display:block;color:var(--muted);font-size:10px}.detail-attr strong{display:block;font-size:12px;margin-top:2px;overflow-wrap:anywhere}
    .toast{position:fixed;z-index:90;left:50%;bottom:96px;transform:translate(-50%,20px);background:#18221c;color:#fff;padding:10px 13px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;font-weight:750;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
    footer{border-top:1px solid var(--line);padding:22px 0 110px;color:var(--muted);font-size:12px}
    @media(min-width:760px){
      .top-row{height:56px}
      .top-search{padding-bottom:6px}
      .nav{padding-top:6px;padding-bottom:8px}
      .section{padding:14px 0}
      .section-head{margin-bottom:9px}
      .grid,.deferred-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
      .basket-card .card-body{padding:8px}
      .basket-card .name{font-size:14px;min-height:34px}
      .basket-card .price{margin-top:4px}
      .basket-card .add{min-height:44px;padding:8px}
      .sheet{border-radius:22px 22px 0 0}
      .category-list{grid-template-columns:repeat(2,1fr)}
    }
    @media(min-width:1080px){.grid,.deferred-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}}
    @media(min-width:1200px){.grid,.deferred-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <img class="logo" src="/img/logoantonia5.png" width="88" height="40" alt="Dona Antônia" fetchpriority="high" decoding="async">
      <div class="brand"><strong>Dona Antônia</strong><small>Entrega em Cuiabá e Várzea Grande</small></div>
      <button class="cart-top" id="cartTop" type="button" aria-label="Ver pedido">Pedido <span class="badge" id="cartBadge">0</span></button>
    </div>
    <form class="top-search wrap" id="globalSearchForm" role="search">
      <div class="global-search">
        <input id="globalSearchInput" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" aria-label="Buscar produtos" placeholder="Buscar arroz, shampoo, sabão…">
        <button type="submit">Buscar</button>
      </div>
    </form>
    <div class="nav-shell"><div class="nav-wrap wrap"><nav class="nav" id="nav" aria-label="Seções da vitrine"></nav></div></div>
  </header>

  <main class="wrap">
    <div id="content">
      <section class="section"><div class="grid"><div class="loader"></div><div class="loader"></div></div></section>
    </div>
    <div class="spacer"></div>
  </main>

  <footer><div class="wrap">Pagamento na entrega. Pedido sujeito à confirmação de disponibilidade pela equipe Dona Antônia.</div></footer>

  <div class="cartbar" id="cartbar">
    <div class="cartbar-inner">
      <div class="cartbar-copy"><small>Seu pedido</small><strong id="cartSummary" aria-live="polite">0 itens</strong></div>
      <button type="button" id="openCart">Conferir</button>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-inner">
        <div class="sheet-head"><strong id="sheetTitle">Pedido</strong><button class="close" id="closeSheet" type="button" aria-label="Fechar">×</button></div>
        <div class="sheet-scroll" id="sheetBody"></div>
        <div class="sheet-action" id="sheetAction"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  (() => {
    'use strict';

    const API = 'https://qxstkwshuvplmmftrctj.supabase.co/functions/v1/simple-storefront-v1';
    const LEGACY_PRODUCT_API = 'https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/admin-service-intelligence-v1';
    const WHATSAPP = '5565998150975';
    const STORAGE_KEY = 'da_simple_storefront_cart_v2';
    const WHATSAPP_PHONE_KEY = 'da_vitrine_whatsapp_phone_v1';
    const HOME_CACHE_KEY = 'da_storefront_home_v2';
    const OFFERS_CACHE_KEY = 'da_storefront_offers_v2';
    const STATIC_CATEGORIES = [
      {key:'mercearia',label:'Mercearia'},
      {key:'limpeza_lavanderia',label:'Limpeza e lavanderia'},
      {key:'higiene_beleza',label:'Higiene e beleza'},
      {key:'casa_pet',label:'Casa e pet'}
    ];
    const $ = s => document.querySelector(s);
    const content = $('#content');
    const nav = $('#nav');
    const overlay = $('#overlay');
    const sheetBody = $('#sheetBody');
    const sheetAction = $('#sheetAction');
    const sheetTitle = $('#sheetTitle');
    const state = {
      home: {baskets:[],categories:STATIC_CATEGORIES},
      offers: [],
      offersLoaded: false,
      offersPromise: null,
      offersObserver: null,
      view: 'home',
      cart: loadCart(),
      basketDraft: null,
      category: null,
      nextOffset: null,
      query: '',
      productsById: new Map(),
      checkoutPayment: '',
      checkoutQuoteTimers: new Map(),
      detailReturn: '',
      lastFocus: null,
      whatsappPhone: ''
    };

    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = cents => (Number(cents || 0) / 100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const basketName = name => name === 'Economica Bonini' ? 'Econômica com Arroz Tio Bonini' : String(name || 'Cesta básica');
    const safeImage = url => url || '/img/logoantonia5.png';

    function normalizeWhatsappPhone(value){
      let digits=String(value??'').replace(/\D+/g,'');
      if(digits.startsWith('00'))digits=digits.slice(2);
      if(digits.startsWith('55')&&(digits.length===12||digits.length===13))return '+'+digits;
      if(digits.length===10||digits.length===11)return '+55'+digits;
      return '';
    }
    function captureWhatsappPhone(){
      const params=new URLSearchParams(location.search);
      const raw=params.get('wa')||params.get('whatsapp')||params.get('phone')||params.get('telefone')||'';
      const fromUrl=normalizeWhatsappPhone(raw);
      if(fromUrl){
        try{sessionStorage.setItem(WHATSAPP_PHONE_KEY,fromUrl)}catch{}
        for(const key of ['wa','whatsapp','phone','telefone'])params.delete(key);
        const qs=params.toString();
        history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);
        return fromUrl;
      }
      try{return normalizeWhatsappPhone(sessionStorage.getItem(WHATSAPP_PHONE_KEY)||'')}catch{return ''}
    }

    function loadCart(){
      try{
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      }catch{return []}
    }
    function readCache(key,maxAge){
      try{
        const value=JSON.parse(localStorage.getItem(key)||'null');
        if(!value||!value.saved_at||Date.now()-Number(value.saved_at)>maxAge)return null;
        return value.data||null;
      }catch{return null}
    }
    function writeCache(key,data){
      try{localStorage.setItem(key,JSON.stringify({saved_at:Date.now(),data}))}catch{}
    }
    function saveCart(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cart));
      paintCart();
      refreshAllProductControls();
    }
    function itemCount(){
      return state.cart.reduce((sum,item)=>sum + Math.max(0,Number(item.qty||0)),0);
    }
    function cartTotal(){
      return state.cart.reduce((sum,item)=>sum + Math.round(Number(item.unit_cents||0) * Number(item.qty||0)),0);
    }
    function toast(msg){
      const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800);
    }
    function paintCart(){
      const count=itemCount();
      $('#cartBadge').textContent=String(count);
      $('#cartSummary').textContent=count + (count===1?' item':' itens') + ' · ' + money(cartTotal());
      $('#cartbar').classList.toggle('show',count>0);
    }
    function openSheet(title,bodyHtml,actionHtml=''){
      state.lastFocus=document.activeElement;
      sheetTitle.textContent=title;
      sheetBody.innerHTML=bodyHtml;
      sheetAction.innerHTML=actionHtml;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
      requestAnimationFrame(()=>$('#closeSheet')?.focus());
    }
    function closeSheet(){
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      document.body.style.overflow='';
      state.basketDraft=null;
      if(state.lastFocus?.focus)state.lastFocus.focus();
    }
    $('#closeSheet').onclick=closeSheet;
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeSheet()});
    $('#cartTop').onclick=renderCart;
    $('#openCart').onclick=renderCart;

    async function api(action, params={}, options={}){
      const url = new URL(API);
      url.searchParams.set('action',action);
      Object.entries(params).forEach(([k,v])=>{if(v!==''&&v!=null)url.searchParams.set(k,String(v))});
      const controller = options.signal ? null : new AbortController();
      const timer = controller ? setTimeout(()=>controller.abort(),12000) : null;
      try{
        const response = await fetch(url,{cache:'default',...options,signal:options.signal||controller?.signal});
        const data = await response.json().catch(()=>({ok:false}));
        if(!response.ok || data.ok===false) throw new Error(data.error || 'Não foi possível carregar.');
        return data;
      }finally{if(timer)clearTimeout(timer)}
    }

    async function productExtra(id){
      try{
        const response=await fetch(LEGACY_PRODUCT_API,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'vitrine_product_extra',id}),
          cache:'no-store'
        });
        const data=await response.json().catch(()=>({ok:false}));
        return response.ok&&data.ok!==false?(data.product||null):null;
      }catch{return null}
    }

    function formatValidityDate(value){
      if(!value)return '';
      const raw=String(value).slice(0,10);
      const parts=raw.split('-');
      return parts.length===3?parts[2]+'/'+parts[1]+'/'+parts[0]:raw;
    }

    function navButton(label,key){
      return '<button type="button" class="chip '+(state.view===key?'active':'')+'" data-view="'+esc(key)+'">'+esc(label)+'</button>';
    }
    function renderNav(){
      const cats = state.home?.categories?.length ? state.home.categories : STATIC_CATEGORIES;
      nav.innerHTML =
        navButton('Cestas','home') +
        navButton('Ofertas','offers') +
        cats.map(c=>navButton(c.label,'cat:'+c.key)).join('');
      nav.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{
        const v=btn.dataset.view;
        if(v==='home') renderHome();
        else if(v==='offers') renderOffers();
        else if(v.startsWith('cat:')) renderCategory(v.slice(4),btn.textContent);
      });
    }

    function imageAttrs(index=99){
      if(index===0)return 'loading="eager" fetchpriority="high" decoding="async"';
      if(index===1)return 'loading="eager" decoding="async"';
      return 'loading="lazy" decoding="async"';
    }
    function productCard(p,offer=false,index=99){
      const regular = Number(p.regular_price_cents||0);
      const showOld = regular>Number(p.price_cents||0);
      const id=p.product_id||p.id;
      return '<article class="card">'+
        '<button type="button" class="product-open photo" data-product-detail="'+esc(id)+'" aria-label="Ver detalhes de '+esc(p.name)+'"><img src="'+esc(safeImage(p.image_url))+'" alt="'+esc(p.name)+'" '+imageAttrs(index)+'></button>'+
        '<div class="card-body">'+
          (offer?'<span class="offer-tag">OFERTA</span>':'')+
          '<button type="button" class="product-open name" data-product-detail="'+esc(id)+'">'+esc(p.name)+'</button>'+
          '<span class="meta">'+esc(p.packaging||p.subcategory||'')+'</span>'+
          '<div class="price">'+money(p.price_cents)+(showOld?'<span class="old">'+money(regular)+'</span>':'')+'</div>'+
          '<div class="product-action" data-product-control="'+esc(id)+'"></div>'+
        '</div></article>';
    }

    function basketCard(b,index=99){
      return '<article class="card basket-card">'+
        '<div class="photo"><img src="'+esc(safeImage(b.image_url))+'" alt="'+esc(basketName(b.name))+'" '+imageAttrs(index)+'></div>'+
        '<div class="card-body"><div class="name">'+esc(basketName(b.name))+'</div>'+
        '<div class="price">'+money(b.display_price_cents)+'</div>'+
        '<button type="button" class="add" data-basket="'+esc(b.id)+'">Ver cesta</button></div></article>';
    }

    function productQty(id){
      return Number(state.cart.find(x=>x.type==='product'&&x.id===id)?.qty||0);
    }
    function renderProductControl(host,p){
      if(!host||!p)return;
      const id=p.product_id||p.id,qty=productQty(id);
      host.innerHTML=qty>0
        ? '<div class="card-qty"><button type="button" data-product-dec="'+esc(id)+'" aria-label="Diminuir quantidade de '+esc(p.name)+'">−</button><b aria-label="'+qty+' no pedido">'+formatQty(qty)+'</b><button type="button" data-product-inc="'+esc(id)+'" aria-label="Aumentar quantidade de '+esc(p.name)+'">+</button></div>'
        : '<button type="button" class="add" data-product-add="'+esc(id)+'">Adicionar</button>';
      host.querySelector('[data-product-add]')?.addEventListener('click',()=>changeProduct(p,1));
      host.querySelector('[data-product-inc]')?.addEventListener('click',()=>changeProduct(p,1));
      host.querySelector('[data-product-dec]')?.addEventListener('click',()=>changeProduct(p,-1));
    }
    function attachProductControls(scope,products){
      for(const p of products)state.productsById.set(p.product_id||p.id,p);
      scope.querySelectorAll('[data-product-control]').forEach(host=>{
        renderProductControl(host,state.productsById.get(host.dataset.productControl));
      });
      attachProductDetailHandlers(scope);
    }
    function attachProductDetailHandlers(scope=document){
      scope.querySelectorAll('[data-product-detail]').forEach(btn=>{
        if(btn.dataset.detailBound==='1')return;
        btn.dataset.detailBound='1';
        btn.addEventListener('click',()=>openProductDetail(btn.dataset.productDetail,btn.dataset.detailReturn||''));
      });
    }
    async function openProductDetail(id,returnTo=''){
      if(!id)return;
      state.detailReturn=returnTo;
      const returnLabel=returnTo==='checkout'?'Voltar ao pedido':returnTo==='basket'?'Voltar à cesta':'';
      openSheet('Produto','<div class="loader"></div>',returnLabel?'<button class="secondary" type="button" id="backFromDetail">'+returnLabel+'</button>':'');
      if($('#backFromDetail'))$('#backFromDetail').onclick=()=>returnTo==='checkout'?renderCheckout():paintBasketSheet();
      try{
        const [data,legacy]=await Promise.all([
          api('product',{product_id:id}),
          productExtra(id)
        ]);
        const p=data.product;
        const old=Number(p.regular_price_cents||0)>Number(p.price_cents||0)
          ? '<span class="old">'+money(p.regular_price_cents)+'</span>' : '';
        const validity=formatValidityDate(legacy?.validity_date);
        const brand=legacy?.brand||p.brand||'';
        const packaging=legacy?.packaging||p.packaging||'';
        const attrs=[
          ...(validity?[{label:'Validade',value:validity}]:[]),
          ...(brand?[{label:'Marca',value:brand}]:[]),
          ...(packaging?[{label:'Embalagem',value:packaging}]:[])
        ];
        sheetTitle.textContent=p.name;
        sheetBody.innerHTML=
          '<div class="detail-photo"><img src="'+esc(safeImage(p.image_url))+'" alt="'+esc(p.name)+'"></div>'+
          '<h2 class="detail-title">'+esc(p.name)+'</h2>'+
          '<div class="detail-price">'+money(p.price_cents)+old+'</div>'+
          (p.description?'<p class="detail-description">'+esc(p.description)+'</p>':'')+
          (attrs.length?'<div class="detail-grid">'+attrs.map(a=>'<div class="detail-attr"><small>'+esc(a.label)+'</small><strong>'+esc(a.value)+'</strong></div>').join('')+'</div>':'');
        sheetAction.innerHTML=returnLabel
          ? '<button class="primary" type="button" id="backFromDetail">'+returnLabel+'</button>'
          : '<button class="primary" type="button" id="closeDetail">Fechar</button>';
        if($('#backFromDetail'))$('#backFromDetail').onclick=()=>returnTo==='checkout'?renderCheckout():paintBasketSheet();
        if($('#closeDetail'))$('#closeDetail').onclick=closeSheet;
      }catch{
        sheetBody.innerHTML='<div class="empty">Não consegui carregar os detalhes deste produto agora.</div>';
        sheetAction.innerHTML=returnLabel
          ? '<button class="primary" type="button" id="backFromDetail">'+returnLabel+'</button>'
          : '<button class="primary" type="button" id="closeDetail">Fechar</button>';
        if($('#backFromDetail'))$('#backFromDetail').onclick=()=>returnTo==='checkout'?renderCheckout():paintBasketSheet();
        if($('#closeDetail'))$('#closeDetail').onclick=closeSheet;
      }
    }

    function refreshAllProductControls(){
      document.querySelectorAll('[data-product-control]').forEach(host=>{
        renderProductControl(host,state.productsById.get(host.dataset.productControl));
      });
    }
    function changeProduct(p,delta){
      const id=p.product_id||p.id;
      const existing=state.cart.find(x=>x.type==='product'&&x.id===id);
      if(existing){
        existing.qty=Math.max(0,Math.min(30,Number(existing.qty||0)+delta));
        if(existing.qty<=0)state.cart.splice(state.cart.indexOf(existing),1);
      }else if(delta>0){
        state.cart.push({type:'product',id,name:p.name,image_url:p.image_url||'',unit_cents:Number(p.price_cents||0),qty:1});
      }
      saveCart();
      if(delta>0)toast('Adicionado ao pedido');
    }

    function section(title,subtitle,inner,id=''){
      return '<section class="section" '+(id?'id="'+id+'"':'')+'><div class="section-head"><div><h2>'+esc(title)+'</h2><p>'+esc(subtitle||'')+'</p></div></div>'+inner+'</section>';
    }

    function offersSkeleton(){
      return '<div class="deferred-grid" aria-busy="true"><span class="sr-only">Carregando ofertas</span><div class="loader" aria-hidden="true"></div><div class="loader" aria-hidden="true"></div><div class="loader" aria-hidden="true"></div><div class="loader" aria-hidden="true"></div></div>';
    }

    function paintHomeOffers(){
      const host=$('#homeOffersMount');if(!host)return;
      const featured=state.offers.slice(0,4);
      host.innerHTML=featured.length
        ? '<div class="grid" id="homeOfferGrid">'+featured.map((p,i)=>productCard(p,true,i+10)).join('')+'</div>'+
          (state.offers.length>featured.length?'<button class="text-btn" type="button" id="allOffers">Ver todas as ofertas</button>':'')
        : '<div class="empty">Nenhuma oferta ativa agora.</div>';
      attachProductControls(host,featured);
      if($('#allOffers'))$('#allOffers').onclick=renderOffers;
    }

    function observeOffers(){
      state.offersObserver?.disconnect?.();
      const host=$('#homeOffersMount');if(!host||state.offersLoaded){paintHomeOffers();return}
      if(!('IntersectionObserver' in window)){loadOffers();return}
      state.offersObserver=new IntersectionObserver(entries=>{
        if(entries.some(x=>x.isIntersecting)){
          state.offersObserver.disconnect();
          loadOffers();
        }
      },{rootMargin:'500px 0px'});
      state.offersObserver.observe(host);
    }

    async function fetchFreshOffers(){
      const data=await api('offers');
      state.offers=Array.isArray(data.offers)?data.offers:[];
      state.offersLoaded=true;
      writeCache(OFFERS_CACHE_KEY,state.offers);
      if(state.view==='home')paintHomeOffers();
      if(state.view==='offers')paintOffersPage();
      return state.offers;
    }

    function loadOffers(){
      if(state.offersLoaded)return Promise.resolve(state.offers);
      if(state.offersPromise)return state.offersPromise;
      const cached=readCache(OFFERS_CACHE_KEY,2*60*1000);
      if(Array.isArray(cached)){
        state.offers=cached;
        state.offersLoaded=true;
        if(state.view==='home')paintHomeOffers();
        queueMicrotask(()=>fetchFreshOffers().catch(()=>{}));
        return Promise.resolve(state.offers);
      }
      state.offersPromise=fetchFreshOffers()
        .catch(error=>{
          if(state.view==='home'){
            const host=$('#homeOffersMount');if(host)host.innerHTML='<div class="empty">As ofertas não carregaram agora. <button class="text-btn" id="retryOffers" type="button">Tentar novamente</button></div>';
            if($('#retryOffers'))$('#retryOffers').onclick=()=>{state.offersPromise=null;loadOffers()};
          }
          throw error;
        })
        .finally(()=>{state.offersPromise=null});
      return state.offersPromise;
    }

    function renderInitialShell(){
      state.view='home';renderNav();
      const categories=STATIC_CATEGORIES;
      content.innerHTML=
        section('Cestas básicas','Escolha uma cesta para conferir.',
          '<div class="grid" aria-busy="true"><div class="loader" aria-hidden="true"></div><div class="loader" aria-hidden="true"></div><div class="loader" aria-hidden="true"></div><div class="loader" aria-hidden="true"></div></div>')+
        section('Categorias','Você já pode entrar direto em uma categoria.',
          '<div class="category-list">'+categories.map(c=>'<button class="category" type="button" data-category="'+esc(c.key)+'">'+esc(c.label)+'<span>›</span></button>').join('')+'</div>');
      content.querySelectorAll('[data-category]').forEach(btn=>btn.onclick=()=>renderCategory(btn.dataset.category,btn.textContent.replace('›','').trim()));
    }

    function renderHome(){
      state.view='home';state.category=null;state.query='';renderNav();$('#globalSearchInput').value='';
      const baskets=state.home?.baskets||[];
      const categories=state.home?.categories?.length?state.home.categories:STATIC_CATEGORIES;
      content.innerHTML=
        section('Cestas básicas','Escolha uma cesta para conferir e ajustar.',
          '<div class="grid" id="basketGrid">'+(baskets.length?baskets.map((b,i)=>basketCard(b,i)).join(''):offersSkeleton())+'</div>')+
        section('Ofertas','Preços promocionais ativos agora.',
          '<div id="homeOffersMount">'+(state.offersLoaded?'':offersSkeleton())+'</div>')+
        section('Categorias','Para achar rápido o que você precisa.',
          '<div class="category-list">'+categories.map(c=>'<button class="category" type="button" data-category="'+esc(c.key)+'">'+esc(c.label)+'<span>›</span></button>').join('')+'</div>');
      content.querySelectorAll('[data-basket]').forEach(btn=>btn.onclick=()=>openBasket(btn.dataset.basket));
      content.querySelectorAll('[data-category]').forEach(btn=>btn.onclick=()=>renderCategory(btn.dataset.category,btn.textContent.replace('›','').trim()));

    function paintOffersPage(){
      const grid=$('#offerGrid');if(!grid)return;
      grid.innerHTML=state.offers.length?state.offers.map((p,i)=>productCard(p,true,i)).join(''):'<div class="empty">Nenhuma oferta ativa agora.</div>';
      attachProductControls(grid,state.offers);
    }

    async function renderOffers(){
      state.view='offers';state.category=null;state.query='';renderNav();$('#globalSearchInput').value='';
      content.innerHTML=section('Ofertas','Produtos com preço promocional ativo.',
        '<div class="grid" id="offerGrid">'+(state.offersLoaded?'': '<div class="loader"></div><div class="loader"></div>')+'</div>');
      if(state.offersLoaded)paintOffersPage();
      else{
        try{await loadOffers();paintOffersPage()}
        catch{
          const grid=$('#offerGrid');if(grid)grid.innerHTML='<div class="empty">Não consegui carregar as ofertas agora. <button class="text-btn" id="retryOffersPage" type="button">Tentar novamente</button></div>';
          if($('#retryOffersPage'))$('#retryOffersPage').onclick=()=>{state.offersPromise=null;renderOffers()};
        }
      }
      window.scrollTo({top:0,behavior:'smooth'});
    }

    async function renderCategory(key,label){
      state.view='cat:'+key;state.category={key,label};state.query='';renderNav();
      $('#globalSearchInput').value='';
      content.innerHTML='<section class="section"><div class="section-head"><div><h2>'+esc(label)+'</h2><p>Produtos disponíveis agora</p></div><button class="text-btn" type="button" id="backHome">Voltar</button></div>'+
        '<div class="grid" id="productGrid"><div class="loader"></div><div class="loader"></div></div><div id="moreHost"></div></section>';
      $('#backHome').onclick=renderHome;
      try{
        const data=await api('products',{category:key,limit:24,offset:0});
        state.nextOffset=data.next_offset;
        const grid=$('#productGrid');
        grid.innerHTML=data.products.length?data.products.map((p,i)=>productCard(p,false,i)).join(''):'<div class="empty">Não encontrei produtos aqui.</div>';
        attachProductControls(grid,data.products);
        if(state.nextOffset!=null)renderMoreButton(key,label,'');
      }catch(e){
        $('#productGrid').innerHTML='<div class="empty">Não consegui carregar agora. <button class="text-btn" id="retryCat">Tentar novamente</button></div>';
        $('#retryCat').onclick=()=>renderCategory(key,label);
      }
      window.scrollTo({top:0,behavior:'smooth'});

    async function renderSearch(q){
      const term=String(q||'').trim();
      if(!term)return;
      state.view='search';state.category=null;state.query=term;renderNav();
      $('#globalSearchInput').value=term;
      content.innerHTML='<section class="section"><div class="section-head"><div><h2>Busca</h2><p>Resultados para “'+esc(term)+'”</p></div><button class="text-btn" type="button" id="backHome">Voltar</button></div>'+
        '<div class="grid" id="productGrid"><div class="loader"></div><div class="loader"></div></div><div id="moreHost"></div></section>';

        const data=await api('products',{q:term,limit:24,offset:0});
        state.nextOffset=data.next_offset;
        const grid=$('#productGrid');
        grid.innerHTML=data.products.length?data.products.map((p,i)=>productCard(p,false,i)).join(''):'<div class="empty">Não encontrei esse produto. Tente outro nome ou uma palavra mais curta.</div>';
        attachProductControls(grid,data.products);
        if(state.nextOffset!=null)renderMoreButton('', 'Busca', term);
      }catch(e){
        $('#productGrid').innerHTML='<div class="empty">Não consegui buscar agora. <button class="text-btn" id="retrySearch">Tentar novamente</button></div>';
        $('#retrySearch').onclick=()=>renderSearch(term);

    function renderMoreButton(key,label,q,current){
      const host=$('#moreHost');
      host.innerHTML='<button class="primary" type="button" id="loadMore" style="margin-top:14px">Mostrar mais</button>';
      $('#loadMore').onclick=async()=>{
        const btn=$('#loadMore');btn.disabled=true;btn.textContent='Carregando…';
        try{
          const data=await api('products',{category:key,q,limit:24,offset:state.nextOffset});
          state.nextOffset=data.next_offset;
          const grid=$('#productGrid');

          temp.innerHTML=data.products.map((p,i)=>productCard(p,false,i+2)).join('');

          else{btn.disabled=false;btn.textContent='Mostrar mais'}

    async function openBasket(id){
      openSheet('Cesta básica','<div class="loader"></div>','');
      try{
        const data=await api('basket',{basket_id:id});
        state.basketDraft={
          basket:data.basket,
          items:data.items.map(x=>({...x,base_quantity:Number(x.quantity||0),quantity:Number(x.quantity||0)})),
          total_cents:Number(data.basket.display_price_cents||0),
          quoteTimer:null
        };
        paintBasketSheet();
      }catch(e){
        openSheet('Cesta básica','<div class="empty">Não consegui abrir esta cesta agora.</div>','<button class="primary" type="button" id="closeError">Fechar</button>');
        $('#closeError').onclick=closeSheet;
      }
    }

    function paintBasketSheet(){
      const d=state.basketDraft;if(!d)return;
      const b=d.basket;
      sheetTitle.textContent=basketName(b.name);
      sheetBody.innerHTML=
        '<div class="basket-hero"><img src="'+esc(safeImage(b.image_url))+'" alt=""><div><h3>'+esc(basketName(b.name))+'</h3><div class="basket-total" id="basketTotal">'+money(d.total_cents)+'</div><small>Você pode retirar, reduzir ou aumentar os itens.</small></div></div>'+
        '<div class="items">'+d.items.map((x,i)=>'<div class="item-row"><button type="button" class="product-open checkout-name" data-product-detail="'+esc(x.product_id)+'" data-detail-return="basket">'+esc(x.name)+'</button><div class="qty"><button type="button" data-b-dec="'+i+'">−</button><b id="bq'+i+'">'+formatQty(x.quantity)+'</b><button type="button" data-b-inc="'+i+'">+</button></div></div>').join('')+'</div>'+
        '';
      sheetAction.innerHTML='<button class="primary" type="button" id="addBasket">Adicionar cesta ao pedido</button>';
      sheetBody.querySelectorAll('[data-b-dec]').forEach(btn=>btn.onclick=()=>changeBasketQty(Number(btn.dataset.bDec),-1));
      sheetBody.querySelectorAll('[data-b-inc]').forEach(btn=>btn.onclick=()=>changeBasketQty(Number(btn.dataset.bInc),1));
      attachProductDetailHandlers(sheetBody);
      $('#addBasket').onclick=addBasketDraft;
    }

    function formatQty(n){return Number.isInteger(Number(n))?String(Number(n)):String(Number(n).toFixed(3)).replace(/\.?0+$/,'')}
    function changeBasketQty(index,delta){
      const d=state.basketDraft;if(!d||!d.items[index])return;
      d.items[index].quantity=Math.max(0,Math.min(30,Number(d.items[index].quantity||0)+delta));
      const label=$('#bq'+index);if(label)label.textContent=formatQty(d.items[index].quantity);
      clearTimeout(d.quoteTimer);
      d.quoteTimer=setTimeout(quoteBasket,180);
    }
    async function quoteBasket(){
      const d=state.basketDraft;if(!d)return;
      const total=$('#basketTotal');if(total)total.textContent='Calculando…';
      try{
        const data=await api('basket_quote',{},{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({basket_id:d.basket.id,items:d.items.map(x=>({product_id:x.product_id,quantity:x.quantity}))})
        });
        d.total_cents=Number(data.total_cents||0);
        if($('#basketTotal'))$('#basketTotal').textContent=money(d.total_cents);
      }catch{
        d.total_cents=Number(d.basket.display_price_cents||0);
        if($('#basketTotal'))$('#basketTotal').textContent=money(d.total_cents);
        toast('Não consegui recalcular agora');
      }
    }
    function addBasketDraft(){
      const d=state.basketDraft;if(!d)return;
      const changed=d.items.some(x=>Number(x.quantity)!==Number(x.base_quantity));
      state.cart.push({
        type:'basket',id:d.basket.id,name:basketName(d.basket.name),image_url:d.basket.image_url||'',
        unit_cents:Number(d.total_cents||0),qty:1,changed,
        components:d.items.map(x=>({product_id:x.product_id,name:x.name,image_url:x.image_url||'',packaging:x.packaging||'',quantity:Number(x.quantity)}))
      });
      saveCart();closeSheet();toast('Cesta adicionada');
    }

    function renderCart(){
      if(!state.cart.length){
        openSheet('Seu pedido','<div class="empty">Seu pedido ainda está vazio.</div>','<button class="primary" type="button" id="goShop">Ver cestas</button>');
        $('#goShop').onclick=()=>{closeSheet();renderHome()};
        return;
      }
      renderCheckout();
    }

    function cartLine(item,i){
      const comp=item.type==='basket' && item.components?.length
        ? '<div class="composition">'+item.components.map(c=>'<div>'+formatQty(Number(c.quantity)*Number(item.qty||1))+'× '+esc(c.name)+'</div>').join('')+'</div>'
        : '';
      return '<div class="cart-line"><div class="cart-line-top"><div><strong>'+esc(item.name)+'</strong><br><small>'+(item.type==='basket'?'Cesta básica':'Produto')+'</small></div></div>'+comp+
        '<div class="cart-controls"><div class="qty"><button type="button" data-cart-dec="'+i+'">−</button><b>'+formatQty(item.qty)+'</b><button type="button" data-cart-inc="'+i+'">+</button></div><button type="button" class="remove" data-remove="'+i+'">Remover</button></div></div>';
    }
    function cartQty(i,delta){
      const item=state.cart[i];if(!item)return;
      item.qty=Math.max(1,Math.min(30,Number(item.qty||1)+delta));saveCart();renderCart();
    }
    function removeCart(i){state.cart.splice(i,1);saveCart();if(state.cart.length)renderCart();else closeSheet()}

    async function hydrateCheckoutBaskets(){
      const baskets=state.cart.filter(item=>item.type==='basket'&&!item.checkout_hydrated);
      if(!baskets.length)return;
      await Promise.all(baskets.map(async item=>{
        try{
          const data=await api('basket',{basket_id:item.id});
          const current=new Map((item.components||[]).map(c=>[c.product_id,c]));
          item.components=(data.items||[]).map(x=>{
            const old=current.get(x.product_id);
            return {
              product_id:x.product_id,
              name:x.name,
              image_url:x.image_url||old?.image_url||'',
              packaging:x.packaging||old?.packaging||'',
              quantity:old?Number(old.quantity||0):0
            };
          });
          item.checkout_hydrated=true;
        }catch{}
      }));
      saveCart();
    }

    function checkoutQtyControl(itemIndex,qty){
      return '<div class="checkout-qty"><button type="button" data-checkout-dec="'+itemIndex+'" aria-label="Diminuir">−</button><b>'+formatQty(qty)+'</b><button type="button" data-checkout-inc="'+itemIndex+'" aria-label="Aumentar">+</button></div>';
    }
    function checkoutComponentQtyControl(itemIndex,componentIndex,qty){
      return '<div class="checkout-qty"><button type="button" data-checkout-component-dec="'+itemIndex+':'+componentIndex+'" aria-label="Diminuir">−</button><b>'+formatQty(qty)+'</b><button type="button" data-checkout-component-inc="'+itemIndex+':'+componentIndex+'" aria-label="Aumentar">+</button></div>';
    }
    function checkoutProductRow(item,itemIndex){
      return '<div class="checkout-item-row">'+
        '<button type="button" class="checkout-thumb" data-product-detail="'+esc(item.id)+'" data-detail-return="checkout"><img src="'+esc(safeImage(item.image_url))+'" alt=""></button>'+
        '<div class="checkout-copy"><button type="button" class="checkout-name" data-product-detail="'+esc(item.id)+'" data-detail-return="checkout">'+esc(item.name)+'</button><span class="checkout-meta">'+money(Number(item.unit_cents||0)*Number(item.qty||1))+'</span></div>'+
        checkoutQtyControl(itemIndex,item.qty)+'</div>';
    }
    function checkoutBasketBlock(item,itemIndex){
      const components=(item.components||[]).map((c,componentIndex)=>
        '<div class="checkout-item-row">'+
          '<button type="button" class="checkout-thumb" data-product-detail="'+esc(c.product_id)+'" data-detail-return="checkout"><img src="'+esc(safeImage(c.image_url))+'" alt=""></button>'+
          '<div class="checkout-copy"><button type="button" class="checkout-name" data-product-detail="'+esc(c.product_id)+'" data-detail-return="checkout">'+esc(c.name)+'</button><span class="checkout-meta">'+esc(c.packaging||'Item da cesta')+'</span></div>'+
          checkoutComponentQtyControl(itemIndex,componentIndex,c.quantity)+
        '</div>'
      ).join('');
      return '<div class="checkout-basket">'+
        '<div class="checkout-basket-head"><img src="'+esc(safeImage(item.image_url))+'" alt=""><div><strong>'+esc(item.name)+'</strong><span class="checkout-meta">Edite os produtos abaixo · '+money(Number(item.unit_cents||0)*Number(item.qty||1))+'</span></div>'+checkoutQtyControl(itemIndex,item.qty)+'</div>'+
        '<div class="checkout-basket-items">'+components+'</div>'+
      '</div>';
    }

    async function renderCheckout(){
      if(!state.cart.length){renderCart();return}
      state.checkoutPayment=document.querySelector('input[name="payment"]:checked')?.value||state.checkoutPayment||'';
      openSheet('Seu pedido','<div class="loading">Preparando seu pedido…</div>','');
      await hydrateCheckoutBaskets();
      paintCheckout();
    }

    function paintCheckout(){
      if(!state.cart.length){renderCart();return}
      sheetTitle.textContent='Seu pedido';
      const rows=state.cart.map((item,i)=>item.type==='basket'?checkoutBasketBlock(item,i):checkoutProductRow(item,i)).join('');
      sheetBody.innerHTML=
        '<div class="checkout-list">'+rows+'<div class="checkout-total"><span>Total</span><span id="checkoutTotal">'+money(cartTotal())+'</span></div></div>'+
        '<h3 class="checkout-title">Como você vai pagar?</h3>'+
        '<div class="payments">'+
          pay('PIX','PIX')+pay('Dinheiro','Dinheiro')+pay('Cartão de crédito','Cartão de crédito')+pay('Cartão alimentação/refeição','Cartão alimentação/refeição')+
        '</div>'+
        '<p class="note">Pagamento na entrega. Nenhum dado de cartão é solicitado aqui.</p>';
      sheetAction.innerHTML='<div class="action-stack"><button class="secondary" type="button" id="addMoreCheckout">Adicionar mais produtos</button><button class="primary" type="button" id="sendWhats">Enviar pedido para o WhatsApp</button></div>';

      sheetBody.querySelectorAll('[data-checkout-dec]').forEach(btn=>btn.onclick=()=>checkoutItemQty(Number(btn.dataset.checkoutDec),-1));
      sheetBody.querySelectorAll('[data-checkout-inc]').forEach(btn=>btn.onclick=()=>checkoutItemQty(Number(btn.dataset.checkoutInc),1));
      sheetBody.querySelectorAll('[data-checkout-component-dec]').forEach(btn=>btn.onclick=()=>checkoutComponentQty(btn.dataset.checkoutComponentDec,-1));
      sheetBody.querySelectorAll('[data-checkout-component-inc]').forEach(btn=>btn.onclick=()=>checkoutComponentQty(btn.dataset.checkoutComponentInc,1));
      sheetBody.querySelectorAll('input[name="payment"]').forEach(input=>{
        input.checked=input.value===state.checkoutPayment;
        input.onchange=()=>{state.checkoutPayment=input.value};
      });
      attachProductDetailHandlers(sheetBody);
      $('#addMoreCheckout').onclick=closeSheet;
      $('#sendWhats').onclick=sendWhatsApp;
    }

    function checkoutItemQty(index,delta){
      const item=state.cart[index];if(!item)return;
      const next=Math.max(0,Math.min(30,Number(item.qty||1)+delta));
      if(next<=0)state.cart.splice(index,1);else item.qty=next;
      saveCart();
      paintCheckout();
    }

    function checkoutComponentQty(key,delta){
      const [itemIndex,componentIndex]=String(key).split(':').map(Number);
      const item=state.cart[itemIndex],component=item?.components?.[componentIndex];
      if(!item||!component)return;
      component.quantity=Math.max(0,Math.min(30,Number(component.quantity||0)+delta));
      saveCart();
      paintCheckout();
      const old=state.checkoutQuoteTimers.get(itemIndex);
      if(old)clearTimeout(old);
      state.checkoutQuoteTimers.set(itemIndex,setTimeout(()=>requoteCheckoutBasket(itemIndex),160));
    }

    async function requoteCheckoutBasket(itemIndex){
      const item=state.cart[itemIndex];
      if(!item||item.type!=='basket')return;
      try{
        const data=await api('basket_quote',{},{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({basket_id:item.id,items:(item.components||[]).map(c=>({product_id:c.product_id,quantity:Number(c.quantity||0)}))})
        });
        item.unit_cents=Number(data.total_cents||0);
        saveCart();
        if(overlay.classList.contains('open')&&sheetTitle.textContent==='Seu pedido')paintCheckout();
      }catch{toast('Não consegui recalcular a cesta agora')}
    }

    function pay(value,label){
      return '<label class="pay"><input type="radio" name="payment" value="'+esc(value)+'"><strong>'+esc(label)+'</strong></label>';
    }

    function formatOrderDateCuiaba(){
      const parts=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Cuiaba',day:'numeric',month:'long',year:'numeric'}).formatToParts(new Date());
      const get=type=>parts.find(p=>p.type===type)?.value||'';
      const month=get('month');
      const monthTitle=month?month.charAt(0).toUpperCase()+month.slice(1):'';
      return get('day')+' de '+monthTitle+' de '+get('year');
    }

    async function sendWhatsApp(){
      const selected=document.querySelector('input[name="payment"]:checked');
      if(!selected){toast('Escolha a forma de pagamento');return}
      state.checkoutPayment=selected.value
      const btn=$('#sendWhats');
      if(btn){btn.disabled=true;btn.textContent='Registrando pedido…'}
      let saved=null;
      try{
        saved=await api('submit_order',{},{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            payment_method:selected.value,
            whatsapp_phone:state.whatsappPhone||null,
            items:state.cart.map(item=>({
              type:item.type,
              id:item.id,
              qty:Number(item.qty||1),
              components:item.type==='basket'?(item.components||[]):[]
            }))
          })
        });
      }catch(e){
        if(btn){btn.disabled=false;btn.textContent='Enviar pedido para o WhatsApp'}
        toast('Não consegui registrar. Tente novamente.');
        return;
      }

      const lines=['Olá! Quero confirmar este pedido da vitrine Dona Antônia:'];
      lines.push('Pedido: "'+formatOrderDateCuiaba()+'"');
      if(saved?.order_number)lines.push('Nº: '+String(saved.order_number).slice(-8));
      lines.push('');
      for(const item of state.cart){
        lines.push(formatQty(item.qty)+'x '+item.name);
        if(item.type==='basket'&&item.components?.length){
          for(const c of item.components){
            const qty=Number(c.quantity)*Number(item.qty||1);
            if(qty>0)lines.push('  • '+formatQty(qty)+'x '+c.name);
          }
        }
      }
      lines.push('','Total: '+money(saved?.total_cents??cartTotal()),'Pagamento: '+selected.value,'','Entrega em Cuiabá/Várzea Grande. Pode confirmar meu pedido?');
      const url='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(lines.join('\n'));
      state.cart=[];
      saveCart();
      window.location.href=url;
    }

    $('#globalSearchForm').onsubmit=e=>{
      e.preventDefault();
      const q=$('#globalSearchInput').value.trim();
      if(q)renderSearch(q);
    };

    async function start(){
      state.whatsappPhone=captureWhatsappPhone();
      paintCart();
      renderInitialShell();

      const cachedHome=readCache(HOME_CACHE_KEY,5*60*1000);
      const hadCached=Boolean(cachedHome?.baskets?.length);
      if(hadCached){
        state.home={...state.home,...cachedHome,categories:cachedHome.categories?.length?cachedHome.categories:STATIC_CATEGORIES};
        renderHome();
      }

      try{
        const fresh=await api('home');
        state.home={...state.home,...fresh,categories:fresh.categories?.length?fresh.categories:STATIC_CATEGORIES};
        writeCache(HOME_CACHE_KEY,state.home);
        if(state.view==='home'&&!hadCached)renderHome();
      }catch(e){
        if(!state.home?.baskets?.length){
          renderNav();
          content.innerHTML='<section class="section"><div class="empty">Não consegui abrir a vitrine agora.<br><button class="primary" style="margin-top:12px" id="retryHome">Tentar novamente</button><br><a class="text-btn" style="display:inline-block;margin-top:8px" href="https://wa.me/'+WHATSAPP+'">Falar no WhatsApp</a></div></section>';
          $('#retryHome').onclick=()=>location.reload();
        }
      }
    }
    start();
  })();
  </script>
</body>
</html>
