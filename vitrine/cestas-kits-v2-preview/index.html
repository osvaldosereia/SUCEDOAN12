<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f7f4ed">
  <title>Dona Antônia · Cestas e Kits V2 · Homologação</title>
  <style>
    :root{--ink:#1d2821;--muted:#69746d;--line:#e1e5e1;--soft:#f7f4ed;--brand:#176b43;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1120px,100%);margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.hero h1{margin:0;font-size:28px;letter-spacing:-.03em}.hero p{margin:4px 0 0;color:var(--muted)}.badge{border:1px solid #e0c783;background:#fff9e8;color:#76520a;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:750}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden;cursor:pointer}.card img{width:100%;height:190px;object-fit:contain;background:#fff}.card-body{padding:12px}.card small{color:var(--muted)}.card h2{font-size:16px;margin:4px 0 9px;line-height:1.25}.card-meta{display:flex;justify-content:space-between;gap:10px;align-items:end}.price{font-size:19px;font-weight:900}.stock{font-size:11px;color:#176b43;font-weight:800}.empty{border:1px dashed #c9d0cb;border-radius:15px;padding:34px;text-align:center;color:var(--muted);grid-column:1/-1}.detail{display:none}.detail.open{display:block}.catalog.hidden{display:none}.back{border:0;background:transparent;color:var(--brand);font-weight:850;padding:8px 0;margin-bottom:10px}.detail-head{display:grid;grid-template-columns:240px 1fr;gap:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.detail-head img{width:240px;height:220px;object-fit:contain}.detail-head h1{font-size:26px;margin:0 0 5px}.detail-price{font-size:24px;font-weight:900;margin-top:14px}.section{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:12px}.section h2{font-size:16px;margin:0 0 10px}.product-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;border:1px solid #edf0ed;border-radius:11px;padding:8px}.product img{width:54px;height:54px;object-fit:contain}.product small{display:block;color:var(--muted)}.product b:last-child{font-variant-numeric:tabular-nums}.components{display:grid;gap:10px}.component{border:1px solid var(--line);border-radius:12px;padding:11px}.component-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.component-head small{color:var(--muted)}.loading{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.detail-head{grid-template-columns:150px 1fr}.detail-head img{width:150px;height:150px}.product-list{grid-template-columns:1fr}}
    @media(max-width:560px){.wrap{padding:12px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:120px 1fr}.card img{height:140px}.detail-head{grid-template-columns:1fr}.detail-head img{width:100%;height:200px}.detail-head h1{font-size:22px}.product{grid-template-columns:48px 1fr auto}.product img{width:48px;height:48px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="catalog" id="catalogView">
      <div class="hero"><div><h1>Cestas e Kits V2</h1><p>Visualização paralela para conferir categorias, composição, disponibilidade e preço.</p></div><span class="badge">HOMOLOGAÇÃO</span></div>
      <div class="filters" id="filters">
        <button class="chip active" data-slug="">Todas</button>
        <button class="chip" data-name="Cestas Completas">Cestas Completas</button>
        <button class="chip" data-name="Cestas Só Alimento">Cestas Só Alimento</button>
        <button class="chip" data-name="Kits Limpeza e Higiene">Kits Limpeza e Higiene</button>
        <button class="chip" data-name="Kits Limpeza">Kits Limpeza</button>
        <button class="chip" data-name="Kits Higiene">Kits Higiene</button>
      </div>
      <div class="grid" id="grid"><div class="loading">Carregando…</div></div>
    </section>
    <section class="detail" id="detailView"></section>
  </main>
<script>
(()=>{
  const API='https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/storefront-baskets-v2-v1';
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const q=v=>Number.isInteger(Number(v))?String(Number(v)):Number(v||0).toFixed(3).replace(/\.?0+$/,'');
  const state={items:[],category:''};
  async function api(action,params={}){const u=new URL(API);u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'Falha ao carregar');return d}
  function filtered(){return state.items.filter(x=>!state.category||x.category?.name===state.category)}
  function paint(){const rows=filtered(),host=$('#grid');host.innerHTML=rows.length?rows.map(x=>'<article class="card" data-id="'+esc(x.id)+'"><img src="'+esc(x.image_url||'/img/sem-foto.svg')+'" alt=""><div class="card-body"><small>'+esc(x.category?.name||'')+'</small><h2>'+esc(x.name)+'</h2><div class="card-meta"><div class="price">'+money(x.price_cents)+'</div><div class="stock">'+esc(x.availability)+' disponíveis</div></div></div></article>').join(''):'<div class="empty">Nenhuma Cesta/Kit disponível nesta categoria.</div>';$$('[data-id]').forEach(el=>el.onclick=()=>openDetail(el.dataset.id))}
  async function openDetail(id){try{const d=await api('detail',{id}),x=d.item;$('#catalogView').classList.add('hidden');const host=$('#detailView');host.classList.add('open');host.innerHTML='<button class="back" id="back">← Voltar às Cestas e Kits</button><div class="detail-head"><img src="'+esc(x.image_url||'/img/sem-foto.svg')+'" alt=""><div><small>'+esc(x.category?.name||'')+'</small><h1>'+esc(x.name)+'</h1><p>'+esc(x.description||'')+'</p><div class="detail-price">'+money(x.price_cents)+'</div><div class="stock">'+esc(x.availability)+' disponíveis</div></div></div>'+(x.composition_mode==='products'?productsSection(x.products):componentsSection(x.components));$('#back').onclick=closeDetail}catch(e){$('#detailView').innerHTML='<button class="back" id="back">← Voltar</button><div class="empty">Não foi possível abrir esta Cesta/Kit.</div>';$('#detailView').classList.add('open');$('#catalogView').classList.add('hidden');$('#back').onclick=closeDetail}}
  function productsSection(rows){return '<section class="section"><h2>Itens desta Cesta/Kit</h2><div class="product-list">'+(rows||[]).map(productHtml).join('')+'</div></section>'}
  function productHtml(p){return '<div class="product"><img src="'+esc(p.image_url||'/img/sem-foto.svg')+'" alt=""><div><b>'+esc(p.name)+'</b><small>'+esc(p.packaging||'')+'</small></div><b>'+esc(q(p.quantity))+'×</b></div>'}
  function componentsSection(rows){return '<section class="section"><h2>Composta por</h2><div class="components">'+(rows||[]).map(c=>'<article class="component"><div class="component-head"><div><b>'+esc(c.name)+'</b><small>'+esc(c.quantity)+' por unidade · '+esc(c.availability)+' disponíveis</small></div><b>'+money(c.sale_price_cents)+'</b></div><div class="product-list">'+(c.products||[]).map(productHtml).join('')+'</div></article>').join('')+'</div></section>'}
  function closeDetail(){$('#detailView').classList.remove('open');$('#detailView').innerHTML='';$('#catalogView').classList.remove('hidden')}
  async function start(){try{const d=await api('catalog');state.items=d.items||[];paint()}catch(e){$('#grid').innerHTML='<div class="empty">Não foi possível carregar a homologação.</div>'}$$('#filters .chip').forEach(b=>b.onclick=()=>{$$('#filters .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.category=b.dataset.name||'';paint()})}
  start();
})();
</script>
</body>
</html>
