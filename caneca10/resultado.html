<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Resultado da caneca · Dona Antônia</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f221e;background:#f5f6f2}
    *{box-sizing:border-box}body{margin:0}.wrap{width:min(960px,100%);margin:0 auto;padding:18px}.card{background:#fff;border:1px solid #e1e4dc;border-radius:20px;padding:18px;box-shadow:0 12px 36px rgba(25,30,22,.07)}
    h1{margin:0 0 6px;font-size:24px}p{color:#62685e;margin:0 0 16px;line-height:1.45}.label{display:block;margin:16px 0 7px;font-size:12px;font-weight:850;color:#5d645a}
    .mockups{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mockup{margin:0;border:1px solid #e1e4dc;border-radius:15px;overflow:hidden;background:#f2f4ef}.mockup img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.mockup figcaption{padding:8px 10px;font-size:11px;font-weight:800;color:#62685e}
    .art{width:100%;aspect-ratio:2.5/1;object-fit:contain;background:#f2f4ef;border-radius:14px;border:1px solid #e1e4dc}.actions{display:grid;gap:10px;margin-top:16px}.actions a{min-height:48px;border-radius:12px;text-decoration:none;font-weight:800;display:flex;align-items:center;justify-content:center;background:#20231f;color:#fff}.status{padding:14px;border-radius:12px;background:#f1f3ee;color:#5c6358}.error{background:#fff0ef;color:#842d29}
    @media(max-width:620px){.wrap{padding:10px}.card{border-radius:15px;padding:12px}.mockups{gap:6px}h1{font-size:21px}}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <h1>Sua caneca personalizada</h1>
    <p>Confira os dois mockups e a arte horizontal que será usada na impressão.</p>
    <div id="status" class="status">Carregando sua criação…</div>
    <div id="result" hidden>
      <span class="label">Prévia da caneca</span>
      <div class="mockups">
        <figure class="mockup"><img id="mockup1" alt="Primeiro mockup da caneca"><figcaption>Mockup 1</figcaption></figure>
        <figure class="mockup"><img id="mockup2" alt="Segundo mockup da caneca"><figcaption>Mockup 2</figcaption></figure>
      </div>
      <span class="label">Arte horizontal para impressão</span>
      <img id="art" class="art" alt="Arte horizontal da caneca">
    </div>
    <div class="actions"><a href="/">Voltar para Dona Antônia</a></div>
  </section></main>
  <script>
    (()=>{const FIREBASE='https://cedar-chemist-310801-default-rtdb.firebaseio.com',id=String(new URLSearchParams(location.search).get('id')||'').trim(),status=document.getElementById('status'),result=document.getElementById('result'),text=v=>String(v??'').trim(),isUrl=v=>/^https?:\/\//i.test(text(v));
    function urls(p={}){return{art:text(p.arte_horizontal||p.arte_personalizacao||p.arte_impressao?.url||p.art_url||p.arte_url),m1:text(p.mockup_1||p.url_imagem||p.imagem||p.imagens_site?.[0]||p.imagens?.[0]),m2:text(p.mockup_2||p.imagens_site?.[1]||p.imagens?.[1])}}
    async function load(){if(!id){status.textContent='Código da criação não informado.';status.classList.add('error');return}try{const r=await fetch(`${FIREBASE}/produtos/${encodeURIComponent(id)}.json?_=${Date.now()}`,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Firebase ${r.status}`);const u=urls(await r.json()||{});if(!isUrl(u.art))throw new Error('A arte horizontal ainda não está disponível.');if(!isUrl(u.m1)||!isUrl(u.m2))throw new Error('Os dois mockups ainda estão sendo preparados.');document.getElementById('art').src=u.art;document.getElementById('mockup1').src=u.m1;document.getElementById('mockup2').src=u.m2;status.hidden=true;result.hidden=false}catch(e){status.textContent=e?.message||'Não foi possível carregar esta criação.';status.classList.add('error')}}load()})();
  </script>
</body>
</html>
