<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#70422f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Personalizador de Canecas — Produção</title>
  <style>
    body{margin:0;background:#f5f1eb;color:#2f2925;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loading{background:#fff;border:1px solid #e6dbd1;border-radius:18px;padding:26px;box-shadow:0 12px 32px rgba(70,45,30,.10)}
    .loading strong{display:block;margin-bottom:6px}.loading span{color:#746b65;font-size:13px}
  </style>
</head>
<body>
  <main><div class="loading"><strong>Carregando o personalizador de canecas…</strong><span>Folha 248 × 98 mm</span></div></main>
  <script>
    (async()=>{
      try{
        if(typeof DecompressionStream!=='function') throw new Error('Atualize o navegador para abrir esta aplicação.');
        const version='20260730-18';
        const names=['app-v10.1.b64','app-v10.2.b64','app-v10.3.b64','app-v10.4.b64','app-v10.5.b64','app-v10.6.b64','app-v10.7.b64','app-v10.8.b64'];
        const parts=await Promise.all(names.map(async name=>{
          const response=await fetch(`assets/${name}?v=${version}`,{cache:'no-store'});
          if(!response.ok) throw new Error(`Falha ao carregar ${name}: HTTP ${response.status}`);
          return (await response.text()).trim();
        }));
        const compressed=Uint8Array.from(atob(parts.join('')),character=>character.charCodeAt(0));
        const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        const enhancements=[
          '<scr'+'ipt src="assets/canecas-ui-v16.js?v='+version+'"></scr'+'ipt>',
          '<scr'+'ipt src="assets/canecas-v15.js?v='+version+'"></scr'+'ipt>',
          '<scr'+'ipt src="assets/canecas-layout-v18.js?v='+version+'"></scr'+'ipt>'
        ].join('');
        const finalHtml=html.includes('</body>')?html.replace('</body>',enhancements+'</body>'):html+enhancements;
        document.open();document.write(finalHtml);document.close();
      }catch(error){
        console.error(error);
        document.body.innerHTML=`<main><div class="loading"><strong>Falha ao carregar a aplicação</strong><span>${error.message}</span></div></main>`;
      }
    })();
  </script>
</body>
</html>
