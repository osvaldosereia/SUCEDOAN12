<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FF6B1A">
  <title>CanecaFácil</title>
  <meta name="description" content="Canecas com arte, humor e personalidade. Escolha uma criação ou personalize do seu jeito.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./extensions-v2.css">
</head>
<body>
  <header class="floating-pill topbar" aria-label="Navegação principal">
    <button class="brand-button" data-action="home" aria-label="CanecaFácil, início">
      <span class="brand-mark" aria-hidden="true">◡</span>
      <span class="brand">Caneca<span>Fácil</span></span>
    </button>
    <div class="top-actions">
      <button class="icon-button" data-action="search" aria-label="Buscar canecas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      </button>
      <button class="icon-button favorite-header" data-action="favorites" aria-label="Ver favoritas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg>
      </button>
    </div>
  </header>

  <main id="viewer" class="viewer" aria-live="polite"></main>

  <nav class="floating-pill bottombar" aria-label="Atalhos">
    <button class="icon-button nav-button active" data-action="home" aria-label="Início">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
    </button>
    <button class="icon-button nav-button" data-action="explore" aria-label="Explorar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="icon-button nav-button" data-action="favorites" aria-label="Favoritas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg>
    </button>
    <button class="icon-button nav-button" data-action="creations" aria-label="Minhas canecas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h11a3 3 0 0 1 3 3v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1Z"/><path d="M19 11h1.2a2.8 2.8 0 0 1 0 5.6H19"/><path d="M8 4c0 1 1 1 1 2M12 3c0 1 1 1 1 2"/></svg>
    </button>
  </nav>

  <section class="overlay" id="searchOverlay" hidden>
    <div class="overlay-card search-card">
      <div class="overlay-head"><strong>Buscar canecas</strong><button class="icon-button" data-close="searchOverlay" aria-label="Fechar">×</button></div>
      <input id="searchInput" type="search" placeholder="Academia, professor, café..." autocomplete="off">
      <div id="searchResults" class="mini-grid"></div>
    </div>
  </section>

  <section class="overlay" id="exploreOverlay" hidden>
    <div class="overlay-card explore-card">
      <div class="overlay-head"><strong>Explorar</strong><button class="icon-button" data-close="exploreOverlay" aria-label="Fechar">×</button></div>
      <div id="categoryFilters" class="chips"></div>
      <div id="exploreGrid" class="explore-grid"></div>
    </div>
  </section>

  <section class="overlay" id="creationsOverlay" hidden>
    <div class="overlay-card creations-card">
      <div class="overlay-head"><div><small class="overlay-kicker">Seu dispositivo</small><strong>Minhas canecas</strong></div><button class="icon-button" data-close-v2="creationsOverlay" aria-label="Fechar">×</button></div>
      <p class="creations-intro">As criações feitas neste dispositivo ficam aqui para você continuar depois. Quando tivermos login, este módulo passa a sincronizar com sua conta.</p>
      <div id="creationsGrid" class="creations-grid"></div>
    </div>
  </section>

  <section class="overlay personalizer-overlay" id="personalizerOverlay" hidden>
    <div class="personalizer-shell personalizer-shell-v2">
      <div class="personalizer-top floating-pill">
        <strong>Personalizar</strong>
        <button class="icon-button" data-close="personalizerOverlay" aria-label="Fechar personalização">×</button>
      </div>
      <aside id="personalizerContext" class="personalizer-context" aria-hidden="true">
        <img id="personalizerContextImage" src="./assets/mockup-demo.svg" alt="">
        <div><small id="personalizerContextCategory">CanecaFácil</small><strong id="personalizerContextName">Sua caneca</strong></div>
      </aside>
      <div class="personalizer-stage">
        <iframe id="personalizerFrame" title="Personalizador CanecaFácil" allow="clipboard-write"></iframe>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./personalization-v2.js"></script>
</body>
</html>
