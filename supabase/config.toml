# Configuração explícita de autenticação das Edge Functions Dona Antônia.
# Mantém o comportamento já implantado e evita alterações acidentais em deploys futuros.

[functions.whatsapp-ingest]
verify_jwt = false

[functions.whatsapp-ingest-make-v1]
verify_jwt = false

[functions.whatsapp-outbound-v1]
verify_jwt = false

# Compatibilidade histórica. O dispatcher/cron canônicos já usam conversation-worker-v3.
[functions.conversation-worker-v2]
verify_jwt = false

[functions.conversation-worker-v3]
verify_jwt = false

# Agent Core usa segredos server-to-server próprios no corpo da função.
[functions.dona-antonia-agent-core-v1]
verify_jwt = false

[functions.dona-antonia-agent-learning-v1]
verify_jwt = false

[functions.admin-agent-learning-v1]
verify_jwt = true

[functions.bling-products-ingest]
verify_jwt = false

[functions.bling-products-import-once]
verify_jwt = false

[functions.inventory-count-v2]
verify_jwt = true

# Porta pública mínima: valida PIN com hash/rate-limit e emite bootstrap de sessão Supabase.
[functions.admin-pin-auth-v1]
verify_jwt = false

[functions.admin-ops-v1]
verify_jwt = true

[functions.admin-whatsapp-ops-v1]
