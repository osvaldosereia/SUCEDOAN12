<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fff"><title>Complete seus dados — CanecaFácil</title><link rel="stylesheet" href="./styles.css?v=20260828-1"><link rel="stylesheet" href="./enhancements-v2.css?v=20260828-2"><style>.reg{max-width:760px;margin:0 auto;padding:42px 18px 80px}.reg-head{margin-bottom:26px}.reg-head h1{font-size:clamp(34px,7vw,58px);letter-spacing:-.05em;margin:6px 0 10px}.reg-head p{color:#666;line-height:1.6}.reg-card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff}.reg-summary{background:var(--soft);padding:13px;border-radius:12px;margin-bottom:16px;font-size:12px;line-height:1.6}.reg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reg-grid .wide{grid-column:1/-1}.reg-msg{margin-top:14px;padding:13px;border-radius:12px;background:#f3f3f1;color:#555;font-size:12px}.reg-msg.good{background:#edf8ef;color:#225b31}.reg-msg.bad{background:#fff0ed;color:#8f3026}@media(max-width:620px){.reg{padding-top:26px}.reg-card{padding:14px}.reg-grid{grid-template-columns:1fr}.reg-grid .wide{grid-column:auto}}</style></head><body><div class="announcement">CanecaFácil <span>•</span> dados para fechar seu pedido com a Dona Antônia</div><header class="site-header"><div class="header-inner" style="grid-template-columns:1fr"><a class="brand" href="./"><span>Caneca</span><b>Fácil</b></a></div></header><main class="reg"><div class="reg-head"><div class="eyebrow">Finalização do pedido</div><h1>Complete seus dados</h1><p>Você já escolheu a caneca. Agora precisamos apenas dos dados necessários para nota fiscal, pagamento e envio.</p></div><section class="reg-card"><div id="regSummary" class="reg-summary">Carregando pedido…</div><form id="regForm" class="reg-grid" hidden><label class="field wide"><span>Nome completo *</span><input id="rName" required autocomplete="name"></label><label class="field"><span>CPF *</span><input id="rCpf" required inputmode="numeric" maxlength="14" autocomplete="off"></label><label class="field"><span>Celular *</span><input id="rPhone" required inputmode="tel" autocomplete="tel"></label><label class="field wide"><span>E-mail *</span><input id="rEmail" required type="email" autocomplete="email"></label><label class="field"><span>CEP *</span><input id="rCep" required inputmode="numeric" maxlength="9" autocomplete="postal-code"></label><label class="field"><span>UF *</span><input id="rUf" required maxlength="2"></label><label class="field wide"><span>Rua / Avenida *</span><input id="rStreet" required autocomplete="address-line1"></label><label class="field"><span>Número *</span><input id="rNumber" required></label><label class="field"><span>Complemento</span><input id="rComplement" autocomplete="address-line2"></label><label class="field"><span>Bairro *</span><input id="rDistrict" required></label><label class="field"><span>Cidade *</span><input id="rCity" required autocomplete="address-level2"></label><button class="btn accent wide" id="regSubmit" type="submit">SALVAR E FINALIZAR CADASTRO</button></form><div id="regMessage" class="reg-msg" hidden></div></section></main><script type="module" src="./cadastro.js?v=20260828-1"></script></body></html>
