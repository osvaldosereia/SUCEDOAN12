<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f7f8f7">
  <title>Admin simplificado · Dona Antônia</title>
  <link rel="stylesheet" href="./admin5.css?v=admin5-r1">
</head>
<body>
  <div class="admin-shell">
    <aside class="side-rail" aria-label="Navegação do Admin5">
      <a class="brand" href="/admin5/" aria-label="Dona Antônia Admin5">
        <img src="/img/logoantonia5.png" alt="Dona Antônia">
        <span><strong>Admin5</strong><small>Operação WhatsApp</small></span>
      </a>
      <nav class="main-nav">
        <button type="button" data-view="chat" class="nav-item active"><span aria-hidden="true">☏</span><span>Atendimento</span></button>
        <button type="button" data-view="products" class="nav-item"><span aria-hidden="true">□</span><span>Produtos</span></button>
        <button type="button" data-view="baskets" class="nav-item"><span aria-hidden="true">◇</span><span>Cestas</span></button>
        <button type="button" data-view="orders" class="nav-item"><span aria-hidden="true">▤</span><span>Pedidos</span></button>
        <button type="button" data-view="catalog" class="nav-item"><span aria-hidden="true">▦</span><span>Catálogo Meta</span></button>
      </nav>
      <div class="rail-bottom"><span class="live-dot"></span> 0975 e 1018</div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dona Antônia · operação</p>
          <h1 id="viewTitle">Atendimento</h1>
        </div>
        <div class="topbar-tools">
          <label class="operator-field">Operador
            <input id="operatorName" type="text" maxlength="80" placeholder="Seu nome">
          </label>
          <span id="connectionState" class="connection-state" role="status" aria-live="polite">Conectando…</span>
        </div>
      </header>

      <section id="viewRoot" class="view-root" aria-live="polite"></section>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <footer class="page-footer">Admin5 · painel simplificado · dados operacionais no Supabase</footer>
    </main>
  </div>
  <script type="module" src="./app.js?v=admin5-r1"></script>
</body>
</html>
