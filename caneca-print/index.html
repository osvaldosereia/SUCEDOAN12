<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ed;background:#101214;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101214}.app{max-width:1500px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:20;background:rgba(16,18,20,.95);backdrop-filter:blur(14px);padding:8px 0 14px;border-bottom:1px solid #272b2d}.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.brand h1{margin:0;font-size:25px}.brand p{margin:5px 0 0;color:#9ba39c;font-size:13px}.badge{padding:7px 10px;border:1px solid #343a3c;border-radius:999px;font-size:10px;color:#b9c0ba;background:#181b1d}.badge.good{border-color:#2d6645;color:#8fe2ae;background:#13251a}.tabs{display:flex;gap:6px;margin-top:13px}.tabs button{height:37px;border:1px solid #343a3c;border-radius:9px;background:#181b1d;color:#b9c0ba;padding:0 12px;font-weight:850;cursor:pointer}.tabs button.active{background:#eff5ee;color:#111614;border-color:#eff5ee}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:9px;margin-top:10px}.toolbar input,.toolbar select,.toolbar button{height:42px;border:1px solid #343a3c;border-radius:11px;background:#181b1d;color:#f2f4f1;padding:0 13px;font:inherit}.summary{display:flex;justify-content:space-between;gap:10px;margin:14px 0 10px;color:#aeb5af;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #2b3032;background:#171a1c;border-radius:16px;overflow:hidden}.card-head{padding:12px 13px 9px;display:flex;justify-content:space-between;gap:10px}.card-title{min-width:0}.card-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.card-title small{color:#8e9690;display:block;margin-top:3px}.source{display:inline-flex;padding:6px 8px;border-radius:8px;font-size:9px;font-weight:950;letter-spacing:.04em}.source.cf{background:#163151;color:#9dccff}.source.da{background:#34234a;color:#d8baf9}.state{font-size:9px;color:#8fe2ae;margin-top:5px;text-align:right}.art{margin:0;background:#f5f5f3;min-height:180px;display:grid;place-items:center;overflow:hidden}.art img{width:100%;aspect-ratio:2.5/1;object-fit:contain;display:block}.missing{color:#737973;font-size:11px;text-align:center;padding:22px}.job-info{padding:10px 13px;border-top:1px solid #282d2f;display:grid;grid-template-columns:1fr 1fr;gap:7px}.job-info div{padding:8px;border-radius:9px;background:#1e2224}.job-info b,.job-info span{display:block}.job-info b{font-size:15px}.job-info span{font-size:9px;color:#9da59f;margin-top:2px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px}.actions button{height:44px;border-radius:11px;font-weight:900;cursor:pointer}.print{border:0;background:#eff5ee;color:#111614}.download{grid-column:1/-1;border:1px solid #40644d;background:#17301f;color:#9ce5b3}.open,.reprint{border:1px solid #343a3c;background:#202426;color:#d6dbd7;padding:0 13px}.reprint{grid-column:1/-1}.actions button:disabled{opacity:.35;cursor:not-allowed}.empty{padding:60px 20px;text-align:center;border:1px dashed #343a3c;border-radius:16px;color:#9ba29d;grid-column:1/-1}.print-sheet{display:none}.notice{padding:10px 12px;background:#1b2020;border:1px solid #2b3430;border-radius:10px;color:#aeb7b0;font-size:10px;margin-top:10px}.error{color:#ff9991}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.app{padding:10px}.brandrow{display:block}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}.summary{display:grid}.tabs{overflow:auto}}
@page{size:106mm 247mm;margin:0}@media print{html,body{width:106mm!important;height:247mm!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}body>*:not(.print-sheet){display:none!important}.print-sheet{display:block!important;position:fixed!important;left:0!important;top:0!important;width:106mm!important;height:247mm!important;background:#fff!important;overflow:hidden!important}.print-viewport{position:absolute!important;left:0!important;top:6mm!important;width:106mm!important;height:235mm!important;overflow:hidden!important}.print-art-box{position:absolute!important;left:53mm!important;top:117.5mm!important;width:235mm!important;height:106mm!important;transform:translate(-50%,-50%) rotate(90deg) scaleX(-1)!important;transform-origin:center center!important;display:grid!important;place-items:center!important;overflow:hidden!important;background:#fff!important}.print-art-box img{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important}}
</style></head>
<body><main class="app"><section class="top"><div class="brandrow"><div class="brand"><h1>Caneca Print</h1><p>Fila única · Dona Antônia + CanecaFácil · Epson L1250</p></div><span class="badge good" id="modeBadge">Modo de impressão</span></div><div class="tabs"><button data-tab="queue" class="active">Fila de pedidos</button><button data-tab="catalog">Catálogo de artes</button></div><div class="toolbar"><input id="search" type="search" placeholder="Buscar pedido, cliente, nome ou código…" autocomplete="off"><select id="statusFilter"><option value="ready">Aguardando / reimpressão</option><option value="all">Todos os trabalhos</option><option value="impresso">Impressos</option></select><button id="reload" type="button">Atualizar</button></div><div class="notice" id="notice">Cada clique imprime uma caneca. Em pedidos com quantidade maior que 1, o contador avança depois de cada impressão.</div></section><div class="summary"><span id="summaryText">Carregando fila…</span><span>Impressão: 235 × 106 mm · espelhada · centralizada</span></div><section class="grid" id="grid"><div class="empty">Carregando…</div></section></main><section class="print-sheet" id="printSheet" aria-hidden="true"><div class="print-viewport"><div class="print-art-box"><img id="printArtwork" alt=""></div></div></section>
<script type="module">
import { FIREBASE_BASE, MUG_NODES, text, norm, mugArt, isMug, sourceLabel, safeKey, nowIso } from '../shared/mug-commerce-v1.js?v=20260828-1';
const BUILD='20260828-caneca-print-queue-v1';const state={tab:new URLSearchParams(location.search).get('mode')==='catalog'?'catalog':'queue',jobs:[],catalog:[],query:'',status:'ready',printing:null};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=v=>text(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');const kiosk=new URLSearchParams(location.search).get('kiosk')==='1';$('#modeBadge').textContent=kiosk?'1 clique ativo · Chrome kiosk':'Modo normal · painel do navegador';if(!kiosk)$('#modeBadge').classList.remove('good');
function active(v){if(v?.ativo===true)return true;if(v?.ativo===false)return false;return['a','ativo','ativa','active','1','true'].includes(norm(v?.situacao||v?.status||v?.ativo))}function sourceClass(v){return sourceLabel(v)==='CANECAFÁCIL'?'cf':'da'}
async function get(path){const r=await fetch(`${FIREBASE_BASE}/${path}.json?_=${Date.now()}`,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Firebase ${r.status}`);return r.json()}async function patch(path,data){const r=await fetch(`${FIREBASE_BASE}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(`Firebase ${r.status}`);return r.json().catch(()=>null)}
async function load(){try{$('#summaryText').textContent='Atualizando…';const[jobs,products]=await Promise.all([get(MUG_NODES.printJobs),get(MUG_NODES.products)]);state.jobs=Object.entries(jobs||{}).map(([key,v])=>({key,...(v||{})})).sort((a,b)=>new Date(a.criado_em||0)-new Date(b.criado_em||0));state.catalog=Object.entries(products||{}).map(([key,v])=>({key,...(v||{})})).filter(p=>isMug(p)&&active(p)&&mugArt(p)).sort((a,b)=>Number(b.last_update||0)-Number(a.last_update||0));render()}catch(e){console.error(e);$('#grid').innerHTML=`<div class="empty error">Erro ao carregar: ${esc(e.message||e)}</div>`;$('#summaryText').textContent='Falha no Firebase'}}
function visibleJobs(){const q=norm(state.query);return state.jobs.filter(j=>{const status=text(j.status||'aguardando');if(state.status==='ready'&&!['aguardando','reimpressao'].includes(status))return false;if(state.status==='impresso'&&status!=='impresso')return false;return!q||norm(`${j.pedido_id} ${j.cliente_nome} ${j.produto_nome} ${j.produto_codigo} ${sourceLabel(j.origem)}`).includes(q)})}
function jobCard(j){const art=mugArt(j);const qty=Math.max(1,Number(j.quantidade||1)),done=Math.max(0,Number(j.quantidade_impressa||0)),remaining=Math.max(0,qty-done);const status=text(j.status||'aguardando');return `<article class="card"><div class="card-head"><div class="card-title"><span class="source ${sourceClass(j.origem)}">${sourceLabel(j.origem)}</span><strong title="${esc(j.produto_nome)}" style="margin-top:7px">${esc(j.produto_nome||'Caneca')}</strong><small>Pedido ${esc(j.pedido_id||'—')} · ${esc(j.cliente_nome||'Cliente')}</small></div><div><div class="state">${esc(status.toUpperCase())}</div></div></div><figure class="art">${art?`<img loading="lazy" src="${esc(art)}" alt="Arte horizontal">`:'<div class="missing">Arte horizontal indisponível</div>'}</figure><div class="job-info"><div><b>${done}/${qty}</b><span>impressas</span></div><div><b>${remaining}</b><span>restante(s)</span></div><div><b>${esc(j.arte_aprovada?.versao||'v1')}</b><span>versão da arte</span></div><div><b>${Number(j.tentativas_impressao||0)}</b><span>tentativas</span></div></div><div class="actions"><button class="print" data-print-job="${esc(j.key)}" ${!art||remaining<=0?'disabled':''}>${remaining>0?`IMPRIMIR 1 DE ${remaining}`:'CONCLUÍDO'}</button><button class="open" data-open="${esc(art)}" ${art?'':'disabled'}>Abrir</button><button class="download" data-download="${esc(art)}" data-name="${esc(j.pedido_id||j.id||'caneca')}" ${art?'':'disabled'}>BAIXAR ARTE</button>${status==='impresso'?`<button class="reprint" data-reprint="${esc(j.key)}">LIBERAR REIMPRESSÃO</button>`:''}</div></article>`}
function catalogCard(p){const art=mugArt(p);return `<article class="card"><div class="card-head"><div class="card-title"><span class="source da">CATÁLOGO</span><strong style="margin-top:7px">${esc(p.nome||'Caneca')}</strong><small>${esc(p.codigo||p.key)}</small></div><div class="state">ATIVA</div></div><figure class="art"><img loading="lazy" src="${esc(art)}" alt="Arte horizontal"></figure><div class="actions"><button class="print" data-print-catalog="${esc(p.key)}">IMPRIMIR ARTE</button><button class="open" data-open="${esc(art)}">Abrir</button><button class="download" data-download="${esc(art)}" data-name="${esc(p.codigo||p.key)}">BAIXAR ARTE</button></div></article>`}
function render(){$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#statusFilter').disabled=state.tab==='catalog';if(state.tab==='queue'){const list=visibleJobs();$('#summaryText').textContent=`${list.length} trabalho(s) visível(is) · ${state.jobs.filter(j=>['aguardando','reimpressao'].includes(text(j.status))).length} aguardando`;$('#grid').innerHTML=list.map(jobCard).join('')||'<div class="empty">Nenhum trabalho nesta fila.</div>'}else{const q=norm(state.query);const list=state.catalog.filter(p=>!q||norm(`${p.nome} ${p.codigo}`).includes(q));$('#summaryText').textContent=`${list.length} arte(s) do catálogo`;$('#grid').innerHTML=list.map(catalogCard).join('')||'<div class="empty">Nenhuma arte ativa encontrada.</div>'}}
async function startPrint({art,jobKey=null}){if(!art)return;if(state.printing)return;state.printing={jobKey};$('#printArtwork').src=art;if(jobKey){const j=state.jobs.find(x=>x.key===jobKey);await patch(`${MUG_NODES.printJobs}/${safeKey(jobKey)}`,{status:'imprimindo',tentativas_impressao:Number(j?.tentativas_impressao||0)+1,ultima_impressao_iniciada_em:nowIso(),atualizado_em:nowIso()});if(j){j.status='imprimindo';j.tentativas_impressao=Number(j.tentativas_impressao||0)+1}}setTimeout(()=>window.print(),140)}
async function finishPrint(){const current=state.printing;state.printing=null;if(!current?.jobKey)return;const j=state.jobs.find(x=>x.key===current.jobKey);if(!j)return;const qty=Math.max(1,Number(j.quantidade||1)),done=Math.min(qty,Number(j.quantidade_impressa||0)+1),finished=done>=qty;try{await patch(`${MUG_NODES.printJobs}/${safeKey(j.key)}`,{quantidade_impressa:done,status:finished?'impresso':'aguardando',ultima_impressao_concluida_em:nowIso(),impresso_em:finished?nowIso():null,atualizado_em:nowIso()});j.quantidade_impressa=done;j.status=finished?'impresso':'aguardando';render()}catch(e){alert(`A impressão foi enviada, mas o contador não atualizou: ${e.message||e}`)}}
window.addEventListener('afterprint',()=>setTimeout(finishPrint,100));
$$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('#search').oninput=e=>{state.query=e.target.value;render()};$('#statusFilter').onchange=e=>{state.status=e.target.value;render()};$('#reload').onclick=load;$('#grid').onclick=async e=>{const jb=e.target.closest('[data-print-job]');if(jb){const j=state.jobs.find(x=>x.key===jb.dataset.printJob);return startPrint({art:mugArt(j),jobKey:j.key})}const cp=e.target.closest('[data-print-catalog]');if(cp){const p=state.catalog.find(x=>x.key===cp.dataset.printCatalog);return startPrint({art:mugArt(p)})}const op=e.target.closest('[data-open]');if(op?.dataset.open)return window.open(op.dataset.open,'_blank','noopener');const rp=e.target.closest('[data-reprint]');if(rp){const j=state.jobs.find(x=>x.key===rp.dataset.reprint);if(!j)return;const reason=prompt('Motivo da reimpressão (quebra, falha de impressão, cor, defeito ou outro):','falha de impressão');if(reason===null)return;await patch(`${MUG_NODES.printJobs}/${safeKey(j.key)}`,{status:'reimpressao',quantidade_impressa:Math.max(0,Number(j.quantidade_impressa||0)-1),motivo_reimpressao:text(reason),reimpressao_liberada_em:nowIso(),atualizado_em:nowIso()});return load()}const dl=e.target.closest('[data-download]');if(dl?.dataset.download){try{const r=await fetch(dl.dataset.download);if(!r.ok)throw new Error(`HTTP ${r.status}`);const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${dl.dataset.name||'caneca'}-arte.webp`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(err){alert(`Não foi possível baixar a arte: ${err.message||err}`)}}};document.documentElement.dataset.canecaPrintBuild=BUILD;load();
</script></body></html>
