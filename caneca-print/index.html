<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101214">
  <title>Caneca Print — Dona Antônia</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ed;background:#101214;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:#101214}.app{max-width:1500px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:20;background:rgba(16,18,20,.94);backdrop-filter:blur(14px);padding:8px 0 14px;border-bottom:1px solid #272b2d}.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.brand h1{margin:0;font-size:25px}.brand p{margin:5px 0 0;color:#9ba39c;font-size:13px}.badge{padding:7px 10px;border:1px solid #343a3c;border-radius:999px;font-size:11px;color:#b9c0ba;background:#181b1d}.badge.good{border-color:#2d6645;color:#8fe2ae;background:#13251a}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:9px;margin-top:14px}.toolbar input,.toolbar button{height:42px;border:1px solid #343a3c;border-radius:11px;background:#181b1d;color:#f2f4f1;padding:0 13px;font:inherit}.summary{display:flex;justify-content:space-between;gap:10px;margin:14px 0 10px;color:#aeb5af;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #2b3032;background:#171a1c;border-radius:16px;overflow:hidden}.card-head{padding:12px 13px 9px;display:flex;justify-content:space-between;gap:10px}.card-title{min-width:0}.card-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.card-title small{color:#8e9690}.state{font-size:10px;color:#8fe2ae}.art{margin:0;background:#f5f5f3;min-height:180px;display:grid;place-items:center;overflow:hidden}.art img{width:100%;aspect-ratio:2.5/1;object-fit:contain;display:block}.missing{color:#737973;font-size:11px;text-align:center;padding:22px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px}.actions button{height:44px;border-radius:11px;font-weight:900;cursor:pointer}.print{border:0;background:#eff5ee;color:#111614}.download{grid-column:1/-1;border:1px solid #40644d;background:#17301f;color:#9ce5b3}.open{border:1px solid #343a3c;background:#202426;color:#d6dbd7;padding:0 13px}.actions button:disabled{opacity:.35;cursor:not-allowed}.empty{padding:60px 20px;text-align:center;border:1px dashed #343a3c;border-radius:16px;color:#9ba29d;grid-column:1/-1}.print-sheet{display:none}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:680px){.app{padding:10px}.brandrow{display:block}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}}
    @page{size:106mm 247mm;margin:0}
    @media print{html,body{width:106mm!important;height:247mm!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}body>*:not(.print-sheet){display:none!important}.print-sheet{display:block!important;position:fixed!important;left:0!important;top:0!important;width:106mm!important;height:247mm!important;background:#fff!important;overflow:hidden!important}.print-viewport{position:absolute!important;left:0!important;top:6mm!important;width:106mm!important;height:235mm!important;overflow:hidden!important}.print-art-box{position:absolute!important;left:53mm!important;top:117.5mm!important;width:235mm!important;height:106mm!important;transform:translate(-50%,-50%) rotate(90deg) scaleX(-1)!important;transform-origin:center center!important;display:grid!important;place-items:center!important;overflow:hidden!important;background:#fff!important}.print-art-box img{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important}}
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="brandrow"><div class="brand"><h1>Caneca Print</h1><p>Epson L1250 · somente arte horizontal pronta para sublimação</p></div><span class="badge good" id="modeBadge">Modo de impressão</span></div>
      <div class="toolbar"><input id="search" type="search" placeholder="Buscar por nome ou código…" autocomplete="off"><button id="readyOnly" type="button">Somente prontas</button><button id="reload" type="button">Atualizar</button></div>
    </section>
    <div class="summary"><span id="summaryText">Carregando canecas…</span><span>Impressão: 235 × 106 mm · centralizada</span></div>
    <section class="grid" id="grid"><div class="empty">Carregando catálogo de impressão…</div></section>
  </main>
  <section class="print-sheet" id="printSheet" aria-hidden="true"><div class="print-viewport"><div class="print-art-box"><img id="printArtwork" alt=""></div></div></section>
  <script>
  (()=>{
    const FIREBASE_BASE='https://cedar-chemist-310801-default-rtdb.firebaseio.com';
    const CATEGORIES=['Caneca de Porcelana','Canecas de Porcelana'];
    const state={rows:[],query:'',readyOnly:true};
    const $=s=>document.querySelector(s); const text=v=>String(v??'').trim(); const norm=v=>text(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const esc=v=>text(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    const kiosk=new URLSearchParams(location.search).get('kiosk')==='1'; $('#modeBadge').textContent=kiosk?'1 clique ativo · Chrome kiosk':'Modo normal · painel do navegador'; if(!kiosk)$('#modeBadge').classList.remove('good');
    function firstUrl(...values){for(const value of values.flat(Infinity)){const url=text(value);if(/^https?:\/\//i.test(url))return url;}return '';}
    function active(v){if(v?.ativo===true)return true;if(v?.ativo===false)return false;return ['a','ativo','ativa','active','1','true'].includes(norm(v?.situacao||v?.status||v?.ativo));}
    function categoryOk(v){return CATEGORIES.some(c=>norm(v?.categoria)===norm(c));}
    function horizontalUrl(v){const p=v?.arte_impressao;const admin=Array.isArray(v?.midias_admin)?v.midias_admin:[];return firstUrl(v?.arte_horizontal,v?.arte_personalizacao,p&&typeof p==='object'?p.url:p,admin[3],admin[2]);}
    async function fetchRows(){const all=[];for(const category of CATEGORIES){const u=new URL(`${FIREBASE_BASE}/produtos.json`);u.searchParams.set('orderBy',JSON.stringify('categoria'));u.searchParams.set('equalTo',JSON.stringify(category));const r=await fetch(u,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Firebase HTTP ${r.status}`);const data=await r.json();Object.entries(data||{}).forEach(([key,v])=>{if(!v||typeof v!=='object'||!categoryOk(v)||!active(v))return;const art=horizontalUrl(v);all.push({firebaseKey:text(v.firebaseKey||v.id||key),codigo:text(v.codigo||v.sku||v.id||key),nome:text(v.nome||v.titulo||'Caneca'),arte_horizontal:art,pronto_impressao:Boolean(art),last_update:Number(v.last_update||Date.parse(v.updated_at||v.criado_em||'')||0)});});}const map=new Map();all.forEach(r=>map.set(r.firebaseKey,r));return [...map.values()].sort((a,b)=>b.last_update-a.last_update);}
    function render(){const q=norm(state.query);const visible=state.rows.filter(r=>(!state.readyOnly||r.pronto_impressao)&&(!q||norm(`${r.nome} ${r.codigo}`).includes(q)));$('#summaryText').textContent=`${visible.length} de ${state.rows.length} caneca(s) · ${state.rows.filter(r=>r.pronto_impressao).length} prontas para imprimir`;$('#readyOnly').textContent=state.readyOnly?'Mostrar todas':'Somente prontas';$('#grid').innerHTML=visible.length?visible.map(r=>`<article class="card"><div class="card-head"><div class="card-title"><strong title="${esc(r.nome)}">${esc(r.nome)}</strong><small>${esc(r.codigo)}</small></div><span class="state">ATIVA</span></div><figure class="art">${r.arte_horizontal?`<img loading="lazy" src="${esc(r.arte_horizontal)}" alt="Arte horizontal de ${esc(r.nome)}">`:'<div class="missing">Arte horizontal indisponível</div>'}</figure><div class="actions"><button class="print" data-print="${esc(r.firebaseKey)}" ${r.arte_horizontal?'':'disabled'}>IMPRIMIR ARTE</button><button class="open" data-open="${esc(r.arte_horizontal)}" ${r.arte_horizontal?'':'disabled'}>Abrir</button><button class="download" data-download="${esc(r.arte_horizontal)}" data-name="${esc(r.codigo||r.firebaseKey)}" ${r.arte_horizontal?'':'disabled'}>BAIXAR ARTE</button></div></article>`).join(''):'<div class="empty">Nenhuma caneca encontrada.</div>';}
    async function load(){try{$('#summaryText').textContent='Atualizando canecas…';state.rows=await fetchRows();render();}catch(e){console.error(e);$('#grid').innerHTML=`<div class="empty">Erro ao carregar: ${esc(e.message||e)}</div>`;}}
    $('#search').addEventListener('input',e=>{state.query=e.target.value;render();});$('#readyOnly').addEventListener('click',()=>{state.readyOnly=!state.readyOnly;render();});$('#reload').addEventListener('click',load);
    $('#grid').addEventListener('click',async e=>{const print=e.target.closest('[data-print]');if(print){const row=state.rows.find(r=>r.firebaseKey===print.dataset.print);if(!row?.arte_horizontal)return;$('#printArtwork').src=row.arte_horizontal;setTimeout(()=>window.print(),120);return;}const open=e.target.closest('[data-open]');if(open?.dataset.open)window.open(open.dataset.open,'_blank','noopener');const dl=e.target.closest('[data-download]');if(dl?.dataset.download){try{const r=await fetch(dl.dataset.download);if(!r.ok)throw new Error(`HTTP ${r.status}`);const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${dl.dataset.name||'caneca'}-arte.webp`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(err){alert(`Não foi possível baixar a arte: ${err.message||err}`);}}});
    load();
  })();
  </script>
</body>
</html>
