<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Catálogo · Dona Antônia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin1/styles.css?v=1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/admin1/" aria-label="Dona Antônia Catálogo">
        <span class="brand-mark">DA</span>
        <span><strong>Dona Antônia</strong><small>Administração do catálogo</small></span>
      </a>
      <div class="sidebar-label">CATÁLOGO</div>
      <nav class="nav-list" aria-label="Navegação principal">
        <button class="nav-item active" data-view="products"><span class="nav-icon">▦</span>Produtos</button>
        <button class="nav-item" data-view="baskets"><span class="nav-icon">◈</span>Cestas <small>em breve</small></button>
        <button class="nav-item" data-view="bling"><span class="nav-icon">↔</span>Integração Bling</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection"><span class="connection-dot" id="sessionDot"></span><span id="sessionLabel">Catálogo ativo</span></div>
        <button class="quiet-button" id="logoutButton" type="button"></button>
        <a class="store-link" href="https://www.donaantonia.com.br/" target="_blank" rel="noopener">Abrir loja <span>↗</span></a>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Administração</span><span class="slash">/</span><strong id="currentSection">Produtos</strong></div>
        <div class="topbar-right"><span class="secure-label"><span class="lock-icon">●</span> Somente leitura</span><span class="avatar">DA</span></div>
      </header>
      <section id="workspace" class="workspace" aria-live="polite">
        <div class="loading-card"><span class="spinner"></span><strong>Conectando ao catálogo ativo</strong><small>Carregando produtos publicados no catálogo.</small></div>
      </section>
    </main>
  </div>
  <dialog id="editorDialog" class="editor-dialog" aria-labelledby="dialogTitle">
    <form id="editorForm" method="dialog">
      <div class="dialog-head"><div><span class="eyebrow" id="dialogEyebrow">CATÁLOGO</span><h2 id="dialogTitle">Editar cadastro</h2></div><button class="icon-button" value="cancel" aria-label="Fechar">×</button></div>
      <div id="dialogContent" class="dialog-content"></div>
      <div id="dialogFooter" class="dialog-footer"></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/admin1/src/app.js?v=2"></script>
</body>
</html>
