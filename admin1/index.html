<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Produtos · Dona Antônia Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin1/styles.css?v=7">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/admin1/" aria-label="Dona Antônia Catálogo">
        <span class="brand-mark">DA</span>
        <span><strong>Dona Antônia</strong><small>Administração do catálogo</small></span>
      </a>
      <div class="sidebar-label">CATÁLOGO</div>
      <nav class="nav-list" aria-label="Navegação principal">
        <button class="nav-item active" data-view="products"><span class="nav-icon">▦</span>Produtos</button>
        <button class="nav-item nav-item-disabled" type="button" disabled aria-label="Gestão de cestas será adicionada depois"><span class="nav-icon">◈</span>Cestas <small>depois</small></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection"><span class="connection-dot online" id="sessionDot"></span><span id="sessionLabel">Produtos</span></div>
        <a class="store-link" href="https://www.donaantonia.com.br/" target="_blank" rel="noopener">Abrir loja <span>↗</span></a>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Administração</span><span class="slash">/</span><strong id="currentSection">Produtos</strong></div>
        <div class="topbar-right"><span class="secure-label"><span class="lock-icon">●</span> Gestão do catálogo</span><span class="avatar" aria-label="Dona Antônia">DA</span></div>
      </header>
      <section id="workspace" class="workspace" aria-live="polite">
        <div class="loading-card"><span class="spinner"></span><strong>Carregando produtos</strong><small>Consultando o catálogo da loja.</small></div>
      </section>
    </main>
  </div>
  <dialog id="productDialog" class="product-dialog" aria-labelledby="productDialogTitle">
    <div class="product-dialog-shell">
      <header class="product-dialog-head">
        <div><span class="eyebrow">CATÁLOGO · STATUS DO PRODUTO</span><h2 id="productDialogTitle">Detalhes do produto</h2></div>
        <button class="icon-button" id="closeProductDialog" type="button" aria-label="Fechar detalhes">×</button>
      </header>
      <div id="productDialogContent" class="product-dialog-content"></div>
      <footer class="product-dialog-foot" id="productDialogFoot"><span class="readonly-badge"><i aria-hidden="true"></i>Dados do catálogo</span></footer>
    </div>
  </dialog>
  <script type="module" src="/admin1/src/app.js?v=11"></script>
</body>
</html>
