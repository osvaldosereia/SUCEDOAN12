  <script>
  (() => {
    'use strict';

    const API = 'https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/storefront-v2';
    const LEGACY_PRODUCT_API = 'https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/admin-service-intelligence-v1';
    const WHATSAPP_CHANNELS={'0975':'5565998150975','1018':'5565984491018'};
    const DEFAULT_WHATSAPP_ORIGIN='0975';
    const WHATSAPP=WHATSAPP_CHANNELS[DEFAULT_WHATSAPP_ORIGIN];
    const MARKETING_CONTEXT_KEY='da_vitrine_marketing_context_v1';
    const CAMPAIGN_BRANDS={
      'nivea':{signal:'NIVEA',label:'NIVEA'},
      'elseve':{signal:'ELSEVE',label:'Elseve'}
    };
    const MARKETING_CATEGORIES=new Set(['bebe','cabelos','beleza','higiene','limpeza','lavanderia','pet','casa','doces-lanches']);
    const MARKETING_CTA_PRIORITY=['BEBE','CABELOS','BELEZA','LIMPEZA','LAVANDERIA','PET'];
    const MINIMUM_ORDER_CENTS = 7500;
    const BUSINESS_TIME_ZONE = 'America/Cuiaba';
    const STORAGE_KEY = 'da_simple_storefront_cart_v2';
    const WHATSAPP_PHONE_KEY = 'da_vitrine_whatsapp_phone_v1';
    const HOME_CACHE_KEY = 'da_storefront_home_carousel_v1';
    const OFFERS_CACHE_KEY = 'da_storefront_offers_v2';
    const STATIC_CATEGORIES = [
      {key:'mercearia',label:'Mercearia'},
      {key:'limpeza_lavanderia',label:'Limpeza e lavanderia'},
      {key:'higiene_beleza',label:'Higiene e beleza'},

    const $ = s => document.querySelector(s);
    const content = $('#content');
    const nav = $('#nav');
    const overlay = $('#overlay');
    const sheetBody = $('#sheetBody');
    const sheetAction = $('#sheetAction');
    const sheetTitle = $('#sheetTitle');
    const state = {
      home: {baskets:[],categories:STATIC_CATEGORIES,basket_categories:[]},
      offers: [],
      offersLoaded: false,
      offersPromise: null,
      offersObserver: null,
      view: 'home',
      cart: loadCart(),
      basketDraft: null,
      sheetSeq: 0,
      orderSubmitting: false,
      category: null,
      basketCategory: '',
      nextOffset: null,
      query: '',
      productsById: new Map(),
      checkoutPayment: '',
      checkoutQuoteTimers: new Map(),
      detailReturn: '',
      lastFocus: null,
      whatsappPhone: '',
      whatsappOrigin: DEFAULT_WHATSAPP_ORIGIN,
      marketingContext: null,
      marketingEntryApplied: false,
      checkoutDdd: '65',
      checkoutPhone: '9',
      checkoutName: '',
      customerLookup: {status:'idle',phoneKey:'',customer:null},
      checkoutDeliveryDate: '',
      deliveryOptions: [],
      addressConfirmed: false,
      editRegistration: false,
      categorySubcategories: {},
      subcategoriesExpanded: {}
    };
    const homeSubgroupSignatures=new WeakMap();

    // Quotes belong to live cart item objects, not changing numeric positions.
    // Keep these flags out of localStorage so a reload can never inherit a stuck "pending" state.
    const checkoutQuoteFlags=new WeakMap();
    function checkoutQuoteStatus(item){
      if(!item)return {revision:0,pending:false,error:false};
      let status=checkoutQuoteFlags.get(item);
      if(!status){status={revision:0,pending:false,error:false};checkoutQuoteFlags.set(item,status)}
      return status;
    }
    function checkoutHasPendingQuotes(){return state.cart.some(item=>item.type==='basket'&&(checkoutQuoteStatus(item).pending||checkoutQuoteStatus(item).error))}
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
    const money = cents => (Number(cents || 0) / 100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const basketName = name => name === 'Economica Bonini' ? 'Econômica com Arroz Tio Bonini' : String(name || 'Cesta básica');
    const safeImage = url => url || '/img/logoantonia5.png';

    function normalizeWhatsappPhone(value){
      let digits=String(value??'').replace(/\D+/g,'');
      if(digits.startsWith('00'))digits=digits.slice(2);
      let local='';
      if(digits.startsWith('55')&&(digits.length===12||digits.length===13))local=digits.slice(2);
      else if(digits.length===10||digits.length===11)local=digits;
      else return '';
      if(local.length===10&&/[6-9]/.test(local.charAt(2)))local=local.slice(0,2)+'9'+local.slice(2);
      return '+55'+local;
    }
    function marketingSlug(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
    function readStoredMarketingContext(){try{const value=JSON.parse(sessionStorage.getItem(MARKETING_CONTEXT_KEY)||'null');if(!value||Date.now()-Number(value.captured_at||0)>4*60*60*1000)return null;return value}catch{return null}}
    function captureMarketingEntryContext(){
      const params=new URLSearchParams(location.search),keys=['origem','ofertas','categoria','marca','campanha'],hasEntry=keys.some(k=>params.has(k));
      let ctx=readStoredMarketingContext();
      if(hasEntry){
        const requestedOrigin=String(params.get('origem')||'').trim(),origin=WHATSAPP_CHANNELS[requestedOrigin]?requestedOrigin:DEFAULT_WHATSAPP_ORIGIN;
        const category=marketingSlug(params.get('categoria')||''),brand=marketingSlug(params.get('marca')||''),campaign=marketingSlug(params.get('campanha')||'');

    function splitBasketGroupLooseCapacity(item,itemIndex,group){const rows=(item.components||[]).filter(c=>c.component_group===group&&Number(c.quantity||0)>0);if(!rows.length)return 30;let max=30;for(const comp of rows){const remaining=remainingStock(comp.product_id,itemIndex,comp.stock_quantity);if(remaining!==null)max=Math.min(max,Math.floor((remaining+1e-9)/Number(comp.quantity||1)))}return Math.max(0,max)}
    function maxBasketQty(item,itemIndex){if(item?.type==='basket_mold'){
      const needed=new Map();
      for(const comp of item.components||[]){const qty=Math.max(0,Number(comp.quantity||0));if(qty>0){const id=String(comp.product_id),old=needed.get(id);needed.set(id,{quantity:(old?.quantity||0)+qty,stock:comp.stock_quantity})}}

      let max=30;for(const [id,c] of needed){const available=remainingStock(id,itemIndex,c.stock);if(available!==null)max=Math.min(max,Math.floor((available+1e-9)/c.quantity))}
      return Math.max(0,max)
    }if(item?.split_mode){let max=30;const foodChanged=basketGroupChanged(item,'food');if(foodChanged)max=Math.min(max,splitBasketGroupLooseCapacity(item,itemIndex,'food'));else max=Math.min(max,Math.max(0,Math.floor(Number(item.food_lot_quantity||item.basket_stock_quantity||0)-cartLotUsed(item.food_lot_id,itemIndex,'food'))));if(item.uses_hygiene_kit){const hygieneChanged=basketGroupChanged(item,'hygiene');if(hygieneChanged)max=Math.min(max,splitBasketGroupLooseCapacity(item,itemIndex,'hygiene'));else max=Math.min(max,Math.max(0,Math.floor(Number(item.hygiene_lot_quantity||item.basket_stock_quantity||0)-cartLotUsed(item.hygiene_lot_id,itemIndex,'hygiene'))))}return Math.max(0,max)}if(item?.lot_id)return Math.max(0,Math.min(30,Math.floor(Number(item.basket_stock_quantity||0)-cartLotUsed(item.lot_id,itemIndex,''))));const comps=(item.components||[]).filter(c=>Number(c.quantity||0)>0);if(!comps.length)return 0;let max=30;for(const comp of comps){const base=Number(comp.base_quantity||0),extra=Math.max(0,Number(comp.quantity||0)-base),remaining=remainingStock(comp.product_id,itemIndex,comp.stock_quantity);if(extra>0&&remaining!==null)max=Math.min(max,Math.floor((remaining+1e-9)/extra))}return Math.max(0,max)}

    async function api(action,params={},options={}){
      const url=new URL(API);
      url.searchParams.set('action',action);
      if(action==='home')url.searchParams.set('layout','basket-carousel-v1');
      Object.entries(params).forEach(([k,v])=>{if(v!==''&&v!=null)url.searchParams.set(k,String(v))});
      const stockSensitive=['offers','products','product','basket','basket_mold_options','basket_extra_products','basket_quote','basket_mold_quote','submit_order'].includes(action);
      const retryableRead=(!options.method||options.method==='GET')&&['home','home_size_cards','products','subcategories'].includes(action);
      const attempts=retryableRead&&!options.signal?2:1;
      for(let attempt=0;attempt<attempts;attempt++){
        const controller=options.signal?null:new AbortController();
        const timeoutMs=action==='home_priority'||action==='home_size_cards'?6000:retryableRead?9000:12000;
        const timer=controller?setTimeout(()=>controller.abort(),timeoutMs):null;
        try{
          const response=await fetch(url,{cache:stockSensitive?'no-store':'default',...options,signal:options.signal||controller?.signal});
          const data=await response.json().catch(()=>({ok:false}));
          if(!response.ok||data.ok===false){
            const error=new Error(data.error||'Não foi possível carregar.');
            error.payload=data;error.status=response.status;
            throw error;
          }
          const invalidHome=['home','home_priority'].includes(action)&&(!Array.isArray(data.baskets)||!Array.isArray(data.basket_categories));
          const invalidProducts=action==='products'&&!Array.isArray(data.products);
          const invalidSubcategories=action==='subcategories'&&!Array.isArray(data.subcategories);
          const invalidOffers=action==='offers'&&!Array.isArray(data.offers);
          if(invalidHome||invalidProducts||invalidSubcategories||invalidOffers){
            const error=new Error('invalid_catalog_response');error.status=502;throw error;
          }
          return data;
        }catch(error){
          const status=Number(error?.status||0);
          if(attempt+1>=attempts||(status>=400&&status<500&&status!==408&&status!==429))throw error;
          await new Promise(resolve=>setTimeout(resolve,450));
        }finally{if(timer)clearTimeout(timer)}
      }
      throw new Error('catalog_request_failed');
    }

    function syncHomeBasketGroups(host,records){
      let changed=false;
      const wantedGroups=new Set();
      records.forEach((group,index)=>{
        let sectionNode=[...host.children].find(node=>node.dataset.homeBasketGroup===group.id);
        if(!sectionNode){
          sectionNode=fragmentElement(section(group.name,'',''));
          sectionNode.dataset.homeBasketGroup=group.id;
          changed=true;
        }
        wantedGroups.add(sectionNode);
        const heading=sectionNode.querySelector('.section-head h2');
        if(heading&&heading.textContent!==group.name){heading.textContent=group.name;changed=true}
        const wantedSubgroups=new Set();
        group.subgroups.forEach((sub,subIndex)=>{
          let subgroup=[...sectionNode.children].find(node=>node.dataset.homeSubgroup===sub.id);
          if(!subgroup||homeSubgroupSignatures.get(subgroup)!==sub.signature){
            const replacement=fragmentElement(sub.markup());
            if(subgroup)preserveUnchangedBasketCards(subgroup,replacement);
            homeSubgroupSignatures.set(replacement,sub.signature);
            if(subgroup)subgroup.replaceWith(replacement);
            subgroup=replacement;changed=true;
          }
          wantedSubgroups.add(subgroup);
          const current=[...sectionNode.children].filter(node=>node.classList.contains('basket-subgroup'))[subIndex];
          if(current!==subgroup){sectionNode.insertBefore(subgroup,current||null);changed=true}
        });
        [...sectionNode.children].filter(node=>node.classList.contains('basket-subgroup')).forEach(node=>{
          if(!wantedSubgroups.has(node)){node.remove();changed=true}
        });
        if(host.children[index]!==sectionNode){host.insertBefore(sectionNode,host.children[index]||null);changed=true}
      });
      [...host.children].forEach(node=>{if(!wantedGroups.has(node)){node.remove();changed=true}});
      if(changed){
        host.querySelectorAll('[data-basket]').forEach(btn=>btn.onclick=()=>openBasket(btn.dataset.basket));
        BasketCarousel.mount(host);
      }
      return changed;

      try{
        if(!(await validateMoldCartBeforeCheckout())){state.orderSubmitting=false;updateCheckoutSubmitState();return}
        saved=await api('submit_order',{},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_method:selected?.value||'',whatsapp_phone:checkoutPhone,delivery_date:state.checkoutDeliveryDate||'',whatsapp_origin:state.whatsappOrigin,marketing_context:state.marketingContext||null,items:state.cart.map(item=>({type:item.type,id:item.id,qty:Number(item.qty||1),composition_number:item.type==='basket_mold'?Number(item.composition_number||1):null,lot_id:item.type==='basket'?(item.lot_id||null):null,split_mode:item.type==='basket'&&item.split_mode===true,food_lot_id:item.type==='basket'?(item.food_lot_id||null):null,hygiene_lot_id:item.type==='basket'?(item.hygiene_lot_id||null):null,components:['basket','basket_mold'].includes(item.type)?(item.components||[]):[]}))})})
      }catch(e){
        state.orderSubmitting=false;updateCheckoutSubmitState();
        if(['insufficient_stock','product_unavailable','basket_unavailable','basket_lot_unavailable','basket_lot_insufficient','basket_component_not_in_lot','basket_kit_lot_unavailable','basket_kit_lot_insufficient','basket_component_not_in_selected_kit','basket_mold_unavailable','basket_mold_not_configured','basket_mold_component_invalid','basket_mold_option_invalid','basket_mold_composition_invalid'].includes(e.message))toast('O estoque mudou. Atualize a cesta e tente novamente.');else toast('Não consegui registrar. Tente novamente.');
        return
      }
      state.orderSubmitting=false;state.cart=[];state.addressConfirmed=false;state.checkoutDeliveryDate='';saveCart();paintCart();renderOrderSuccess(saved);
      toast('Pedido recebido. Enviaremos no WhatsApp o link para conferir seu pedido.')
    }
    $('#globalSearchForm').onsubmit=e=>{e.preventDefault();const q=$('#globalSearchInput').value.trim();if(q)renderSearch(q)};
    // Local Web Vitals diagnostics: no customer data or telemetry is transmitted.
    const homePerf={fcpMs:null,lcpMs:null,firstBasketImageMs:null};
    function observeHomePerformance(){
      if(!('PerformanceObserver' in window))return;
      try{
        const paints=new PerformanceObserver(list=>{
          for(const item of list.getEntries())if(item.name==='first-contentful-paint')homePerf.fcpMs=Math.round(item.startTime);
        });
        paints.observe({type:'paint',buffered:true});
      }catch{}
      try{
        const lcp=new PerformanceObserver(list=>{
          for(const item of list.getEntries())homePerf.lcpMs=Math.round(item.startTime);
        });
        lcp.observe({type:'largest-contentful-paint',buffered:true});
      }catch{}
      try{
        const images=new PerformanceObserver(list=>{
          for(const item of list.getEntries())if(item.name&&item.name.includes('/storage/v1/object/public/product-images/')&&homePerf.firstBasketImageMs===null)homePerf.firstBasketImageMs=Math.round(item.responseEnd);
        });
        images.observe({type:'resource',buffered:true});
      }catch{}
    }
    window.DAStorefrontPerf={snapshot:()=>({
      fcpMs:homePerf.fcpMs,lcpMs:homePerf.lcpMs,firstBasketImageMs:homePerf.firstBasketImageMs,
      shellMs:performance.getEntriesByName('da-home-shell').at(-1)?.startTime??null,
      cachedCestasMs:performance.getEntriesByName('da-home-cached-cestas').at(-1)?.startTime??null,
      firstCestasMs:performance.getEntriesByName('da-home-size-cards').at(-1)?.startTime??null,
      fullCatalogMs:performance.getEntriesByName('da-home-full-catalog').at(-1)?.startTime??null
    })};
    observeHomePerformance();

    async function start(){
      captureMarketingEntryContext();renderInitialShell();try{performance.mark('da-home-shell')}catch{}
      const cachedHome=readCache(HOME_CACHE_KEY,24*60*60*1000),hadCached=Boolean(cachedHome?.baskets?.length);
      if(hadCached){state.home={...state.home,...cachedHome,categories:cachedHome.categories?.length?cachedHome.categories:STATIC_CATEGORIES};try{performance.mark('da-home-cached-cestas')}catch{}}
      else state.home=homeSizeShell();
      state.homeSizeCards=true;
      renderHome();
      try{performance.mark('da-home-size-cards')}catch{}
      applyMarketingEntryContext();
      void resolveEntryWhatsappPhone().then(phone=>{state.whatsappPhone=phone;if(phone){const d=phoneDigits(phone).replace(/^55/,'');if(d.length===11){state.checkoutDdd=d.slice(0,2);state.checkoutPhone=d.slice(2)}}}).catch(()=>{state.whatsappPhone=''});
      paintCart();
    }
    start();
  })();
  </script>
  <script src="/checkout-resilience.js?v=20261001" defer></script>
