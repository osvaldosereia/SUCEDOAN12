    .basket-edit-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.basket-edit-list .checkout-item-row{min-height:70px}.basket-edit-list .checkout-thumb{background:#f7f9f7}.basket-edit-list .checkout-name{font-size:12.5px}.basket-action-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.basket-action-price{min-width:0}.basket-action-price small{display:block;color:var(--muted);font-size:10px;font-weight:800}.basket-action-price strong{display:block;font-size:20px;line-height:1.1;margin-top:2px}.basket-add-btn{width:auto!important;min-width:190px;min-height:48px!important;padding:10px 16px!important}.basket-hero-compact{grid-template-columns:82px 1fr;margin-bottom:12px}.basket-hero-compact img{width:82px;height:82px}.basket-hero-compact h3{font-size:17px}.basket-hero-compact small{display:block;color:var(--muted);font-size:11px;line-height:1.35}

<body>
  <header class="top">
    <div class="wrap top-row">
      <img class="logo" src="/img/logoantonia5.png" width="164" height="52" alt="Dona Antônia" fetchpriority="high" decoding="async">
      <button class="cart-top" id="cartTop" type="button" aria-label="Ver pedido">Pedido <span class="badge" id="cartBadge">0</span></button>
    </div>
    <form class="top-search wrap" id="globalSearchForm" role="search">
      <div class="global-search">
        <input id="globalSearchInput" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" aria-label="Buscar produtos" placeholder="Buscar arroz, shampoo, sabão…">
        <button type="submit">Buscar</button>
      </div>
    </form>
    <div class="nav-shell"><div class="nav-wrap wrap"><nav class="nav" id="nav" aria-label="Seções da vitrine"></nav></div></div>
  </header>

  <main class="wrap">
    <div id="content">
      <section class="section"><div class="grid"><div class="loader"></div><div class="loader"></div></div></section>
    </div>
    <div class="spacer"></div>
  </main>

  <footer><div class="wrap">Pagamento na entrega. Pedido sujeito à confirmação de disponibilidade pela equipe Dona Antônia.</div></footer>

  <div class="cartbar" id="cartbar">
    <div class="cartbar-inner">
      <div class="cartbar-copy"><small>Seu pedido</small><strong id="cartSummary" aria-live="polite">0 itens</strong></div>
      <button type="button" id="openCart">Conferir</button>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-inner">
        <div class="sheet-head"><strong id="sheetTitle">Pedido</strong><button class="close" id="closeSheet" type="button" aria-label="Fechar">×</button></div>
        <div class="sheet-scroll" id="sheetBody"></div>
        <div class="sheet-action" id="sheetAction"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  (() => {
    'use strict';

    const API = 'https://qxstkwshuvplmmftrctj.supabase.co/functions/v1/simple-storefront-v1';
    const LEGACY_PRODUCT_API = 'https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/admin-service-intelligence-v1';
    const WHATSAPP = '5565998150975';
    const MINIMUM_ORDER_CENTS = 7500;
    const BUSINESS_TIME_ZONE = 'America/Cuiaba';
    const STORAGE_KEY = 'da_simple_storefront_cart_v2';
    const WHATSAPP_PHONE_KEY = 'da_vitrine_whatsapp_phone_v1';
    const HOME_CACHE_KEY = 'da_storefront_home_v2';
    const OFFERS_CACHE_KEY = 'da_storefront_offers_v2';
    const STATIC_CATEGORIES = [
      {key:'mercearia',label:'Mercearia'},
      {key:'limpeza_lavanderia',label:'Limpeza e lavanderia'},
      {key:'higiene_beleza',label:'Higiene e beleza'},
      {key:'casa_pet',label:'Casa e pet'}
    ];
    const $ = s => document.querySelector(s);
    const content = $('#content');
    const nav = $('#nav');
    const overlay = $('#overlay');
    const sheetBody = $('#sheetBody');
    const sheetAction = $('#sheetAction');
    const sheetTitle = $('#sheetTitle');
    const state = {
      home: {baskets:[],categories:STATIC_CATEGORIES},
      offers: [],
      offersLoaded: false,
      offersPromise: null,
      offersObserver: null,
      view: 'home',
      cart: loadCart(),
      basketDraft: null,
      category: null,
      nextOffset: null,
      query: '',
      productsById: new Map(),
      checkoutPayment: '',
      checkoutQuoteTimers: new Map(),
      detailReturn: '',
      lastFocus: null,
      whatsappPhone: '',
      checkoutDdd: '65',
      checkoutPhone: '9',
      customerLookup: {status:'idle',phoneKey:'',customer:null},
      categorySubcategories: {},
      subcategoriesExpanded: {}
    };

    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = cents => (Number(cents || 0) / 100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const basketName = name => name === 'Economica Bonini' ? 'Econômica com Arroz Tio Bonini' : String(name || 'Cesta básica');
    const safeImage = url => url || '/img/logoantonia5.png';

    function localDateTimeCuiaba(now=new Date()){
      const parts=new Intl.DateTimeFormat('en-CA',{timeZone:BUSINESS_TIME_ZONE,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);
      const get=type=>Number(parts.find(p=>p.type===type)?.value||0);
      return {year:get('year'),month:get('month'),day:get('day'),hour:get('hour'),minute:get('minute')};
    }
    function addCalendarDays(date,days){const d=new Date(Date.UTC(date.year,date.month-1,date.day+days,12));return {year:d.getUTCFullYear(),month:d.getUTCMonth()+1,day:d.getUTCDate()}}
    function isoLocalDate(date){return String(date.year).padStart(4,'0')+'-'+String(date.month).padStart(2,'0')+'-'+String(date.day).padStart(2,'0')}
    function easterSunday(year){
      const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
      return {year,month:Math.floor((h+l-7*m+114)/31),day:((h+l-7*m+114)%31)+1};
    }
    function nationalHolidayName(date){
      const fixed={'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência do Brasil','10-12':'Nossa Senhora Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Dia Nacional de Zumbi e da Consciência Negra','12-25':'Natal'};
      const key=String(date.month).padStart(2,'0')+'-'+String(date.day).padStart(2,'0');
      if(fixed[key])return fixed[key];
      return isoLocalDate(addCalendarDays(easterSunday(date.year),-2))===isoLocalDate(date)?'Paixão de Cristo':'';
    }
    function isSunday(date){return new Date(Date.UTC(date.year,date.month-1,date.day,12)).getUTCDay()===0}
    function nextOpenDeliveryDate(from){let d=from;for(let i=0;i<14;i++){if(!isSunday(d)&&!nationalHolidayName(d))return d;d=addCalendarDays(d,1)}return d}
    function deliveryDateLabel(date){return new Intl.DateTimeFormat('pt-BR',{timeZone:'UTC',weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(Date.UTC(date.year,date.month-1,date.day,12)))}
    function deliveryPlanCuiaba(now=new Date()){
      const local=localDateTimeCuiaba(now),today={year:local.year,month:local.month,day:local.day},holiday=nationalHolidayName(today);
      let reason='same_day',target=today;
      if(isSunday(today)||holiday){reason='closed_day';target=nextOpenDeliveryDate(addCalendarDays(today,1))}
      else if(local.hour>=12){reason='after_cutoff';target=nextOpenDeliveryDate(addCalendarDays(today,1))}
      const label=deliveryDateLabel(target);
      const notice=reason==='after_cutoff'?'Pedido após 12h de Cuiabá. Entrega prevista '+label+'.':reason==='closed_day'?'Hoje não realizamos entregas'+(holiday?' ('+holiday+')':' (domingo)')+'. Entrega prevista '+label+'.':'Entrega prevista hoje, '+label+'.';
      return {date:isoLocalDate(target),label,notice,reason};
    }

    function normalizeWhatsappPhone(value){
      let digits=String(value??'').replace(/\D+/g,'');
      if(digits.startsWith('00'))digits=digits.slice(2);
      if(digits.startsWith('55')&&(digits.length===12||digits.length===13))return '+'+digits;
      if(digits.length===10||digits.length===11)return '+55'+digits;
      return '';
    }
    function captureWhatsappPhone(){
      const params=new URLSearchParams(location.search);
      const raw=params.get('wa')||params.get('whatsapp')||params.get('phone')||params.get('telefone')||'';
      const fromUrl=normalizeWhatsappPhone(raw);
      if(fromUrl){
        try{sessionStorage.setItem(WHATSAPP_PHONE_KEY,fromUrl)}catch{}
        for(const key of ['wa','whatsapp','phone','telefone'])params.delete(key);
        const qs=params.toString();
        history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);
        return fromUrl;
      }
      try{return normalizeWhatsappPhone(sessionStorage.getItem(WHATSAPP_PHONE_KEY)||'')}catch{return ''}
    }

    function clearQueryParam(name){
      const params=new URLSearchParams(location.search);
      params.delete(name);
      const qs=params.toString();
      history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);
    }

    async function resolveEntryWhatsappPhone(){
      const params=new URLSearchParams(location.search);
      const token=String(params.get('c')||'').trim();
      if(token){
        try{
          const data=await api('resolve_identity_token',{token});
          const resolved=normalizeWhatsappPhone(data.phone_e164||'');
          if(!resolved)throw new Error('identity_phone_missing');
          try{sessionStorage.setItem(WHATSAPP_PHONE_KEY,resolved)}catch{}
          clearQueryParam('c');
          return resolved;
        }catch{
          try{sessionStorage.removeItem(WHATSAPP_PHONE_KEY)}catch{}
          clearQueryParam('c');
          return '';
        }
      }
      return captureWhatsappPhone();
    }

    function loadCart(){
      try{
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      }catch{return []}
    }
    function readCache(key,maxAge){
      try{
        const value=JSON.parse(localStorage.getItem(key)||'null');
        if(!value||!value.saved_at||Date.now()-Number(value.saved_at)>maxAge)return null;
        return value.data||null;
      }catch{return null}
    }
    function writeCache(key,data){
      try{localStorage.setItem(key,JSON.stringify({saved_at:Date.now(),data}))}catch{}
    }
    function saveCart(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cart));
      paintCart();
      refreshAllProductControls();
    }
    function itemCount(){
      return state.cart.reduce((sum,item)=>sum + Math.max(0,Number(item.qty||0)),0);
    }
    function cartTotal(){
      return state.cart.reduce((sum,item)=>sum + Math.round(Number(item.unit_cents||0) * Number(item.qty||0)),0);
    }

    function stockNumber(value){const n=Number(value);return Number.isFinite(n)?Math.max(0,n):null}
    function knownStock(productId,fallback=null){
      const listed=state.productsById.get(productId),listedStock=stockNumber(listed?.stock_quantity);if(listedStock!==null)return listedStock;
      for(const item of state.cart){
        if(item.type==='product'&&item.id===productId){const n=stockNumber(item.stock_quantity);if(n!==null)return n}
        for(const c of item.components||[])if(c.product_id===productId){const n=stockNumber(c.stock_quantity);if(n!==null)return n}
      }
      return stockNumber(fallback);
    }
    function cartDemandForProduct(productId,excludeItemIndex=-1){
      let total=0;
      state.cart.forEach((item,index)=>{
        if(index===excludeItemIndex)return;
        if(item.type==='product'&&item.id===productId)total+=Number(item.qty||0);
        if(item.type==='basket')for(const c of item.components||[])if(c.product_id===productId)total+=Number(c.quantity||0)*Number(item.qty||0);
      });
      return total;
    }
    function remainingStock(productId,excludeItemIndex=-1,fallback=null){
      const stock=knownStock(productId,fallback);return stock===null?null:Math.max(0,stock-cartDemandForProduct(productId,excludeItemIndex));
    }
    function maxBasketQty(item,itemIndex){
      const comps=(item.components||[]).filter(c=>Number(c.quantity||0)>0);if(!comps.length)return 0;
      let max=30;
      for(const c of comps){const remaining=remainingStock(c.product_id,itemIndex,c.stock_quantity);if(remaining!==null)max=Math.min(max,Math.floor((remaining+1e-9)/Number(c.quantity||1)))}
      return Math.max(0,max);
    }
    function toast(msg){
      const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800);
    }
    function paintCart(){
      const count=itemCount();
      $('#cartBadge').textContent=String(count);
      $('#cartSummary').textContent=count + (count===1?' item':' itens') + ' · ' + money(cartTotal());
      $('#cartbar').classList.toggle('show',count>0);
    }
    function openSheet(title,bodyHtml,actionHtml=''){
      state.lastFocus=document.activeElement;
      sheetTitle.textContent=title;
      sheetBody.innerHTML=bodyHtml;
      sheetAction.innerHTML=actionHtml;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
      requestAnimationFrame(()=>$('#closeSheet')?.focus());
    }
    function closeSheet(){
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      document.body.style.overflow='';
      state.basketDraft=null;
      if(state.lastFocus?.focus)state.lastFocus.focus();
    }
    $('#closeSheet').onclick=closeSheet;
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeSheet()});
    $('#cartTop').onclick=renderCart;
    $('#openCart').onclick=renderCart;

    async function api(action, params={}, options={}){
      const url = new URL(API);
      url.searchParams.set('action',action);
      Object.entries(params).forEach(([k,v])=>{if(v!==''&&v!=null)url.searchParams.set(k,String(v))});
      const controller = options.signal ? null : new AbortController();
      const timer = controller ? setTimeout(()=>controller.abort(),12000) : null;
      try{
        const stockSensitive=['offers','products','product','basket','basket_quote','submit_order'].includes(action);
        const response = await fetch(url,{cache:stockSensitive?'no-store':'default',...options,signal:options.signal||controller?.signal});
        const data = await response.json().catch(()=>({ok:false}));
        if(!response.ok || data.ok===false){const error=new Error(data.error||'Não foi possível carregar.');error.payload=data;throw error}
        return data;
      }finally{if(timer)clearTimeout(timer)}
    }

    async function productExtra(id){
      try{
        const response=await fetch(LEGACY_PRODUCT_API,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'vitrine_product_extra',id}),
          cache:'no-store'
        });
        const data=await response.json().catch(()=>({ok:false}));
        return response.ok&&data.ok!==false?(data.product||null):null;
      }catch{return null}
    }

    async function customerLookupApi(phoneSuffix){
      const response=await fetch(LEGACY_PRODUCT_API,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'vitrine_customer_lookup_phone',phone_suffix:phoneSuffix}),
        cache:'no-store'
      });
      const data=await response.json().catch(()=>({ok:false,error:'invalid_response'}));
      if(!response.ok||data.ok===false)throw new Error(data.error||'customer_lookup_failed');
      return data;
    }

    function phoneDigits(value,max=20){return String(value??'').replace(/\D+/g,'').slice(0,max)}
    function checkoutPhoneData(){
      const ddd=phoneDigits(state.checkoutDdd,2);
      let mobile=phoneDigits(state.checkoutPhone,9);
      if(mobile.length===8)mobile='9'+mobile;
      const valid=ddd.length===2&&mobile.length===9&&mobile.startsWith('9');
      return {ddd,mobile,valid,full:valid?'+55'+ddd+mobile:'',suffix:mobile.slice(-8),key:ddd+mobile};
    }
    function formatPhoneBr(value){
      const d=phoneDigits(value,20).replace(/^55/,'');
      return d.length===11?'('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7):String(value||'');
    }
    function resetCustomerLookup(){
      state.customerLookup={status:'idle',phoneKey:'',customer:null};
      updateCustomerLookupResult();
    }
    function customerLookupResultHtml(){
      const lookup=state.customerLookup;
      if(lookup.status==='loading')return '<span>Consultando cadastro…</span>';
      if(lookup.status==='found'){
        const c=lookup.customer||{},a=c.address||{};
        const location=[a.district,a.city].filter(Boolean).join(' · ');
        return '<span>✓ Cadastro encontrado: '+esc(c.display_name||'Cliente')+(location?' · '+esc(location):'')+'</span>';
      }
      if(lookup.status==='new')return '<span>Cliente novo — o pedido será identificado assim no WhatsApp.</span>';
      if(lookup.status==='error')return '<span>Não foi possível consultar. Tente novamente.</span>';
      return '<span>Digite o WhatsApp e consulte o cadastro.</span>';
    }
    function updateCustomerLookupResult(){
      const host=$('#customerLookupResult');if(!host)return;
      host.className='wa-result '+(state.customerLookup.status==='found'?'found':state.customerLookup.status==='new'?'new':'');
      host.innerHTML=customerLookupResultHtml();
    }
    async function lookupCheckoutCustomer(){
      const info=checkoutPhoneData();
      if(!info.valid){toast('Informe DDD e WhatsApp com 9 dígitos');return null}
      state.checkoutDdd=info.ddd;state.checkoutPhone=info.mobile;state.whatsappPhone=info.full;
      if(state.customerLookup.phoneKey===info.key&&['found','new'].includes(state.customerLookup.status))return state.customerLookup;
      state.customerLookup={status:'loading',phoneKey:info.key,customer:null};
      updateCustomerLookupResult();
      try{
        const data=await customerLookupApi(info.suffix);
        state.customerLookup=data.found
          ? {status:'found',phoneKey:info.key,customer:data.customer}
          : {status:'new',phoneKey:info.key,customer:null};
        try{sessionStorage.setItem(WHATSAPP_PHONE_KEY,info.full)}catch{}
        updateCustomerLookupResult();
        return state.customerLookup;
      }catch{
        state.customerLookup={status:'error',phoneKey:info.key,customer:null};
        updateCustomerLookupResult();
        toast('Não consegui consultar o cadastro');
        return null;
      }
    }

    function formatValidityDate(value){
      if(!value)return '';
      const raw=String(value).slice(0,10);
      const parts=raw.split('-');
      return parts.length===3?parts[2]+'/'+parts[1]+'/'+parts[0]:raw;
    }

    function navButton(label,key){
      return '<button type="button" class="chip '+(state.view===key?'active':'')+'" data-view="'+esc(key)+'">'+esc(label)+'</button>';
    }
    function renderNav(){
      const cats = state.home?.categories?.length ? state.home.categories : STATIC_CATEGORIES;
      nav.innerHTML =
        navButton('Cestas','home') +
        navButton('Ofertas','offers') +
        cats.map(c=>navButton(c.label,'cat:'+c.key)).join('');
      nav.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{
        const v=btn.dataset.view;
        if(v==='home') renderHome();
        else if(v==='offers') renderOffers();
        else if(v.startsWith('cat:')) renderCategory(v.slice(4),btn.textContent);
      });
    }

    function imageAttrs(index=99){
      if(index===0)return 'loading="eager" fetchpriority="high" decoding="async"';
      if(index===1)return 'loading="eager" decoding="async"';
      return 'loading="lazy" decoding="async"';
    }
    function productCard(p,offer=false,index=99){
      const regular = Number(p.regular_price_cents||0);
      const showOld = regular>Number(p.price_cents||0);
      const id=p.product_id||p.id;
      return '<article class="card product-card">'+
        '<button type="button" class="product-open photo" data-product-detail="'+esc(id)+'" aria-label="Ver detalhes de '+esc(p.name)+'">'+
          (offer?'<span class="offer-tag">OFERTA</span>':'')+
          '<img src="'+esc(safeImage(p.image_url))+'" alt="'+esc(p.name)+'" '+imageAttrs(index)+'>'+
        '</button>'+
        '<div class="card-body">'+
          '<button type="button" class="product-open name" data-product-detail="'+esc(id)+'">'+esc(p.name)+'</button>'+
          '<span class="meta">'+esc(p.packaging||p.subcategory||'')+'</span>'+
          '<div class="product-buy-row"><div class="price">'+money(p.price_cents)+(showOld?'<span class="old">'+money(regular)+'</span>':'')+'</div>'+
          '<div class="product-action" data-product-control="'+esc(id)+'"></div></div>'+
        '</div></article>';
    }

    function basketCard(b,index=99){
      return '<article class="card basket-card">'+
        '<div class="photo"><img src="'+esc(safeImage(b.image_url))+'" alt="'+esc(basketName(b.name))+'" '+imageAttrs(index)+'></div>'+
        '<div class="card-body"><div class="name">'+esc(basketName(b.name))+'</div>'+
        '<div class="price">'+money(b.display_price_cents)+'</div>'+
        '<button type="button" class="add" data-basket="'+esc(b.id)+'">Ver cesta</button></div></article>';
    }

    function productQty(id){
      return Number(state.cart.find(x=>x.type==='product'&&x.id===id)?.qty||0);
    }
    function renderProductControl(host,p){
      if(!host||!p)return;
      const id=p.product_id||p.id,qty=productQty(id),itemIndex=state.cart.findIndex(x=>x.type==='product'&&x.id===id);
      const remaining=remainingStock(id,itemIndex,p.stock_quantity),max=remaining===null?30:Math.max(0,Math.floor(remaining));
      host.innerHTML=qty>0
        ? '<div class="quick-qty"><button type="button" data-product-dec="'+esc(id)+'" aria-label="Diminuir quantidade de '+esc(p.name)+'">−</button><b aria-label="'+qty+' no pedido">'+formatQty(qty)+'</b><button type="button" data-product-inc="'+esc(id)+'" aria-label="Aumentar quantidade de '+esc(p.name)+'" '+(qty>=max?'disabled':'')+'>+</button></div>'
        : max<=0?'<button type="button" class="quick-add" disabled aria-label="Sem estoque disponível">×</button>':'<button type="button" class="quick-add" data-product-add="'+esc(id)+'" aria-label="Adicionar '+esc(p.name)+' ao pedido">+</button>';
      host.querySelector('[data-product-add]')?.addEventListener('click',()=>changeProduct(p,1));
      host.querySelector('[data-product-inc]')?.addEventListener('click',()=>changeProduct(p,1));
      host.querySelector('[data-product-dec]')?.addEventListener('click',()=>changeProduct(p,-1));
    }
    function attachProductControls(scope,products){
      for(const p of products)state.productsById.set(p.product_id||p.id,p);
      scope.querySelectorAll('[data-product-control]').forEach(host=>{
        renderProductControl(host,state.productsById.get(host.dataset.productControl));
      });
      attachProductDetailHandlers(scope);
    }
    function attachProductDetailHandlers(scope=document){
      scope.querySelectorAll('[data-product-detail]').forEach(btn=>{
        if(btn.dataset.detailBound==='1')return;
        btn.dataset.detailBound='1';
        btn.addEventListener('click',()=>openProductDetail(btn.dataset.productDetail,btn.dataset.detailReturn||''));
      });
    }
    async function openProductDetail(id,returnTo=''){
      if(!id)return;
      state.detailReturn=returnTo;
      const returnLabel=returnTo==='checkout'?'Voltar ao pedido':returnTo==='basket'?'Voltar à cesta':'';
      openSheet('Produto','<div class="loader"></div>',returnLabel?'<button class="secondary" type="button" id="backFromDetail">'+returnLabel+'</button>':'');
      if($('#backFromDetail'))$('#backFromDetail').onclick=()=>returnTo==='checkout'?renderCheckout():paintBasketSheet();
      try{
        const [data,legacy]=await Promise.all([
          api('product',{product_id:id}),
          productExtra(id)
        ]);
        const p=data.product;
        state.productsById.set(p.id,p);
        const cartProduct=state.cart.find(x=>x.type==='product'&&x.id===p.id);
        if(cartProduct){cartProduct.stock_quantity=stockNumber(p.stock_quantity);if(Number(cartProduct.qty)>Number(p.stock_quantity||0))cartProduct.qty=Math.max(0,Math.floor(Number(p.stock_quantity||0)))}
        const old=Number(p.regular_price_cents||0)>Number(p.price_cents||0)
          ? '<span class="old">'+money(p.regular_price_cents)+'</span>' : '';
        const validity=formatValidityDate(legacy?.validity_date);
        const brand=legacy?.brand||p.brand||'';
        const packaging=legacy?.packaging||p.packaging||'';
        const attrs=[
          ...(validity?[{label:'Validade',value:validity}]:[]),
          ...(brand?[{label:'Marca',value:brand}]:[]),
          ...(packaging?[{label:'Embalagem',value:packaging}]:[])
        ];
        sheetTitle.textContent=p.name;
        sheetBody.innerHTML=
          '<div class="detail-photo"><img src="'+esc(safeImage(p.image_url))+'" alt="'+esc(p.name)+'"></div>'+
          '<h2 class="detail-title">'+esc(p.name)+'</h2>'+
          '<div class="detail-price">'+money(p.price_cents)+old+'</div>'+
          (p.description?'<p class="detail-description">'+esc(p.description)+'</p>':'')+
          (attrs.length?'<div class="detail-grid">'+attrs.map(a=>'<div class="detail-attr"><small>'+esc(a.label)+'</small><strong>'+esc(a.value)+'</strong></div>').join('')+'</div>':'');
        sheetAction.innerHTML=returnLabel
          ? '<button class="primary" type="button" id="backFromDetail">'+returnLabel+'</button>'
          : '<button class="primary" type="button" id="closeDetail">Fechar</button>';

      }catch{
        sheetBody.innerHTML='<div class="empty">Não consegui carregar os detalhes deste produto agora.</div>';

    function refreshAllProductControls(){
      document.querySelectorAll('[data-product-control]').forEach(host=>{
        renderProductControl(host,state.productsById.get(host.dataset.productControl));
      });

    function changeProduct(p,delta){
      const id=p.product_id||p.id,existing=state.cart.find(x=>x.type==='product'&&x.id===id),itemIndex=existing?state.cart.indexOf(existing):-1;
      const remaining=remainingStock(id,itemIndex,p.stock_quantity),max=remaining===null?30:Math.max(0,Math.floor(remaining));
      if(existing){
        const current=Number(existing.qty||0),next=Math.max(0,Math.min(max,current+delta));
        if(delta>0&&next===current){toast('Você já colocou todo o estoque disponível deste produto.');return}
        existing.qty=next;existing.stock_quantity=stockNumber(p.stock_quantity)??existing.stock_quantity;if(existing.qty<=0)state.cart.splice(itemIndex,1);
      }else if(delta>0){
        if(max<1){toast('Este produto não tem mais estoque disponível.');return}
        state.cart.push({type:'product',id,name:p.name,image_url:p.image_url||'',unit_cents:Number(p.price_cents||0),stock_quantity:stockNumber(p.stock_quantity),qty:1});
      }
      saveCart();if(delta>0)toast('Adicionado ao pedido');
    }

    function observeOffers(){
      state.offersObserver?.disconnect?.();
      const host=$('#homeOffersMount');if(!host||state.offersLoaded){paintHomeOffers();return}
      if(!('IntersectionObserver' in window)){loadOffers();return}
      state.offersObserver=new IntersectionObserver(entries=>{
        if(entries.some(x=>x.isIntersecting)){
          state.offersObserver.disconnect();
          loadOffers();
        }
      },{rootMargin:'500px 0px'});
      state.offersObserver.observe(host);
    }

    async function fetchFreshOffers(){
      const data=await api('offers');
      state.offers=Array.isArray(data.offers)?data.offers:[];
      state.offersLoaded=true;
      writeCache(OFFERS_CACHE_KEY,state.offers);
      if(state.view==='home')paintHomeOffers();
      if(state.view==='offers')paintOffersPage();
      return state.offers;
    }

    function loadOffers(){
      if(state.offersLoaded)return Promise.resolve(state.offers);
      if(state.offersPromise)return state.offersPromise;
      const cached=readCache(OFFERS_CACHE_KEY,2*60*1000);
      if(Array.isArray(cached)){
        state.offers=cached;
        state.offersLoaded=true;
        if(state.view==='home')paintHomeOffers();
        queueMicrotask(()=>fetchFreshOffers().catch(()=>{}));
        return Promise.resolve(state.offers);
      }
      state.offersPromise=fetchFreshOffers()
        .catch(error=>{
          if(state.view==='home'){
            const host=$('#homeOffersMount');if(host)host.innerHTML='<div class="empty">As ofertas não carregaram agora. <button class="text-btn" id="retryOffers" type="button">Tentar novamente</button></div>';
            if($('#retryOffers'))$('#retryOffers').onclick=()=>{state.offersPromise=null;loadOffers()};
          }
          throw error;
        })
        .finally(()=>{state.offersPromise=null});
      return state.offersPromise;
    }

    async function openBasket(id){
      openSheet('Cesta básica','<div class="loader"></div>','');
      try{
        const data=await api('basket',{basket_id:id});
        state.basketDraft={
          basket:data.basket,
          items:data.items.map(x=>{const base=Number(x.quantity||0),remaining=remainingStock(x.product_id,-1,x.stock_quantity);return {...x,base_quantity:base,quantity:Math.min(base,remaining===null?base:remaining)}}),
          total_cents:Number(data.basket.display_price_cents||0),
          quoteTimer:null
        };
        paintBasketSheet();
        if(state.basketDraft.items.some(x=>Number(x.quantity)!==Number(x.base_quantity))){quoteBasket().catch(()=>{});toast('A cesta foi ajustada ao estoque disponível.')}
      }catch(e){
        openSheet('Cesta básica','<div class="empty">Não consegui abrir esta cesta agora.</div>','<button class="primary" type="button" id="closeError">Fechar</button>');
        $('#closeError').onclick=closeSheet;
      }
    }

    function paintBasketSheet(){
      const d=state.basketDraft;if(!d)return;
      const b=d.basket;
      sheetTitle.textContent=basketName(b.name);
      const rows=d.items.map((x,i)=>{
        const remaining=remainingStock(x.product_id,-1,x.stock_quantity);
        const max=remaining===null?30:Math.max(0,remaining);
        return '<div class="checkout-item-row">'+
          '<button type="button" class="checkout-thumb" data-product-detail="'+esc(x.product_id)+'" data-detail-return="basket" aria-label="Ver '+esc(x.name)+'"><img src="'+esc(safeImage(x.image_url))+'" alt=""></button>'+
          '<div class="checkout-copy"><button type="button" class="checkout-name" data-product-detail="'+esc(x.product_id)+'" data-detail-return="basket">'+esc(x.name)+'</button>'+
            '<span class="checkout-meta">'+esc(x.packaging||'Item da cesta')+(remaining!==null?' · disponível '+formatQty(remaining):'')+'</span></div>'+
          '<div class="checkout-qty"><button type="button" data-b-dec="'+i+'" aria-label="Diminuir">−</button><b id="bq'+i+'">'+formatQty(x.quantity)+'</b><button type="button" data-b-inc="'+i+'" aria-label="Aumentar" '+(Number(x.quantity)>=max?'disabled':'')+'>+</button></div>'+
        '</div>';
      }).join('');
      sheetBody.innerHTML=
        '<div class="basket-hero basket-hero-compact"><img src="'+esc(safeImage(b.image_url))+'" alt=""><div><h3>'+esc(basketName(b.name))+'</h3><small>Você pode retirar, reduzir ou aumentar os produtos antes de adicionar a cesta.</small></div></div>'+
        '<div class="basket-edit-list">'+rows+'</div>';
      sheetAction.innerHTML='<div class="basket-action-bar"><div class="basket-action-price"><small>Valor da cesta</small><strong id="basketActionTotal">'+money(d.total_cents)+'</strong></div><button class="primary basket-add-btn" type="button" id="addBasket">Adicionar cesta</button></div>';
      sheetBody.querySelectorAll('[data-b-dec]').forEach(btn=>btn.onclick=()=>changeBasketQty(Number(btn.dataset.bDec),-1));
      sheetBody.querySelectorAll('[data-b-inc]').forEach(btn=>btn.onclick=()=>changeBasketQty(Number(btn.dataset.bInc),1));
      attachProductDetailHandlers(sheetBody);
      $('#addBasket').onclick=addBasketDraft;
    }

    function formatQty(n){return Number.isInteger(Number(n))?String(Number(n)):String(Number(n).toFixed(3)).replace(/\.?0+$/,'')}
    function changeBasketQty(index,delta){
      const d=state.basketDraft;if(!d||!d.items[index])return;
      const item=d.items[index],remaining=remainingStock(item.product_id,-1,item.stock_quantity),max=remaining===null?30:Math.max(0,remaining),current=Number(item.quantity||0),next=Math.max(0,Math.min(max,current+delta));
      if(delta>0&&next===current){toast('Limite do estoque disponível.');return}
      d.items[index].quantity=next;
      const label=$('#bq'+index);if(label)label.textContent=formatQty(d.items[index].quantity);
      const plus=sheetBody.querySelector('[data-b-inc="'+index+'"]');
      if(plus)plus.disabled=remaining!==null&&Number(d.items[index].quantity)>=max;
      clearTimeout(d.quoteTimer);
      d.quoteTimer=setTimeout(quoteBasket,180);
    }
    async function quoteBasket(){
      const d=state.basketDraft;if(!d)return;
      const actionTotal=$('#basketActionTotal');if(actionTotal)actionTotal.textContent='Calculando…';
      try{
        const data=await api('basket_quote',{},{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({basket_id:d.basket.id,items:d.items.map(x=>({product_id:x.product_id,quantity:x.quantity}))})
        });
        d.total_cents=Number(data.total_cents||0);
        if($('#basketActionTotal'))$('#basketActionTotal').textContent=money(d.total_cents);
      }catch{
        if($('#basketActionTotal'))$('#basketActionTotal').textContent=money(d.total_cents);
        toast('Não consegui recalcular agora');
      }
    }
    function addBasketDraft(){
      const d=state.basketDraft;if(!d)return;
      if(!d.items.some(x=>Number(x.quantity)>0)){toast('Esta cesta ficou sem produtos disponíveis em estoque.');return}
      for(const x of d.items){const remaining=remainingStock(x.product_id,-1,x.stock_quantity);if(remaining!==null&&Number(x.quantity)>remaining){toast('O estoque mudou. Ajuste a quantidade de '+x.name+'.');return}}
      const changed=d.items.some(x=>Number(x.quantity)!==Number(x.base_quantity));
      state.cart.push({
        type:'basket',id:d.basket.id,name:basketName(d.basket.name),image_url:d.basket.image_url||'',
        unit_cents:Number(d.total_cents||0),qty:1,changed,
        components:d.items.map(x=>({product_id:x.product_id,name:x.name,image_url:x.image_url||'',packaging:x.packaging||'',stock_quantity:stockNumber(x.stock_quantity),quantity:Number(x.quantity)}))
      });
      saveCart();closeSheet();toast('Cesta adicionada');
    }

    function renderCart(){
      if(!state.cart.length){
        openSheet('Seu pedido','<div class="empty">Seu pedido ainda está vazio.</div>','<button class="primary" type="button" id="goShop">Ver cestas</button>');
        $('#goShop').onclick=()=>{closeSheet();renderHome()};
        return;
      }
      renderCheckout();
    }

    function cartLine(item,i){
      const comp=item.type==='basket' && item.components?.length
        ? '<div class="composition">'+item.components.map(c=>'<div>'+formatQty(Number(c.quantity)*Number(item.qty||1))+'× '+esc(c.name)+'</div>').join('')+'</div>'
        : '';
      return '<div class="cart-line"><div class="cart-line-top"><div><strong>'+esc(item.name)+'</strong><br><small>'+(item.type==='basket'?'Cesta básica':'Produto')+'</small></div></div>'+comp+
        '<div class="cart-controls"><div class="qty"><button type="button" data-cart-dec="'+i+'">−</button><b>'+formatQty(item.qty)+'</b><button type="button" data-cart-inc="'+i+'">+</button></div><button type="button" class="remove" data-remove="'+i+'">Remover</button></div></div>';
    }
    function cartQty(i,delta){
      const item=state.cart[i];if(!item)return;
      const max=item.type==='product'?Math.max(0,Math.floor(remainingStock(item.id,i,item.stock_quantity)??30)):maxBasketQty(item,i);
      const current=Number(item.qty||1),next=Math.max(1,Math.min(max,current+delta));
      if(delta>0&&next===current){toast('Limite do estoque disponível.');return}
      if(max<1){toast('Este item não tem estoque suficiente.');return}
      item.qty=next;saveCart();renderCart();
    }
    function removeCart(i){state.cart.splice(i,1);saveCart();if(state.cart.length)renderCart();else closeSheet()}

    async function hydrateCheckoutBaskets(){
      const baskets=state.cart.filter(item=>item.type==='basket'&&!item.checkout_hydrated);
      if(!baskets.length)return;
      await Promise.all(baskets.map(async item=>{
        try{
          const data=await api('basket',{basket_id:item.id});
          const current=new Map((item.components||[]).map(c=>[c.product_id,c]));
          item.components=(data.items||[]).map(x=>{
            const old=current.get(x.product_id);
            return {
              product_id:x.product_id,
              name:x.name,
              image_url:x.image_url||old?.image_url||'',
              packaging:x.packaging||old?.packaging||'',
              stock_quantity:stockNumber(x.stock_quantity),
              quantity:old?Math.min(Number(old.quantity||0),stockNumber(x.stock_quantity)??30):0
            };
          });
          item.checkout_hydrated=true;
        }catch{}
      }));
      saveCart();
    }

    function checkoutProductRow(item,itemIndex){
      return '<div class="checkout-item-row">'+
        '<button type="button" class="checkout-thumb" data-product-detail="'+esc(item.id)+'" data-detail-return="checkout"><img src="'+esc(safeImage(item.image_url))+'" alt=""></button>'+
        '<div class="checkout-copy"><button type="button" class="checkout-name" data-product-detail="'+esc(item.id)+'" data-detail-return="checkout">'+esc(item.name)+'</button><span class="checkout-meta">'+money(Number(item.unit_cents||0)*Number(item.qty||1))+'</span></div>'+
        checkoutQtyControl(itemIndex,item.qty)+'</div>';
    }
    function checkoutBasketBlock(item,itemIndex){
      const components=(item.components||[]).map((c,componentIndex)=>
        '<div class="checkout-item-row">'+
          '<button type="button" class="checkout-thumb" data-product-detail="'+esc(c.product_id)+'" data-detail-return="checkout"><img src="'+esc(safeImage(c.image_url))+'" alt=""></button>'+
          '<div class="checkout-copy"><button type="button" class="checkout-name" data-product-detail="'+esc(c.product_id)+'" data-detail-return="checkout">'+esc(c.name)+'</button><span class="checkout-meta">'+esc(c.packaging||'Item da cesta')+'</span></div>'+
          checkoutComponentQtyControl(itemIndex,componentIndex,c.quantity)+
        '</div>'
      ).join('');
      return '<div class="checkout-basket">'+
        '<div class="checkout-basket-head"><img src="'+esc(safeImage(item.image_url))+'" alt=""><div><strong>'+esc(item.name)+'</strong><span class="checkout-meta">Edite os produtos abaixo · '+money(Number(item.unit_cents||0)*Number(item.qty||1))+'</span></div>'+checkoutQtyControl(itemIndex,item.qty)+'</div>'+
        '<div class="checkout-basket-items">'+components+'</div>'+
      '</div>';
    }

    async function renderCheckout(){
      if(!state.cart.length){renderCart();return}
      state.checkoutPayment=document.querySelector('input[name="payment"]:checked')?.value||state.checkoutPayment||'';
      openSheet('Seu pedido','<div class="loading">Preparando seu pedido…</div>','');
      await hydrateCheckoutBaskets();
      paintCheckout();
    }

    function paintCheckout(){
      if(!state.cart.length){renderCart();return}
      sheetTitle.textContent='Seu pedido';
      const total=cartTotal(),missing=Math.max(0,MINIMUM_ORDER_CENTS-total),delivery=deliveryPlanCuiaba();
      const rows=state.cart.map((item,i)=>item.type==='basket'?checkoutBasketBlock(item,i):checkoutProductRow(item,i)).join('');
      sheetBody.innerHTML=
        '<div class="checkout-list">'+rows+'<div class="checkout-total"><span>Total</span><span id="checkoutTotal">'+money(total)+'</span></div></div>'+
        '<div class="rule-notice '+(missing>0?'warn':'')+'"><strong>Pedido mínimo: '+money(MINIMUM_ORDER_CENTS)+'</strong>'+(missing>0?'Faltam '+money(missing)+' para finalizar.':'Valor mínimo atingido.')+'</div>'+
        '<div class="rule-notice"><strong>Entrega</strong>'+esc(delivery.notice)+'<br>Domingos e feriados nacionais não realizamos entregas.</div>'+
        '<h3 class="checkout-title">Seu WhatsApp</h3>'+
        '<div class="wa-lookup"><div class="wa-grid">'+
          '<label class="wa-field"><span>DDD</span><input id="checkoutDdd" inputmode="numeric" maxlength="2" value="'+esc(state.checkoutDdd)+'"></label>'+
          '<label class="wa-field"><span>WhatsApp</span><input id="checkoutPhone" inputmode="numeric" maxlength="9" value="'+esc(state.checkoutPhone)+'"></label>'+
          '<button class="wa-consult" type="button" id="lookupCustomer">Consultar cadastro</button>'+
        '</div><div class="wa-result" id="customerLookupResult">'+customerLookupResultHtml()+'</div></div>'+
        '<h3 class="checkout-title">Como você vai pagar?</h3>'+
        '<div class="payments">'+
          pay('PIX','PIX')+pay('Dinheiro','Dinheiro')+pay('Cartão de crédito','Cartão de crédito')+pay('Cartão alimentação/refeição','Cartão alimentação/refeição')+
        '</div>'+
        '<p class="note">Pagamento na entrega. Nenhum dado de cartão é solicitado aqui.</p>';
      sheetAction.innerHTML='<div class="action-stack"><button class="secondary" type="button" id="addMoreCheckout">Adicionar mais produtos</button><button class="primary" type="button" id="sendWhats" '+(missing>0?'disabled':'')+'>'+(missing>0?'Faltam '+money(missing):'Enviar pedido para o WhatsApp')+'</button></div>';

      sheetBody.querySelectorAll('[data-checkout-dec]').forEach(btn=>btn.onclick=()=>checkoutItemQty(Number(btn.dataset.checkoutDec),-1));
      sheetBody.querySelectorAll('[data-checkout-inc]').forEach(btn=>btn.onclick=()=>checkoutItemQty(Number(btn.dataset.checkoutInc),1));
      sheetBody.querySelectorAll('[data-checkout-component-dec]').forEach(btn=>btn.onclick=()=>checkoutComponentQty(btn.dataset.checkoutComponentDec,-1));
      sheetBody.querySelectorAll('[data-checkout-component-inc]').forEach(btn=>btn.onclick=()=>checkoutComponentQty(btn.dataset.checkoutComponentInc,1));
      const dddInput=$('#checkoutDdd'),phoneInput=$('#checkoutPhone');
      if(dddInput)dddInput.oninput=()=>{
        state.checkoutDdd=phoneDigits(dddInput.value,2);dddInput.value=state.checkoutDdd;resetCustomerLookup();
      };
      if(phoneInput)phoneInput.oninput=()=>{
        state.checkoutPhone=phoneDigits(phoneInput.value,9);phoneInput.value=state.checkoutPhone;resetCustomerLookup();
      };
      if($('#lookupCustomer'))$('#lookupCustomer').onclick=lookupCheckoutCustomer;
      updateCustomerLookupResult();
      if(state.whatsappPhone&&state.customerLookup.status==='idle'){
        const info=checkoutPhoneData();
        if(info.valid)setTimeout(()=>lookupCheckoutCustomer(),0);
      }
      sheetBody.querySelectorAll('input[name="payment"]').forEach(input=>{
        input.checked=input.value===state.checkoutPayment;
        input.onchange=()=>{state.checkoutPayment=input.value};
      });
      attachProductDetailHandlers(sheetBody);
      $('#addMoreCheckout').onclick=closeSheet;
      $('#sendWhats').onclick=sendWhatsApp;
    }

    function checkoutItemQty(index,delta){
      const item=state.cart[index];if(!item)return;
      const max=item.type==='product'?Math.max(0,Math.floor(remainingStock(item.id,index,item.stock_quantity)??30)):maxBasketQty(item,index);
      const current=Number(item.qty||1),next=Math.max(0,Math.min(max,current+delta));
      if(delta>0&&next===current){toast('Limite do estoque disponível.');return}
      if(next<=0)state.cart.splice(index,1);else item.qty=next;
      saveCart();paintCheckout();
    }

    function checkoutComponentQty(key,delta){
      const [itemIndex,componentIndex]=String(key).split(':').map(Number);
      const item=state.cart[itemIndex],component=item?.components?.[componentIndex];if(!item||!component)return;
      const remaining=remainingStock(component.product_id,itemIndex,component.stock_quantity),basketQty=Math.max(1,Number(item.qty||1));
      const max=remaining===null?30:Math.max(0,Math.floor((remaining+1e-9)/basketQty)),current=Number(component.quantity||0),next=Math.max(0,Math.min(max,current+delta));
      if(delta>0&&next===current){toast('Limite do estoque disponível.');return}
      component.quantity=next;
      saveCart();
      paintCheckout();
      const old=state.checkoutQuoteTimers.get(itemIndex);
      if(old)clearTimeout(old);
      state.checkoutQuoteTimers.set(itemIndex,setTimeout(()=>requoteCheckoutBasket(itemIndex),160));
    }

    async function requoteCheckoutBasket(itemIndex){
      const item=state.cart[itemIndex];
      if(!item||item.type!=='basket')return;
      try{
        const data=await api('basket_quote',{},{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({basket_id:item.id,items:(item.components||[]).map(c=>({product_id:c.product_id,quantity:Number(c.quantity||0)}))})
        });
        item.unit_cents=Number(data.total_cents||0);
        saveCart();
        if(overlay.classList.contains('open')&&sheetTitle.textContent==='Seu pedido')paintCheckout();
      }catch{toast('Não consegui recalcular a cesta agora')}
    }

    function pay(value,label){
      return '<label class="pay"><input type="radio" name="payment" value="'+esc(value)+'"><strong>'+esc(label)+'</strong></label>';
    }

    function orderDatePartsCuiaba(){
      const longParts=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Cuiaba',day:'numeric',month:'long',year:'numeric'}).formatToParts(new Date());
      const numericParts=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Cuiaba',day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(new Date());
      const get=(parts,type)=>parts.find(p=>p.type===type)?.value||'';
      const month=get(longParts,'month');
      const monthTitle=month?month.charAt(0).toUpperCase()+month.slice(1):'';
      return {
        long:get(longParts,'day')+' de '+monthTitle+' de '+get(longParts,'year'),
        month:monthTitle,
        numeric:get(numericParts,'day')+'/'+get(numericParts,'month')+'/'+get(numericParts,'year')
      };
    }
    function formatOrderDateCuiaba(){return orderDatePartsCuiaba().long}
    function customerMessageData(){
      const lookup=state.customerLookup;
      const c=lookup.status==='found'?lookup.customer:null;
      const a=c?.address||{};
      return {
        status:c?'CADASTRADO':'NOVO',
        name:c?.display_name||'NAO CADASTRADO',
        address:[a.street,a.number,a.complement].filter(Boolean).join(', ')||'NAO INFORMADO',
        district:a.district||'NAO INFORMADO',
        city:a.city||'NAO INFORMADA'
      };
    }

    function reserveWhatsAppHandoff(){
      try{
        const handoffWindow=window.open('about:blank','_blank');
        if(!handoffWindow)return null;
        try{
          handoffWindow.opener=null;
          handoffWindow.document.title='Abrindo WhatsApp…';
          handoffWindow.document.body.innerHTML='<main style="font:16px system-ui;padding:28px;text-align:center"><strong>Pedido registrado</strong><p>Abrindo o WhatsApp…</p></main>';
        }catch{}
        return handoffWindow;
      }catch{
        return null;
      }
    }

    function cancelWhatsAppHandoff(handoffWindow){
      try{if(handoffWindow&&!handoffWindow.closed)handoffWindow.close()}catch{}
    }

    function completeWhatsAppHandoff(url,handoffWindow){
      if(handoffWindow&&!handoffWindow.closed){
        try{handoffWindow.location.replace(url);return 'reserved-window'}catch{}
      }
      try{window.location.assign(url);return 'same-window'}catch{}
      return '';
    }

    function renderWhatsAppHandoffSuccess(url,saved){
      const orderNumber=saved?.order_number?String(saved.order_number).slice(-8):'';
      sheetTitle.textContent='Pedido registrado';
      sheetBody.innerHTML='<div class="empty"><strong>Pedido'+(orderNumber?' #'+esc(orderNumber):'')+' registrado.</strong><br><span class="muted">Estamos abrindo o WhatsApp com a mensagem pronta. Se ele não abrir automaticamente, use o botão abaixo.</span></div>';
      sheetAction.innerHTML='<div class="action-stack"><a class="primary wa-fallback" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir WhatsApp</a><button type="button" class="secondary" id="backToStore">Voltar à vitrine</button></div>';
      $('#backToStore').onclick=closeSheet;
    }

    async function sendWhatsApp(){
      const total=cartTotal();
      if(total<MINIMUM_ORDER_CENTS){toast('O pedido mínimo é '+money(MINIMUM_ORDER_CENTS)+'. Faltam '+money(MINIMUM_ORDER_CENTS-total)+'.');return}
      const selected=document.querySelector('input[name="payment"]:checked');
      if(!selected){toast('Escolha a forma de pagamento');return}
      const info=checkoutPhoneData();
      if(!info.valid){toast('Informe seu WhatsApp antes de enviar');return}

      // Reserve a browser window synchronously while the user's tap/click is still active.
      // This avoids mobile/tablet popup blocking after the async customer lookup + order save.
      const handoffWindow=reserveWhatsAppHandoff();

      const lookup=await lookupCheckoutCustomer();
      if(!lookup){
        // Customer enrichment is optional. A temporary lookup failure must never block checkout.
        state.customerLookup={status:'new',phoneKey:info.key,customer:null};
        updateCustomerLookupResult();
      }

      state.checkoutPayment=selected.value;
      const btn=$('#sendWhats');
      if(btn){btn.disabled=true;btn.textContent='Registrando pedido…'}
      let saved=null;
      try{
        saved=await api('submit_order',{},{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            payment_method:selected.value,
            whatsapp_phone:state.whatsappPhone||null,
            customer_snapshot:state.customerLookup.status==='found'
              ? {found:true,id:state.customerLookup.customer.id,display_name:state.customerLookup.customer.display_name,address:state.customerLookup.customer.address||null}
              : {found:false},
            items:state.cart.map(item=>({
              type:item.type,
              id:item.id,
              qty:Number(item.qty||1),
              components:item.type==='basket'?(item.components||[]):[]
            }))
          })
        });
      }catch(e){
        cancelWhatsAppHandoff(handoffWindow);
        if(btn){btn.disabled=false;btn.textContent='Enviar pedido para o WhatsApp'}
        if(e.message==='minimum_order'){const min=Number(e.payload?.minimum_order_cents||MINIMUM_ORDER_CENTS),current=Number(e.payload?.total_cents||cartTotal());toast('Pedido mínimo '+money(min)+'. Faltam '+money(Math.max(0,min-current))+'.')}
        else if(['insufficient_stock','product_unavailable','basket_unavailable'].includes(e.message))toast('O estoque mudou. Reduza a quantidade ou escolha outro produto.');
        else toast('Não consegui registrar. Tente novamente.');
        return;
      }

      const date=orderDatePartsCuiaba();
      const customer=customerMessageData();
      const lines=[
        'PEDIDO DONA ANTONIA',
        'Pedido: "'+date.long+'"',
        'MES: '+date.month,
        'DATA: '+date.numeric,
        saved?.order_number?'NUMERO: '+String(saved.order_number).slice(-8):'',
        'CLIENTE: '+customer.status,
        'NOME: '+customer.name,
        'WHATSAPP: '+formatPhoneBr(state.whatsappPhone),
        'ENDERECO: '+customer.address,
        'BAIRRO: '+customer.district,
        'CIDADE: '+customer.city,
        ''
      ].filter(line=>line!=='');
      const baskets=state.cart.filter(item=>item.type==='basket'&&Number(item.qty||0)>0);
      if(baskets.length){
        for(const item of baskets)lines.push('CESTA: '+formatQty(item.qty)+'x '+item.name);
      }else{
        lines.push('CESTA: NENHUMA');
      }
      lines.push('','PRODUTOS:');
      for(const item of state.cart){
        if(item.type==='product'&&Number(item.qty||0)>0){
          lines.push(formatQty(item.qty)+'x '+item.name);
        }
        if(item.type==='basket'&&item.components?.length){
          for(const c of item.components){
            const qty=Number(c.quantity)*Number(item.qty||1);
            if(qty>0)lines.push(formatQty(qty)+'x '+c.name);
          }
        }
      }
      lines.push('','TOTAL: '+money(saved?.total_cents??cartTotal()),'PAGAMENTO: '+selected.value);
      if(saved?.delivery?.label)lines.push('ENTREGA PREVISTA: '+saved.delivery.label);
      if(saved?.delivery?.reason==='after_cutoff')lines.push('OBS: pedido realizado após 12h de Cuiabá.');
      const url='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(lines.join('\n'));

      // Order is already persisted. Keep an explicit manual fallback visible before navigating.
      state.cart=[];
      saveCart();
      paintCart();
      renderWhatsAppHandoffSuccess(url,saved);

      const handoffMode=completeWhatsAppHandoff(url,handoffWindow);
      if(handoffMode)toast('Pedido registrado. Abrindo WhatsApp…');
      else toast('Pedido registrado. Toque em “Abrir WhatsApp”.');
    }

    $('#globalSearchForm').onsubmit=e=>{
      e.preventDefault();
      const q=$('#globalSearchInput').value.trim();
      if(q)renderSearch(q);
    };

    async function start(){
      state.whatsappPhone=await resolveEntryWhatsappPhone();
      if(state.whatsappPhone){
        const d=phoneDigits(state.whatsappPhone).replace(/^55/,'');
        if(d.length===11){state.checkoutDdd=d.slice(0,2);state.checkoutPhone=d.slice(2)}
      }
      paintCart();
      renderInitialShell();

      const cachedHome=readCache(HOME_CACHE_KEY,5*60*1000);
      const hadCached=Boolean(cachedHome?.baskets?.length);
      if(hadCached){
        state.home={...state.home,...cachedHome,categories:cachedHome.categories?.length?cachedHome.categories:STATIC_CATEGORIES};
        renderHome();
      }

      try{
        const fresh=await api('home');
        state.home={...state.home,...fresh,categories:fresh.categories?.length?fresh.categories:STATIC_CATEGORIES};
        writeCache(HOME_CACHE_KEY,state.home);
        if(state.view==='home'&&!hadCached)renderHome();
      }catch(e){
        if(!state.home?.baskets?.length){
          renderNav();
          content.innerHTML='<section class="section"><div class="empty">Não consegui abrir a vitrine agora.<br><button class="primary" style="margin-top:12px" id="retryHome">Tentar novamente</button><br><a class="text-btn" style="display:inline-block;margin-top:8px" href="https://wa.me/'+WHATSAPP+'">Falar no WhatsApp</a></div></section>';
          $('#retryHome').onclick=()=>location.reload();
        }
      }
    }
    start();
  })();
  </script>
</body>
