<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dona Antônia — Abrindo Admin produtivo</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f4ef;color:#20211f;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
    main{max-width:520px;padding:32px;text-align:center}strong{display:block;font-size:22px;margin-bottom:8px}small{color:#686b66}
  </style>
</head>
<body>
  <main><strong>Abrindo o Admin oficial…</strong><small>Carregando produtos, preço de venda, estoque e exclusão segura.</small></main>
  <script>
    (async function () {
      const BUILD = '20260804-product-delete-v3-bling-safe';
      try {
        const response = await fetch(`./index.html?admin_base=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Admin base retornou ${response.status}`);
        let html = await response.text();

        const oldFirebase = '"/producao-v2/js/services/firebase.js": "/producao-v2/js/services/firebase.js?admin_build=20260726-admin-v13-xml-editor-parity",';
        const productiveImports = [
          `"/producao-v2/js/services/firebase.js": "/producao-v2/js/services/firebase-productive.js?admin_build=${BUILD}",`,
          `      "/producao-v2/js/services/collections.js": "/producao-v2/js/services/collections.js?admin_build=${BUILD}",`,
          `      "/producao-v2/js/collections-bootstrap.js?admin_build=20260728-customers-fallback-v1": "/producao-v2/js/collections-bootstrap.js?admin_build=${BUILD}",`,
        ].join('\n');

        const oldProductsModule = '"/producao-v2/js/modules/products.js": "/producao-v2/js/modules/products.js?admin_build=20260727-products-inline-v1",';
        const productiveProductsModule = `"/producao-v2/js/modules/products.js": "/producao-v2/js/modules/products.js?admin_build=${BUILD}",`;
        const oldStockModule = '"/producao-v2/js/modules/stock.js": "/producao-v2/js/modules/stock.js?admin_build=20260726-admin-v13-xml-editor-parity"';
        const productiveStockModule = `"/producao-v2/js/modules/stock.js": "/producao-v2/js/modules/stock.js?admin_build=${BUILD}"`;
        const oldAppScript = './js/app.js?admin_build=20260727-official-ux-v1';
        const productiveAppScript = `./js/app.js?admin_build=${BUILD}`;

        if (!html.includes(oldFirebase)) throw new Error('Não foi possível localizar o mapa de importação do Firebase.');
        if (!html.includes(oldProductsModule)) throw new Error('Não foi possível localizar o módulo da lista de produtos.');
        if (!html.includes(oldStockModule)) throw new Error('Não foi possível localizar o módulo de estoque.');
        if (!html.includes(oldAppScript)) throw new Error('Não foi possível localizar o aplicativo principal.');

        html = html.replace(oldFirebase, productiveImports);
        html = html.replace(oldProductsModule, productiveProductsModule);
        html = html.replace(oldStockModule, productiveStockModule);
        html = html.replace(oldAppScript, productiveAppScript);
        html = html.replace('<th>Preço</th>', '<th>Preço de venda</th>');
        html = html.replace('Sistema oficial v13.1.</strong>', 'Sistema oficial v13.1 · edição e exclusão segura de produtos, XML, imagens e EANs alternativos.</strong>');
        html = html.replace('</head>', `<meta name="admin-save-build" content="${BUILD}"></head>`);

        // As tags são montadas em partes para não encerrar este script carregador antes da hora.
        const openScript = '<scr' + 'ipt';
        const closeScript = '</scr' + 'ipt>';
        const deleteFilterScript = `${openScript} src="./js/product-delete-filter-v2.js?admin_build=${BUILD}">${closeScript}`;
        const statusScript = `${openScript} src="./js/manual-status-save.js?admin_build=${BUILD}">${closeScript}`;
        const nfeImageScript = `${openScript} type="module" src="./js/nfe-image-make-fix.js?admin_build=${BUILD}">${closeScript}`;
        const nfeImportScript = `${openScript} type="module" src="./js/nfe-import-save-fix.js?admin_build=${BUILD}">${closeScript}`;
        const alternateEanScript = `${openScript} type="module" src="./js/alternate-ean-support.js?admin_build=${BUILD}">${closeScript}`;
        const inlineSalePriceScript = `${openScript} src="./js/inline-sale-price-label.js?admin_build=${BUILD}">${closeScript}`;
        const productDeleteScript = `${openScript} src="./js/product-delete-tools.js?admin_build=${BUILD}">${closeScript}`;
        html = html.replace('</body>', `${deleteFilterScript}${statusScript}${nfeImageScript}${nfeImportScript}${alternateEanScript}${inlineSalePriceScript}${productDeleteScript}</body>`);

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        const message = String(error?.message || error);
        document.body.innerHTML = `<main><strong>Não foi possível abrir o Admin</strong><small>${message}</small><p><a href="./index.html?admin_fallback=${Date.now()}">Abrir versão padrão</a></p></main>`;
      }
    }());
  </script>
</body>
</html>
