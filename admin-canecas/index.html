  <script>
    (() => {
      const fallback = 'https://hook.eu1.make.com/cl3r1f56r9txezvltkkwlsspmnja6sw4';
      let saved = '';
      try { saved = String(localStorage.getItem('canecafacil_make_webhook') || '').trim(); } catch {}
      const makeWebhook = /^https:\/\/hook\.[a-z0-9-]+\.make\.com\/[A-Za-z0-9_-]+$/i.test(saved) ? saved : fallback;
      window.__CANECAS_ADMIN_CONFIG__ = Object.freeze({
        makeWebhook,
        mugGeneratorWebhook: makeWebhook,
        bannerWebhook: ''
      });
    })();
  </script>
