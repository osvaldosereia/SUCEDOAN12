function indexes(){state.byId=new Map;state.byCode=new Map;state.bySlug=new Map;state.products.forEach(p=>{state.byId.set(p.id,p);[p.id,p.firebaseKey,p.codigo,p.gtin,p.ean].forEach(v=>{const k=norm(v);if(k&&!state.byCode.has(k))state.byCode.set(k,p)});state.bySlug.set(p.slug,p)})}
function findProduct(ref){const s=String(ref||'');return state.byId.get(s)||state.byCode.get(norm(s))||state.bySlug.get(slug(s))||null}
function resolveLine(line){if(!line)return null;const qty=Math.max(1,Number(line.qtd||line.qty||line.quantidade||1)||1),subs=Array.isArray(line.substitutos)?line.substitutos:[],refs=[line.codigo||line.sku||line.id||line.ean||line.gtin,...subs];const p=refs.map(r=>findProduct(typeof r==='object'?(r.codigo||r.id||r.sku):r)).find(available);return p?{p,qty}:null}
const bundleRows=b=>b.items.map(resolveLine).filter(Boolean);
function loadLocal(){const c=read('cart',{});state.cart=c.cart||{};state.order=Array.isArray(c.order)?c.order:[];state.bundles=Array.isArray(c.bundles)?c.bundles:[];state.favorites=new Set(read('favorites',[]).map(String))}
function persist(){write('cart',{cart:state.cart,order:state.order,bundles:state.bundles,savedAt:Date.now()});write('favorites',[...state.favorites])}
function setQty(id,value){const p=findProduct(id);if(!p||!available(p))return;const q=Math.max(0,Math.min(Math.floor(Number(value)||0),p.stock));if(q){state.cart[p.id]=q;if(!state.order.includes(p.id))state.order.push(p.id)}else{delete state.cart[p.id];state.order=state.order.filter(x=>x!==p.id)}persist();updateShell();renderCartIfOpen();render(false)}
const add=(id,q=1)=>setQty(id,Number(state.cart[String(id)]||0)+q);
function favorite(id){const k=String(id);state.favorites.has(k)?state.favorites.delete(k):state.favorites.add(k);persist();render(false)}
function activeBundles(){return state.bundles.filter(b=>Object.entries(b.required||{}).every(([id,q])=>Number(state.cart[id]||0)>=Number(q||0)))}
function pricing(){const items=state.order.map(id=>{const p=findProduct(id),qty=Number(state.cart[id]||0);if(!p||qty<=0)return null;const unit=price(p).current;return{id,p,qty,unit,subtotal:unit*qty}}).filter(Boolean),subtotal=items.reduce((s,i)=>s+i.subtotal,0),bundles=activeBundles(),adjustment=bundles.reduce((s,b)=>s+Number(b.adjustment||0),0),total=Math.max(0,Math.round((subtotal+adjustment+Number.EPSILON)*100)/100);return{items,subtotal,adjustment,total,bundles,count:items.reduce((s,i)=>s+i.qty,0)}}
function addBundle(type,id){const list=type==='basket'?state.baskets:state.kits,b=list.find(x=>x.id===String(id));if(!b)return;const rows=bundleRows(b);if(rows.length!==b.items.length){alert(`${type==='basket'?'Esta cesta':'Este kit'} possui item indisponível.`);return}const required={};let retail=0;rows.forEach(r=>{required[r.p.id]=(required[r.p.id]||0)+r.qty;retail+=price(r.p).current*r.qty});for(const [pid,q] of Object.entries(required)){const p=findProduct(pid);if(Number(state.cart[pid]||0)+q>p.stock){alert(`Estoque insuficiente para ${p.name}.`);return}}Object.entries(required).forEach(([pid,q])=>{state.cart[pid]=Number(state.cart[pid]||0)+q;if(!state.order.includes(pid))state.order.push(pid)});state.bundles.push({key:`${type}:${b.id}:${Date.now()}`,type,id:b.id,name:b.name,required,adjustment:b.price?Math.round((b.price-retail)*100)/100:0});persist();updateShell();openCart()}
function searchProducts(query){const q=norm(query);if(!q)return[];const words=q.split(/\s+/).filter(Boolean);return state.products.filter(available).map(p=>{const exact=[p.id,p.codigo,p.gtin,p.ean].some(v=>norm(v)===q),start=norm(p.name).startsWith(q),all=words.every(w=>p.search.includes(w));return{p,score:exact?1000:start?500:all?100:0}}).filter(x=>x.score).sort((a,b)=>b.score-a.score||a.p.name.localeCompare(b.p.name,'pt-BR')).slice(0,CONFIG.SEARCH_LIMIT).map(x=>x.p)}

function validate(form,p){const errors=[];if(!form.name)errors.push('nome');if(form.cpf.length!==11)errors.push('CPF');if(form.phone.length<10)errors.push('WhatsApp');if(!form.email.includes('@'))errors.push('e-mail');if(!form.city)errors.push('cidade');if(!form.district)errors.push('bairro');if(!form.street)errors.push('rua');if(!form.number)errors.push('número');if(p.total<CONFIG.MIN_ORDER)errors.push(`pedido mínimo de ${money(CONFIG.MIN_ORDER)}`);return errors}
function buildOrder(form,p){const now=Date.now(),id=`${now}${Math.floor(Math.random()*1000).toString().padStart(3,'0')}`;return{id,number:String(now).slice(-6),idempotencyKey:id,createdAt:new Date(now).toISOString(),version:CONFIG.VERSION,items:p.items.map(i=>({firebaseKey:i.p.firebaseKey,sku:i.p.codigo,name:i.p.name,qty:i.qty,price:i.unit,ean:i.p.ean,gtin:i.p.gtin,image:i.p.img,aisle:i.p.aisle,shelf:i.p.shelf,category:i.p.category})),subtotal:p.subtotal,adjustment:p.adjustment,total:p.total,bundles:p.bundles,customer:form,status:'recebido',origin:'site-do-zero'} }
function message(o){const items=o.items.map(i=>`${i.qty}x ${i.name}`).join('\n'),bundles=o.bundles.length?`\n${o.bundles.map(b=>`*${b.type==='basket'?'CESTA':'KIT'}: ${b.name}*`).join('\n')}\n`:'';return `*PEDIDO #${o.number}*${bundles}\n*ITENS*\n${items}\n\n*TOTAL:* ${money(o.total)}\n\n*ENTREGA*\nNome: ${o.customer.name}\nWhatsApp: ${o.customer.phone}\nCidade: ${o.customer.city}/MT\nBairro: ${o.customer.district}\nRua: ${o.customer.street}, ${o.customer.number}\nData: ${dateBR(o.customer.delivery)}\nPagamento: ${o.customer.payment}${o.customer.note?`\nReferência/observação: ${o.customer.note}`:''}\n\nOlá! Gostaria de confirmar este pedido.`}
function openWhatsApp(text){const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent),url=`${mobile?'https://api.whatsapp.com/send':'https://web.whatsapp.com/send'}?phone=${CONFIG.WHATSAPP}&text=${encodeURIComponent(text)}`;window.open(url,'_blank','noopener')}
async function syncOrder(order){if(CONFIG.TEST_MODE)return;const jobs=[];if(CONFIG.SAVE_ORDER)jobs.push(fetch(`${CONFIG.FIREBASE}/${CONFIG.PATH.orders}/${order.id}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(order),keepalive:true}));if(CONFIG.SEND_MAKE)jobs.push(fetch(CONFIG.MAKE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pedido:order}),keepalive:true}));await Promise.allSettled(jobs)}
async function sendOrder(){const p=pricing(),form=checkoutForm(),errors=validate(form,p),status=$('#checkout-status');if(errors.length){status.textContent=`Confira: ${errors.join(', ')}.`;status.className='checkout-status bad';return}write('client',form);const order=buildOrder(form,p);write('last_order',order);openWhatsApp(message(order));status.textContent=CONFIG.TEST_MODE?'WhatsApp aberto. Modo de teste: Firebase e Make ainda estão desativados.':'WhatsApp aberto. Registrando o pedido.';status.className='checkout-status good';syncOrder(order).catch(()=>{})}
async function load(){state.loading=true;state.error='';render();try{const [products,baskets,kits,coupons]=await Promise.all([firebase(CONFIG.PATH.products),firebase(CONFIG.PATH.baskets).catch(()=>null),firebase(CONFIG.PATH.kits).catch(()=>null),firebase(CONFIG.PATH.coupons).catch(()=>null)]);state.products=normalizeProducts(products);if(!state.products.length)throw new Error('O Firebase não retornou produtos válidos em /produtos.');state.baskets=normalizeBundles(baskets,'basket');state.kits=normalizeBundles(kits,'kit');state.coupons=Array.isArray(coupons)?coupons:Object.values(coupons||{});indexes();Object.keys(state.cart).forEach(id=>{const p=findProduct(id);if(!p||!available(p))delete state.cart[id];else state.cart[id]=Math.min(Number(state.cart[id]||0),p.stock)});state.order=state.order.filter(id=>state.cart[id]);persist();state.loading=false;render();updateShell()}catch(e){state.loading=false;state.error=e.name==='AbortError'?'O Firebase demorou para responder.':(e.message||'Erro ao acessar o Firebase.');render()}}
let searchTimer;document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const a=b.dataset.action,id=b.dataset.id;if(a==='add')add(id);if(a==='inc')add(id);if(a==='dec')setQty(id,Number(state.cart[id]||0)-1);if(a==='favorite')favorite(id);if(a==='add-bundle')addBundle(b.dataset.type,id);if(a==='retry')load();if(a==='clear-cart'){state.cart={};state.order=[];state.bundles=[];persist();updateShell();renderCart();render(false)}if(a==='send-order')sendOrder();if(a==='contact-product'){const p=findProduct(id);openWhatsApp(`Olá! Gostaria de informações sobre ${p?.name||'este produto'}.`)}if(a==='contact-bundle'){const list=b.dataset.type==='basket'?state.baskets:state.kits,x=list.find(v=>v.id===id);openWhatsApp(`Olá! Gostaria de informações sobre ${x?.name||'esta opção'}.`)}}if(e.target.closest('#open-cart')||e.target.closest('#bottom-cart'))openCart();if(e.target.matches('[data-close-cart]')||e.target===$('#cart-overlay'))closeCart()});
$('#search-form').addEventListener('submit',e=>{e.preventDefault();const q=$('#search-input').value.trim();if(q)location.hash=`#/busca/${encodeURIComponent(q)}`});$('#search-input').addEventListener('input',e=>{const q=e.target.value;$('#search-clear').hidden=!q;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(q.trim().length>=2)location.hash=`#/busca/${encodeURIComponent(q.trim())}`},220)});$('#search-clear').addEventListener('click',()=>{$('#search-input').value='';$('#search-clear').hidden=true;location.hash='#/'});addEventListener('hashchange',()=>render());
loadLocal();updateShell();load();
})();
</script>
</body>
