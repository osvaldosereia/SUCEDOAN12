<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Balanço rápido Dona Antônia</title>
  <script>
    (function(){
      var target="/contagem/";
      var url=new URL(target,location.origin);
      if(!url.hash&&location.hash)url.hash=location.hash;
      location.replace(url.href);
    }());
  </script>
</head>
<body>
  <p>Esta ferramenta foi incorporada ao Admin único da Dona Antônia. <a href="/contagem/">Continuar</a>.</p>
</body>
</html>
