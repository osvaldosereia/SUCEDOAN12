# trigger: canonical separation completion patch
name: TEMP separation completion feedback v4

on:
  push:
    branches:
      - 'fix/separation-completion-feedback-v4-*'
    paths:
      - 'scripts/_apply_separation_completion_feedback_v4.mjs'
      - '.github/workflows/_temp-separation-completion-feedback-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical patch
        run: node scripts/_apply_separation_completion_feedback_v4.mjs
      - name: Commit canonical source
        run: |
          if git diff --quiet -- vitrine/admin/index.html supabase/functions/admin-service-intelligence-v1/index.ts; then
            echo 'No canonical diff produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/admin-service-intelligence-v1/index.ts
          git commit -m 'fix: make separation completion explicit and rebalance Bling installments'
          git push origin HEAD:${{ github.ref_name }}
