name: Patch Agent Core V36

on:
  push:
    branches:
      - fix/agent-eval-basket-contents-v2
    paths:
      - '.github/workflows/patch-agent-core-v36.yml'
      - 'scripts/patch-agent-core-basket-contents-v36.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-eval-basket-contents-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Agent Core and evaluator
        run: node scripts/patch-agent-core-basket-contents-v36.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/dona-antonia-agent-core-v1/index.ts supabase/functions/dona-antonia-agent-eval-v1/index.ts
          git commit -m "feat(agent-core): wire basket contents tool V36"
          git push origin HEAD:fix/agent-eval-basket-contents-v2
