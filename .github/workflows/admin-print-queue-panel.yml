name: Admin print queue panel
on:
  pull_request:
    paths:
      - 'vitrine/admin/index.html'
      - 'vitrine/admin/components/print-queue-panel.js'
      - 'vitrine/admin/components/printing.js'
      - 'vitrine/admin/orders/read-model.js'
      - 'vitrine/admin/orders/contact-actions.js'
      - 'vitrine/admin/orders/search.js'
      - 'vitrine/admin/orders/whatsapp-links.js'
      - 'vitrine/admin/core/identifiers.js'
      - 'vitrine/admin/core/errors.js'
      - 'vitrine/admin/marketing/helpers.js'
      - 'vitrine/admin/orders/sorting.js'
      - 'vitrine/admin/components/expiry-alert.js'
      - 'scripts/test-admin-print-queue-panel.mjs'
      - 'scripts/test-admin-order-read-model.mjs'
      - 'scripts/test-admin-order-contact-actions.mjs'
      - 'scripts/test-admin-order-search.mjs'
      - 'scripts/test-admin-whatsapp-links.mjs'
      - 'scripts/test-admin-core-identifiers.mjs'
      - 'scripts/test-admin-core-errors.mjs'
      - 'scripts/test-admin-marketing-helpers.mjs'
      - 'scripts/test-admin-printing-window.mjs'
      - '.github/workflows/admin-print-queue-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-core-identifiers.mjs
      - run: node scripts/test-admin-core-errors.mjs
      - run: node scripts/test-admin-marketing-helpers.mjs
      - run: node scripts/test-admin-printing-window.mjs
      - run: node scripts/test-admin-print-queue-panel.mjs
      - run: node scripts/test-admin-today-operational-panels.mjs
      - run: node scripts/test-admin-order-contact-actions.mjs
      - run: node scripts/test-admin-whatsapp-links.mjs
      - run: node scripts/test-admin-order-search.mjs
      - run: node scripts/test-admin-order-time.mjs
      - run: node scripts/test-admin-order-read-model.mjs
      - run: node scripts/test-admin-today-cards.mjs
      - run: node scripts/test-admin-controller-contracts.mjs
      - run: node scripts/test-admin-module-load-contract.mjs
      - run: node scripts/test-admin-orders-clean-flow-v3.mjs
      - run: node scripts/test-admin-orders-fiscal-flow-v4.mjs
      - run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
