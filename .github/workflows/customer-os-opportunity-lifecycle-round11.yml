name: Customer OS Opportunity Lifecycle Round 11

on:
  push:
    paths:
      - 'supabase/migrations/20260918233000_cm_1_10_opportunity_engine_v1.sql'
      - 'supabase/migrations/20260919080000_cm_1_homologation_evidence_observer_v1.sql'
      - 'supabase/migrations/20260919081000_cm_1_acceptance_lifecycle_evidence_v1.sql'
      - 'scripts/test-cm-1-opportunity-lifecycle-round11.mjs'
      - '.github/workflows/customer-os-opportunity-lifecycle-round11.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260918233000_cm_1_10_opportunity_engine_v1.sql'
      - 'supabase/migrations/20260919080000_cm_1_homologation_evidence_observer_v1.sql'
      - 'supabase/migrations/20260919081000_cm_1_acceptance_lifecycle_evidence_v1.sql'
      - 'scripts/test-cm-1-opportunity-lifecycle-round11.mjs'

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-cm-1-opportunity-lifecycle-round11.mjs
