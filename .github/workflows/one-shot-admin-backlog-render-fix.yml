name: One-shot admin backlog render fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin-backlog-render-fix.yml'
      - 'scripts/test-admin-backlog-order.py'
      - 'scripts/patch-admin-backlog-order.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/test-admin-backlog-order.py
            scripts/patch-admin-backlog-order.py
          sparse-checkout-cone-mode: false
      - name: Apply minimal fix
        run: python3 scripts/patch-admin-backlog-order.py
      - name: Regression test
        run: python3 scripts/test-admin-backlog-order.py
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('admin inline JavaScript syntax OK');
          NODE
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          if git diff --cached --quiet; then
            echo 'No production change required'
          else
            git commit -m 'fix(admin): restore backlog order rendering'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
