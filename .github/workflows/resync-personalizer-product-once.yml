name: CanecaFácil · ressincronizar produto do personalizador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resync-personalizer-product-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ressincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar produto na Loja Integrada
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: mug-1788189915488-38vzvo
          FORCE: 'true'
          LIMIT: '1'
        run: node scripts/sincronizar-loja-integrada.mjs
      - name: Remover workflow temporário
        run: |
          rm -f .github/workflows/resync-personalizer-product-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/resync-personalizer-product-once.yml
          git commit -m "Remove ressincronização temporária do personalizador" || exit 0
          git pull --rebase origin main
          git push origin main
