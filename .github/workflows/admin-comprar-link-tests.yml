name: Admin Comprar link tests

on:
  push:
    branches:
      - feat/admin-comprar-no-vitrine
    paths:
      - 'admin-v3/**'
      - 'vitrine-v3/index.html'
      - 'scripts/test-admin-v3-contract.mjs'
      - '.github/workflows/admin-comprar-link-tests.yml'
  pull_request:
    paths:
      - 'admin-v3/**'
      - 'vitrine-v3/index.html'
      - 'scripts/test-admin-v3-contract.mjs'
      - '.github/workflows/admin-comprar-link-tests.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-admin-v3-contract.mjs
