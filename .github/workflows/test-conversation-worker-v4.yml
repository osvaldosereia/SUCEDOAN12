name: Test Conversation Worker V4

on:
  push:
    branches:
      - ai-flow-boundary-v1
    paths:
      - 'supabase/functions/conversation-worker-v4/**'
      - 'supabase/migrations/*ai_flow_boundary*'
      - '.github/workflows/test-conversation-worker-v4.yml'
  pull_request:
    paths:
      - 'supabase/functions/conversation-worker-v4/**'
      - 'supabase/migrations/*ai_flow_boundary*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check worker
        run: deno check supabase/functions/conversation-worker-v4/index.ts
      - name: Test routing policy
        run: deno test supabase/functions/conversation-worker-v4/policy.test.ts
      - name: Guard Flow files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "$base" HEAD > /tmp/changed.txt
          echo "Branch-only changes:"
          cat /tmp/changed.txt
          if grep -E '^(whatsapp/flows/|supabase/functions/whatsapp-flow-data-exchange-v1/|scripts/build-flow-)' /tmp/changed.txt; then
            echo 'ERROR: AI Flow-boundary branch must not modify Flow implementation files.' >&2
            exit 1
          fi
