name: One-shot admin auto session retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin-auto-session-retry.yml'
      - 'scripts/test-admin-auto-session-retry.py'
      - 'scripts/patch-admin-auto-session-retry.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            orcamento/app-original.html
            scripts/test-admin-auto-session-retry.py
            scripts/patch-admin-auto-session-retry.py
          sparse-checkout-cone-mode: false
      - name: Apply automatic retry fix
        run: python3 scripts/patch-admin-auto-session-retry.py
      - name: Regression test
        run: python3 scripts/test-admin-auto-session-retry.py
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const path of ['vitrine/admin/index.html','orcamento/app-original.html']){
            const html=fs.readFileSync(path,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            if(!scripts.length)throw new Error(`${path}: no inline script found`);
            scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`${path} inline script ${i+1}: ${e.message}`)}});
          }
          console.log('syntax OK');
          NODE
          git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet -- vitrine/admin/index.html orcamento/app-original.html; then
            echo 'No production changes needed.'
            exit 0
          fi
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html orcamento/app-original.html
          git commit -m 'fix(admin): recover expired session automatically'
          git push origin HEAD:main
