name: Verificar Admin em produção
run-name: Saúde do Admin · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - "producao/index.html"
      - "producao-v2/**"
      - "admin/index.html"
      - "site/produtos-home.json"
      - "site/produtos-admin.json"
      - "site/banners/banners.json"
      - "site/cuponsativos.json"
      - "site/compra-rapida.json"
      - "site/ofertas-automaticas-estado.json"
      - "site/ofertas-historico.json"
      - "catalog-version.json"
      - "scripts/check-admin-production.mjs"
      - "scripts/check-mug-studio-production.mjs"
      - "scripts/test-admin-v2-definitivo.mjs"
      - "scripts/test-admin-v2-route-architecture.mjs"
      - ".github/workflows/verificar-admin-producao.yml"

permissions:
  contents: write

concurrency:
  group: verificar-admin-producao
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validar arquitetura por rota
        id: architecture_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-admin-v2-route-architecture.mjs 2>&1 | tee admin-architecture.log

      - name: Aguardar publicação estática
        if: github.event_name == 'push'
        run: sleep 45

      - name: Verificar produção
        id: health_check
        continue-on-error: true
        env:
          ADMIN_BASE_URL: https://donaantonia.com.br
          OFFER_MAX_AGE_HOURS: 3
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-admin-production.mjs 2>&1 | tee admin-production.log

      - name: Verificar Criador de Canecas publicado
        id: mug_health_check
        continue-on-error: true
        env:
          ADMIN_BASE_URL: https://donaantonia.com.br
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-mug-studio-production.mjs 2>&1 | tee mug-studio-production.log

      - name: Preparar status versionado
        if: always() && steps.health_check.outcome != 'skipped'
        env:
          HEALTH_EVENT: ${{ github.event_name }}
          HEALTH_RUN_ID: ${{ github.run_id }}
          HEALTH_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEALTH_SHA: ${{ github.sha }}
          ARCHITECTURE_OUTCOME: ${{ steps.architecture_check.outcome }}
          MUG_HEALTH_OUTCOME: ${{ steps.mug_health_check.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f admin-production-report.json ]; then
            printf '{"ok":false,"errors":[{"name":"healthcheck","detail":"Relatório não foi gerado"}],"warnings":[]}' > admin-production-report.json
          fi
          SOURCE_FILE="admin-production-report.json" node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.SOURCE_FILE, 'utf8'));
          report.errors = Array.isArray(report.errors) ? report.errors : [];
          report.warnings = Array.isArray(report.warnings) ? report.warnings : [];
          report.checks = Array.isArray(report.checks) ? report.checks : [];
          if (process.env.ARCHITECTURE_OUTCOME === 'failure') {
            const detail = 'O teste local da arquitetura por rota falhou. Consulte admin-architecture.log no artefato do workflow.';
            const error = { name: 'Arquitetura por rota do Admin', ok: false, detail };
            report.errors.push(error);
            report.checks.push(error);
            report.ok = false;
          }
          if (process.env.MUG_HEALTH_OUTCOME === 'failure') {
            const detail = 'O Criador de Canecas publicado no domínio não corresponde à cadeia atual. Consulte mug-studio-production.log.';
            const error = { name: 'Criador de Canecas publicado', ok: false, detail };
            report.errors.push(error);
            report.checks.push(error);
            report.ok = false;
          } else if (process.env.MUG_HEALTH_OUTCOME === 'success') {
            report.checks.push({ name: 'Criador de Canecas publicado', ok: true, detail: 'Entrada dinâmica, navegação, bridge, layout 20/80, 3 colunas e Configuração Make confirmados no domínio.' });
          }
          report.workflow = {
            event: process.env.HEALTH_EVENT,
            runId: process.env.HEALTH_RUN_ID,
            attempt: process.env.HEALTH_RUN_ATTEMPT,
            sourceSha: process.env.HEALTH_SHA,
            architecture: process.env.ARCHITECTURE_OUTCOME,
            mugStudio: process.env.MUG_HEALTH_OUTCOME,
            publishedAt: new Date().toISOString()
          };
          await writeFile(process.env.RUNNER_TEMP + '/admin-health-status.json', JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Publicar mudança real de estado
        if: always() && steps.health_check.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          for tentativa in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            mkdir -p site

            if [ -f site/admin-health-status.json ]; then
              if CURRENT_FILE="site/admin-health-status.json" NEXT_FILE="$RUNNER_TEMP/admin-health-status.json" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const current = JSON.parse(await readFile(process.env.CURRENT_FILE, 'utf8'));
          const next = JSON.parse(await readFile(process.env.NEXT_FILE, 'utf8'));
          const signature = value => JSON.stringify({
            ok: Boolean(value?.ok),
            errors: (value?.errors || []).map(item => item?.name || '').filter(Boolean).sort(),
            warnings: (value?.warnings || []).map(item => item?.name || '').filter(Boolean).sort(),
          });
          process.exit(signature(current) === signature(next) ? 0 : 1);
          NODE
              then
                echo "Estado de saúde sem mudança; nenhum commit será criado."
                exit 0
              fi
            fi

            cp "$RUNNER_TEMP/admin-health-status.json" site/admin-health-status.json
            git add site/admin-health-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Atualiza estado de saúde do Admin"
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            sleep $((tentativa * 2))
          done
          exit 1

      - name: Anexar relatório
        if: always() && steps.health_check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: admin-production-health
          path: |
            admin-production-report.json
            admin-production.log
            admin-architecture.log
            mug-studio-production.log
          if-no-files-found: warn
          retention-days: 14

      - name: Confirmar falha
        if: always() && (steps.architecture_check.outcome == 'failure' || steps.health_check.outcome == 'failure' || steps.mug_health_check.outcome == 'failure')
        run: exit 1
