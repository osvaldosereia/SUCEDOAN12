name: Verificar Admin em produção
run-name: Saúde do Admin · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "23,53 * * * *"
  push:
    branches: [main]
    paths:
      - "producao/index.html"
      - "producao-v2/**"
      - "admin/index.html"
      - "site/produtos-home.json"
      - "site/produtos-admin.json"
      - "site/banners/banners.json"
      - "site/cuponsativos.json"
      - "site/compra-rapida.json"
      - "site/ofertas-automaticas-estado.json"
      - "site/ofertas-historico.json"
      - "catalog-version.json"
      - "scripts/check-admin-production.mjs"
      - "scripts/test-admin-v2-definitivo.mjs"
      - ".github/workflows/verificar-admin-producao.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: verificar-admin-producao
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Aguardar publicação estática
        if: github.event_name == 'push'
        run: sleep 45

      - name: Primeira verificação
        id: first_check
        continue-on-error: true
        env:
          ADMIN_BASE_URL: https://donaantonia.com.br
          OFFER_MAX_AGE_HOURS: 3
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-admin-production.mjs 2>&1 | tee admin-production-first.log
          cp admin-production-report.json admin-production-report-inicial.json

      - name: Solicitar autocorreção
        if: steps.first_check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
            -H "Content-Type: application/json"
          )
          curl --fail-with-body --silent --show-error -X POST "${headers[@]}" "$api" \
            -d "{\"event_type\":\"sincronizar_produtos_home\",\"client_payload\":{\"origem\":\"healthcheck-admin\",\"solicitado_em\":\"$(date -u +%FT%TZ)\"}}"
          curl --fail-with-body --silent --show-error -X POST "${headers[@]}" "$api" \
            -d "{\"event_type\":\"processar_ofertas\",\"client_payload\":{\"origem\":\"healthcheck-admin\",\"solicitado_em\":\"$(date -u +%FT%TZ)\"}}"
          echo "Sincronização do catálogo e processamento de ofertas solicitados."

      - name: Aguardar autocorreção
        if: always() && steps.first_check.outcome == 'failure'
        run: sleep 120

      - name: Verificação final
        id: final_check
        if: always() && steps.first_check.outcome == 'failure'
        continue-on-error: true
        env:
          ADMIN_BASE_URL: https://donaantonia.com.br
          OFFER_MAX_AGE_HOURS: 3
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-admin-production.mjs 2>&1 | tee admin-production-final.log

      - name: Preservar relatório aprovado na primeira tentativa
        if: steps.first_check.outcome == 'success'
        run: cp admin-production-report-inicial.json admin-production-report.json

      - name: Preparar status versionado
        if: always() && steps.first_check.outcome != 'skipped'
        env:
          HEALTH_EVENT: ${{ github.event_name }}
          HEALTH_RUN_ID: ${{ github.run_id }}
          HEALTH_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEALTH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_file="admin-production-report.json"
          if [ ! -f "$source_file" ] && [ -f admin-production-report-inicial.json ]; then
            source_file="admin-production-report-inicial.json"
          fi
          if [ ! -f "$source_file" ]; then
            printf '{"ok":false,"errors":[{"name":"healthcheck","detail":"Relatório não foi gerado"}]}' > "$source_file"
          fi
          SOURCE_FILE="$source_file" node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.SOURCE_FILE, 'utf8'));
          report.workflow = {
            event: process.env.HEALTH_EVENT,
            runId: process.env.HEALTH_RUN_ID,
            attempt: process.env.HEALTH_RUN_ATTEMPT,
            sourceSha: process.env.HEALTH_SHA,
            publishedAt: new Date().toISOString()
          };
          await writeFile(process.env.RUNNER_TEMP + '/admin-health-status.json', JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Publicar status da produção
        if: always() && steps.first_check.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          for tentativa in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            mkdir -p site
            cp "$RUNNER_TEMP/admin-health-status.json" site/admin-health-status.json
            git add site/admin-health-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Atualiza diagnóstico automático do Admin"
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            sleep $((tentativa * 2))
          done
          exit 1

      - name: Anexar relatórios
        if: always() && steps.first_check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: admin-production-health
          path: |
            admin-production-report*.json
            admin-production-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Confirmar falha persistente
        if: always() && steps.first_check.outcome == 'failure' && steps.final_check.outcome == 'failure'
        run: exit 1
