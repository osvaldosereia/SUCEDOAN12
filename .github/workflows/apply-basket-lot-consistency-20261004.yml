name: Apply basket lot consistency 20261004
on:
  push:
    branches:
      - fix/basket-lot-consistency-link-all-20261004
    paths:
      - scripts/apply-basket-lot-consistency-20261004.py
      - .github/workflows/apply-basket-lot-consistency-20261004.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/basket-lot-consistency-link-all-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/apply-basket-lot-consistency-20261004.py
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
          git commit -m "fix: alinhar contagem e seleção de lotes"
          git push origin HEAD:fix/basket-lot-consistency-link-all-20261004
