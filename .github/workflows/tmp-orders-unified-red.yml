name: Temporary unified orders contract

on:
  push:
    branches: [feat/orders-unified-queue-vitrines-20261004]

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire unified orders module
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('vitrine/admin/index.html')
          text = path.read_text()
          tag = '<script src="/vitrine/admin/orders-unified-queue-v1.js?v=20261004"></script>'
          anchor = '<script src="/vitrine/admin/basket-lot-image.js?v=studio-v2"></script>'
          if tag not in text:
              if anchor not in text:
                  raise SystemExit('admin script anchor not found')
              text = text.replace(anchor, anchor + '\n' + tag, 1)
              path.write_text(text)
          PY
      - name: Commit loader when needed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vitrine/admin/index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: load unified orders queue"
            git push origin HEAD:feat/orders-unified-queue-vitrines-20261004
          fi
      - name: Check browser JavaScript syntax
        run: |
          node --check vitrine/admin/orders-unified-queue-v1.js
          node --check vitrine/admin/separacao/separation.js
      - name: Run unified orders contract
        run: node scripts/test-admin-orders-unified-queue-v1.mjs
