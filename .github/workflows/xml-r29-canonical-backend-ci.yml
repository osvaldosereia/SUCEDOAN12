name: XML R29 Canonical Backend and DB
on:
  push:
    branches: ['agent/xml-r29-backend-canonical-release-20261010']
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/**'
      - 'supabase/functions/purchase-xml-v1/**'
      - 'supabase/migrations/*purchase_xml*.sql'
      - 'scripts/test-xml-identity-r2.pg.sql'
      - 'scripts/test-xml-identity-unit-pack-r29.pg.sql'
      - 'scripts/fixtures/xml-production-lot-trigger-r22.sql'
      - 'scripts/test-xml-unit-pack-review-r29.mjs'
      - '.github/workflows/xml-r29-canonical-backend-ci.yml'
permissions:
  contents: read
jobs:
  static-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -eu
          cmp supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts
          node scripts/test-xml-unit-pack-review-r29.mjs
          node scripts/test-xml-unit-pack-ui-r29.mjs

  typecheck-xml-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno check supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts

  disposable-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql, create disposable roles, test R23 and R29
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
          psql -v ON_ERROR_STOP=1 -f scripts/test-xml-identity-r2.pg.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-xml-identity-unit-pack-r29.pg.sql
