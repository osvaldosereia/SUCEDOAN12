name: One-shot balance camera auto EAN
on:
  push:
    branches:
      - feature/balance-camera-auto-ean
    paths:
      - ".github/workflows/one-shot-balance-camera-auto-ean.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/product-image-openai-v1/index.ts
            scripts/test-balance-camera-auto-ean.mjs
            tools/patch_balance_camera_auto_ean.py
            tools/patch_balance_camera_auto_ean_fixups.py
            .github/workflows/one-shot-balance-camera-auto-ean.yml
            balance-patch-error.txt
          sparse-checkout-cone-mode: false
      - name: RED - contract must fail before implementation
        run: |
          if node scripts/test-balance-camera-auto-ean.mjs; then
            echo "Contract unexpectedly passed before implementation"
            exit 1
          else
            echo "RED confirmed: implementation is absent before patch"
          fi
      - name: Apply canonical balance implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['tools/patch_balance_camera_auto_ean.py','tools/patch_balance_camera_auto_ean_fixups.py']:
              p=Path(name); s=p.read_text()
              s=s.replace('re.subn(pattern,repl,text,count=1,flags=re.S)','re.subn(pattern,lambda _m: repl,text,count=1,flags=re.S)')
              p.write_text(s)
          PY
          set +e
          {
            python3 tools/patch_balance_camera_auto_ean.py
            python3 tools/patch_balance_camera_auto_ean_fixups.py
          } > /tmp/balance-patch.log 2>&1
          code=$?
          cat /tmp/balance-patch.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/balance-patch.log balance-patch-error.txt
            git config user.name "Dona Antonia Ops"
            git config user.email "actions@users.noreply.github.com"
            git add --sparse balance-patch-error.txt
            git commit -m "chore(balance): capture patch failure"
            git push
            exit "$code"
          fi
      - name: GREEN - verify implementation contract
        run: |
          node scripts/test-balance-camera-auto-ean.mjs
          git diff --check
          grep -q 'inventory_balance_resolve_ean' supabase/functions/admin-products-live-v1/index.ts
          grep -q 'inventory_balance_commit' supabase/functions/admin-products-live-v1/index.ts
          grep -q 'event==="identify"' supabase/functions/product-image-openai-v1/index.ts
          grep -q 'id="balanceCameraVideo"' vitrine/admin/index.html
          grep -q 'Salvar e próximo' vitrine/admin/index.html
      - name: Commit implementation
        run: |
          git config user.name "Dona Antonia Ops"
          git config user.email "actions@users.noreply.github.com"
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts supabase/functions/product-image-openai-v1/index.ts
          git commit -m "feat(balance): camera flow with automatic EAN registration"
          git push
