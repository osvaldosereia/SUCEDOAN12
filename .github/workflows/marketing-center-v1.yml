name: Marketing Center V1

on:
  pull_request:
    paths:
      - 'admin/config.js'
      - 'admin-v3/marketing-center.*'
      - 'admin-v3/marketing-workflow-v1.js'
      - 'admin-v3/marketing-editor-v1.js'
      - 'admin-v3/marketing-carousel-media-v1.js'
      - 'admin-v3/marketing-carousel-progress-v1.js'
      - 'admin-v3/marketing-insights-v1.js'
      - 'admin-v3/marketing-render-observability-v1.js'
      - 'supabase/functions/admin-marketing-v1/**'
      - 'supabase/functions/admin-marketing-workflow-v1/**'
      - 'supabase/functions/admin-marketing-media-v1/**'
      - 'supabase/functions/admin-marketing-dry-run-v1/**'
      - 'supabase/functions/admin-marketing-insights-v1/**'
      - 'supabase/functions/admin-marketing-carousel-v1/**'
      - 'supabase/functions/admin-marketing-render-triage-v1/**'
      - 'supabase/migrations/*marketing*.sql'
      - 'supabase/config.toml'
      - 'scripts/marketing-render-deterministic-v1.mjs'
      - 'scripts/marketing-render-economical-video-v1.mjs'
      - 'scripts/marketing-render-worker-v1.mjs'
      - 'scripts/marketing-render-completion-adapter-v1.mjs'
      - 'scripts/marketing-private-media-adapter-v1.mjs'
      - 'scripts/marketing-private-media-resolver-v1.mjs'
      - 'scripts/marketing-channel-dry-run-v1.mjs'
      - 'scripts/test-marketing-*.mjs'
      - '.github/workflows/marketing-center-v1.yml'
  push:
    branches: [main]
    paths:
      - 'admin/config.js'
      - 'admin-v3/marketing-center.*'
      - 'admin-v3/marketing-workflow-v1.js'
      - 'admin-v3/marketing-editor-v1.js'
      - 'admin-v3/marketing-carousel-media-v1.js'
      - 'admin-v3/marketing-carousel-progress-v1.js'
      - 'admin-v3/marketing-insights-v1.js'
      - 'admin-v3/marketing-render-observability-v1.js'
      - 'supabase/functions/admin-marketing-v1/**'
      - 'supabase/functions/admin-marketing-workflow-v1/**'
      - 'supabase/functions/admin-marketing-media-v1/**'
      - 'supabase/functions/admin-marketing-dry-run-v1/**'
      - 'supabase/functions/admin-marketing-insights-v1/**'
      - 'supabase/functions/admin-marketing-carousel-v1/**'
      - 'supabase/functions/admin-marketing-render-triage-v1/**'
      - 'supabase/migrations/*marketing*.sql'
      - 'supabase/config.toml'
      - 'scripts/marketing-render-deterministic-v1.mjs'
      - 'scripts/marketing-render-economical-video-v1.mjs'
      - 'scripts/marketing-render-worker-v1.mjs'
      - 'scripts/marketing-render-completion-adapter-v1.mjs'
      - 'scripts/marketing-private-media-adapter-v1.mjs'
      - 'scripts/marketing-private-media-resolver-v1.mjs'
      - 'scripts/marketing-channel-dry-run-v1.mjs'
      - 'scripts/test-marketing-*.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic renderer dependency
        run: npm install --no-save sharp@0.34.3
      - name: Install FFmpeg toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check admin JavaScript syntax
        run: |
          node --check admin-v3/marketing-center.js
          node --check admin-v3/marketing-workflow-v1.js
          node --check admin-v3/marketing-editor-v1.js
          node --check admin-v3/marketing-carousel-media-v1.js
          node --check admin-v3/marketing-carousel-progress-v1.js
          node --check admin-v3/marketing-insights-v1.js
          node --check admin-v3/marketing-render-observability-v1.js
          node --check admin/config.js
      - name: Check worker JavaScript syntax
        run: |
          node --check scripts/marketing-render-worker-v1.mjs
          node --check scripts/marketing-render-completion-adapter-v1.mjs
          node --check scripts/marketing-private-media-adapter-v1.mjs
          node --check scripts/marketing-private-media-resolver-v1.mjs
          node --check scripts/marketing-channel-dry-run-v1.mjs
      - name: Validate Marketing Center safety contract
        run: node scripts/test-marketing-center-v1.mjs
      - name: Validate approval/calendar safety contract
        run: node scripts/test-marketing-workflow-v1.mjs
      - name: Validate quick editor safety contract
        run: node scripts/test-marketing-editor-v1.mjs
      - name: Validate private media safety contract
        run: node scripts/test-marketing-private-media-v1.mjs
      - name: Validate carousel safety contract
        run: node scripts/test-marketing-carousel-v1.mjs
      - name: Validate carousel/media Admin safety contract
        run: node scripts/test-marketing-carousel-media-admin-v1.mjs
      - name: Validate carousel progress Admin safety contract
        run: node scripts/test-marketing-carousel-progress-admin-v1.mjs
      - name: Validate carousel preflight/render safety contract
        run: node scripts/test-marketing-carousel-preflight-v1.mjs
      - name: Validate carousel output binding safety contract
        run: node scripts/test-marketing-carousel-output-binding-v1.mjs
      - name: Validate render completion adapter safety contract
        run: node scripts/test-marketing-render-completion-v1.mjs
      - name: Validate metrics/dry-run Admin and framing safety
        run: node scripts/test-marketing-insights-admin-v1.mjs
      - name: Validate renderer diagnostics safety contract
        run: node scripts/test-marketing-render-diagnostics-v1.mjs
      - name: Validate renderer triage safety contract
        run: node scripts/test-marketing-render-triage-v1.mjs
      - name: Validate deterministic attribution contract
        run: node scripts/test-marketing-attribution-v1.mjs
      - name: Validate deterministic WebP renderer
        run: node scripts/test-marketing-render-v1.mjs
      - name: Validate economical MP4 renderer
        run: node scripts/test-marketing-video-v1.mjs
      - name: Validate deterministic queue worker
        run: node scripts/test-marketing-worker-v1.mjs
      - name: Validate private media persistence adapter
        run: node scripts/test-marketing-private-media-adapter-v1.mjs
      - name: Validate private media source resolver
        run: node scripts/test-marketing-private-media-resolver-v1.mjs
      - name: Validate official channel dry-run contracts
        run: node scripts/test-marketing-channel-dry-run-v1.mjs