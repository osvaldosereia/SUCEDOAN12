name: Marketing Center V1

on:
  pull_request:
    paths:
      - 'admin/config.js'
      - 'admin-v3/marketing-center.*'
      - 'admin-v3/marketing-workflow-v1.js'
      - 'admin-v3/marketing-editor-v1.js'
      - 'supabase/functions/admin-marketing-v1/**'
      - 'supabase/functions/admin-marketing-workflow-v1/**'
      - 'supabase/functions/admin-marketing-media-v1/**'
      - 'supabase/migrations/20260910004500_marketing_center_foundation_v1.sql'
      - 'supabase/migrations/20260910004600_marketing_default_presets_v1.sql'
      - 'supabase/migrations/20260910004650_marketing_performance_hardening_v1.sql'
      - 'supabase/migrations/20260910054800_marketing_media_render_queue_v2.sql'
      - 'supabase/migrations/20260910074400_marketing_render_worker_hardening_v3.sql'
      - 'supabase/migrations/20260910085000_marketing_review_calendar_v4.sql'
      - 'supabase/migrations/20260910093500_marketing_asset_editor_v5.sql'
      - 'supabase/migrations/20260910094600_marketing_asset_editor_privileges_v5_fix.sql'
      - 'supabase/migrations/20260910104500_marketing_render_media_registry_v6.sql'
      - 'supabase/migrations/20260910113000_marketing_private_media_v7.sql'
      - 'supabase/migrations/20260910114500_marketing_carousel_slides_v8.sql'
      - 'supabase/config.toml'
      - 'scripts/marketing-render-deterministic-v1.mjs'
      - 'scripts/marketing-render-economical-video-v1.mjs'
      - 'scripts/marketing-render-worker-v1.mjs'
      - 'scripts/test-marketing-render-v1.mjs'
      - 'scripts/test-marketing-video-v1.mjs'
      - 'scripts/test-marketing-worker-v1.mjs'
      - 'scripts/test-marketing-center-v1.mjs'
      - 'scripts/test-marketing-workflow-v1.mjs'
      - 'scripts/test-marketing-editor-v1.mjs'
      - 'scripts/test-marketing-private-media-v1.mjs'
      - 'scripts/test-marketing-carousel-v1.mjs'
      - '.github/workflows/marketing-center-v1.yml'
  push:
    branches: [main]
    paths:
      - 'admin/config.js'
      - 'admin-v3/marketing-center.*'
      - 'admin-v3/marketing-workflow-v1.js'
      - 'admin-v3/marketing-editor-v1.js'
      - 'supabase/functions/admin-marketing-v1/**'
      - 'supabase/functions/admin-marketing-workflow-v1/**'
      - 'supabase/functions/admin-marketing-media-v1/**'
      - 'supabase/migrations/20260910004500_marketing_center_foundation_v1.sql'
      - 'supabase/migrations/20260910004600_marketing_default_presets_v1.sql'
      - 'supabase/migrations/20260910004650_marketing_performance_hardening_v1.sql'
      - 'supabase/migrations/20260910054800_marketing_media_render_queue_v2.sql'
      - 'supabase/migrations/20260910074400_marketing_render_worker_hardening_v3.sql'
      - 'supabase/migrations/20260910085000_marketing_review_calendar_v4.sql'
      - 'supabase/migrations/20260910093500_marketing_asset_editor_v5.sql'
      - 'supabase/migrations/20260910094600_marketing_asset_editor_privileges_v5_fix.sql'
      - 'supabase/migrations/20260910104500_marketing_render_media_registry_v6.sql'
      - 'supabase/migrations/20260910113000_marketing_private_media_v7.sql'
      - 'supabase/migrations/20260910114500_marketing_carousel_slides_v8.sql'
      - 'supabase/config.toml'
      - 'scripts/marketing-render-deterministic-v1.mjs'
      - 'scripts/marketing-render-economical-video-v1.mjs'
      - 'scripts/marketing-render-worker-v1.mjs'
      - 'scripts/test-marketing-render-v1.mjs'
      - 'scripts/test-marketing-video-v1.mjs'
      - 'scripts/test-marketing-worker-v1.mjs'
      - 'scripts/test-marketing-center-v1.mjs'
      - 'scripts/test-marketing-workflow-v1.mjs'
      - 'scripts/test-marketing-editor-v1.mjs'
      - 'scripts/test-marketing-private-media-v1.mjs'
      - 'scripts/test-marketing-carousel-v1.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic renderer dependency
        run: npm install --no-save sharp@0.34.3
      - name: Install FFmpeg toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check admin JavaScript syntax
        run: |
          node --check admin-v3/marketing-center.js
          node --check admin-v3/marketing-workflow-v1.js
          node --check admin-v3/marketing-editor-v1.js
          node --check admin/config.js
      - name: Check worker JavaScript syntax
        run: node --check scripts/marketing-render-worker-v1.mjs
      - name: Validate Marketing Center safety contract
        run: node scripts/test-marketing-center-v1.mjs
      - name: Validate approval/calendar safety contract
        run: node scripts/test-marketing-workflow-v1.mjs
      - name: Validate quick editor safety contract
        run: node scripts/test-marketing-editor-v1.mjs
      - name: Validate private media safety contract
        run: node scripts/test-marketing-private-media-v1.mjs
      - name: Validate carousel safety contract
        run: node scripts/test-marketing-carousel-v1.mjs
      - name: Validate deterministic WebP renderer
        run: node scripts/test-marketing-render-v1.mjs
      - name: Validate economical MP4 renderer
        run: node scripts/test-marketing-video-v1.mjs
      - name: Validate deterministic queue worker
        run: node scripts/test-marketing-worker-v1.mjs
