name: One-time admin order WhatsApp three destinations

on:
  push:
    paths:
      - '.github/workflows/one-time-admin-order-whatsapp-three-destinations.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/test-admin-order-whatsapp-three-destinations-v1.mjs
            scripts/test-admin-order-whatsapp-ui-integration.mjs
            scripts/test-admin-order-expedition-ui-hotfix.mjs
            scripts/test-order-public-summary.mjs
            scripts/apply-admin-order-whatsapp-three-destinations-v1.py
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/admin-orders-v1/index.ts
            supabase/functions/order-public-view-v1/index.ts
            supabase/migrations/20261003024500_order_public_summary.sql
            pedido/index.html
            .github/workflows/one-time-admin-order-whatsapp-three-destinations.yml
          sparse-checkout-cone-mode: false

      - name: Verify red
        shell: bash
        run: |
          if node scripts/test-admin-order-whatsapp-three-destinations-v1.mjs; then
            echo "Regression test unexpectedly passed before the change."
            exit 1
          fi
          echo "RED confirmed."

      - name: Apply patch
        run: python3 scripts/apply-admin-order-whatsapp-three-destinations-v1.py

      - name: Verify green
        shell: bash
        run: |
          node scripts/test-admin-order-whatsapp-three-destinations-v1.mjs
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node scripts/test-admin-order-expedition-ui-hotfix.mjs
          node scripts/test-order-public-summary.mjs

      - name: Commit tested change
        shell: bash
        run: |
          rm -f .github/workflows/one-time-admin-order-whatsapp-three-destinations.yml
          rm -f scripts/apply-admin-order-whatsapp-three-destinations-v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/index.html scripts/test-admin-order-whatsapp-three-destinations-v1.mjs scripts/test-admin-order-whatsapp-ui-integration.mjs scripts/test-admin-order-expedition-ui-hotfix.mjs scripts/apply-admin-order-whatsapp-three-destinations-v1.py .github/workflows/one-time-admin-order-whatsapp-three-destinations.yml
          git commit -m "fix(admin): add three order WhatsApp destinations"
          git push origin HEAD:main
