name: CanecaFácil · testar substitutos do Make

on:
  workflow_dispatch:
    inputs:
      live_readiness:
        description: 'Testar leitura real da Loja Integrada sem alterar dados'
        required: false
        type: boolean
        default: true
      shadow_audit:
        description: 'Comparar produtos reais Firebase x Loja Integrada em modo somente leitura'
        required: false
        type: boolean
        default: true
      shadow_limit:
        description: 'Quantidade de produtos na auditoria shadow (1 a 25)'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  validar-codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check scripts/canecafacil-github-ops-core-v1.mjs
          node --check scripts/processar-operacoes-github-canecas-v1.mjs
          node --check scripts/auditar-shadow-github-vs-make-v1.mjs
          node --check scripts/test-canecafacil-github-ops-v1.mjs
      - name: Testes unitários sem Make
        run: node scripts/test-canecafacil-github-ops-v1.mjs

  readiness-loja-integrada:
    if: ${{ inputs.live_readiness }}
    needs: validar-codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar token Loja Integrada
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
      - name: Readiness real · somente leitura
        env:
          MODE: readiness
          DRY_RUN: 'true'
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/processar-operacoes-github-canecas-v1.mjs

  shadow-produtos:
    if: ${{ inputs.shadow_audit }}
    needs: validar-codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditoria shadow · Firebase x Loja Integrada · somente leitura
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          SHADOW_LIMIT: ${{ inputs.shadow_limit || '5' }}
        run: node scripts/auditar-shadow-github-vs-make-v1.mjs
