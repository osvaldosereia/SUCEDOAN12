name: Admin ops timeline
on:
  pull_request:
    paths:
      - 'vitrine/admin/index.html'
      - 'vitrine/admin/components/ops-timeline.js'
      - 'scripts/test-admin-ops-timeline.mjs'
      - '.github/workflows/admin-ops-timeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-ops-timeline.mjs
      - run: node scripts/test-admin-order-counts.mjs
      - run: node scripts/test-admin-order-status-pill.mjs
      - run: node scripts/test-admin-print-queue-panel.mjs
      - run: node scripts/test-admin-today-operational-panels.mjs
      - run: node scripts/test-admin-order-contact-actions.mjs
      - run: node scripts/test-admin-controller-contracts.mjs
      - run: node scripts/test-admin-module-load-contract.mjs
      - run: node scripts/test-admin-orders-clean-flow-v3.mjs
      - run: node scripts/test-admin-orders-fiscal-flow-v4.mjs
      - run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
