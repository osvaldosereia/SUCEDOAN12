name: One-shot admin sidebar visual v8
on:
  push:
    branches: [feat/admin-sidebar-visual-v8-20261001]
    paths: ['.github/workflows/one-shot-admin-sidebar-visual-v8.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-sidebar-visual-v8-20261001
      - name: Apply visual refinement
        run: python3 scripts/apply-admin-sidebar-visual-v8.py
      - name: Verify visual contract
        run: python3 scripts/test-admin-sidebar-visual-v8.py
      - name: Verify Admin JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('ADMIN_SIDEBAR_VISUAL_V8_JS_OK');
          NODE
      - name: Verify diff
        run: git diff --check
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git rm -f scripts/test-admin-sidebar-visual-v8.py scripts/apply-admin-sidebar-visual-v8.py .github/workflows/test-admin-sidebar-visual-v8.yml .github/workflows/one-shot-admin-sidebar-visual-v8.yml
          git commit -m 'feat(admin): refine compact sidebar visual v8'
          git push origin HEAD:feat/admin-sidebar-visual-v8-20261001
