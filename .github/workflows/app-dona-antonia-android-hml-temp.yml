name: TEMP App Dona Antonia Android HML

on:
  push:
    branches:
      - 'app-dona-antonia-r0-isolation'
    paths:
      - 'app-dona-antonia/**'
      - '.github/workflows/app-dona-antonia-android-hml-temp.yml'

permissions:
  contents: write

jobs:
  android-hml:
    if: github.ref_name == 'app-dona-antonia-r0-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: app-dona-antonia

    steps:
      - name: Checkout isolated app branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-dona-antonia/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android API 36
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run isolation and application tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Verify Android SDK targets
        run: |
          cat android/variables.gradle
          grep -R "compileSdkVersion\|targetSdkVersion" android/app android/*.gradle android/variables.gradle -n || true

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Unit smoke checks
        run: |
          cd android
          ./gradlew --no-daemon testDebugUnitTest

      - name: Commit generated Android shell to isolated branch
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-dona-antonia/android app-dona-antonia/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(app): generate Android Capacitor shell [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dona-antonia-android-hml-debug
          path: app-dona-antonia/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
