name: CanecaFácil · produtos personalizados temporários LI

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Máximo de criações nesta execução'
        required: false
        default: '10'
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/gerenciar-produtos-personalizados-temporarios-li.mjs'
      - '.github/workflows/gerenciar-produtos-personalizados-temporarios-li.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-produtos-personalizados-temporarios
  cancel-in-progress: false

jobs:
  gerenciar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/gerenciar-produtos-personalizados-temporarios-li.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar script
        run: node --check scripts/gerenciar-produtos-personalizados-temporarios-li.mjs
      - name: Carregar Personal Token
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          test -n "$LI_APP_TOKEN" || { echo 'Token ausente'; exit 1; }
          printf 'LOJA_INTEGRADA_AUTHORIZATION=%s\n' "$LI_APP_TOKEN" >> "$GITHUB_ENV"
      - name: Processar produtos temporários
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LIMIT: ${{ github.event.inputs.limit || '10' }}
        run: node scripts/gerenciar-produtos-personalizados-temporarios-li.mjs
