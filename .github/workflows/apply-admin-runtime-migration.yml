name: Aplicar migração do Admin legado

on:
  push:
    branches: [fix/admin-images-no-v3-20260916]
    paths:
      - 'scripts/migrate-admin-v3-runtime-to-admin.py'
      - '.github/workflows/apply-admin-runtime-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/admin-images-no-v3-20260916
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Migrar runtime usado para /admin
        run: python scripts/migrate-admin-v3-runtime-to-admin.py
      - name: Validar independência frontend
        run: |
          node scripts/test-admin-no-v3-runtime.mjs
          node --check admin/app.js
          node --check admin/api.js
          node --check admin/products-inline-controls-v4.js
          node --check admin/orders-integrated-v2.js
          node --check admin/pedidos-v2.js
          node --check admin/service-intelligence.js
          node --check admin/agent-learning.js
          node --check admin/service-strategy.js
          node --check admin/chat-real-test.js
      - name: Commitar migração
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/
          [ ! -d supabase/functions/admin-core-v1 ] || git add supabase/functions/admin-core-v1/
          [ ! -d supabase/functions/admin-product-names-v1 ] || git add supabase/functions/admin-product-names-v1/
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: consolidar runtime no Admin oficial'
          git push origin HEAD:fix/admin-images-no-v3-20260916
