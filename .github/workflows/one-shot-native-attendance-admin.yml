name: One-shot native Attendance Admin
on:
  push:
    branches: ['refactor/attendance-native-admin-20261003']
    paths:
      - '.github/workflows/one-shot-native-attendance-admin.yml'
      - 'scripts/patch-admin-attendance-native-v1.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/patch-admin-attendance-native-v1.py
            scripts/test-admin-attendance-native-v1.mjs
          sparse-checkout-cone-mode: false
      - run: python3 scripts/patch-admin-attendance-native-v1.py
      - run: node scripts/test-admin-attendance-native-v1.mjs
      - name: Validate Admin inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin inline JavaScript syntax OK');
          NODE
          git diff --check
      - name: Commit native route
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(admin): route Attendance natively'
          git pull --rebase origin refactor/attendance-native-admin-20261003
          git push origin HEAD:refactor/attendance-native-admin-20261003
