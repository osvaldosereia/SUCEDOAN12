name: Admin Products Session CI

on:
  pull_request:
    paths:
      - ".github/workflows/admin-products-session-ci.yml"
      - "scripts/build-vitrine-admin-runtime.py"
      - "scripts/test-products-operational-list.mjs"
      - "scripts/test-mobile-products-quick-edit.mjs"
      - "scripts/test-product-editor-complete.mjs"
      - "vitrine/admin/index.html"
      - "vitrine/admin/admin-runtime.js"
      - "vitrine/admin/runtime-src/01-core-navigation.part.js.txt"
      - "vitrine/admin/runtime-src/03-operations.part.js.txt"
      - "vitrine/admin/runtime-src/09-bootstrap.part.js.txt"
      - "scripts/test-basket-admin-carousel-product-status.mjs"
      - "vitrine/admin/runtime-src/04-products.part.js.txt"
      - "vitrine/admin/styles/admin-main.css"
      - "supabase/functions/admin-products-live-v1/index.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-products-session-ci.yml"
      - "scripts/build-vitrine-admin-runtime.py"
      - "scripts/test-products-operational-list.mjs"
      - "scripts/test-mobile-products-quick-edit.mjs"
      - "scripts/test-product-editor-complete.mjs"
      - "vitrine/admin/index.html"
      - "vitrine/admin/admin-runtime.js"
      - "vitrine/admin/runtime-src/01-core-navigation.part.js.txt"
      - "vitrine/admin/runtime-src/03-operations.part.js.txt"
      - "vitrine/admin/runtime-src/09-bootstrap.part.js.txt"
      - "scripts/test-basket-admin-carousel-product-status.mjs"
      - "vitrine/admin/runtime-src/04-products.part.js.txt"
      - "vitrine/admin/styles/admin-main.css"
      - "supabase/functions/admin-products-live-v1/index.ts"

permissions:
  contents: read

jobs:
  products-session:
    name: products-session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify generated Admin runtime
        run: python3 scripts/build-vitrine-admin-runtime.py --check
      - name: Check Admin runtime syntax
        run: node --check vitrine/admin/admin-runtime.js
      - name: Test operational products list
        run: node scripts/test-products-operational-list.mjs
      - name: Test basket carousel product status and navigation
        run: node scripts/test-basket-admin-carousel-product-status.mjs
      - name: Test mobile quick edit
        run: node scripts/test-mobile-products-quick-edit.mjs
      - name: Test complete product editor
        run: node scripts/test-product-editor-complete.mjs
