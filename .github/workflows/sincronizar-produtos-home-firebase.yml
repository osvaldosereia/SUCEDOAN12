name: Sincronizar catálogo com Firebase
run-name: Catálogo oficial · ${{ github.event_name }}

# EMERGÊNCIA 2026-09-06: removido o cron que baixava o catálogo completo
# do Firebase a cada 3 horas. Mantidos acionamento manual, repository_dispatch
# e push dos scripts até a migração para sincronização incremental.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sincronizar_produtos_home]
  push:
    branches: [main]
    paths:
      - "scripts/sincronizar-produtos-home-firebase.mjs"
      - "scripts/estabilizar-catalogo-publico.mjs"

permissions:
  contents: write

concurrency:
  group: sincronizar-catalogo-firebase
  cancel-in-progress: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar catálogo e sincronizadores
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            site/produtos-home.json
            site/produtos-admin.json
            catalog-version.json
            scripts/sincronizar-produtos-home-firebase.mjs
            scripts/estabilizar-catalogo-publico.mjs

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Gerar catálogos diretamente do Firebase
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          PRODUCTS_HOME_PATH: site/produtos-home.json
          PRODUCTS_ADMIN_PATH: site/produtos-admin.json
          CATALOG_VERSION_PATH: catalog-version.json
        run: node scripts/sincronizar-produtos-home-firebase.mjs

      - name: Compactar catálogo e preservar versão pública
        env:
          PRODUCTS_HOME_PATH: site/produtos-home.json
          PRODUCTS_ADMIN_PATH: site/produtos-admin.json
          CATALOG_VERSION_PATH: catalog-version.json
        run: node scripts/estabilizar-catalogo-publico.mjs

      - name: Validar catálogos gerados
        run: |
          node --check scripts/estabilizar-catalogo-publico.mjs
          node -e "const v=require('./catalog-version.json'); if(!v.version || !v.productCount) process.exit(1)"
          test -s site/produtos-home.json
          test -s site/produtos-admin.json

      - name: Publicar catálogos e versão
        shell: bash
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          PRODUCTS_HOME_PATH: site/produtos-home.json
          PRODUCTS_ADMIN_PATH: site/produtos-admin.json
          CATALOG_VERSION_PATH: catalog-version.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O arquivo de versão recebe um timestamp novo em toda execução. Primeiro
          # confira os catálogos reais para não criar commits vazios a cada agenda.
          git add site/produtos-home.json site/produtos-admin.json
          if git diff --cached --quiet; then
            git restore catalog-version.json
            echo "Catálogos já estão sincronizados; nenhum commit necessário."
            exit 0
          fi
          git add catalog-version.json
          git commit -m "Sincroniza catálogos diretamente do Firebase"
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "O catálogo mudou no main; regenerando sobre a versão mais recente."
            git fetch origin main
            git reset --hard origin/main
            node scripts/sincronizar-produtos-home-firebase.mjs
            node scripts/estabilizar-catalogo-publico.mjs
            node -e "const v=require('./catalog-version.json'); if(!v.version || !v.productCount || v.productCount > v.adminProductCount) process.exit(1)"
            test -s site/produtos-home.json
            test -s site/produtos-admin.json
            git add site/produtos-home.json site/produtos-admin.json
            if git diff --cached --quiet; then
              git restore catalog-version.json
              echo "Outro processo já publicou o mesmo catálogo."
              exit 0
            fi
            git add catalog-version.json
            git commit -m "Sincroniza catálogos diretamente do Firebase"
            sleep $((tentativa * 2))
          done
          echo "Não foi possível publicar os catálogos após cinco tentativas." >&2
          exit 1

# V17: alteração intencional para reconstruir imediatamente o catálogo após a correção de mídia das canecas.
