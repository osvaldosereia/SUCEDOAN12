name: Sincronizar catálogo com Firebase
run-name: Catálogo oficial · ${{ github.event_name }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sincronizar_produtos_home]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sincronizar-produtos-home-firebase.yml"
      - "scripts/sincronizar-produtos-home-firebase.mjs"

permissions:
  contents: write

concurrency:
  group: sincronizar-catalogo-firebase
  cancel-in-progress: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar catálogo e sincronizador
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            site/produtos-home.json
            site/produtos-admin.json
            catalog-version.json
            scripts/sincronizar-produtos-home-firebase.mjs

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Gerar catálogos diretamente do Firebase
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          PRODUCTS_HOME_PATH: site/produtos-home.json
          PRODUCTS_ADMIN_PATH: site/produtos-admin.json
          CATALOG_VERSION_PATH: catalog-version.json
        run: node scripts/sincronizar-produtos-home-firebase.mjs

      - name: Publicar catálogos e versão
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/produtos-home.json site/produtos-admin.json catalog-version.json
          if git diff --cached --quiet; then
            echo "Catálogos já estão sincronizados com o Firebase."
            exit 0
          fi
          git commit -m "Sincroniza catálogos diretamente do Firebase"
          for tentativa in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((tentativa * 2))
          done
          echo "Não foi possível publicar os catálogos após cinco tentativas." >&2
          exit 1
