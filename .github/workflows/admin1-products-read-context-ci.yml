name: Admin1 products reader context
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin1-products-read-v1/**'
      - 'scripts/test-admin1-consumer-context.mjs'
      - '.github/workflows/admin1-products-read-context-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin1-products-read-v1/**'
      - 'scripts/test-admin1-consumer-context.mjs'
      - '.github/workflows/admin1-products-read-context-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bounded caller classification
        run: node scripts/test-admin1-consumer-context.mjs
      - name: Check Edge Function module syntax
        run: |
          node --check supabase/functions/admin1-products-read-v1/consumer-context.mjs
          node --check supabase/functions/admin1-products-read-v1/read-contract.mjs
          node --experimental-strip-types --check supabase/functions/admin1-products-read-v1/index.ts
