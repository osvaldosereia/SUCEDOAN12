name: Marketing Light Video — Manual Homologation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-light-video-preview
  cancel-in-progress: false

jobs:
  render-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate worker contract
        run: node --test tests/marketing-light-video-render-worker.test.mjs

      - name: Verify FFmpeg
        run: command -v ffmpeg\n          ffmpeg -version | head -n 3

      - name: Render one queued preview
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/marketing-light-video-render-worker.mjs
