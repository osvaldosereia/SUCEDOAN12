name: One-shot attendance viewport fit
on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/one-shot-attendance-viewport-fit.yml'
      - 'scripts/patch-attendance-viewport-fit-v1.py'
      - 'scripts/test-admin-attendance-viewport-fit-v1.mjs'
      - 'vitrine/admin/atendimento/attendance.css'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-viewport-fit-20261003
      - run: python3 scripts/patch-attendance-viewport-fit-v1.py
      - run: node scripts/test-admin-attendance-viewport-fit-v1.mjs
      - run: node scripts/test-admin-attendance-scroll-layout-v1.mjs
      - run: git diff --check
      - name: Commit CSS fix
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/atendimento/attendance.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: limitar Atendimento à viewport dinâmica'
          git pull --rebase origin fix/attendance-viewport-fit-20261003
          git push origin HEAD:fix/attendance-viewport-fit-20261003
