name: Limpeza única · resíduos Mug3D

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-mug3d-data.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
      PRODUCTS_NODE: produtos
      FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
    steps:
      - name: Remover campos da automação Mug3D dos produtos
        shell: bash
        run: |
          node <<'NODE'
          const base = String(process.env.FIREBASE_URL || '').replace(/\/+$/, '');
          const node = String(process.env.PRODUCTS_NODE || 'produtos').replace(/^\/+|\/+$/g, '');
          const auth = String(process.env.FIREBASE_AUTH_TOKEN || '').trim();
          const query = auth ? `?auth=${encodeURIComponent(auth)}` : '';
          const fields = [
            'video_360_status',
            'video_360_requested_at',
            'video_360_dispatched_at',
            'video_360_started_at',
            'video_360_finished_at',
            'video_360_error',
            'video_360_engine',
            'video_360_meta'
          ];
          (async () => {
            const response = await fetch(`${base}/${node}.json${query}`, { headers: { Accept: 'application/json' } });
            if (!response.ok) throw new Error(`Firebase GET: ${response.status} ${await response.text()}`);
            const products = await response.json() || {};
            let cleaned = 0;
            for (const [key, product] of Object.entries(products)) {
              if (!product || typeof product !== 'object') continue;
              const hasMug3dFields = fields.some(field => Object.prototype.hasOwnProperty.call(product, field));
              const engine = String(product.video_360_engine || '');
              if (!hasMug3dFields && !engine.includes('mug3d')) continue;
              const patch = Object.fromEntries(fields.map(field => [field, null]));
              const update = await fetch(`${base}/${node}/${encodeURIComponent(key)}.json${query}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify(patch)
              });
              if (!update.ok) throw new Error(`Firebase PATCH ${key}: ${update.status} ${await update.text()}`);
              cleaned += 1;
              console.log(`Limpo: ${key}`);
            }
            console.log(`Produtos limpos: ${cleaned}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
