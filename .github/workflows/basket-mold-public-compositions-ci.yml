name: Basket mold public compositions
on:
  pull_request:
    paths:
      - 'supabase/sql/20261006_basket_mold_public_compositions_v1.sql'
      - 'supabase/migrations/20261006084000_basket_mold_public_compositions_v1.sql'
      - 'scripts/test-basket-mold-public-compositions-v1.mjs'
      - '.github/workflows/basket-mold-public-compositions-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/sql/20261006_basket_mold_public_compositions_v1.sql'
      - 'supabase/migrations/20261006084000_basket_mold_public_compositions_v1.sql'
      - 'scripts/test-basket-mold-public-compositions-v1.mjs'
      - '.github/workflows/basket-mold-public-compositions-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/test-basket-mold-public-compositions-v1.mjs
