name: Admin products internal auth contract
on:
  push:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/admin-products-live-v1/**'
      - 'supabase/sql/20260928_ops2_ean_verified_recovery_v1.sql'
      - 'scripts/test-admin-products-live-internal-auth.mjs'
      - '.github/workflows/admin-products-live-internal-auth-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/admin-products-live-v1/**'
      - 'supabase/sql/20260928_ops2_ean_verified_recovery_v1.sql'
      - 'scripts/test-admin-products-live-internal-auth.mjs'
      - '.github/workflows/admin-products-live-internal-auth-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check internal-key comparison and gateway contract
        run: node scripts/test-admin-products-live-internal-auth.mjs
      - name: Check Edge Function syntax
        run: |
          node --check supabase/functions/admin-products-live-v1/internal-auth.mjs
          node --experimental-strip-types --check supabase/functions/admin-products-live-v1/index.ts
