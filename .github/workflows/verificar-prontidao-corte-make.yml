name: CanecaFácil · prontidão corte Make

# EMERGÊNCIA 2026-09-06: removido o cron horário porque a auditoria lê
# /produtos completo no Firebase. Mantidos acionamento manual e push dos
# scripts enquanto a verificação é convertida para leitura incremental.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verificar-prontidao-corte-make-v1.mjs'
      - 'admin-canecas/github-cutover-readiness-v1.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canecafacil-cutover-readiness
  cancel-in-progress: true

jobs:
  prontidao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            admin-canecas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do painel de prontidão
        run: node --check admin-canecas/github-cutover-readiness-v1.js
      - name: Verificar substitutos GitHub sem alterar Make
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          READINESS_SKU: CANP-WTM83S
          PUBLISH_READINESS: 'true'
        run: node scripts/verificar-prontidao-corte-make-v1.mjs
