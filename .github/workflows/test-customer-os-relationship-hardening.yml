name: Customer OS · Relationship Hardening

on:
  push:
    branches: [main]
    paths:
      - 'admin/relacionamento.html'
      - 'admin/relationship-homologation-hardening.js'
      - 'admin/relationship-homologation-hardening.css'
      - 'scripts/test-cm-1-relationship-hardening-v1.mjs'
      - '.github/workflows/test-customer-os-relationship-hardening.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/relacionamento.html'
      - 'admin/relationship-homologation-hardening.js'
      - 'admin/relationship-homologation-hardening.css'
      - 'scripts/test-cm-1-relationship-hardening-v1.mjs'
      - '.github/workflows/test-customer-os-relationship-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar sintaxe do hardening
        run: node --check admin/relationship-homologation-hardening.js
      - name: Validar contrato da UX de homologação
        run: node scripts/test-cm-1-relationship-hardening-v1.mjs
