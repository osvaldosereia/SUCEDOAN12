name: Finalizar personalizador comercial

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalizar-personalizador-commerce-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalizar-personalizador-comercial
  cancel-in-progress: true

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/finalizar-personalizador-commerce-once.mjs
            loja-integrada/personalizar/app.js
            loja-integrada/personalizar/index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar migracao
        run: node scripts/finalizar-personalizador-commerce-once.mjs
      - name: Validar JavaScript
        run: node --check loja-integrada/personalizar/app.js
      - name: Validar resultado
        run: |
          grep -q "async function approveAndBuy" loja-integrada/personalizar/app.js
          grep -q "status: 'solicitado'" loja-integrada/personalizar/app.js
          grep -q "APROVAR E COMPRAR" loja-integrada/personalizar/index.html
      - name: Publicar arquivos do personalizador
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loja-integrada/personalizar/app.js loja-integrada/personalizar/index.html
          git commit -m "Finaliza aprovacao e compra da caneca personalizada"
          git pull --rebase origin main
          git push origin main
