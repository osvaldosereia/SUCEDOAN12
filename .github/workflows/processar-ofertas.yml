name: Processar ofertas automáticas
run-name: Ofertas oficiais · ${{ github.event_name }}

on:
  repository_dispatch:
    types: [processar_ofertas]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/processar-ofertas.yml"
      - "scripts/processar-ofertas.mjs"
      - "scripts/processar-ofertas-validade.mjs"
      - "scripts/limpar-ofertas-validade-expiradas.mjs"
      - "scripts/reconciliar-publicacao-ofertas.mjs"
      - "site/ofertas-automaticas.json"

permissions:
  contents: write

concurrency:
  group: ofertas-automaticas
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar configuração atual
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Corrigir grant OAuth legado
        shell: bash
        run: |
          set -euo pipefail
          arquivo="scripts/processar-ofertas.mjs"
          errado="urn:ietf:params:oauth2:grant-type:jwt-bearer"
          correto="urn:ietf:params:oauth:grant-type:jwt-bearer"
          if ! grep -Fq "$errado" "$arquivo"; then
            echo "Grant OAuth já está correto."
            exit 0
          fi
          sed -i "s|$errado|$correto|g" "$arquivo"
          node --check "$arquivo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$arquivo"
          git commit -m "Corrige grant OAuth das ofertas [skip ci]"
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Correção OAuth publicada."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          echo "Não foi possível publicar a correção OAuth." >&2
          exit 1

      - name: Preservar base para reconciliação
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ofertas-publicacao"
          mkdir -p "$dir"
          if [ -f site/ofertas-automaticas-estado.json ]; then
            cp site/ofertas-automaticas-estado.json "$dir/base-estado.json"
          else
            printf '{}\n' > "$dir/base-estado.json"
          fi

      - name: Executar limpeza e processamento
        id: engine
        continue-on-error: true
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL || 'https://cedar-chemist-310801-default-rtdb.firebaseio.com' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          OFFERS_HISTORY_PATH: site/ofertas-historico.json
          BANNERS_PATH: ${{ runner.temp }}/banners-removidos.json
          PRODUCTS_HOME_PATH: site/produtos-home.json
        shell: bash
        run: |
          set +e
          node scripts/limpar-ofertas-validade-expiradas.mjs > "$RUNNER_TEMP/ofertas-limpeza.log" 2>&1
          cleanup_code=$?
          validity_code=99
          process_code=99
          if [ "$cleanup_code" -eq 0 ]; then
            node scripts/processar-ofertas-validade.mjs > "$RUNNER_TEMP/ofertas-validade.log" 2>&1
            validity_code=$?
            if [ "$validity_code" -eq 0 ]; then
              node scripts/processar-ofertas.mjs > "$RUNNER_TEMP/ofertas-processamento.log" 2>&1
              process_code=$?
            else
              printf 'Campanhas por categoria nao executadas porque a validade falhou.\n' > "$RUNNER_TEMP/ofertas-processamento.log"
            fi
          else
            printf 'Validade nao executada porque a limpeza falhou.\n' > "$RUNNER_TEMP/ofertas-validade.log"
            printf 'Processamento não executado porque a limpeza falhou.\n' > "$RUNNER_TEMP/ofertas-processamento.log"
          fi
          CLEANUP_CODE="$cleanup_code" VALIDITY_CODE="$validity_code" PROCESS_CODE="$process_code" node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const tail = async file => {
            try {
              const value = await readFile(file, 'utf8');
              return value.slice(-6000);
            } catch {
              return '';
            }
          };
          const cleanupCode = Number(process.env.CLEANUP_CODE);
          const validityCode = Number(process.env.VALIDITY_CODE);
          const processCode = Number(process.env.PROCESS_CODE);
          const status = {
            status: cleanupCode === 0 && validityCode === 0 && processCode === 0 ? 'processado' : 'erro_processamento',
            executado_em: new Date().toISOString(),
            limpeza_codigo: cleanupCode,
            validade_codigo: validityCode,
            processamento_codigo: processCode,
            limpeza_log: await tail(process.env.RUNNER_TEMP + '/ofertas-limpeza.log'),
            validade_log: await tail(process.env.RUNNER_TEMP + '/ofertas-validade.log'),
            processamento_log: await tail(process.env.RUNNER_TEMP + '/ofertas-processamento.log')
          };
          await writeFile(process.env.RUNNER_TEMP + '/ofertas-engine-status.json', JSON.stringify(status, null, 2) + '\n');
          NODE
          if [ "$cleanup_code" -ne 0 ] || [ "$validity_code" -ne 0 ] || [ "$process_code" -ne 0 ]; then
            cat "$RUNNER_TEMP/ofertas-limpeza.log"
            cat "$RUNNER_TEMP/ofertas-validade.log"
            cat "$RUNNER_TEMP/ofertas-processamento.log"
            exit 1
          fi

      - name: Preservar resultados processados
        if: steps.engine.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ofertas-publicacao"
          cp site/produtos-home.json "$dir/gerado-produtos-home.json"
          cp site/ofertas-automaticas-estado.json "$dir/gerado-estado.json"
          cp site/ofertas-historico.json "$dir/gerado-historico.json"

      - name: Publicar com reconciliação e novas tentativas
        id: publish
        if: steps.engine.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          OFFERS_PUBLICATION_DIR: ${{ runner.temp }}/ofertas-publicacao
          CATALOG_VERSION_PATH: catalog-version.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          for tentativa in 1 2 3 4 5; do
            echo "Publicação: tentativa ${tentativa} de 5 na branch ${branch}."
            git fetch origin "$branch"
            git reset --hard "origin/$branch"

            node scripts/reconciliar-publicacao-ofertas.mjs

            git add \
              site/produtos-home.json \
              site/ofertas-automaticas-estado.json \
              site/ofertas-historico.json \
              catalog-version.json

            if git diff --cached --quiet; then
              echo "Nenhuma alteração de catálogo para publicar."
              exit 0
            fi

            git commit -m "Atualiza ofertas automáticas e histórico"
            if git push origin "HEAD:${branch}"; then
              echo "Publicação concluída na tentativa ${tentativa}."
              exit 0
            fi

            echo "A branch recebeu outro commit durante a publicação. Reconciliando novamente."
            sleep $((tentativa * 3))
          done

          echo "Falha ao publicar depois de 5 tentativas." >&2
          exit 1

      - name: Preparar diagnóstico final
        if: always()
        env:
          ENGINE_OUTCOME: ${{ steps.engine.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          let status = {};
          try {
            status = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/ofertas-engine-status.json', 'utf8'));
          } catch {
            status = { status: 'erro_sem_relatorio', executado_em: new Date().toISOString() };
          }
          status.motor_resultado = process.env.ENGINE_OUTCOME || 'desconhecido';
          status.publicacao_resultado = process.env.PUBLISH_OUTCOME || 'não_executada';
          status.evento = process.env.WORKFLOW_EVENT;
          status.run_id = process.env.WORKFLOW_RUN_ID;
          status.tentativa = process.env.WORKFLOW_RUN_ATTEMPT;
          status.sha_origem = process.env.WORKFLOW_SHA;
          status.sucesso = status.motor_resultado === 'success' && ['success', 'skipped'].includes(status.publicacao_resultado);
          status.status = status.sucesso ? 'sucesso' : status.status;
          status.publicado_em = new Date().toISOString();
          await writeFile(process.env.RUNNER_TEMP + '/ofertas-execucao-status.json', JSON.stringify(status, null, 2) + '\n');
          NODE

      - name: Publicar diagnóstico da execução
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          for tentativa in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            cp "$RUNNER_TEMP/ofertas-execucao-status.json" site/ofertas-execucao-status.json
            git add site/ofertas-execucao-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Atualiza diagnóstico da rotina de ofertas"
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            sleep $((tentativa * 2))
          done
          exit 1

      - name: Confirmar falha do processamento
        if: always() && (steps.engine.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: exit 1
