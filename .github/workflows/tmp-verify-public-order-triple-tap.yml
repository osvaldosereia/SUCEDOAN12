name: Temporary verify public order triple tap

on:
  push:
    branches:
      - feat/pedido-triple-tap-separation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source regression test
        run: node scripts/test-public-order-triple-tap-separation-v1.mjs
