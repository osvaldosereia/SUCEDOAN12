name: Dona Antonia - agendador Instagram

on:
  schedule:
    - cron: "1-59/5 * * * *"
      timezone: "America/Cuiaba"

permissions:
  id-token: write
  contents: none

concurrency:
  group: dona-antonia-instagram-automation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Processar fila de publicações do Instagram
        env:
          SUPABASE_FUNCTION_URL: https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/instagram-automation-manager-v1
          OIDC_AUDIENCE: dona-antonia-instagram-stories
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC não está disponível."
            exit 1
          fi
          oidc_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
          case "$oidc_url" in
            *\?*) oidc_url="$oidc_url&audience=$OIDC_AUDIENCE" ;;
            *) oidc_url="$oidc_url?audience=$OIDC_AUDIENCE" ;;
          esac
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$oidc_url")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"
          unset oidc_response
          response="$(curl --fail-with-body --silent --show-error --max-time 240 \
            -X POST "$SUPABASE_FUNCTION_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data '{"action":"run_scheduled"}')"
          unset oidc_token
          printf '%s' "$response" | jq '{ok,materialized,processed,items,error}'
          printf '%s' "$response" | jq -e '.ok == true' >/dev/null
