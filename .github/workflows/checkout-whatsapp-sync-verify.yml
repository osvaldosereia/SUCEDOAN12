name: Checkout WhatsApp sync verify

on:
  push:
    branches:
      - feat/checkout-whatsapp-confirmation-sync
    paths:
      - 'scripts/test-checkout-whatsapp-outbox.mjs'
      - 'scripts/test-checkout-whatsapp-return.mjs'
      - 'scripts/test-checkout-whatsapp-observability.mjs'
      - 'scripts/test-site-only-order-registration.mjs'
      - 'scripts/test-marketing-intelligence-contract.py'
      - 'scripts/patch-checkout-whatsapp-sync.py'
      - '.github/workflows/checkout-whatsapp-sync-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkout-whatsapp-confirmation-sync
          fetch-depth: 1
      - name: Apply sync patch when present
        run: |
          if [ -f scripts/patch-checkout-whatsapp-sync.py ]; then
            python3 scripts/patch-checkout-whatsapp-sync.py
          fi
      - name: Run WhatsApp contracts
        run: |
          node scripts/test-checkout-whatsapp-return.mjs
          node scripts/test-checkout-whatsapp-outbox.mjs
          node scripts/test-checkout-whatsapp-observability.mjs
          node scripts/test-site-only-order-registration.mjs
          python3 scripts/test-marketing-intelligence-contract.py
          cmp -s index.html vitrine/index.html
          git diff --check
      - name: Commit deterministic patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vitrine/index.html supabase/functions/storefront-v2/index.ts
          git commit -m "feat(checkout): sync optional checkout with automatic WhatsApp confirmation"
          git pull --rebase origin feat/checkout-whatsapp-confirmation-sync
          git push origin HEAD:feat/checkout-whatsapp-confirmation-sync
