name: CanecaFácil · migrar worker LI sem marca

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrar-loja-integrada-sem-marca.yml'
      - 'scripts/migrar-li-sem-marca.mjs'

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remover dependência de marcas do worker
        run: |
          node scripts/migrar-li-sem-marca.mjs
          node --check scripts/sincronizar-loja-integrada.mjs
          git diff --check
      - name: Gravar migração
        run: |
          if git diff --quiet; then
            echo 'Worker já estava sem marca.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sincronizar-loja-integrada.mjs
          git commit -m 'CanecaFácil: Loja Integrada sem marcas'
          git push
