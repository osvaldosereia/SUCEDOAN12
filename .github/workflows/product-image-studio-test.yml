name: Product Image Studio — Homologation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .automation/product-image-studio-run-once

permissions:
  contents: read

concurrency:
  group: product-image-studio-homologation
  cancel-in-progress: false

jobs:
  test-real-nine-products:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0 requests==2.32.5

      - name: Verify OpenAI secret is configured
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured"
            exit 1
          fi

      - name: Run real 9-product studio test
        run: |
          python automation/product-image-studio/run_batch.py \
            --manifest automation/product-image-studio/test-manifest-9.json \
            --output-dir artifacts/product-image-studio

      - name: Show non-sensitive result summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/product-image-studio/result.json ]; then
            python - <<'PY'
          import json
          p = json.load(open('artifacts/product-image-studio/result.json', encoding='utf-8'))
          print(json.dumps({
            'mode': p.get('mode'),
            'production_images_changed': p.get('production_images_changed'),
            'model': p.get('model'),
            'quality': p.get('quality'),
            'background': p.get('background'),
            'openai_request_id': p.get('openai_request_id'),
            'outputs': len(p.get('outputs') or []),
            'usage_and_cost': p.get('usage_and_cost'),
          }, ensure_ascii=False, indent=2))
          PY
          fi

      - name: Upload before/after and nine crops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-image-studio-homologation
          path: artifacts/product-image-studio/
          if-no-files-found: warn
          retention-days: 7
