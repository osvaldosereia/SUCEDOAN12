name: Product Image Studio — Homologation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .automation/product-image-studio-run-once

permissions:
  contents: read

concurrency:
  group: product-image-studio-homologation
  cancel-in-progress: false

jobs:
  test-real-nine-products:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: product-studio-u2net-v1

      - name: Install deterministic image dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            pillow==11.3.0 \
            opencv-python-headless==4.11.0.86 \
            'rembg[cpu]>=2.0.65,<3'

      - name: Run real 9-product deterministic studio test
        run: |
          python automation/product-image-studio/run_batch.py \
            --manifest automation/product-image-studio/test-manifest-9.json \
            --output-dir artifacts/product-image-studio

      - name: Show non-sensitive result summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/product-image-studio/result.json ]; then
            python - <<'PY'
          import json
          p = json.load(open('artifacts/product-image-studio/result.json', encoding='utf-8'))
          print(json.dumps({
            'mode': p.get('mode'),
            'production_images_changed': p.get('production_images_changed'),
            'background': p.get('background'),
            'grid': p.get('grid'),
            'segmentation': {
              'engine': (p.get('segmentation') or {}).get('engine'),
              'model': (p.get('segmentation') or {}).get('model'),
              'generative_ai_used': (p.get('segmentation') or {}).get('generative_ai_used'),
              'openai_used': (p.get('segmentation') or {}).get('openai_used'),
              'openai_cost_usd': (p.get('segmentation') or {}).get('openai_cost_usd'),
            },
            'outputs': len(p.get('outputs') or []),
            'average_output_bytes': p.get('average_output_bytes'),
          }, ensure_ascii=False, indent=2))
          PY
          fi

      - name: Upload before/after and nine crops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-image-studio-homologation-deterministic
          path: artifacts/product-image-studio/
          if-no-files-found: warn
          retention-days: 7
