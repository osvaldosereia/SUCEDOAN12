name: Basket mold domain
on:
  pull_request:
    paths:
      - 'supabase/sql/20261006_basket_mold_domain_v1.sql'
      - 'supabase/migrations/20261006060000_basket_mold_domain_v1.sql'
      - 'scripts/test-basket-mold-domain-v1.mjs'
      - '.github/workflows/basket-mold-domain-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/sql/20261006_basket_mold_domain_v1.sql'
      - 'supabase/migrations/20261006060000_basket_mold_domain_v1.sql'
      - 'scripts/test-basket-mold-domain-v1.mjs'
      - '.github/workflows/basket-mold-domain-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-basket-mold-domain-v1.mjs
