name: Admin full function inventory
on:
  pull_request:
    paths:
      - 'vitrine/admin/**'
      - 'supabase/functions/**'
      - 'scripts/audit-admin-functions.mjs'
      - '.github/workflows/admin-full-function-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-admin-functions.mjs artifacts/admin-function-inventory
      - uses: actions/upload-artifact@v4
        with:
          name: admin-function-inventory
          path: artifacts/admin-function-inventory/
          retention-days: 30
