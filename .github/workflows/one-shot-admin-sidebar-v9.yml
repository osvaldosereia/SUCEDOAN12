name: One-shot admin sidebar v9
on:
  push:
    branches: [fix/admin-sidebar-architecture-v9-20261001]
    paths: ['.github/workflows/one-shot-admin-sidebar-v9.yml']
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-sidebar-architecture-v9-20261001
      - name: Apply structural refactor
        run: python3 scripts/apply-admin-sidebar-v9.py
      - name: Verify architecture contract
        run: python3 scripts/test-admin-sidebar-v9.py
      - name: Verify inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('ADMIN_SIDEBAR_V9_JS_OK');
          NODE
      - name: Verify no navigation architecture overlap
        run: |
          ! grep -q 'Admin Navigation V6.1' vitrine/admin/index.html
          ! grep -q 'ADMIN_SIDEBAR_NAV_V7' vitrine/admin/index.html
          ! grep -q 'ADMIN_SIDEBAR_VISUAL_V8' vitrine/admin/index.html
          ! grep -q 'nav-submenu' vitrine/admin/index.html
          ! grep -q 'nav-group-toggle' vitrine/admin/index.html
          grep -q 'ADMIN_SIDEBAR_V9' vitrine/admin/index.html
          grep -q 'class="admin-sidebar" id="adminNav"' vitrine/admin/index.html
          echo ADMIN_SIDEBAR_V9_SINGLE_ARCH_OK
      - name: Verify diff
        run: git diff --check
      - name: Commit refactor and remove one-shot tooling
        run: |
          rm -f scripts/apply-admin-sidebar-v9.py
          rm -f .github/workflows/test-admin-sidebar-v9.yml
          rm -f .github/workflows/one-shot-admin-sidebar-v9.yml
          git config user.name 'OSSJU'
          git config user.email 'Junior.sereia@hotmail.com'
          git add vitrine/admin/index.html scripts/test-admin-sidebar-v9.py scripts/apply-admin-sidebar-v9.py .github/workflows/test-admin-sidebar-v9.yml .github/workflows/one-shot-admin-sidebar-v9.yml
          git commit -m 'fix(admin): refatora sidebar sem CSS legado'
          git push origin HEAD:fix/admin-sidebar-architecture-v9-20261001
