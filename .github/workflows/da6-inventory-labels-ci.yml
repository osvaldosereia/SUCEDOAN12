name: DA6 Etiquetas e Balanço — testes determinísticos
on:
  pull_request:
    branches: [main]
    paths:
      - 'vitrine/admin/inventory-label-*'
      - 'vitrine/admin/product-shelf-*'
      - 'vitrine/admin/product-label-print.css'
      - 'vitrine/admin/index.html'
      - 'supabase/functions/admin-products-live-v1/inventory-label-*'
      - 'supabase/migrations/*da6*'
      - 'tests/da6-*'
      - 'tests/inventory-label-*'
      - '.github/workflows/da6-inventory-labels-ci.yml'
  push:
    branches: [agent/gondola-labels-balance-20261009]
    paths:
      - 'vitrine/admin/inventory-label-*'
      - 'vitrine/admin/product-shelf-*'
      - 'vitrine/admin/product-label-print.css'
      - 'supabase/functions/admin-products-live-v1/inventory-label-*'
      - 'supabase/migrations/*da6*'
      - 'tests/da6-*'
      - 'tests/inventory-label-*'
      - '.github/workflows/da6-inventory-labels-ci.yml'
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar somente bibliotecas de geração e leitura QR para teste
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --prefix /tmp/da6-qr-integration jsqr@1.4.0 qrcode-generator@1.4.4
      - name: Testar leitura óptica, impressão e upload resiliente
        env:
          NODE_PATH: /tmp/da6-qr-integration/node_modules
        run: node --test tests/da6-*.test.cjs tests/inventory-label-*.test.cjs
      - name: Validar sintaxe dos módulos do navegador
        run: |
          node --check vitrine/admin/inventory-label-photo-upload.js
          node --check vitrine/admin/inventory-label-photo-tab.js
          node --check vitrine/admin/inventory-label-photo-review.js
          node --check vitrine/admin/inventory-label-photo-reader.js
          node --check vitrine/admin/inventory-label-omr-geometry.js
          node --check vitrine/admin/product-shelf-admin-ui.js
          node --check vitrine/admin/product-shelf-labels.js

  edge-types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Checar tipagem do motor OMR e API de fotos para Supabase Edge
        run: |
          deno check --node-modules-dir=auto supabase/functions/admin-products-live-v1/inventory-label-worker.ts
          deno check --node-modules-dir=auto supabase/functions/admin-products-live-v1/inventory-label-photo-api.ts
      - name: Executar codec real PNG JPEG WebP em WASM/Deno
        run: deno test --allow-read --allow-env --node-modules-dir=auto tests/da6-edge-codec.test.ts

  postgres-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: da6_homologation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: da6_homologation
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente PostgreSQL, se ausente
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Validar migração de revisão com rollback e ACL
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f tests/da6-review-postgres-fixture.sql \
            -f supabase/migrations/20261009140500_da6_manual_review_audit_v1.sql \
            -f tests/da6-review-postgres-assertions.sql
