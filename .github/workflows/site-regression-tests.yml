name: Testes da vitrine e do Admin

on:
  push:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/site-regression-tests.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/site-regression-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /supabase/
            /site/**/*.js
            /site/**/*.mjs
            /site/**/*.css
            /site/**/*.html
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test
