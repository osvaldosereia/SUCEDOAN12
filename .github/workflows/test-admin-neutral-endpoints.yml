name: Testar endpoints neutros do Admin

on:
  push:
    branches: [fix/admin-images-no-v3-20260916]
    paths:
      - 'admin/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - '.github/workflows/test-admin-neutral-endpoints.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - '.github/workflows/test-admin-neutral-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1
      ORIGIN: https://donaantonia.com.br
    steps:
      - uses: actions/checkout@v5

      - name: Health do Admin principal
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"health"}' \
            "$BASE_URL/admin-core-v1" > /tmp/admin-core-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/admin-core-health.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('mode') == 'public_no_auth', data
          PY

      - name: Leitura real do Admin principal
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"categories"}' \
            "$BASE_URL/admin-core-v1" > /tmp/admin-core-read.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/admin-core-read.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert isinstance(data.get('categories'), list), type(data.get('categories'))
          PY

      - name: Health de Nomes dos produtos
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"health"}' \
            "$BASE_URL/admin-product-names-v1" > /tmp/admin-names-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/admin-names-health.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('mode') == 'admin_product_names', data
          PY

      - name: Leitura real de Nomes dos produtos
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"product_name_normalization","limit":20}' \
            "$BASE_URL/admin-product-names-v1" > /tmp/admin-names-read.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/admin-names-read.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert isinstance(data.get('counts'), dict), type(data.get('counts'))
          assert isinstance(data.get('jobs'), list), type(data.get('jobs'))
          PY
