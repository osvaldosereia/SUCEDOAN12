name: Test CanecaFácil Personalização V1

on:
  push:
    branches: [main]
    paths:
      - 'admin-canecas/personalization-config-v1.js'
      - 'loja-integrada/personalizacao-modelo-v1.js'
      - 'scripts/test-personalizacao-modelo-v1.mjs'
      - '.github/workflows/test-canecafacil-personalizacao-v1.yml'
  pull_request:
    paths:
      - 'admin-canecas/personalization-config-v1.js'
      - 'loja-integrada/personalizacao-modelo-v1.js'
      - 'scripts/test-personalizacao-modelo-v1.mjs'
      - '.github/workflows/test-canecafacil-personalizacao-v1.yml'

permissions:
  contents: read

jobs:
  personalization-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Admin personalization syntax
        run: node --check admin-canecas/personalization-config-v1.js
      - name: Check public contract syntax
        run: node --check loja-integrada/personalizacao-modelo-v1.js
      - name: Validate restricted personalization contract
        run: node scripts/test-personalizacao-modelo-v1.mjs
