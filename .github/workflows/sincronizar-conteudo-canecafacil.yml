name: CanecaFácil · conteúdo dos produtos · legado desativado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin-canecas/product-content-manager-v1.js'
      - 'scripts/sincronizar-conteudo-canecafacil.mjs'
      - '.github/workflows/sincronizar-conteudo-canecafacil.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-conteudo-produtos
  cancel-in-progress: false

jobs:
  validar-legado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            admin-canecas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar arquivos históricos sem publicar na Loja Integrada
        run: |
          node --check scripts/sincronizar-conteudo-canecafacil.mjs
          node --check admin-canecas/product-content-manager-v1.js
          echo 'Publicação automática de bloco/personalizador na descrição foi aposentada.'
          echo 'O personalizador oficial agora é o módulo nativo inline da página do produto.'
          echo 'Para retirar resíduos antigos use o workflow CanecaFácil · limpar personalizador legado LI.'
