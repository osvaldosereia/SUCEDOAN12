name: One-shot admin passwordless cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-admin-passwordless-cleanup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            orcamento/index.html
            scripts/patch-admin-passwordless-cleanup.py
          sparse-checkout-cone-mode: false
      - name: Apply cleanup
        run: python3 scripts/patch-admin-passwordless-cleanup.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('vitrine/admin/index.html').read_text()
          q=Path('orcamento/index.html').read_text()
          if 'Confirme o PIN novamente' in a or 'Informe o PIN novamente' in a:
              raise SystemExit('old PIN message remains')
          if 'async function ensureAdminToken()' not in q:
              raise SystemExit('passwordless quote bootstrap missing')
          print('cleanup contract OK')
          PY
          node <<'NODE'
          const fs=require('fs');
          for(const path of ['vitrine/admin/index.html','orcamento/index.html']){
            const html=fs.readFileSync(path,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`${path} inline script ${i+1}: ${e.message}`)}});
          }
          console.log('syntax OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html orcamento/index.html
          git commit -m 'fix(admin): remove referências restantes a PIN'
          git push origin HEAD:main
