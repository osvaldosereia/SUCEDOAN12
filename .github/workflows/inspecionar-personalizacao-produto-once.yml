name: Inspecionar personalizacao do produto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspecionar-personalizacao-produto-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ler configuracao atual no Firebase
        env:
          FIREBASE: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          PRODUCT_KEY: mug-1788189915488-38vzvo
        run: |
          node - <<'NODE'
          const url = `${process.env.FIREBASE}/produtos/${encodeURIComponent(process.env.PRODUCT_KEY)}.json`;
          const r = await fetch(url, {headers:{Accept:'application/json'}});
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const p = await r.json();
          const out = {
            id: process.env.PRODUCT_KEY,
            nome: p?.nome,
            codigo: p?.codigo || p?.sku,
            personalizavel: p?.personalizavel,
            loja_integrada_personalizavel: p?.loja_integrada_personalizavel,
            canecafacil_personalizavel: p?.canecafacil_personalizavel,
            personalizacao_publica: p?.personalizacao_publica,
            personalizacao: p?.personalizacao || null,
            personalizacao_campos: p?.personalizacao_campos || null,
            campos_personalizacao: p?.campos_personalizacao || null,
            arte_horizontal: p?.arte_horizontal || p?.arte_personalizacao || p?.arte_impressao?.url || p?.arte_final_url || '',
            loja_integrada: p?.loja_integrada || null
          };
          console.log('CONFIG_PRODUTO='+JSON.stringify(out));
          NODE
