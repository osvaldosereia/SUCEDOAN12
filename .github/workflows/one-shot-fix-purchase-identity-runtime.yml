name: One-shot fix purchase identity runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-purchase-identity-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair helper name and verify runtime script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'vitrine/admin/index.html';
          let html = fs.readFileSync(path, 'utf8');
          const before = (html.match(/escapeHtml\(/g) || []).length;
          if (!before) throw new Error('Expected broken escapeHtml calls were not found');
          html = html.replaceAll('escapeHtml(', 'esc(');
          fs.writeFileSync(path, html);
          console.log(`${path}: replaced ${before} broken helper call(s)`);

          if (!html.includes('purchase-identity-ui-v1-style')) throw new Error('Purchase identity UI marker missing');
          if (/escapeHtml\(/.test(html)) throw new Error('Broken escapeHtml call still present in admin HTML');
          if (!/\bfunction\s+esc\s*\(|\bconst\s+esc\s*=|\blet\s+esc\s*=|\bvar\s+esc\s*=/.test(html)) {
            throw new Error('Existing esc helper not found in admin HTML');
          }
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
          for (const [i, src] of scripts.entries()) {
            try { new Function(src); }
            catch (e) { throw new Error(`Inline script ${i + 1} syntax error: ${e.message}`); }
          }
          console.log(`Verified ${scripts.length} inline script(s); purchase identity UI runtime helper is valid.`);
          NODE
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix(admin): render purchase identity panel'
          git push
