name: Temporary final verify unified orders

on:
  push:
    branches: [feat/orders-unified-queue-vitrines-v2-20261004]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unified orders contract and syntax
        run: |
          node --check vitrine/admin/orders-unified-queue-v1.js
          node --check vitrine/admin/separacao/separation.js
          node scripts/test-admin-orders-unified-queue-v1.mjs
      - name: Existing order WhatsApp contract
        run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
      - name: Existing public order regression suite
        run: |
          node scripts/test-order-public-summary.mjs
          node scripts/test-admin-order-public-vitrine.mjs
          node scripts/test-order-public-vitrine-print.mjs
          node scripts/test-public-order-triple-tap-separation-v1.mjs
      - name: Diff check
        run: git diff --check HEAD^ HEAD || git diff --check
