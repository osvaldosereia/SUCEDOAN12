name: One-shot product editor complete
on:
  push:
    branches: [feat/product-editor-complete-20261004]
    paths: ['.github/workflows/one-shot-product-editor-complete.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            supabase/functions/admin-products-live-v1/index.ts
            scripts/test-product-editor-complete.mjs
            scripts/patch-product-editor-complete.py
            .github/workflows/one-shot-product-editor-complete.yml
            .github/workflows/one-shot-product-editor-diagnose.yml
          sparse-checkout-cone-mode: false
      - name: RED - contrato precisa falhar antes da implementação
        shell: bash
        run: |
          set +e
          node scripts/test-product-editor-complete.mjs > /tmp/product-editor-red.log 2>&1
          code=$?
          set -e
          cat /tmp/product-editor-red.log
          if [ "$code" -eq 0 ]; then
            echo 'RED inválido: o contrato já passou antes da implementação.' >&2
            exit 1
          fi
          grep -q 'editor precisa declarar o contrato completo v1' /tmp/product-editor-red.log
          echo 'RED confirmado: editor completo ainda ausente.'
      - name: Corrigir gerador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-product-editor-complete.py')
          s=p.read_text()
          old='admin=pattern.sub(new_editor,admin,count=1)'
          new='admin=pattern.sub(lambda _: new_editor,admin,count=1)'
          if old not in s:
              raise SystemExit('anchor pattern.sub not found')
          s=s.replace(old,new,1)
          old_write='ADMIN.write_text(admin)'
          new_write="admin='\\n'.join(line.rstrip() for line in admin.splitlines())+'\\n'\nADMIN.write_text(admin)"
          if old_write not in s:
              raise SystemExit('anchor ADMIN.write_text not found')
          p.write_text(s.replace(old_write,new_write,1))
          print('generator fixed: replacement escapes preserved and trailing whitespace stripped')
          PY
      - name: Aplicar implementação
        run: python3 scripts/patch-product-editor-complete.py
      - name: GREEN - contrato, JavaScript e diff
        run: |
          node scripts/test-product-editor-complete.mjs
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin JS syntax OK');
          NODE
          python3 -m py_compile scripts/patch-product-editor-complete.py
          git diff --check
      - name: Commit da implementação e limpeza do one-shot
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f scripts/patch-product-editor-complete.py .github/workflows/one-shot-product-editor-complete.yml .github/workflows/one-shot-product-editor-diagnose.yml
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts scripts/test-product-editor-complete.mjs
          git commit -m 'feat(admin): editor completo de produtos'
          git push origin HEAD:feat/product-editor-complete-20261004
