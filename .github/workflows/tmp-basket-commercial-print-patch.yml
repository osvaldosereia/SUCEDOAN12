name: Temporary basket commercial print patch
on:
  push:
    branches:
      - fix/basket-admin-actions-20261005
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[commercial-print-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/basket-admin-actions-20261005
      - name: Apply focused patch
        run: python scripts/patch-basket-commercial-print-legacy-20261005.py
      - name: Commit patched admin
        run: |
          if git diff --quiet -- vitrine/admin/index.html; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix: imprimir lote comercial pela origem correta [commercial-print-patch-applied]'
          git push origin HEAD:fix/basket-admin-actions-20261005
