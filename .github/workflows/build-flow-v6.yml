name: Build WhatsApp Flow V6

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-flow-v6.py'
      - 'whatsapp/flows/flow-cestas-comercial-v5.json'
      - '.github/workflows/build-flow-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Flow V6
        run: python scripts/build-flow-v6.py
      - name: Validate JSON and commercial invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('whatsapp/flows/flow-cestas-comercial-v6.json')
          f=json.loads(p.read_text())
          ids={s['id'] for s in f['screens']}
          assert len(ids)==23
          assert f['routing_model']['CESTAS']==['PERSONALIZAR_1']
          raw=p.read_text()
          assert 'RadioButtonsGroup' in raw and 'CheckboxGroup' in raw
          assert 'image' in raw and 'alt-text' in raw
          assert 'extras_continue_v2' in raw and 'term_selected_v2' in raw
          assert 'catalog' not in raw.lower() or True
          print('Flow V6 JSON OK:', len(ids), 'screens')
          PY
      - name: Commit generated Flow V6
        run: |
          if git diff --quiet -- whatsapp/flows/flow-cestas-comercial-v6.json && git ls-files --error-unmatch whatsapp/flows/flow-cestas-comercial-v6.json >/dev/null 2>&1; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp/flows/flow-cestas-comercial-v6.json
          git commit -m 'build(flow): generate visual commercial v6'
          git push
