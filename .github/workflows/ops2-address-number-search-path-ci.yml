name: OPS2 address-number search_path CI
on:
  pull_request:
    paths:
      - .github/workflows/ops2-address-number-search-path-ci.yml
      - scripts/test-ops2-address-number-search-path.mjs
      - supabase/migrations/20261022204312_ops2_address_number_search_path.sql
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/test-ops2-address-number-search-path.mjs
