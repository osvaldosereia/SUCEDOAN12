name: Customer OS Product View Round 10

on:
  push:
    paths:
      - 'comprar/products.js'
      - 'comprar/index.html'
      - 'supabase/functions/shopping-chat-products-v1/index.ts'
      - 'supabase/migrations/20260919060000_cm_1_homologation_catalog_interactions_v1.sql'
      - 'scripts/test-cm-1-product-view-round10.mjs'
      - '.github/workflows/customer-os-product-view-round10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-cm-1-catalog-interactions.mjs
      - run: node scripts/test-cm-1-product-view-round10.mjs
