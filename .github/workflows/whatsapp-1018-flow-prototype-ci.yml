name: WhatsApp 1018 Flow Prototype CI
on:
  pull_request:
    paths:
      - 'vitrine/admin/whatsapp-lab/meta-flow/**'
      - 'scripts/test-whatsapp-1018-flow-prototype.mjs'
      - '.github/workflows/whatsapp-1018-flow-prototype-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-whatsapp-1018-flow-prototype.mjs
