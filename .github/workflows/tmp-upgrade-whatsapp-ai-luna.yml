name: Temporary WhatsApp AI Luna upgrade

on:
  push:
    paths:
      - '.github/workflows/tmp-upgrade-whatsapp-ai-luna.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch conversation worker conservatively
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/conversation-worker-v3/index.ts')
          s=p.read_text()

          s2=s.replace(
            'Não prometa prazo/entrega. Não use carrossel. Pode sugerir imagem, lista ou botões quando isso reduzir atrito.`;',
            'Não prometa prazo/entrega. Não use carrossel. Pode sugerir imagem, lista ou botões quando isso reduzir atrito.\\nPara cestas básicas, identifique a intenção e deixe o backend/Flow conduzir escolha, personalização e fechamento.\\nQuando preencher reply_text, use português brasileiro natural, cordial e curto; responda primeiro o que a pessoa perguntou, sem linguagem de robô e sem repetir a pergunta.`;'
          )
          assert s2!=s, 'instructions anchor not found'
          s=s2

          s2=s.replace('JSON.stringify(ctx).slice(0,24000)', 'JSON.stringify(ctx).slice(0,12000)')
          assert s2!=s, 'context cap anchor not found'
          s=s2

          old='''    const model=Deno.env.get("OPENAI_CONVERSATION_MODEL")||"gpt-4o-mini";\n    const r=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{Authorization:`Bearer ${openaiKey}`,"Content-Type":"application/json"},body:JSON.stringify({model,store:false,max_output_tokens:900,instructions,input:[{role:"user",content}],text:{format:{type:"json_schema",name:"whatsapp_sales_plan",strict:true,schema:planSchema}}}),signal:AbortSignal.timeout(90000),redirect:"error"});\n    if(!r.ok)throw new Error(`openai_http_${r.status}`);const data=await r.json();const plan=parsePlan(data);const usage={model,provider_request_id:r.headers.get("x-request-id"),input_tokens:data.usage?.input_tokens??null,output_tokens:data.usage?.output_tokens??null};'''
          new='''    const configuredModel=clean(Deno.env.get("OPENAI_CONVERSATION_MODEL"),80);\n    const primaryModel=configuredModel.startsWith("gpt-5.6-")?configuredModel:"gpt-5.6-luna";\n    const escalationModel="gpt-5.6-terra";\n    const callPlanner=async(model:string)=>{\n      const response=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{Authorization:`Bearer ${openaiKey}`,"Content-Type":"application/json"},body:JSON.stringify({model,store:false,max_output_tokens:600,reasoning:{effort:"low"},instructions,input:[{role:"user",content}],text:{verbosity:"low",format:{type:"json_schema",name:"whatsapp_sales_plan",strict:true,schema:planSchema}}}),signal:AbortSignal.timeout(90000),redirect:"error"});\n      if(!response.ok)throw new Error(`openai_http_${response.status}`);\n      const data=await response.json();\n      return {response,data,plan:parsePlan(data)};\n    };\n    const primary=await callPlanner(primaryModel);\n    let planned=primary;\n    let plan=primary.plan;\n    let escalated=false;\n    let inputTokens=Number(primary.data.usage?.input_tokens||0);\n    let outputTokens=Number(primary.data.usage?.output_tokens||0);\n    const explicitHuman=/(falar|quero|chama|chamar|atendente|pessoa|humano|humana|equipe)/.test(norm(currentText))&&/(atendente|pessoa|humano|humana|equipe)/.test(norm(currentText));\n    if(!explicitHuman&&(Number(plan.confidence)<0.70||((plan.intent==="clarify"||plan.intent==="human")&&currentText.trim().length>18))){\n      const second=await callPlanner(escalationModel);\n      inputTokens+=Number(second.data.usage?.input_tokens||0);\n      outputTokens+=Number(second.data.usage?.output_tokens||0);\n      if(Number(second.plan.confidence)>=Number(plan.confidence)){planned=second;plan=second.plan;escalated=true;}\n    }\n    const usage={model:escalated?`${primaryModel}+${escalationModel}`:primaryModel,provider_request_id:planned.response.headers.get("x-request-id"),input_tokens:inputTokens||null,output_tokens:outputTokens||null};'''
          assert old in s, 'planner block anchor not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Static policy checks
        run: |
          grep -q 'gpt-5.6-luna' supabase/functions/conversation-worker-v3/index.ts
          grep -q 'gpt-5.6-terra' supabase/functions/conversation-worker-v3/index.ts
          grep -q 'reasoning:{effort:"low"}' supabase/functions/conversation-worker-v3/index.ts
          grep -q 'slice(0,12000)' supabase/functions/conversation-worker-v3/index.ts
          ! grep -q '||"gpt-4o-mini"' supabase/functions/conversation-worker-v3/index.ts
          grep -q 'deterministic_basket' supabase/functions/conversation-worker-v3/index.ts
          grep -q 'queue_human_handoff_v1' supabase/functions/conversation-worker-v3/index.ts
          git diff --check

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck worker
        run: deno check supabase/functions/conversation-worker-v3/index.ts

      - name: Focused worker regression
        run: |
          node --test scripts/conversation-worker-v1.test.mjs scripts/audio-transcription-chain-v1.test.mjs
          node --check scripts/conversation-worker-v1.mjs

      - name: Commit validated runtime change
        run: |
          git config user.name 'Dona Antônia Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/conversation-worker-v3/index.ts
          git commit -m 'feat: upgrade WhatsApp planner to GPT-5.6 Luna with Terra escalation'
          git push

      - name: Deploy worker when Supabase token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured; source was committed and deployment will be done via project tooling.'
            exit 0
          fi
          npx --yes supabase@latest functions deploy conversation-worker-v3 --project-ref ssbesxgaijknwsjbsbcz --no-verify-jwt
