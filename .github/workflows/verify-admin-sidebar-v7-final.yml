name: Verify admin sidebar v7 final
on:
  push:
    branches: [feat/admin-sidebar-nav-v7-20261001]
    paths: ['.github/workflows/verify-admin-sidebar-v7-final.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          required=['ADMIN_SIDEBAR_NAV_V7','id="adminNavToggle"','id="adminNavBackdrop"','id="adminNav"','admin-nav-open','@media(min-width:761px)','@media(max-width:760px)']
          missing=[x for x in required if x not in s]
          assert not missing, missing
          expected=['today','orders','separation','expedition','driver','closure','products','baskets','expiry','quotes','customers','marketing','purchases','balance','gondolas','more']
          assert all(f'data-tab="{x}"' in s for x in expected)
          assert s.count('id="adminNavToggle"')==1 and s.count('id="adminNav"')==1 and s.count('id="adminNavBackdrop"')==1
          print('ADMIN_SIDEBAR_FINAL_CONTRACT_OK')
          PY
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('ADMIN_SIDEBAR_FINAL_JS_OK');
          NODE
          git diff --check
