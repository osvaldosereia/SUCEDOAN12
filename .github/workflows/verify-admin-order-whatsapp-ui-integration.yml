name: Verify admin order WhatsApp UI integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'vitrine/admin/index.html'
      - 'montar/**'
      - 'scripts/test-montar-picking-v1.mjs'
      - 'pedido/index.html'
      - 'p/index.html'
      - 'scripts/test-admin-orders-clean-flow-v3.mjs'
      - 'scripts/test-order-manual-queue-v1.mjs'
      - 'scripts/test-separator-assignment-repair-v1.mjs'
      - 'supabase/sql/20261008_fix_separator_claudio_legacy_check_v1.sql'
      - 'scripts/test-admin-orders-fiscal-flow-v4.mjs'
      - 'scripts/test-order-separation-preassembled-v3.mjs'
      - 'scripts/test-admin-order-public-vitrine.mjs'
      - 'scripts/test-order-public-vitrine-print.mjs'
      - 'scripts/test-order-public-summary.mjs'
      - 'scripts/test-order-customer-notifications-v1.mjs'
      - 'scripts/test-order-addon-foundation-v1.mjs'
      - 'scripts/test-order-addon-atomic-v1.mjs'
      - 'scripts/test-order-addon-public-storefront-v1.mjs'
      - 'adicionar/index.html'
      - 'supabase/functions/order-addon-public-v1/index.ts'
      - 'supabase/config.toml'
      - 'supabase/migrations/*order_addon_*.sql'
      - 'supabase/migrations/*orders_clean_flow_v3*.sql'
      - 'supabase/migrations/*orders_fiscal_flow_v4*.sql'
      - 'supabase/migrations/*order_separation_preassembled_components_v3*.sql'
      - 'supabase/migrations/*order_separation_customer_notify_v1*.sql'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'supabase/functions/admin-service-intelligence-v1/index.ts'
      - 'supabase/functions/admin-order-vitrine-send-v1/index.ts'
      - 'supabase/functions/admin-orders-v1/index.ts'
      - 'supabase/functions/order-separation-notify-v1/index.ts'
      - 'supabase/functions/order-public-view-v1/index.ts'
      - 'scripts/test-admin-order-whatsapp-ui-integration.mjs'
      - '.github/workflows/verify-admin-order-whatsapp-ui-integration.yml'
  push:
    branches: [main, feat/orders-clean-flow-v3-20261004, fix/preassembled-separation-v3-20261004, feat/orders-fiscal-flow-v4-20261004]
    paths:
      - 'vitrine/admin/index.html'
      - 'montar/**'
      - 'scripts/test-montar-picking-v1.mjs'
      - 'pedido/index.html'
      - 'p/index.html'
      - 'scripts/test-admin-orders-clean-flow-v3.mjs'
      - 'scripts/test-order-manual-queue-v1.mjs'
      - 'scripts/test-separator-assignment-repair-v1.mjs'
      - 'supabase/sql/20261008_fix_separator_claudio_legacy_check_v1.sql'
      - 'scripts/test-admin-orders-fiscal-flow-v4.mjs'
      - 'scripts/test-order-separation-preassembled-v3.mjs'
      - 'scripts/test-admin-order-public-vitrine.mjs'
      - 'scripts/test-order-public-vitrine-print.mjs'
      - 'scripts/test-order-public-summary.mjs'
      - 'scripts/test-order-customer-notifications-v1.mjs'
      - 'supabase/migrations/*orders_clean_flow_v3*.sql'
      - 'supabase/migrations/*orders_fiscal_flow_v4*.sql'
      - 'supabase/migrations/*order_separation_preassembled_components_v3*.sql'
      - 'supabase/migrations/*order_separation_customer_notify_v1*.sql'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'supabase/functions/admin-service-intelligence-v1/index.ts'
      - 'supabase/functions/admin-order-vitrine-send-v1/index.ts'
      - 'supabase/functions/admin-orders-v1/index.ts'
      - 'supabase/functions/order-separation-notify-v1/index.ts'
      - 'supabase/functions/order-public-view-v1/index.ts'
      - 'scripts/test-admin-order-whatsapp-ui-integration.mjs'
      - '.github/workflows/verify-admin-order-whatsapp-ui-integration.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Orders V3 + V4 contracts
        run: |
          node scripts/test-admin-orders-clean-flow-v3.mjs
          node scripts/test-order-manual-queue-v1.mjs
          node scripts/test-separator-assignment-repair-v1.mjs
          node scripts/test-montar-picking-v1.mjs
          node scripts/test-order-separation-preassembled-v3.mjs
          node scripts/test-admin-orders-fiscal-flow-v4.mjs
          node scripts/test-order-customer-notifications-v1.mjs
          node scripts/test-order-addon-foundation-v1.mjs
          node scripts/test-order-addon-atomic-v1.mjs
          node scripts/test-order-addon-public-storefront-v1.mjs
      - name: Existing WhatsApp transport contract
        run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
      - name: Public order storefront and printing
        run: |
          node scripts/test-order-public-summary.mjs
          node scripts/test-admin-order-public-vitrine.mjs
          node scripts/test-order-public-vitrine-print.mjs
      - name: Browser JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          for(const file of ['vitrine/admin/index.html','pedido/index.html','p/index.html','adicionar/index.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>{const path=`/tmp/${file.replaceAll('/','-')}-${i}.js`;fs.writeFileSync(path,src);cp.execFileSync(process.execPath,['--check',path],{stdio:'inherit'})});
            console.log(`${file}: inline syntax OK (${scripts.length} script blocks)`);
          }
          NODE
      - name: Quick-add Edge syntax
        run: node --experimental-strip-types --check supabase/functions/order-addon-public-v1/index.ts
      - name: Diff check
        run: git diff --check HEAD^ HEAD || git diff --check
