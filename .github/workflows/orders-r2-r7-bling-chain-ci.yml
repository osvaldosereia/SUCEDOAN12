name: Orders R02-R10 - checkout, fiscal GET and synthetic SEFAZ gate (offline)
on:
  push:
    branches:
      - 'agent/orders-r2-r7-*'
      - 'agent/orders-r2-r8-*'
      - 'agent/orders-r2-r9-*'
      - 'agent/orders-r2-r10-*'
    paths:
      - 'scripts/sql/orders-r2-r7-*.sql'
      - 'scripts/test-orders-r2-r7-*.mjs'
      - 'scripts/test-orders-r2-r8-*.mjs'
      - 'scripts/sql/orders-r2-r9-*.sql'
      - 'scripts/test-orders-r2-r9-*.mjs'
      - 'scripts/sql/orders-r2-r10-*.sql'
      - 'scripts/test-orders-r2-r10-*.mjs'
      - '.github/workflows/orders-r2-r7-bling-chain-ci.yml'


  pull_request:
    branches:
      - 'agent/orders-r2-r6-*'
      - 'agent/orders-r2-r8-*'
      - 'agent/orders-r2-r9-*'
      - main
    paths:
      - 'scripts/sql/orders-r2-r7-*.sql'
      - 'scripts/test-orders-r2-r7-*.mjs'
      - 'scripts/test-orders-r2-r9-*.mjs'
      - 'scripts/sql/orders-r2-r9-*.sql'
      - '.github/workflows/orders-r2-r7-bling-chain-ci.yml'


permissions:
  contents: read
jobs:
  checkout-meta-separation:
    name: Genuine checkout, R04 Meta, R06 frozen manifest, R07 Bling one-write intent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: real_checkout_meta_r2r5_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d real_checkout_meta_r2r5_synthetic"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: real_checkout_meta_r2r5_synthetic
      PGUSER: postgres
      PGPASSWORD: postgres
      BLING_LIVE_ENABLED: 'false'
      META_LIVE_ENABLED: 'false'
      FISCAL_LIVE_ENABLED: 'false'
      R08_FISCAL_PRODUCTION_ENABLED: 'false'
      R9_FISCAL_OBSERVER_ENABLED: 'false'
      ORDER_R10_SEFAZ_PROOF_ENABLED: 'false'
      ORDER_R4_META_CONFIRMATION_ENABLED: 'false'
      ORDER_R5_SEPARATION_META_GATE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      # R03: same original immutable-number migration tested in PR #996.
      - uses: actions/checkout@v4
        with:
          ref: e7408ad5cbcd6ae8d5ca16e90f2e287a7d61af4c
          path: r03-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # R07 original source: pure manifest-to-Bling adapter and unique-intent SQL.
      - uses: actions/checkout@v4
        with:
          ref: 1ab1d7e469ed17abbd1fe6dc92b08fea822e24a2
          path: r07-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 88503c966296f9ed84e8334ed46b837dfbe1e9d2
          path: r08-source
          persist-credentials: false
      # The ORIGINAL R09 observer SQL and pure getter (not copied).
      - uses: actions/checkout@v4
        with:
          ref: 786a58141a99b54e8da60917e87f86e0d8810465
          path: r09-source
          persist-credentials: false
      # Original R10 verifier, SQL draft and regression suite from fixed SHA.
      - uses: actions/checkout@v4
        with:
          ref: a3e7975ba2bc8c3e8707abd12b15c3cae5163a11
          path: r10-source
          persist-credentials: false
      # R06 source is pinned: reconciliation contract and canonical RPC exports,
      # without copying or reimplementing the published code.
      - uses: actions/checkout@v4
        with:
          ref: d90a7443aae5b374e44c5e570d0c6333c666fb69
          path: r06-source
          persist-credentials: false
      # R05 contains exactly the earlier R04+R05 SQL contracts.
      - uses: actions/checkout@v4
        with:
          ref: e84dd252f9b4e3c0ba4bc151a6d89f298e87604d
          path: r05-source
          persist-credentials: false
      - name: Lock transports and flags OFF
        run: |
          set -euo pipefail
          test "$BLING_LIVE_ENABLED" = false
          test "$META_LIVE_ENABLED" = false
          test "$FISCAL_LIVE_ENABLED" = false
          test "$ORDER_R4_META_CONFIRMATION_ENABLED" = false
          test "$ORDER_R5_SEPARATION_META_GATE_ENABLED" = false
      - name: Install PostgreSQL client if missing
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client >/dev/null
          fi
      - name: Load actual checkout v3, reservation, two-kit catalogue
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-checkout-base-fixture.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-baskets-kit-mold-fixture.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-canonical-basket-helpers.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-canonical-checkout-base.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-canonical-checkout-reservation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/sql/orders-r2-checkout-minimum-hardening-review-v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/sql/orders-r2-basket-independent-groups-review-v1.sql
      - name: Load exact R03 identity migration and checkout read-back patch
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r3-integration-fixture.sql
          psql -v ON_ERROR_STOP=1 \
            -f r03-source/supabase/migrations/20261008032000_order_public_identity_at_creation_v1.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-r3-checkout-public-number-readback-review-v1.sql
      - name: Create three real checkout orders and fake Meta outbox/webhook events
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r5-real-checkout-meta-fixture.sql
      - name: Apply ORIGINAL R04/R05 Meta ledger and separation gate drafts
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -f r05-source/supabase/sql/orders-r4-meta-button-confirmation-contract-v1.sql
          psql -v ON_ERROR_STOP=1 \
            -f r05-source/supabase/sql/orders-r5-separation-meta-gates-v1.sql
      - name: Verify full checkout -> weekly ID -> Meta button -> picker guard
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r5-real-checkout-meta-assertions.sql
          test "$(psql -Atc "select count(*) from public.order_meta_confirmations_v1")" = 2
          test "$(psql -Atc "select count(*) from public.r2_r5_meta_test_orders")" = 3
          test "$(psql -Atc "select count(*) from public.orders o join public.r2_r5_meta_test_orders t on t.order_id=o.id join public.order_public_snapshots_v1 s on s.order_id=o.id where s.public_code=o.order_number")" = 3
          test "$(psql -Atc "select count(*) from public.order_separation_completions_v1 where phase='completed'")" = 1
          echo 'PASS R02/R03/R04/R05: two authenticated synthetic button replies, one held order, immutable public codes'
      - name: Close R05 pending-insert bypass before running R06 canonical initializer
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r5-r6-init-meta-confirmation-guard-review-v1.sql
      - name: Upgrade R02-R05 ephemeral receipts to real R06 schema
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r6-manifest-chain-fixture.sql
      - name: Load actual production R02 init/prepare/stock/finish and ORIGINAL R06 manifest
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-canonical-init-function.sql
          psql -v ON_ERROR_STOP=1 -f r06-source/scripts/sql/orders-r6-canonical-separation-functions.sql
          psql -v ON_ERROR_STOP=1 -f r06-source/supabase/sql/orders-r6-picked-manifest-contract-v1.sql
      - name: Test actual checkout through R04/R05 gates to immutable R06 completion
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r6-manifest-chain-assertions.sql
          test "$(psql -Atc "select count(*) from public.order_separation_completions_v1 where metadata ? 'r6_reconciliation'")" = 2
          test "$(psql -Atc "select count(*) from public.r2_r5_meta_test_orders t join public.orders o on o.id=t.order_id where t.kind='basket' and o.total=140")" = 1
          test "$(psql -Atc "select count(*) from public.r2_r5_meta_test_orders t join public.orders o on o.id=t.order_id where t.kind='mold' and o.total=75")" = 1
          echo 'PASS R02-R06: real checkout 2 kits and mold, genuine Meta SQL gate, actual R06 reconciliation and immutable weekly code'
      - name: Apply ORIGINAL R07 unique claim contract (never contact provider)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -f r07-source/supabase/sql/orders-r7-bling-manifest-sync-contract-v1.sql
      - name: Export ACTUAL R06 receipts, build original R07 projection and SHA256
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "SELECT jsonb_build_object(
            'kind',t.kind,'order_id',o.id,'order_number',o.order_number,
            'total',o.total,'manifest',c.metadata->'r6_reconciliation')::text
            FROM public.r2_r5_meta_test_orders t
            JOIN public.orders o ON o.id=t.order_id
            JOIN public.order_separation_completions_v1 c ON c.order_id=o.id
            WHERE t.kind IN ('basket','mold')
            ORDER BY t.kind" > /tmp/r02-r07-real-snapshots.jsonl
          node --check scripts/test-orders-r2-r7-genuine-manifest-adapter.mjs
          node scripts/test-orders-r2-r7-genuine-manifest-adapter.mjs \
            /tmp/r02-r07-real-snapshots.jsonl /tmp/r02-r07-computed-claims.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/r02-r07-computed-claims.sql
      - name: R07 forbids duplicate writes, uses correct picked products and hash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r7-verified-intents-assertions.sql
          test "$(psql -Atc "select count(*) from public.order_bling_r7_sync_intents_v1")" = 2
          test "$(psql -Atc "select sum(attempts) from public.order_bling_r7_sync_intents_v1")" = 2
          test "$BLING_LIVE_ENABLED" = false
          test "$FISCAL_LIVE_ENABLED" = false
          echo 'PASS checkout R02 -> Meta R04/R05 -> frozen R06 -> EXACT R07 separated-only projection SHA256 + one remote intent'
      - name: R08 real R06/R07 receipts with synthetic fiscal approval
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE public.orders ADD COLUMN IF NOT EXISTS bling_order_id bigint"
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.orders o SET bling_order_id=i.bling_order_id FROM public.order_bling_r7_sync_intents_v1 i WHERE i.order_id=o.id AND i.status='verified'"
          psql -v ON_ERROR_STOP=1 -Atc "SELECT jsonb_build_object('kind',t.kind,'order',to_jsonb(o),'completion',to_jsonb(c),'r7_intent',to_jsonb(i))::text FROM public.r2_r5_meta_test_orders t JOIN public.orders o ON o.id=t.order_id JOIN public.order_separation_completions_v1 c ON c.order_id=o.id JOIN public.order_bling_r7_sync_intents_v1 i ON i.order_id=o.id WHERE t.kind IN ('basket','mold') ORDER BY t.kind" > /tmp/r02-r08-receipts.jsonl
          node --check scripts/test-orders-r2-r8-genuine-fiscal-preflight.mjs
          node scripts/test-orders-r2-r8-genuine-fiscal-preflight.mjs /tmp/r02-r08-receipts.jsonl
      - name: Create R09 links ONLY from actual R02 checkout/R06/R07 verified receipts
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r9-observer-chain-fixture.sql
      - name: Apply ORIGINAL R09 observation RPCs (GET-only; no fiscal POST)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f r09-source/supabase/sql/orders-r9-fiscal-observation-contract-v1.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r9-genuine-observer-preclaim.sql
      - name: Two R09 workers contend over the same original checkout order
        run: |
          set -euo pipefail
          SQL="SELECT public.ops2_claim_fiscal_r9_observation_v1(1)::text"
          psql -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/r09-concurrent-a.json 2>/tmp/r09-concurrent-a.err &
          A=$!
          psql -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/r09-concurrent-b.json 2>/tmp/r09-concurrent-b.err &
          B=$!
          wait "$A"
          wait "$B"
          test "$(cat /tmp/r09-concurrent-a.json /tmp/r09-concurrent-b.json | grep -c '"claim_token"')" = 1
          test "$(psql -Atc "SELECT count(*) FROM public.order_fiscal_r9_observations_v1 WHERE status='observing'")" = 1
          test "$(psql -Atc "SELECT sum(attempts) FROM public.order_fiscal_r9_observations_v1")" = 1
          echo 'PASS two workers: only one may GET-check basket; no write to invoices'
      - name: Complete R09 fictitious GET receipt and reject forged observations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r9-genuine-observer-postclaim.sql
          test "$(psql -Atc "SELECT count(*) FROM public.order_fiscal_r9_observations_v1 WHERE status='observed_no_invoice'")" = 1
          test "$(psql -Atc "SELECT count(*) FROM public.order_fiscal_r9_observations_v1")" = 1
      - name: Feed genuine R06/R07/R09 receipts to ORIGINAL R09 and R08 pure guards
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "SELECT jsonb_build_object(
            'kind',t.kind,'order',to_jsonb(o),'completion',to_jsonb(c),
            'r7_intent',to_jsonb(i),'observation',to_jsonb(obs),
            'product_links',CASE WHEN t.kind='basket' THEN
              (SELECT COALESCE(jsonb_agg(jsonb_build_object(
                'source_id',l.source_id,'status',l.status,'bling_id',l.bling_id)),'[]'::jsonb)
                FROM public.bling_hub_entity_links_v2 l WHERE l.entity_type='product')
              ELSE '[]'::jsonb END)::text
            FROM public.r2_r5_meta_test_orders t
            JOIN public.orders o ON o.id=t.order_id
            JOIN public.order_separation_completions_v1 c ON c.order_id=o.id
            JOIN public.order_bling_r7_sync_intents_v1 i ON i.order_id=o.id
            LEFT JOIN public.order_fiscal_r9_observations_v1 obs ON obs.order_id=o.id
            WHERE t.kind IN ('basket','mold') ORDER BY t.kind" > /tmp/r02-r09-real-receipts.jsonl
          node --check scripts/test-orders-r2-r9-genuine-observer.mjs
          node scripts/test-orders-r2-r9-genuine-observer.mjs /tmp/r02-r09-real-receipts.jsonl
          test "$BLING_LIVE_ENABLED" = false
          test "$FISCAL_LIVE_ENABLED" = false
          test "$R9_FISCAL_OBSERVER_ENABLED" = false
          echo 'PASS original R09 observes ONLY R07 verified; R08 fiscal stays blocked without approved tax'
      - name: Run ORIGINAL R10 verifier with truly separated checkout amount (fake SEFAZ only)
        run: |
          set -euo pipefail
          (cd r10-source && node --test scripts/test-orders-r10-sefaz-proof-v1.mjs)
          node --check scripts/test-orders-r2-r10-genuine-sefaz-proof.mjs
          node scripts/test-orders-r2-r10-genuine-sefaz-proof.mjs /tmp/r02-r09-real-receipts.jsonl
          test "$ORDER_R10_SEFAZ_PROOF_ENABLED" = false
      - name: Reuse original fiscal outbox, apply ORIGINAL R10 dispatch/evidence draft
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f r10-source/scripts/sql/orders-r10-hml-fixture.sql
          psql -v ON_ERROR_STOP=1 -f r10-source/supabase/sql/orders-r10-sefaz-authorization-gate-v1.sql
          test "$(psql -Atc "SELECT count(*) FROM public.dispatch_fiscal_jobs")" = 1
          echo 'PASS R10 outbox: only verified R07 basket, no second fiscal writer'
      - name: ORIGINAL R10 SQL guards: deny dispatch, then synthetic SEFAZ protocol, idempotent replay
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f r10-source/scripts/sql/orders-r10-hml-assertions.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-r10-genuine-dispatch-assertions.sql
          test "$(psql -Atc "SELECT count(*) FROM public.order_fiscal_r10_authorization_evidence_v1")" = 1
          test "$(psql -Atc "SELECT count(*) FROM public.dispatch_fiscal_jobs WHERE status='authorized'")" = 1
          echo 'PASS full REAL checkout->Meta fake->R06->R07->R08 blocked->R09 fake GET->R10 fake SEFAZ and delivery gate'
      - name: Ensure no unsafe transports enabled or changes to tracked files
        run: |
          set -euo pipefail
          test "$META_LIVE_ENABLED" = false
          test "$BLING_LIVE_ENABLED" = false
          test "$FISCAL_LIVE_ENABLED" = false
          git diff --check
