name: One-shot XML editable product name latest

# rerun after narrowing regression assertions to the current main contract
on:
  push:
    branches:
      - fix/xml-edit-product-name-main-20261003
    paths:
      - '.github/workflows/one-shot-xml-edit-product-name-latest.yml'
      - 'scripts/patch_purchase_xml_edit_product_name.py'
      - 'scripts/test_purchase_xml_edit_product_name.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: RED - confirm behavior is absent on latest main
        run: |
          if grep -q 'PURCHASE_XML_EDIT_NAME_V1' vitrine/admin/index.html; then
            echo 'Implementation already present; skipping RED replay.'
          else
            set +e
            python scripts/test_purchase_xml_edit_product_name.py > /tmp/xml-name-red.log 2>&1
            status=$?
            set -e
            cat /tmp/xml-name-red.log
            if [ "$status" -eq 0 ]; then
              echo 'Regression test unexpectedly passed before implementation.'
              exit 1
            fi
            echo 'RED confirmed.'
          fi

      - name: Apply focused patch to latest main snapshot
        run: python scripts/patch_purchase_xml_edit_product_name.py

      - name: GREEN - verify behavior and existing XML identification
        run: |
          python scripts/test_purchase_xml_edit_product_name.py
          python scripts/verify_purchase_product_identification.py

      - name: Verify inline JavaScript syntax and diff hygiene
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('vitrine/admin/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
          for (const [i, src] of scripts.entries()) {
            try { new Function(src); }
            catch (e) { throw new Error(`Inline script ${i + 1} syntax error: ${e.message}`); }
          }
          console.log(`Verified ${scripts.length} inline script(s).`);
          NODE
          git diff --check

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix(admin): allow editing XML product name before save'
          git push origin HEAD:${GITHUB_REF_NAME}
