name: Testar Sala de Compra

on:
  push:
    branches: [main]
    paths:
      - 'comprar/**'
      - 'admin/**'
      - 'catalogo/index.html'
      - 'scripts/test-light-shopping-chat-v2.mjs'
      - 'scripts/test-basket-preview-checkout-whatsapp-v1.mjs'
      - 'scripts/test-comprar-product-visual-v2.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - 'scripts/test-comprar-confirm-order-resilience-v1.mjs'
      - 'scripts/test-comprar-checkout-profile-v1.mjs'
      - 'scripts/test-comprar-mobile-v1.mjs'
      - 'scripts/test-comprar-repeat-last-purchase-v1.mjs'
      - 'scripts/test-comprar-frequent-purchases-v1.mjs'
      - 'scripts/test-comprar-personalized-start-v1.mjs'
      - 'scripts/test-comprar-personalized-offers-v1.mjs'
      - 'scripts/test-bling-history-import-v2.mjs'
      - 'scripts/test-customer-commercial-segments-v1.mjs'
      - 'scripts/test-purchase-history-metrics-v1.mjs'
      - 'scripts/test-purchase-history-hardening-v1.mjs'
      - 'scripts/test-bling-history-customer-backfill-v1.mjs'
      - 'scripts/test-comprar-clean-*.mjs'
      - 'scripts/test-shopping-chat-routing-v1.mjs'
      - 'scripts/test-cm-1-catalog-interactions.mjs'
      - 'tests/chat-deterministic-first-v1.mjs'
      - 'tests/chat-deterministic-query-engine-v2.mjs'
      - 'supabase/functions/_shared/deterministic-query-engine.js'
      - 'supabase/functions/shopping-room-v1/**'
      - 'supabase/functions/shopping-chat-v1/**'
      - 'supabase/functions/shopping-chat-products-v1/**'
      - 'supabase/functions/shopping-chat-menu-v1/**'
      - 'supabase/functions/shopping-chat-customer-v1/**'
      - 'supabase/functions/shopping-checkout-v2/**'
      - 'supabase/functions/admin-orders-comprar-v1/**'
      - 'supabase/functions/admin-chat-menu-v1/**'
      - 'supabase/functions/customer-intelligence-v1/**'
      - 'supabase/functions/bling-history-import-v1/**'
      - 'supabase/functions/bling-history-contact-enrichment-v1/**'
      - 'supabase/functions/bling-history-customer-backfill-v1/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/migrations/*bling_history*'
      - 'supabase/migrations/*commercial_segments*'
      - 'supabase/migrations/*purchase_history_metrics*'
      - 'supabase/migrations/*shopping_room*'
      - 'supabase/migrations/*room_address*'
      - 'supabase/migrations/*shopping_chat*'
      - 'supabase/migrations/*web_checkout*'
      - 'supabase/migrations/*chat_deterministic*'
      - 'supabase/migrations/*outbound*'
      - 'supabase/migrations/*frequent*'
      - 'supabase/migrations/*personalized_offers*'
      - 'supabase/migrations/*cm_1_homologation_catalog_interactions*'
      - 'supabase/config.toml'
      - '.github/workflows/test-shopping-room.yml'
  pull_request:
    paths:
      - 'comprar/**'
      - 'admin/**'
      - 'scripts/test-light-shopping-chat-v2.mjs'
      - 'scripts/test-basket-preview-checkout-whatsapp-v1.mjs'
      - 'scripts/test-comprar-product-visual-v2.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - 'scripts/test-comprar-checkout-profile-v1.mjs'
      - 'scripts/test-comprar-mobile-v1.mjs'
      - 'scripts/test-comprar-frequent-purchases-v1.mjs'
      - 'scripts/test-comprar-clean-*.mjs'
      - 'scripts/test-shopping-chat-routing-v1.mjs'
      - 'scripts/test-cm-1-catalog-interactions.mjs'
      - 'tests/chat-deterministic-first-v1.mjs'
      - 'tests/chat-deterministic-query-engine-v2.mjs'
      - 'supabase/functions/_shared/deterministic-query-engine.js'
      - 'supabase/functions/shopping-chat-v1/**'
      - 'supabase/functions/shopping-chat-products-v1/**'
      - 'supabase/functions/shopping-chat-menu-v1/**'
      - 'supabase/functions/shopping-chat-customer-v1/**'
      - 'supabase/functions/shopping-checkout-v2/**'
      - 'supabase/functions/admin-orders-comprar-v1/**'
      - 'supabase/functions/admin-chat-menu-v1/**'
      - 'supabase/migrations/*shopping_room*'
      - 'supabase/migrations/*room_address*'
      - 'supabase/migrations/*shopping_chat*'
      - 'supabase/migrations/*web_checkout*'
      - 'supabase/migrations/*chat_deterministic*'
      - 'supabase/migrations/*frequent*'
      - 'supabase/config.toml'
      - '.github/workflows/test-shopping-room.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript do cliente
        run: |
          node --check comprar/app.js
          node --check comprar/baskets.js
          node --check comprar/products.js
          node --check comprar/checkout.js
          node --check comprar/conversation.js
          node --check comprar/help.js
          node --check comprar/repeat-purchase-v1.js
          node --check comprar/frequent-purchases-v1.js
          node --check comprar/personalized-start-v1.js
          node --check comprar/admin-test-bridge.js
          node --check admin/api.js
          node --check admin/service-strategy.js
          node --check admin/pedidos-v2.js
          node --check admin/orders-integrated-v2.js
          node scripts/test-light-shopping-chat-v2.mjs
          node scripts/test-basket-preview-checkout-whatsapp-v1.mjs
          node scripts/test-comprar-product-visual-v2.mjs
          node scripts/test-comprar-order-admin-v1.mjs
          node scripts/test-comprar-confirm-order-resilience-v1.mjs
          node scripts/test-comprar-checkout-profile-v1.mjs
          node scripts/test-comprar-mobile-v1.mjs
          node scripts/test-comprar-repeat-last-purchase-v1.mjs
          node scripts/test-comprar-frequent-purchases-v1.mjs
          node scripts/test-comprar-personalized-start-v1.mjs
          node scripts/test-comprar-personalized-offers-v1.mjs
          node scripts/test-bling-history-import-v2.mjs
          node scripts/test-customer-commercial-segments-v1.mjs
          node scripts/test-purchase-history-metrics-v1.mjs
          node scripts/test-purchase-history-hardening-v1.mjs
          node scripts/test-bling-history-customer-backfill-v1.mjs
          for test_file in scripts/test-comprar-clean-*.mjs; do node "$test_file"; done
          node scripts/test-shopping-chat-routing-v1.mjs
          node scripts/test-cm-1-catalog-interactions.mjs
          node tests/chat-deterministic-first-v1.mjs
          node tests/chat-deterministic-query-engine-v2.mjs
      - name: Estrutura pública
        shell: bash
        run: |
          set -euo pipefail
          test -f comprar/index.html
          test -f comprar/styles.css
          test -f comprar/config.js
          test -f comprar/app.js
          test -f comprar/baskets.js
          test -f comprar/products.js
          test -f comprar/checkout.js
          test -f comprar/help.js
          test -f comprar/repeat-purchase-v1.js
          test -f comprar/repeat-purchase-v1.css
          test -f comprar/frequent-purchases-v1.js
          test -f comprar/frequent-purchases-v1.css
          test -f comprar/personalized-start-v1.js
          test -f comprar/personalized-start-v1.css
          test -f comprar/admin-test-bridge.js
          test -f admin/pedidos.html
          test -f admin/pedidos-v2.js
          test -f admin/orders-integrated-v2.js
          test -f admin/service-strategy.js
          grep -q "shopping-chat-v1" comprar/config.js
          grep -q "shopping-chat-products-v1" comprar/config.js
          grep -q "shopping-chat-customer-v1" comprar/config.js
          grep -q "shopping-checkout-v2" comprar/config.js
          grep -q "products-filter-sticky" comprar/styles.css
          grep -q "set_basket_quantity" comprar/baskets.js
          grep -q "quantity_editable" comprar/baskets.js
          grep -q "desiredQuantity" comprar/products.js
          grep -q "confirmedQuantity" comprar/products.js
          grep -q "MediaRecorder" comprar/help.js
          grep -q "lookup_customer" comprar/checkout.js
          grep -q "DA_ADMIN_TEST_TRANSPORT" comprar/admin-test-bridge.js
          ! grep -E "chat-light-v2|chat-checkout-quantity-v1|checkout-final-v2|chat-helper-menu|phone-retry-v1|product-detail-v1|storefront-visual-v2" comprar/index.html
          ! grep -R -E "SUPABASE_SERVICE_ROLE_KEY|BLING_CLIENT_SECRET|OPENAI_API_KEY" comprar/ admin/
      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Checar Edge Functions
        run: |
          deno check supabase/functions/shopping-room-v1/index.ts
          deno check supabase/functions/shopping-chat-v1/index.ts
          deno check supabase/functions/shopping-chat-products-v1/index.ts
          deno check supabase/functions/shopping-chat-menu-v1/index.ts
          deno check supabase/functions/shopping-chat-customer-v1/index.ts
          deno check supabase/functions/shopping-checkout-v2/index.ts
          deno check supabase/functions/admin-orders-comprar-v1/index.ts
          deno check supabase/functions/admin-chat-menu-v1/index.ts
          deno check supabase/functions/customer-intelligence-v1/index.ts
          deno check supabase/functions/bling-history-import-v1/index.ts
          deno check supabase/functions/bling-history-contact-enrichment-v1/index.ts
          deno check supabase/functions/bling-history-customer-backfill-v1/index.ts
          deno check supabase/functions/admin-core-v1/index.ts
      - name: Segurança do chat público
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ORIGINS" supabase/functions/shopping-chat-v1/index.ts
          grep -q "tokenOk" supabase/functions/shopping-chat-v1/index.ts
          grep -q "ORIGINS" supabase/functions/shopping-chat-products-v1/index.ts
          grep -q "tokenOk" supabase/functions/shopping-chat-products-v1/index.ts
          grep -q "physically_verified" supabase/functions/shopping-chat-products-v1/index.ts
          grep -q "ORIGINS" supabase/functions/shopping-chat-menu-v1/index.ts
          grep -q "tokenOk" supabase/functions/shopping-chat-menu-v1/index.ts
          grep -q "ORIGINS" supabase/functions/shopping-chat-customer-v1/index.ts
          grep -q "tokenOk" supabase/functions/shopping-chat-customer-v1/index.ts
          grep -q "customer_lookup_attempts" supabase/functions/shopping-chat-customer-v1/index.ts
          grep -q "ORIGINS" supabase/functions/shopping-checkout-v2/index.ts
          grep -q "tokenOk" supabase/functions/shopping-checkout-v2/index.ts
          grep -q "ALLOWED_ORIGINS" supabase/functions/admin-orders-comprar-v1/index.ts
          grep -q "admin_users" supabase/functions/admin-chat-menu-v1/index.ts
          grep -q "shopping_chat_helper_config" supabase/migrations/20260911060643_shopping_chat_helper_menu_v1.sql
          grep -q "room_start_for_conversation_v1" supabase/migrations/20260911043000_light_shopping_chat_entry_v1.sql
          grep -q "shopping_room_basket_entry" supabase/migrations/20260911043000_light_shopping_chat_entry_v1.sql
      - name: Regras de pedido e outbound
        shell: bash
        run: |
          set -euo pipefail
          grep -q "room_confirm_order" supabase/migrations/20260907152000_shopping_room_core_v1.sql
          grep -q "build_bling_order_draft" supabase/migrations/20260907152000_shopping_room_core_v1.sql
          grep -q "customer_document_required" supabase/migrations/20260907160650_order_customer_resolution_and_outbound_queue.sql
          grep -q "outbound_enabled" supabase/migrations/20260907160650_order_customer_resolution_and_outbound_queue.sql
          grep -q "prepare_shopping_room_order_v1" supabase/migrations/20260915020000_shopping_room_order_admin_v1.sql
          grep -q "room_save_address_v2" supabase/migrations/20260915023000_room_address_save_v2.sql
