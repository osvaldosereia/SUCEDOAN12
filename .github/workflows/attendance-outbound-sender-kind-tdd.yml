name: Attendance outbound sender kind TDD
on:
  push:
    branches: [fix/attendance-outbound-sender-kind]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-papoai-outbound-canonical-v1.mjs
