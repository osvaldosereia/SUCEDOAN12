name: Testar contagem física

on:
  push:
    branches: [main]
    paths:
      - 'contagem/**'
      - 'contagem-v2/**'
      - 'scripts/test-fast-balance-no-login.mjs'
      - 'scripts/bling-stock-writer-v1.mjs'
      - 'supabase/functions/inventory-count-v2/**'
      - 'supabase/functions/inventory-fast-v1/**'
      - 'supabase/functions/inventory-fast-stock-v1/**'
      - 'supabase/functions/inventory-fast-balance-v3/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/*fast_inventory_add_balance_v1.sql'
      - '.github/workflows/bling-stock-writer-v1.yml'
      - '.github/workflows/test-contagem-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contagem/**'
      - 'contagem-v2/**'
      - 'scripts/test-fast-balance-no-login.mjs'
      - 'supabase/functions/inventory-fast-balance-v3/**'
      - 'supabase/config.toml'
      - '.github/workflows/test-contagem-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-contagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar JavaScript
        run: |
          node --check contagem-v2/app-v2.js
          node --check contagem-v2/config.js
          node --check contagem-v2/kiosk-mode.js
          node --check contagem-v2/stock-zero-guard.js
          node --check contagem/product-edit-controls.js
          node --check contagem/fast-mode.js
          node --check contagem/fast-mode-compat.js
          node --check contagem/fast-mode-tabs.js
          node --check contagem/fast-stock-operation.js
          node --check scripts/bling-stock-writer-v1.mjs
      - name: Validar balanço rápido sem login
        run: node scripts/test-fast-balance-no-login.mjs
      - name: Validar ausência de segredos óbvios no microapp
        shell: bash
        run: |
          ! grep -R -E 'service_role|BLING_CLIENT_SECRET|BLING_REFRESH_TOKEN' contagem-v2/ contagem/ || (echo 'Segredo ou referência proibida no microapp' >&2; exit 1)
      - name: Validar worker em modo seguro
        shell: bash
        run: |
          grep -q "const APPLY = process.argv.includes('--apply')" scripts/bling-stock-writer-v1.mjs
          grep -q "operacao: 'B'" scripts/bling-stock-writer-v1.mjs
          grep -q 'bling-api-global' .github/workflows/bling-stock-writer-v1.yml
