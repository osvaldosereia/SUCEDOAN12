name: Testar runtime público · 2 mockups + arte + Shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/src/image-performance.js'
      - 'app-next/src/product-media.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-thumbnails-v2.js'
      - 'app-next/src/customer-favorites-v27.js'
      - 'app-next/src/customer-mug-media-v28.js'
      - 'app-next/src/mug-public-personalization-contract-v25.js'
      - 'app-next/src/mug-public-personalization-make-bridge-v1.js'
      - 'app-next/src/mug-public-personalization-v7.js'
      - 'app-next/src/mug-public-result-link-v26.js'
      - 'shared/mug-make-fast-ack-v1.js'
      - 'caneca10/resultado.html'
      - 'scripts/test-mug-runtime-v17.mjs'
      - 'scripts/test-mug-end-to-end-v15.mjs'
      - '.github/workflows/test-mug-runtime-v17.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/src/image-performance.js'
      - 'app-next/src/product-media.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-personalization-contract-v25.js'
      - 'app-next/src/mug-public-personalization-v7.js'
      - 'caneca10/resultado.html'
      - 'scripts/test-mug-runtime-v17.mjs'
      - 'scripts/test-mug-end-to-end-v15.mjs'
      - '.github/workflows/test-mug-runtime-v17.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar runtime público 2 mockups + arte + Shorts
        run: node scripts/test-mug-runtime-v17.mjs
      - name: Validar fluxo ponta a ponta atual
        run: node scripts/test-mug-end-to-end-v15.mjs
