name: Testar runtime público de canecas atual

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/src/product-media.js'
      - 'app-next/src/checkout-phone-fix.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-3d-v2.js'
      - 'app-next/src/mug-public-thumbnails-v2.js'
      - 'app-next/src/customer-favorites-v27.js'
      - 'app-next/src/mug-public-personalization-contract-v25.js'
      - 'app-next/src/mug-public-personalization-v6.js'
      - 'app-next/src/mug-public-result-link-v26.js'
      - 'shared/mug-make-fast-ack-v1.js'
      - 'producao-v2/admin-produtivo.html'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
      - 'caneca10/index.html'
      - 'caneca10/resultado.html'
      - 'caneca10/art-recovery-v1.js'
      - 'scripts/estabilizar-catalogo-publico.mjs'
      - 'site/canecas-print.json'
      - 'scripts/test-mug-runtime-v17.mjs'
      - 'scripts/test-mug-3d-v1.mjs'
      - 'scripts/test-mug-public-3d-v2.mjs'
      - 'scripts/test-mug-public-personalization-v6.mjs'
      - '.github/workflows/test-mug-runtime-v17.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-3d-v2.js'
      - 'app-next/src/mug-public-thumbnails-v2.js'
      - 'app-next/src/mug-public-personalization-v6.js'
      - 'caneca10/resultado.html'
      - 'scripts/test-mug-runtime-v17.mjs'
      - 'scripts/test-mug-3d-v1.mjs'
      - 'scripts/test-mug-public-3d-v2.mjs'
      - 'scripts/test-mug-public-personalization-v6.mjs'
      - '.github/workflows/test-mug-runtime-v17.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar integração do runtime atual
        run: node scripts/test-mug-runtime-v17.mjs
      - name: Validar visualizador 3D V2
        run: node scripts/test-mug-3d-v1.mjs
      - name: Validar contrato específico 3D V2
        run: node scripts/test-mug-public-3d-v2.mjs
      - name: Validar personalização pública art-only
        run: node scripts/test-mug-public-personalization-v6.mjs
