name: Testar canecas runtime V17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/src/product-media.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-personalization-v5.js'
      - 'app-next/src/mug-public-route-guard-v6.js'
      - 'shared/mug-make-fast-ack-v1.js'
      - 'producao-v2/admin-produtivo.html'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
      - 'ceneca10/index.html'
      - 'scripts/estabilizar-catalogo-publico.mjs'
      - 'site/canecas-print.json'
      - 'scripts/test-mug-runtime-v17.mjs'
      - '.github/workflows/test-mug-runtime-v17.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar runtime de canecas
        run: node scripts/test-mug-runtime-v17.mjs
