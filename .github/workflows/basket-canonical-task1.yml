name: Basket canonical task1
on:
  push:
    branches: [feature/baskets-kits-canonical-20261004-exec]
permissions:
  contents: write
jobs:
  task1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            supabase/sql
            supabase/migrations
            scripts
            .github/workflows/basket-kit-editor-ci.yml
            docs/superpowers/specs
            docs/superpowers/plans
          sparse-checkout-cone-mode: false
      - name: Copy approved spec and plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin design/baskets-kits-simple-canonical-20261004
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          git show origin/design/baskets-kits-simple-canonical-20261004:docs/superpowers/specs/2026-10-04-baskets-kits-simple-canonical-stock-design.md > docs/superpowers/specs/2026-10-04-baskets-kits-simple-canonical-stock-design.md
          git show origin/design/baskets-kits-simple-canonical-20261004:docs/superpowers/plans/2026-10-04-baskets-kits-simple-canonical-stock.md > docs/superpowers/plans/2026-10-04-baskets-kits-simple-canonical-stock.md
      - name: RED - write canonical availability contract
        shell: bash
        run: |
          cat > scripts/test-basket-canonical-commerce.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p='supabase/sql/20261004_basket_canonical_commerce_v1.sql';
          assert.ok(fs.existsSync(p),'canonical basket SQL must exist');
          const s=fs.readFileSync(p,'utf8');
          assert.match(s,/create or replace view public\.basket_lot_public_availability_v1/i);
          assert.match(s,/create or replace view public\.basket_commercial_catalog_v1/i);
          assert.match(s,/effective_sellable_stock/i,'component health must use effective physical/sellable stock');
          assert.doesNotMatch(s,/component[^\n]{0,160}loose_sellable_stock/i,'component eligibility must not depend on loose stock');
          assert.match(s,/least\s*\(/i,'linked lots must publish the minimum stock');
          for(const reason of ['available','draft','paused','depleted','component_out_of_stock','linked_lot_unavailable','model_inactive','category_inactive']) assert.ok(s.includes("'"+reason+"'"),reason+' must be represented');
          assert.match(s,/order by[\s\S]{0,220}built_at[\s\S]{0,100}created_at[\s\S]{0,100}(lot_id|id)/i,'public lot selection must be FIFO');
          assert.match(s,/basket_id is not null or category_id is not null/i,'standalone commercial kits must require a category');
          assert.match(s,/basket_current_lot_v1[\s\S]*basket_lot_public_availability_v1/i,'legacy wrapper must derive from canonical availability');
          assert.match(s,/basket_current_kit_lot_v2[\s\S]*basket_lot_public_availability_v1/i,'kit wrapper must derive from canonical availability');
          console.log('basket canonical commerce contract: PASS');
          EOF
          set +e
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-commerce.mjs > /tmp/task1-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/task1-red.log
          if [ "$rc" -eq 0 ]; then echo 'RED expected failure but test passed'; exit 1; fi
          grep -q 'canonical basket SQL must exist' /tmp/task1-red.log
          echo 'RED confirmed: missing canonical SQL'
      - name: GREEN - implement canonical SQL
        shell: bash
        run: |
          cat > /tmp/basket_canonical.sql <<'SQL'
          -- Dona Antônia · Cestas/Kits: disponibilidade e catálogo canônicos v1
          -- Uma única regra pública para Admin, storefront e checkout.

          insert into public.basket_categories(name,slug,sort_order,is_active)
          values
            ('Cestas Completas','cestas-completas',10,true),
            ('Cestas Só Alimento','cestas-so-alimento',20,true),
            ('Kits Limpeza e Higiene','kits-limpeza-e-higiene',30,true),
            ('Kits Limpeza','kits-limpeza',40,true),
            ('Kits Higiene','kits-higiene',50,true)
          on conflict(slug) do update set
            name=excluded.name,sort_order=excluded.sort_order,is_active=true,updated_at=now();

          alter table public.basket_kit_templates add column if not exists category_id uuid;
          do $$begin
            if not exists(select 1 from pg_constraint where conname='basket_kit_templates_category_id_fkey') then
              alter table public.basket_kit_templates
                add constraint basket_kit_templates_category_id_fkey
                foreign key(category_id) references public.basket_categories(id) on delete restrict;
            end if;
          end$$;

          update public.basket_templates b
          set category_id=c.id,updated_at=now()
          from public.basket_categories c
          where b.category_id is null
            and c.slug=case when b.uses_hygiene_kit then 'cestas-completas' else 'cestas-so-alimento' end;

          update public.basket_kit_templates k
          set category_id=c.id,updated_at=now()
          from public.basket_categories c
          where k.basket_id is null and k.category_id is null
            and c.slug=case
              when lower(k.name) like '%limpeza%' and lower(k.name) like '%higiene%' then 'kits-limpeza-e-higiene'
              when lower(k.name) like '%limpeza%' then 'kits-limpeza'
              when lower(k.name) like '%higiene%' then 'kits-higiene'
              else 'kits-limpeza-e-higiene'
            end;

          do $$begin
            if not exists(select 1 from pg_constraint where conname='basket_kit_templates_public_category_check') then
              alter table public.basket_kit_templates
                add constraint basket_kit_templates_public_category_check
                check (basket_id is not null or category_id is not null) not valid;
            end if;
          end$$;
          alter table public.basket_kit_templates validate constraint basket_kit_templates_public_category_check;

          create or replace view public.basket_lot_public_availability_v1
          with (security_invoker=true) as
          with component_health as (
            select l.id lot_id,
              coalesce(bool_and(coalesce(p.is_active,false) and coalesce(s.effective_sellable_stock,0)>0),false) components_in_stock
            from public.basket_stock_lots l
            left join public.basket_stock_lot_items li on li.lot_id=l.id
            left join public.products p on p.id=li.product_id
            left join public.ops2_sellable_stock_v1 s on s.product_id=li.product_id
            group by l.id
          ), lot_model as (
            select l.*,
              case when l.basket_id is not null then coalesce(bt.is_active,false) else coalesce(kt.is_active,false) end model_active,
              case when l.basket_id is not null then bt.category_id else kt.category_id end category_id,
              coalesce(ch.components_in_stock,false) components_in_stock
            from public.basket_stock_lots l
            left join public.basket_templates bt on bt.id=l.basket_id
            left join public.basket_kit_templates kt on kt.id=l.kit_template_id
            left join component_health ch on ch.lot_id=l.id
          ), base as (
            select l.*,
              coalesce(c.is_active,false) category_active,
              case
                when l.status='draft' then 'draft'
                when l.status in ('depleted','cancelled') or coalesce(l.quantity_available,0)<=0 then 'depleted'
                when not l.model_active then 'model_inactive'
                when l.category_id is null or not coalesce(c.is_active,false) then 'category_inactive'
                when l.status<>'ready' then 'depleted'
                when not coalesce(l.sale_enabled,false) then 'paused'
                when not l.components_in_stock then 'component_out_of_stock'
                else 'available'
              end base_reason,
              case when l.status='ready' and coalesce(l.sale_enabled,false) and coalesce(l.quantity_available,0)>0
                         and l.model_active and l.category_id is not null and coalesce(c.is_active,false)
                         and l.components_in_stock
                   then l.quantity_available else 0 end own_available
            from lot_model l
            left join public.basket_categories c on c.id=l.category_id
          )
          select b.lot_id_placeholder from (select null::uuid lot_id_placeholder) b where false;
          SQL
          # Replace the final placeholder with the real SELECT. Keeping the CTE readable makes source-contract review easier.
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/basket_canonical.sql')
          s=p.read_text()
          s=s.replace("          select b.lot_id_placeholder from (select null::uuid lot_id_placeholder) b where false;\n",'''          select
            b.id lot_id,b.basket_id,b.kit_template_id,b.lot_kind,b.short_code,b.lot_code,b.status,
            b.quantity_built,b.quantity_available,b.sale_enabled,b.public_name,b.sale_price_override,
            b.own_sale_price_override,b.linked_lot_id,b.business_type,b.built_at,b.created_at,
            b.category_id,b.model_active,b.category_active,b.components_in_stock,
            case when b.linked_lot_id is null then null else coalesce(x.own_available,0) end linked_available,
            case
              when b.base_reason<>'available' then 0
              when b.linked_lot_id is null then b.own_available
              when x.id is null or x.base_reason<>'available' or x.linked_lot_id is not null then 0
              else least(b.own_available,x.own_available)
            end::integer public_available,
            case
              when b.base_reason<>'available' then b.base_reason
              when b.linked_lot_id is not null and (x.id is null or x.base_reason<>'available' or x.linked_lot_id is not null) then 'linked_lot_unavailable'
              else 'available'
            end::text availability_reason
          from base b
          left join base x on x.id=b.linked_lot_id;

          create or replace view public.basket_commercial_catalog_v1
          with (security_invoker=true) as
          with models as (
            select 'basket'::text source_kind,bt.id commercial_id,bt.id basket_id,null::uuid standalone_kit_template_id,
              bt.name,bt.base_price default_price,bt.image_url,bt.sort_order,bt.is_active,bt.category_id,
              c.name category_name,c.slug category_slug,c.sort_order category_sort_order,c.is_active category_active
            from public.basket_templates bt
            left join public.basket_categories c on c.id=bt.category_id
            union all
            select 'kit'::text,k.id commercial_id,null::uuid basket_id,k.id standalone_kit_template_id,
              k.name,0::numeric default_price,null::text image_url,k.sort_order,k.is_active,k.category_id,
              c.name category_name,c.slug category_slug,c.sort_order category_sort_order,c.is_active category_active
            from public.basket_kit_templates k
            left join public.basket_categories c on c.id=k.category_id
            where k.basket_id is null
          ), candidates as (
            select m.commercial_id,a.*,
              row_number() over(partition by m.commercial_id order by a.built_at,a.created_at,a.lot_id) rn
            from models m
            join public.basket_lot_public_availability_v1 a
              on (m.source_kind='basket' and a.basket_id=m.commercial_id)
              or (m.source_kind='kit' and a.kit_template_id=m.commercial_id and a.basket_id is null)
            where a.public_available>0 and a.availability_reason='available'
          )
          select m.source_kind,m.commercial_id,m.basket_id,m.standalone_kit_template_id,m.name model_name,
            m.category_id,m.category_name,m.category_slug,m.category_sort_order,m.is_active model_active,m.category_active,
            m.image_url,m.default_price,
            c.lot_id public_lot_id,c.short_code public_lot_code,c.lot_code public_internal_lot_code,
            c.linked_lot_id,c.linked_available,c.public_available,
            coalesce(c.availability_reason,case when not m.is_active then 'model_inactive' when not coalesce(m.category_active,false) then 'category_inactive' else 'depleted' end) availability_reason,
            coalesce(nullif(c.public_name,''),m.name) public_name,
            coalesce(c.sale_price_override,c.own_sale_price_override,m.default_price,0) sale_price,
            c.built_at public_lot_built_at
          from models m
          left join candidates c on c.commercial_id=m.commercial_id and c.rn=1;

          create or replace view public.basket_current_lot_v1
          with (security_invoker=true) as
          select distinct on (a.basket_id)
            a.basket_id,a.lot_id,a.lot_code,a.quantity_built,a.public_available quantity_available,
            l.composition_hash,a.built_at,l.built_by,l.source,l.metadata,a.sale_price_override,
            a.short_code,l.component_sum_snapshot,l.hidden_adjustment_snapshot,a.public_name
          from public.basket_lot_public_availability_v1 a
          join public.basket_stock_lots l on l.id=a.lot_id
          where a.basket_id is not null and a.lot_kind='legacy_full' and a.public_available>0
          order by a.basket_id,a.built_at,a.created_at,a.lot_id;

          create or replace view public.basket_current_kit_lot_v2
          with (security_invoker=true) as
          select distinct on (a.kit_template_id)
            a.kit_template_id,a.lot_id,a.basket_id,a.lot_kind,a.short_code,a.lot_code,
            a.quantity_built,a.public_available quantity_available,l.composition_hash,a.built_at,l.built_by,
            l.duplicated_from_lot_id,l.source,l.metadata,a.sale_price_override,l.component_sum_snapshot,
            l.hidden_adjustment_snapshot,a.public_name,l.linked_hygiene_lot_id,a.business_type,a.linked_lot_id,
            l.own_sale_price_override,l.own_component_sum_snapshot,l.own_hidden_adjustment_snapshot,
            l.own_cost_sum_snapshot,l.cost_sum_snapshot
          from public.basket_lot_public_availability_v1 a
          join public.basket_stock_lots l on l.id=a.lot_id
          where a.kit_template_id is not null and a.public_available>0
          order by a.kit_template_id,a.built_at,a.created_at,a.lot_id;

          revoke all on public.basket_lot_public_availability_v1 from public,anon,authenticated;
          revoke all on public.basket_commercial_catalog_v1 from public,anon,authenticated;
          grant select on public.basket_lot_public_availability_v1 to service_role;
          grant select on public.basket_commercial_catalog_v1 to service_role;
          ''' )
          p.write_text(s)
          PY
          cp /tmp/basket_canonical.sql supabase/sql/20261004_basket_canonical_commerce_v1.sql
          cp /tmp/basket_canonical.sql supabase/migrations/20261004223000_basket_canonical_commerce_v1.sql
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/basket-kit-editor-ci.yml')
          s=p.read_text()
          if "20261004_basket_canonical_commerce_v1.sql" not in s:
              s=s.replace("      - 'supabase/sql/20261004_basket_link_draft_selection_v1.sql'", "      - 'supabase/sql/20261004_basket_link_draft_selection_v1.sql'\n      - 'supabase/sql/20261004_basket_canonical_commerce_v1.sql'\n      - 'supabase/migrations/20261004223000_basket_canonical_commerce_v1.sql'")
          if 'test-basket-canonical-commerce.mjs' not in s:
              anchor='      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-ops-rules.mjs\n'
              s=s.replace(anchor,anchor+'      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-commerce.mjs\n')
          p.write_text(s)
          PY
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-commerce.mjs
          git diff --check
      - name: Commit task 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/sql/20261004_basket_canonical_commerce_v1.sql supabase/migrations/20261004223000_basket_canonical_commerce_v1.sql scripts/test-basket-canonical-commerce.mjs .github/workflows/basket-kit-editor-ci.yml docs/superpowers/specs/2026-10-04-baskets-kits-simple-canonical-stock-design.md docs/superpowers/plans/2026-10-04-baskets-kits-simple-canonical-stock.md
          git commit -m 'feat: add canonical basket commerce availability'
          git push origin HEAD:feature/baskets-kits-canonical-20261004-exec
