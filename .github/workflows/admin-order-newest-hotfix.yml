name: Admin newest-first hotfix

on:
  push:
    paths:
      - '.github/workflows/admin-order-newest-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch latest admin safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p = Path('vitrine/admin/index.html')
          s = p.read_text(encoding='utf-8')
          old = "return at-bt;"
          new = "return bt-at;"
          count = s.count(old)
          if count != 1:
              if s.count(new) >= 1:
                  print('Newest-first ordering is already present.')
                  raise SystemExit(0)
              raise SystemExit(f'Expected exactly 1 oldest-first return, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- vitrine/admin/index.html; then
            exit 0
          fi
          git add vitrine/admin/index.html
          git commit -m 'fix: show newest orders first in admin'
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
