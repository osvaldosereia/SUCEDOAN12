name: Admin newest-first hotfix

on:
  push:
    paths:
      - '.github/workflows/admin-order-newest-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin order sorting
        shell: python
        run: |
          from pathlib import Path
          p = Path('vitrine/admin/index.html')
          s = p.read_text(encoding='utf-8')
          old = """function sortOperationalOrders(rows){
    return [...rows].sort((a,b)=>{
      const p=orderOperationalPriority(a)-orderOperationalPriority(b);
      if(p!==0)return p;
      const at=Date.parse(a?.created_at||0)||0,bt=Date.parse(b?.created_at||0)||0;
      return at-bt;
    });
  }"""
          new = """function sortOperationalOrders(rows){
    return [...rows].sort((a,b)=>{
      const p=orderOperationalPriority(a)-orderOperationalPriority(b);
      if(p!==0)return p;
      const at=Date.parse(a?.created_at||0)||0,bt=Date.parse(b?.created_at||0)||0;
      return bt-at;
    });
  }"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 sort block, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet -- vitrine/admin/index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix: show newest orders first in admin'
          git push
