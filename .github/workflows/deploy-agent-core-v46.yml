name: Deploy Agent Core V46

on:
  push:
    branches:
      - fix/agent-core-v45-order-context
    paths:
      - '.github/workflows/deploy-agent-core-v46.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-core-v45-order-context
      - name: Check Supabase deployment credential
        id: auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment credential is not configured; skipping deploy safely."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Supabase CLI
        if: steps.auth.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Agent Core V46
        if: steps.auth.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy dona-antonia-agent-core-v1 --project-ref ssbesxgaijknwsjbsbcz --no-verify-jwt
      - name: Deploy Eval V46
        if: steps.auth.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy dona-antonia-agent-eval-v1 --project-ref ssbesxgaijknwsjbsbcz --no-verify-jwt
      - name: Deployment result
        run: |
          if [ "${{ steps.auth.outputs.available }}" = "true" ]; then
            echo "V46 deployment attempted with repository credential."
          else
            echo "V46 was not deployed; repository has no SUPABASE_ACCESS_TOKEN."
          fi
