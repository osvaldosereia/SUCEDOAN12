name: One-shot orcamento lazy product search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-orcamento-lazy-product-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: RED - verify regression exists
        run: |
          if node scripts/test-orcamento-lazy-product-search.mjs; then
            echo 'Regression test unexpectedly passed before patch' >&2
            exit 1
          fi
      - name: Apply minimal lazy-search fix
        run: python3 scripts/patch-orcamento-lazy-product-search.py
      - name: GREEN - verify behavior and syntax
        run: node scripts/test-orcamento-lazy-product-search.mjs
      - name: Commit fix
        run: |
          git config user.name 'OSSJU'
          git config user.email 'Junior.sereia@hotmail.com'
          git add orcamento/app-original.html
          git diff --cached --check
          git commit -m 'perf(orcamento): buscar produtos sob demanda'
          git pull --rebase origin main
          git push origin main
