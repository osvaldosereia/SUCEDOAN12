name: Temp basket hygiene sale guard
on:
  push:
    branches: ['feat/basket-lot-ops-rules-20261003']
    paths:
      - 'scripts/patch-basket-hygiene-sale-guard.py'
      - '.github/workflows/_temp-basket-hygiene-sale-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/basket-lot-ops-rules-20261003
          fetch-depth: 1
      - run: python3 scripts/patch-basket-hygiene-sale-guard.py
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-ops-rules.mjs
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
          git commit -m 'fix: explain missing hygiene lot before sale activation'
          git push origin HEAD:feat/basket-lot-ops-rules-20261003
