name: Build WhatsApp Flow Images

on:
  workflow_dispatch:
  push:
    paths:
      - 'img/CESTA-*.webp'
      - 'img/cesta-basica-cuiaba-varzea-grande-economica.avif'
      - 'scripts/build-whatsapp-flow-images.py'
      - '.github/workflows/build-whatsapp-flow-images.yml'

permissions:
  contents: write

concurrency:
  group: build-whatsapp-flow-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codecs
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow pillow-avif-plugin
      - name: Build lightweight JPEG assets
        run: python scripts/build-whatsapp-flow-images.py
      - name: Commit generated assets
        run: |
          if git diff --quiet -- img/flow && git ls-files --error-unmatch img/flow/*.jpg >/dev/null 2>&1; then
            echo 'WhatsApp Flow images already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/flow/*.jpg
          git commit -m 'chore(flow): refresh lightweight JPEG assets'
          git push
