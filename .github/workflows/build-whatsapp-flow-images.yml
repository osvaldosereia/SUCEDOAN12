name: Sync WhatsApp Flow Images

on:
  workflow_dispatch:
  push:
    paths:
      - 'img/CESTA-*.webp'
      - 'img/cesta-basica-cuiaba-varzea-grande-economica.avif'
      - 'scripts/sync-whatsapp-flow-assets.py'
      - '.github/workflows/build-whatsapp-flow-images.yml'

permissions:
  contents: read

concurrency:
  group: sync-whatsapp-flow-images
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codecs
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow pillow-avif-plugin
      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Precompress and upload Flow media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync-whatsapp-flow-assets.py
