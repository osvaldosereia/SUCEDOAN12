name: Testar mídia de Minhas canecas V28

on:
  push:
    branches: [main]
    paths:
      - 'app-next/src/customer-mug-media-v28.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'scripts/test-customer-mug-media-v28.mjs'
      - '.github/workflows/test-customer-mug-media-v28.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-next/src/customer-mug-media-v28.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'scripts/test-customer-mug-media-v28.mjs'
      - '.github/workflows/test-customer-mug-media-v28.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-customer-mug-media-v28.mjs
