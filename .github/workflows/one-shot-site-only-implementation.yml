    function paintCheckout(){if(!state.cart.length){renderCart();return}sheetTitle.textContent='Seu pedido';const total=cartTotal(),missing=Math.max(0,MINIMUM_ORDER_CENTS-total),rows=state.cart.map((item,i)=>item.type==='basket'?checkoutBasketBlock(item,i):checkoutProductRow(item,i)).join(''),deliveryOptions='<option value="">Selecione a data</option>'+state.deliveryOptions.map(x=>'<option value="'+esc(x.date)+'" '+(state.checkoutDeliveryDate===x.date?'selected':'')+'>'+esc(x.label)+'</option>').join('');sheetBody.innerHTML='<div class="checkout-list">'+rows+'<div class="checkout-total"><span>Total</span><span id="checkoutTotal">'+money(total)+'</span></div></div><div class="rule-notice '+(missing>0?'warn':'')+'"><strong>Pedido mínimo: '+money(MINIMUM_ORDER_CENTS)+'</strong>'+(missing>0?'Faltam '+money(missing)+' para finalizar.':'Valor mínimo atingido.')+'</div><h3 class="checkout-title">Seu WhatsApp</h3><div class="wa-lookup"><div class="wa-grid"><label class="wa-field"><span>DDD</span><input id="checkoutDdd" inputmode="numeric" maxlength="2" value="'+esc(state.checkoutDdd)+'"></label><label class="wa-field"><span>WhatsApp</span><input id="checkoutPhone" inputmode="numeric" maxlength="9" value="'+esc(state.checkoutPhone)+'"></label><button class="wa-consult" type="button" id="lookupCustomer">Consultar cadastro</button></div><div class="wa-result" id="customerLookupResult">'+customerLookupResultHtml()+'</div></div>'+registrationSectionHtml()+'<h3 class="checkout-title">Data de entrega</h3><label class="wa-field"><span>Escolha uma das próximas datas disponíveis</span><select id="checkoutDeliveryDate" style="width:100%;height:46px;border:1px solid #d7dfd9;border-radius:9px;background:#fff;padding:0 9px">'+deliveryOptions+'</select></label><p class="note">Até 10:59, pode haver entrega no mesmo dia. A partir das 11h, começa no próximo dia de atendimento. Domingo e feriado não aparecem como opção.</p><h3 class="checkout-title">Como você vai pagar?</h3><div class="payments">'+pay('PIX','PIX')+pay('Dinheiro','Dinheiro')+pay('Cartão de crédito','Cartão de crédito')+pay('Cartão alimentação/refeição','Cartão alimentação/refeição')+'</div><p class="note">Pagamento na entrega. Nenhum dado de cartão é solicitado aqui.</p>';sheetAction.innerHTML='<div class="action-stack"><button class="secondary" type="button" id="addMoreCheckout">Adicionar mais produtos</button><button class="primary" type="button" id="sendWhats" disabled>Complete cadastro, entrega e pagamento</button></div>';sheetBody.querySelectorAll('[data-checkout-dec]').forEach(btn=>btn.onclick=()=>checkoutItemQty(Number(btn.dataset.checkoutDec),-1));sheetBody.querySelectorAll('[data-checkout-inc]').forEach(btn=>btn.onclick=()=>checkoutItemQty(Number(btn.dataset.checkoutInc),1));sheetBody.querySelectorAll('[data-checkout-component-dec]').forEach(btn=>btn.onclick=()=>checkoutComponentQty(btn.dataset.checkoutComponentDec,-1));sheetBody.querySelectorAll('[data-checkout-component-inc]').forEach(btn=>btn.onclick=()=>checkoutComponentQty(btn.dataset.checkoutComponentInc,1));const dddInput=$('#checkoutDdd'),phoneInput=$('#checkoutPhone');if(dddInput)dddInput.oninput=()=>{state.checkoutDdd=phoneDigits(dddInput.value,2);dddInput.value=state.checkoutDdd;resetCustomerLookup()};if(phoneInput)phoneInput.oninput=()=>{state.checkoutPhone=phoneDigits(phoneInput.value,9);phoneInput.value=state.checkoutPhone;resetCustomerLookup()};if($('#lookupCustomer'))$('#lookupCustomer').onclick=lookupCheckoutCustomer;if($('#confirmAddress'))$('#confirmAddress').onclick=()=>{state.addressConfirmed=true;$('#confirmAddress').textContent='Endereço confirmado ✓';updateCheckoutSubmitState()};if($('#editAddress'))$('#editAddress').onclick=()=>{state.editRegistration=true;state.addressConfirmed=false;paintCheckout()};if($('#saveCheckoutRegistration'))$('#saveCheckoutRegistration').onclick=saveCheckoutRegistration;const dateSelect=$('#checkoutDeliveryDate');if(dateSelect)dateSelect.onchange=()=>{state.checkoutDeliveryDate=dateSelect.value;updateCheckoutSubmitState()};updateCustomerLookupResult();if(state.whatsappPhone&&state.customerLookup.status==='idle'){const info=checkoutPhoneData();if(info.valid)setTimeout(()=>lookupCheckoutCustomer(),0)}sheetBody.querySelectorAll('input[name="payment"]').forEach(input=>{input.checked=input.value===state.checkoutPayment;input.onchange=()=>{state.checkoutPayment=input.value;updateCheckoutSubmitState()}});attachProductDetailHandlers(sheetBody);$('#addMoreCheckout').onclick=closeSheet;$('#sendWhats').onclick=sendWhatsApp;updateCheckoutSubmitState()}
