name: One-shot site-only checkout implementation

on:
  push:
    paths:
      - '.github/workflows/one-shot-site-only-implementation.yml'
      - 'scripts/patch-site-only-implementation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh main
        run: git pull --rebase origin main
      - name: Fix temporary patcher escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-site-only-implementation.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if line.startswith("s,n=re.subn(r'function delivery"):
                  lines[i]="s,n=re.subn(r'function delivery\\(\\)\\{.*?\\}\\n\\nfunction pub',(lambda _m: delivery+'\\n\\nfunction pub'),s,count=1,flags=re.S)"
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 scripts/patch-site-only-implementation.py
      - name: Verify contract
        run: node scripts/test-site-only-order-registration.mjs
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/storefront-v2/index.ts index.html vitrine/index.html
          git commit -m 'feat: require site registration and delivery date at checkout'
          git pull --rebase origin main
          git push origin HEAD:main
