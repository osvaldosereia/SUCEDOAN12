              send=r'''    async function sendWhatsApp(){const total=cartTotal();if(total<MINIMUM_ORDER_CENTS){toast('O pedido mínimo é '+money(MINIMUM_ORDER_CENTS)+'.');return}const selected=document.querySelector('input[name="payment"]:checked');if(!selected){toast('Escolha a forma de pagamento');return}if(!state.checkoutDeliveryDate){toast('Escolha a data de entrega');return}const info=checkoutPhoneData();if(!info.valid){toast('Informe seu WhatsApp');return}if(state.customerLookup.status!=='found'||state.customerLookup.customer?.registration_complete!==true||state.addressConfirmed!==true){toast('Confirme seu cadastro e endereço antes de finalizar');return}const handoffWindow=reserveWhatsAppHandoff(),btn=$('#sendWhats');if(btn){btn.disabled=true;btn.textContent='Registrando pedido…'}let saved=null;try{saved=await api('submit_order',{},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_method:selected.value,whatsapp_phone:info.full,delivery_date:state.checkoutDeliveryDate,items:state.cart.map(item=>({type:item.type,id:item.id,qty:Number(item.qty||1),lot_id:item.type==='basket'?(item.lot_id||null):null,split_mode:item.type==='basket'&&item.split_mode===true,food_lot_id:item.type==='basket'?(item.food_lot_id||null):null,hygiene_lot_id:item.type==='basket'?(item.hygiene_lot_id||null):null,components:item.type==='basket'?(item.components||[]):[]}))})})}catch(e){cancelWhatsAppHandoff(handoffWindow);if(btn){btn.disabled=false;btn.textContent='Enviar pedido para o WhatsApp'}if(e.message==='registration_required')toast('Seu cadastro precisa ser concluído antes do pedido.');else if(e.message==='invalid_delivery_date')toast('Essa data de entrega não está mais disponível. Escolha outra.');else if(['insufficient_stock','product_unavailable','basket_unavailable','basket_lot_unavailable','basket_lot_insufficient','basket_component_not_in_lot','basket_kit_lot_unavailable','basket_kit_lot_insufficient','basket_component_not_in_selected_kit'].includes(e.message))toast('O estoque mudou. Atualize a cesta e tente novamente.');else toast('Não consegui registrar. Tente novamente.');return}const customer=saved?.customer||state.customerLookup.customer||{},a=customer.address||{},date=orderDatePartsCuiaba(),lines=['PEDIDO DONA ANTONIA','Pedido: "'+date.long+'"',saved?.order_number?'NUMERO: '+String(saved.order_number).slice(-8):'','CLIENTE: CADASTRADO','NOME: '+(customer.display_name||state.checkoutName),'WHATSAPP: '+formatPhoneBr(info.full),'ENDERECO: '+[a.street,a.number,a.complement].filter(Boolean).join(', '),'BAIRRO: '+(a.neighborhood||a.district||''),'CIDADE: '+(a.city||''),'ENTREGA: '+(saved?.delivery?.label||state.checkoutDeliveryDate),''].filter(Boolean);const baskets=state.cart.filter(item=>item.type==='basket'&&Number(item.qty||0)>0);if(baskets.length){for(const item of baskets)lines.push('CESTA: '+formatQty(item.qty)+'x '+item.name)}else lines.push('CESTA: NENHUMA');lines.push('','PRODUTOS:');for(const item of state.cart){if(item.type==='product'&&Number(item.qty||0)>0)lines.push(formatQty(item.qty)+'x '+item.name);if(item.type==='basket'&&item.components?.length){for(const c of item.components){const qty=Number(c.quantity)*Number(item.qty||1);if(qty>0)lines.push(formatQty(qty)+'x '+c.name)}}}lines.push('','TOTAL: '+money(saved?.total_cents??cartTotal()),'PAGAMENTO: '+selected.value);if(saved?.delivery?.reason==='after_cutoff')lines.push('OBS: pedido realizado a partir das 11h de Cuiabá.');const url='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(lines.join('\n'));state.cart=[];state.addressConfirmed=false;state.checkoutDeliveryDate='';saveCart();paintCart();renderWhatsAppHandoffSuccess(url,saved);const handoffMode=completeWhatsAppHandoff(url,handoffWindow);if(handoffMode)toast('Pedido registrado. Abrindo WhatsApp…');else toast('Pedido registrado. Toque em “Abrir WhatsApp”.')}
