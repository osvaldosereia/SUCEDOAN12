name: One-shot site-only checkout implementation

on:
  push:
    paths:
      - '.github/workflows/one-shot-site-only-implementation.yml'
      - 'scripts/patch-site-only-implementation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh main
        run: git pull --rebase origin main
      - name: Apply patch
        run: python3 scripts/patch-site-only-implementation.py
      - name: Verify contract
        run: node scripts/test-site-only-order-registration.mjs
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/storefront-v2/index.ts index.html vitrine/index.html
          git commit -m 'feat: require site registration and delivery date at checkout'
          git pull --rebase origin main
          git push origin HEAD:main
