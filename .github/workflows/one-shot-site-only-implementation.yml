abel style="grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-size:12px"><input id="checkoutMarketing" type="checkbox" style="width:18px;height:18px" '+(c.marketing_opt_in?'checked':'')+'> Quero receber ofertas pelo WhatsApp.</label><button type="button" class="wa-consult" style="grid-column:1/-1" id="saveCheckoutRegistration">Salvar cadastro</button></div>'}
