name: CanecaFácil · compatibilidade mídia V16

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Firebase key de uma caneca'
        required: false
        default: ''
      force:
        description: 'Regerar horizontal quadrada'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Limite de canecas por execução'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: canecafacil-vitrine-compat-v16
  cancel-in-progress: false

jobs:
  compatibilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da branch de mídia
        uses: actions/checkout@v4
        with:
          ref: canecas-media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Sharp
        run: npm install --no-save sharp@0.34.3
      - name: Gerar nova mídia V16
        env:
          MODE: build
          RAW_BRANCH: canecas-media
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          CLEANUP_OLD: 'true'
          LIMIT: ${{ github.event.inputs.limit || '1' }}
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-midia-loja-integrada-v16.mjs
      - name: Publicar horizontal quadrada e remover recortes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A canecas/vitrine canecas/imagens/loja-integrada 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de mídia para publicar."
          else
            git commit -m "CanecaFácil V16: mídia de compatibilidade"
            git pull --rebase origin canecas-media
            git push origin HEAD:canecas-media
          fi
      - name: Aplicar Firebase V16
        env:
          MODE: apply
          RAW_BRANCH: canecas-media
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-midia-loja-integrada-v16.mjs
