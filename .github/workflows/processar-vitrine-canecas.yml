name: CanecaFácil · mídias da vitrine

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Firebase key de uma caneca (vazio = todas pendentes)'
        required: false
        default: ''
      force:
        description: 'Refazer mídias mesmo se já estiverem prontas'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Limite de canecas por execução (0 = sem limite)'
        required: false
        default: '0'
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [canecas-media]
    paths:
      - 'canecas/imagens/**'
      - 'scripts/processar-vitrine-canecas.mjs'
      - 'scripts/processar-animacao-canecas.mjs'
      - '.github/workflows/processar-vitrine-canecas.yml'

permissions:
  contents: write

concurrency:
  group: canecafacil-vitrine-media
  cancel-in-progress: false

jobs:
  midias:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout da branch de mídia
        uses: actions/checkout@v4
        with:
          ref: canecas-media
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Sharp
        run: npm install --no-save sharp@0.34.3

      - name: Garantir FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Gerar somente os recortes pendentes
        env:
          MODE: build
          RAW_BRANCH: canecas-media
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-vitrine-canecas.mjs

      - name: Gerar somente as animações pendentes
        env:
          MODE: build
          RAW_BRANCH: canecas-media
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-animacao-canecas.mjs

      - name: Publicar mídias geradas
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canecas/vitrine
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma mídia nova para publicar."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "CanecaFácil: gera mídias da vitrine"
            git pull --rebase origin canecas-media
            git push origin HEAD:canecas-media
          fi

      - name: Confirmar recortes no Firebase após publicação
        env:
          MODE: apply
          RAW_BRANCH: canecas-media
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-vitrine-canecas.mjs

      - name: Confirmar animações no Firebase após publicação
        env:
          MODE: apply
          RAW_BRANCH: canecas-media
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-animacao-canecas.mjs

      - name: Resumo
        if: always()
        run: |
          echo "## CanecaFácil · mídias da vitrine" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch de mídia: canecas-media" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recortes: Sharp" >> "$GITHUB_STEP_SUMMARY"
          echo "- Animação: WebM VP9 · 640x640 · 5 s · 18 fps" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase confirmado somente após o push dos arquivos" >> "$GITHUB_STEP_SUMMARY"
