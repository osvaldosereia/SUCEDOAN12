name: Testar templates públicos de canecas

on:
  push:
    branches: [main]
    paths:
      - 'producao-v2/js/mug-public-template-admin-v1.js'
      - 'producao-v2/admin-produtivo.html'
      - 'producao/index.html'
      - 'app-next/src/mug-public-personalization.js'
      - 'app-next/src/config.js'
      - '.github/workflows/test-mug-public-templates.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check producao-v2/js/mug-public-template-admin-v1.js
          node --check app-next/src/mug-public-personalization.js
          node --check app-next/src/config.js
      - name: Validar regras dos templates
        shell: bash
        run: |
          set -euo pipefail
          ADMIN='producao-v2/js/mug-public-template-admin-v1.js'
          SITE='app-next/src/mug-public-personalization.js'
          grep -q "canecas/modelos_privados" "$ADMIN"
          grep -q "personalizacao_config_publica" "$ADMIN"
          grep -q "const publicCfg=" "$ADMIN"
          grep -q "const privatePayload=" "$ADMIN"
          grep -q "campos:fields.filter(f=>f.publico).map(publicField)" "$ADMIN"
          grep -q "campos:fields.map(f=>({id:f.id,instrucao_ia:f.instrucao_ia}))" "$ADMIN"
          grep -q "modelo_publico" "$SITE"
          grep -q "personalizacao_publica" "$SITE"
          grep -q "personalize_mug_model" "$SITE"
          grep -q "generate_mug_art" "$SITE"
          grep -q "situacao:'I'" "$SITE"
          grep -q "ativo:false" "$SITE"
          grep -q "modelo_publico:false" "$SITE"
          grep -q "mugPublicWhatsapp" "$SITE"
          grep -q "mug-public-personalization.js" app-next/src/config.js
