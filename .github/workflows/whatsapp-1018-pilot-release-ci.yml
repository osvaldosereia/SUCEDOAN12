name: WhatsApp 1018 Pilot Release CI

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261013_whatsapp_1018_pilot_release_v1.sql'
      - 'supabase/sql/20261013_whatsapp_1018_pilot_release_v1.sql'
      - 'supabase/functions/whatsapp-ana-worker-v1/**'
      - 'scripts/test-whatsapp-1018-pilot-release-v1.mjs'
      - 'scripts/test-whatsapp-1018-pilot-fixture-v1.mjs'
      - 'scripts/test-whatsapp-1018-simulator-v1.mjs'
      - 'scripts/build-whatsapp-1018-simulator-standalone-v1.mjs'
      - 'scripts/test-whatsapp-1018-simulator-standalone-v1.mjs'
      - 'scripts/audit-whatsapp-1018-pilot-readiness-v1.mjs'
      - 'scripts/test-whatsapp-1018-meta-flow-draft-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-intent-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-flow-intent-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-meta-flow-completion-v1.mjs'
      - 'scripts/test-whatsapp-1018-meta-flow-completion-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-meta-flow-webhook-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-webhook-v1.mjs'
      - 'scripts/test-whatsapp-1018-webhook-wiring-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-flow-outbound-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-outbound-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-flow-send-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-send-v1.mjs'
      - 'supabase/functions/whatsapp-meta-webhook-v1/index.ts'
      - 'supabase/functions/_shared/whatsapp-core-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-flow-session-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-session-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-session-schema-v1.mjs'
      - 'supabase/migrations/20261013_whatsapp_1018_flow_sessions_v1.sql'
      - 'supabase/sql/20261013_whatsapp_1018_flow_sessions_v1.sql'
      - 'docs/whatsapp-1018-simulator/**'
      - 'scripts/fixtures/whatsapp-1018-flow-postgres-setup-v1.sql'
      - 'scripts/fixtures/whatsapp-1018-flow-postgres-test-v1.sql'
      - 'scripts/fixtures/whatsapp-1018-pilot-postgres-test-v1.sql'
      - 'scripts/fixtures/whatsapp-1018-outbox-postgres-test-v1.sql'
      - 'supabase/migrations/20261013_whatsapp_1018_flow_outbox_v1.sql'
      - 'supabase/migrations/20261014_whatsapp_1018_flow_reconciliation_v1.sql'
      - 'scripts/fixtures/whatsapp-1018-reconciliation-postgres-test-v1.sql'
      - 'supabase/functions/_shared/ana-1018-pilot-fixture-v1.mjs'
      - '.github/workflows/whatsapp-1018-pilot-release-ci.yml'
  push:
    branches:
      - 'agent/whatsapp-1018-reversible-pilot-20261013'
  workflow_dispatch:

jobs:
  verify-pilot-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pilot isolation and rollback contracts
        run: node scripts/test-whatsapp-1018-pilot-release-v1.mjs
      - name: Synthetic 1018 pilot conversations
        run: node scripts/test-whatsapp-1018-pilot-fixture-v1.mjs
      - name: Offline mobile simulator contract
        run: node scripts/test-whatsapp-1018-simulator-v1.mjs
      - name: Build offline mobile simulator
        run: node scripts/build-whatsapp-1018-simulator-standalone-v1.mjs
      - name: Validate standalone mobile simulator
        run: node scripts/test-whatsapp-1018-simulator-standalone-v1.mjs
      - name: Audit pilot release guards and hidden basket data
        run: node scripts/audit-whatsapp-1018-pilot-readiness-v1.mjs
      - name: Upload standalone mobile simulator
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-1018-simulador-offline
          path: |
            dist/whatsapp-1018-simulator/index.html
            dist/whatsapp-1018-simulator/readiness.json
          retention-days: 14
      - name: Draft Meta Flow contract
        run: node scripts/test-whatsapp-1018-meta-flow-draft-v1.mjs
      - name: Verified Flow intent classifier
        run: node scripts/test-whatsapp-1018-flow-intent-v1.mjs
      - name: Canonical signed Flow completion adapter
        run: node scripts/test-whatsapp-1018-meta-flow-completion-v1.mjs
      - name: Flow session replay and expiry guard
        run: node scripts/test-whatsapp-1018-flow-session-v1.mjs
      - name: Flow session SQL contract
        run: node scripts/test-whatsapp-1018-flow-session-schema-v1.mjs
      - name: Isolated webhook pilot and redaction guards
        run: node scripts/test-whatsapp-1018-flow-webhook-v1.mjs
      - name: Outbound draft and signed inbound token roundtrip
        run: node scripts/test-whatsapp-1018-flow-outbound-v1.mjs
      - name: Signed Meta webhook wiring contract
        run: node scripts/test-whatsapp-1018-webhook-wiring-v1.mjs
      - name: Outbound WAMID session registration contract
        run: node scripts/test-whatsapp-1018-flow-send-v1.mjs
      - name: ANA admin worker contracts
        run: node scripts/test-whatsapp-ana-admin-worker-v1.mjs
      - name: ANA live release contracts
        run: node scripts/test-whatsapp-ana-live-release-v1.mjs

  verify-flow-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flow1018
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flow1018"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: flow1018
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client exists
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Prepare isolated 1018 test schema
        run: psql -v ON_ERROR_STOP=1 -f scripts/fixtures/whatsapp-1018-flow-postgres-setup-v1.sql
      - name: Apply 1018 pilot release migration in disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013_whatsapp_1018_pilot_release_v1.sql
      - name: Test staged pilot, rollback and 0975 isolation
        run: psql -v ON_ERROR_STOP=1 -f scripts/fixtures/whatsapp-1018-pilot-postgres-test-v1.sql
      - name: Apply 1018 sessions migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013_whatsapp_1018_flow_sessions_v1.sql
      - name: Test atomic consume, replay, security and rollback
        run: psql -v ON_ERROR_STOP=1 -f scripts/fixtures/whatsapp-1018-flow-postgres-test-v1.sql
      - name: Apply pre-send outbox migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013_whatsapp_1018_flow_outbox_v1.sql
      - name: Test outbox, WAMID finalization and rollback
        run: psql -v ON_ERROR_STOP=1 -f scripts/fixtures/whatsapp-1018-outbox-postgres-test-v1.sql
      - name: Apply 1018 reconciliation queue migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014_whatsapp_1018_flow_reconciliation_v1.sql
      - name: Test 1018 reconciliation queue security and privacy
        run: psql -v ON_ERROR_STOP=1 -f scripts/fixtures/whatsapp-1018-reconciliation-postgres-test-v1.sql
