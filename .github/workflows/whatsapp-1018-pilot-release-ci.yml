name: WhatsApp 1018 Pilot Release CI

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261013_whatsapp_1018_pilot_release_v1.sql'
      - 'supabase/sql/20261013_whatsapp_1018_pilot_release_v1.sql'
      - 'supabase/functions/whatsapp-ana-worker-v1/**'
      - 'scripts/test-whatsapp-1018-pilot-release-v1.mjs'
      - 'scripts/test-whatsapp-1018-pilot-fixture-v1.mjs'
      - 'scripts/test-whatsapp-1018-simulator-v1.mjs'
      - 'scripts/test-whatsapp-1018-meta-flow-draft-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-intent-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-flow-intent-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-meta-flow-completion-v1.mjs'
      - 'scripts/test-whatsapp-1018-meta-flow-completion-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-meta-flow-webhook-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-webhook-v1.mjs'
      - 'supabase/functions/whatsapp-meta-webhook-v1/index.ts'
      - 'supabase/functions/_shared/whatsapp-core-v1.mjs'
      - 'supabase/functions/_shared/ana-1018-flow-session-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-session-v1.mjs'
      - 'scripts/test-whatsapp-1018-flow-session-schema-v1.mjs'
      - 'supabase/migrations/20261013_whatsapp_1018_flow_sessions_v1.sql'
      - 'supabase/sql/20261013_whatsapp_1018_flow_sessions_v1.sql'
      - 'docs/whatsapp-1018-simulator/**'
      - 'supabase/functions/_shared/ana-1018-pilot-fixture-v1.mjs'
      - '.github/workflows/whatsapp-1018-pilot-release-ci.yml'
  push:
    branches:
      - 'agent/whatsapp-1018-reversible-pilot-20261013'
  workflow_dispatch:

jobs:
  verify-pilot-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pilot isolation and rollback contracts
        run: node scripts/test-whatsapp-1018-pilot-release-v1.mjs
      - name: Synthetic 1018 pilot conversations
        run: node scripts/test-whatsapp-1018-pilot-fixture-v1.mjs
      - name: Offline mobile simulator contract
        run: node scripts/test-whatsapp-1018-simulator-v1.mjs
      - name: Draft Meta Flow contract
        run: node scripts/test-whatsapp-1018-meta-flow-draft-v1.mjs
      - name: Verified Flow intent classifier
        run: node scripts/test-whatsapp-1018-flow-intent-v1.mjs
      - name: Canonical signed Flow completion adapter
        run: node scripts/test-whatsapp-1018-meta-flow-completion-v1.mjs
      - name: Flow session replay and expiry guard
        run: node scripts/test-whatsapp-1018-flow-session-v1.mjs
      - name: Flow session SQL contract
        run: node scripts/test-whatsapp-1018-flow-session-schema-v1.mjs
      - name: Isolated webhook pilot and redaction guards
        run: node scripts/test-whatsapp-1018-flow-webhook-v1.mjs
      - name: ANA admin worker contracts
        run: node scripts/test-whatsapp-ana-admin-worker-v1.mjs
      - name: ANA live release contracts
        run: node scripts/test-whatsapp-ana-live-release-v1.mjs
