name: One-time admin stock display fix

on:
  push:
    paths:
      - '.github/workflows/one-time-admin-stock-display-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch physical versus sellable stock contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/admin-products-live-v1/index.ts')
          s = path.read_text()

          replacements = [
              (
                  '.select("product_id,effective_sellable_stock,basket_locked_quantity,loose_sellable_stock,bling_stock_ready")',
                  '.select("product_id,sellable_physical,effective_sellable_stock,basket_locked_quantity,loose_sellable_stock,bling_stock_ready")'
              ),
              (
                  'effective_stock:Math.max(0,Number(x.effective_sellable_stock||0)),\n      basket_locked:',
                  'physical_stock:Math.max(0,Number(x.sellable_physical??x.effective_sellable_stock??0)),\n      effective_stock:Math.max(0,Number(x.effective_sellable_stock||0)),\n      basket_locked:'
              ),
              (
                  'const total=Number(p.stock||0),locked=Math.max(0,Number(s.basket_locked||0)),loose=Math.max(0,Number(s.loose_stock??total));',
                  'const sellable=Number(p.stock||0),physical=Math.max(0,Number(s.physical_stock??sellable)),locked=Math.max(0,Number(s.basket_locked||0)),loose=Math.max(0,physical-locked),sellableLoose=Math.max(0,Number(s.loose_stock??sellable));'
              ),
              (
                  'stock_quantity:total,physical_stock_quantity:total,loose_stock_quantity:loose,basket_locked_quantity:locked,',
                  'stock_quantity:physical,physical_stock_quantity:physical,sellable_stock_quantity:sellable,virtual_stock_quantity:sellable,loose_stock_quantity:loose,sellable_loose_stock_quantity:sellableLoose,basket_locked_quantity:locked,'
              ),
              (
                  'stock_breakdown_warning:locked>total+0.0001,stock_breakdown_difference:Math.max(0,locked-total),',
                  'stock_breakdown_warning:locked>physical+0.0001,stock_breakdown_difference:Math.max(0,locked-physical),'
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]}')
              s = s.replace(old, new, 1)

          path.write_text(s)
          PY

          cat > scripts/test-admin-products-stock-display.mjs <<'EOF'
          import fs from 'node:fs';

          const edge = fs.readFileSync('supabase/functions/admin-products-live-v1/index.ts', 'utf8');
          const checks = [
            ['reads physical Bling stock separately', edge.includes('product_id,sellable_physical,effective_sellable_stock')],
            ['maps physical stock separately', edge.includes('physical_stock:Math.max(0,Number(x.sellable_physical??x.effective_sellable_stock??0))')],
            ['Admin stock quantity is physical', edge.includes('stock_quantity:physical,physical_stock_quantity:physical')],
            ['sellable/virtual stock remains available', edge.includes('sellable_stock_quantity:sellable,virtual_stock_quantity:sellable')],
            ['loose physical breakdown subtracts basket stock', edge.includes('loose=Math.max(0,physical-locked)')],
            ['breakdown warning compares against physical', edge.includes('stock_breakdown_warning:locked>physical+0.0001')),
            ['old virtual-as-physical mapping is gone', !edge.includes('stock_quantity:total,physical_stock_quantity:total')],
          ];

          let failed = 0;
          for (const [name, ok] of checks) {
            console.log(`${ok ? 'PASS' : 'FAIL'} ${name}`);
            if (!ok) failed += 1;
          }
          if (failed) process.exit(1);
          EOF

          node scripts/test-admin-products-stock-display.mjs

      - name: Commit tested fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-admin-stock-display-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-products-live-v1/index.ts scripts/test-admin-products-stock-display.mjs .github/workflows/one-time-admin-stock-display-fix.yml
          git commit -m "fix(admin): show physical Bling stock separately"
          git push origin HEAD:main
