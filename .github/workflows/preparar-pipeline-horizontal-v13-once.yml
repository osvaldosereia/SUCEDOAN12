name: Preparar pipeline horizontal V13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparar-pipeline-horizontal-v13-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar arquivos V13
        run: node scripts/preparar-pipeline-horizontal-v13-once.mjs
      - name: Validar JavaScript
        run: |
          node --check loja-integrada/personalizar/app-v13.js
          node --check scripts/processar-vitrine-canecas-v13.mjs
      - name: Publicar arquivos preparados
        run: |
          rm -f scripts/preparar-pipeline-horizontal-v13-once.mjs
          rm -f .github/workflows/preparar-pipeline-horizontal-v13-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loja-integrada/personalizar/app-v13.js scripts/processar-vitrine-canecas-v13.mjs scripts/preparar-pipeline-horizontal-v13-once.mjs .github/workflows/preparar-pipeline-horizontal-v13-once.yml
          git commit -m "Prepara personalizador V13 horizontal com dois recortes"
          git pull --rebase origin main
          git push origin main
