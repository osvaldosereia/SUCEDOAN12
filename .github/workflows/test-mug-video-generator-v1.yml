name: Testar vídeo 5s das canecas

on:
  pull_request:
    paths:
      - 'producao-v2/js/mug-video-generator-v1.js'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
      - 'scripts/test-mug-video-generator-v1.mjs'
      - '.github/workflows/test-mug-video-generator-v1.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar botão e contrato de vídeo
        run: node scripts/test-mug-video-generator-v1.mjs
