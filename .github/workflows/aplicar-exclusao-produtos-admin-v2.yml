name: Aplicar exclusão de produtos no Admin V2

on:
  push:
    paths:
      - 'scripts/patch-admin-delete-products-v1.mjs'
      - '.github/workflows/aplicar-exclusao-produtos-admin-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteração
        run: node scripts/patch-admin-delete-products-v1.mjs
      - name: Validar JavaScript
        run: |
          node --check producao-v2/js/app.js
          node --check producao-v2/js/modules/products.js
      - name: Confirmar elementos
        run: |
          grep -q 'id="deleteProductButton"' producao-v2/index.html
          grep -q 'data-delete-product' producao-v2/js/modules/products.js
          grep -q 'archiveProduct' producao-v2/js/app.js
      - name: Publicar alteração
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add producao-v2/js/app.js producao-v2/js/modules/products.js producao-v2/index.html producao-v2/assets/admin.css producao-v2/admin-produtivo.html
          git commit -m 'Permite excluir produtos pela lista e pelo cadastro no Admin V2'
          git push

