name: One-shot admin stock review detail

on:
  push:
    branches:
      - fix/admin-stock-review-detail

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin
            scripts/patch-admin-stock-review-detail.py
            scripts/test-admin-stock-review-detail.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RED - prove current admin misses the explicit stock review contract
        run: |
          if python scripts/test-admin-stock-review-detail.py; then
            echo 'The regression test unexpectedly passed before the patch.'
            exit 1
          else
            echo 'RED reproduced as expected.'
          fi
      - name: Apply focused Admin patch
        run: python scripts/patch-admin-stock-review-detail.py
      - name: GREEN - verify explicit stock review contract
        run: python scripts/test-admin-stock-review-detail.py
      - name: Basic HTML JavaScript syntax guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          js='\n'.join(blocks)
          p=Path('/tmp/admin-inline.js'); p.write_text(js,encoding='utf-8')
          subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Diff check
        run: git diff --check
      - name: Commit patched Admin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix(admin): show exact stock shortages in order review'
          git push
