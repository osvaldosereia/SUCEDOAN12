name: XML Catalog R25 Fiscal Read Only
on:
  pull_request:
    branches: [main,agent/xml-catalog-field-approval-r24-20261009]
    paths:
      - 'supabase/functions/**/purchase-xml-v1/**'
      - 'supabase/functions/purchase-xml-v1/**'
      - 'scripts/test-xml-catalog-fiscal-dossier-r25.mjs'
      - 'scripts/test-xml-migration-reconciliation-r25.mjs'
      - 'supabase/migrations/*separation_ready_reservation_idempotence*.sql'
      - '.github/workflows/xml-catalog-fiscal-r25.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fiscal-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fiscal dossier, source evidence only, checksum and migration conflicts
        run: |
          set -eu
          node scripts/test-xml-catalog-fiscal-dossier-r25.mjs
          node scripts/test-xml-migration-reconciliation-r25.mjs
          node scripts/test-xml-catalog-comparison-v3.mjs
          node scripts/test-xml-catalog-full-history-r20.mjs
          node scripts/test-xml-field-approval-gateway-r24.mjs
          node scripts/test-separation-ready-reservation-idempotence.mjs
  deno-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify XML endpoints and real parser regression
        run: |
          set -eu
          deno check supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts
          deno run --allow-read scripts/test-xml-catalog-protocol-integrity-v6.mjs
  database-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: R24 migrations in disposable PostgreSQL only
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          sed 's#docs/projects/purchase-xml-field-approval-release-candidate-r24.sql#supabase/migrations/20261009155445_purchase_xml_field_approval_r24.sql#' scripts/test-xml-field-approval-r24.pg.sql >/tmp/xml-r25-postgres.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/xml-r25-postgres.sql
