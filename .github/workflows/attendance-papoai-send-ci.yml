name: attendance-papoai-send-ci

on:
  push:
    branches:
      - 'feat/attendance-papoai-webhook-send'
  pull_request:
    paths:
      - 'scripts/test-admin-attendance-papoai-webhook-send-v1.mjs'
      - 'scripts/test-admin-attendance-send-ui-v1.mjs'
      - 'scripts/test-admin-attendance-ui-v1.mjs'
      - 'scripts/test-admin-attendance-layout-v3.mjs'
      - 'scripts/test-admin-attendance-unified-bridge-v3.mjs'
      - 'scripts/test-admin-attendance-unsupported-display-v1.mjs'
      - 'supabase/functions/admin-whatsapp-ops-v1/index.ts'
      - 'supabase/sql/20261002_admin_attendance_papoai_webhook_send_v1.sql'
      - 'supabase/sql/20261003_admin_attendance_unsupported_display_v1.sql'
      - 'vitrine/admin/atendimento/**'
      - '.github/workflows/attendance-papoai-send-ci.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-attendance-papoai-webhook-send-v1.mjs
      - run: node scripts/test-admin-attendance-send-ui-v1.mjs
      - run: node scripts/test-admin-attendance-api-v1.mjs
      - run: node scripts/test-admin-attendance-ui-v1.mjs
      - run: node scripts/test-admin-attendance-layout-v3.mjs
      - run: node scripts/test-admin-attendance-unified-bridge-v3.mjs
      - run: node scripts/test-admin-attendance-unsupported-display-v1.mjs
      - run: node --check vitrine/admin/atendimento/attendance.js
      - run: node --check vitrine/admin/atendimento/attendance-send.js
      - run: node --check vitrine/admin/atendimento/attendance-layout-v3.js
      - run: node --check vitrine/admin/atendimento/attendance-layout-v3-bridge.js
