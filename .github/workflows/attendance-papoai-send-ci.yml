name: attendance-papoai-send-ci

on:
  push:
    branches:
      - 'feat/attendance-papoai-webhook-send'
  pull_request:
    paths:
      - 'scripts/test-admin-attendance-*.mjs'
      - 'vitrine/admin/index.html'
      - 'vitrine/admin/atendimento/**'
      - 'supabase/functions/admin-whatsapp-ops-v1/index.ts'
      - 'supabase/migrations/**'
      - 'supabase/sql/20261002_admin_attendance_papoai_webhook_send_v1.sql'
      - 'supabase/sql/20261003_admin_attendance_unsupported_display_v1.sql'
      - '.github/workflows/attendance-papoai-send-ci.yml'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-filter-menu-3days-20261003
      - name: Apply filter/menu implementation for validation
        run: python3 scripts/patch-admin-attendance-filter-menu-v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-attendance-papoai-webhook-send-v1.mjs
      - run: node scripts/test-admin-attendance-send-ui-v1.mjs
      - run: node scripts/test-admin-attendance-api-v1.mjs
      - run: node scripts/test-admin-attendance-ui-v1.mjs
      - run: node scripts/test-admin-attendance-native-v1.mjs
      - run: node scripts/test-admin-attendance-scroll-layout-v1.mjs
      - run: node scripts/test-admin-attendance-viewport-fit-v1.mjs
      - run: node scripts/test-admin-attendance-filter-menu-v1.mjs
      - run: node scripts/test-admin-attendance-native-channel-v1.mjs
      - run: node scripts/test-admin-attendance-organization-api-v1.mjs
      - run: node scripts/test-admin-attendance-unsupported-display-v1.mjs
      - run: node --check vitrine/admin/atendimento/attendance-app.js
      - run: node --check vitrine/admin/atendimento/attendance-send.js
      - run: node --check vitrine/admin/atendimento/attendance-media-send.js
      - run: node --check vitrine/admin/atendimento/attendance-templates.js
      - run: node --check vitrine/admin/atendimento/attendance-human-ai.js
      - run: node --check vitrine/admin/atendimento/attendance-ana-preview.js
      - run: git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/atendimento/index.html vitrine/admin/atendimento/attendance-app.js vitrine/admin/atendimento/attendance.css supabase/functions/admin-whatsapp-ops-v1/index.ts scripts/test-admin-attendance-organization-api-v1.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: unificar filtros recentes pedidos cadastro e etiquetas'
          git push origin HEAD:feat/attendance-filter-menu-3days-20261003
