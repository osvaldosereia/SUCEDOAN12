name: XML Catalog R23 Main Integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**/purchase-xml-v1/**'
      - 'supabase/functions/purchase-xml-v1/**'
      - 'supabase/functions/admin-service-intelligence-v1/index.ts'
      - 'vitrine/admin/index.html'
      - 'docs/projects/purchase-xml-*.sql'
      - 'scripts/test-xml-main-integration-r23.mjs'
      - 'scripts/test-xml-*.mjs'
      - 'scripts/test-xml-catalog-identity-production-schema-r22.pg.sql'
      - '.github/workflows/xml-catalog-main-integration-r23.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve parent Admin and run complete XML regression
        run: |
          set -eu
          node scripts/test-xml-main-integration-r23.mjs
          node scripts/test-bling-order-item-code-idempotence.mjs
          node scripts/test-xml-catalog-consolidation-r18.mjs
          node scripts/test-xml-catalog-comparison-v3.mjs
          node scripts/test-xml-catalog-history-pagination-v3.mjs
          node scripts/test-xml-catalog-full-history-r20.mjs
          node scripts/test-xml-catalog-details-v2.mjs
          node scripts/test-xml-catalog-ingest-audit-v5.mjs
          node scripts/test-xml-field-review-gateway-r15.mjs
          node scripts/test-xml-field-review-admin-r15.mjs
          node scripts/test-xml-identity-gateway-r21.mjs
          node scripts/test-xml-release-gates-r22.mjs
  deno-real-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check both full XML APIs and run real XML parser
        run: |
          set -eu
          deno check supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts
          deno run --allow-read scripts/test-xml-catalog-protocol-integrity-v6.mjs
          deno run --allow-read scripts/test-xml-ingest-integrity-r19.mjs
  cli-migration-disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Use Supabase CLI to create canonical migration (test workspace only)
        run: |
          set -eu
          supabase migration new --help
          supabase migration new purchase_xml_identity_atomic_r23
          migration_file="$(find supabase/migrations -maxdepth 1 -name '*_purchase_xml_identity_atomic_r23.sql' | sort | tail -1)"
          test -n "$migration_file"
          cp docs/projects/purchase-xml-identity-release-candidate-r22.sql "$migration_file"
          echo "R23_GENERATED_MIGRATION=$migration_file"
          sha256sum "$migration_file"
          test ! -e supabase/migrations/20261009085000_purchase_xml_ingest_error_audit_v5.sql
      - name: Apply generated migration to disposable PostgreSQL with real lot trigger
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          migration_file="$(find supabase/migrations -maxdepth 1 -name '*_purchase_xml_identity_atomic_r23.sql' | sort | tail -1)"
          sed "s#docs/projects/purchase-xml-identity-release-candidate-r22.sql#$migration_file#" scripts/test-xml-catalog-identity-production-schema-r22.pg.sql >/tmp/xml-r23-postgres-integration.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/xml-r23-postgres-integration.sql
