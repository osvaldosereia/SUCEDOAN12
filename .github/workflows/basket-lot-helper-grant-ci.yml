name: Basket lot helper grant CI

on:
  pull_request:
    paths:
      - ".github/workflows/basket-lot-helper-grant-ci.yml"
      - "scripts/test-basket-lot-helper-grant.mjs"
      - "supabase/migrations/20261022205909_basket_lot_helper_direct_execute_revoke.sql"
      - "docs/projects/dona-antonia-operations-2/HANDOFF.md"
      - "docs/projects/dona-antonia-operations-2/IMPLEMENTATION-ROADMAP.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/basket-lot-helper-grant-ci.yml"
      - "scripts/test-basket-lot-helper-grant.mjs"
      - "supabase/migrations/20261022205909_basket_lot_helper_direct_execute_revoke.sql"
      - "docs/projects/dona-antonia-operations-2/HANDOFF.md"
      - "docs/projects/dona-antonia-operations-2/IMPLEMENTATION-ROADMAP.md"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check exact helper grant and rollback scope
        run: node scripts/test-basket-lot-helper-grant.mjs
