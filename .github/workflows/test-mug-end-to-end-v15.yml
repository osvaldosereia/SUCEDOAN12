name: Testar canecas CLEAN V16

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/src/mug-public-personalization-v5.js'
      - 'app-next/src/image-performance.js'
      - 'app-next/src/catalog.js'
      - 'app-next/src/config.js'
      - 'ceneca10/app-v4-clean.js'
      - 'ceneca10/index.html'
      - 'ceneca10/gallery-v4.js'
      - 'ceneca10/gallery-refresh-v5.js'
      - 'producao-v2/admin-produtivo.html'
      - 'producao-v2/js/mug-personalizer-v15-clean.js'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
      - 'producao/catalog-sync-admin.js'
      - 'scripts/sincronizar-produtos-home-firebase.mjs'
      - 'scripts/estabilizar-catalogo-publico.mjs'
      - 'scripts/filtrar-produtos-home-publicos.mjs'
      - 'scripts/test-mug-end-to-end-v15.mjs'
      - '.github/workflows/test-mug-end-to-end-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mug-clean-v16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar stack única de canecas
        run: node scripts/test-mug-end-to-end-v15.mjs
