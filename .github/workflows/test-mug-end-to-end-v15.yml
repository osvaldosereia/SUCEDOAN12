name: Testar canecas · 2 mockups + arte + Shorts

on:
  push:
    branches: [main]
    paths:
      - 'app-next/**'
      - 'shared/**'
      - 'caneca10/**'
      - 'caneca-print/**'
      - 'producao-v2/**'
      - 'scripts/test-mug-end-to-end-v15.mjs'
      - '.github/workflows/test-mug-end-to-end-v15.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-next/**'
      - 'shared/**'
      - 'caneca10/**'
      - 'caneca-print/**'
      - 'producao-v2/**'
      - 'scripts/test-mug-end-to-end-v15.mjs'
      - '.github/workflows/test-mug-end-to-end-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mug-2mockups-shorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar stack ponta a ponta atual
        run: node scripts/test-mug-end-to-end-v15.mjs
