name: Testar canecas · 2 mockups + arte + Shorts

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-personalization-v7.js'
      - 'app-next/src/mug-public-personalization-contract-v25.js'
      - 'app-next/src/product-media.js'
      - 'app-next/src/mug-public-thumbnails-v2.js'
      - 'app-next/src/image-performance.js'
      - 'app-next/src/catalog.js'
      - 'app-next/src/config.js'
      - 'caneca10/app-v5-2mockups.js'
      - 'caneca10/index.html'
      - 'caneca10/resultado.html'
      - 'caneca10/gallery-v4.js'
      - 'caneca10/art-recovery-v1.js'
      - 'caneca-print/index.html'
      - 'shared/mug-make-fast-ack-v1.js'
      - 'producao-v2/admin-produtivo.html'
      - 'producao-v2/js/mug-personalizer-v16-2mockups.js'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
      - 'scripts/sincronizar-produtos-home-firebase.mjs'
      - 'scripts/estabilizar-catalogo-publico.mjs'
      - 'scripts/filtrar-produtos-home-publicos.mjs'
      - 'scripts/test-mug-end-to-end-v15.mjs'
      - '.github/workflows/test-mug-end-to-end-v15.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-personalization-v7.js'
      - 'app-next/src/product-media.js'
      - 'caneca10/resultado.html'
      - 'producao-v2/js/mug-personalizer-v16-2mockups.js'
      - 'scripts/test-mug-end-to-end-v15.mjs'
      - '.github/workflows/test-mug-end-to-end-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mug-2mockups-shorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar stack ponta a ponta atual
        run: node scripts/test-mug-end-to-end-v15.mjs
