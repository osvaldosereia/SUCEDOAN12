name: One-shot checkout optional fields 2026-10-01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-checkout-optional-customer-edit-20261001.yml'
      - '.github/scripts/checkout_optional_patch_20261001.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic patch
        run: python .github/scripts/checkout_optional_patch_20261001.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/storefront-v2/index.ts vitrine/index.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: allow checkout with optional customer fields"
          git push origin HEAD:main
