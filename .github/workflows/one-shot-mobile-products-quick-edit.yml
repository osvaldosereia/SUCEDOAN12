name: One-shot mobile products quick edit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-mobile-products-quick-edit.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-products-quick-edit
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            supabase/functions/admin-products-live-v1/index.ts
            scripts/test-mobile-products-quick-edit.mjs
            scripts/patch-mobile-products-quick-edit.py
          sparse-checkout-cone-mode: false
      - name: RED
        run: |
          if node scripts/test-mobile-products-quick-edit.mjs; then
            echo 'test unexpectedly passed before implementation'
            exit 1
          else
            echo 'RED confirmed'
          fi
      - name: Apply patch
        run: python3 scripts/patch-mobile-products-quick-edit.py
      - name: GREEN and syntax
        run: |
          node scripts/test-mobile-products-quick-edit.mjs
          node <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log(`Admin JS syntax OK (${scripts.length} scripts)`);
          NODE
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
          git commit -m 'feat(products): mobile quick edit with background autosave'
          git push origin HEAD:feat/mobile-products-quick-edit
