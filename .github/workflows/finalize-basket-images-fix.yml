name: Finalizar correção de imagens das cestas

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-basket-images-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Limpar validações antigas e atualizar CI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function patch(file, fn) {
            const source = fs.readFileSync(file, 'utf8');
            const output = fn(source);
            if (output === source) console.log('Sem alteração:', file);
            else { fs.writeFileSync(file, output, 'utf8'); console.log('Atualizado:', file); }
          }

          patch('app-next/tests/smoke.test.js', source => source.replace(
            /\nconst detailReview = read\(\);\nif \(detailReview\.includes\('fillCheckoutOffers'\)[\s\S]*?\nif \(detailReview\.includes\('observe\(document\.documentElement'\)\)[^\n]*\n/,
            '\n'
          ));

          function updateWorkflow(source) {
            let output = source
              .replaceAll('20260726-9', '20260727-4')
              .replaceAll('20260726-2', '20260727-4');
            if (!output.includes('test ! -e app-next/src/detail-review.js')) {
              output = output.replace(
                'test ! -e app-next/src/delivery-only.js',
                'test ! -e app-next/src/delivery-only.js\n            test ! -e app-next/src/detail-review.js\n            test ! -e app-next/styles/detail-review.css'
              );
            }
            return output;
          }
          patch('.github/workflows/app-next-tests.yml', updateWorkflow);
          patch('.github/workflows/update-public-data.yml', updateWorkflow);
          NODE
      - name: Validar tudo
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/gerar-paginas-seo-combos.js
          node --check scripts/injetar-seo-combos.js
          node --check app-next/src/main.js
          node --check app-next/src/ui.js
          node --check app-next/src/seo-combos.js
          node scripts/check-public-site.mjs
          cd app-next
          npm test
          npm run check
      - name: Publicar e remover finalizador
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-basket-images-fix.yml
          git add -A
          git commit -m 'Finaliza validações da correção de imagens e cache'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
