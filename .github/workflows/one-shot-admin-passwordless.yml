name: One-shot admin passwordless
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-admin-passwordless.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            orcamento/index.html
            scripts/patch-admin-passwordless.py
          sparse-checkout-cone-mode: false
      - name: Apply passwordless admin patch
        run: python3 scripts/patch-admin-passwordless.py
      - name: Verify contract and syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('vitrine/admin/index.html').read_text()
          q=Path('orcamento/index.html').read_text()
          checks=[
            "body:JSON.stringify({pin:'000000'})",
            "function currentOperator(){return 'Operação'}",
            "function requireOperator(){return 'Operação'}",
            '.operator-badge{display:none!important}'
          ]
          missing=[x for x in checks if x not in a]
          if missing: raise SystemExit('admin missing: '+repr(missing))
          qchecks=['const ADMIN_AUTH_API=', 'async function ensureAdminToken()', "await ensureAdminToken();"]
          missing=[x for x in qchecks if x not in q]
          if missing: raise SystemExit('quote missing: '+repr(missing))
          if 'Confirmação de segurança' in a or 'PIN administrativo</span><input' in a:
              raise SystemExit('PIN UI still present')
          print('contract OK')
          PY
          node <<'NODE'
          const fs=require('fs');
          for(const path of ['vitrine/admin/index.html','orcamento/index.html']){
            const html=fs.readFileSync(path,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`${path} inline script ${i+1}: ${e.message}`)}});
          }
          console.log('syntax OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html orcamento/index.html
          git commit -m 'feat(admin): remove senhas e identificação manual'
          git push origin HEAD:main
