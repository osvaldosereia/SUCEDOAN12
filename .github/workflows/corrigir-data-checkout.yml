name: Corrigir data do checkout

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrigir-data-checkout
  cancel-in-progress: false

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar a versão atual da main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Corrigir identificador da lista de datas
        shell: bash
        run: |
          set -euo pipefail
          file="app-next/src/checkout.js"
          grep -Fq "const availbleDates = deliveryDates();" "$file"
          sed -i "s/const availbleDates = deliveryDates();/const availableDates = deliveryDates();/" "$file"
          ! grep -Fq "availbleDates" "$file"
          grep -Fq "const availableDates = deliveryDates();" "$file"
          grep -Fq "const availableDateValues = availableDates.map(dateValue);" "$file"

      - name: Validar correção e site
        shell: bash
        run: |
          set -euo pipefail
          node --check app-next/src/checkout.js
          node app-next/tests/cart-consistency.test.js
          node app-next/tests/smoke.test.js
          node scripts/check-public-site.mjs

      - name: Publicar correção validada
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/corrigir-data-checkout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige validação das datas no checkout"
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          exit 1
