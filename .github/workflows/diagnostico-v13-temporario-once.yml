name: Diagnóstico V13 produto temporário

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-v13-temporario-once.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registrar etapa exata do erro sem expor detalhes ao cliente
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('loja-integrada/personalizar/app-v13.js')
          s=p.read_text(encoding='utf-8')
          old="""    if (!response.ok || data.ok === false) throw new Error(data.error || data.error_message || `Loja Integrada respondeu ${response.status}.`);\n    const productId = text(data.produto_id || data.product_id);"""
          new="""    if (!response.ok || data.ok === false) {\n      const technical = text(data.error || data.error_message || data.message || raw).slice(0, 420);\n      const failure = new Error('Não foi possível preparar sua caneca no carrinho. Tente novamente em instantes.');\n      failure.technical = `Make HTTP ${response.status}${technical ? ` · ${technical}` : ''}`;\n      failure.httpStatus = response.status;\n      throw failure;\n    }\n    const productId = text(data.produto_id || data.product_id);"""
          if old not in s:
              raise SystemExit('Trecho de resposta Make não encontrado')
          s=s.replace(old,new,1)
          old2="""  } catch (error) {\n    if (error?.name === 'AbortError') throw new Error('A preparação do carrinho demorou mais que o esperado. Tente novamente.');\n    throw error;\n  } finally { clearTimeout(timer); }"""
          new2="""  } catch (error) {\n    const at = new Date().toISOString();\n    const technical = error?.name === 'AbortError'\n      ? 'timeout_make_100s'\n      : text(error?.technical || error?.message || error).slice(0, 500);\n    await writeJson(`${CREATIONS_NODE}/${safeKey(code)}`, {\n      loja_integrada_temporario: {\n        status:'erro',\n        etapa:'make_v13_produto_temporario',\n        atualizado_em:at,\n        erro_tecnico:technical,\n        http_status:Number(error?.httpStatus || 0) || 0\n      }\n    }, 'PATCH').catch(() => null);\n    if (error?.name === 'AbortError') throw new Error('A preparação do carrinho demorou mais que o esperado. Tente novamente.');\n    throw error;\n  } finally { clearTimeout(timer); }"""
          if old2 not in s:
              raise SystemExit('Trecho catch Make não encontrado')
          s=s.replace(old2,new2,1)
          s=s.replace("const BUILD = '20260901-loja-integrada-personalizador-v5.1-horizontal-2-crops';", "const BUILD = '20260901-loja-integrada-personalizador-v5.2-horizontal-2-crops';",1)
          p.write_text(s,encoding='utf-8')

          h=Path('loja-integrada/personalizar/index.html')
          x=h.read_text(encoding='utf-8').replace('./app-v13.js?v=20260901-2','./app-v13.js?v=20260901-3')
          h.write_text(x,encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check loja-integrada/personalizar/app-v13.js
          grep -q "make_v13_produto_temporario" loja-integrada/personalizar/app-v13.js
          grep -q "v=20260901-3" loja-integrada/personalizar/index.html
      - name: Publicar e remover workflow temporário
        run: |
          rm -f .github/workflows/diagnostico-v13-temporario-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loja-integrada/personalizar/app-v13.js loja-integrada/personalizar/index.html .github/workflows/diagnostico-v13-temporario-once.yml
          git commit -m "Registra erro técnico da etapa Make V13"
          git pull --rebase origin main
          git push origin main
