name: Admin1 products read retirement CI
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin1-products-read-v1/**'
      - 'scripts/test-admin1-products-read-retirement.mjs'
      - '.github/workflows/admin1-products-read-retirement-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin1-products-read-v1/**'
      - 'scripts/test-admin1-products-read-retirement.mjs'
      - '.github/workflows/admin1-products-read-retirement-ci.yml'
permissions:
  contents: read
jobs:
  retirement-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test retired endpoint behavior
        run: node scripts/test-admin1-products-read-retirement.mjs
      - name: Check Edge Function module syntax
        run: |
          node --check supabase/functions/admin1-products-read-v1/retired-handler.mjs
          node --experimental-strip-types --check supabase/functions/admin1-products-read-v1/index.ts
