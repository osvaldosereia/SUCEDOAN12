name: Checkout Hotfix CI
on:
  push:
    branches: [main]
    paths:
      - 'checkout-resilience.js'
      - 'scripts/test-checkout*.mjs'
      - 'scripts/test-registration-catalog-return.mjs'
      - 'scripts/test-customer-identity-admin-v2.mjs'
      - 'supabase/functions/storefront-v2/index.ts'
      - 'supabase/migrations/20261008032000_order_public_identity_at_creation_v1.sql'
      - 'supabase/migrations/20261008124500_checkout_attempt_idempotency_v1.sql'
      - 'supabase/functions/admin-service-intelligence-v1/index.ts'
      - 'supabase/functions/admin-orders-v1/index.ts'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'supabase/sql/20261003_customer_identity_admin_phone_fix.sql'
      - 'supabase/sql/20261003_customer_admin_email_generated_fix.sql'
      - 'supabase/sql/20261004_order_whatsapp_meta_accept_v1.sql'
      - 'supabase/sql/20261004_registration_catalog_return_storefront_v4.sql'
      - 'vitrine/admin/index.html'
      - 'scripts/test-admin-stock-readiness-pagination.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'checkout-resilience.js'
      - 'scripts/test-checkout*.mjs'
      - 'scripts/test-registration-catalog-return.mjs'
      - 'scripts/test-customer-identity-admin-v2.mjs'
      - 'supabase/migrations/20261002150000_checkout_whatsapp_return_channel.sql'
      - 'supabase/sql/20261003_customer_identity_admin_phone_fix.sql'
      - 'supabase/sql/20261003_customer_admin_email_generated_fix.sql'
      - 'supabase/sql/20261004_order_whatsapp_meta_accept_v1.sql'
      - 'supabase/sql/20261004_registration_catalog_return_storefront_v4.sql'
      - 'index.html'
      - 'vitrine/index.html'
      - 'vitrine/admin/index.html'
      - 'supabase/functions/storefront-v2/index.ts'
      - 'supabase/migrations/20261008032000_order_public_identity_at_creation_v1.sql'
      - 'supabase/migrations/20261008124500_checkout_attempt_idempotency_v1.sql'
      - 'supabase/functions/admin-service-intelligence-v1/index.ts'
      - 'supabase/functions/admin-orders-v1/index.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout regression contracts
        run: |
          node scripts/test-registration-catalog-return.mjs
          node scripts/test-checkout-simple-ux.mjs
          node scripts/test-checkout-customer-capture-v1.mjs
          node --disable-warning=ExperimentalWarning scripts/test-checkout-existing-registration.mjs
          node --disable-warning=ExperimentalWarning scripts/test-checkout-whatsapp-payload-audit.mjs
          node --disable-warning=ExperimentalWarning scripts/test-checkout-address-reference.mjs
          node --disable-warning=ExperimentalWarning scripts/test-admin-stock-readiness-pagination.mjs
          node scripts/test-site-only-order-registration.mjs
          node scripts/test-order-public-identity-at-creation-v1.mjs
          node scripts/test-checkout-attempt-idempotency-v1.mjs
          node scripts/test-checkout-whatsapp-return.mjs
          node scripts/test-checkout-stock-adjustment-contract.mjs
          node scripts/test-checkout-whatsapp-outbox.mjs
          node scripts/test-checkout-order-meta-cutover-v1.mjs
          node scripts/test-checkout-whatsapp-real-delivery-state.mjs
          node scripts/test-customer-identity-admin-v2.mjs
          node --check checkout-resilience.js
