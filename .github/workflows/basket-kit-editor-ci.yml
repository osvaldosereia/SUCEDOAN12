name: Basket kit editor
on:
  pull_request:
    paths:
      - 'vitrine/admin/index.html'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'scripts/test-basket-kit-*.mjs'
      - 'scripts/test-basket-lot-*.mjs'
      - 'scripts/test-basket-mounted-edit-print-models.mjs'
      - 'supabase/functions/basket-lot-image-v1/**'
      - 'supabase/sql/20261003_basket_lot_commercial_fields_v1.sql'
      - 'supabase/sql/20261004_basket_lot_linked_hygiene_and_original_rule_v1.sql'
      - 'supabase/sql/20261004_all_food_baskets_require_hygiene_v1.sql'
      - 'supabase/sql/20261004_optional_hygiene_per_food_lot_v1.sql'
      - 'supabase/sql/20261004_basket_categories_and_financials_v1.sql'
      - 'supabase/sql/20261004_basket_lot_types_links_financials_v1.sql'
      - 'supabase/sql/20261004_basket_lot_reopen_and_model_admin_v1.sql'
      - 'supabase/sql/20261004_basket_lot_model_admin_rpc_permissions_v1.sql'
      - 'supabase/sql/20261004_basket_link_draft_selection_v1.sql'
      - 'vitrine/admin/basket-lot-image.js'
      - 'vitrine/basket-carousel.js'
      - 'supabase/functions/storefront-v2/index.ts'
      - '.github/workflows/basket-kit-editor-ci.yml'
      - 'scripts/apply-basket-lot-consistency-20261004.py'
  push:
    branches: [main]
    paths:
      - 'vitrine/admin/index.html'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'scripts/test-basket-kit-*.mjs'
      - 'scripts/test-basket-lot-*.mjs'
      - 'scripts/test-basket-mounted-edit-print-models.mjs'
      - 'supabase/functions/basket-lot-image-v1/**'
      - 'supabase/sql/20261003_basket_lot_commercial_fields_v1.sql'
      - 'supabase/sql/20261004_basket_lot_linked_hygiene_and_original_rule_v1.sql'
      - 'supabase/sql/20261004_all_food_baskets_require_hygiene_v1.sql'
      - 'supabase/sql/20261004_optional_hygiene_per_food_lot_v1.sql'
      - 'supabase/sql/20261004_basket_categories_and_financials_v1.sql'
      - 'supabase/sql/20261004_basket_lot_types_links_financials_v1.sql'
      - 'supabase/sql/20261004_basket_lot_reopen_and_model_admin_v1.sql'
      - 'supabase/sql/20261004_basket_lot_model_admin_rpc_permissions_v1.sql'
      - 'vitrine/admin/basket-lot-image.js'
      - 'vitrine/basket-carousel.js'
      - 'supabase/functions/storefront-v2/index.ts'
      - '.github/workflows/basket-kit-editor-ci.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply consistency patch
        run: |
          python scripts/apply-basket-lot-consistency-20261004.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
            git commit -m "fix: alinhar contagem e seleção de lotes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/basket-tests" --no-save --package-lock=false playwright@1.62.1
      - run: node "$RUNNER_TEMP/basket-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-suggestions.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-image.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-image-service.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-commercial-fields.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-ops-rules.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-financials-categories.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-types-links-financials.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-mounted-edit-print-models.mjs
      - run: node scripts/test-basket-kit-image-browser.mjs
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/basket-tests/node_modules/playwright
      - run: node scripts/test-basket-kit-editor.mjs
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/basket-tests/node_modules/playwright
