name: Basket kit editor
on:
  pull_request:
    paths:
      - 'index.html'
      - 'vitrine/index.html'
      - 'vitrine/admin/index.html'
      - 'vitrine/basket-carousel.js'
      - 'vitrine/admin/basket-lot-image.js'
      - 'vitrine/admin/basket-guided-builder.js'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'supabase/functions/admin-basket-guided-v1/**'
      - 'supabase/functions/storefront-v2/index.ts'
      - 'supabase/functions/basket-lot-image-v1/**'
      - 'supabase/sql/2026100*_basket_*.sql'
      - 'supabase/migrations/2026100*_basket_*.sql'
      - 'scripts/test-basket-*.mjs'
      - '.github/workflows/basket-kit-editor-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vitrine/index.html'
      - 'vitrine/admin/index.html'
      - 'vitrine/basket-carousel.js'
      - 'vitrine/admin/basket-lot-image.js'
      - 'vitrine/admin/basket-guided-builder.js'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'supabase/functions/admin-basket-guided-v1/**'
      - 'supabase/functions/storefront-v2/index.ts'
      - 'supabase/functions/basket-lot-image-v1/**'
      - 'supabase/sql/2026100*_basket_*.sql'
      - 'supabase/migrations/2026100*_basket_*.sql'
      - 'scripts/test-basket-*.mjs'
      - '.github/workflows/basket-kit-editor-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/basket-tests" --no-save --package-lock=false playwright@1.62.1
      - run: node "$RUNNER_TEMP/basket-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-suggestions.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-image.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-image-service.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-commercial-fields.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-ops-rules.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-financials-categories.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-types-links-financials.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-mounted-edit-print-models.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-commerce.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-zero-price-fallback.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-postdeploy-hardening.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-mounting.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-checkout.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-admin-canonical-api.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-admin-simple-flow.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-storefront-canonical.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-unified-commercial-model.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-guided-positions-v1.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-reservation-domain-v1.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-guided-lot-flow-v1.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-guided-admin-api-v1.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-guided-builder-ui-v1.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-unified-order-engine.mjs
      - run: node scripts/test-basket-guided-builder-browser.mjs
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/basket-tests/node_modules/playwright
      - run: node scripts/test-basket-kit-image-browser.mjs
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/basket-tests/node_modules/playwright
      - run: node scripts/test-basket-kit-editor.mjs
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/basket-tests/node_modules/playwright
