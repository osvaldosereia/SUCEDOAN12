name: Attendance v2 Phase 2 Overflow Apply
on:
  push:
    branches: [feat/attendance-central-v2-phase2]
    paths: ['scripts/patch-attendance-phase2-overflow.py','.github/workflows/attendance-v2-phase2-overflow-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-central-v2-phase2
      - run: python scripts/patch-attendance-phase2-overflow.py
      - name: Commit patch
        run: |
          git config user.name "Dona Antonia Ops"
          git config user.email "actions@users.noreply.github.com"
          git add vitrine/admin/atendimento/attendance.css
          git diff --cached --quiet || git commit -m "fix: remove hidden horizontal toolbar scroll"
          git push origin HEAD:feat/attendance-central-v2-phase2
