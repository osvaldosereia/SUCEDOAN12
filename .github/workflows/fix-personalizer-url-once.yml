name: CanecaFácil · corrigir URL do personalizador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-personalizer-url-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir endpoint externo do personalizador
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'https://canecafacil.com.br/personalizar/'
          new = 'https://donaantonia.com.br/loja-integrada/personalizar/'
          paths = [
              Path('scripts/sincronizar-loja-integrada.mjs'),
              Path('scripts/sincronizar-conteudo-canecafacil.mjs'),
              Path('admin-canecas/product-content-manager-v1.js'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  print(f'{path}: URL antiga não encontrada; nada a trocar')
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: corrigido')
          PY
      - name: Validar referências
        run: |
          if grep -R "https://canecafacil.com.br/personalizar/" scripts/sincronizar-loja-integrada.mjs scripts/sincronizar-conteudo-canecafacil.mjs admin-canecas/product-content-manager-v1.js; then
            echo "Ainda existe URL inválida do personalizador"
            exit 1
          fi
          grep -R "https://donaantonia.com.br/loja-integrada/personalizar/" scripts/sincronizar-loja-integrada.mjs scripts/sincronizar-conteudo-canecafacil.mjs admin-canecas/product-content-manager-v1.js
      - name: Publicar correção e remover workflow temporário
        run: |
          rm -f .github/workflows/fix-personalizer-url-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sincronizar-loja-integrada.mjs scripts/sincronizar-conteudo-canecafacil.mjs admin-canecas/product-content-manager-v1.js .github/workflows/fix-personalizer-url-once.yml
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar"
            exit 0
          fi
          git commit -m "Corrige URL pública do personalizador CanecaFácil"
          git pull --rebase origin main
          git push origin main
