name: one-shot deploy admin-service-intelligence-v1

on:
  push:
    paths:
      - '.github/workflows/one-shot-deploy-admin-service-intelligence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured"
            exit 2
          fi
      - name: Deploy admin-service-intelligence-v1
        run: npx --yes supabase@2.119.0 functions deploy admin-service-intelligence-v1 --project-ref ssbesxgaijknwsjbsbcz --no-verify-jwt
