name: One-shot Deploy Admin Service Customer Delete Fix

on:
  push:
    branches:
      - fix/customer-delete-runtime-20261003
    paths:
      - .github/workflows/one-shot-deploy-admin-service-intelligence-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ssbesxgaijknwsjbsbcz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run customer identity regression contract
        run: node scripts/test-customer-identity-admin-v2.mjs

      - name: Require Supabase deploy credential
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured; refusing to deploy."
            exit 1
          fi

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Deploy only admin-service-intelligence-v1
        run: supabase functions deploy admin-service-intelligence-v1 --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Verify function is listed after deploy
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
