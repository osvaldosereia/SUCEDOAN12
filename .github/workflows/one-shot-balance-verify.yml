name: One-shot balance runtime verification
on:
  push:
    branches:
      - feature/balance-camera-auto-ean
    paths:
      - ".github/workflows/one-shot-balance-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/product-image-openai-v1/index.ts
            scripts/test-balance-camera-auto-ean.mjs
          sparse-checkout-cone-mode: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Contract
        run: node scripts/test-balance-camera-auto-ean.mjs
      - name: Deno type and syntax check
        run: |
          deno check supabase/functions/admin-products-live-v1/index.ts
          deno check supabase/functions/product-image-openai-v1/index.ts
      - name: Browser JavaScript syntax check
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw new Error('no inline scripts found');
          for(const [i,src] of scripts.entries()){
            try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}
          }
          console.log(`Admin JS syntax OK (${scripts.length} inline scripts)`);
          NODE
      - name: Diff hygiene markers
        run: |
          ! grep -q 'inventory-product-research-v1' supabase/functions/admin-products-live-v1/index.ts
          ! grep -q 'inventory-fast-balance-v3' supabase/functions/admin-products-live-v1/index.ts
          grep -q 'setProductStockOfficial' supabase/functions/admin-products-live-v1/index.ts
          grep -q 'lot_selection_required' supabase/functions/admin-products-live-v1/index.ts
