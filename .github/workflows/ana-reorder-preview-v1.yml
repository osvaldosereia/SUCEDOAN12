name: ANA V3 R9 Reorder Preview
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/ana-reorder-preview-v1.mjs'
      - 'scripts/test-ana-reorder-preview-v1.mjs'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/ana-reorder-preview-v1.mjs'
      - 'scripts/test-ana-reorder-preview-v1.mjs'
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-ana-reorder-preview-v1.mjs
