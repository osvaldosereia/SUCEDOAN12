name: Basket mold stock balance
on:
  pull_request:
    paths:
      - 'supabase/sql/20261006_basket_mold_public_compositions_v2.sql'
      - 'supabase/migrations/20261006094000_basket_mold_public_compositions_v2.sql'
      - 'scripts/test-basket-mold-stock-balance-v1.mjs'
      - '.github/workflows/basket-mold-stock-balance-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/sql/20261006_basket_mold_public_compositions_v2.sql'
      - 'supabase/migrations/20261006094000_basket_mold_public_compositions_v2.sql'
      - 'scripts/test-basket-mold-stock-balance-v1.mjs'
      - '.github/workflows/basket-mold-stock-balance-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-basket-mold-stock-balance-v1.mjs
