name: One-shot restore PapoAI order signals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-restore-papoai-order-signals.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RED - prove signals are missing from outbound order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/functions/admin-orders-v1/index.ts').read_text()
          f=Path('supabase/functions/storefront-v2/index.ts').read_text()
          missing=[]
          for token in ['marketing_interests:','marketing_brands:','cta_pos_pedido:','basket_text_template:']:
              if token not in s: missing.append(token)
          if 'marketing_opt_in:customer.marketing_opt_in===true' not in f: missing.append('checkout marketing opt-in snapshot')
          if not missing:
              raise SystemExit('RED failed: restored signals already exist')
          print('RED confirmed:', ', '.join(missing))
          PY
      - name: GREEN - restore canonical marketing signals to provider payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # storefront: retain consent/campaign snapshot with the persisted order
          p=Path('supabase/functions/storefront-v2/index.ts')
          s=p.read_text()
          old='''  const customerSnapshot={...(customer?{found:true,id:customer.id,display_name:customer.display_name||null,address:customer.address||null,identity_status:"existing_optional"}:{}),...(whatsappOrigin?{whatsapp_origin:whatsappOrigin}:{}),...(stock.stock_adjustment?{stock_adjusted_retry:true,stock_adjustments:stock.adjusted_items}:{})};'''
          new='''  const marketingCampaign=txt(p?.marketing_context?.campaign,80);\n  const customerSnapshot={...(customer?{found:true,id:customer.id,display_name:customer.display_name||null,address:customer.address||null,marketing_opt_in:customer.marketing_opt_in===true,identity_status:"existing_optional"}:{}),...(whatsappOrigin?{whatsapp_origin:whatsappOrigin}:{}),...(marketingCampaign?{marketing_campaign:marketingCampaign}:{}),...(stock.stock_adjustment?{stock_adjusted_retry:true,stock_adjustments:stock.adjusted_items}:{})};'''
          if old not in s: raise SystemExit('storefront customer snapshot block not found')
          p.write_text(s.replace(old,new,1))

          # dispatcher: derive signals from the saved order, never from basket components
          p=Path('supabase/functions/admin-orders-v1/index.ts')
          s=p.read_text()
          s=s.replace('type OrderItem={name_snapshot?:unknown;quantity?:unknown;metadata?:unknown;created_at?:unknown};','type OrderItem={product_id?:unknown;name_snapshot?:unknown;quantity?:unknown;metadata?:unknown;created_at?:unknown};',1)
          helper='''\nconst marketingSlug=(v:unknown)=>text(v,220).normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");\nconst MARKETING_CTA_PRIORITY=["BEBE","CABELOS","BELEZA","LIMPEZA","LAVANDERIA","PET"];\nconst marketingInterestForProduct=(product:JsonRecord)=>{\n  const sub=marketingSlug(product.customer_subcategory||product.subcategory),leaf=marketingSlug(product.customer_subsubcategory||product.subsubcategory);\n  if(sub==="bebe"||leaf.includes("fralda")||leaf.includes("bebe"))return "BEBE";\n  if(sub==="cabelos"||["shampoo","condicionador","creme-de-pentear","tratamentos-capilares","coloracao-capilar","oleos-e-seruns-capilares","acessorios-de-cabelo","escovas-e-pentes","kits-de-shampoo-e-condicionador"].includes(leaf))return "CABELOS";\n  if(sub==="beleza-e-cuidados"||["unhas","labios","cuidados-corporais","cuidados-com-o-rosto","protecao-da-pele","acessorios-de-beleza"].includes(leaf))return "BELEZA";\n  if(sub==="higiene-pessoal")return "HIGIENE";\n  if(sub==="limpeza")return "LIMPEZA";\n  if(sub==="lavanderia")return "LAVANDERIA";\n  if(sub==="pets"||["caes","gatos","petiscos-para-pets","higiene-pet"].includes(leaf))return "PET";\n  if(sub==="casa-e-utilidades")return "CASA";\n  if(["biscoitos","chocolates-e-doces","balas-e-chicletes","salgadinhos-e-petiscos","bebidas","cereais-e-barras"].includes(leaf))return "DOCES_LANCHES";\n  return "";\n};\n'''
          marker='''const deliveryLabel=(delivery:JsonRecord,checkoutDelivery:JsonRecord)=>text(\n  delivery.delivery_label||delivery.label||checkoutDelivery.label||checkoutDelivery.delivery_label||checkoutDelivery.delivery_date||delivery.delivery_date||"NAO INFORMADA",\n  160\n);\n'''
          if marker not in s: raise SystemExit('admin helper insertion marker not found')
          s=s.replace(marker,marker+helper,1)
          s=s.replace('.select("name_snapshot,quantity,metadata,created_at")','.select("product_id,name_snapshot,quantity,metadata,created_at")',1)
          old='''  const basketText=basketLines.length?basketLines.join("\\n"):"NENHUMA";\n\n  const addressParts='''
          new='''  const basketText=basketLines.length?basketLines.join("\\n"):"NENHUMA";\n  const basketTextTemplate=basketLines.length?basketLines.join(" • "):"NENHUMA";\n\n  const checkoutProducts=arr(checkout.cart).map(obj).filter(item=>text(item.type,30)==="product");\n  let standaloneIds=[...new Set(checkoutProducts.map(item=>uid(item.id||item.product_id)).filter(Boolean))];\n  if(!standaloneIds.length){\n    standaloneIds=[...new Set(rows.filter(row=>!text(obj(row.metadata).basket_name,180)).map(row=>uid(row.product_id)).filter(Boolean))];\n  }\n  let marketingProducts:JsonRecord[]=[];\n  if(standaloneIds.length){\n    const productsResult=await db.from("products").select("id,brand,subcategory,subsubcategory,customer_subcategory,customer_subsubcategory").in("id",standaloneIds);\n    if(productsResult.error)throw new Error(`marketing_products_query_failed: ${text(productsResult.error.message,240)}`);\n    marketingProducts=(productsResult.data||[]).map(obj);\n  }\n  const marketingInterests=new Set<string>();\n  if(cartBaskets.length||basketLines.length)marketingInterests.add("CESTAS");\n  const marketingBrands=new Set<string>();\n  for(const product of marketingProducts){\n    const interest=marketingInterestForProduct(product);if(interest)marketingInterests.add(interest);\n    const brand=marketingSlug(product.brand);if(brand==="nivea")marketingBrands.add("NIVEA");else if(brand==="elseve")marketingBrands.add("ELSEVE");\n  }\n  const marketingOptIn=customer.marketing_opt_in===true||checkoutCustomer.marketing_opt_in===true;\n  const marketingCta=marketingOptIn?(MARKETING_CTA_PRIORITY.find(value=>marketingInterests.has(value))||(marketingInterests.has("CESTAS")?"OFERTAS":"NENHUM")):"NENHUM";\n  const marketingCampaign=text(customer.marketing_campaign||checkoutCustomer.marketing_campaign||checkout.marketing_campaign,80)||"NENHUM";\n\n  const addressParts='''
          if old not in s: raise SystemExit('basket/marketing insertion marker not found')
          s=s.replace(old,new,1)
          s=s.replace('''    basketText,\n    productsText,''','''    basketText,\n    basketTextTemplate,\n    marketingOptIn,\n    marketingInterests:[...marketingInterests],\n    marketingBrands:[...marketingBrands],\n    marketingCta,\n    marketingCampaign,\n    productsText,''',1)
          s=s.replace('''    basket_text:details.basketText,\n    products_text:details.productsText,''','''    basket_text:details.basketText,\n    basket_text_template:details.basketTextTemplate,\n    marketing_opt_in:details.marketingOptIn?"SIM":"NAO",\n    marketing_interests:details.marketingInterests.join("|"),\n    marketing_brands:details.marketingBrands.join("|"),\n    cta_pos_pedido:details.marketingCta,\n    campaign_origin:details.marketingCampaign,\n    interest_cestas:details.marketingInterests.includes("CESTAS")?"SIM":"NAO",\n    interest_bebe:details.marketingInterests.includes("BEBE")?"SIM":"NAO",\n    interest_cabelos:details.marketingInterests.includes("CABELOS")?"SIM":"NAO",\n    interest_beleza:details.marketingInterests.includes("BELEZA")?"SIM":"NAO",\n    interest_higiene:details.marketingInterests.includes("HIGIENE")?"SIM":"NAO",\n    interest_limpeza:details.marketingInterests.includes("LIMPEZA")?"SIM":"NAO",\n    interest_lavanderia:details.marketingInterests.includes("LAVANDERIA")?"SIM":"NAO",\n    interest_pet:details.marketingInterests.includes("PET")?"SIM":"NAO",\n    interest_casa:details.marketingInterests.includes("CASA")?"SIM":"NAO",\n    interest_doces_lanches:details.marketingInterests.includes("DOCES_LANCHES")?"SIM":"NAO",\n    brand_nivea:details.marketingBrands.includes("NIVEA")?"SIM":"NAO",\n    brand_elseve:details.marketingBrands.includes("ELSEVE")?"SIM":"NAO",\n    products_text:details.productsText,''',1)
          p.write_text(s)

          # permanent regression tests
          p=Path('scripts/test-checkout-whatsapp-outbox.mjs')
          s=p.read_text()
          append='''\nassert.match(storefront,/marketing_opt_in:customer\\.marketing_opt_in===true/,'checkout order snapshot must retain marketing consent');\nassert.match(storefront,/marketing_campaign:marketingCampaign/,'checkout order snapshot must retain campaign origin when present');\nassert.match(adminOrders,/filter\\(item=>text\\(item\\.type,30\\)===\"product\"\\)/,'marketing interests must derive only from standalone cart products');\nassert.match(adminOrders,/if\\(cartBaskets\\.length\\|\\|basketLines\\.length\\)marketingInterests\\.add\\(\"CESTAS\"\\)/,'basket purchase must emit CESTAS without classifying basket components');\nfor(const field of ['basket_text_template','marketing_opt_in','marketing_interests','marketing_brands','cta_pos_pedido','campaign_origin','interest_cestas','interest_bebe','interest_cabelos','interest_beleza','interest_higiene','interest_limpeza','interest_lavanderia','interest_pet','interest_casa','interest_doces_lanches','brand_nivea','brand_elseve']) assert.match(adminOrders,new RegExp(`\\\\b${field}\\\\b`),`${field} must be exposed to PapoAI webhook payload`);\n'''
          if 'marketing_interests must derive only from standalone cart products' not in s:
              s+=append
          p.write_text(s)
          PY
      - name: Verify contracts
        run: |
          node scripts/test-checkout-whatsapp-outbox.mjs
          node scripts/test-checkout-whatsapp-return.mjs
          python3 scripts/test-marketing-intelligence-contract.py
          git diff --check
      - name: Commit and self-remove
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-restore-papoai-order-signals.yml
          git add supabase/functions/storefront-v2/index.ts supabase/functions/admin-orders-v1/index.ts scripts/test-checkout-whatsapp-outbox.mjs
          git commit -m 'fix(papoai): restaura sinais estruturados do pedido'
          git push origin HEAD:main
