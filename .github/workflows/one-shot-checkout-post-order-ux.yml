name: One-shot checkout post-order UX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-checkout-post-order-ux.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RED - new behavior must fail before patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-checkout-whatsapp-return.mjs')
          s=p.read_text()
          s=s.replace("assert.match(root,/function scheduleWhatsAppReturn\\(url,delayMs=3000\\)/,'scheduled WhatsApp return helper required');", "assert.match(root,/function scheduleWhatsAppReturn\\(url,delayMs=0\\)/,'WhatsApp return must default to immediate');")
          s=s.replace("const timerPos=send.indexOf('scheduleWhatsAppReturn(url,3000)');", "const timerPos=send.indexOf('scheduleWhatsAppReturn(url,0)');")
          s=s.replace("assert.ok(renderPos>clearPos&&timerPos>renderPos,'success screen must render before scheduled WhatsApp return');", "assert.ok(renderPos>clearPos&&timerPos>renderPos,'success state must be prepared before immediate WhatsApp return');")
          s += "\nassert.doesNotMatch(root,/Voltando para a conversa em 3 segundos/i,'legacy 3-second copy must be removed');\n"
          s += "assert.match(root,/max-width:min\\(520px,calc\\(100vw - 32px\\)\\)/,'toast must have responsive readable width');\n"
          s += "assert.match(root,/white-space:normal/,'toast must wrap long messages');\n"
          p.write_text(s)
          PY
          if node scripts/test-checkout-whatsapp-return.mjs; then
            echo 'RED failed: new contract unexpectedly passed before implementation'
            exit 1
          else
            echo 'RED confirmed: old 3-second/toast behavior violates new contract'
          fi
      - name: GREEN - implement immediate WhatsApp return and readable toast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','vitrine/index.html']:
            p=Path(name); s=p.read_text()
            s=s.replace("function scheduleWhatsAppReturn(url,delayMs=3000)", "function scheduleWhatsAppReturn(url,delayMs=0)")
            s=s.replace("scheduleWhatsAppReturn(url,3000);", "scheduleWhatsAppReturn(url,0);")
            s=s.replace("Voltando para a conversa em 3 segundos…", "Voltando para sua conversa no WhatsApp…")
            old=".toast{position:fixed;z-index:90;left:50%;bottom:96px;transform:translate(-50%,20px);background:#18221c;color:#fff;padding:10px 13px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;font-weight:750;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}"
            new=".toast{position:fixed;z-index:90;left:50%;bottom:96px;transform:translate(-50%,20px);background:#18221c;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;font-weight:750;font-size:13px;line-height:1.4;text-align:center;width:max-content;max-width:min(520px,calc(100vw - 32px));white-space:normal;overflow-wrap:anywhere}.toast.show{opacity:1;transform:translate(-50%,0)}"
            if old not in s: raise SystemExit(f'legacy toast CSS not found in {name}')
            s=s.replace(old,new)
            p.write_text(s)
          PY
      - name: GREEN - verify contracts
        run: |
          node scripts/test-checkout-whatsapp-return.mjs
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['index.html','vitrine/index.html']){
            const html=fs.readFileSync(f,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`${f} inline script ${i+1}: ${e.message}`)}});
          }
          console.log('storefront JS syntax OK');
          NODE
          git diff --check
      - name: Commit and self-remove
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-checkout-post-order-ux.yml
          git add index.html vitrine/index.html scripts/test-checkout-whatsapp-return.mjs
          git commit -m 'fix(checkout): retorna ao WhatsApp sem espera e corrige avisos longos'
          git push origin HEAD:main
