name: Apply basket price preview admin
permissions:
  contents: write
on:
  push:
    branches: [fix/basket-price-composition-normalization]
    paths:
      - 'scripts/apply-basket-price-preview-admin.py'
      - '.github/workflows/apply-basket-price-preview-admin.yml'
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[basket-price-admin-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/basket-price-composition-normalization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-basket-price-preview-admin.py
      - name: Commit transformation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/basket-mold-admin.js
          git commit -m "fix: mostrar formação do preço no Admin [basket-price-admin-applied]"
          git push origin HEAD:fix/basket-price-composition-normalization
