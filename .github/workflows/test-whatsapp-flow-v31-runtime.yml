name: Test WhatsApp Flow V31 Runtime

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260910124500_whatsapp_flow_v31_targeted_homologation_guard_v5.sql'
      - 'supabase/migrations/20260910125000_whatsapp_flow_v31_runtime_v18_v22_backfill.sql'
      - 'supabase/migrations/20260910142700_whatsapp_flow_v31_owner_allowlist_purpose_unification_v1.sql'
      - 'supabase/migrations/20260910143500_whatsapp_flow_v31_owner_dispatch_contract_v2.sql'
      - 'supabase/migrations/20260910144200_whatsapp_flow_v31_owner_preflight_v3_dispatch_v6.sql'
      - 'supabase/migrations/20260910153000_whatsapp_flow_v31_terminal_nfm_bridge_v1.sql'
      - 'supabase/migrations/20260910162244_whatsapp_flow_v31_runtime_v23_checkout_contact_v1.sql'
      - 'supabase/migrations/20260910162311_whatsapp_flow_v31_commercial_journey_readiness_v2_fix.sql'
      - 'supabase/migrations/20260910162624_whatsapp_flow_v31_runtime_v23_preflight_metadata_v1.sql'
      - 'supabase/functions/whatsapp-flow-data-exchange-v1/**'
      - 'supabase/functions/whatsapp-ingest-make-v1/**'
      - 'scripts/build-flow-v31-stable-text-products.py'
      - 'scripts/validate-flow-v31-commercial-contract.py'
      - 'scripts/test-whatsapp-flow-v31-runtime-contract.mjs'
      - 'whatsapp/flows/flow-cestas-comercial-v6.json'
      - '.github/workflows/test-whatsapp-flow-v31-runtime.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260910124500_whatsapp_flow_v31_targeted_homologation_guard_v5.sql'
      - 'supabase/migrations/20260910125000_whatsapp_flow_v31_runtime_v18_v22_backfill.sql'
      - 'supabase/migrations/20260910142700_whatsapp_flow_v31_owner_allowlist_purpose_unification_v1.sql'
      - 'supabase/migrations/20260910143500_whatsapp_flow_v31_owner_dispatch_contract_v2.sql'
      - 'supabase/migrations/20260910144200_whatsapp_flow_v31_owner_preflight_v3_dispatch_v6.sql'
      - 'supabase/migrations/20260910153000_whatsapp_flow_v31_terminal_nfm_bridge_v1.sql'
      - 'supabase/migrations/20260910162244_whatsapp_flow_v31_runtime_v23_checkout_contact_v1.sql'
      - 'supabase/migrations/20260910162311_whatsapp_flow_v31_commercial_journey_readiness_v2_fix.sql'
      - 'supabase/migrations/20260910162624_whatsapp_flow_v31_runtime_v23_preflight_metadata_v1.sql'
      - 'supabase/functions/whatsapp-flow-data-exchange-v1/**'
      - 'supabase/functions/whatsapp-ingest-make-v1/**'
      - 'scripts/build-flow-v31-stable-text-products.py'
      - 'scripts/validate-flow-v31-commercial-contract.py'
      - 'scripts/test-whatsapp-flow-v31-runtime-contract.mjs'
      - 'whatsapp/flows/flow-cestas-comercial-v6.json'
      - '.github/workflows/test-whatsapp-flow-v31-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen V31 source inputs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git hash-object whatsapp/flows/flow-cestas-comercial-v6.json)"
          BUILDER="$(git hash-object scripts/build-flow-v31-stable-text-products.py)"
          test "$SOURCE" = "71e87f02dcec2401e9e2625d59014e9361bb925d" || {
            echo "V31 canonical V6 source drift: $SOURCE" >&2
            exit 1
          }
          test "$BUILDER" = "38e38716f6a28177665e07dd7f76814d2cef8068" || {
            echo "V31 builder drift: $BUILDER" >&2
            exit 1
          }
          echo "v31_source_blob=$SOURCE"
          echo "v31_builder_blob=$BUILDER"
      - name: Build stable V31 from canonical V6
        run: python scripts/build-flow-v31-stable-text-products.py
      - name: Validate generated JSON
        run: python -m json.tool whatsapp/flows/flow-cestas-comercial-v31-stable-text-products.json >/dev/null
      - name: Validate full commercial Flow contract
        run: python scripts/validate-flow-v31-commercial-contract.py
      - name: Report generated V31 identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git hash-object whatsapp/flows/flow-cestas-comercial-v31-stable-text-products.json)"
          echo "v31_generated_blob=$ACTUAL"
      - name: Validate V31 runtime and owner-only homologation contract
        run: node scripts/test-whatsapp-flow-v31-runtime-contract.mjs
