name: Testar Storefront V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*storefront_v2*'
      - 'supabase/functions/storefront-v2/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/config.toml'
      - 'scripts/test-storefront-v2-*.mjs'
      - 'scripts/test-customer-order-link-v2.mjs'
      - '.github/workflows/test-storefront-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Contrato de schema Storefront V2
        run: node scripts/test-storefront-v2-schema.mjs
      - name: Contrato transacional do pedido
        run: node scripts/test-storefront-v2-order-contract.mjs
