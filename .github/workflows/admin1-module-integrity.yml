name: Admin1 module integrity
on:
  push:
    branches: [main]
    paths:
      - 'admin1/**'
      - '.github/workflows/admin1-module-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin1/**'
      - '.github/workflows/admin1-module-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ADMIN1 JavaScript syntax
        run: |
          for source in admin1/src/*.js; do node --check "$source"; done
      - name: Run ADMIN1 unit and adapter tests
        run: node --test admin1/tests/*.test.mjs
      - name: Reject accidental truncated tool output
        run: |
          if grep -nE 'Warning: truncated output|[0-9]+ tokens truncated' admin1/src/*.js; then
            echo 'Truncated tool output has been committed into JavaScript source.'
            exit 1
          fi
