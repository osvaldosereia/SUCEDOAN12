name: One-shot basket Novo lote cents
on:
  push:
    branches: [fix/basket-new-lot-cents-20261004]
    paths:
      - 'scripts/patch-basket-new-lot-cents.py'
      - '.github/workflows/one-shot-basket-new-lot-cents.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch-basket-new-lot-cents.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vitrine/admin/index.html
          git commit -m "fix: restaurar abertura de Novo lote" || exit 0
          git push
