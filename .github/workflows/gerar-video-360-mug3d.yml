name: Canecas · gerar vídeo 360 no Mug3D
run-name: Vídeo 360 YouTube · ${{ github.event_name == 'workflow_dispatch' && inputs.product_key || github.event_name == 'push' && 'teste automático' || 'fila pendente' }}

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Chave Firebase da caneca'
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/mug3d-test-trigger.txt'

permissions:
  contents: read

concurrency:
  group: canecas-mug3d-video-360
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
      PRODUCTS_NODE: produtos
      REQUESTED_PRODUCT_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.product_key || '' }}
      TEST_MODE: ${{ github.event_name == 'push' && 'true' || 'false' }}
      FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
      MAKE_YOUTUBE_WEBHOOK_URL: ${{ secrets.MAKE_YOUTUBE_WEBHOOK_URL }}
      MUG3D_URL: https://mug3d.com/?model=1
      VIDEO_OUTPUT_DIR: .tmp-mug3d
      MUG3D_SPEED: '8'
      MUG3D_MAX_LOOP_MS: '35000'
      MAKE_YOUTUBE_MAX_BYTES: '4800000'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Selecionar caneca para processar
        id: queue
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = String(process.env.FIREBASE_URL || '').replace(/\/+$/, '');
          const node = String(process.env.PRODUCTS_NODE || 'produtos').replace(/^\/+|\/+$/g, '');
          const requested = String(process.env.REQUESTED_PRODUCT_KEY || '').trim();
          const testMode = String(process.env.TEST_MODE || '').toLowerCase() === 'true';
          const auth = String(process.env.FIREBASE_AUTH_TOKEN || '').trim();
          const query = auth ? `?auth=${encodeURIComponent(auth)}` : '';
          const art = p => String(p?.arte_horizontal || p?.arte_impressao?.url || p?.arte_personalizacao || p?.art_url || p?.arte_url || '').trim();
          (async () => {
            let selected = requested;
            let selectedName = '';
            if (!selected) {
              const response = await fetch(`${base}/${node}.json${query}`, { headers: { Accept: 'application/json' } });
              if (!response.ok) throw new Error(`Firebase fila: HTTP ${response.status}`);
              const data = await response.json();
              const entries = Object.entries(data || {}).filter(([, product]) => product && typeof product === 'object');
              const pending = entries
                .filter(([, product]) => ['pending', 'queued'].includes(String(product.video_360_status || '').trim().toLowerCase()))
                .sort((a, b) => Date.parse(a[1].video_360_requested_at || 0) - Date.parse(b[1].video_360_requested_at || 0));
              if (pending.length) {
                selected = pending[0][0];
                selectedName = String(pending[0][1].nome || '').trim();
              } else if (testMode) {
                const testable = entries
                  .filter(([, product]) => /^https?:\/\//i.test(art(product)))
                  .filter(([, product]) => !['processing'].includes(String(product.video_360_status || '').trim().toLowerCase()))
                  .sort((a, b) => Date.parse(b[1].last_update || b[1].updated_at || 0) - Date.parse(a[1].last_update || a[1].updated_at || 0));
                selected = testable[0]?.[0] || '';
                selectedName = String(testable[0]?.[1]?.nome || '').trim();
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${selected ? 'true' : 'false'}\nproduct_key=${selected}\nproduct_name=${selectedName.replace(/\n/g, ' ')}\n`);
            console.log(selected ? `Caneca selecionada: ${selected}${selectedName ? ` · ${selectedName}` : ''}${testMode ? ' · TESTE' : ''}` : 'Nenhuma caneca elegível; encerrando sem instalar Chromium.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Instalar navegador e conversores
        if: steps.queue.outputs.run == 'true'
        run: |
          npm install --no-save playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      - name: Gerar WEBM temporário no Mug3D
        if: steps.queue.outputs.run == 'true'
        env:
          PRODUCT_KEY: ${{ steps.queue.outputs.product_key }}
        run: xvfb-run -a node scripts/mug3d-video-automation.mjs

      - name: Converter para MP4 vertical leve
        if: steps.queue.outputs.run == 'true'
        id: convert
        shell: bash
        run: |
          WEBM="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('.mug3d-result.json','utf8')); process.stdout.write(r.video_path||'')")"
          PRODUCT_KEY="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('.mug3d-result.json','utf8')); process.stdout.write(r.product_key||'caneca')")"
          SAFE_KEY="$(printf '%s' "$PRODUCT_KEY" | sed -E 's/[^a-zA-Z0-9._-]+/-/g;s/^-+//;s/-+$//' | cut -c1-110)"
          MP4=".tmp-mug3d/${SAFE_KEY:-caneca}-360-short.mp4"
          mkdir -p .tmp-mug3d
          ffmpeg -hide_banner -loglevel warning -y -i "$WEBM" \
            -vf "scale=720:720:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:color=white,fps=30" \
            -an -c:v libx264 -preset medium -crf 29 -pix_fmt yuv420p -movflags +faststart "$MP4"
          SIZE="$(stat -c%s "$MP4")"
          if [ "$SIZE" -gt 4600000 ]; then
            echo "MP4 com $SIZE bytes; recomprimindo para reduzir o upload."
            ffmpeg -hide_banner -loglevel warning -y -i "$MP4" \
              -vf "scale=576:1024:force_original_aspect_ratio=decrease,pad=576:1024:(ow-iw)/2:(oh-ih)/2:color=white,fps=24" \
              -an -c:v libx264 -preset medium -crf 33 -pix_fmt yuv420p -movflags +faststart "${MP4}.small.mp4"
            mv "${MP4}.small.mp4" "$MP4"
            SIZE="$(stat -c%s "$MP4")"
          fi
          if [ "$SIZE" -gt 4800000 ]; then
            echo "::error::MP4 ainda ficou grande demais para o bridge do Make: $SIZE bytes."
            exit 1
          fi
          echo "youtube_path=$MP4" >> "$GITHUB_OUTPUT"
          echo "MP4 temporário pronto: $MP4 · $SIZE bytes."

      - name: Validar arquivo de vídeo gerado
        if: steps.queue.outputs.run == 'true'
        env:
          MP4_PATH: ${{ steps.convert.outputs.youtube_path }}
        shell: bash
        run: |
          echo 'Metadados do MP4:'
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames \
            -show_entries format=duration,size,bit_rate \
            -of json "$MP4_PATH"
          echo 'Teste de movimento (freezedetect):'
          ffmpeg -hide_banner -i "$MP4_PATH" -vf "freezedetect=n=0.003:d=2" -an -f null - 2>&1 | grep -E 'freeze_(start|end|duration)' || echo 'Nenhum congelamento longo detectado pelo filtro.'

      - name: Guardar vídeo gerado no teste
        if: steps.queue.outputs.run == 'true' && env.TEST_MODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mug3d-video-teste-${{ github.run_id }}
          path: |
            .mug3d-result.json
            ${{ steps.convert.outputs.youtube_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - name: Validar publicação no YouTube
        if: steps.queue.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "$MAKE_YOUTUBE_WEBHOOK_URL" ]; then
            echo '::error::Vídeo 360 foi gerado e validado, mas falta o secret MAKE_YOUTUBE_WEBHOOK_URL para publicar no YouTube.'
            exit 1
          fi

      - name: Publicar YouTube Short e salvar link no produto
        if: steps.queue.outputs.run == 'true'
        env:
          PRODUCT_KEY: ${{ steps.queue.outputs.product_key }}
          YOUTUBE_VIDEO_PATH: ${{ steps.convert.outputs.youtube_path }}
        run: node scripts/mug3d-publish-result.mjs

      - name: Guardar diagnóstico quando falhar
        if: failure() && steps.queue.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mug3d-youtube-diagnostico-${{ github.run_id }}
          path: |
            .mug3d-result.json
            .tmp-mug3d/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 2
