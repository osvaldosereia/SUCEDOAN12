name: CanecaFácil · teste reconciliar categorias LI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-reconciliar-categorias-li.yml'
      - 'scripts/reconciliar-categorias-produtos-li-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canecafacil-li-category-reconcile-test
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar token Loja Integrada
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
      - name: Reconciliar categorias · DRY RUN · sem Make
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          CATEGORY_RECONCILE_LIMIT: '5'
          DRY_RUN: 'true'
        run: node scripts/reconciliar-categorias-produtos-li-v1.mjs
