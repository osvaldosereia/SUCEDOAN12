name: Bootstrap Bling secrets to Supabase once

on:
  push:
    paths:
      - '.github/workflows/bootstrap-bling-secrets-to-supabase-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required repository secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY missing' >&2; exit 1; }
          test -n "$BLING_CLIENT_ID" || { echo 'BLING_CLIENT_ID missing' >&2; exit 1; }
          test -n "$BLING_CLIENT_SECRET" || { echo 'BLING_CLIENT_SECRET missing' >&2; exit 1; }
          test -n "$BLING_REFRESH_TOKEN" || { echo 'BLING_REFRESH_TOKEN missing' >&2; exit 1; }

      - name: Store Bling credentials in Supabase Vault
        env:
          SUPABASE_URL: https://ssbesxgaijknwsjbsbcz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc             --arg client_id "$BLING_CLIENT_ID"             --arg client_secret "$BLING_CLIENT_SECRET"             --arg refresh_token "$BLING_REFRESH_TOKEN"             '{p_client_id:$client_id,p_client_secret:$client_secret,p_refresh_token:$refresh_token}')"
          curl --fail --silent --show-error             -X POST "$SUPABASE_URL/rest/v1/rpc/install_bling_api_credentials_v1"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             --data "$payload" >/dev/null
          echo "Bling credentials stored in Supabase Vault."
