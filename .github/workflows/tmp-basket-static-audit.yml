name: Temporary basket static audit
on:
  push:
    branches:
      - refactor/baskets-canonical-section-20261005
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/baskets-canonical-section-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all non-browser basket contracts without fail-fast
        shell: bash
        run: |
          failed=0
          for f in scripts/test-basket-*.mjs; do
            case "$f" in
              *browser*.mjs|*kit-editor.mjs) continue ;;
            esac
            echo "===== $f ====="
            if node --disable-warning=ExperimentalWarning "$f"; then
              echo "PASS $f"
            else
              echo "FAIL $f"
              failed=1
            fi
          done
          exit "$failed"
