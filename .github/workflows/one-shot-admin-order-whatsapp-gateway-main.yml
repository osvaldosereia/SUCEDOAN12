name: One-shot Admin order WhatsApp gateway integration

on:
  push:
    branches: [feat/admin-order-whatsapp-main-integration-20261001]
    paths:
      - 'scripts/patch-admin-order-whatsapp-gateway-main.py'
      - '.github/workflows/one-shot-admin-order-whatsapp-gateway-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-order-whatsapp-main-integration-20261001
          fetch-depth: 2
      - name: Apply deterministic gateway patch
        run: python3 scripts/patch-admin-order-whatsapp-gateway-main.py
      - name: Integration contract
        run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
      - name: Inline Admin JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`vitrine/admin/index.html inline script ${i+1}: ${e.message}`)}});
          console.log(`inline syntax OK (${scripts.length} script blocks)`);
          NODE
      - name: Diff check
        run: git diff --check
      - name: Commit patched gateway
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/admin-products-live-v1/index.ts
          if git diff --cached --quiet; then
            echo 'Gateway patch already applied; nothing to commit.'
          else
            git commit -m 'feat: expose order WhatsApp actions through Admin gateway'
            git push origin HEAD:feat/admin-order-whatsapp-main-integration-20261001
          fi
