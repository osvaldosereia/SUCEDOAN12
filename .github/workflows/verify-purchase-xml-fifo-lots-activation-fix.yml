name: Verify purchase XML lot activation fix

on:
  push:
    branches:
      - feat/purchase-xml-fifo-lots-v1
    paths:
      - 'scripts/verify_purchase_xml_fifo_lots_v1.py'
      - 'supabase/migrations/20261004033500_purchase_xml_fifo_lots_activation_fix_v1.sql'
      - '.github/workflows/verify-purchase-xml-fifo-lots-activation-fix.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_purchase_xml_fifo_lots_v1.py
