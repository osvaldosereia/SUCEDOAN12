name: Aplicar cadastro temático de canecas V9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-caneca-cadastro-v9-once.yml'
      - 'scripts/patch-caneca-cadastro-v9-once.mjs'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Aplicar patch controlado
        run: node scripts/patch-caneca-cadastro-v9-once.mjs
      - name: Validar Criador de Canecas
        run: node scripts/test-mug-studio-loader.mjs
      - name: Validar Caneca Print
        run: node scripts/test-caneca-print.mjs
      - name: Validar Admin
        run: node scripts/test-admin-v2-definitivo.mjs
      - name: Publicar alterações
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add producao-v2/js/mug-personalizer-v7.js producao-v2/js/mug-studio-gallery.js producao-v2/js/mug-make-native-openai-bridge.js producao-v2/js/mug-studio-v8-finalizer.js caneca-print/index.html scripts/sync-canecas-cache.mjs scripts/test-mug-studio-loader.mjs scripts/test-caneca-print.mjs producao/index.html admin/index.html
          git commit -m 'Criador de Canecas V9: cadastro temático completo'
          git pull --rebase origin main
          git push origin HEAD:main
