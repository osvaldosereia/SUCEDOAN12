name: Testar Imagens IA no Admin oficial

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'scripts/test-admin-images-no-v3.mjs'
      - '.github/workflows/test-admin-images-no-v3.yml'
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'scripts/test-admin-images-no-v3.mjs'
      - '.github/workflows/test-admin-images-no-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Garantir que Imagens IA não depende do Admin V3
        run: node scripts/test-admin-images-no-v3.mjs
