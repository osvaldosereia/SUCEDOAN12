name: Testar stack atual de canecas

on:
  push:
    branches: [main]
    paths:
      - 'producao-v2/js/navigation-v12.js'
      - 'producao-v2/js/catalog-auto-sync.js'
      - 'producao-v2/js/mug-product-media-enhancement-v19.js'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
      - 'producao-v2/js/mug-personalizer-v15-clean.js'
      - 'producao-v2/js/mug-studio-gallery.js'
      - 'producao-v2/js/mug-studio-v8-finalizer.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-personalization-v5.js'
      - 'ceneca10/index.html'
      - 'ceneca10/app-v4-clean.js'
      - 'shared/mug-make-fast-ack-v1.js'
      - 'scripts/test-mug-make-stack-v14.mjs'
      - '.github/workflows/test-mug-make-stack-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mug-stack-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar Produção, Caneca10 e site público
        run: node scripts/test-mug-make-stack-v14.mjs
