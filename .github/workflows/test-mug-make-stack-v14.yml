name: Testar stack de canecas V14

on:
  push:
    branches: [main]
    paths:
      - 'producao-v2/js/mug-make-client-guard-v14.js'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
      - 'app-next/src/mug-make-client-guard-v3.js'
      - 'app-next/src/config.js'
      - 'app-next/src/mug-public-personalization-v2.js'
      - 'ceneca10/make-client-guard-v5.js'
      - 'ceneca10/index.html'
      - 'ceneca10/app-v2.js'
      - 'scripts/test-mug-make-stack-v14.mjs'
      - '.github/workflows/test-mug-make-stack-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mug-make-stack-v14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar Produção Caneca10 e site público
        run: node scripts/test-mug-make-stack-v14.mjs
