name: One-shot basket family helper patch

on:
  push:
    branches:
      - fix/product-suggestions-family-only-20261004
    paths:
      - .github/workflows/one-shot-basket-product-suggestions-api.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Align family helper through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: fix/product-suggestions-family-only-20261004
        run: |
          node <<'NODE'
          const https=require('https');
          const {Buffer}=require('buffer');
          const token=process.env.GH_TOKEN,repo=process.env.REPO,branch=process.env.BRANCH;
          function req(method,path,body){return new Promise((resolve,reject)=>{const r=https.request({hostname:'api.github.com',path,method,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'family-helper-patch','Content-Type':'application/json'}},res=>{let s='';res.on('data',d=>s+=d);res.on('end',()=>{if(res.statusCode<200||res.statusCode>=300)return reject(new Error(`${res.statusCode}: ${s.slice(0,500)}`));resolve(JSON.parse(s))})});r.on('error',reject);if(body)r.write(JSON.stringify(body));r.end()})}
          async function getFile(path){const x=await req('GET',`/repos/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`);return {sha:x.sha,text:Buffer.from(x.content.replace(/\n/g,''),'base64').toString('utf8')}}
          async function putFile(path,sha,text){return req('PUT',`/repos/${repo}/contents/${path}`,{message:'fix: alinhar helper à regra explícita de família',content:Buffer.from(text).toString('base64'),sha,branch})}
          (async()=>{
            const path='supabase/functions/admin-products-live-v1/index.ts';
            const f=await getFile(path);let src=f.text;
            const re=/async function basketKitSuggestions\(base:any,products:any\[\],loose:Map<string,any>,qty:number,catalog:Map<string,string>,priceVariation=15\)\{[\s\S]*?\n\}/;
            if(!re.test(src))throw new Error('basketKitSuggestions helper not found');
            src=src.replace(re,`async function basketKitSuggestions(base:any,products:any[],loose:Map<string,any>,qty:number,catalog:Map<string,string>,priceVariation=15){\n  const family=catalog.get(String(base?.id));if(!family)return [];\n  const basePrice=Number(base?.price||0),scored:any[]=[];\n  for(const cand of products){\n    if(String(cand.id)===String(base?.id)||catalog.get(String(cand.id))!==family)continue;\n    const available=Number(loose.get(String(cand.id))?.loose_sellable_stock||0),candidatePrice=Number(cand.price||0);\n    scored.push({...cand,loose_stock:available,price_cents:Math.round(candidatePrice*100),capacity:qty>0?Math.floor(available/qty):0,price_delta_pct:basePrice>0?Math.abs(candidatePrice-basePrice)/basePrice*100:null});\n  }\n  scored.sort((a:any,b:any)=>{const aa=Number(a.loose_stock||0)>0?1:0,bb=Number(b.loose_stock||0)>0?1:0,ad=Number.isFinite(Number(a.price_delta_pct))?Number(a.price_delta_pct):Number.POSITIVE_INFINITY,bd=Number.isFinite(Number(b.price_delta_pct))?Number(b.price_delta_pct):Number.POSITIVE_INFINITY;return bb-aa||Number(b.loose_stock||0)-Number(a.loose_stock||0)||ad-bd||String(a.name).localeCompare(String(b.name),\"pt-BR\")});\n  return scored;\n}`);
            if(src.includes('return scored.slice(0,7)'))throw new Error('legacy helper truncation remains');
            await putFile(path,f.sha,src);
            console.log('BASKET_FAMILY_HELPER_PATCH_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
