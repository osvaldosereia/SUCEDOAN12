name: Basket mold admin
on:
  pull_request:
    paths:
      - 'index.html'
      - 'vitrine/admin/runtime-src/01-core-navigation.part.js.txt'
      - 'vitrine/admin/runtime-src/03-operations.part.js.txt'
      - 'vitrine/admin/runtime-src/09-bootstrap.part.js.txt'
      - 'vitrine/admin/admin-runtime.js'
      - 'vitrine/admin/index.html'
      - 'supabase/migrations/20261023190000_basket_admin_selected_product_active_status.sql'
      - 'scripts/test-basket-admin-carousel-product-status.mjs'
      - 'vitrine/admin/basket-admin-section.js'
      - 'vitrine/admin/basket-mold-admin.js'
      - 'vitrine/admin/basket-admin-*.js'
      - 'supabase/functions/admin-basket-configuration-v1/**'
      - 'supabase/functions/storefront-v2/index.ts'
      - 'supabase/functions/storefront-v2/basket-lightweight.js'
      - 'scripts/test-storefront-basket-lightweight.mjs'
      - 'supabase/migrations/20261023120000_basket_admin_three_tabs.sql'
      - 'supabase/migrations/20261023160000_basket_quantity_save_merge_duplicates.sql'
      - 'supabase/migrations/20261023180000_basket_admin_save_inactive_carousel_options.sql'
      - 'scripts/test-basket-admin-three-tabs.mjs'
      - 'scripts/test-basket-admin-inactive-carousel-options.mjs'
      - 'supabase/functions/admin-basket-molds-v1/**'
      - 'supabase/sql/20261006_basket_mold_admin_v1.sql'
      - 'supabase/migrations/20261006070000_basket_mold_admin_v1.sql'
      - 'scripts/test-basket-mold-admin-v1.mjs'
      - 'scripts/test-basket-mold-admin-browser-v1.mjs'
      - 'scripts/test-basket-mold-conditional-hidden-v1.mjs'
      - 'supabase/migrations/20261007114941_basket_mold_conditional_hidden_adjustment_v1.sql'
      - '.github/workflows/basket-mold-admin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vitrine/admin/runtime-src/01-core-navigation.part.js.txt'
      - 'vitrine/admin/runtime-src/03-operations.part.js.txt'
      - 'vitrine/admin/runtime-src/09-bootstrap.part.js.txt'
      - 'vitrine/admin/admin-runtime.js'
      - 'vitrine/admin/index.html'
      - 'supabase/migrations/20261023190000_basket_admin_selected_product_active_status.sql'
      - 'scripts/test-basket-admin-carousel-product-status.mjs'
      - 'vitrine/admin/basket-admin-section.js'
      - 'vitrine/admin/basket-mold-admin.js'
      - 'vitrine/admin/basket-admin-*.js'
      - 'supabase/functions/admin-basket-configuration-v1/**'
      - 'supabase/functions/storefront-v2/index.ts'
      - 'supabase/functions/storefront-v2/basket-lightweight.js'
      - 'scripts/test-storefront-basket-lightweight.mjs'
      - 'supabase/migrations/20261023120000_basket_admin_three_tabs.sql'
      - 'supabase/migrations/20261023160000_basket_quantity_save_merge_duplicates.sql'
      - 'supabase/migrations/20261023180000_basket_admin_save_inactive_carousel_options.sql'
      - 'scripts/test-basket-admin-three-tabs.mjs'
      - 'scripts/test-basket-admin-inactive-carousel-options.mjs'
      - 'supabase/functions/admin-basket-molds-v1/**'
      - 'supabase/sql/20261006_basket_mold_admin_v1.sql'
      - 'supabase/migrations/20261006070000_basket_mold_admin_v1.sql'
      - 'scripts/test-basket-mold-admin-v1.mjs'
      - 'scripts/test-basket-mold-admin-browser-v1.mjs'
      - 'scripts/test-basket-mold-conditional-hidden-v1.mjs'
      - 'supabase/migrations/20261007114941_basket_mold_conditional_hidden_adjustment_v1.sql'
      - '.github/workflows/basket-mold-admin-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-basket-mold-admin-v1.mjs
      - run: node scripts/test-basket-admin-three-tabs.mjs
      - run: node scripts/test-storefront-basket-lightweight.mjs
      - run: node scripts/test-basket-admin-carousel-product-status.mjs
      - run: node scripts/test-basket-admin-inactive-carousel-options.mjs
      - run: node scripts/test-basket-mold-conditional-hidden-v1.mjs
      - run: npm install --prefix "$RUNNER_TEMP/basket-mold-admin-tests" --no-save --package-lock=false playwright@1.62.1
      - run: node "$RUNNER_TEMP/basket-mold-admin-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/test-basket-mold-admin-browser-v1.mjs
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/basket-mold-admin-tests/node_modules/playwright
