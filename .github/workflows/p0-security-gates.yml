name: P0 security gates
on:
  pull_request:
    paths:
      - 'supabase/functions/admin-pin-auth-v1/index.ts'
      - 'supabase/functions/admin-service-intelligence-v1/index.ts'
      - 'vitrine/admin/**'
      - 'montar/**'
      - 'orcamento/**'
      - 'scripts/test-p0-security-gates.mjs'
      - 'scripts/test-admin-attendance-auth-refresh-v1.mjs'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check vitrine/admin/admin-secure-auth.js
      - run: node --check montar/app.js
      - run: node --check vitrine/admin/atendimento/attendance-auth.js
      - run: node scripts/test-p0-security-gates.mjs
      - run: node scripts/test-admin-attendance-auth-refresh-v1.mjs
      - run: node scripts/test-montar-picking-v1.mjs
