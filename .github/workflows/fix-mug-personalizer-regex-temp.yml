name: Correção temporária do personalizador de canecas

on:
  push:
    branches:
      - fix/mug-studio-fast-load-20260824
    paths:
      - '.github/workflows/fix-mug-personalizer-regex-temp.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mug-studio-fast-load-20260824
      - name: Restaurar escape de aspas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('producao-v2/js/mug-personalizer-v7.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          replacement = """  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&#039;');"""
          changed = False
          for index, line in enumerate(lines):
              if "return String(value ?? '').replace(/&/g" in line:
                  if line != replacement:
                      lines[index] = replacement
                      changed = True
                  break
          else:
              raise SystemExit('Linha escapeHtml não encontrada')
          if not changed:
              raise SystemExit('escapeHtml já estava correto')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add producao-v2/js/mug-personalizer-v7.js
          git commit -m 'Canecas: corrige escape HTML do personalizador'
          git push origin HEAD:fix/mug-studio-fast-load-20260824
