name: Testar Caneca 10 Interno

on:
  push:
    branches: [main]
    paths:
      - 'caneca10/**'
      - 'shared/mug-make-fast-ack-v1.js'
      - 'scripts/test-caneca10-internal.mjs'
      - '.github/workflows/test-caneca10-internal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caneca10-interno-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar Caneca 10 interno
        run: node scripts/test-caneca10-internal.mjs
