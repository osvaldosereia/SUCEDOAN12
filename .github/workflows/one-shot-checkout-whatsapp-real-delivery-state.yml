name: One-shot checkout WhatsApp real delivery state

on:
  push:
    branches:
      - fix/checkout-whatsapp-real-delivery-state-20261002

permissions:
  contents: write

jobs:
  contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkout-whatsapp-real-delivery-state-20261002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: python scripts/patch-checkout-whatsapp-real-delivery-state.py
      - name: Real delivery-state contract
        run: node scripts/test-checkout-whatsapp-real-delivery-state.mjs
      - name: TypeScript syntax sanity
        run: npx --yes esbuild supabase/functions/admin-orders-v1/index.ts --bundle --platform=neutral --format=esm --external:jsr:* --external:npm:* --outfile=/tmp/admin-orders.js
      - name: Diff check
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-orders-v1/index.ts
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
          else
            git commit -m 'fix(whatsapp): confirm sent only after wamid'
            git push
          fi
