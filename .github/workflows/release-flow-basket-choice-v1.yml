name: Release WhatsApp Basket Choice V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'whatsapp/flows/flow-cestas-escolha-v1.json'
      - '.github/workflows/release-flow-basket-choice-v1.yml'

permissions:
  contents: read

concurrency:
  group: release-whatsapp-basket-choice-v1
  cancel-in-progress: false

jobs:
  meta-release:
    runs-on: ubuntu-latest
    env:
      GRAPH_VERSION: v26.0
      WABA_ID: '840102181903253'
      SOURCE_FLOW_ID: '1374238777748633'
      FLOW_NAME: 'Dona Antônia - Escolha de Cesta V1'
      ENDPOINT_URI: 'https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/whatsapp-flow-data-exchange-v1'
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate simple basket flow locally
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool whatsapp/flows/flow-cestas-escolha-v1.json >/dev/null
          python - <<'PY'
          import json
          f=json.load(open('whatsapp/flows/flow-cestas-escolha-v1.json',encoding='utf-8'))
          assert f['version']=='7.3'
          assert f['data_api_version']=='3.0'
          assert [s['id'] for s in f['screens']]==['CESTAS','DETALHE','ENVIADO']
          assert f['routing_model']=={'CESTAS':['DETALHE'],'DETALHE':['ENVIADO'],'ENVIADO':[]}
          assert f['screens'][2].get('terminal') is True
          nav=next(c for c in f['screens'][0]['layout']['children'] if c.get('type')=='NavigationList')
          assert nav['list-items']=='${data.baskets}'
          form=next(c for c in f['screens'][1]['layout']['children'] if c.get('type')=='Form')
          radios=next(c for c in form['children'] if c.get('type')=='RadioButtonsGroup')
          footer=next(c for c in form['children'] if c.get('type')=='Footer')
          assert radios['name']=='decision'
          assert footer['label']=='Enviar'
          print('simple_photo_basket_flow_ok')
          PY

      - name: Require Meta token
        shell: bash
        run: |
          test -n "$META_ACCESS_TOKEN" || { echo 'META_ACCESS_TOKEN GitHub secret is missing' >&2; exit 2; }

      - name: Resolve or create Meta draft
        id: flow
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -sS --fail-with-body -H "Authorization: Bearer $META_ACCESS_TOKEN" "https://graph.facebook.com/$GRAPH_VERSION/$WABA_ID/flows?fields=id,name,status&limit=100")
          FLOW_ID=$(printf '%s' "$LIST" | jq -r --arg NAME "$FLOW_NAME" '.data[]? | select(.name==$NAME) | .id' | head -n1)
          STATUS=$(printf '%s' "$LIST" | jq -r --arg NAME "$FLOW_NAME" '.data[]? | select(.name==$NAME) | .status' | head -n1)
          if [ -z "$FLOW_ID" ]; then
            CREATED=$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $META_ACCESS_TOKEN" \
              --data-urlencode "name=$FLOW_NAME" \
              --data-urlencode 'categories=["OTHER"]' \
              --data-urlencode "clone_flow_id=$SOURCE_FLOW_ID" \
              --data-urlencode "endpoint_uri=$ENDPOINT_URI" \
              "https://graph.facebook.com/$GRAPH_VERSION/$WABA_ID/flows")
            FLOW_ID=$(printf '%s' "$CREATED" | jq -r '.id // empty')
            test -n "$FLOW_ID"
            STATUS=DRAFT
          fi
          echo "flow_id=$FLOW_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "META_FLOW_ID=$FLOW_ID"
          echo "META_INITIAL_STATUS=$STATUS"

      - name: Upload and validate Flow JSON
        if: steps.flow.outputs.status != 'PUBLISHED'
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" \
            -F 'asset_type=FLOW_JSON' \
            -F 'name=flow.json' \
            -F 'file=@whatsapp/flows/flow-cestas-escolha-v1.json;type=application/json' \
            "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID/assets")
          echo "$RESPONSE" | jq .
          test "$(printf '%s' "$RESPONSE" | jq -r '.success // false')" = true
          test "$(printf '%s' "$RESPONSE" | jq -c '.validation_errors // [])'" = '[]'

      - name: Verify metadata before publish
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          META=$(curl -sS --fail-with-body -H "Authorization: Bearer $META_ACCESS_TOKEN" "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID?fields=id,name,status,validation_errors,json_version,data_api_version,data_channel_uri")
          echo "$META" | jq .
          test "$(printf '%s' "$META" | jq -c '.validation_errors // [])'" = '[]'
          test "$(printf '%s' "$META" | jq -r '.data_channel_uri // empty')" = "$ENDPOINT_URI"

      - name: Publish validated Flow
        if: steps.flow.outputs.status != 'PUBLISHED'
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          RESPONSE=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $META_ACCESS_TOKEN" "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID/publish")
          echo "$RESPONSE" | jq .
          test "$(printf '%s' "$RESPONSE" | jq -r '.success // false')" = true

      - name: Final Meta check
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          META=$(curl -sS --fail-with-body -H "Authorization: Bearer $META_ACCESS_TOKEN" "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID?fields=id,name,status,validation_errors,json_version,data_api_version,data_channel_uri,health_status")
          echo "$META" | jq .
          test "$(printf '%s' "$META" | jq -r '.status')" = 'PUBLISHED'
          test "$(printf '%s' "$META" | jq -c '.validation_errors // [])'" = '[]'
          echo "META_FLOW_ID=$FLOW_ID"
          echo 'META_RELEASE_READY=true'