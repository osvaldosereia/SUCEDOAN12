name: Admin Geral contracts

on:
  push:
    branches:
      - admin-geral-r1-r16-autonomous-20260919
      - supabase-only-admin-migration-20260921
    paths:
      - 'admin/**'
      - 'video/**'
      - 'contagem/**'
      - 'kit-mobile/**'
      - 'cesta-mobile/**'
      - 'validades/**'
      - 'cadastro/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/test-supabase-only-phase1.mjs'
      - 'docs/projects/supabase-only/**'
      - 'tests/admin-*.test.mjs'
      - 'docs/projects/admin-geral/**'
      - '.github/workflows/admin-geral-contracts.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'video/**'
      - 'contagem/**'
      - 'kit-mobile/**'
      - 'cesta-mobile/**'
      - 'validades/**'
      - 'cadastro/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/test-supabase-only-phase1.mjs'
      - 'docs/projects/supabase-only/**'
      - 'tests/admin-*.test.mjs'
      - 'docs/projects/admin-geral/**'
      - '.github/workflows/admin-geral-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R2 design system
        run: node tests/admin-design-system-v2-contract.test.mjs
      - name: R1 navigation
        run: node tests/admin-general-navigation-contract.test.mjs
      - name: R3 context navigation
        run: node tests/admin-r3-context-nav-contract.test.mjs
      - name: R10 customer
        run: node tests/admin-r10-customer-v2-contract.test.mjs
      - name: R11 operations
        run: node tests/admin-r11-operations-v2-contract.test.mjs
      - name: R12 creative
        run: node tests/admin-r12-creative-v2-contract.test.mjs
      - name: R13 marketing
        run: node tests/admin-r13-marketing-v2-contract.test.mjs
      - name: R14 operations
        run: node tests/admin-r14-operations-v2-contract.test.mjs
      - name: R15 systems
        run: node tests/admin-r15-systems-v2-contract.test.mjs
      - name: R16 final fail-closed audit
        run: node tests/admin-r16-final-contract.test.mjs
      - name: Visual standard V3
        run: node tests/admin-visual-standard-v3-contract.test.mjs
      - name: Global shell V3
        run: node tests/admin-global-shell-v3-contract.test.mjs
      - name: Order separation print
        run: node tests/admin-order-separation-print-v1-contract.test.mjs
      - name: Supabase-only phase 1
        run: node scripts/test-supabase-only-phase1.mjs
