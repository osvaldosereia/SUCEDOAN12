name: Admin Geral contracts

on:
  push:
    branches:
      - admin-geral-r1-r16-autonomous-20260919
    paths:
      - 'admin/**'
      - 'video/**'
      - 'tests/admin-*.test.mjs'
      - 'docs/projects/admin-geral/**'
      - '.github/workflows/admin-geral-contracts.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'video/**'
      - 'tests/admin-*.test.mjs'
      - 'docs/projects/admin-geral/**'
      - '.github/workflows/admin-geral-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R2 design system
        run: node tests/admin-design-system-v2-contract.test.mjs
      - name: R1 navigation
        run: node tests/admin-general-navigation-contract.test.mjs
      - name: R3 context navigation
        run: node tests/admin-r3-context-nav-contract.test.mjs
      - name: R10 customer
        run: node tests/admin-r10-customer-v2-contract.test.mjs
      - name: R11 operations
        run: node tests/admin-r11-operations-v2-contract.test.mjs
      - name: R12 creative
        run: node tests/admin-r12-creative-v2-contract.test.mjs
      - name: R13 marketing
        run: node tests/admin-r13-marketing-v2-contract.test.mjs
      - name: R14 operations
        run: node tests/admin-r14-operations-v2-contract.test.mjs
      - name: R15 systems
        run: node tests/admin-r15-systems-v2-contract.test.mjs
      - name: R16 final fail-closed audit
        run: node tests/admin-r16-final-contract.test.mjs
