name: XML Field Apply CAS R16
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/projects/purchase-xml-field-apply-r16.sql'
      - 'scripts/fixtures/xml-field-review-ledger-r14.sql'
      - 'scripts/test-xml-field-apply-r16.mjs'
      - 'scripts/test-xml-field-apply-r16.pg.sql'
      - '.github/workflows/xml-field-apply-r16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source safety contract and forbidden write checks
        run: node scripts/test-xml-field-apply-r16.mjs
      - name: Disposable PostgreSQL 17 CAS apply and rollback tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f scripts/test-xml-field-apply-r16.pg.sql
