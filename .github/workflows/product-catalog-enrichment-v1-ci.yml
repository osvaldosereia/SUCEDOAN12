name: product-catalog-enrichment-v1
on:
  pull_request:
    paths:
      - "vitrine/admin/**"
      - "supabase/functions/admin-products-live-v1/**"
      - "supabase/functions/product-catalog-enrichment-v1/**"
      - "supabase/migrations/20261021190000_product_catalog_enrichment_v1.sql"
      - "scripts/test-product-catalog-enrichment-v1.mjs"
      - "scripts/build-vitrine-admin-runtime.py"
      - ".github/workflows/product-catalog-enrichment-v1-ci.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-product-catalog-enrichment-v1.mjs
      - run: node --check vitrine/admin/admin-runtime.js
      - run: python3 scripts/build-vitrine-admin-runtime.py --check
      - run: git diff --check
