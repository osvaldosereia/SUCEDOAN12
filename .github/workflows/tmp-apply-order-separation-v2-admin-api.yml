name: Temporary apply separation Admin API

on:
  push:
    branches: [feat/order-separation-v2]
    paths:
      - 'scripts/apply-order-separation-v2-admin-api.py'
      - '.github/workflows/tmp-apply-order-separation-v2-admin-api.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-separation-v2
          fetch-depth: 2
      - name: Apply deterministic patch
        run: python scripts/apply-order-separation-v2-admin-api.py
      - name: Verify separation contracts
        run: |
          node scripts/test-order-separation-v2-schema.mjs
          node scripts/test-order-separation-v2-completion.mjs
          node scripts/test-order-separation-v2-admin-api.mjs
      - name: Verify no regression in existing order contracts
        run: |
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node scripts/test-order-public-summary.mjs
          node scripts/test-admin-order-public-vitrine.mjs
          node scripts/test-order-public-vitrine-print.mjs
          node scripts/test-public-order-triple-tap-separation-v1.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified target and clean temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-products-live-v1/index.ts
          git rm scripts/apply-order-separation-v2-admin-api.py .github/workflows/tmp-apply-order-separation-v2-admin-api.yml
          git commit -m "feat(admin-api): orchestrate order separation completion"
          git push origin HEAD:feat/order-separation-v2
