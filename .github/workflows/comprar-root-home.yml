name: Vitrine na raiz

on:
  pull_request:
    paths:
      - 'index.html'
      - 'vitrine/**'
      - 'scripts/test-comprar-root-home-v1.mjs'
      - 'scripts/test-vitrine-whatsapp-handoff-v1.mjs'
      - 'scripts/test-vitrine-sales-rules-v1.mjs'
      - 'supabase/functions/simple-storefront-v1/**'
      - 'supabase/functions/vitrine-admin-v1/**'
      - 'supabase/migrations/*stock*'
      - '.github/workflows/comprar-root-home.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vitrine/**'
      - 'scripts/test-comprar-root-home-v1.mjs'
      - 'scripts/test-vitrine-whatsapp-handoff-v1.mjs'
      - 'scripts/test-vitrine-sales-rules-v1.mjs'
      - 'supabase/functions/simple-storefront-v1/**'
      - 'supabase/functions/vitrine-admin-v1/**'
      - 'supabase/migrations/*stock*'
      - '.github/workflows/comprar-root-home.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar Vitrine pública e handoff do WhatsApp
        run: |
          node scripts/test-comprar-root-home-v1.mjs
          node scripts/test-vitrine-whatsapp-handoff-v1.mjs
          node scripts/test-vitrine-sales-rules-v1.mjs
