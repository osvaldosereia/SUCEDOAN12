name: Vitrine na raiz

on:
  pull_request:
    paths:
      - 'index.html'
      - 'vitrine/**'
      - 'scripts/test-comprar-root-home-v1.mjs'
      - 'scripts/test-vitrine-whatsapp-handoff-v1.mjs'
      - 'scripts/test-vitrine-sales-rules-v1.mjs'
      - 'scripts/test-vitrine-customer-history-v1.mjs'
      - 'scripts/test-vitrine-bling-hub-v2.mjs'
      - 'scripts/test-vitrine-admin-operational-ux-v1.mjs'
      - 'scripts/test-vitrine-admin-order-transitions-v1.mjs'
      - 'scripts/test-vitrine-admin-expedition-v1.mjs'
      - 'scripts/test-vitrine-admin-order-prerequisites-v1.mjs'
      - 'scripts/test-vitrine-admin-delivery-shortcuts-v1.mjs'
      - 'scripts/test-vitrine-admin-customer-picker-v1.mjs'
      - 'scripts/test-vitrine-admin-priority-queue-v1.mjs'
      - 'scripts/test-vitrine-admin-delivery-editor-v1.mjs'
      - 'scripts/test-vitrine-admin-today-semantics-v1.mjs'
      - 'scripts/test-vitrine-admin-closure-v1.mjs'
      - 'scripts/test-vitrine-admin-payment-confirm-v1.mjs'
      - 'scripts/test-vitrine-admin-bling-exceptions-v1.mjs'
      - 'scripts/test-vitrine-admin-bulk-dispatch-v1.mjs'
      - 'scripts/test-vitrine-admin-quick-delivery-v1.mjs'
      - 'scripts/test-vitrine-admin-dispatch-manifest-v1.mjs'
      - 'scripts/test-vitrine-admin-bling-preflight-v1.mjs'
      - 'scripts/test-bling-hub-data-safety-v1.mjs'
      - 'scripts/test-vitrine-bling-product-create-v1.mjs'
      - 'supabase/functions/simple-storefront-v1/**'
      - 'supabase/functions/vitrine-admin-v1/**'
      - 'supabase/functions/_shared/vitrine-history-sync-v1.ts'
      - 'supabase/functions/admin-service-intelligence-v1/**'
      - 'supabase/migrations/*stock*'
      - 'supabase/migrations/*vitrine_history*'
      - 'supabase/migrations/*bling_hub_v2*'
      - 'supabase/migrations/*fiscal*'
      - '.github/workflows/comprar-root-home.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vitrine/**'
      - 'scripts/test-comprar-root-home-v1.mjs'
      - 'scripts/test-vitrine-whatsapp-handoff-v1.mjs'
      - 'scripts/test-vitrine-sales-rules-v1.mjs'
      - 'scripts/test-vitrine-customer-history-v1.mjs'
      - 'scripts/test-vitrine-bling-hub-v2.mjs'
      - 'scripts/test-vitrine-admin-operational-ux-v1.mjs'
      - 'scripts/test-vitrine-admin-order-transitions-v1.mjs'
      - 'scripts/test-vitrine-admin-expedition-v1.mjs'
      - 'scripts/test-vitrine-admin-order-prerequisites-v1.mjs'
      - 'scripts/test-vitrine-admin-delivery-shortcuts-v1.mjs'
      - 'scripts/test-vitrine-admin-customer-picker-v1.mjs'
      - 'scripts/test-vitrine-admin-priority-queue-v1.mjs'
      - 'scripts/test-vitrine-admin-delivery-editor-v1.mjs'
      - 'scripts/test-vitrine-admin-today-semantics-v1.mjs'
      - 'scripts/test-vitrine-admin-closure-v1.mjs'
      - 'scripts/test-vitrine-admin-payment-confirm-v1.mjs'
      - 'scripts/test-vitrine-admin-bling-exceptions-v1.mjs'
      - 'scripts/test-vitrine-admin-bulk-dispatch-v1.mjs'
      - 'scripts/test-vitrine-admin-quick-delivery-v1.mjs'
      - 'scripts/test-vitrine-admin-dispatch-manifest-v1.mjs'
      - 'scripts/test-vitrine-admin-bling-preflight-v1.mjs'
      - 'scripts/test-bling-hub-data-safety-v1.mjs'
      - 'scripts/test-vitrine-bling-product-create-v1.mjs'
      - 'supabase/functions/simple-storefront-v1/**'
      - 'supabase/functions/vitrine-admin-v1/**'
      - 'supabase/functions/_shared/vitrine-history-sync-v1.ts'
      - 'supabase/functions/admin-service-intelligence-v1/**'
      - 'supabase/migrations/*stock*'
      - 'supabase/migrations/*vitrine_history*'
      - 'supabase/migrations/*bling_hub_v2*'
      - 'supabase/migrations/*fiscal*'
      - '.github/workflows/comprar-root-home.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar Vitrine pública, WhatsApp, regras e histórico
        run: |
          node scripts/test-comprar-root-home-v1.mjs
          node scripts/test-vitrine-whatsapp-handoff-v1.mjs
          node scripts/test-vitrine-sales-rules-v1.mjs
          node scripts/test-vitrine-customer-history-v1.mjs
          node scripts/test-vitrine-bling-hub-v2.mjs
          node scripts/test-vitrine-admin-operational-ux-v1.mjs
          node scripts/test-vitrine-admin-order-transitions-v1.mjs
          node scripts/test-vitrine-admin-expedition-v1.mjs
          node scripts/test-vitrine-admin-order-prerequisites-v1.mjs
          node scripts/test-vitrine-admin-delivery-shortcuts-v1.mjs
          node scripts/test-vitrine-admin-customer-picker-v1.mjs
          node scripts/test-vitrine-admin-priority-queue-v1.mjs
          node scripts/test-vitrine-admin-delivery-editor-v1.mjs
          node scripts/test-vitrine-admin-today-semantics-v1.mjs
          node scripts/test-vitrine-admin-closure-v1.mjs
          node scripts/test-vitrine-admin-payment-confirm-v1.mjs
          node scripts/test-vitrine-admin-bling-exceptions-v1.mjs
          node scripts/test-vitrine-admin-bulk-dispatch-v1.mjs
          node scripts/test-vitrine-admin-quick-delivery-v1.mjs
          node scripts/test-vitrine-admin-dispatch-manifest-v1.mjs
          node scripts/test-vitrine-admin-bling-preflight-v1.mjs
          node scripts/test-bling-hub-data-safety-v1.mjs
          node scripts/test-vitrine-bling-product-create-v1.mjs
