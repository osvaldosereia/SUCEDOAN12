name: Comprar na raiz

on:
  pull_request:
    paths:
      - 'index.html'
      - 'comprar/**'
      - 'scripts/test-comprar-root-home-v1.mjs'
      - 'scripts/test-comprar-clean-activation-v1.mjs'
      - '.github/workflows/comprar-root-home.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'comprar/**'
      - 'scripts/test-comprar-root-home-v1.mjs'
      - 'scripts/test-comprar-clean-activation-v1.mjs'
      - '.github/workflows/comprar-root-home.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar raiz usando Comprar
        run: |
          node scripts/test-comprar-root-home-v1.mjs
          node scripts/test-comprar-clean-activation-v1.mjs
          node --check comprar/app.js
          node --check comprar/baskets.js
          node --check comprar/products.js
          node --check comprar/checkout.js
          node --check comprar/help.js
          node --check comprar/admin-test-bridge.js
