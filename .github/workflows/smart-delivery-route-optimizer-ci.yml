name: Smart Delivery Route Optimizer CI
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/smart-delivery-*.mjs'
      - 'supabase/functions/_shared/google-service-account-auth.mjs'
      - 'supabase/functions/smart-delivery-optimize-v1/**'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'scripts/test-smart-delivery-google-*.mjs'
      - 'scripts/test-smart-delivery-optimizer-admin-v1.mjs'
      - '.github/workflows/smart-delivery-route-optimizer-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/smart-delivery-*.mjs'
      - 'supabase/functions/_shared/google-service-account-auth.mjs'
      - 'supabase/functions/smart-delivery-optimize-v1/**'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'scripts/test-smart-delivery-google-*.mjs'
      - 'scripts/test-smart-delivery-optimizer-admin-v1.mjs'
      - '.github/workflows/smart-delivery-route-optimizer-ci.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-smart-delivery-google-adapter-v1.mjs
      - run: node scripts/test-smart-delivery-google-auth-v1.mjs
      - run: node scripts/test-smart-delivery-optimizer-admin-v1.mjs
