name: Admin service outcome telemetry CI
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/admin-service-intelligence-v1/**"
      - "scripts/test-admin-service-outcome-telemetry.mjs"
      - ".github/workflows/admin-service-outcome-telemetry-ci.yml"
      - "docs/projects/dona-antonia-operations-2/HANDOFF.md"
      - "docs/projects/dona-antonia-operations-2/IMPLEMENTATION-ROADMAP.md"
  push:
    branches: [main]
    paths:
      - "supabase/functions/admin-service-intelligence-v1/**"
      - "scripts/test-admin-service-outcome-telemetry.mjs"
      - ".github/workflows/admin-service-outcome-telemetry-ci.yml"
      - "docs/projects/dona-antonia-operations-2/HANDOFF.md"
      - "docs/projects/dona-antonia-operations-2/IMPLEMENTATION-ROADMAP.md"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-admin-service-outcome-telemetry.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The monolithic legacy entrypoint has existing type diagnostics; check the new helper and dispatcher contract separately.
      - run: deno check supabase/functions/admin-service-intelligence-v1/_shared/admin-service-outcome-telemetry.mjs
