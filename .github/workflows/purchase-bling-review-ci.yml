name: Compras XML aviso conferência Bling
on:
  pull_request:
    branches: [main]
    paths:
      - 'vitrine/admin/index.html'
      - 'vitrine/admin/runtime-parts/10-purchase-finance.part.js'
      - 'supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts'
      - 'supabase/functions/purchase-xml-v1/index.ts'
      - 'supabase/migrations/20261012190000_purchase_bling_received_review_v1.sql'
      - 'scripts/test-purchase-bling-review-v1.mjs'
      - '.github/workflows/purchase-bling-review-ci.yml'
permissions:
  contents: read
jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/test-purchase-bling-review-v1.mjs
