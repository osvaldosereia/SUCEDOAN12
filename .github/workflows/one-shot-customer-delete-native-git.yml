name: One-shot customer delete native git

on:
  push:
    branches:
      - fix/customer-delete-live-compat-20261004
    paths:
      - .github/workflows/one-shot-customer-delete-native-git.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch with native git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin fix/customer-delete-live-compat-20261004
          git checkout -B fix/customer-delete-live-compat-20261004 FETCH_HEAD
      - name: Patch and verify customer deletion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vitrine/admin/index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('async function deleteCustomer(')
          segment = text[start:start + 6000]

          old_request = "await customerApi('vitrine_customer_delete',{id});"
          new_request = "await customerApi('vitrine_customer_delete',{id,customer_id:id});"
          assert segment.count(old_request) == 1, f'expected one delete request, got {segment.count(old_request)}'
          segment = segment.replace(old_request, new_request, 1)

          old_catch = "}catch(e){\n      toast(errorMessage(e.message));\n    }"
          new_catch = "}catch(e){\n      console.error('customer_delete_failed',e);\n      toast('Não foi possível excluir o cadastro.');\n    }"
          assert segment.count(old_catch) == 1, f'expected one delete catch, got {segment.count(old_catch)}'
          segment = segment.replace(old_catch, new_catch, 1)

          text = text[:start] + segment + text[start + 6000:]
          path.write_text(text, encoding='utf-8')
          PY
          node scripts/test-customer-identity-admin-v2.mjs
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git diff --cached --check
          git commit -m 'fix(clientes): compatibiliza exclusão com Edge publicada'
          git push origin HEAD:fix/customer-delete-live-compat-20261004
