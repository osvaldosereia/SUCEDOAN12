name: One-shot fix admin mobile nav
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-fix-admin-mobile-nav.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/patch-admin-mobile-nav-overflow.py
          sparse-checkout-cone-mode: false
      - name: RED confirm regression exists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text()
          assert '\n      .wrap{max-width:100%;overflow-x:hidden}' in s
          assert '.top .wrap,.admin-nav{overflow:visible!important}' not in s
          print('RED confirmed: nav can be clipped by wrap overflow')
          PY
      - name: Apply patch
        run: python3 scripts/patch-admin-mobile-nav-overflow.py
      - name: GREEN verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text()
          assert '\n      .wrap{max-width:100%;overflow-x:hidden}' not in s
          assert '#content.wrap{max-width:100%;overflow-x:hidden}' in s
          assert '.top .wrap,.admin-nav{overflow:visible!important}' in s
          assert "document.querySelectorAll('.nav-group-toggle')" in s
          print('GREEN nav contract OK')
          PY
          node <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin JS syntax OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix(admin): restaura menu mobile da topbar'
          git push origin HEAD:main
