name: Temporary basket module cache v3
on:
  push:
    branches:
      - refactor/baskets-canonical-section-20261005
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[basket-cache-v3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/baskets-canonical-section-20261005
      - run: python scripts/tmp-basket-cache-v3.py
      - name: Commit cache version v3
        run: |
          if git diff --quiet -- vitrine/admin/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'chore: atualizar cache dos módulos Cestas/Kits v3 [basket-cache-v3-applied]'
          git push origin HEAD:refactor/baskets-canonical-section-20261005
