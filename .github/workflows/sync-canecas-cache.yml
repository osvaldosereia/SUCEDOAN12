name: Sincronizar cache do Criador de Canecas

# EMERGÊNCIA 2026-09-06: TODOS os acionamentos automáticos foram desativados
# para interromper polling/leitura do Firebase. Execução somente manual até
# substituição por sincronização incremental.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-canecas-cache
  cancel-in-progress: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Gerar e publicar snapshots com retry
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Tentativa ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            node scripts/sync-canecas-cache.mjs

            if git diff --quiet -- site/canecas-comandos.json site/canecas-galeria.json site/canecas-print.json; then
              echo 'Snapshots já estão atualizados.'
              exit 0
            fi

            git add site/canecas-comandos.json site/canecas-galeria.json site/canecas-print.json
            git commit -m 'Atualiza cache do Criador de Canecas'

            if git push origin HEAD:main; then
              echo 'Snapshots publicados com sucesso.'
              exit 0
            fi

            echo 'A main avançou durante a publicação; regenerando sobre a versão mais recente.'
            sleep $((attempt * 2))
          done

          echo 'Não foi possível publicar os snapshots após 3 tentativas.' >&2
          exit 1
