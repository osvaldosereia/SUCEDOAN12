name: Sincronizar cache do Criador de Canecas

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-canecas-cache.mjs'
      - '.github/workflows/sync-canecas-cache.yml'
      - 'producao-v2/js/mug-network-resilience-v1.js'
      - 'producao-v2/js/mug-make-native-openai-bridge.js'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-canecas-cache
  cancel-in-progress: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Gerar snapshots leves
        run: node scripts/sync-canecas-cache.mjs
      - name: Publicar snapshots se houver mudança
        shell: bash
        run: |
          if git diff --quiet -- site/canecas-comandos.json site/canecas-galeria.json; then
            echo 'Snapshots já estão atualizados.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/canecas-comandos.json site/canecas-galeria.json
          git commit -m 'Atualiza cache do Criador de Canecas'
          git push
