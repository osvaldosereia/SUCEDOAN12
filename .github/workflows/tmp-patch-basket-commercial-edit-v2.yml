name: Temporary basket commercial edit v2 patch
on:
  push:
    branches:
      - refactor/baskets-canonical-section-20261005
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[commercial-edit-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/baskets-canonical-section-20261005
      - run: python scripts/tmp-patch-basket-commercial-edit-v2.py
      - name: Commit commercial edit v2
        run: |
          if git diff --quiet -- supabase/functions/admin-basket-guided-v1/index.ts vitrine/admin/basket-guided-builder.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-basket-guided-v1/index.ts vitrine/admin/basket-guided-builder.js
          git commit -m 'feat: editar dados comerciais no fluxo canônico [commercial-edit-v2-applied]'
          git push origin HEAD:refactor/baskets-canonical-section-20261005
