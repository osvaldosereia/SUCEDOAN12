name: One-shot product Google Images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-product-google-images.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/patch-product-google-images-button.py
          sparse-checkout-cone-mode: false
      - name: RED
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text()
          assert 'GOOGLE_IMAGES_PRODUCT_BUTTON_V1' not in s
          assert 'productGoogleImages' not in s
          print('RED confirmed: Google Images shortcut absent')
          PY
      - name: Apply patch
        run: python3 scripts/patch-product-google-images-button.py
      - name: GREEN verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text()
          for x in ['GOOGLE_IMAGES_PRODUCT_BUTTON_V1','id=\"productGoogleImages\"','Google Imagens ↗','https://www.google.com/search?tbm=isch&q=','encodeURIComponent(p?.name||\'\')']:
              assert x in s, x
          print('GREEN contract OK')
          PY
          node <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin JS syntax OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'feat(admin): adiciona atalho Google Imagens no produto'
          git push origin HEAD:main
