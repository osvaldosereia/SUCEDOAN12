name: CanecaFácil · fila mídia LI · GitHub direto

# EMERGÊNCIA 2026-09-06: removido o cron de 5 minutos para zerar o polling
# periódico do Firebase. O worker permanece disponível manualmente e por
# alterações do script até ser acionado diretamente pela criação de fila.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fila-midia-loja-integrada-v1.mjs'

permissions:
  contents: write

concurrency:
  group: canecafacil-li-media-v16
  cancel-in-progress: false

jobs:
  processar-fila:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout controle · main · somente scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Claim da próxima mídia pendente · Firebase → GitHub
        id: claim
        working-directory: control
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          MODE: claim
          STALE_MINUTES: '20'
        run: node scripts/fila-midia-loja-integrada-v1.mjs

      - name: Sem trabalho pendente
        if: steps.claim.outputs.has_work != 'true'
        run: echo 'Fila de mídia vazia. Make não utilizado.'

      - name: Checkout raso da branch de mídia · somente scripts
        if: steps.claim.outputs.has_work == 'true'
        uses: actions/checkout@v4
        with:
          ref: canecas-media
          path: media
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Instalar Sharp somente quando há trabalho
        if: steps.claim.outputs.has_work == 'true'
        working-directory: media
        run: npm install --no-save sharp@0.34.3

      - name: Gerar horizontal quadrada · produto da fila
        if: steps.claim.outputs.has_work == 'true'
        working-directory: media
        env:
          MODE: build
          RAW_BRANCH: canecas-media
          PRODUCT_KEY: ${{ steps.claim.outputs.product_key }}
          FORCE: ${{ steps.claim.outputs.force }}
          CLEANUP_OLD: 'true'
          LIMIT: '1'
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-midia-loja-integrada-v16.mjs

      - name: Publicar mídia gerada na branch canecas-media
        if: steps.claim.outputs.has_work == 'true'
        working-directory: media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A canecas/imagens/loja-integrada 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração de arquivo necessária.'
          else
            git commit -m "CanecaFácil: processar mídia LI pela fila GitHub"
            if ! git push origin HEAD:canecas-media; then
              echo 'Branch avançou durante o processamento; sincronizando somente canecas-media e tentando novamente.'
              git fetch --depth=1 origin canecas-media
              git rebase origin/canecas-media
              git push origin HEAD:canecas-media
            fi
          fi

      - name: Aplicar URLs e estado no Firebase
        if: steps.claim.outputs.has_work == 'true'
        working-directory: media
        env:
          MODE: apply
          RAW_BRANCH: canecas-media
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/processar-midia-loja-integrada-v16.mjs

      - name: Atualizar galeria na Loja Integrada
        if: steps.claim.outputs.has_work == 'true'
        working-directory: media
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: ${{ steps.claim.outputs.product_key }}
          FORCE: ${{ steps.claim.outputs.force }}
          LIMIT: '1'
        run: node scripts/migrar-imagens-loja-integrada-v1.mjs

      - name: Finalizar fila com sucesso
        if: success() && steps.claim.outputs.has_work == 'true'
        working-directory: control
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          MODE: finalize
          PRODUCT_KEY: ${{ steps.claim.outputs.product_key }}
          QUEUE_KEY: ${{ steps.claim.outputs.queue_key }}
        run: node scripts/fila-midia-loja-integrada-v1.mjs

      - name: Registrar falha para retry automático
        if: failure() && steps.claim.outputs.has_work == 'true'
        working-directory: control
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          MODE: fail
          PRODUCT_KEY: ${{ steps.claim.outputs.product_key }}
          QUEUE_KEY: ${{ steps.claim.outputs.queue_key }}
          FAIL_MESSAGE: 'Falha no worker GitHub de mídia; item mantido para nova tentativa automática.'
        run: node scripts/fila-midia-loja-integrada-v1.mjs

      - name: Resumo
        if: always()
        run: |
          echo '## CanecaFácil · fila mídia Loja Integrada' >> "$GITHUB_STEP_SUMMARY"
          echo "- Trabalho encontrado: ${{ steps.claim.outputs.has_work || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Produto: ${{ steps.claim.outputs.product_key || 'nenhum' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Origem: Firebase → GitHub Actions' >> "$GITHUB_STEP_SUMMARY"
          echo '- Checkout de mídia: raso + sparse' >> "$GITHUB_STEP_SUMMARY"
          echo '- Processamentos travados: recuperados após 20 min' >> "$GITHUB_STEP_SUMMARY"
          echo '- Falhas: registradas para retry, nunca finalizadas como sucesso' >> "$GITHUB_STEP_SUMMARY"
          echo '- Make: não utilizado' >> "$GITHUB_STEP_SUMMARY"
