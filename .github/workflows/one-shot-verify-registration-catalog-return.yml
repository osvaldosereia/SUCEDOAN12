name: One-shot verify registration catalog return

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-verify-registration-catalog-return.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify registration and catalog-return contracts
        run: |
          node scripts/test-site-only-order-registration.mjs
          node scripts/test-registration-catalog-return.mjs
      - name: Verify cadastro inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('cadastro/index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if (!scripts.length) throw new Error('No inline script found in cadastro/index.html');
          for (const [i,src] of scripts.entries()) {
            try { new Function(src); }
            catch (e) { throw new Error(`cadastro inline script ${i+1}: ${e.message}`); }
          }
          if (!html.includes('Enviar link no WhatsApp')) throw new Error('WhatsApp return CTA missing');
          if (!html.includes('whatsapp-outbound-v1')) throw new Error('Registration return bridge missing');
          if (html.includes('submit_order')) throw new Error('/cadastro must not create orders');
          console.log(`cadastro runtime syntax OK (${scripts.length} inline script(s))`);
          NODE
