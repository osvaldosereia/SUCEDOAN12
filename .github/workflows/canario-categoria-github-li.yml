name: CanecaFácil · canário categoria GitHub LI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canario-categoria-github-li.yml'
  workflow_dispatch:
    inputs:
      sku:
        description: 'SKU para correção controlada de categoria'
        required: true
        default: 'CANP-QZ11RD'

permissions:
  contents: read

concurrency:
  group: canecafacil-li-category-canary
  cancel-in-progress: false

jobs:
  canario-categoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar token Loja Integrada
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
      - name: Canário · aplicar somente categoria resolvida pelo catálogo GitHub
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          CANARY_SKU: ${{ inputs.sku || 'CANP-QZ11RD' }}
          CANARY_CONFIRM: SET_RESOLVED_CATEGORY:${{ inputs.sku || 'CANP-QZ11RD' }}
        run: node scripts/canario-categoria-loja-integrada-v1.mjs
