name: Admin V3 real Chat test mode
on:
  push:
    paths:
      - 'admin-v3/atendimento.html'
      - 'admin-v3/chat-real-test.*'
      - 'comprar/index.html'
      - 'comprar/config.js'
      - 'comprar/admin-test-bridge.js'
      - 'comprar/admin-test-after-checkout.js'
      - 'supabase/config.toml'
      - 'supabase/functions/shopping-chat-admin-test-v1/**'
      - 'supabase/migrations/*shopping_chat_admin_test*'
      - 'tests/admin-v3-real-chat-test-mode.mjs'
      - '.github/workflows/admin-v3-real-chat-test-mode.yml'
  pull_request:
    paths:
      - 'admin-v3/atendimento.html'
      - 'admin-v3/chat-real-test.*'
      - 'comprar/index.html'
      - 'comprar/config.js'
      - 'comprar/admin-test-bridge.js'
      - 'comprar/admin-test-after-checkout.js'
      - 'supabase/config.toml'
      - 'supabase/functions/shopping-chat-admin-test-v1/**'
      - 'supabase/migrations/*shopping_chat_admin_test*'
      - 'tests/admin-v3-real-chat-test-mode.mjs'
      - '.github/workflows/admin-v3-real-chat-test-mode.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser scripts
        run: |
          node --check admin-v3/chat-real-test.js
          node --check comprar/admin-test-bridge.js
          node --check comprar/admin-test-after-checkout.js
      - name: Run real test-mode contract
        run: node tests/admin-v3-real-chat-test-mode.mjs
      - name: Run existing Chat Comprar Admin regression
        run: node tests/admin-v3-service-strategy-shopping-chat-final.mjs
