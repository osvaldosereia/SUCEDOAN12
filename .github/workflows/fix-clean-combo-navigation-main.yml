name: Corrigir navegação das páginas de cestas e kits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clean-combo-navigation-main.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-navegacao-combos-main
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reescrever navegação e invalidar versão antiga
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const mainPath = 'app-next/src/main.js';
          let main = fs.readFileSync(mainPath, 'utf8');
          const integrationImport = "import { processOrderQueue } from './integrations.js?v=20260727-4';";
          const navigationImport = "import { cleanComboNavigationTarget } from './navigation.js?v=20260727-5';";
          if (!main.includes(navigationImport)) {
            if (!main.includes(integrationImport)) throw new Error('Ponto de importação não encontrado em main.js');
            main = main.replace(integrationImport, `${integrationImport}\n${navigationImport}`);
          }

          const newFunction = `function internalCleanNavigation(event) {
            if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return '';
            const link = event.target.closest('a[href]');
            if (!link || link.target || link.hasAttribute('download')) return '';
            return cleanComboNavigationTarget({
              href: link.getAttribute('href'),
              currentHref: location.href,
              currentOrigin: location.origin
            });
          }`;

          if (!main.includes('return cleanComboNavigationTarget({')) {
            const pattern = /function internalCleanNavigation\(event\) \{[\s\S]*?\n\}\n\nfunction bindEvents\(\)/;
            if (!pattern.test(main)) throw new Error('Função antiga de navegação não encontrada');
            main = main.replace(pattern, `${newFunction}\n\nfunction bindEvents()`);
          }
          fs.writeFileSync(mainPath, main);

          const filesWithMainVersion = [
            'index.html',
            'app-next/index.html',
            'app-next/tests/smoke.test.js',
            'scripts/check-public-site.mjs',
            '.github/workflows/app-next-tests.yml',
            '.github/workflows/update-public-data.yml'
          ];
          for (const file of filesWithMainVersion) {
            let content = fs.readFileSync(file, 'utf8');
            content = content.replaceAll('main.js?v=20260727-4', 'main.js?v=20260727-5');
            fs.writeFileSync(file, content);
          }

          const appVersionPath = 'site/app-version.json';
          const appVersion = JSON.parse(fs.readFileSync(appVersionPath, 'utf8'));
          appVersion.version = '2026-07-27-navigation-v2';
          appVersion.updatedAt = new Date().toISOString();
          appVersion.purpose = 'Correção definitiva da navegação em URLs limpas de cestas e kits, com invalidação do JavaScript antigo';
          fs.writeFileSync(appVersionPath, `${JSON.stringify(appVersion, null, 2)}\n`);
          NODE

      - name: Regenerar páginas com o shell corrigido
        run: node scripts/gerar-paginas-seo-combos.js

      - name: Testar navegação e aplicação completa
        shell: bash
        run: |
          set -euo pipefail
          node --check app-next/src/navigation.js
          node --check app-next/src/main.js
          cd app-next
          npm test
          npm run check
          cd ..
          node scripts/check-public-site.mjs
          grep -q "cleanComboNavigationTarget" app-next/src/main.js
          grep -q "navigation.js?v=20260727-5" app-next/src/main.js
          grep -q "main.js?v=20260727-5" index.html
          grep -q "main.js?v=20260727-5" cestas/mini-bonini-cestaminicomarroztiobonini/index.html

      - name: Publicar correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-clean-combo-navigation-main.yml
          git add -A
          git commit -m 'Corrige navegação travada nas páginas de cestas e kits'
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          echo 'Não foi possível publicar a correção de navegação.' >&2
          exit 1
