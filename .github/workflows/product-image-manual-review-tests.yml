name: Product image manual review tests

on:
  push:
    branches:
      - feat/product-image-grid18-v2
    paths:
      - 'admin-v3/imagens-ia.html'
      - 'admin-v3/image-automation.js'
      - 'supabase/functions/admin-product-images-v1/**'
      - 'supabase/functions/product-image-openai-grid18-v1/**'
      - 'supabase/functions/product-image-openai-v2/**'
      - 'supabase/migrations/20260914100500_product_image_manual_review_v1.sql'
      - 'scripts/test-product-image-manual-review-v1.mjs'
      - '.github/workflows/product-image-manual-review-tests.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-product-image-manual-review-v1.mjs
