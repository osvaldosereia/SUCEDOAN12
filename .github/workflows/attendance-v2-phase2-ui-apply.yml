name: Attendance v2 Phase 2 UI Apply
on:
  push:
    branches: [feat/attendance-central-v2-phase2]
    paths: ['scripts/patch-attendance-phase2-ui.py','.github/workflows/attendance-v2-phase2-ui-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-central-v2-phase2
      - run: python scripts/patch-attendance-phase2-ui.py
      - name: Commit patch
        run: |
          git config user.name "Dona Antonia Ops"
          git config user.email "actions@users.noreply.github.com"
          git add vitrine/admin/atendimento/index.html vitrine/admin/atendimento/attendance.css vitrine/admin/atendimento/attendance.js
          git diff --cached --quiet || git commit -m "feat: add attendance labels and editable quick replies UI"
          git push origin HEAD:feat/attendance-central-v2-phase2
