name: Testar Admin Dona Antônia

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/customer-intelligence-v1/**'
      - 'supabase/functions/admin-pin-auth-v1/**'
      - 'supabase/functions/papo-comprar-webhook-v1/**'
      - 'supabase/functions/admin-gondolas-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - 'supabase/functions/admin-product-image-editor-v1/**'
      - 'supabase/functions/admin-orders-comprar-v1/**'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/migrations/*product_image_versions*'
      - 'supabase/migrations/*cm_1_1*'
      - 'supabase/migrations/*cm_1_2*'
      - 'supabase/config.toml'
      - 'scripts/test-admin-simple-v2.mjs'
      - 'scripts/test-admin-v3-contract.mjs'
      - 'scripts/test-admin-v3-inline-product-controls.mjs'
      - 'scripts/test-admin-gondolas-v1.mjs'
      - 'scripts/test-admin-product-image-editor-v1.mjs'
      - 'scripts/test-admin-product-verification-expiry-v1.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - 'scripts/test-admin-no-v3-runtime.mjs'
      - 'scripts/test-customer-marketing-security-boundary-v1.mjs'
      - 'scripts/test-cm-1-2-identity-resolver.mjs'
      - '.github/workflows/test-admin-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/customer-intelligence-v1/**'
      - 'supabase/functions/admin-pin-auth-v1/**'
      - 'supabase/functions/papo-comprar-webhook-v1/**'
      - 'supabase/functions/admin-gondolas-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - 'supabase/functions/admin-product-image-editor-v1/**'
      - 'supabase/functions/admin-orders-comprar-v1/**'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/migrations/*product_image_versions*'
      - 'supabase/migrations/*cm_1_1*'
      - 'supabase/migrations/*cm_1_2*'
      - 'supabase/config.toml'
      - 'scripts/test-admin-simple-v2.mjs'
      - 'scripts/test-admin-v3-contract.mjs'
      - 'scripts/test-admin-v3-inline-product-controls.mjs'
      - 'scripts/test-admin-gondolas-v1.mjs'
      - 'scripts/test-admin-product-image-editor-v1.mjs'
      - 'scripts/test-admin-product-verification-expiry-v1.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - 'scripts/test-admin-no-v3-runtime.mjs'
      - 'scripts/test-customer-marketing-security-boundary-v1.mjs'
      - 'scripts/test-cm-1-2-identity-resolver.mjs'
      - '.github/workflows/test-admin-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar sintaxe do Admin oficial
        run: |
          node --check admin/api.js
          node --check admin/app.js
          node --check admin/customer-os-auth.js
          node --check admin/customer-os-api.js
          node --check admin/orders-integrated-v2.js
          node --check admin/products-inline-controls-v4.js
          node --check admin/product-gondola-editor-v1.js
          node --check admin/gondolas-v1.js
          node --check admin/product-image-editor-v1.js
          deno check supabase/functions/admin-simple-v2/index.ts
          deno check supabase/functions/admin-core-v1/index.ts
          deno check supabase/functions/customer-intelligence-v1/index.ts
          deno check supabase/functions/admin-pin-auth-v1/index.ts
          deno check supabase/functions/papo-comprar-webhook-v1/index.ts
          deno check supabase/functions/admin-gondolas-v1/index.ts
          deno check supabase/functions/admin-product-names-v1/index.ts
          deno check supabase/functions/admin-product-image-editor-v1/index.ts
          deno check supabase/functions/admin-orders-comprar-v1/index.ts
          deno check supabase/functions/catalog-v3/index.ts
      - name: Validar backend de produtos
        run: node scripts/test-admin-simple-v2.mjs
      - name: Validar contrato do Admin oficial
        run: node scripts/test-admin-v3-contract.mjs
      - name: Validar controles rápidos dos produtos
        run: node scripts/test-admin-v3-inline-product-controls.mjs
      - name: Validar Gôndolas do Admin
        run: node scripts/test-admin-gondolas-v1.mjs
      - name: Validar verificação e validade dos produtos
        run: node scripts/test-admin-product-verification-expiry-v1.mjs
      - name: Validar editor individual de imagens
        run: node scripts/test-admin-product-image-editor-v1.mjs
      - name: Validar pedidos completos do Comprar
        run: node scripts/test-comprar-order-admin-v1.mjs
      - name: Validar independência do Admin oficial
        run: node scripts/test-admin-no-v3-runtime.mjs
      - name: Validar boundary seguro do Customer OS
        run: node scripts/test-customer-marketing-security-boundary-v1.mjs
      - name: Validar Identity Resolver
        run: node scripts/test-cm-1-2-identity-resolver.mjs
      - name: Validar shell oficial
        shell: bash
        run: |
          set -euo pipefail
          grep -q './app.js?v=20260912-4' admin/index.html
          grep -q './runtime-config.js' admin/app.js
          grep -q "adminFunction:'admin-core-v1'" admin/runtime-config.js
          grep -q 'data-route="products"' admin/index.html
          grep -q 'data-route="baskets"' admin/index.html
          grep -q 'data-route="orders"' admin/index.html
          grep -q 'data-route="customers"' admin/index.html
          grep -q './gondolas.html' admin/index.html
          grep -q 'product-gondola-editor-v1.js' admin/index.html
          grep -q 'orders-integrated-v2.js' admin/index.html
          grep -q 'Balanço rápido' admin/index.html
          grep -q '../contagem/' admin/index.html
      - name: Bloquear segredos no navegador
        shell: bash
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|BLING_CLIENT_SECRET|BLING_REFRESH_TOKEN|OPENAI_API_KEY' admin/ || (echo 'Referência de segredo detectada no código público' >&2; exit 1)
