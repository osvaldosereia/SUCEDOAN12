name: Testar Admin Dona Antônia

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/migrations/*admin_v2_customer_maps*'
      - 'supabase/migrations/*admin_inline_product_controls*'
      - 'supabase/config.toml'
      - 'scripts/test-admin-simple-v2.mjs'
      - 'scripts/test-admin-no-auth-v2.mjs'
      - 'scripts/test-admin-v2-operational-contract.mjs'
      - 'scripts/test-admin-inline-product-controls.mjs'
      - '.github/workflows/test-admin-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/migrations/*admin_v2_customer_maps*'
      - 'supabase/migrations/*admin_inline_product_controls*'
      - 'supabase/config.toml'
      - 'scripts/test-admin-simple-v2.mjs'
      - 'scripts/test-admin-no-auth-v2.mjs'
      - 'scripts/test-admin-v2-operational-contract.mjs'
      - 'scripts/test-admin-inline-product-controls.mjs'
      - '.github/workflows/test-admin-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar sintaxe
        run: |
          node --check admin/config.js
          node --check admin/app-lite.js
          deno check supabase/functions/admin-simple-v2/index.ts
          deno check supabase/functions/catalog-v3/index.ts
      - name: Validar contrato Admin Simple V2
        run: node scripts/test-admin-simple-v2.mjs
      - name: Validar controles rápidos dos produtos
        run: node scripts/test-admin-inline-product-controls.mjs
      - name: Validar Admin sem autenticação
        run: node scripts/test-admin-no-auth-v2.mjs
      - name: Validar Admin operacional
        run: node scripts/test-admin-v2-operational-contract.mjs
      - name: Validar shell oficial
        run: |
          grep -q 'data-route="products"' admin/index.html
          grep -q 'data-route="baskets"' admin/index.html
          grep -q 'data-route="customers"' admin/index.html
          grep -q 'Balanço rápido' admin/index.html
          grep -q '../contagem/' admin/index.html
          ! grep -q 'data-route="counts"' admin/index.html
          ! grep -q 'data-route="queue"' admin/index.html
          ! grep -qi 'WhatsApp ativos' admin/index.html
          ! grep -qi 'Somente WhatsApp' admin/index.html
          ! grep -q 'admin-v3/' admin/index.html
          grep -q 'admin-simple-v2' admin/config.js
          grep -q 'app-lite.js' admin/index.html
          grep -q 'simple.css' admin/index.html
      - name: Bloquear segredos no navegador
        shell: bash
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|BLING_CLIENT_SECRET|BLING_REFRESH_TOKEN|OPENAI_API_KEY' admin/ || (echo 'Referência de segredo detectada no código público' >&2; exit 1)
