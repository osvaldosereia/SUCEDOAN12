name: XML Catalog R27 Release Engineering
on:
  pull_request:
    branches: [agent/xml-catalog-operational-gates-r26-20261009, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-version-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Generate migration names with Supabase CLI for R27, no remote writes
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          first=$(supabase migration new purchase_xml_identity_atomic_r27 | grep -oE 'supabase/migrations/[0-9]{14}_[^ ]+\.sql' | head -n1)
          test -n "$first"
          sleep 2
          second=$(supabase migration new purchase_xml_field_approval_r27 | grep -oE 'supabase/migrations/[0-9]{14}_[^ ]+\.sql' | head -n1)
          test -n "$second"
          echo "R27_GENERATED_IDENTITY=$first"
          echo "R27_GENERATED_FIELDS=$second"
          test "$(basename "$first" | cut -c1-14)" -gt 20261009155231
          test "$(basename "$first" | cut -c1-14)" -lt "$(basename "$second" | cut -c1-14)"
          test -s supabase/migrations/20261009185312_purchase_xml_identity_atomic_r27.sql
          test -s supabase/migrations/20261009185314_purchase_xml_field_approval_r27.sql
          test ! -e supabase/migrations/20261009145919_purchase_xml_identity_atomic_r23.sql
          test ! -e supabase/migrations/20261009155445_purchase_xml_field_approval_r24.sql
          test ! -e supabase/migrations/20261009160000_separation_ready_reservation_idempotence.sql
          diff -u <(tail -n +3 docs/projects/purchase-xml-identity-release-candidate-r22.sql) <(tail -n +3 supabase/migrations/20261009185312_purchase_xml_identity_atomic_r27.sql)
          cmp docs/projects/purchase-xml-field-approval-release-candidate-r24.sql supabase/migrations/20261009185314_purchase_xml_field_approval_r27.sql
          echo 'CLI_GENERATED_VALID_VERSIONS_ONLY; NO DEPLOY'
  admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Admin R27 scripts, R26 release preflight and prior gateway regressions
        run: |
          set -eu
          node scripts/test-xml-admin-r27.mjs
          node scripts/test-xml-release-preflight-r26.mjs
          node scripts/test-xml-migration-drift-r27.mjs
          node scripts/test-xml-applied-snapshot-r27.mjs
          node scripts/test-xml-migration-reconciliation-r25.mjs
          node scripts/test-xml-catalog-recovery-v1.mjs
          node scripts/test-xml-catalog-details-v2.mjs
          node scripts/test-xml-catalog-identity-guards-v2.mjs
          node scripts/test-xml-field-approval-gateway-r24.mjs
          node scripts/test-xml-catalog-fiscal-dossier-r25.mjs
          node scripts/test-xml-main-integration-r23.mjs
          node scripts/test-admin-fiscal-recovery-v1.mjs || test ! -f scripts/test-admin-fiscal-recovery-v1.mjs
  xml-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check both XML services and parser with real Deno
        run: |
          set -eu
          deno check supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts
          deno run --allow-read scripts/test-xml-ingest-integrity-r19.mjs
          deno run --allow-read scripts/test-xml-catalog-protocol-integrity-v6.mjs
  combined-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply R27 exact migration files to throwaway PostgreSQL and test CAS
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f scripts/test-xml-catalog-integration-r26.pg.sql
