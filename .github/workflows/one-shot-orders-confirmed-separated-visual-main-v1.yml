name: One-shot visual pedidos confirmado separado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-orders-confirmed-separated-visual-main-v1.yml'
permissions:
  contents: write
jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/test-admin-orders-clean-flow-v3.mjs
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/order-public-view-v1/index.ts
            pedido/index.html
            supabase/migrations/20261004193000_orders_clean_flow_v3.sql
            supabase/migrations/20261004231500_order_separation_local_ready_v3.sql
            supabase/migrations/20261004232000_order_check_gate_accept_separation_v3.sql
            .github/workflows/one-shot-orders-confirmed-separated-visual-main-v1.yml
          sparse-checkout-cone-mode: false

      - name: RED - add visual contract first
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/test-admin-orders-clean-flow-v3.mjs')
          s=p.read_text()
          marker="assert.match(admin,/CONCLUIR SEPARA[CÇ][AÃ]O/i);\n"
          assert marker in s, 'test insertion marker not found'
          block=r'''assert.match(admin,/\.order-v3-card\.confirmed-awaiting-separation\{[^}]*background:#f0faf3/s,'Pedido confirmado precisa ter fundo verde claro');
          assert.match(admin,/\.order-v3-card\.separated-awaiting-delivery\{[^}]*background:#fff6e8/s,'Pedido separado precisa ter fundo laranja claro');
          assert.match(admin,/order-v3-tag confirmed-highlight/,'CONFIRMADO precisa ter destaque visual principal enquanto aguarda separação');
          assert.match(admin,/order-v3-tag separated-highlight/,'SEPARADO precisa ter destaque visual principal após concluir separação');
          assert.match(admin,/order-v3-action separation-ready/,'Abrir Vitrine Separação precisa ficar verde discreto após confirmação');
          '''
          assert 'confirmed-awaiting-separation' not in s, 'visual assertions already present unexpectedly'
          p.write_text(s.replace(marker, marker+block, 1))
          PY
          set +e
          node scripts/test-admin-orders-clean-flow-v3.mjs > /tmp/orders-red.log 2>&1
          status=$?
          set -e
          cat /tmp/orders-red.log
          if [ "$status" -eq 0 ]; then
            echo 'RED esperado, mas o teste passou antes da implementação.'
            exit 1
          fi
          grep -q 'Pedido confirmado precisa ter fundo verde claro' /tmp/orders-red.log || {
            echo 'O teste falhou por motivo diferente do comportamento visual esperado.'
            exit 1
          }
          echo 'RED confirmado: contrato visual ainda não existia.'

      - name: GREEN - apply minimal visual states
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('vitrine/admin/index.html')
          s=p.read_text()

          card='.order-v3-card{border:1px solid #e1e8e3;border-radius:15px;background:#fff;padding:13px;box-shadow:0 1px 2px rgba(20,40,28,.04)}'
          card_new=card+'.order-v3-card.confirmed-awaiting-separation{border-color:#a8d7b8;background:#f0faf3;box-shadow:0 2px 7px rgba(23,107,67,.08)}.order-v3-card.separated-awaiting-delivery{border-color:#efbf83;background:#fff6e8;box-shadow:0 2px 7px rgba(196,107,19,.08)}'
          assert s.count(card)==1, f'card CSS marker count={s.count(card)}'
          s=s.replace(card,card_new,1)

          tag='.order-v3-tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#eaf6ee;color:#145b38;font-size:13px;font-weight:900}'
          tag_new=tag+'.order-v3-tag.confirmed-highlight{padding:8px 13px;background:#176b43;color:#fff;font-size:15px;box-shadow:0 2px 6px rgba(23,107,67,.2)}.order-v3-tag.separated-highlight{padding:8px 13px;background:#c46b13;color:#fff;font-size:15px;box-shadow:0 2px 6px rgba(196,107,19,.2)}'
          assert s.count(tag)==1, f'tag CSS marker count={s.count(tag)}'
          s=s.replace(tag,tag_new,1)

          action='.order-v3-action{border:1px solid #bfd3c6;background:#fff;color:#176b43}'
          action_new=action+'.order-v3-action.separation-ready{border-color:#8ebf9f;background:#e7f5ec;color:#145b38}.order-v3-action.separation-ready:hover{background:#d9efdf;border-color:#72aa87}'
          assert s.count(action)==1, f'action CSS marker count={s.count(action)}'
          s=s.replace(action,action_new,1)

          tags_old='if(m.confirmed)tags.push(\'<span class="order-v3-tag">CONFIRMADO</span>\');if(m.separated)tags.push(\'<span class="order-v3-tag">SEPARADO</span>\');'
          tags_new='if(m.confirmed)tags.push(\'<span class="order-v3-tag\'+(!m.separated&&!m.cancelled&&!m.delivered?\' confirmed-highlight\':\'\')+\'">CONFIRMADO</span>\');if(m.separated)tags.push(\'<span class="order-v3-tag\'+(!m.delivered&&!m.cancelled?\' separated-highlight\':\'\')+\'">SEPARADO</span>\');'
          assert s.count(tags_old)==1, f'tag render marker count={s.count(tags_old)}'
          s=s.replace(tags_old,tags_new,1)

          row_old="const m=orderV3Milestones(o),disabled=m.cancelled?'disabled':'',f=state.fiscalByOrder[o.id]||null;let controls='';"
          row_new=row_old+"const cardVisualClass=!m.cancelled&&!m.delivered?(m.separated?' separated-awaiting-delivery':m.confirmed?' confirmed-awaiting-separation':''):'';const separationActionClass=m.confirmed&&!m.separated&&!m.cancelled?' separation-ready':'';"
          assert s.count(row_old)==1, f'orderRow marker count={s.count(row_old)}'
          s=s.replace(row_old,row_new,1)

          article_old="return '<article class=\"order-v3-card\"><div class=\"order-v3-head\">"
          article_new="return '<article class=\"order-v3-card'+cardVisualClass+'\"><div class=\"order-v3-head\">"
          assert s.count(article_old)==1, f'article marker count={s.count(article_old)}'
          s=s.replace(article_old,article_new,1)

          button_old='<button class=\"order-v3-action\" type=\"button\" data-v3-separation=\"'
          button_new='<button class=\"order-v3-action\'+separationActionClass+'\" type=\"button\" data-v3-separation=\"'
          assert s.count(button_old)==1, f'separation button marker count={s.count(button_old)}'
          s=s.replace(button_old,button_new,1)
          p.write_text(s)
          PY

      - name: GREEN - regression and syntax checks
        run: |
          node scripts/test-admin-orders-clean-flow-v3.mjs
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('admin inline JavaScript syntax OK');
          NODE
          git diff --check

      - name: Commit production change and cleanup
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-orders-confirmed-separated-visual-main-v1.yml
          git add vitrine/admin/index.html scripts/test-admin-orders-clean-flow-v3.mjs
          git commit -m 'fix(admin): destacar pedidos confirmados e separados'
          git pull --rebase origin main
          git push origin HEAD:main
