name: Test WhatsApp Flow V32 Replay

on:
  push:
    paths:
      - 'supabase/migrations/20260910230600_whatsapp_flow_replay_response_cache_v32.sql'
      - 'supabase/functions/whatsapp-flow-data-exchange-v1/**'
      - 'scripts/test-whatsapp-flow-v32-replay-idempotency-contract.mjs'
      - '.github/workflows/test-whatsapp-flow-v32-replay.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260910230600_whatsapp_flow_replay_response_cache_v32.sql'
      - 'supabase/functions/whatsapp-flow-data-exchange-v1/**'
      - 'scripts/test-whatsapp-flow-v32-replay-idempotency-contract.mjs'
      - '.github/workflows/test-whatsapp-flow-v32-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate replay idempotency contract
        run: node scripts/test-whatsapp-flow-v32-replay-idempotency-contract.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check Flow endpoint
        run: deno check supabase/functions/whatsapp-flow-data-exchange-v1/index.ts
