name: One-shot attendance history CSS fix
on:
  push:
    branches: [fix/attendance-history-visible]
    paths:
      - '.github/workflows/one-shot-attendance-history-css-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-history-visible
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bound attendance viewport
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vitrine/admin/atendimento/attendance.css')
          s=p.read_text()
          replacements=[
            ('body{margin:0;min-height:100vh}','html,body{height:100%}body{margin:0;height:100vh;overflow:hidden}'),
            ('.attendance-app{min-height:100vh;display:flex;flex-direction:column}', '.attendance-app{height:100vh;min-height:0;overflow:hidden;display:flex;flex-direction:column}'),
            ('.attendance-grid{flex:1;min-height:0;display:grid', '.attendance-grid{flex:1;min-height:0;overflow:hidden;display:grid'),
            ('.messages{overflow:auto;', '.messages{min-height:0;overflow:auto;')
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'pattern not found: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install --no-save jsdom@24
      - run: node scripts/test-admin-attendance-render-v1.mjs
      - run: node scripts/test-admin-attendance-ui-v1.mjs
      - run: node --check vitrine/admin/atendimento/attendance.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/atendimento/attendance.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep attendance history inside viewport'
          git push origin HEAD:fix/attendance-history-visible
