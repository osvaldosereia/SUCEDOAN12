name: Customer OS · Meta Preflight

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-whatsapp-direct-v1/**'
      - 'supabase/functions/whatsapp-meta-direct-v1/**'
      - 'supabase/migrations/*customer_os_vault*'
      - 'scripts/test-cm-1-meta-readonly-diagnostics-v1.mjs'
      - 'scripts/test-cm-1-meta-preflight-fail-closed-v2.mjs'
      - '.github/workflows/test-customer-os-meta-preflight.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin-whatsapp-direct-v1/**'
      - 'supabase/functions/whatsapp-meta-direct-v1/**'
      - 'supabase/migrations/*customer_os_vault*'
      - 'scripts/test-cm-1-meta-readonly-diagnostics-v1.mjs'
      - 'scripts/test-cm-1-meta-preflight-fail-closed-v2.mjs'
      - '.github/workflows/test-customer-os-meta-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-os-meta-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Meta admin edge
        run: deno check supabase/functions/admin-whatsapp-direct-v1/index.ts
      - name: Validate existing read-only diagnostics contract
        run: node scripts/test-cm-1-meta-readonly-diagnostics-v1.mjs
      - name: Validate fail-closed Meta preflight v2 contract
        run: node scripts/test-cm-1-meta-preflight-fail-closed-v2.mjs
