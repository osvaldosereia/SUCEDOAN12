name: Validar site público

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'comprar/**'
      - 'scripts/test-comprar-root-home-v1.mjs'
      - 'scripts/test-basket-preview-checkout-whatsapp-v1.mjs'
      - 'scripts/test-comprar-product-visual-v2.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - 'scripts/test-comprar-mobile-v1.mjs'
      - 'scripts/test-light-shopping-chat-v2.mjs'
      - 'scripts/catalogos-combos-lib.js'
      - 'scripts/gerar-merchant.js'
      - 'scripts/gerar-meta-combos.js'
      - 'scripts/gerar-paginas-seo-combos.js'
      - 'scripts/gerar-sitemap.js'
      - 'scripts/injetar-seo-combos.js'
      - 'scripts/normalizar-seo-delivery.js'
      - 'sobre-nos.html'
      - 'contato.html'
      - 'politica-de-entrega.html'
      - 'politica-de-troca.html'
      - 'politica-de-privacidade.html'
      - 'termos-de-uso.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'merchant.xml'
      - 'cestas/**'
      - 'kits/**'
      - 'site/seo-combos-manifest.json'
      - 'site/produtos_meta.csv'
      - 'site/produtos_admin_meta.json'
      - '.github/workflows/app-next-tests.yml'
      - '.github/workflows/update-public-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Gerar SEO, páginas e feeds para validação
        id: seo
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/normalizar-seo-delivery.js
            node scripts/injetar-seo-combos.js
            node scripts/gerar-paginas-seo-combos.js
            node scripts/gerar-merchant.js
            node scripts/gerar-meta-combos.js
            node scripts/gerar-sitemap.js
            grep -q '/comprar/config.js?v=20260915-02' index.html
            grep -q '/comprar/chat-checkout-quantity-v1.js?v=20260915-04' index.html
            grep -q '/comprar/checkout-final-v2.js' index.html
            grep -q '/comprar/storefront-visual-v2.js' index.html
            grep -q '"@type":"OnlineStore"' index.html
            grep -q '"@type":"WebSite"' index.html
            ! grep -q '/app-next/src/main.js' index.html
            grep -q '"@type":"FAQPage"' cestas/index.html
            grep -q 'noindex,follow' kits/index.html
            ! grep -q 'https://donaantonia.com.br/kits/' sitemap.xml
          } 2>&1 | tee public-site-test-report.txt

      - name: Validar Comprar atual
        id: comprar
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/test-light-shopping-chat-v2.mjs
            node scripts/test-basket-preview-checkout-whatsapp-v1.mjs
            node scripts/test-comprar-product-visual-v2.mjs
            node scripts/test-comprar-order-admin-v1.mjs
            node scripts/test-comprar-mobile-v1.mjs
            node scripts/test-comprar-root-home-v1.mjs
          } 2>&1 | tee -a public-site-test-report.txt

      - name: Verificar sintaxe
        id: syntax
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --check comprar/app.js
            node --check comprar/chat-light-v2.js
            node --check comprar/chat-checkout-quantity-v1.js
            node --check comprar/product-detail-v1.js
            node --check comprar/checkout-final-v2.js
            node --check comprar/storefront-visual-v2.js
            node --check comprar/chat-helper-menu.js
            node --check scripts/catalogos-combos-lib.js
            node --check scripts/gerar-merchant.js
            node --check scripts/gerar-meta-combos.js
            node --check scripts/gerar-paginas-seo-combos.js
            node --check scripts/gerar-sitemap.js
            node --check scripts/injetar-seo-combos.js
            node --check scripts/normalizar-seo-delivery.js
          } 2>&1 | tee -a public-site-test-report.txt

      - name: Anexar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-test-report
          path: public-site-test-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Confirmar resultado
        if: steps.seo.outcome == 'failure' || steps.comprar.outcome == 'failure' || steps.syntax.outcome == 'failure'
        run: |
          cat public-site-test-report.txt
          exit 1
