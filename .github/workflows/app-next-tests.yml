name: Validar site público modular

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-next/**'
      - 'site-public/**'
      - 'producao-v2/js/services/collections.js'
      - 'scripts/refatorar-rotas-combos.js'
      - 'scripts/catalogos-combos-lib.js'
      - 'scripts/gerar-merchant.js'
      - 'scripts/gerar-meta-combos.js'
      - 'scripts/gerar-paginas-seo-combos.js'
      - 'scripts/gerar-sitemap.js'
      - 'scripts/injetar-seo-combos.js'
      - 'scripts/normalizar-seo-delivery.js'
      - 'scripts/check-public-site.mjs'
      - 'sobre-nos.html'
      - 'contato.html'
      - 'politica-de-entrega.html'
      - 'politica-de-troca.html'
      - 'politica-de-privacidade.html'
      - 'termos-de-uso.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'merchant.xml'
      - 'cestas/**'
      - 'kits/**'
      - 'site/seo-combos-manifest.json'
      - 'site/produtos_meta.csv'
      - 'site/produtos_admin_meta.json'
      - '.github/workflows/app-next-tests.yml'
      - '.github/workflows/update-public-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-next/package.json

      - name: Refatorar rotas de cestas e kits
        run: node scripts/refatorar-rotas-combos.js

      - name: Gerar SEO, páginas e feeds para validação
        id: seo
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/normalizar-seo-delivery.js
            node scripts/injetar-seo-combos.js
            node scripts/gerar-paginas-seo-combos.js
            node scripts/gerar-merchant.js
            node scripts/gerar-meta-combos.js
            node scripts/gerar-sitemap.js
            test "$(grep -o 'app-next/src/seo-combos.js?v=20260726-2' index.html | wc -l)" -eq 1
            test "$(grep -o 'app-next/src/main.js?v=20260726-9' index.html | wc -l)" -eq 1
            ! grep -q 'app-next/src/delivery-only.js' index.html
            ! grep -q '#/cesta/' app-next/src/ui.js app-next/src/live-polish.js
            ! grep -q '#/kit/' app-next/src/ui.js app-next/src/live-polish.js
          } 2>&1 | tee public-site-test-report.txt

      - name: Testar módulos
        id: modules
        if: always()
        continue-on-error: true
        working-directory: app-next
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a ../public-site-test-report.txt

      - name: Smoke test modular
        id: smoke
        if: always()
        continue-on-error: true
        working-directory: app-next
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee -a ../public-site-test-report.txt

      - name: Validar estrutura pública, políticas e feeds
        id: public
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-public-site.mjs 2>&1 | tee -a public-site-test-report.txt

      - name: Verificar sintaxe dos geradores
        id: generators
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --check scripts/refatorar-rotas-combos.js
            node --check scripts/catalogos-combos-lib.js
            node --check scripts/gerar-merchant.js
            node --check scripts/gerar-meta-combos.js
            node --check scripts/gerar-paginas-seo-combos.js
            node --check scripts/gerar-sitemap.js
            node --check scripts/injetar-seo-combos.js
            node --check scripts/normalizar-seo-delivery.js
            node --check scripts/check-public-site.mjs
            node --check app-next/src/bundle-routes.js
            node --check app-next/src/core.js
            node --check app-next/src/catalog.js
            node --check app-next/src/ui.js
            node --check app-next/src/main.js
            node --check app-next/src/live-polish.js
            node --check app-next/src/seo-combos.js
          } 2>&1 | tee -a public-site-test-report.txt

      - name: Anexar relatório do site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-test-report
          path: public-site-test-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Confirmar resultado
        if: steps.modules.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.seo.outcome == 'failure' || steps.public.outcome == 'failure' || steps.generators.outcome == 'failure'
        run: |
          cat public-site-test-report.txt
          exit 1
