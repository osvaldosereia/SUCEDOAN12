name: Marketing Preview — One Shot Homologation

on:
  push:
    branches:
      - main
    paths:
      - .automation/marketing-preview-homologation-run-once
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-preview-homologation
  cancel-in-progress: false

jobs:
  render-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned raster dependency
        run: npm install --no-save --ignore-scripts=false sharp@0.33.5

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate scripts
        run: |
          node --check scripts/marketing-preview-homologation.mjs
          node --test tests/marketing-light-video-render-worker.test.mjs
          node --test tests/marketing-official-publish-connectors-v1.test.mjs
          node --test tests/marketing-connection-manager-oauth-v1.test.mjs
          command -v ffmpeg\n          ffmpeg -version | head -n 3

      - name: Render five pilot pieces and one real Reel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/marketing-preview-homologation.mjs

      - name: Upload visual inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-preview-homologation
          path: artifacts/marketing-preview-homologation/
          if-no-files-found: warn
          retention-days: 7
