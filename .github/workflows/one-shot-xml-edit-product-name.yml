name: Final verify XML editable product name

on:
  workflow_dispatch:
  push:
    branches:
      - fix/xml-edit-product-name-20261003
    paths:
      - '.github/workflows/one-shot-xml-edit-product-name.yml'

permissions:
  contents: read

jobs:
  final-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify editable name contract
        run: |
          python scripts/test_purchase_xml_edit_product_name.py
          python scripts/verify_purchase_product_identification.py

      - name: Verify inline JavaScript syntax and repository diff hygiene
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('vitrine/admin/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
          for (const [i, src] of scripts.entries()) {
            try { new Function(src); }
            catch (e) { throw new Error(`Inline script ${i + 1} syntax error: ${e.message}`); }
          }
          console.log(`Verified ${scripts.length} inline script(s).`);
          NODE
          git diff --check
