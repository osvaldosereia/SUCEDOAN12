name: Comprar Clean Refactor

on:
  pull_request:
    paths:
      - 'comprar/**'
      - 'scripts/test-comprar-clean-*.mjs'
      - 'tests/admin-v3-real-chat-test-mode.mjs'
      - '.github/workflows/comprar-clean-refactor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Contratos do Comprar limpo
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/test-comprar-clean-*.mjs; do
            node "$test_file"
          done
      - name: Sintaxe dos módulos novos existentes
        shell: bash
        run: |
          set -euo pipefail
          for file in comprar/app.js comprar/baskets.js comprar/products.js comprar/checkout.js comprar/help.js comprar/admin-test-bridge.js; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
