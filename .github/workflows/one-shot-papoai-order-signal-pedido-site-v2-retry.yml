name: One-shot PapoAI PEDIDO_SITE signal retry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-papoai-order-signal-pedido-site-v2-retry.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PEDIDO_SITE bridge patch
        run: |
          cat > supabase/sql/20261002_papoai_order_signal_pedido_site_v2.sql <<'SQL'
          -- Restaura o sinal transacional PEDIDO_SITE na ponte interna PapoAI.
          create or replace function public.ops2_papoai_signal_allowed_v1(p_signal text)
          returns boolean language sql immutable set search_path to '' as $$
            select upper(btrim(coalesce(p_signal,''))) = any(array[
              'PEDIDO_SITE',
              'INT_CESTAS','INT_BEBE','INT_CABELOS','INT_BELEZA','INT_HIGIENE','INT_LIMPEZA','INT_LAVANDERIA','INT_PET','INT_CASA','INT_DOCES_LANCHES',
              'BR_NIVEA','BR_ELSEVE',
              'CTA_OFERTAS','CTA_BEBE','CTA_CABELOS','CTA_BELEZA','CTA_LIMPEZA','CTA_LAVANDERIA','CTA_PET'
            ]::text[])
          $$;
          revoke all on function public.ops2_papoai_signal_allowed_v1(text) from public,anon,authenticated;
          grant execute on function public.ops2_papoai_signal_allowed_v1(text) to service_role;
          SQL
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/admin-orders-v1/index.ts')
          s=p.read_text()
          old='const keys=[...details.marketingInterests.map((v:string)=>`INT_${v}`),...details.marketingBrands.map((v:string)=>`BR_${v}`)];'
          new='const keys=["PEDIDO_SITE",...details.marketingInterests.map((v:string)=>`INT_${v}`),...details.marketingBrands.map((v:string)=>`BR_${v}`)];'
          if old in s:s=s.replace(old,new,1)
          if new not in s:raise SystemExit('PEDIDO_SITE bridge key missing')
          p.write_text(s)

          t=Path('scripts/test-papoai-order-signal-bridge-v1.mjs')
          x=t.read_text()
          old="const sql=fs.readFileSync('supabase/sql/20261002_papoai_order_signal_bridge_v1.sql','utf8');"
          new="const sql=fs.readFileSync('supabase/sql/20261002_papoai_order_signal_bridge_v1.sql','utf8')+'\\n'+fs.readFileSync('supabase/sql/20261002_papoai_order_signal_pedido_site_v2.sql','utf8');"
          if old in x:x=x.replace(old,new,1)
          if "'PEDIDO_SITE','INT_CESTAS'" not in x:x=x.replace("for(const key of ['INT_CESTAS'","for(const key of ['PEDIDO_SITE','INT_CESTAS'",1)
          marker="assert.match(admin,/details\\.marketingInterests\\.map/"
          if 'dispatcher must always emit PEDIDO_SITE' not in x:x=x.replace(marker,"assert.match(admin,/const keys=\\[\"PEDIDO_SITE\",/,'dispatcher must always emit PEDIDO_SITE');\n"+marker,1)
          t.write_text(x)
          PY
      - name: Verify
        run: |
          node scripts/test-papoai-order-signal-bridge-v1.mjs
          node scripts/test-checkout-whatsapp-outbox.mjs
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name "Dona Antonia Ops"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/sql/20261002_papoai_order_signal_pedido_site_v2.sql supabase/functions/admin-orders-v1/index.ts scripts/test-papoai-order-signal-bridge-v1.mjs
          git commit -m "fix(papoai): restaura sinal PEDIDO_SITE na ponte"
          git rm .github/workflows/one-shot-papoai-order-signal-pedido-site-v2.yml .github/workflows/one-shot-papoai-order-signal-pedido-site-v2-retry.yml
          git commit -m "chore: remove one-shots PEDIDO_SITE"
          git push
