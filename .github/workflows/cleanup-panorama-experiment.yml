name: Limpeza temporária · animação panorâmica

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-panorama-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-panorama-experiment
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch de mídia
        uses: actions/checkout@v4
        with:
          ref: canecas-media
          fetch-depth: 0

      - name: Remover WebMs da tentativa
        shell: bash
        run: |
          mapfile -t FILES < <(find canecas/vitrine -type f -name '*-arte-panorama-5s.webm' -print 2>/dev/null || true)
          echo "Arquivos encontrados: ${#FILES[@]}"
          if [ "${#FILES[@]}" -gt 0 ]; then
            printf '%s\n' "${FILES[@]}"
            rm -f -- "${FILES[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u canecas/vitrine
            git commit -m "Reverte arquivos da animação panorâmica"
            git push origin HEAD:canecas-media
          fi

      - name: Limpar somente metadados da tentativa no Firebase
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        shell: bash
        run: |
          node <<'NODE'
          const base = String(process.env.FIREBASE_BASE_URL || '').replace(/\/$/, '');
          const r = await fetch(`${base}/produtos.json`, { headers: { Accept: 'application/json' } });
          if (!r.ok) throw new Error(`Firebase GET ${r.status}`);
          const products = await r.json() || {};
          const fields = [
            'animacao_canecafacil',
            'animacao_canecafacil_status',
            'animacao_canecafacil_erro',
            'animacao_canecafacil_source_art',
            'animacao_canecafacil_processador',
            'animacao_canecafacil_bytes',
            'animacao_canecafacil_atualizado_em',
            'animacao_canecafacil_iniciado_em',
            'vitrine_animacao'
          ];
          let cleaned = 0;
          for (const [key, p] of Object.entries(products)) {
            if (!p || typeof p !== 'object') continue;
            const ours = p.animacao_canecafacil_processador === 'github-ffmpeg-panorama-v1'
              || p.vitrine_animacao?.versao === 'github-ffmpeg-panorama-v1';
            if (!ours) continue;
            const patch = Object.fromEntries(fields.map(f => [f, null]));
            const response = await fetch(`${base}/produtos/${encodeURIComponent(key)}.json`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify(patch),
            });
            if (!response.ok) throw new Error(`Firebase PATCH ${key}: ${response.status}`);
            cleaned += 1;
          }
          console.log(`Produtos limpos: ${cleaned}`);
          NODE
