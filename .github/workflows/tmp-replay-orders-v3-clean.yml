name: Temporary replay orders v3 on current main

on:
  push:
    branches: [feat/orders-clean-flow-v3-clean-20261004]

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Fetch source branch and reconcile Orders V3
        run: |
          git fetch origin feat/orders-clean-flow-v3-20261004:refs/remotes/origin/feat/orders-clean-flow-v3-20261004 --depth=100
          BASE=$(git merge-base HEAD origin/feat/orders-clean-flow-v3-20261004)
          echo "merge-base=$BASE"

          git diff "$BASE" origin/feat/orders-clean-flow-v3-20261004 -- . \
            ':(exclude)vitrine/admin/index.html' \
            ':(exclude).github/workflows/tmp-orders-v3-dead-cleanup.yml' \
            ':(exclude)scripts/patch-orders-v3-delivery-bling.mjs' \
            > /tmp/orders-v3-other.diff
          git apply --3way /tmp/orders-v3-other.diff

          git show "$BASE":vitrine/admin/index.html > /tmp/admin-base.html
          git show origin/feat/orders-clean-flow-v3-20261004:vitrine/admin/index.html > /tmp/admin-v3.html
          cp vitrine/admin/index.html /tmp/admin-main.html
          set +e
          git merge-file -p /tmp/admin-v3.html /tmp/admin-base.html /tmp/admin-main.html > vitrine/admin/index.html
          MERGE_STATUS=$?
          set -e

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('vitrine/admin/index.html')
          s=p.read_text()
          blocks=list(re.finditer(r'^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n?',s,re.M|re.S))
          if blocks:
              if len(blocks)!=1:
                  raise SystemExit(f'unexpected admin conflict count: {len(blocks)}')
              m=blocks[0]
              left,right=m.group(1),m.group(2)
              left_orders='/* Pedidos V3:' in left
              right_orders='/* Pedidos V3:' in right
              left_basket='/* basket-family-picker-ux-v1 */' in left
              right_basket='/* basket-family-picker-ux-v1 */' in right
              if not ((left_orders and right_basket) or (right_orders and left_basket)):
                  raise SystemExit('unexpected admin conflict; refusing automatic resolution')
              orders=left if left_orders else right
              basket=left if left_basket else right
              def strip_style(x):
                  return re.sub(r'\s*</style>\s*$', '', x.rstrip())
              resolved=strip_style(orders)+'\n\n'+strip_style(basket)+'\n  </style>\n'
              s=s[:m.start()]+resolved+s[m.end():]
              p.write_text(s)
          final=p.read_text()
          if re.search(r'^(?:<<<<<<<|=======|>>>>>>>)',final,re.M):
              raise SystemExit('real conflict markers remain')
          PY

          if [ "$MERGE_STATUS" -gt 1 ] && grep -q '^<<<<<<<' vitrine/admin/index.html; then exit "$MERGE_STATUS"; fi
      - name: Verify Orders V3 and recent main work
        run: |
          node scripts/test-admin-orders-clean-flow-v3.mjs
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node scripts/test-basket-family-picker-ux-v1.mjs
          node scripts/test-admin-attendance-catalog-link-cutover-v1.mjs
          node scripts/test-checkout-order-meta-cutover-v1.mjs
          git diff --check
      - name: Browser JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          for(const file of ['vitrine/admin/index.html','pedido/index.html','p/index.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>{const p=`/tmp/${file.replaceAll('/','-')}-${i}.js`;fs.writeFileSync(p,src);cp.execFileSync(process.execPath,['--check',p],{stdio:'inherit'})});
          }
          NODE
      - name: Commit reconciled Orders V3
        run: |
          if ! git diff --quiet; then
            git config user.name 'OSSJU'
            git config user.email 'Junior.sereia@hotmail.com'
            git add -A
            git commit -m 'refactor: reconcile canonical orders v3 with current main'
            git push origin HEAD:feat/orders-clean-flow-v3-clean-20261004
          fi
