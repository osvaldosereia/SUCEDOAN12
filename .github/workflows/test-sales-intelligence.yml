name: Testar vendas conversacionais

on:
  push:
    branches: [main]
    paths:
      - 'catalogo/**'
      - 'admin/**'
      - 'admin/customer-intelligence.*'
      - 'supabase/functions/mini-catalog-v1/**'
      - 'supabase/functions/customer-intelligence-v1/**'
      - 'supabase/migrations/*customer_purchase_intelligence*'
      - 'supabase/migrations/*customer_sales_context*'
      - '.github/workflows/test-sales-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-sales-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar JavaScript público
        run: |
          node --check catalogo/app.js
          node --check catalogo/config.js
          node --check admin/app.js
          node --check admin/customer-os-api.js
          node --check admin/customer-360-view.js
      - name: Validar estrutura do catálogo
        run: |
          grep -q 'mini-catalog-v1' catalogo/config.js
          grep -q 'Continuar no WhatsApp' catalogo/index.html
          grep -q 'basket_interest' catalogo/app.js
          grep -q 'return_whatsapp' catalogo/app.js
          grep -q 'setProductQty' catalogo/app.js
          ! grep -q 'basket-editor.js' catalogo/index.html
      - name: Validar inteligência de clientes
        run: |
          grep -q "customerOsFunction:'customer-intelligence-v1'" admin/runtime-config.js
          grep -q "customer_360" admin/app.js
          grep -q "Produtos mais recorrentes" admin/app.js
          grep -q 'data-route="customers"' admin/index.html
          grep -q "create_catalog" supabase/functions/customer-intelligence-v1/index.ts
      - name: Validar backend versionado
        run: |
          grep -q 'open_public' supabase/functions/mini-catalog-v1/index.ts
          grep -q 'publicProducts' supabase/functions/mini-catalog-v1/index.ts
          grep -q 'basket_interest' supabase/functions/mini-catalog-v1/index.ts
          grep -q 'return_whatsapp' supabase/functions/mini-catalog-v1/index.ts
          grep -q 'get_customer_recommendations' supabase/functions/customer-intelligence-v1/index.ts
          grep -q 'customer_product_stats' supabase/migrations/20260907143000_customer_purchase_intelligence_and_mini_catalog.sql
          grep -q 'build_customer_sales_context' supabase/migrations/20260907144500_customer_sales_context_and_reply_mode.sql
      - name: Verificar ausência de segredos no frontend
        shell: bash
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|BLING_CLIENT_SECRET|BLING_REFRESH_TOKEN|META_ACCESS_TOKEN|OPENAI_API_KEY' catalogo/ admin/app.js admin/customer-os-api.js admin/customer-360-view.js admin/runtime-config.js || (echo 'Segredo proibido no frontend' >&2; exit 1)
