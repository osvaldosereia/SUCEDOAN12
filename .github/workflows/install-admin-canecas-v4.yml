name: Instalar Admin Canecas V4

on:
  push:
    paths:
      - '.github/workflows/install-admin-canecas-v4.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar catalog-manager-v4 validado
        shell: bash
        run: |
          cat > /tmp/catalog-manager-v4.js.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/catalog-manager-v4.js.gz.b64 | gzip -d > admin-canecas/catalog-manager-v4.js
          node --check admin-canecas/catalog-manager-v4.js
      - name: Commitar arquivo validado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-canecas/catalog-manager-v4.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'admin-canecas: corrigir e validar catalog manager v4'
          git push
