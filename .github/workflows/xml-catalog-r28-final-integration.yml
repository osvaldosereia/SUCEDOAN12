name: XML R28 Final Fiscal Integration
on:
  push:
    branches: ['agent/xml-catalog-final-integration-r28-20261009']
  pull_request:
    branches: [main]
    paths:
      - 'vitrine/admin/index.html'
      - 'pedido/index.html'
      - 'supabase/functions/**/purchase-xml-v1/**'
      - 'supabase/functions/purchase-xml-v1/**'
      - 'supabase/functions/admin-service-intelligence-v1/index.ts'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'supabase/migrations/*purchase_xml*.sql'
      - 'supabase/migrations/*sales_quote*.sql'
      - 'scripts/*xml*.mjs'
      - 'scripts/test-admin-fiscal-recovery-v1.mjs'
      - 'scripts/test-fiscal-*.mjs'
      - '.github/workflows/xml-catalog-r28-final-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consolidated-admin-fiscal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate combined XML/Admin/quote/NF-e and WhatsApp public view
        run: |
          set -eu
          node scripts/test-xml-admin-r27.mjs
          node scripts/test-xml-registration-r2.mjs
          node scripts/test-xml-catalog-fiscal-dossier-r25.mjs
          node scripts/test-xml-field-approval-gateway-r24.mjs
          node scripts/test-xml-identity-gateway-r21.mjs
          node scripts/test-xml-main-integration-r23.mjs
          node scripts/test-xml-applied-snapshot-r27.mjs
          node scripts/test-xml-migration-drift-r27.mjs
          node scripts/test-xml-selective-release-r30.mjs
          node scripts/test-xml-release-preflight-r26.mjs
          node scripts/test-admin-fiscal-recovery-v1.mjs
          node scripts/test-fiscal-nfe-autorecovery-v1.mjs
          node scripts/test-fiscal-ncm-remote-gap-v2.mjs
          node scripts/test-fiscal-recovery-r1-auth-backoff.mjs
          node scripts/test-admin-pending-data-baskets-public-v1.mjs
          node scripts/test-order-public-vitrine-print.mjs
  both-xml-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Run typecheck and real XML import parser without remote data
        run: |
          set -eu
          deno check supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts
          deno run --allow-read scripts/test-xml-ingest-integrity-r19.mjs
          deno run --allow-read scripts/test-xml-catalog-protocol-integrity-v6.mjs
  combined-disposable-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Test R27 XML identity → review → apply → CAS rollback with true lot trigger fixture
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f scripts/test-xml-catalog-integration-r26.pg.sql
          # Separate disposable DB: R2 must not require R24 name mutation.
          createdb xml_r2_identity
          PGDATABASE=xml_r2_identity psql -v ON_ERROR_STOP=1 -f scripts/test-xml-identity-r2.pg.sql
