name: one-shot-order-public-summary
on:
  push:
    branches: [feat/order-public-summary-link]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RED contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          admin=Path('vitrine/admin/index.html').read_text()
          root=Path('index.html').read_text()
          red=[]
          if 'orderPublicUrl(saved)' not in root: red.append('checkout public order link missing')
          if 'publicOrderUrlFor' not in admin: red.append('admin public order link missing')
          if not red:
              raise SystemExit('RED unexpectedly passed')
          print('RED ok:', '; '.join(red))
          PY
      - name: Apply implementation
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          migration = r'''-- Public, read-only order summary snapshots. The order UUID is the opaque link token.
          create table if not exists public.order_public_snapshots_v1 (
            order_id uuid primary key references public.orders(id) on delete cascade,
            snapshot jsonb not null default '{}'::jsonb,
            created_at timestamptz not null default now(),
            refreshed_at timestamptz not null default now(),
            open_count bigint not null default 0 check (open_count >= 0),
            last_opened_at timestamptz
          );

          alter table public.order_public_snapshots_v1 enable row level security;
          revoke all on table public.order_public_snapshots_v1 from anon, authenticated;

          create or replace function public.ops2_refresh_order_public_snapshot_v1(p_order_id uuid)
          returns jsonb
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          declare
            v_order public.orders%rowtype;
            v_snapshot jsonb;
          begin
            select * into v_order from public.orders where id = p_order_id;
            if not found then return null; end if;

            select jsonb_strip_nulls(jsonb_build_object(
              'version', 1,
              'order_id', v_order.id::text,
              'order_number', v_order.order_number,
              'created_at', v_order.created_at,
              'total', v_order.total,
              'subtotal', v_order.subtotal,
              'payment_label', coalesce(nullif(v_order.checkout_snapshot->>'payment_label',''), nullif(v_order.payment_method,''), 'A confirmar'),
              'customer_name', coalesce(nullif(v_order.customer_snapshot->>'name',''), nullif(v_order.customer_snapshot->>'display_name',''), nullif(v_order.delivery_address->>'customer_name',''), 'Cliente'),
              'delivery', jsonb_strip_nulls(jsonb_build_object(
                'street', v_order.delivery_address->>'street',
                'number', v_order.delivery_address->>'number',
                'complement', v_order.delivery_address->>'complement',
                'district', coalesce(nullif(v_order.delivery_address->>'district',''), nullif(v_order.delivery_address->>'neighborhood','')),
                'city', v_order.delivery_address->>'city',
                'state', v_order.delivery_address->>'state',
                'reference', coalesce(nullif(v_order.delivery_address->>'reference',''), nullif(v_order.delivery_address->>'raw_text','')),
                'delivery_date', v_order.delivery_address->>'delivery_date',
                'delivery_label', v_order.delivery_address->>'delivery_label'
              )),
              'baskets', coalesce((
                select jsonb_agg(jsonb_strip_nulls(jsonb_build_object(
                  'id', coalesce(bt.id::text, x.item->>'id'),
                  'name', coalesce(bt.name, v_order.basket_name_snapshot, 'Cesta'),
                  'image_url', nullif(bt.image_url,''),
                  'quantity', coalesce(nullif(x.item->>'qty','')::numeric, 1)
                )) order by x.ord)
                from jsonb_array_elements(coalesce(v_order.checkout_snapshot->'cart','[]'::jsonb)) with ordinality as x(item,ord)
                left join public.basket_templates bt on bt.id::text = x.item->>'id'
                where x.item->>'type' = 'basket'
              ), '[]'::jsonb),
              'items', coalesce((
                select jsonb_agg(jsonb_strip_nulls(jsonb_build_object(
                  'name', oi.name_snapshot,
                  'quantity', oi.quantity,
                  'unit_price', oi.unit_price,
                  'line_total', oi.line_total,
                  'image_url', nullif(coalesce(oi.metadata->>'image_url', p.image_url, ''),''),
                  'basket_name', nullif(oi.metadata->>'basket_name',''),
                  'basket_id', nullif(oi.metadata->>'basket_id',''),
                  'kind', coalesce(nullif(oi.metadata->>'history_kind',''), 'product')
                )) order by oi.created_at, oi.id)
                from public.order_items oi
                left join public.products p on p.id = oi.product_id
                where oi.order_id = p_order_id and oi.quantity > 0
              ), '[]'::jsonb)
            )) into v_snapshot;

            insert into public.order_public_snapshots_v1(order_id,snapshot,refreshed_at)
            values (p_order_id,v_snapshot,now())
            on conflict (order_id) do update set snapshot=excluded.snapshot, refreshed_at=now();
            return v_snapshot;
          end;
          $$;

          revoke all on function public.ops2_refresh_order_public_snapshot_v1(uuid) from public, anon, authenticated;
          grant execute on function public.ops2_refresh_order_public_snapshot_v1(uuid) to service_role;

          create or replace function public.ops2_order_item_public_snapshot_trigger_v1()
          returns trigger
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          begin
            perform public.ops2_refresh_order_public_snapshot_v1(new.order_id);
            return new;
          end;
          $$;

          revoke all on function public.ops2_order_item_public_snapshot_trigger_v1() from public, anon, authenticated;

          drop trigger if exists trg_order_item_public_snapshot_v1 on public.order_items;
          create trigger trg_order_item_public_snapshot_v1
          after insert on public.order_items
          for each row execute function public.ops2_order_item_public_snapshot_trigger_v1();
          '''
          Path('supabase/migrations/20261003024500_order_public_summary.sql').write_text(migration.strip()+"\n")

          edge = r'''import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          import { createClient } from "npm:@supabase/supabase-js@2.58.0";

          const U=Deno.env.get("SUPABASE_URL")||"";
          const K=Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")||"";
          const db=createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}});
          const allowed=new Set(["https://donaantonia.com.br","https://www.donaantonia.com.br"]);
          const cors=(req:Request)=>{const o=req.headers.get("origin")||"";return {"Access-Control-Allow-Origin":allowed.has(o)?o:"https://donaantonia.com.br","Vary":"Origin","Access-Control-Allow-Methods":"GET,OPTIONS","Access-Control-Allow-Headers":"content-type"}};
          const json=(req:Request,body:unknown,status=200)=>new Response(JSON.stringify(body),{status,headers:{...cors(req),"Content-Type":"application/json; charset=utf-8","Cache-Control":"private, no-store, max-age=0","X-Robots-Tag":"noindex, nofollow, noarchive"}});
          const validUuid=(v:string)=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v);

          Deno.serve(async(req:Request)=>{
            if(req.method==="OPTIONS")return new Response(null,{status:204,headers:cors(req)});
            if(req.method!=="GET")return json(req,{ok:false,error:"method_not_allowed"},405);
            if(!U||!K)return json(req,{ok:false,error:"server_config"},500);
            const orderId=(new URL(req.url).searchParams.get("o")||"").trim();
            if(!validUuid(orderId))return json(req,{ok:false,error:"not_found"},404);

            let {data:row,error}=await db.from("order_public_snapshots_v1").select("snapshot,open_count").eq("order_id",orderId).maybeSingle();
            if(error)return json(req,{ok:false,error:"snapshot_unavailable"},503);
            if(!row){
              const refreshed=await db.rpc("ops2_refresh_order_public_snapshot_v1",{p_order_id:orderId});
              if(refreshed.error||!refreshed.data)return json(req,{ok:false,error:"not_found"},404);
              const reread=await db.from("order_public_snapshots_v1").select("snapshot,open_count").eq("order_id",orderId).maybeSingle();
              if(reread.error||!reread.data)return json(req,{ok:false,error:"snapshot_unavailable"},503);
              row=reread.data;
            }
            const current=await db.from("orders").select("status,updated_at").eq("id",orderId).maybeSingle();
            void db.from("order_public_snapshots_v1").update({open_count:Number(row.open_count||0)+1,last_opened_at:new Date().toISOString()}).eq("order_id",orderId).then(()=>{});
            return json(req,{ok:true,snapshot:row.snapshot,current_status:current.data?.status||null,current_status_updated_at:current.data?.updated_at||null});
          });
          '''
          Path('supabase/functions/order-public-view-v1').mkdir(parents=True,exist_ok=True)
          Path('supabase/functions/order-public-view-v1/index.ts').write_text(edge.strip()+"\n")

          page = r'''<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="referrer" content="no-referrer">
            <meta name="theme-color" content="#ffffff">
            <title>Seu pedido · Dona Antônia</title>
            <style>
              :root{--ink:#18221c;--muted:#657069;--line:#e3e8e4;--soft:#f5f7f5;--brand:#176b43;--danger:#9d2235}
              *{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.wrap{width:min(100%,760px);margin:auto;padding:18px 14px 48px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:92px;height:46px;object-fit:contain}.head div{flex:1}.head strong{display:block;font-size:19px}.head small{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.hero h1{font-size:23px;margin:0 0 3px}.muted{color:var(--muted)}.status{display:inline-flex;border-radius:999px;padding:6px 9px;background:#edf5f0;color:#135938;font-size:12px;font-weight:800;margin-top:10px}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.box{background:var(--soft);border-radius:12px;padding:11px}.box small{display:block;color:var(--muted);font-size:11px}.box strong{display:block;margin-top:3px}.section-title{font-size:17px;font-weight:900;margin:0 0 10px}.basket{border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-top:12px}.basket-head{display:flex;align-items:center;gap:12px;padding:12px;background:var(--soft)}.basket-head img{width:60px;height:60px;border-radius:11px;object-fit:contain;background:#fff}.basket-head strong{display:block}.basket-head small{color:var(--muted)}.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #eef1ef}.item:last-child{border-bottom:0}.item img{width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}.item-name{font-weight:750}.item-meta{color:var(--muted);font-size:12px;margin-top:2px}.item-price{text-align:right;font-weight:850;font-size:13px}.total{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:18px}.total strong{font-size:24px}.address{white-space:pre-line}.note{font-size:12px;color:var(--muted);margin-top:12px}.actions{display:grid;gap:9px;margin-top:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;text-decoration:none;font-weight:900}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.error{text-align:center;padding:50px 20px}.loading{text-align:center;padding:42px;color:var(--muted)}
              @media(max-width:520px){.summary{grid-template-columns:1fr}.item{grid-template-columns:52px minmax(0,1fr)}.item img{width:50px;height:50px}.item-price{grid-column:2;text-align:left;margin-top:-7px}}
            </style>
          </head>
          <body><main class="wrap"><div class="head"><img class="logo" src="/img/logoantonia5.png" alt="Dona Antônia"><div><strong>Dona Antônia</strong><small>Conferência do seu pedido</small></div></div><div id="app" class="card loading">Carregando seu pedido…</div></main>
          <script>
          (()=>{'use strict';const API='https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/order-public-view-v1',COMPANY='5565998150975';const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const qty=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});const uuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v);const statusLabel=s=>({received:'Recebido',confirmed:'Confirmado',separating:'Em separação',separated:'Separado',expedition:'Em expedição',out_for_delivery:'Saiu para entrega',delivered:'Entregue',cancelled:'Cancelado'}[String(s||'').toLowerCase()]||'Pedido recebido');
          function img(url,alt){return url?'<img src="'+esc(url)+'" alt="'+esc(alt)+'" loading="lazy">':'<div style="width:56px;height:56px;border:1px solid #e3e8e4;border-radius:10px;background:#f7f8f7"></div>'}
          function itemHtml(x,showPrice){return '<div class="item">'+img(x.image_url,x.name)+'<div><div class="item-name">'+esc(x.name)+'</div><div class="item-meta">Quantidade: <b>'+esc(qty(x.quantity))+'</b></div></div>'+(showPrice?'<div class="item-price">'+esc(money(x.unit_price))+' cada<br><span class="muted">'+esc(money(x.line_total))+'</span></div>':'')+'</div>'}
          function address(d){const l=[];if(d.street)l.push(d.street+(d.number?', '+d.number:''));if(d.complement)l.push(d.complement);if(d.district)l.push(d.district);if(d.city)l.push(d.city+(d.state?' - '+d.state:''));if(d.reference)l.push('Referência: '+d.reference);return l.join('\n')||'Endereço confirmado no pedido'}
          function render(data){const s=data.snapshot||{},items=Array.isArray(s.items)?s.items:[],baskets=Array.isArray(s.baskets)?s.baskets:[],groups=new Map(),standalone=[];for(const x of items){const bn=String(x.basket_name||'').trim();if(bn){if(!groups.has(bn))groups.set(bn,[]);groups.get(bn).push(x)}else standalone.push(x)}let products='';for(const [name,list] of groups){const meta=baskets.find(b=>String(b.name||'')===name)||{};products+='<div class="basket"><div class="basket-head">'+(meta.image_url?'<img src="'+esc(meta.image_url)+'" alt="'+esc(name)+'">':'')+'<div><strong>'+esc(name)+'</strong><small>'+esc(qty(meta.quantity||1))+' cesta(s) · itens escolhidos por você</small></div></div><div style="padding:0 12px">'+list.map(x=>itemHtml(x,false)).join('')+'</div></div>'}if(standalone.length)products+='<div style="margin-top:14px"><strong>Produtos avulsos</strong><div>'+standalone.map(x=>itemHtml(x,true)).join('')+'</div></div>';const d=s.delivery||{};app.className='';app.innerHTML='<section class="card hero"><h1>Pedido '+esc(s.order_number||'')+'</h1><div class="muted">Pedido salvo para conferência</div><span class="status">'+esc(statusLabel(data.current_status))+'</span><div class="summary"><div class="box"><small>Entrega</small><strong>'+esc(d.delivery_label||d.delivery_date||'A confirmar')+'</strong></div><div class="box"><small>Pagamento</small><strong>'+esc(s.payment_label||'A confirmar')+'</strong></div></div></section><section class="card"><h2 class="section-title">Produtos do pedido</h2>'+products+'</section><section class="card"><h2 class="section-title">Entrega</h2><strong>'+esc(s.customer_name||'Cliente')+'</strong><div class="address muted" style="margin-top:7px">'+esc(address(d))+'</div></section><section class="card total"><span>Total do pedido</span><strong>'+esc(money(s.total))+'</strong></section><div class="note">Esta página é somente para conferência. Ela não altera os produtos nem as quantidades do pedido.</div><div class="actions"><a class="btn primary" href="https://wa.me/'+COMPANY+'">Falar com a Dona Antônia</a><a class="btn secondary" href="/">Voltar à vitrine</a></div>'}
          async function main(){const id=new URLSearchParams(location.search).get('o')||'';if(!uuid(id)){app.className='card error';app.innerHTML='<h2>Pedido não encontrado</h2><p class="muted">Confira se você abriu o link completo recebido no WhatsApp.</p>';return}try{const r=await fetch(API+'?o='+encodeURIComponent(id),{cache:'no-store',referrerPolicy:'no-referrer'}),d=await r.json();if(!r.ok||d.ok!==true)throw new Error('not_found');render(d)}catch{app.className='card error';app.innerHTML='<h2>Não consegui abrir o pedido</h2><p class="muted">Tente novamente ou fale com a Dona Antônia.</p><div class="actions"><a class="btn primary" href="https://wa.me/'+COMPANY+'">Falar no WhatsApp</a></div>'}}
          main()})();
          </script></body></html>'''
          Path('pedido').mkdir(exist_ok=True)
          Path('pedido/index.html').write_text(page.strip()+"\n")

          new_render = r'''    function orderPublicUrl(saved){const id=String(saved?.order_id||saved?.id||'').trim();return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)?'https://donaantonia.com.br/pedido/?o='+encodeURIComponent(id):''}
              function renderOrderSuccess(saved){const orderNumber=saved?.order_number?String(saved.order_number).slice(0,80):'Pedido',detailUrl=orderPublicUrl(saved),whatsappUrl='https://wa.me/'+resolveWhatsappDestination();$('#sheetTitle').textContent='Pedido recebido';$('#sheetBody').innerHTML='<div class="rule-notice"><strong>'+esc(orderNumber)+'</strong><div style="margin-top:6px">Seu pedido foi registrado. A confirmação também será enviada ao seu WhatsApp com um link para conferir tudo.</div></div><div class="action-stack">'+(detailUrl?'<a class="primary order-summary-link" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="'+esc(detailUrl)+'">Ver meu pedido</a>':'')+'<a class="wa-fallback" href="'+esc(whatsappUrl)+'">Falar com a Dona Antônia</a><button type="button" class="secondary" id="backToStore">Voltar à vitrine</button></div>';$('#backToStore').onclick=closeSheet}'''
          for file in ['index.html','vitrine/index.html']:
              text=Path(file).read_text()
              text,n=re.subn(r"    function renderOrderSuccess\(url,saved\)\{.*?(?=\n    async function sendWhatsApp\(\)\{)",new_render,text,count=1,flags=re.S)
              assert n==1,(file,'renderOrderSuccess patch failed')
              old="""      const url='https://wa.me/'+resolveWhatsappDestination();\n      state.cart=[];state.addressConfirmed=false;state.checkoutDeliveryDate='';saveCart();paintCart();renderOrderSuccess(url,saved);\n      scheduleWhatsAppReturn(url,0);toast('Pedido recebido. A confirmação será enviada automaticamente quando o WhatsApp estiver identificado.')"""
              new="""      state.cart=[];state.addressConfirmed=false;state.checkoutDeliveryDate='';saveCart();paintCart();renderOrderSuccess(saved);\n      toast('Pedido recebido. Enviaremos no WhatsApp o link para conferir seu pedido.')"""
              assert old in text,(file,'checkout success block not found')
              text=text.replace(old,new,1)
              Path(file).write_text(text)

          resilience=Path('checkout-resilience.js').read_text()
          new_adjust = r'''  function confirmStockAdjustment(saved){
              const items=applyStockAdjustment(saved);if(!items.length)return false;
              const title=document.querySelector('#sheetTitle'),body=document.querySelector('#sheetBody'),action=document.querySelector('#sheetAction');if(!title||!body||!action)return false;
              const orderId=String(saved?.order_id||'').trim(),orderUrl=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(orderId)?'https://donaantonia.com.br/pedido/?o='+encodeURIComponent(orderId):'',total=Number(saved?.total_cents||0)/100;
              title.textContent='Pedido ajustado e recebido';
              body.innerHTML=`<div class="rule-notice warn"><strong>O estoque mudou enquanto você finalizava.</strong>${items.map(x=>`<div style="margin-top:7px">${escapeHtml(adjustmentLine(x))}</div>`).join('')}<div style="margin-top:10px"><b>Novo total: ${total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</b></div><div style="margin-top:6px">O pedido continuou normalmente com os itens disponíveis.</div></div>`;
              action.innerHTML='<div class="action-stack">'+(orderUrl?'<button type="button" class="primary" id="stockAdjustmentOrder">Ver meu pedido</button>':'')+'<button type="button" class="secondary" id="stockAdjustmentStore">Voltar à vitrine</button></div>';
              document.querySelector('#stockAdjustmentOrder')?.addEventListener('click',()=>{pendingAdjustment=null;window.location.assign(orderUrl)});
              document.querySelector('#stockAdjustmentStore')?.addEventListener('click',()=>{pendingAdjustment=null;document.querySelector('#closeSheet')?.click()});return true;
            }'''
          resilience,n=re.subn(r"  function confirmStockAdjustment\(saved\)\{.*?(?=\n  function escapeHtml)",new_adjust,resilience,count=1,flags=re.S)
          assert n==1,'stock adjustment patch failed'
          Path('checkout-resilience.js').write_text(resilience)

          admin=Path('vitrine/admin/index.html').read_text()
          company = r'''  function publicOrderUrlFor(o){const id=String(o?.id||'').trim();return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)?'https://donaantonia.com.br/pedido/?o='+encodeURIComponent(id):''}
            function currentOrderCompanyWhatsappMessage(){
              const d=state.currentOrder||{},o=d.order||{},customer=o.customer_snapshot&&typeof o.customer_snapshot==='object'?o.customer_snapshot:{},delivery=o.delivery_address&&typeof o.delivery_address==='object'?o.delivery_address:{},code=o.order_number||o.id||'',url=publicOrderUrlFor(o),lines=['PEDIDO DONA ANTONIA'];
              if(code)lines.push('','Pedido: '+code);
              const customerName=o.customer_name||customer.name||customer.display_name||delivery.customer_name||'';if(customerName)lines.push('Cliente: '+customerName);
              const total=Number(o.total||o.total_amount||0);if(Number.isFinite(total)&&total>0)lines.push('Total: '+total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}));
              if(url)lines.push('','Conferir pedido completo:',''+url);
              return lines.join('\n')
            }'''
          admin,n=re.subn(r"  function currentOrderCompanyWhatsappMessage\(\)\{.*?(?=\n  function openNativeWhatsapp)",company,admin,count=1,flags=re.S)
          assert n==1,'admin company message patch failed'
          customer = r'''  function currentOrderCustomerWhatsappMessage(){
              const d=state.currentOrder||{},o=d.order||{},code=o.order_number||o.id||'',url=publicOrderUrlFor(o),lines=['Ola! Seu pedido da Dona Antonia foi recebido.'];
              if(code)lines.push('Pedido: '+code);
              const total=Number(o.total||o.total_amount||0);if(Number.isFinite(total)&&total>0)lines.push('Total: '+total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}));
              if(url)lines.push('','Confira produtos, fotos, quantidades e entrega:',''+url);
              return lines.join('\n')
            }'''
          admin,n=re.subn(r"  function currentOrderCustomerWhatsappMessage\(\)\{.*?(?=\n  function openCurrentOrderCustomerWhatsapp)",customer,admin,count=1,flags=re.S)
          assert n==1,'admin customer message patch failed'
          Path('vitrine/admin/index.html').write_text(admin)

          checkout_test = r'''import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>fs.readFileSync(p,'utf8');
          const root=read('index.html'),vitrine=read('vitrine/index.html'),resilience=read('checkout-resilience.js');
          assert.equal(root,vitrine,'root and /vitrine storefronts must remain identical');
          assert.match(root,/Finalizar pedido/,'ready checkout button must say Finalizar pedido');
          assert.match(root,/function orderPublicUrl\(saved\)/,'checkout must build the private order summary URL');
          assert.match(root,/donaantonia\.com\.br\/pedido\/\?o=/,'checkout must point to the public order summary page');
          assert.match(root,/>Ver meu pedido<\/a>/,'success screen must offer the order summary');
          const send=root.match(/async function sendWhatsApp\(\)\{[\s\S]*?(?=\n\s*\$\('#globalSearchForm'\))/)?.[0]||'';
          assert.ok(send,'checkout submit handler must exist');
          assert.ok(send.indexOf("saved=await api('submit_order'")>=0,'order must be persisted before success');
          assert.ok(send.includes('renderOrderSuccess(saved)'),'success must render the saved order link');
          assert.ok(!send.includes('scheduleWhatsAppReturn(url,0)'),'checkout must not force-navigation to WhatsApp after persistence');
          assert.ok(!send.includes("const url='https://wa.me/'"),'checkout completion must not be driven by a company WhatsApp URL');
          assert.match(resilience,/Ver meu pedido/,'stock-adjusted success must also use the order summary link');
          assert.match(resilience,/donaantonia\.com\.br\/pedido\/\?o=/,'stock-adjusted success must point to the same order summary');
          assert.doesNotMatch(resilience,/id="stockAdjustmentOk">OK, ir para o WhatsApp/,'stock adjustment must not force a WhatsApp redirect');
          assert.match(root,/>Voltar à vitrine<\/button>/,'customer may stay on storefront');
          console.log('checkout public order summary contract: ok');
          '''
          Path('scripts/test-checkout-whatsapp-return.mjs').write_text(checkout_test.strip()+"\n")

          feature_test = r'''import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>fs.readFileSync(p,'utf8');
          const migration=read('supabase/migrations/20261003024500_order_public_summary.sql');
          const edge=read('supabase/functions/order-public-view-v1/index.ts');
          const page=read('pedido/index.html');
          const admin=read('vitrine/admin/index.html');
          assert.match(migration,/order_public_snapshots_v1/,'snapshot table required');
          assert.match(migration,/enable row level security/i,'snapshot table must have RLS');
          assert.match(migration,/revoke all on table public\.order_public_snapshots_v1 from anon, authenticated/i,'snapshot table must not be directly public');
          assert.match(migration,/after insert on public\.order_items/i,'snapshot must be created while checkout persists items');
          assert.match(edge,/ops2_refresh_order_public_snapshot_v1/,'old orders must be lazily snapshot-able');
          assert.match(edge,/Cache-Control":"private, no-store/,'public endpoint must not cache private order data');
          assert.match(page,/name="robots" content="noindex,nofollow,noarchive"/,'order page must not be indexed');
          assert.match(page,/name="referrer" content="no-referrer"/,'secret order id must not leak through referrers');
          assert.match(page,/Produtos do pedido/,'page must show order products');
          assert.match(page,/Produtos avulsos/,'standalone products section required');
          assert.match(page,/Quantidade:/,'quantities must be visible');
          assert.match(admin,/function publicOrderUrlFor/,'admin must reuse the order summary link');
          const company=admin.slice(admin.indexOf('function currentOrderCompanyWhatsappMessage'),admin.indexOf('function openNativeWhatsapp'));
          const customer=admin.slice(admin.indexOf('function currentOrderCustomerWhatsappMessage'),admin.indexOf('function openCurrentOrderCustomerWhatsapp'));
          assert.match(company,/Conferir pedido completo/,'company message must send the order link');
          assert.match(customer,/Confira produtos, fotos, quantidades e entrega/,'customer manual message must send the order link');
          assert.ok(!company.includes('appendCurrentOrderWhatsappItems'),'company message must no longer paste the full product list');
          assert.ok(!customer.includes('appendCurrentOrderWhatsappItems'),'customer manual message must no longer paste the full product list');
          console.log('public order summary + shared admin link contract: ok');
          '''
          Path('scripts/test-order-public-summary.mjs').write_text(feature_test.strip()+"\n")
          PY
          python3 /tmp/patch.py
      - name: GREEN verification
        shell: bash
        run: |
          node scripts/test-order-public-summary.mjs
          node scripts/test-checkout-whatsapp-return.mjs
          node scripts/test-checkout-stock-adjustment-contract.mjs
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node --check checkout-resilience.js
          git diff --check
      - name: Commit implementation
        shell: bash
