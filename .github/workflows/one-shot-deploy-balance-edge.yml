name: One-shot deploy balance edge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-deploy-balance-edge.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            supabase/functions/admin-products-live-v1
            supabase/functions/product-image-openai-v1
            .github/workflows/one-shot-deploy-balance-edge.yml
          sparse-checkout-cone-mode: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deploy credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN secret missing'; exit 20; }
      - name: Deploy admin-products-live-v1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-products-live-v1 --project-ref ssbesxgaijknwsjbsbcz --no-verify-jwt
      - name: Deploy product-image-openai-v1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy product-image-openai-v1 --project-ref ssbesxgaijknwsjbsbcz --no-verify-jwt
