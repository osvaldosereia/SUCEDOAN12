name: Bloquear dependências do Admin legado

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - 'scripts/test-admin-no-v3-runtime.mjs'
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - 'scripts/test-admin-no-v3-runtime.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  absence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar runtime oficial
        run: node scripts/test-admin-no-v3-runtime.mjs
      - name: Bloquear rotas e endpoints antigos em workflows ativos
        shell: bash
        run: |
          set -euo pipefail
          legacy_dir="admin""-v3/"
          legacy_api="admin""-v3-api"
          legacy_names="admin""-v3-product-names"
          guard_file='test-admin-legacy-absence.yml'
          if grep -R -n -F --exclude="$guard_file" "$legacy_dir" .github/workflows; then
            echo 'Workflow ainda referencia o diretório legado.' >&2
            exit 1
          fi
          if grep -R -n -E --exclude="$guard_file" "$legacy_api|$legacy_names" .github/workflows; then
            echo 'Workflow ainda referencia endpoint legado.' >&2
            exit 1
          fi
          test ! -d admin-v3
          test ! -d supabase/functions/admin-v3-api
          test ! -d supabase/functions/admin-v3-product-names
          test ! -e .github/workflows/apply-admin-runtime-migration.yml
          test ! -e .github/workflows/remove-admin-v3-legacy.yml
