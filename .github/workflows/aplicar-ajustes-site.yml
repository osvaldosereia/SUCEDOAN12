name: Aplicar ajustes controlados do site

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: aplicar-ajustes-controlados-site
  cancel-in-progress: false

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar a versão atual da main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Montar e validar aplicador
        shell: bash
        run: |
          set -euo pipefail
          cat .github/site-adjust-patch/base64-*.txt | base64 --decode > "$RUNNER_TEMP/patch-site.js"
          node --check "$RUNNER_TEMP/patch-site.js"

      - name: Aplicar somente os ajustes solicitados
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/patch-site.js"

      - name: Validar sintaxe dos módulos
        shell: bash
        run: |
          set -euo pipefail
          node --check app-next/src/commerce.js
          node --check app-next/src/main.js
          node --check app-next/src/checkout.js
          node --check app-next/src/integrations.js
          node --check app-next/src/ui.js

      - name: Validar consistência comercial
        run: node app-next/tests/cart-consistency.test.js

      - name: Validar smoke test modular
        run: node app-next/tests/smoke.test.js

      - name: Executar verificador público
        id: public_check
        continue-on-error: true
        shell: bash
        run: node scripts/check-public-site.mjs > "$RUNNER_TEMP/public-error.log" 2>&1

      - name: Anexar diagnóstico público
        if: steps.public_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: public-error
          path: ${{ runner.temp }}/public-error.log
          if-no-files-found: error
          retention-days: 1

      - name: Confirmar verificador público
        if: steps.public_check.outcome == 'failure'
        run: exit 1

      - name: Publicar alterações validadas
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/site-adjust-patch
          rm -f .github/workflows/aplicar-ajustes-site.yml
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git commit -m "Ajusta consistência do carrinho e navegação do site"
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Alterações publicadas."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          echo "Não foi possível publicar após cinco tentativas." >&2
          exit 1
