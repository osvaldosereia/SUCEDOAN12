name: Release WhatsApp Flow V3 Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-flow-v26-meta.yml'

permissions:
  contents: read

concurrency:
  group: release-whatsapp-flow-v3
  cancel-in-progress: false

jobs:
  meta-release:
    runs-on: ubuntu-latest
    env:
      GRAPH_VERSION: v26.0
      WABA_ID: '840102181903253'
      SOURCE_FLOW_ID: '1539877778181619'
      FLOW_NAME: 'Dona Antônia - Cestas Comercial V3'
      ENDPOINT_URI: 'https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/whatsapp-flow-data-exchange-v1'
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Meta token
        shell: bash
        run: |
          test -n "$META_ACCESS_TOKEN" || { echo 'META_ACCESS_TOKEN GitHub secret is missing' >&2; exit 2; }

      - name: Validate local candidate
        shell: bash
        run: |
          python -m json.tool whatsapp/flows/flow-cestas-comercial-v26.json >/dev/null
          python - <<'PY'
          import json
          p='whatsapp/flows/flow-cestas-comercial-v26.json'
          f=json.load(open(p,encoding='utf-8'))
          ids=[s['id'] for s in f['screens']]
          assert len(ids)==12
          assert not any(x.startswith('TERMOS_') or x.startswith('PRODUTO_') for x in ids)
          assert 'UPSELL' not in ids
          for suffix in 'ABC':
              s=next(x for x in f['screens'] if x['id']==f'PRODUTOS_{suffix}')
              assert sum(c.get('type')=='Image' for c in s['layout']['children'])==3
              assert sum(c.get('type')=='Dropdown' for c in s['layout']['children'])==3
          print('local_candidate_ok')
          PY

      - name: Resolve or create Meta draft
        id: flow
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" \
            "https://graph.facebook.com/$GRAPH_VERSION/$WABA_ID/flows?fields=id,name,status&limit=100")
          FLOW_ID=$(printf '%s' "$LIST" | jq -r --arg NAME "$FLOW_NAME" '.data[]? | select(.name==$NAME) | .id' | head -n1)
          STATUS=$(printf '%s' "$LIST" | jq -r --arg NAME "$FLOW_NAME" '.data[]? | select(.name==$NAME) | .status' | head -n1)
          if [ -z "$FLOW_ID" ]; then
            CREATED=$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $META_ACCESS_TOKEN" \
              --data-urlencode "name=$FLOW_NAME" \
              --data-urlencode 'categories=["OTHER"]' \
              --data-urlencode "clone_flow_id=$SOURCE_FLOW_ID" \
              --data-urlencode "endpoint_uri=$ENDPOINT_URI" \
              "https://graph.facebook.com/$GRAPH_VERSION/$WABA_ID/flows")
            FLOW_ID=$(printf '%s' "$CREATED" | jq -r '.id // empty')
            test -n "$FLOW_ID" || { echo "$CREATED" | jq .; exit 3; }
            STATUS=DRAFT
          fi
          echo "flow_id=$FLOW_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "META_FLOW_ID=$FLOW_ID"
          echo "META_INITIAL_STATUS=$STATUS"

      - name: Upload and officially validate Flow JSON
        if: steps.flow.outputs.status != 'PUBLISHED'
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" \
            -F 'asset_type=FLOW_JSON' \
            -F 'file=@whatsapp/flows/flow-cestas-comercial-v26.json;type=application/json' \
            "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID/assets")
          echo "$RESPONSE" | jq .
          SUCCESS=$(printf '%s' "$RESPONSE" | jq -r '.success // false')
          ERRORS=$(printf '%s' "$RESPONSE" | jq -c '.validation_errors // []')
          echo "META_UPLOAD_SUCCESS=$SUCCESS"
          echo "META_VALIDATION_ERRORS=$ERRORS"
          test "$SUCCESS" = true
          test "$ERRORS" = '[]'

      - name: Verify metadata before publish
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          META=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" \
            "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID?fields=id,name,status,validation_errors,json_version,data_api_version,endpoint_uri")
          echo "$META" | jq .
          ERRORS=$(printf '%s' "$META" | jq -c '.validation_errors // []')
          test "$ERRORS" = '[]'

      - name: Publish validated V3
        if: steps.flow.outputs.status != 'PUBLISHED'
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" \
            "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID/publish")
          echo "$RESPONSE" | jq .
          test "$(printf '%s' "$RESPONSE" | jq -r '.success // false')" = true

      - name: Final Meta health and publication check
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          META=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" \
            "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID?fields=id,name,status,validation_errors,json_version,data_api_version,endpoint_uri,health_status")
          echo "$META" | jq .
          test "$(printf '%s' "$META" | jq -r '.status')" = 'PUBLISHED'
          test "$(printf '%s' "$META" | jq -c '.validation_errors // []')" = '[]'
          echo "META_FLOW_ID=$FLOW_ID"
          echo 'META_RELEASE_READY=true'
