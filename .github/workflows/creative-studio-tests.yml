name: Creative Studio tests

on:
  push:
    branches:
      - feat/stopmotion-smart-director
    paths:
      - 'marketing/creative-studio/**'
      - 'admin/creative-studio.*'
      - 'supabase/functions/creative-studio-*/**'
      - 'supabase/migrations/*creative_studio*'
      - '.github/workflows/creative-studio-tests.yml'
  pull_request:
    paths:
      - 'marketing/creative-studio/**'
      - 'admin/creative-studio.*'
      - 'supabase/functions/creative-studio-*/**'
      - 'supabase/migrations/*creative_studio*'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Creative Studio unit tests
        run: node --test marketing/creative-studio/tests/*.test.js
      - name: JavaScript syntax
        run: |
          find marketing/creative-studio -maxdepth 2 -type f -name '*.js' ! -path '*/tests/*' -print0 | xargs -0 -n1 node --check
          node --check admin/creative-studio.js
      - name: Admin surface contract
        run: |
          grep -q 'Estúdio Criativo' admin/creative-studio.html
          grep -q './creative-studio.html' admin/index.html
          grep -q 'creative-studio-director' admin/creative-studio.js
          grep -q 'creative-studio-assets-v1' admin/creative-studio.js
