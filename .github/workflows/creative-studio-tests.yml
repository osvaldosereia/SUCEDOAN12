name: Creative Studio tests

on:
  push:
    branches:
      - feat/stopmotion-smart-director
    paths:
      - 'marketing/creative-studio/**'
      - 'admin/creative-studio.*'
      - 'admin/index.html'
      - 'scripts/creative-studio-*'
      - 'supabase/functions/creative-studio-*/**'
      - 'supabase/migrations/*creative_studio*'
      - '.github/workflows/creative-studio-tests.yml'
  pull_request:
    paths:
      - 'marketing/creative-studio/**'
      - 'admin/creative-studio.*'
      - 'scripts/creative-studio-*'
      - 'supabase/functions/creative-studio-*/**'
      - 'supabase/migrations/*creative_studio*'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Creative Studio unit tests
        run: node --test marketing/creative-studio/tests/*.test.js
      - name: JavaScript syntax
        run: |
          find marketing/creative-studio -maxdepth 2 -type f -name '*.js' ! -path '*/tests/*' -print0 | xargs -0 -n1 node --check
          node --check admin/creative-studio.js
          node --check scripts/creative-studio-render-worker.mjs
          node --check scripts/creative-studio-render-smoke.mjs
      - name: Admin separation contract
        run: |
          grep -q 'PROJETO SEPARADO' admin/creative-studio.html
          grep -q 'Estúdio Criativo · Reels' admin/index.html
          grep -q 'não altera' marketing/creative-studio/PROJECT-BOUNDARIES.md
          grep -q 'creative-studio-director' admin/creative-studio.js
          grep -q 'creative-studio-assets-v1' admin/creative-studio.js
          grep -q 'creative-studio-jobs-v1' admin/creative-studio.js
      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Real MP4 smoke render
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          node scripts/creative-studio-render-smoke.mjs
