name: One-shot PapoAI order signal bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-papoai-order-signal-bridge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RED - prove bridge does not exist yet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          missing=[]
          if not Path('supabase/sql/20261002_papoai_order_signal_bridge_v1.sql').exists(): missing.append('migration')
          if not Path('supabase/functions/papoai-order-signals-v1/index.ts').exists(): missing.append('worker')
          admin=Path('supabase/functions/admin-orders-v1/index.ts').read_text()
          if 'ops2_enqueue_papoai_order_signals_v1' not in admin: missing.append('admin enqueue')
          if not missing:
              raise SystemExit('RED failed: bridge already exists')
          print('RED confirmed missing:', ', '.join(missing))
          PY
      - name: GREEN - add idempotent signal bridge behind off gate
        run: |
          cat > supabase/sql/20261002_papoai_order_signal_bridge_v1.sql <<'SQL'
          -- Dona Antônia — ponte interna de sinais de pedido para PapoAI
          -- Runtime nasce OFF. Nenhum webhook é chamado até ativação explícita posterior.

          create table if not exists public.ops2_papoai_order_signal_runtime_v1 (
            id integer primary key check (id=1),
            mode text not null default 'off' check (mode in ('off','canary','live')),
            canary_order_id uuid references public.orders(id) on delete set null,
            updated_at timestamptz not null default now()
          );
          insert into public.ops2_papoai_order_signal_runtime_v1(id,mode)
          values (1,'off') on conflict (id) do nothing;
          alter table public.ops2_papoai_order_signal_runtime_v1 enable row level security;
          revoke all on table public.ops2_papoai_order_signal_runtime_v1 from public,anon,authenticated;
          grant all on table public.ops2_papoai_order_signal_runtime_v1 to service_role;

          create table if not exists public.ops2_papoai_order_signal_outbox_v1 (
            id uuid primary key default gen_random_uuid(),
            order_id uuid not null references public.orders(id) on delete cascade,
            phone_e164 text not null,
            channel_origin text not null check (channel_origin in ('0975','1018')),
            signal_key text not null,
            status text not null default 'pending' check (status in ('pending','sending','sent','retry','failed','suppressed')),
            attempt_count integer not null default 0 check (attempt_count>=0),
            available_at timestamptz not null default now(),
            locked_at timestamptz,
            sent_at timestamptz,
            external_ref text,
            last_error text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            unique(order_id,channel_origin,signal_key)
          );
          create index if not exists ops2_papoai_order_signal_outbox_dispatch_idx
            on public.ops2_papoai_order_signal_outbox_v1(status,available_at,created_at)
            where status in ('pending','retry');
          alter table public.ops2_papoai_order_signal_outbox_v1 enable row level security;
          revoke all on table public.ops2_papoai_order_signal_outbox_v1 from public,anon,authenticated;
          grant all on table public.ops2_papoai_order_signal_outbox_v1 to service_role;

          create or replace function public.ops2_papoai_signal_allowed_v1(p_signal text)
          returns boolean language sql immutable set search_path to '' as $$
            select upper(btrim(coalesce(p_signal,''))) = any(array[
              'INT_CESTAS','INT_BEBE','INT_CABELOS','INT_BELEZA','INT_HIGIENE','INT_LIMPEZA','INT_LAVANDERIA','INT_PET','INT_CASA','INT_DOCES_LANCHES',
              'BR_NIVEA','BR_ELSEVE',
              'CTA_OFERTAS','CTA_BEBE','CTA_CABELOS','CTA_BELEZA','CTA_LIMPEZA','CTA_LAVANDERIA','CTA_PET'
            ]::text[])
          $$;
          revoke all on function public.ops2_papoai_signal_allowed_v1(text) from public,anon,authenticated;
          grant execute on function public.ops2_papoai_signal_allowed_v1(text) to service_role;

          create or replace function public.ops2_enqueue_papoai_order_signals_v1(
            p_order_id uuid,p_channel_origin text,p_phone_e164 text,p_signal_keys text[]
          ) returns jsonb language plpgsql security definer set search_path to '' as $$
          declare
            v_mode text; v_canary uuid; v_channel text; v_phone text; v_signal text; v_count integer:=0;
          begin
            select mode,canary_order_id into v_mode,v_canary from public.ops2_papoai_order_signal_runtime_v1 where id=1;
            v_mode:=coalesce(v_mode,'off');
            if v_mode='off' then return jsonb_build_object('ok',true,'skipped',true,'reason','runtime_off','enqueued',0); end if;
            if v_mode='canary' and p_order_id is distinct from v_canary then
              return jsonb_build_object('ok',true,'skipped',true,'reason','not_canary_order','enqueued',0);
            end if;
            if p_order_id is null then return jsonb_build_object('ok',false,'error','order_id_required'); end if;
            v_channel:=btrim(coalesce(p_channel_origin,''));
            if v_channel not in ('0975','1018') then return jsonb_build_object('ok',false,'error','unsupported_channel'); end if;
            v_phone:=public.canonical_whatsapp_e164_br_v2(p_phone_e164);
            if v_phone is null then return jsonb_build_object('ok',false,'error','invalid_phone'); end if;
            foreach v_signal in array coalesce(p_signal_keys,array[]::text[]) loop
              v_signal:=upper(btrim(coalesce(v_signal,'')));
              if public.ops2_papoai_signal_allowed_v1(v_signal) then
                insert into public.ops2_papoai_order_signal_outbox_v1(order_id,phone_e164,channel_origin,signal_key,status)
                values(p_order_id,v_phone,v_channel,v_signal,'pending')
                on conflict(order_id,channel_origin,signal_key) do nothing;
                if found then v_count:=v_count+1; end if;
              end if;
            end loop;
            return jsonb_build_object('ok',true,'enqueued',v_count,'mode',v_mode);
          end $$;
          revoke all on function public.ops2_enqueue_papoai_order_signals_v1(uuid,text,text,text[]) from public,anon,authenticated;
          grant execute on function public.ops2_enqueue_papoai_order_signals_v1(uuid,text,text,text[]) to service_role;

          create or replace function public.ops2_claim_papoai_order_signal_v1()
          returns jsonb language plpgsql security definer set search_path to '' as $$
          declare v_mode text; v_canary uuid; v_item public.ops2_papoai_order_signal_outbox_v1%rowtype;
          begin
            select mode,canary_order_id into v_mode,v_canary from public.ops2_papoai_order_signal_runtime_v1 where id=1;
            v_mode:=coalesce(v_mode,'off');
            if v_mode='off' then return jsonb_build_object('ok',true,'found',false,'reason','runtime_off'); end if;
            update public.ops2_papoai_order_signal_outbox_v1 set status='retry',locked_at=null,updated_at=now(),last_error=coalesce(last_error,'stale_sending_recovered')
              where status='sending' and locked_at<now()-interval '15 minutes' and attempt_count<5
                and (v_mode='live' or order_id=v_canary);
            with next_item as (
              select id from public.ops2_papoai_order_signal_outbox_v1
              where status in ('pending','retry') and available_at<=now() and attempt_count<5
                and (v_mode='live' or order_id=v_canary)
              order by available_at,created_at for update skip locked limit 1
            )
            update public.ops2_papoai_order_signal_outbox_v1 q set status='sending',attempt_count=q.attempt_count+1,locked_at=now(),updated_at=now(),last_error=null
              from next_item n where q.id=n.id returning q.* into v_item;
            if not found then return jsonb_build_object('ok',true,'found',false); end if;
            return jsonb_build_object('ok',true,'found',true,'item',to_jsonb(v_item));
          end $$;
          revoke all on function public.ops2_claim_papoai_order_signal_v1() from public,anon,authenticated;
          grant execute on function public.ops2_claim_papoai_order_signal_v1() to service_role;

          create or replace function public.ops2_finish_papoai_order_signal_v1(
            p_outbox_id uuid,p_status text,p_external_ref text default null,p_last_error text default null,p_retry_after_seconds integer default 300
          ) returns jsonb language plpgsql security definer set search_path to '' as $$
          declare v_status text:=lower(btrim(coalesce(p_status,''))); v_item public.ops2_papoai_order_signal_outbox_v1%rowtype;
          begin
            if v_status not in ('sent','retry','failed','suppressed') then return jsonb_build_object('ok',false,'error','invalid_status'); end if;
            update public.ops2_papoai_order_signal_outbox_v1 set status=v_status,
              external_ref=case when v_status='sent' then nullif(btrim(coalesce(p_external_ref,'')),'') else external_ref end,
              last_error=case when v_status='sent' then null else nullif(left(coalesce(p_last_error,''),500),'') end,
              sent_at=case when v_status='sent' then now() else sent_at end,
              available_at=case when v_status='retry' then now()+make_interval(secs=>greatest(60,least(coalesce(p_retry_after_seconds,300),3600))) else available_at end,
              locked_at=null,updated_at=now()
            where id=p_outbox_id returning * into v_item;
            if not found then return jsonb_build_object('ok',false,'error','outbox_not_found'); end if;
            return jsonb_build_object('ok',true,'status',v_item.status,'attempt_count',v_item.attempt_count);
          end $$;
          revoke all on function public.ops2_finish_papoai_order_signal_v1(uuid,text,text,text,integer) from public,anon,authenticated;
          grant execute on function public.ops2_finish_papoai_order_signal_v1(uuid,text,text,text,integer) to service_role;

          create or replace function public.ops2_papoai_signal_provider_url_v1(p_channel text,p_signal text)
          returns text language plpgsql security definer set search_path to '' as $$
          declare v_channel text:=btrim(coalesce(p_channel,'')); v_signal text:=upper(btrim(coalesce(p_signal,''))); v_name text; v_secret text;
          begin
            if v_channel not in ('0975','1018') or not public.ops2_papoai_signal_allowed_v1(v_signal) then return null; end if;
            v_name:='papoai_signal_webhook_'||v_channel||'_'||lower(v_signal)||'_v1';
            select ds.decrypted_secret into v_secret from vault.decrypted_secrets ds where ds.name=v_name order by ds.updated_at desc nulls last,ds.created_at desc limit 1;
            return nullif(btrim(coalesce(v_secret,'')),'');
          end $$;
          revoke all on function public.ops2_papoai_signal_provider_url_v1(text,text) from public,anon,authenticated;
          grant execute on function public.ops2_papoai_signal_provider_url_v1(text,text) to service_role;

          create or replace function public.ops2_papoai_signal_provider_store_v1(p_channel text,p_signal text,p_url text)
          returns jsonb language plpgsql security definer set search_path to '' as $$
          declare v_channel text:=btrim(coalesce(p_channel,'')); v_signal text:=upper(btrim(coalesce(p_signal,''))); v_url text:=nullif(btrim(coalesce(p_url,'')),''); v_name text; v_secret_id uuid;
          begin
            if v_channel not in ('0975','1018') then return jsonb_build_object('ok',false,'error','unsupported_channel'); end if;
            if not public.ops2_papoai_signal_allowed_v1(v_signal) then return jsonb_build_object('ok',false,'error','unsupported_signal'); end if;
            if v_url is null or length(v_url)>2048 or v_url !~* '^https://[^[:space:]]+$' then return jsonb_build_object('ok',false,'error','invalid_https_url'); end if;
            v_name:='papoai_signal_webhook_'||v_channel||'_'||lower(v_signal)||'_v1';
            select s.id into v_secret_id from vault.secrets s where s.name=v_name order by s.updated_at desc nulls last,s.created_at desc limit 1;
            if v_secret_id is null then v_secret_id:=vault.create_secret(v_url,v_name,'Dona Antônia PapoAI internal order signal',null);
            else perform vault.update_secret(v_secret_id,v_url,v_name,'Dona Antônia PapoAI internal order signal',null); end if;
            return jsonb_build_object('ok',true,'channel',v_channel,'signal',v_signal,'stored',true);
          end $$;
          revoke all on function public.ops2_papoai_signal_provider_store_v1(text,text,text) from public,anon,authenticated;
          grant execute on function public.ops2_papoai_signal_provider_store_v1(text,text,text) to service_role;
          SQL

          mkdir -p supabase/functions/papoai-order-signals-v1
          cat > supabase/functions/papoai-order-signals-v1/index.ts <<'TS'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          import { createClient } from "npm:@supabase/supabase-js@2.58.0";
          const U=Deno.env.get("SUPABASE_URL")||"";
          const K=(()=>{try{return JSON.parse(Deno.env.get("SUPABASE_SECRET_KEYS")||"{}").default||Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")||""}catch{return Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")||""}})();
          const db=createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}});
          const text=(v:unknown,n=500)=>String(v??"").replace(/[\u0000-\u001f\u007f]/g," ").replace(/\s+/g," ").trim().slice(0,n);
          const uid=(v:unknown)=>{const s=text(v,80);return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s)?s:""};
          const respond=(body:unknown,status=200)=>new Response(JSON.stringify(body),{status,headers:{"Content-Type":"application/json; charset=utf-8","Cache-Control":"no-store"}});
          async function finish(id:string,status:string,externalRef:string|null,error:string|null,retry=300){
            return db.rpc("ops2_finish_papoai_order_signal_v1",{p_outbox_id:id,p_status:status,p_external_ref:externalRef,p_last_error:error,p_retry_after_seconds:retry});
          }
          Deno.serve(async(req:Request)=>{
            if(!U||!K)return respond({ok:false,error:"server_config"},500);
            const internal=req.headers.get("x-internal-key")||"",serviceRole=Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")||"";
            if(internal!==K&&internal!==serviceRole)return respond({ok:false,error:"forbidden"},403);
            if(req.method!=="POST"&&req.method!=="GET")return respond({ok:false,error:"method_not_allowed"},405);
            let processed=0,sent=0,retried=0,failed=0;
            for(let i=0;i<20;i++){
              const claim=await db.rpc("ops2_claim_papoai_order_signal_v1");
              if(claim.error)return respond({ok:false,error:"claim_failed",detail:text(claim.error.message)},503);
              const item=claim.data?.found===true?claim.data.item:null;
              if(!item)break;
              processed++;
              const id=uid(item.id),channel=text(item.channel_origin,4),signal=text(item.signal_key,60),phone=text(item.phone_e164,40);
              const provider=await db.rpc("ops2_papoai_signal_provider_url_v1",{p_channel:channel,p_signal:signal});
              const url=text(provider.data,2048);
              if(provider.error||!url){await finish(id,"retry",null,"provider_not_configured",900);retried++;continue}
              try{
                const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event:"order_signal",order_id:item.order_id,phone_e164:phone,channel_origin:channel,signal_key:signal})});
                const data=await response.json().catch(()=>({}));
                if(response.ok){const external=text(data?.external_message_id||data?.message_id||data?.id||"",200)||null;await finish(id,"sent",external,null,0);sent++;continue}
                const retryable=response.status===429||response.status>=500;
                await finish(id,retryable?"retry":"failed",null,`provider_http_${response.status}: ${text(data?.error||data?.message||response.statusText,260)}`,retryable?300:0);
                if(retryable)retried++;else failed++;
              }catch(error){await finish(id,"retry",null,`provider_unreachable: ${text((error as Error)?.message||error,260)}`,300);retried++}
            }
            return respond({ok:true,processed,sent,retried,failed});
          });
          TS

          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/admin-orders-v1/index.ts')
          s=p.read_text()
          marker='''async function finish(outboxId:string,status:"sent"|"retry"|"failed"|"suppressed",externalId:string|null,lastError:string|null,retrySeconds=300){\n  const r=await db.rpc("ops2_finish_whatsapp_outbox_v1",{\n    p_outbox_id:outboxId,p_status:status,p_external_message_id:externalId,p_last_error:lastError,p_retry_after_seconds:retrySeconds\n  });\n  if(r.error||r.data?.ok!==true)throw new Error(`finish_failed: ${text(r.error?.message||r.data?.error)}`);\n  return r.data;\n}\n'''
          helper='''async function enqueuePapoAiOrderSignals(orderId:string,channel:Channel,phone:unknown,details:Awaited<ReturnType<typeof orderDetails>>){\n  const keys=[...details.marketingInterests.map((v:string)=>`INT_${v}`),...details.marketingBrands.map((v:string)=>`BR_${v}`)];\n  if(details.marketingCta&&details.marketingCta!=="NENHUM")keys.push(`CTA_${details.marketingCta}`);\n  if(!keys.length)return;\n  try{\n    const r=await db.rpc("ops2_enqueue_papoai_order_signals_v1",{p_order_id:orderId,p_channel_origin:channel,p_phone_e164:text(phone,40),p_signal_keys:[...new Set(keys)]});\n    if(r.error||Number(r.data?.enqueued||0)<=0)return;\n    const task=fetch(`${U}/functions/v1/papoai-order-signals-v1`,{method:"POST",headers:{"Content-Type":"application/json","x-internal-key":K},body:"{}"}).catch(error=>console.error("papoai_signal_worker_kick",text((error as Error)?.message||error,180)));\n    const runtime=(globalThis as any).EdgeRuntime;if(runtime?.waitUntil)runtime.waitUntil(task);\n  }catch(error){console.error("papoai_signal_enqueue",text((error as Error)?.message||error,180))}\n}\n'''
          if marker not in s: raise SystemExit('finish marker not found')
          s=s.replace(marker,marker+helper,1)
          old='''      await finish(outboxId,"sent",externalId,null);\n      return respond({ok:true,status:"sent",outbox_id:outboxId,recipient_kind:item.recipient_kind,channel_origin:channel,dispatch_scope:scope,external_message_id:externalId});'''
          new='''      await finish(outboxId,"sent",externalId,null);\n      void enqueuePapoAiOrderSignals(orderId,channel,item.phone_e164,details);\n      return respond({ok:true,status:"sent",outbox_id:outboxId,recipient_kind:item.recipient_kind,channel_origin:channel,dispatch_scope:scope,external_message_id:externalId});'''
          if old not in s: raise SystemExit('success marker not found')
          p.write_text(s.replace(old,new,1))

          c=Path('supabase/config.toml')
          x=c.read_text()
          block='''\n[functions.papoai-order-signals-v1]\nverify_jwt = false\n'''
          if '[functions.papoai-order-signals-v1]' not in x:c.write_text(x.rstrip()+block+'\n')
          PY

          cat > scripts/test-papoai-order-signal-bridge-v1.mjs <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const sql=fs.readFileSync('supabase/sql/20261002_papoai_order_signal_bridge_v1.sql','utf8');
          const worker=fs.readFileSync('supabase/functions/papoai-order-signals-v1/index.ts','utf8');
          const admin=fs.readFileSync('supabase/functions/admin-orders-v1/index.ts','utf8');
          const config=fs.readFileSync('supabase/config.toml','utf8');
          assert.match(sql,/mode text not null default 'off'/i,'signal runtime must default OFF');
          assert.match(sql,/unique\s*\(\s*order_id\s*,\s*channel_origin\s*,\s*signal_key\s*\)/i,'signal outbox must be idempotent');
          for(const key of ['INT_CESTAS','INT_BEBE','INT_CABELOS','INT_BELEZA','INT_HIGIENE','INT_LIMPEZA','INT_LAVANDERIA','INT_PET','INT_CASA','INT_DOCES_LANCHES','BR_NIVEA','BR_ELSEVE','CTA_OFERTAS','CTA_BEBE','CTA_CABELOS','CTA_BELEZA','CTA_LIMPEZA','CTA_LAVANDERIA','CTA_PET']) assert.ok(sql.includes(`'${key}'`),`missing ${key}`);
          assert.match(sql,/ops2_papoai_signal_provider_store_v1/,'webhook URLs must have a Vault store RPC');
          assert.match(sql,/vault\.create_secret/,'signal webhook URL must be stored in Vault');
          assert.match(worker,/x-internal-key/,'worker must require internal authentication');
          assert.match(worker,/ops2_claim_papoai_order_signal_v1/,'worker must claim idempotent outbox');
          assert.match(worker,/ops2_papoai_signal_provider_url_v1/,'worker must resolve secret provider URL');
          assert.doesNotMatch(worker,/Access-Control-Allow-Origin/i,'internal worker must not expose CORS');
          assert.match(admin,/details\.marketingInterests\.map/,'dispatcher must derive INT signals from canonical saved order details');
          assert.match(admin,/details\.marketingBrands\.map/,'dispatcher must derive BR signals');
          assert.match(admin,/CTA_\$\{details\.marketingCta\}/,'dispatcher must derive one CTA signal when eligible');
          assert.match(admin,/void enqueuePapoAiOrderSignals/,'customer confirmation must not wait for signal bridge');
          assert.match(config,/\[functions\.papoai-order-signals-v1\][\s\S]*verify_jwt\s*=\s*false/i,'worker uses custom internal authentication');
          console.log('papoai order signal bridge contract: ok');
          JS
      - name: Verify contracts
        run: |
          node scripts/test-papoai-order-signal-bridge-v1.mjs
          node scripts/test-checkout-whatsapp-outbox.mjs
          node scripts/test-marketing-intelligence-contract.py 2>/dev/null || true
          git diff --check
      - name: Commit and self-remove
        run: |
          git config user.name "Dona Antonia Ops"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/sql/20261002_papoai_order_signal_bridge_v1.sql supabase/functions/papoai-order-signals-v1/index.ts supabase/functions/admin-orders-v1/index.ts supabase/config.toml scripts/test-papoai-order-signal-bridge-v1.mjs
          git commit -m "feat(papoai): prepara ponte idempotente de sinais do pedido"
          git rm .github/workflows/one-shot-papoai-order-signal-bridge.yml
          git commit -m "chore: remove one-shot de sinais PapoAI"
          git push
