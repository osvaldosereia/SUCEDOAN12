name: Temporary basket lot rerender state fix
on:
  push:
    branches:
      - refactor/baskets-canonical-section-20261005
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[basket-lot-rerender-state-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/baskets-canonical-section-20261005
      - run: python scripts/tmp-fix-basket-lot-rerender-state.py
      - name: Commit rerender state fix
        run: |
          if git diff --quiet -- vitrine/admin/basket-guided-builder.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/basket-guided-builder.js
          git commit -m 'fix: preservar campos do lote em rerenders vinculados [basket-lot-rerender-state-applied]'
          git push origin HEAD:refactor/baskets-canonical-section-20261005
