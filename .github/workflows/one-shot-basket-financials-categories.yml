name: One-shot basket financials categories
on:
  push:
    branches: [feat/basket-financials-categories-20261004]
    paths:
      - 'scripts/patch-basket-financials-categories-v3.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/basket-financials-categories-20261004
      - run: python scripts/patch-basket-financials-categories-v3.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: proteger categorias e somatórios"
          git push
