name: Apply basket linked lot type + categories patch

on:
  push:
    branches:
      - fix/basket-linked-lot-type-categories-20261004
    paths:
      - 'scripts/apply-basket-linked-lot-type-categories.mjs'
      - '.github/workflows/apply-basket-linked-lot-type-categories.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/basket-linked-lot-type-categories-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-basket-linked-lot-type-categories.mjs
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: filtrar lote vinculado por tipo e fixar categorias"
            git push origin HEAD:fix/basket-linked-lot-type-categories-20261004
          fi
