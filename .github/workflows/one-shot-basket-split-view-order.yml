name: One-shot basket split view order
on:
  push:
    branches: [feat/basket-lot-types-link-financials-20261004]
    paths:
      - 'scripts/patch-basket-split-view-order.py'
      - '.github/workflows/one-shot-basket-split-view-order.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch-basket-split-view-order.py
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-types-links-financials.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/sql/20261004_basket_lot_types_links_financials_v1.sql
          git commit -m "fix: preserve split view column order" || exit 0
          git push
