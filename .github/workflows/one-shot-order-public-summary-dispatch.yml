name: dispatch-order-public-summary
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-order-public-summary-dispatch.yml]
permissions:
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-public-summary-link
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and execute branch implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          y=Path('.github/workflows/one-shot-order-public-summary.yml').read_text()
          m=re.search(r"cat > /tmp/patch\.py <<'PY'\n(.*?)\n          PY\n          python3 /tmp/patch\.py",y,re.S)
          if not m: raise SystemExit('branch patch payload not found')
          lines=m.group(1).splitlines()
          lines=[line[10:] if line.startswith('          ') else line for line in lines]
          Path('/tmp/patch.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/patch.py
          node scripts/test-order-public-summary.mjs
          node scripts/test-checkout-whatsapp-return.mjs
          node scripts/test-checkout-stock-adjustment-contract.mjs
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node --check checkout-resilience.js
          git diff --check
      - name: Commit only to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-order-public-summary.yml
          git add index.html vitrine/index.html vitrine/admin/index.html checkout-resilience.js pedido/index.html scripts/test-checkout-whatsapp-return.mjs scripts/test-order-public-summary.mjs supabase/functions/order-public-view-v1/index.ts supabase/migrations/20261003024500_order_public_summary.sql
          git commit -m "feat: adicionar resumo publico do pedido"
          git push origin HEAD:feat/order-public-summary-link
      - name: Remove dispatcher from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-order-public-summary-dispatch.yml
          git commit -m "chore: remover dispatcher temporario"
          git push origin main
