name: Public basket controls

on:
  push:
    branches:
      - fix/public-basket-qty-remove-20261006
    paths:
      - 'scripts/patch-public-basket-controls.mjs'
      - 'tests/public-basket-item-controls.test.mjs'
      - '.github/workflows/one-shot-public-basket-controls.yml'
      - 'index.html'
      - 'vitrine/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-basket-qty-remove-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch only when regression is still red
        run: |
          if node --test tests/public-basket-item-controls.test.mjs; then
            echo "Basket controls are already applied."
            exit 0
          fi
          node scripts/patch-public-basket-controls.mjs
          node --test tests/public-basket-item-controls.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vitrine/index.html
          if git diff --cached --quiet; then
            echo "No storefront changes to commit."
            exit 0
          fi
          git commit -m "fix: restore editable basket item controls"
          git push origin HEAD:fix/public-basket-qty-remove-20261006
