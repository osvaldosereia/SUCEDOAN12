name: Personalizador embutido no produto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-personalizador-iframe-once.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar personalizador embutido
        run: node scripts/patch-personalizador-iframe-once.mjs
      - name: Validar JavaScript
        run: |
          node --check scripts/sincronizar-loja-integrada.mjs
          grep -q '<iframe title="Personalizar esta caneca"' scripts/sincronizar-loja-integrada.mjs
          grep -q '<details id="cfPersonalizadorInline"' scripts/sincronizar-loja-integrada.mjs
      - name: Ressincronizar caneca de teste
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: mug-1788189915488-38vzvo
          FORCE: 'true'
          LIMIT: '1'
        run: node scripts/sincronizar-loja-integrada.mjs
      - name: Confirmar HTML salvo na API da Loja Integrada
        env:
          LI_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          node - <<'NODE'
          const id='403524857';
          const r=await fetch(`https://api.awsli.com.br/v1/produto/${id}`,{headers:{Authorization:process.env.LI_TOKEN,Accept:'application/json'}});
          const txt=await r.text();
          if(!r.ok) throw new Error(`GET produto falhou ${r.status}: ${txt.slice(0,500)}`);
          const p=JSON.parse(txt);
          const d=String(p.descricao_completa||p.descricao||'');
          console.log('HAS_DETAILS='+d.includes('cfPersonalizadorInline'));
          console.log('HAS_IFRAME='+d.includes('<iframe'));
          console.log('HAS_FRAME_URL='+d.includes('donaantonia.com.br/loja-integrada/personalizar/'));
          if(!d.includes('cfPersonalizadorInline')||!d.includes('<iframe')) throw new Error('Loja Integrada não preservou o iframe na descrição via API.');
          NODE
      - name: Publicar alteração
        run: |
          rm -f scripts/patch-personalizador-iframe-once.mjs
          rm -f .github/workflows/patch-personalizador-iframe-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sincronizar-loja-integrada.mjs scripts/patch-personalizador-iframe-once.mjs .github/workflows/patch-personalizador-iframe-once.yml
          git commit -m "Embutir personalizador na própria página do produto"
          git pull --rebase origin main
          git push origin main
