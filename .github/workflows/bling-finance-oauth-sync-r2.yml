name: Bling Finance R2 OAuth sync
run-name: Bling Finance R2 · sincronizar credencial e validar escopos

on:
  push:
    branches:
      - bling-finance-r2-controlled-actions-20260924
    paths:
      - .github/workflows/bling-finance-oauth-sync-r2.yml

permissions:
  contents: read

concurrency:
  group: bling-finance-r2-oauth-sync
  cancel-in-progress: false

jobs:
  sync-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: bling-finance-r2-controlled-actions-20260924
          sparse-checkout: scripts/bling-finance-oauth-sync-r2.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Renovar token, atualizar Vault e testar escopos financeiros
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          BLING_REFRESH_TOKEN_FILE: ${{ runner.temp }}/bling-refresh-token-r2
          FINANCE_PROBE_FILE: ${{ runner.temp }}/finance-probe-r2.json
        run: node scripts/bling-finance-oauth-sync-r2.mjs

      - name: Persistir refresh token rotacionado no GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          BLING_REFRESH_TOKEN_FILE: ${{ runner.temp }}/bling-refresh-token-r2
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -s "$BLING_REFRESH_TOKEN_FILE"
          gh secret set BLING_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --body "$(cat "$BLING_REFRESH_TOKEN_FILE")"

      - name: Gate de escopos financeiros
        env:
          FINANCE_PROBE_FILE: ${{ runner.temp }}/finance-probe-r2.json
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.FINANCE_PROBE_FILE,'utf8'));
          console.log(JSON.stringify(p));
          if(!p.ok) process.exit(2);
          NODE
