name: Normalizar mockup CanecaFácil

on:
  workflow_dispatch:
    inputs:
      mockup_path:
        description: Caminho do PNG no branch canecas-media
        required: true
        type: string
      mockup_url:
        description: URL pública do mockup mestre
        required: true
        type: string
      request_id:
        description: ID da geração no Firebase
        required: true
        type: string

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mídia
        uses: actions/checkout@v4
        with:
          ref: canecas-media
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validar entrada
        env:
          MOCKUP_PATH: ${{ inputs.mockup_path }}
          REQUEST_ID: ${{ inputs.request_id }}
          MOCKUP_URL: ${{ inputs.mockup_url }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          raw = os.environ['MOCKUP_PATH'].strip().lstrip('/')
          p = Path(raw)
          if p.is_absolute() or '..' in p.parts:
              raise SystemExit('Caminho inválido')
          if p.suffix.lower() != '.png':
              raise SystemExit('O mockup mestre precisa ser PNG')
          if not p.exists():
              raise SystemExit(f'Arquivo não encontrado: {p}')
          rid = os.environ['REQUEST_ID'].strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]+', rid):
              raise SystemExit('request_id inválido')
          if not os.environ['MOCKUP_URL'].strip().startswith('https://'):
              raise SystemExit('mockup_url inválida')
          print(p)
          PY

      - name: Normalizar PNG transparente 1200x1600
        env:
          MOCKUP_PATH: ${{ inputs.mockup_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          path = Path(os.environ['MOCKUP_PATH'].strip().lstrip('/'))
          img = Image.open(path).convert('RGBA')

          alpha = img.getchannel('A')
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit('PNG vazio: nenhum pixel visível')
          img = img.crop(bbox)

          max_w, max_h = 1160, 1540
          scale = min(max_w / img.width, max_h / img.height)
          new_size = (max(1, round(img.width * scale)), max(1, round(img.height * scale)))
          img = img.resize(new_size, Image.Resampling.LANCZOS)

          canvas = Image.new('RGBA', (1200, 1600), (0, 0, 0, 0))
          x = (1200 - img.width) // 2
          y = (1600 - img.height) // 2
          canvas.alpha_composite(img, (x, y))
          canvas.save(path, 'PNG', optimize=True)

          check = Image.open(path).convert('RGBA')
          if check.size != (1200, 1600):
              raise SystemExit(f'Dimensão final incorreta: {check.size}')
          amin, amax = check.getchannel('A').getextrema()
          if amin == 255:
              raise SystemExit('PNG final perdeu transparência')
          if amax == 0:
              raise SystemExit('PNG final ficou totalmente transparente')
          print(f'OK {path}: {check.size}, alpha={amin}..{amax}')
          PY

      - name: Commit do mockup normalizado
        env:
          MOCKUP_PATH: ${{ inputs.mockup_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$MOCKUP_PATH"
          if git diff --cached --quiet; then
            echo "Arquivo já estava normalizado."
          else
            git commit -m "CanecaFácil: normalizar mockup mestre 1200x1600"
            git push origin HEAD:canecas-media
          fi

      - name: Confirmar contrato final no Firebase
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          MOCKUP_URL: ${{ inputs.mockup_url }}
          FIREBASE_BASE: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          rid = os.environ['REQUEST_ID'].strip()
          mockup_url = os.environ['MOCKUP_URL'].strip()
          base = os.environ['FIREBASE_BASE'].rstrip('/')
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          def patch(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
                  method='PATCH',
                  headers={'Content-Type':'application/json', 'Accept':'application/json'}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if not 200 <= response.status < 300:
                      raise RuntimeError(f'Firebase HTTP {response.status}')

          patch(f'{base}/canecafacil_v2/produtos/{rid}.json', {
              'mockup_png': mockup_url,
              'mockup_1': mockup_url,
              'mockup_2': mockup_url,
              'mockup_contrato': 'master_png_transparente_duas_vistas',
              'mockup_largura': 1200,
              'mockup_altura': 1600,
              'mockup_alpha': True,
              'mockup_normalizado_em': now,
              'atualizado_em': now
          })
          patch(f'{base}/canecas/geracoes/{rid}.json', {
              'ok': True,
              'status': 'complete',
              'action': 'finalize_mug_product',
              'request_id': rid,
              'mockup_png': mockup_url,
              'mockup_width': 1200,
              'mockup_height': 1600,
              'mockup_alpha': True,
              'updated_at': now
          })
          print('Firebase confirmado:', rid)
          PY
