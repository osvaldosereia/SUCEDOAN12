name: Migrar personalizador V14 assíncrono

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrar-personalizador-v14-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar V14
        run: python scripts/migrar-personalizador-v14.py
      - name: Validar sintaxe e contrato
        run: |
          node --check loja-integrada/personalizar/app-v14.js
          node --check scripts/sincronizar-loja-integrada.mjs
          grep -q "Seu e-mail" loja-integrada/personalizar/index.html
          grep -q "APROVAR E COMPRAR" loja-integrada/personalizar/index.html
          grep -q "creation_code" loja-integrada/personalizar/app-v14.js
          grep -q "generateForPreview" loja-integrada/personalizar/app-v14.js
          grep -q "loadExistingCreation" loja-integrada/personalizar/app-v14.js
      - name: Ressincronizar caneca de teste
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: mug-1788189915488-38vzvo
          FORCE: 'true'
          LIMIT: '1'
        run: node scripts/sincronizar-loja-integrada.mjs
      - name: Publicar
        run: |
          rm -f scripts/migrar-personalizador-v14.py
          rm -f .github/workflows/migrar-personalizador-v14-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loja-integrada/personalizar/app-v14.js loja-integrada/personalizar/index.html loja-integrada/personalizar/styles.css scripts/sincronizar-loja-integrada.mjs scripts/migrar-personalizador-v14.py .github/workflows/migrar-personalizador-v14-once.yml
          git commit -m "Ativa personalizador V14 com prévia e aprovação"
          git pull --rebase origin main
          git push origin main
