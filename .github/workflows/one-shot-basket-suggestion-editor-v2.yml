name: One-shot basket suggestion editor v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-basket-suggestion-editor-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            supabase/functions/storefront-v2/index.ts
            scripts/patch-basket-suggestion-editor-v2.py
            .github/workflows/one-shot-basket-suggestion-editor-v2.yml
          sparse-checkout-cone-mode: false
      - name: RED confirm v2 editor absent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          admin=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          store=Path('supabase/functions/storefront-v2/index.ts').read_text(encoding='utf-8')
          assert 'basket-suggestion-editor-v2' not in admin
          assert 'basket_lot_suggestion_save_v2' not in admin
          assert 'sale_price_override??b.base_price' not in store
          print('RED confirmed: full suggestion editor v2 is absent')
          PY
      - name: Apply patch
        run: python3 scripts/patch-basket-suggestion-editor-v2.py
      - name: GREEN verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          admin=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          store=Path('supabase/functions/storefront-v2/index.ts').read_text(encoding='utf-8')
          admin_tokens=[
            'basket-suggestion-editor-v2','basket_lot_suggestion_save_v2',
            'id="basketAutoDetailSalePrice"','data-basket-auto-line-qty',
            'basketAutoAddProduct','SUBSTITUÍDO'
          ]
          store_tokens=[
            'sale_price_override??b.base_price',
            '.eq("sale_enabled",true)',
            'version:26'
          ]
          for token in admin_tokens:
            assert token in admin, token
          for token in store_tokens:
            assert token in store, token
          print('GREEN basket suggestion editor v2 contract OK')
          PY
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin JS syntax OK');
          NODE
          git diff --check
      - name: Commit and clean one-shot files
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/storefront-v2/index.ts
          git rm -f scripts/patch-basket-suggestion-editor-v2.py .github/workflows/one-shot-basket-suggestion-editor-v2.yml
          git commit -m 'feat(admin): completa editor de sugestões de cestas'
          git push origin HEAD:main
