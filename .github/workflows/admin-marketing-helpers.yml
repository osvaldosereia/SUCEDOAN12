name: Admin marketing helpers
on:
  pull_request:
    paths:
      - 'vitrine/admin/index.html'
      - 'vitrine/admin/marketing/helpers.js'
      - 'vitrine/admin/marketing/dialog.js'
      - 'vitrine/admin/marketing/campaign-simple-ui.js'
      - 'vitrine/admin/marketing/template-type-picker.js'
      - 'vitrine/admin/marketing/campaign-report.js'
      - 'vitrine/admin/marketing/template-carousel-editor.js'
      - 'scripts/test-admin-marketing-dialog-helper.mjs'
      - 'scripts/test-admin-marketing-helpers.mjs'
      - '.github/workflows/admin-marketing-helpers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-formatters-extraction.mjs
      - run: node scripts/test-admin-identifiers-extraction.mjs
      - run: node scripts/test-admin-errors-extraction.mjs
      - run: node scripts/test-admin-printing-extraction.mjs
      - run: node scripts/test-admin-marketing-helpers.mjs
      - run: node scripts/test-admin-marketing-dialog-helper.mjs
      - run: node scripts/test-admin-orders-clean-flow-v3.mjs
      - run: node scripts/test-admin-orders-fiscal-flow-v4.mjs
      - run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
