name: Finalizar personalizador compacto e carrinho nativo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalizar-personalizador-compacto-native-cart-once.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compactar iframe e alinhar validade com recuperação
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sincronizar-loja-integrada.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('height:920px', 'height:520px')
          p.write_text(s, encoding='utf-8')
          p=Path('scripts/gerenciar-produtos-personalizados-temporarios-li.mjs')
          s=p.read_text(encoding='utf-8').replace('const UNBOUGHT_DAYS=7;', 'const UNBOUGHT_DAYS=8;')
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/sincronizar-loja-integrada.mjs
          node --check scripts/gerenciar-produtos-personalizados-temporarios-li.mjs
      - name: Ressincronizar caneca em teste
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: mug-1788185981865-zrkc3z
          FORCE: 'true'
          LIMIT: '1'
        run: node scripts/sincronizar-loja-integrada.mjs
      - name: Publicar e remover workflow temporário
        run: |
          rm -f .github/workflows/finalizar-personalizador-compacto-native-cart-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sincronizar-loja-integrada.mjs scripts/gerenciar-produtos-personalizados-temporarios-li.mjs .github/workflows/finalizar-personalizador-compacto-native-cart-once.yml
          git commit -m "Compacta personalizador e alinha validade com recuperação"
          git pull --rebase origin main
          git push origin main
