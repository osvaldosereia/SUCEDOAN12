name: One-shot WhatsApp template v2 payload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-whatsapp-template-v2-payload.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RED - require organized template fields
        run: |
          cat >> scripts/test-checkout-whatsapp-outbox.mjs <<'NODE'
          const adminOrdersV2=fs.readFileSync('supabase/functions/admin-orders-v1/index.ts','utf8');
          assert.match(adminOrdersV2,/deliveryAddressFull/,'dispatcher must expose complete delivery address separately');
          assert.match(adminOrdersV2,/delivery_date_label:details\.deliveryLabel/,'provider payload must expose delivery date separately');
          assert.match(adminOrdersV2,/delivery_address_full:details\.deliveryAddressFull/,'provider payload must expose complete address separately');
          assert.match(adminOrdersV2,/customer_name:details\.customerName/,'provider payload must keep customer name');
          assert.match(adminOrdersV2,/customer_phone_formatted:details\.customerPhone/,'provider payload must keep formatted customer phone');
          NODE
          if node scripts/test-checkout-whatsapp-outbox.mjs; then
            echo 'RED failed: organized template payload unexpectedly exists'
            exit 1
          else
            echo 'RED confirmed: template v2 fields are missing'
          fi
      - name: GREEN - add separate fields for organized template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/admin-orders-v1/index.ts')
          s=p.read_text()
          old='''  const deliveryDate=deliveryLabel(delivery,checkoutDelivery);\n  const deliverySummary=text([deliveryDate,addressLabel,districtLabel,cityLabel].filter(v=>v&&v!=="NAO INFORMADO"&&v!=="NAO INFORMADA").join(" • "),500)||"A confirmar";'''
          new='''  const deliveryDate=deliveryLabel(delivery,checkoutDelivery);\n  const deliveryAddressFull=text([addressLabel,districtLabel,cityLabel].filter(v=>v&&v!=="NAO INFORMADO"&&v!=="NAO INFORMADA").join(" • "),500)||"A confirmar";\n  const deliverySummary=text([deliveryDate,deliveryAddressFull].filter(Boolean).join(" • "),500)||"A confirmar";'''
          if old not in s: raise SystemExit('delivery summary block not found')
          s=s.replace(old,new,1)
          s=s.replace('''    deliveryLabel:deliveryDate,\n    deliverySummary,''','''    deliveryLabel:deliveryDate,\n    deliveryAddressFull,\n    deliverySummary,''',1)
          s=s.replace('''    delivery_label:details.deliverySummary,''','''    delivery_label:details.deliverySummary,\n    delivery_date_label:details.deliveryLabel,\n    delivery_address_full:details.deliveryAddressFull,''',1)
          p.write_text(s)
          PY
      - name: GREEN - verify contracts
        run: |
          node scripts/test-checkout-whatsapp-outbox.mjs
          node scripts/test-checkout-whatsapp-return.mjs
          git diff --check
      - name: Commit and self-remove
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-whatsapp-template-v2-payload.yml
          git add supabase/functions/admin-orders-v1/index.ts scripts/test-checkout-whatsapp-outbox.mjs
          git commit -m 'feat(whatsapp): prepara campos para template organizado v2'
          git push origin HEAD:main