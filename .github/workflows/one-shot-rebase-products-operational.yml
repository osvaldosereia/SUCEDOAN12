name: One-shot rebase products operational
on:
  push:
    branches: [feat/produtos-listagem-operacional-current]
    paths:
      - '.github/workflows/one-shot-rebase-products-operational.yml'
permissions:
  contents: write
jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Configurar identidade do bot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Buscar branch funcional anterior
        run: git fetch origin feat/produtos-listagem-operacional-5 --depth=20
      - name: Copiar teste e confirmar RED no main atual
        shell: bash
        run: |
          git show origin/feat/produtos-listagem-operacional-5:scripts/test-products-operational-list.mjs > scripts/test-products-operational-list.mjs
          if node scripts/test-products-operational-list.mjs; then
            echo 'O teste deveria falhar antes da reaplicacao.'
            exit 1
          else
            echo 'RED confirmado no main atual.'
          fi
      - name: Reaplicar commit funcional
        run: git cherry-pick 98086dd93ec6fb07e2ace6096b39af86116baaa1
      - name: GREEN e regressao
        run: |
          node scripts/test-products-operational-list.mjs
          node scripts/test-mobile-products-quick-edit.mjs
      - name: Salvar teste e publicar branch
        run: |
          git add scripts/test-products-operational-list.mjs
          git commit -m "test: cobrir listagem operacional de produtos" || true
          git push origin HEAD:feat/produtos-listagem-operacional-current
