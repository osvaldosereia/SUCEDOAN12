name: One-shot admin separation atomic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin-separation-atomic.yml'
      - 'scripts/test-admin-separation-atomic.py'
      - 'scripts/patch-admin-separation-atomic.py'
      - 'supabase/sql/20260930_order_separation_atomic_v1.sql'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/test-admin-separation-atomic.py
            scripts/patch-admin-separation-atomic.py
            supabase/sql/20260930_order_separation_atomic_v1.sql
          sparse-checkout-cone-mode: false
      - name: Apply frontend fix
        run: python3 scripts/patch-admin-separation-atomic.py
      - name: Regression test
        run: python3 scripts/test-admin-separation-atomic.py
      - name: Validate admin JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/admin.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/admin.js
      - name: Verify diff
        run: git diff --check
      - name: Commit frontend fix
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix(admin): make separation atomic and payments canonical'
          git push origin HEAD:main
