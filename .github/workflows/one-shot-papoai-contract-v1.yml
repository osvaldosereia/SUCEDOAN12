name: One-shot PapoAI contract v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-papoai-contract-v1.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            vitrine/index.html
            vitrine/admin/index.html
            scripts/test-marketing-intelligence-contract.py
            scripts/patch-papoai-contract-v1.py
            supabase/migrations/20260930_marketing_campaign_brand_rules_v1.sql
            docs
          sparse-checkout-cone-mode: false
      - name: Apply patch in runner only
        run: python3 scripts/patch-papoai-contract-v1.py
      - name: Persist diagnostic only
        shell: bash
        run: |
          set +e
          mkdir -p docs
          {
            echo 'PAPOAI CONTRACT DIAGNOSTIC'
            echo '--- contract test ---'
            python3 scripts/test-marketing-intelligence-contract.py
            echo "contract_exit=$?"
            echo '--- javascript syntax ---'
            node <<'NODE'
          const fs=require('fs');
          let code=0;
          for(const file of ['index.html','vitrine/index.html','vitrine/admin/index.html']){
            try{
              const html=fs.readFileSync(file,'utf8');
              const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
              scripts.forEach((src,i)=>new Function(src));
              console.log(file+' JS syntax OK');
            }catch(e){console.log(file+' JS syntax FAIL: '+e.message);code=1}
          }
          process.exitCode=code;
          NODE
            echo "js_exit=$?"
            cmp -s index.html vitrine/index.html
            echo "copies_exit=$?"
            git diff --check
            echo "diffcheck_exit=$?"
          } > docs/tmp-papoai-contract-diagnostic.txt 2>&1
          git restore index.html vitrine/index.html vitrine/admin/index.html
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/tmp-papoai-contract-diagnostic.txt
          git commit -m 'test(marketing): salva diagnostico temporario do contrato PapoAI'
          git push origin HEAD:main
