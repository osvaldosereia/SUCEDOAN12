name: One-shot PapoAI contract v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-papoai-contract-v1.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            index.html
            vitrine/index.html
            vitrine/admin/index.html
            scripts/test-marketing-intelligence-contract.py
            scripts/patch-papoai-contract-v1.py
            supabase/migrations/20260930_marketing_campaign_brand_rules_v1.sql
          sparse-checkout-cone-mode: false
      - name: RED verify final contract is not yet aligned
        run: |
          if python3 scripts/test-marketing-intelligence-contract.py; then
            echo 'Final contract unexpectedly green before alignment' >&2
            exit 1
          fi
          echo 'RED confirmed'
      - name: Apply final PapoAI contract alignment
        run: python3 scripts/patch-papoai-contract-v1.py
      - name: GREEN verify contract and JS syntax
        run: |
          python3 scripts/test-marketing-intelligence-contract.py
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['index.html','vitrine/index.html','vitrine/admin/index.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`${file} inline script ${i+1}: ${e.message}`)}});
            console.log(file+' JS syntax OK');
          }
          NODE
          cmp -s index.html vitrine/index.html
          git diff --check
      - name: Commit, rebase latest main and reverify
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html vitrine/index.html vitrine/admin/index.html
          git commit -m 'fix(marketing): alinha sinais ao contrato final do PapoAI'
          git fetch origin main
          git rebase origin/main
          python3 scripts/test-marketing-intelligence-contract.py
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['index.html','vitrine/index.html','vitrine/admin/index.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>new Function(src));
          }
          NODE
          cmp -s index.html vitrine/index.html
          git push origin HEAD:main
