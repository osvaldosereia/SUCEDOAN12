name: One-shot admin central final verify
on:
  push:
    branches: [fix/central-lazy-on-demand]
    paths: ['.github/workflows/one-shot-admin-central-final-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/test-admin-central-progressive-load.py
            .github/workflows/one-shot-admin-central-final-verify.yml
          sparse-checkout-cone-mode: false
      - name: Verify Central lazy contract and JavaScript syntax
        run: |
          python3 scripts/test-admin-central-progressive-load.py
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('syntax OK');
          NODE
          git diff --check
      - name: Remove this temporary verifier
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-admin-central-final-verify.yml
          git commit -m 'chore: remover verificador temporário da Central'
          git push origin HEAD:fix/central-lazy-on-demand
