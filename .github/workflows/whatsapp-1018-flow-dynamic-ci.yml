name: WhatsApp 1018 Dynamic Flow CI
on:
  pull_request:
    paths:
      - 'vitrine/admin/whatsapp-lab/meta-flow/flow-dynamic-v1.json'
      - 'supabase/functions/whatsapp-1018-basket-flow-v1/**'
      - 'scripts/test-whatsapp-1018-flow-dynamic.mjs'
      - '.github/workflows/whatsapp-1018-flow-dynamic-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-whatsapp-1018-flow-dynamic.mjs
