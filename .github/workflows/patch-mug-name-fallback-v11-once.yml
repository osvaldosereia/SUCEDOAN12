name: Aplicar fallback de nome das canecas V11

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-mug-name-fallback-v11-once.mjs'
      - '.github/workflows/patch-mug-name-fallback-v11-once.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Aplicar correção
        run: node scripts/patch-mug-name-fallback-v11-once.mjs
      - name: Validar Criador
        run: node scripts/test-mug-studio-loader.mjs
      - name: Validar Caneca Print
        run: node scripts/test-caneca-print.mjs
      - name: Validar Admin
        run: node scripts/test-admin-v2-definitivo.mjs
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add producao-v2/js/mug-personalizer-v7.js scripts/test-mug-studio-loader.mjs producao/index.html admin/index.html
          git commit -m 'Criador de Canecas V11: fallback seguro para nome da IA'
          git push origin HEAD:main
