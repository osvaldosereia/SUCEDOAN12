name: One Shot Admin Baskets Fix
on:
  push:
    branches: [fix/admin-pending-data-baskets-30-20261002]
    paths:
      - '.github/workflows/one-shot-admin-baskets-fix.yml'
      - 'scripts/apply-admin-pending-data-baskets-public-v1.mjs'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-pending-data-baskets-30-20261002
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/apply-admin-pending-data-baskets-public-v1.mjs
      - name: Verify contract
        run: node scripts/test-admin-pending-data-baskets-public-v1.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/index.html index.html vitrine/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: destacar dados pendentes e ocultar saldo de cestas"
          git push origin HEAD:fix/admin-pending-data-baskets-30-20261002
