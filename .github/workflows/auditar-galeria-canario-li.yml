name: CanecaFácil · auditar galeria LI · canário

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditar-galeria-canario-li.yml'
  workflow_dispatch:
    inputs:
      sku:
        description: 'SKU para auditoria somente leitura da galeria'
        required: true
        default: 'CANP-WTM83S'

permissions:
  contents: read

concurrency:
  group: canecafacil-li-gallery-audit
  cancel-in-progress: false

jobs:
  auditar-galeria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar token Loja Integrada
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
      - name: Auditar 3 imagens oficiais · somente leitura · sem Make
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          GALLERY_AUDIT_SKU: ${{ inputs.sku || 'CANP-WTM83S' }}
        run: node scripts/auditar-galeria-produto-li-v1.mjs
