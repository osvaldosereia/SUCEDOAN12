name: Testar Vitrine V2

on:
  push:
    branches:
      - vitrine-v2-ui-20260911
    paths:
      - 'vitrine-v2/**'
      - 'scripts/test-storefront-v2-ui.mjs'
      - '.github/workflows/test-storefront-v2-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vitrine-v2/**'
      - 'scripts/test-storefront-v2-ui.mjs'
      - '.github/workflows/test-storefront-v2-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar contrato da Vitrine V2
        run: node scripts/test-storefront-v2-ui.mjs
      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in vitrine-v2/*.js; do node --check "$f"; done
