name: Aplicar Canecas V7.5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat-mug-v75-three-mockups
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Aplicar ajustes V7.5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) < count:
                  raise SystemExit(f'{path}: trecho não encontrado: {old[:100]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          g = 'producao-v2/js/mug-studio-gallery.js'
          replace(g, "const BUILD = '20260824-mug-studio-gallery-v2';", "const BUILD = '20260824-mug-studio-gallery-v3';")
          replace(g, "function scheduleRefresh(delay = 250) {\n  clearTimeout(refreshTimer);\n  refreshTimer = setTimeout(() => {\n    currentPage = 0;\n    refresh(true);\n  }, delay);\n}", "function scheduleRefresh(delay = 250, { resetPage = false } = {}) {\n  clearTimeout(refreshTimer);\n  refreshTimer = setTimeout(() => {\n    if (resetPage) currentPage = 0;\n    refresh(true);\n  }, delay);\n}")
          replace(g, "if (/conclu[ií]do|produto salvo como inativo/i.test(status.textContent || '')) scheduleRefresh(350);", "if (/conclu[ií]do|produto salvo como inativo/i.test(status.textContent || '')) scheduleRefresh(350, { resetPage: true });")

          p = 'producao-v2/js/mug-personalizer-v7.js'
          replace(p, "import './mug-studio-gallery.js?admin_build=20260824-mug-gallery-v2';", "import './mug-studio-gallery.js?admin_build=20260824-mug-gallery-v3';")
          replace(p, "const BUILD = '20260824-canecas-studio-v7-4';", "const BUILD = '20260824-canecas-studio-v7-5';")
          replace(p, "const PLACEHOLDER_MOCKUP_2 = '__MUG_MOCKUP_2__';", "const PLACEHOLDER_MOCKUP_2 = '__MUG_MOCKUP_2__';\nconst PLACEHOLDER_MOCKUP_3 = '__MUG_MOCKUP_3__';")
          center_fn = """async function buildCenterReference(masterDataUrl) {\n  const image = await loadImage(masterDataUrl);\n  const sx = Math.max(0, Math.round((MASTER_WIDTH - SIDE_WIDTH) / 2));\n  const canvas = document.createElement('canvas');\n  canvas.width = SIDE_WIDTH;\n  canvas.height = MASTER_HEIGHT;\n  const ctx = canvas.getContext('2d', { alpha: false });\n  ctx.fillStyle = '#fff';\n  ctx.fillRect(0, 0, SIDE_WIDTH, MASTER_HEIGHT);\n  ctx.drawImage(image, sx, 0, SIDE_WIDTH, MASTER_HEIGHT, 0, 0, SIDE_WIDTH, MASTER_HEIGHT);\n  return canvas.toDataURL('image/webp', 0.96);\n}\n\n"""
          replace(p, "async function callMake(hook, payload) {", center_fn + "async function callMake(hook, payload) {")
          old_mock = """function buildMockupPrompt(side) {\n  const orientation = side === 1\n    ? 'Mostre a PRIMEIRA METADE / LADO ESQUERDO da arte centralizada na face visível da caneca. A alça deve aparecer preferencialmente à direita.'\n    : 'Mostre a SEGUNDA METADE / LADO DIREITO da arte centralizada na face visível da caneca. A alça deve aparecer preferencialmente à esquerda.';\n  return `Use a arte fornecida como ARTE-MESTRE IMUTÁVEL. ${orientation}\nCrie uma fotografia quadrada 1:1 ultra realista de uma caneca branca de porcelana 350 ml já sublimada com essa arte.\nA impressão corresponde aproximadamente a ${PRINT_LABEL} e deve ocupar praticamente toda a altura útil da caneca, perto da borda superior e da borda inferior.\nNão comprima a estampa numa faixa baixa no centro.\nPreserve a proporção da arte: não estique e não achate verticalmente o desenho.\nAplique apenas a deformação cilíndrica natural necessária para parecer uma sublimação real.\nNão redesenhe, não reescreva, não altere cores, não invente símbolos e não substitua elementos.\nFundo claro e simples. Caneca inteira visível. Sem mãos, café, caixas, plantas, flores, livros ou objetos extras. Resultado comercial 1024×1024.`;\n}\n"""
          new_mock = """function buildMockupPrompt(side) {\n  const orientation = side === 1\n    ? 'Mostre a PRIMEIRA METADE / LADO ESQUERDO da arte centralizada na face visível da caneca. A alça deve aparecer preferencialmente à direita.'\n    : side === 2\n      ? 'Mostre a SEGUNDA METADE / LADO DIREITO da arte centralizada na face visível da caneca. A alça deve aparecer preferencialmente à esquerda.'\n      : 'Mostre o CENTRO DA ARTE centralizado na face frontal da caneca. Use uma visão mais frontal; a alça pode ficar discretamente lateral ou escondida atrás, sem deslocar o centro da arte.';\n  return `Use a arte fornecida como ARTE-MESTRE IMUTÁVEL. ${orientation}\nCrie uma fotografia quadrada 1:1 ultra realista de uma caneca branca de porcelana 350 ml já sublimada com essa arte.\nA impressão corresponde aproximadamente a ${PRINT_LABEL} e deve ocupar praticamente toda a altura útil da caneca, perto da borda superior e da borda inferior.\nNão comprima a estampa numa faixa baixa no centro.\nPreserve a proporção da arte: não estique e não achate verticalmente o desenho.\nAplique apenas a deformação cilíndrica natural necessária para parecer uma sublimação real.\nNão redesenhe, não reescreva, não altere cores, não invente símbolos e não substitua elementos.\nFundo claro e simples. Caneca inteira visível. Sem mãos, café, caixas, plantas, flores, livros ou objetos extras. Resultado comercial 1024×1024.`;\n}\n"""
          replace(p, old_mock, new_mock)
          replace(p, "imagens: [PLACEHOLDER_MOCKUP_1, PLACEHOLDER_MOCKUP_2],", "imagens: [PLACEHOLDER_MOCKUP_1, PLACEHOLDER_MOCKUP_2, PLACEHOLDER_MOCKUP_3],")
          replace(p, "imagens_site: [PLACEHOLDER_MOCKUP_1, PLACEHOLDER_MOCKUP_2],", "imagens_site: [PLACEHOLDER_MOCKUP_1, PLACEHOLDER_MOCKUP_2, PLACEHOLDER_MOCKUP_3],")
          replace(p, "mockup_2: PLACEHOLDER_MOCKUP_2,", "mockup_2: PLACEHOLDER_MOCKUP_2,\n    mockup_3: PLACEHOLDER_MOCKUP_3,")
          replace(p, "midias_admin: [PLACEHOLDER_MOCKUP_1, PLACEHOLDER_MOCKUP_2, PLACEHOLDER_ART],", "midias_admin: [PLACEHOLDER_MOCKUP_1, PLACEHOLDER_MOCKUP_2, PLACEHOLDER_MOCKUP_3, PLACEHOLDER_ART],")
          replace(p, "origem_cadastro: 'make_canecas_studio_v7_4',", "origem_cadastro: 'make_canecas_studio_v7_5',")
          replace(p, "geracao_versao: 'v7.4',", "geracao_versao: 'v7.5',")
          replace(p, "gerador: 'openai_make_v7_4'", "gerador: 'openai_make_v7_5'")
          replace(p, ".mugv7-result{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}", ".mugv7-result{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:10px}")
          replace(p, "    <figure class=\"mock\"><img src=\"${escapeHtml(finalResult.mockup_2_url || '')}\" alt=\"Mockup lado direito\"><figcaption>Mockup · lado direito</figcaption></figure>\n", "    <figure class=\"mock\"><img src=\"${escapeHtml(finalResult.mockup_2_url || '')}\" alt=\"Mockup lado direito\"><figcaption>Mockup · lado direito</figcaption></figure>\n    <figure class=\"mock\"><img src=\"${escapeHtml(finalResult.mockup_3_url || '')}\" alt=\"Mockup centro da arte\"><figcaption>Mockup · centro da arte</figcaption></figure>\n")
          replace(p, "    const rightReference = await buildSideReference(master, 2);", "    const rightReference = await buildSideReference(master, 2);\n    const centerReference = await buildCenterReference(master);")
          replace(p, "status.textContent = '4/5 · Gerando os dois mockups em porcelana 350 ml...';", "status.textContent = '4/5 · Gerando os três mockups em porcelana 350 ml...';")
          replace(p, "      mockup_right_base64: rightReference,", "      mockup_right_base64: rightReference,\n      mockup_center_base64: centerReference,")
          replace(p, "      prompt_mockup_2: buildMockupPrompt(2),", "      prompt_mockup_2: buildMockupPrompt(2),\n      prompt_mockup_3: buildMockupPrompt(3),")
          replace(p, "if (finalResult.product_saved !== true || !text(finalResult.mockup_1_url) || !text(finalResult.mockup_2_url)) {", "if (finalResult.product_saved !== true || !text(finalResult.mockup_1_url) || !text(finalResult.mockup_2_url) || !text(finalResult.mockup_3_url)) {")
          replace(p, "console.error('Falha no Criador de Canecas V7.4:', error);", "console.error('Falha no Criador de Canecas V7.5:', error);")
          replace(p, "<span class=\"eyebrow\">Criador de Canecas V7.4</span>", "<span class=\"eyebrow\">Criador de Canecas V7.5</span>")
          replace(p, "<li>gerará dois mockups de caneca de porcelana 350 ml;</li>", "<li>gerará três mockups: lado esquerdo, lado direito e centro da arte;</li>")

          c = 'caneca-print/index.html'
          replace(c, ".media{display:grid;grid-template-columns:1fr 1fr;gap:1px", ".media{display:grid;grid-template-columns:repeat(3,1fr);gap:1px")
          replace(c, "return firstUrl(value?.arte_horizontal,value?.arte_personalizacao,print&&typeof print==='object'?print.url:print,Array.isArray(value?.midias_admin)?value.midias_admin[2]:'');", "const admin=Array.isArray(value?.midias_admin)?value.midias_admin:[];\n        return firstUrl(value?.arte_horizontal,value?.arte_personalizacao,print&&typeof print==='object'?print.url:print,admin[3],admin[2]);")
          replace(c, "mockup_2:firstUrl(value.mockup_2,site[1],images[1],admin[1]),", "mockup_2:firstUrl(value.mockup_2,site[1],images[1],admin[1]),\n            mockup_3:firstUrl(value.mockup_3,site[2],images[2],admin.length>=4?admin[2]:''),")
          replace(c, """      function liveUrl(){\n        const live=new URL(`${FIREBASE_BASE}/produtos.json`);\n        live.searchParams.set('orderBy',JSON.stringify('categoria'));\n        live.searchParams.set('equalTo',JSON.stringify('Canecas'));\n        return live.href;\n      }\n""", """      function liveUrls(){\n        return ['Canecas de Porcelana','Canecas'].map(category=>{\n          const live=new URL(`${FIREBASE_BASE}/produtos.json`);\n          live.searchParams.set('orderBy',JSON.stringify('categoria'));\n          live.searchParams.set('equalTo',JSON.stringify(category));\n          return live.href;\n        });\n      }\n""")
          replace(c, "<div class=\"media\">${image(r.mockup_1,'Mockup 1')}${image(r.mockup_2,'Mockup 2')}${image(r.arte_horizontal,'Arte horizontal','art')}</div>", "<div class=\"media\">${image(r.mockup_1,'Mockup 1')}${image(r.mockup_2,'Mockup 2')}${image(r.mockup_3,'Mockup 3 · centro')}${image(r.arte_horizontal,'Arte horizontal','art')}</div>")
          replace(c, """          const response=await fetch(liveUrl(),{cache:'no-store',headers:{Accept:'application/json'}});\n          if(!response.ok)throw new Error(`Firebase HTTP ${response.status}`);\n          const rows=normalizeFirebase(await response.json());\n          if(rows.length){\n            state.rows=rows;\n            $('#cacheBadge').textContent=`${rows.length} canecas · Firebase ao vivo`;\n            render();\n            return;\n          }\n          throw new Error('Firebase retornou a categoria Canecas vazia.');\n""", """          const results=await Promise.allSettled(liveUrls().map(url=>fetch(url,{cache:'no-store',headers:{Accept:'application/json'}}).then(async response=>{\n            if(!response.ok)throw new Error(`Firebase HTTP ${response.status}`);\n            return normalizeFirebase(await response.json());\n          })));\n          const merged=new Map();\n          for(const result of results)if(result.status==='fulfilled')for(const row of result.value)merged.set(row.firebaseKey,row);\n          const rows=[...merged.values()].sort((a,b)=>Number(b.last_update||0)-Number(a.last_update||0));\n          if(rows.length){\n            state.rows=rows;\n            $('#cacheBadge').textContent=`${rows.length} canecas · Firebase ao vivo`;\n            render();\n            return;\n          }\n          throw new Error('Firebase não retornou canecas nas categorias esperadas.');\n""")

          s = 'scripts/sync-canecas-cache.mjs'
          replace(s, "normalized(value.categoria) === 'canecas'", "normalized(value.categoria).includes('caneca')")
          replace(s, "    print && typeof print === 'object' ? print.url : print,\n    Array.isArray(value?.midias_admin) ? value.midias_admin[2] : '',", "    print && typeof print === 'object' ? print.url : print,\n    Array.isArray(value?.midias_admin) ? value.midias_admin[3] : '',\n    Array.isArray(value?.midias_admin) ? value.midias_admin[2] : '',")
          replace(s, "      mockup_1: text(value.mockup_1),", "      mockup_1: text(value.mockup_1),\n      mockup_2: text(value.mockup_2),\n      mockup_3: text(value.mockup_3),")
          replace(s, "    const mockup2 = firstUrl(value.mockup_2, siteImages[1], images[1], adminMedia[1]);", "    const mockup2 = firstUrl(value.mockup_2, siteImages[1], images[1], adminMedia[1]);\n    const mockup3 = firstUrl(value.mockup_3, siteImages[2], images[2], adminMedia.length >= 4 ? adminMedia[2] : '');")
          replace(s, "      mockup_2: mockup2,", "      mockup_2: mockup2,\n      mockup_3: mockup3,")
          replace(s, """const mugUrl = new URL(`${FIREBASE}/produtos.json`);\nmugUrl.searchParams.set('orderBy', JSON.stringify('categoria'));\nmugUrl.searchParams.set('equalTo', JSON.stringify('Canecas'));\n\nlet mugSource;\ntry {\n  mugSource = await fetchJson(mugUrl.href, 30000);\n} catch (error) {\n  console.warn('Consulta indexada de canecas falhou; usando leitura completa somente no GitHub Actions.', error.message);\n  mugSource = await fetchJson(`${FIREBASE}/produtos.json`, 30000);\n}\n""", """async function fetchMugCategories() {\n  const merged = {};\n  for (const category of ['Canecas de Porcelana', 'Canecas']) {\n    const mugUrl = new URL(`${FIREBASE}/produtos.json`);\n    mugUrl.searchParams.set('orderBy', JSON.stringify('categoria'));\n    mugUrl.searchParams.set('equalTo', JSON.stringify(category));\n    const data = await fetchJson(mugUrl.href, 30000);\n    if (data && typeof data === 'object') Object.assign(merged, data);\n  }\n  return merged;\n}\n\nlet mugSource;\ntry {\n  mugSource = await fetchMugCategories();\n} catch (error) {\n  console.warn('Consulta indexada de canecas falhou; usando leitura completa somente no GitHub Actions.', error.message);\n  mugSource = await fetchJson(`${FIREBASE}/produtos.json`, 30000);\n}\n""")

          t = Path('scripts/test-mug-studio-loader.mjs')
          ts = t.read_text(encoding='utf-8')
          ts = ts.replace("const BUILD = '20260824-canecas-studio-v7-4'", "const BUILD = '20260824-canecas-studio-v7-5'")
          ts = ts.replace("const BUILD = '20260824-canecas-studio-v7-3'", "const BUILD = '20260824-canecas-studio-v7-5'")
          ts = ts.replace("V7.3 após corrigir instruções complementares", "V7.5 após adicionar terceiro mockup")
          needle = "requireText(personalizer, 'prompt_art: buildArtPrompt(instruction)', 'Instrução complementar não chega ao prompt_art enviado ao Make.');"
          extra = """\nrequireText(personalizer, "const PLACEHOLDER_MOCKUP_3 = '__MUG_MOCKUP_3__'", 'Criador não declara placeholder do terceiro mockup.');\nrequireText(personalizer, 'mockup_center_base64: centerReference', 'Criador não envia referência central ao Make.');\nrequireText(personalizer, 'prompt_mockup_3: buildMockupPrompt(3)', 'Criador não envia prompt do terceiro mockup.');\nrequireText(personalizer, 'mockup_3: PLACEHOLDER_MOCKUP_3', 'Firebase não recebe terceiro mockup.');\nrequireText(personalizer, '!text(finalResult.mockup_3_url)', 'Criador não exige confirmação do terceiro mockup.');\nconst mugGallery = read('producao-v2/js/mug-studio-gallery.js');\nrequireText(mugGallery, "const BUILD = '20260824-mug-studio-gallery-v3'", 'Galeria não foi versionada após preservar paginação.');\nrequireText(mugGallery, 'function scheduleRefresh(delay = 250, { resetPage = false } = {})', 'Galeria ainda reseta a página em qualquer atualização.');\nrequireText(mugGallery, 'scheduleRefresh(350, { resetPage: true })', 'Nova caneca não direciona explicitamente para a página inicial.');\n"""
          if needle not in ts: raise SystemExit('test-mug-studio-loader: ponto de inserção ausente')
          t.write_text(ts.replace(needle, needle + extra, 1).replace("Criador de Canecas validado: V7.4", "Criador de Canecas validado: V7.5").replace("Criador de Canecas validado: V7.3", "Criador de Canecas validado: V7.5"), encoding='utf-8')

          tc = Path('scripts/test-caneca-print.mjs')
          cs = tc.read_text(encoding='utf-8')
          cs = cs.replace("requireText(html, \"live.searchParams.set('equalTo',JSON.stringify('Canecas'))\", 'Consulta ao vivo não está limitada à categoria Canecas.');", "requireText(html, \"['Canecas de Porcelana','Canecas']\", 'Consulta ao vivo não cobre categorias nova e legada de canecas.');")
          cs = cs.replace("requireText(html, \"fetch(liveUrl(),{cache:'no-store'\", 'Fonte ao vivo não força dados frescos.');", "requireText(html, \"liveUrls().map(url=>fetch(url,{cache:'no-store'\", 'Fonte ao vivo não força dados frescos nas categorias de canecas.');")
          cs = cs.replace("requireText(html, 'r.mockup_2', 'Interface não mostra mockup 2.');", "requireText(html, 'r.mockup_2', 'Interface não mostra mockup 2.');\nrequireText(html, 'r.mockup_3', 'Interface não mostra mockup 3 central.');")
          cs = cs.replace("requireText(sync, 'mockup_2: mockup2', 'Snapshot não contém mockup 2.');", "requireText(sync, 'mockup_2: mockup2', 'Snapshot não contém mockup 2.');\nrequireText(sync, 'mockup_3: mockup3', 'Snapshot não contém mockup 3 central.');")
          tc.write_text(cs.replace("Caneca Print validado: Firebase ao vivo + fallback", "Caneca Print validado: 3 mockups + Firebase ao vivo + fallback"), encoding='utf-8')

          Path('.github/workflows/apply-mug-v75.yml').unlink(missing_ok=True)
          PY

          node --check producao-v2/js/mug-personalizer-v7.js
          node --check producao-v2/js/mug-studio-gallery.js
          node --check scripts/sync-canecas-cache.mjs
          node scripts/test-mug-studio-loader.mjs
          node scripts/test-caneca-print.mjs

      - name: Commitar na branch de trabalho
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canecas V7.5: terceiro mockup e paginação estável"
          git push origin HEAD:feat-mug-v75-three-mockups
