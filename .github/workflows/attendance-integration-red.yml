name: Attendance Admin integration apply

on:
  push:
    branches:
      - feat/admin-attendance-papoai-v1
    paths:
      - scripts/patch-admin-attendance-entry-v1.py
      - .github/workflows/attendance-integration-red.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-attendance-papoai-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Admin entry
        run: python3 scripts/patch-admin-attendance-entry-v1.py
      - name: Verify attendance contracts
        run: |
          node scripts/test-admin-attendance-integration-v1.mjs
          node scripts/test-admin-attendance-ui-v1.mjs
          node scripts/test-admin-attendance-api-v1.mjs
          node scripts/test-admin-attendance-sql-v1.mjs
          node --check vitrine/admin/atendimento/attendance.js
      - name: Commit generated Admin integration
        run: |
          if git diff --quiet -- vitrine/admin/index.html; then
            echo "Admin already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/index.html
          git commit -m "feat: integrate attendance workspace into Admin"
          git push origin HEAD:feat/admin-attendance-papoai-v1
