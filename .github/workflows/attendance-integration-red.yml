name: Attendance Task 4 RED proof

on:
  push:
    branches:
      - feat/admin-attendance-papoai-v1
    paths:
      - scripts/test-admin-attendance-realtime-v1.mjs
      - .github/workflows/attendance-integration-red.yml

permissions:
  contents: read

jobs:
  red-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-attendance-papoai-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Task 4 contract before implementation
        run: node scripts/test-admin-attendance-realtime-v1.mjs
