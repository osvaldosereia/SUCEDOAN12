name: One-shot order detail basket components
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-order-detail-basket-components.yml'
      - 'scripts/test-order-detail-basket-components.py'
      - 'scripts/patch-order-detail-basket-components.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            supabase/functions/admin-products-live-v1/index.ts
            scripts/test-order-detail-basket-components.py
            scripts/patch-order-detail-basket-components.py
          sparse-checkout-cone-mode: false
      - name: Apply minimal fix
        run: python3 scripts/patch-order-detail-basket-components.py
      - name: Regression test
        run: python3 scripts/test-order-detail-basket-components.py
      - name: Validate TypeScript syntax
        run: npx -y esbuild supabase/functions/admin-products-live-v1/index.ts --bundle --format=esm --platform=neutral --external:* --outfile=/tmp/admin-products-live-v1.js
      - name: Verify diff
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/admin-products-live-v1/index.ts
          git commit -m 'fix(admin): show normal basket items in order detail'
          git push origin HEAD:main
