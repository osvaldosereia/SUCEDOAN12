name: Patch Agent Core Canonical Packet V51

on:
  push:
    branches:
      - fix/agent-core-v45-order-context
    paths:
      - 'supabase/migrations/20260911011500_dona_antonia_agent_core_packet_v4_topic_v6_v51.sql'
      - 'scripts/patch-agent-core-packet-v51.mjs'
      - 'scripts/test-agent-core-round4-packet-v51.mjs'
      - '.github/workflows/patch-agent-core-packet-v51.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-core-v45-order-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V51 canonical packet patch
        run: node scripts/patch-agent-core-packet-v51.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check patched edges
        run: |
          deno check supabase/functions/dona-antonia-agent-core-v1/index.ts
          deno check supabase/functions/dona-antonia-agent-eval-v1/index.ts
      - name: Validate V51 contract
        run: node scripts/test-agent-core-round4-packet-v51.mjs
      - name: Validate evaluator isolation/parity harness
        run: node scripts/test-agent-eval-harness-v1.mjs
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo 'V51 already aligned'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/dona-antonia-agent-core-v1/index.ts supabase/functions/dona-antonia-agent-eval-v1/index.ts scripts/test-agent-eval-harness-v1.mjs
          git commit -m 'feat(agent-core): use canonical packet v4 and topic v6 V51'
          git push origin HEAD:fix/agent-core-v45-order-context
