name: Checkout WhatsApp origin verify

on:
  push:
    branches:
      - feat/checkout-whatsapp-confirmation-sync
    paths:
      - 'scripts/test-checkout-whatsapp-outbox.mjs'
      - 'scripts/patch-checkout-whatsapp-origin.py'
      - '.github/workflows/checkout-whatsapp-origin-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkout-whatsapp-confirmation-sync
          fetch-depth: 1
      - name: Apply origin patch
        run: python3 scripts/patch-checkout-whatsapp-origin.py
      - name: Run contracts
        run: |
          node scripts/test-checkout-whatsapp-return.mjs
          node scripts/test-checkout-whatsapp-outbox.mjs
          node scripts/test-checkout-whatsapp-observability.mjs
          node scripts/test-site-only-order-registration.mjs
          python3 scripts/test-marketing-intelligence-contract.py
          cmp -s index.html vitrine/index.html
          git diff --check
      - name: Commit deterministic patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/storefront-v2/index.ts supabase/sql/20261001_checkout_whatsapp_outbox_v1.sql
          git commit -m "fix(whatsapp): preserve validated checkout channel origin"
          git pull --rebase origin feat/checkout-whatsapp-confirmation-sync
          git push origin HEAD:feat/checkout-whatsapp-confirmation-sync
