name: Marketing Campaign Execution UI CI

on:
  pull_request:
    paths:
      - 'vitrine/admin/marketing/campaign-center.js'
      - 'vitrine/admin/marketing/campaign-center.css'
      - 'vitrine/admin/marketing/audience-center.js'
      - 'vitrine/admin/marketing/audience-center.css'
      - 'vitrine/admin/marketing/campaign-simple-ui.js'
      - 'vitrine/admin/marketing/campaign-simple-ui.css'
      - 'vitrine/admin/marketing/campaign-list-simple.js'
      - 'vitrine/admin/marketing/campaign-list-simple.css'
      - 'vitrine/admin/marketing/campaign-entry.js'
      - 'vitrine/admin/marketing/marketing-polish.js'
      - 'scripts/test-whatsapp-marketing-campaign-execution-ui-v1.mjs'
      - 'scripts/test-marketing-campaign-selection-personalization-v1.mjs'
      - 'supabase/functions/admin-marketing-campaigns-v1/index.ts'
      - 'supabase/functions/whatsapp-marketing-worker-v1/index.ts'
      - 'supabase/functions/_shared/marketing-template-variables-v1.mjs'
      - 'supabase/migrations/20261019170000_marketing_recipient_first_name_v1.sql'
      - 'scripts/test-whatsapp-marketing-campaign-simple-audience-v1.mjs'
      - 'scripts/test-whatsapp-marketing-campaign-simple-list-v1.mjs'
      - '.github/workflows/marketing-campaign-execution-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Marketing campaign execution UI contract
        run: node scripts/test-whatsapp-marketing-campaign-execution-ui-v1.mjs
      - name: Manual recipient selection and first-name personalization
        run: node scripts/test-marketing-campaign-selection-personalization-v1.mjs
      - name: Marketing simple campaign audience contract
        run: node scripts/test-whatsapp-marketing-campaign-simple-audience-v1.mjs
      - name: Marketing simple campaign list contract
        run: node scripts/test-whatsapp-marketing-campaign-simple-list-v1.mjs
      - name: Campaign center syntax
        run: node --check vitrine/admin/marketing/campaign-center.js
      - name: Audience center syntax
        run: node --check vitrine/admin/marketing/audience-center.js
      - name: Campaign simple UI syntax
        run: node --check vitrine/admin/marketing/campaign-simple-ui.js
      - name: Campaign admin API syntax
        run: node --experimental-strip-types --check supabase/functions/admin-marketing-campaigns-v1/index.ts
      - name: Campaign worker syntax
        run: node --experimental-strip-types --check supabase/functions/whatsapp-marketing-worker-v1/index.ts
      - name: Campaign list simple syntax
        run: node --check vitrine/admin/marketing/campaign-list-simple.js
      - name: Campaign entry syntax
        run: node --check vitrine/admin/marketing/campaign-entry.js
      - name: Existing campaign UI regression
        run: node scripts/test-whatsapp-marketing-campaign-ui-v1.mjs

