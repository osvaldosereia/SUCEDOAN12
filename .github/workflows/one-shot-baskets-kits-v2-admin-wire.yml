name: One shot baskets kits v2 admin wire
on:
  push:
    branches:
      - feat/baskets-kits-v2-20261004
    paths:
      - '.github/workflows/one-shot-baskets-kits-v2-admin-wire.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/baskets-kits-v2-20261004
          fetch-depth: 1
      - name: Apply isolated V2 wire patch
        run: python3 scripts/patch-baskets-kits-v2-admin-wire.py
      - name: Remove temporary patch infrastructure
        run: rm -f scripts/patch-baskets-kits-v2-admin-wire.py .github/workflows/one-shot-baskets-kits-v2-admin-wire.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire Cestas e Kits v2 admin module"
          git push origin HEAD:feat/baskets-kits-v2-20261004
