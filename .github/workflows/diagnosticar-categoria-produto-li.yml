name: CanecaFácil · diagnosticar categoria produto LI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-categoria-produto-li.yml'
  workflow_dispatch:
    inputs:
      sku:
        description: 'SKU para diagnosticar categoria'
        required: true
        default: 'CANP-QZ11RD'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Categoria Firebase + catálogo GitHub · somente leitura
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          DIAG_SKU: ${{ inputs.sku || 'CANP-QZ11RD' }}
        run: node scripts/diagnosticar-categoria-produto-li-v1.mjs
