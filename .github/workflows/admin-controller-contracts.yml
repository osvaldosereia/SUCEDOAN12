name: Admin controller contracts
on:
  pull_request:
    paths:
      - 'vitrine/admin/index.html'
      - 'vitrine/admin/orders/contact-actions.js'
      - 'vitrine/admin/components/print-queue-panel.js'
      - 'scripts/test-admin-contact-and-print-queue.mjs'
      - 'supabase/functions/admin-products-live-v1/index.ts'
      - 'scripts/test-admin-async-races-and-partial-save.mjs'
      - 'scripts/test-admin-gateway-action-contract.mjs'
      - 'scripts/test-admin-controller-contracts.mjs'
      - '.github/workflows/admin-controller-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-controller-contracts.mjs
      - run: node scripts/test-admin-async-races-and-partial-save.mjs
      - run: node scripts/test-admin-gateway-action-contract.mjs
      - run: node scripts/test-admin-whatsapp-phone-contract.mjs
      - run: node scripts/test-admin-contact-and-print-queue.mjs
      - run: node scripts/test-admin-module-load-contract.mjs
      - run: node scripts/test-admin-orders-clean-flow-v3.mjs
      - run: node scripts/test-admin-orders-fiscal-flow-v4.mjs
      - run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
