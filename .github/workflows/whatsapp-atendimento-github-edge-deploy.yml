name: Deploy WhatsApp Atendimento Edge Functions

on:
  push:
    branches:
      - project/whatsapp-atendimento-github-20261025
    paths:
      - 'projetos/whatsapp-atendimento-github/supabase/functions/whatsapp-admin-api/**'
      - 'projetos/whatsapp-atendimento-github/supabase/functions/whatsapp-flow-runtime/**'
      - 'projetos/whatsapp-atendimento-github/supabase/functions/_shared/**'
      - 'projetos/whatsapp-atendimento-github/src/domain/**'
      - '.github/workflows/whatsapp-atendimento-github-edge-deploy.yml'

permissions:
  contents: read

concurrency:
  group: whatsapp-atendimento-edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Confirm deployment credential is available
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured; no function was deployed."
            exit 1
          fi

      - name: Deploy Flow runtime
        working-directory: projetos/whatsapp-atendimento-github
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy whatsapp-flow-runtime --project-ref ssbesxgaijknwsjbsbcz --use-api

      - name: Deploy Admin API
        working-directory: projetos/whatsapp-atendimento-github
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy whatsapp-admin-api --project-ref ssbesxgaijknwsjbsbcz --use-api
