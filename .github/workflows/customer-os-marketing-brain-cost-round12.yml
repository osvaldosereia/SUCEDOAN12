name: Customer OS Marketing Brain Cost Round 12
on:
  push:
    paths:
      - 'supabase/functions/admin-marketing-brain-v1/**'
      - 'supabase/migrations/20260919004000_cm_1_11_marketing_brain_observe_suggest_foundation_v1.sql'
      - 'scripts/test-cm-1-marketing-brain-cost-round12.mjs'
      - '.github/workflows/customer-os-marketing-brain-cost-round12.yml'
  pull_request:
    paths:
      - 'supabase/functions/admin-marketing-brain-v1/**'
      - 'supabase/migrations/20260919004000_cm_1_11_marketing_brain_observe_suggest_foundation_v1.sql'
      - 'scripts/test-cm-1-marketing-brain-cost-round12.mjs'
      - '.github/workflows/customer-os-marketing-brain-cost-round12.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-cm-1-marketing-brain-cost-round12.mjs
