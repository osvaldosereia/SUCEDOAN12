name: CI Dona Antonia Agent Core

on:
  push:
    paths:
      - 'supabase/migrations/*dona_antonia_agent_core*'
      - 'supabase/migrations/*dona_antonia_whatsapp_delivery_promise*'
      - 'supabase/functions/dona-antonia-agent-core-v1/**'
      - 'supabase/functions/dona-antonia-agent-learning-v1/**'
      - 'supabase/functions/admin-agent-learning-v1/**'
      - 'supabase/functions/conversation-worker-v3/**'
      - 'admin-v3/agent-learning.js'
      - 'admin-v3/aprendizados.html'
      - 'docs/ROADMAP-AGENT-CORE-DONA-ANTONIA-6-RODADAS.md'
      - 'docs/AGENT-CORE-RODADA-*-CHECKPOINT-*.md'
      - 'scripts/test-dona-antonia-agent-core-contract-v1.mjs'
      - 'scripts/test-agent-core-round3-contract-v1.mjs'
      - 'scripts/test-agent-core-round4-contract-v1.mjs'
      - 'scripts/test-agent-core-round4-safe-replay-v1.mjs'
      - 'scripts/test-agent-core-round4-parity-v3.mjs'
      - 'scripts/test-agent-core-round4-semantic-v5.mjs'
      - 'scripts/test-agent-core-round4-stateful-v10.mjs'
      - 'scripts/test-agent-core-round4-router-contracts-v19.mjs'
      - 'scripts/test-agent-core-round4-pre-router-parity-v23.mjs'
      - 'scripts/test-agent-core-round4-runtime-surface-v24.mjs'
      - 'scripts/test-agent-core-round4-evidence-preflight-v25.mjs'
      - 'scripts/test-agent-core-round4-stateful-evidence-aliases-v26.mjs'
      - 'scripts/test-agent-core-round4-evidence-next-step-v27.mjs'
      - 'scripts/test-agent-core-round4-address-change-v28.mjs'
      - 'scripts/test-agent-core-round4-contract-evidence-epoch-v29.mjs'
      - 'scripts/test-agent-core-round4-stateless-parity-v30.mjs'
      - 'scripts/test-agent-core-round4-safe-replay-dispatcher-v31.mjs'
      - 'scripts/test-agent-core-round4-customer-data-address-v32.mjs'
      - 'scripts/test-agent-core-round4-canonical-capabilities-v33.mjs'
      - 'scripts/test-agent-core-round4-capability-pii-v34.mjs'
      - 'scripts/test-agent-core-round4-worker-v2-retirement-v1.mjs'
      - '.github/workflows/ci-dona-antonia-agent-core.yml'
  pull_request:
    paths:
      - 'supabase/migrations/*dona_antonia_agent_core*'
      - 'supabase/migrations/*dona_antonia_whatsapp_delivery_promise*'
      - 'supabase/functions/dona-antonia-agent-core-v1/**'
      - 'supabase/functions/dona-antonia-agent-learning-v1/**'
      - 'supabase/functions/admin-agent-learning-v1/**'
      - 'supabase/functions/conversation-worker-v3/**'
      - 'admin-v3/agent-learning.js'
      - 'admin-v3/aprendizados.html'
      - 'docs/ROADMAP-AGENT-CORE-DONA-ANTONIA-6-RODADAS.md'
      - 'docs/AGENT-CORE-RODADA-*-CHECKPOINT-*.md'
      - 'scripts/test-dona-antonia-agent-core-contract-v1.mjs'
      - 'scripts/test-agent-core-round3-contract-v1.mjs'
      - 'scripts/test-agent-core-round4-contract-v1.mjs'
      - 'scripts/test-agent-core-round4-safe-replay-v1.mjs'
      - 'scripts/test-agent-core-round4-parity-v3.mjs'
      - 'scripts/test-agent-core-round4-semantic-v5.mjs'
      - 'scripts/test-agent-core-round4-stateful-v10.mjs'
      - 'scripts/test-agent-core-round4-router-contracts-v19.mjs'
      - 'scripts/test-agent-core-round4-pre-router-parity-v23.mjs'
      - 'scripts/test-agent-core-round4-runtime-surface-v24.mjs'
      - 'scripts/test-agent-core-round4-evidence-preflight-v25.mjs'
      - 'scripts/test-agent-core-round4-stateful-evidence-aliases-v26.mjs'
      - 'scripts/test-agent-core-round4-evidence-next-step-v27.mjs'
      - 'scripts/test-agent-core-round4-address-change-v28.mjs'
      - 'scripts/test-agent-core-round4-contract-evidence-epoch-v29.mjs'
      - 'scripts/test-agent-core-round4-stateless-parity-v30.mjs'
      - 'scripts/test-agent-core-round4-safe-replay-dispatcher-v31.mjs'
      - 'scripts/test-agent-core-round4-customer-data-address-v32.mjs'
      - 'scripts/test-agent-core-round4-canonical-capabilities-v33.mjs'
      - 'scripts/test-agent-core-round4-capability-pii-v34.mjs'
      - 'scripts/test-agent-core-round4-worker-v2-retirement-v1.mjs'
      - '.github/workflows/ci-dona-antonia-agent-core.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract · Agent Core base
        run: node scripts/test-dona-antonia-agent-core-contract-v1.mjs
      - name: Contract · Round 3 memory and learning
        run: node scripts/test-agent-core-round3-contract-v1.mjs
      - name: Contract · Round 4 foundation
        run: node scripts/test-agent-core-round4-contract-v1.mjs
      - name: Contract · Round 4 safe replay
        run: node scripts/test-agent-core-round4-safe-replay-v1.mjs
      - name: Contract · Round 4 parity V3
        run: node scripts/test-agent-core-round4-parity-v3.mjs
      - name: Contract · Round 4 semantic V5
        run: node scripts/test-agent-core-round4-semantic-v5.mjs
      - name: Contract · Round 4 stateful V10
        run: node scripts/test-agent-core-round4-stateful-v10.mjs
      - name: Contract · Round 4 router contracts V19
        run: node scripts/test-agent-core-round4-router-contracts-v19.mjs
      - name: Contract · Round 4 pre-router parity V23
        run: node scripts/test-agent-core-round4-pre-router-parity-v23.mjs
      - name: Contract · Round 4 runtime surface V24
        run: node scripts/test-agent-core-round4-runtime-surface-v24.mjs
      - name: Contract · Round 4 evidence preflight V25
        run: node scripts/test-agent-core-round4-evidence-preflight-v25.mjs
      - name: Contract · Round 4 evidence aliases V26
        run: node scripts/test-agent-core-round4-stateful-evidence-aliases-v26.mjs
      - name: Contract · Round 4 evidence next step V27
        run: node scripts/test-agent-core-round4-evidence-next-step-v27.mjs
      - name: Contract · Round 4 address change V28
        run: node scripts/test-agent-core-round4-address-change-v28.mjs
      - name: Contract · Round 4 evidence epoch V29
        run: node scripts/test-agent-core-round4-contract-evidence-epoch-v29.mjs
      - name: Contract · Round 4 stateless parity V30
        run: node scripts/test-agent-core-round4-stateless-parity-v30.mjs
      - name: Contract · Round 4 safe replay dispatcher V31
        run: node scripts/test-agent-core-round4-safe-replay-dispatcher-v31.mjs
      - name: Contract · Round 4 customer data/address V32
        run: node scripts/test-agent-core-round4-customer-data-address-v32.mjs
      - name: Contract · Round 4 canonical capabilities V33
        run: node scripts/test-agent-core-round4-canonical-capabilities-v33.mjs
      - name: Contract · Round 4 capability PII V34
        run: node scripts/test-agent-core-round4-capability-pii-v34.mjs
      - name: Contract · Worker V2 retirement guard
        run: node scripts/test-agent-core-round4-worker-v2-retirement-v1.mjs
      - name: Syntax · Admin learning
        run: node --check admin-v3/agent-learning.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check Agent Core functions
        run: |
          deno check supabase/functions/dona-antonia-agent-core-v1/index.ts
          deno check supabase/functions/dona-antonia-agent-learning-v1/index.ts
          deno check supabase/functions/admin-agent-learning-v1/index.ts
          deno check supabase/functions/conversation-worker-v3/index.ts
