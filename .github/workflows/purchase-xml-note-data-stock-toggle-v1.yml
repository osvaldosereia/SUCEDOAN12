name: purchase-xml-note-data-stock-toggle-v1
on:
  pull_request:
    paths:
      - "vitrine/admin/runtime-src/06-purchases.part.js.txt"
      - "vitrine/admin/admin-runtime.js"
      - "supabase/functions/purchase-xml-v1/index.ts"
      - "supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts"
      - "supabase/migrations/20261021150000_purchase_xml_note_data_stock_toggle_v1.sql"
      - "scripts/test-purchase-xml-note-data-stock-toggle-v1.mjs"
      - "scripts/build-vitrine-admin-runtime.py"
      - ".github/workflows/purchase-xml-note-data-stock-toggle-v1.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-purchase-xml-note-data-stock-toggle-v1.mjs
      - run: node --check vitrine/admin/admin-runtime.js
      - run: python3 scripts/build-vitrine-admin-runtime.py --check
