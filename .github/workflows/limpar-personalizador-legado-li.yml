name: CanecaFácil · limpar personalizador legado LI

on:
  workflow_dispatch:
    inputs:
      clean_all:
        description: 'Auditar todos os produtos da Loja Integrada após limpar os vinculados no Firebase'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'scripts/limpar-personalizador-legado-li-v1.mjs'
      - '.github/workflows/limpar-personalizador-legado-li.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-limpar-personalizador-legado-li
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar script
        run: node --check scripts/limpar-personalizador-legado-li-v1.mjs
      - name: Validar Personal Token Loja Integrada
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
          printf 'LOJA_INTEGRADA_AUTHORIZATION=%s\n' "$LI_APP_TOKEN" >> "$GITHUB_ENV"
      - name: Limpar descrições no Firebase e Loja Integrada
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          CLEAN_ALL: ${{ github.event.inputs.clean_all || 'true' }}
          REQUEST_SPACING_MS: '850'
        run: node scripts/limpar-personalizador-legado-li-v1.mjs
