name: One-shot balance mobile only
on:
  push:
    branches: [fix/balance-mobile-only]
    paths:
      - '.github/workflows/one-shot-balance-mobile-only.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/test-balance-mobile-only.mjs
            .github/workflows/one-shot-balance-mobile-only.yml
          sparse-checkout-cone-mode: false
      - name: RED - prove A4 is still exposed
        run: |
          if node scripts/test-balance-mobile-only.mjs; then
            echo 'Test unexpectedly passed before simplification'
            exit 1
          else
            echo 'RED confirmed: A4 is still exposed'
          fi
      - name: Apply minimal mobile-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('vitrine/admin/index.html')
          s=p.read_text(encoding='utf-8')

          old="const content=$('#content'),incident=state.balanceMode==='incident',scanner=!incident&&state.balanceSubtab!=='a4';"
          new="const content=$('#content'),incident=state.balanceMode==='incident',scanner=!incident;"
          if s.count(old)!=1: raise SystemExit(f'scanner marker count={s.count(old)}')
          s=s.replace(old,new,1)

          pat=r"    const photoPanel=.*?\n    const manualPendingPanel=.*?\n    const cameraPanel="
          s,n=re.subn(pat,"    const photoPanel='',manualPendingPanel='';\n    const cameraPanel=",s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'A4 panel patch count={n}')

          pat=r"\+\(!incident\?'<div class=\\\"balance-subtabs\\\">.*?</div>':''\)\+cameraPanel"
          s,n=re.subn(pat,"+cameraPanel",s,count=1)
          if n!=1: raise SystemExit(f'subtab html patch count={n}')

          old="    if(!incident){$('#balanceTabScanner').onclick=()=>setBalanceSubtab('scanner');$('#balanceTabA4').onclick=()=>setBalanceSubtab('a4')}\n"
          if s.count(old)!=1: raise SystemExit(f'subtab handler count={s.count(old)}')
          s=s.replace(old,'',1)

          old="    if(!incident&&!scanner){bindInventorySheetPhoto();loadInventorySheetPendingManual()}\n"
          if s.count(old)!=1: raise SystemExit(f'A4 init count={s.count(old)}')
          s=s.replace(old,'',1)

          pat=r"  function setBalanceSubtab\(tab\)\{\n    state\.balanceSubtab=tab==='a4'\?'a4':'scanner';state\.balanceProduct=null;state\.balanceQty='';state\.balanceNeedsPhoto=false;state\.balanceReadiness=null;\n    if\(state\.balanceSubtab==='a4'\)stopBalanceCamera\(\);renderBalance\(\);\n  \}"
          repl="  function setBalanceSubtab(){\n    state.balanceSubtab='scanner';state.balanceProduct=null;state.balanceQty='';state.balanceNeedsPhoto=false;state.balanceReadiness=null;\n    renderBalance();\n  }"
          s,n=re.subn(pat,repl,s,count=1)
          if n!=1: raise SystemExit(f'setBalanceSubtab patch count={n}')

          s=s.replace('<h1>Estoque mobile</h1>','<h1>Balanço rápido</h1>',1)
          p.write_text(s,encoding='utf-8')
          print('mobile-only balance patch applied')
          PY
      - name: GREEN - verify mobile-only contract and JS syntax
        run: |
          node scripts/test-balance-mobile-only.mjs
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log(`Admin JS syntax OK (${scripts.length} scripts)`);
          NODE
          git diff --check
      - name: Commit simplification
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix(balance): keep only fast mobile scanner flow'
          git push
