name: Aplicar correção final de imagens e cache das cestas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-basket-cache-fix-main.yml'

permissions:
  contents: write

concurrency:
  group: aplicar-correcao-cestas-main
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do main mais recente
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-next/package.json

      - name: Trazer somente o código validado
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/corrige-imagens-cache-cestas
          git checkout origin/agent/corrige-imagens-cache-cestas -- \
            .github/workflows/app-next-tests.yml \
            .github/workflows/update-public-data.yml \
            app-next/index.html \
            app-next/src \
            app-next/tests/smoke.test.js \
            atualizar.html \
            index.html \
            scripts/check-public-site.mjs \
            scripts/gerar-paginas-seo-combos.js \
            scripts/injetar-seo-combos.js \
            site-public/assets/seo-combos.css \
            site/app-version.json
          git rm -f --ignore-unmatch app-next/src/detail-review.js app-next/styles/detail-review.css

      - name: Regenerar páginas e catálogos com os dados atuais
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalizar-seo-delivery.js
          node scripts/injetar-seo-combos.js
          node scripts/gerar-paginas-seo-combos.js
          node scripts/gerar-merchant.js
          node scripts/gerar-meta-combos.js
          node scripts/gerar-sitemap.js

      - name: Validar site completo
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/gerar-paginas-seo-combos.js
          node --check scripts/injetar-seo-combos.js
          node --check app-next/src/main.js
          node --check app-next/src/ui.js
          node --check app-next/src/seo-combos.js
          node scripts/check-public-site.mjs
          grep -q 'seo-combos-critical' cestas/*/index.html kits/*/index.html
          ! grep -R -q 'detail-review' index.html app-next/index.html app-next/src app-next/styles
          cd app-next
          npm test
          npm run check

      - name: Publicar no main e remover instalador
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-basket-cache-fix-main.yml
          git add -A
          git commit -m 'Corrige imagens, cache e conflitos das cestas'
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          echo 'Não foi possível publicar a correção no main.' >&2
          exit 1
