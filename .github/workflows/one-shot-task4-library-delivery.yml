name: one-shot-task4-library-delivery

on:
  push:
    branches:
      - feat/attendance-quick-library-20261003

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-quick-library-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-task4-library-delivery-patch.mjs
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-whatsapp-ops-v1/index.ts
          git commit -m "feat: wire quick library delivery"
          git push origin HEAD:feat/attendance-quick-library-20261003
