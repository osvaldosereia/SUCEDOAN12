name: Attendance conversation close regression
on:
  push:
    branches: [fix/attendance-conversation-closes]
    paths:
      - 'scripts/test-admin-attendance-ui-v1.mjs'
      - 'vitrine/admin/atendimento/attendance.js'
      - '.github/workflows/attendance-conversation-close-fix.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-conversation-closes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal state fix once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vitrine/admin/atendimento/attendance.js')
          s=p.read_text(encoding='utf-8')
          if 'conversationOpen:false' not in s:
              s=s.replace("contextTab:'customer',loadingOlder:false,refreshing:false}","contextTab:'customer',conversationOpen:false,loadingOlder:false,refreshing:false}",1)
              anchor="function setDraft(text,{append=false}={}){const draft=$('#messageDraft');if(!draft)return;draft.value=append&&draft.value.trim()?`${draft.value.trim()}\\n${text}`:text;syncFallbackButtons();draft.focus();draft.setSelectionRange(draft.value.length,draft.value.length)}"
              helper=anchor+"\nfunction syncConversationVisibility(){const pane=$('#conversationPane');if(!pane)return;const selectedId=typeof state.selected==='string'?state.selected:state.selected?.id;pane.classList.toggle('mobile-open',Boolean(state.conversationOpen&&selectedId))}"
              if anchor not in s: raise SystemExit('setDraft anchor missing')
              s=s.replace(anchor,helper,1)
              old="async function loadQueues(){await Promise.all([loadQueue('0975'),loadQueue('1018')])}"
              new="async function loadQueues(){await Promise.all([loadQueue('0975'),loadQueue('1018')]);syncConversationVisibility()}"
              if old not in s: raise SystemExit('loadQueues anchor missing')
              s=s.replace(old,new,1)
              old="state.selected=id;$('#conversationPane').classList.add('mobile-open');closeComposerPanels();"
              new="state.selected=id;state.conversationOpen=true;syncConversationVisibility();closeComposerPanels();"
              if old not in s: raise SystemExit('selectConversation anchor missing')
              s=s.replace(old,new,1)
              old="$$('.queue-column').forEach(x=>x.classList.toggle('active-mobile',x.dataset.channel===b.dataset.mobileChannel));$('#conversationPane').classList.remove('mobile-open')"
              new="$$('.queue-column').forEach(x=>x.classList.toggle('active-mobile',x.dataset.channel===b.dataset.mobileChannel));state.conversationOpen=false;syncConversationVisibility()"
              if old not in s: raise SystemExit('mobile channel anchor missing')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - run: node scripts/test-admin-attendance-ui-v1.mjs
      - run: node --check vitrine/admin/atendimento/attendance.js
      - name: Commit fix if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/atendimento/attendance.js
          git commit -m "fix: keep attendance conversation open across refresh"
          git push origin HEAD:fix/attendance-conversation-closes
