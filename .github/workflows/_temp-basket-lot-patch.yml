name: Temp basket lot patch
on:
  push:
    branches: ['feat/basket-lot-ops-rules-20261003']
    paths:
      - 'scripts/patch-basket-lot-ops-rules.py'
      - 'scripts/fix-basket-lot-patch-script.py'
      - 'scripts/test-basket-kit-commercial-fields.mjs'
      - '.github/workflows/_temp-basket-lot-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/basket-lot-ops-rules-20261003
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/fix-basket-lot-patch-script.py
      - run: python3 scripts/patch-basket-lot-ops-rules.py
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-lot-ops-rules.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-kit-commercial-fields.mjs
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
          git commit -m 'feat: apply basket lot operational rules'
          git push origin HEAD:feat/basket-lot-ops-rules-20261003
