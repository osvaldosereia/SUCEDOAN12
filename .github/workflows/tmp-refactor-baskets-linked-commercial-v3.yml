name: Temporary basket linked commercial v3 patch
on:
  push:
    branches:
      - refactor/baskets-canonical-section-20261005
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[basket-linked-commercial-v3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/baskets-canonical-section-20261005
      - run: python scripts/tmp-refactor-baskets-linked-commercial-v3.py
      - name: Commit canonical linked/commercial lot flow
        run: |
          if git diff --quiet -- vitrine/admin/basket-guided-builder.js vitrine/admin/basket-admin-section.js supabase/functions/admin-basket-guided-v1/index.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/basket-guided-builder.js vitrine/admin/basket-admin-section.js supabase/functions/admin-basket-guided-v1/index.ts
          git commit -m 'refactor: migrar campos e vínculos de lote ao fluxo canônico [basket-linked-commercial-v3-applied]'
          git push origin HEAD:refactor/baskets-canonical-section-20261005
