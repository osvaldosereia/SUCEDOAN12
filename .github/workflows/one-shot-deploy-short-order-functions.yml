name: one-shot-deploy-short-order-functions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-deploy-short-order-functions.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ssbesxgaijknwsjbsbcz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm deploy credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN secret is not configured in this repository.'
            exit 2
          fi
      - name: Inspect CLI deploy options
        run: npx --yes supabase@latest functions deploy --help
      - name: Deploy updated functions
        run: |
          npx --yes supabase@latest functions deploy order-public-view-v1 --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          npx --yes supabase@latest functions deploy admin-orders-v1 --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          npx --yes supabase@latest functions deploy storefront-v2 --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          npx --yes supabase@latest functions deploy admin-products-live-v1 --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
  cleanup:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-deploy-short-order-functions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remover deploy temporario de links curtos'
            git push origin HEAD:main
          fi
