name: CanecaFácil · testar produto temporário LI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/testar-produto-temporario-loja-integrada.mjs'
      - '.github/workflows/testar-produto-temporario-loja-integrada.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-temporary-product-test
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/testar-produto-temporario-loja-integrada.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Carregar Personal Token
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
          printf 'LOJA_INTEGRADA_AUTHORIZATION=%s\n' "$LI_APP_TOKEN" >> "$GITHUB_ENV"
      - name: Testar produto temporário sem expor cliente
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
        run: node scripts/testar-produto-temporario-loja-integrada.mjs
