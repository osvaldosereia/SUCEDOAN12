name: Atualizar SEO de cestas básicas e dados públicos

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site/produtos-home.json'
      - 'site/produtos-cesta-basica.json'
      - 'site/kits.json'
      - 'scripts/catalogos-combos-lib.js'
      - 'scripts/gerar-merchant.js'
      - 'scripts/gerar-meta-combos.js'
      - 'scripts/gerar-paginas-seo-combos.js'
      - 'scripts/gerar-sitemap.js'
      - 'scripts/injetar-seo-combos.js'
      - 'scripts/normalizar-seo-delivery.js'
      - 'scripts/check-public-site.mjs'
      - 'scripts/estabilizar-catalogo-publico.mjs'
      - 'app-next/src/bundle-routes.js'
      - 'app-next/src/core.js'
      - 'app-next/src/catalog.js'
      - 'app-next/src/ui.js'
      - 'app-next/src/main.js'
      - 'app-next/src/image-performance.js'
      - 'app-next/src/config.js'
      - 'app-next/styles/storefront-base.css'
      - 'app-next/styles/storefront-components.css'
      - 'app-next/styles/storefront-responsive.css'
      - '.github/workflows/update-public-data.yml'

permissions:
  contents: write

concurrency:
  group: public-data-baskets-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout do main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Normalizar domínio e empresa delivery
        run: node scripts/normalizar-seo-delivery.js

      - name: Aplicar SEO principal focado em cestas
        run: node scripts/injetar-seo-combos.js

      - name: Gerar páginas HTML
        run: node scripts/gerar-paginas-seo-combos.js

      - name: Gerar Merchant e catálogo Meta
        run: |
          node scripts/gerar-merchant.js
          node scripts/gerar-meta-combos.js

      - name: Gerar sitemap focado em cestas
        run: node scripts/gerar-sitemap.js

      - name: Validar arquivos públicos
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/catalogos-combos-lib.js
          node --check scripts/gerar-paginas-seo-combos.js
          node --check scripts/gerar-sitemap.js
          node --check scripts/injetar-seo-combos.js
          node --check scripts/normalizar-seo-delivery.js
          node --check scripts/estabilizar-catalogo-publico.mjs
          node --check app-next/src/bundle-routes.js
          node --check app-next/src/core.js
          node --check app-next/src/catalog.js
          node --check app-next/src/ui.js
          node --check app-next/src/main.js
          node --check app-next/src/image-performance.js
          node scripts/check-public-site.mjs
          test -s merchant.xml
          grep -q '<item>' merchant.xml
          test -s site/produtos_meta.csv
          test -s cestas/index.html
          test -s kits/index.html
          grep -q '"@type":"CollectionPage"' cestas/index.html
          grep -q '"@type":"FAQPage"' cestas/index.html
          grep -q '"@type":"Product"' cestas/*/index.html
          grep -q 'noindex,follow' kits/index.html
          test -s sitemap.xml
          grep -q 'https://donaantonia.com.br/cestas/' sitemap.xml
          ! grep -q 'https://donaantonia.com.br/kits/' sitemap.xml
          grep -q 'app-next/src/main.js?v=20260727-6' index.html
          grep -q 'storefront-base.css?v=20260727-6' index.html
          grep -q 'storefront-components.css?v=20260727-6' index.html
          grep -q 'storefront-responsive.css?v=20260727-6' index.html
          ! grep -q 'app-next/src/seo-combos.js' index.html
          ! grep -q 'app-next/src/live-polish.js' index.html
          ! grep -q 'styles/visual-parity.css' index.html
          ! grep -q 'styles/home-parity.css' index.html
          ! grep -q 'styles/live-polish.css' index.html
          grep -q 'id="menu-drawer".*inert' index.html
          ! grep -q 'https://www.donaantonia.com.br' sitemap.xml merchant.xml robots.txt index.html

      - name: Publicar dados e páginas geradas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            merchant.xml sitemap.xml robots.txt \
            site/produtos_meta.csv site/produtos_admin_meta.json site/seo-combos-manifest.json \
            cestas kits \
            index.html sobre-nos.html contato.html politica-de-entrega.html \
            politica-de-troca.html politica-de-privacidade.html termos-de-uso.html reels.html
          if git diff --cached --quiet; then
            echo 'SEO de cestas básicas e dados públicos já estão atualizados.'
            exit 0
          fi
          git commit -m 'Atualiza SEO de cestas básicas e dados públicos'
          for tentativa in 1 2 3 4 5; do
            if git push origin 'HEAD:main'; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          echo 'Não foi possível publicar os dados após cinco tentativas.' >&2
          exit 1
