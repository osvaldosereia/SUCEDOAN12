name: One-shot inventory sheet 25 patch
on:
  push:
    paths:
      - ".github/workflows/one-shot-inventory-sheet-25.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply inventory sheet patch
        run: python3 tools/patch_inventory_sheet_25.py
      - name: Verify diff
        run: |
          git diff --check
          grep -q 'INVENTORY_SHEET_CARDS_PER_PAGE=25' supabase/functions/admin-products-live-v1/index.ts
          grep -q 'grid-template-rows:repeat(5' vitrine/admin/index.html
          grep -q 'data-sheet-gondola' vitrine/admin/index.html
      - name: Commit patch
        run: |
          git config user.name "Dona Antonia Ops"
          git config user.email "actions@users.noreply.github.com"
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts
          git commit -m "feat(balance): 25 products with stock and gondola capture"
          git push
