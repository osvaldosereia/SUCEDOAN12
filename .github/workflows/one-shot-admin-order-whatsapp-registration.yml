name: One-shot admin order WhatsApp registration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin-order-whatsapp-registration.yml'
      - 'scripts/patch-admin-order-whatsapp-registration.py'
      - 'scripts/test-admin-order-whatsapp-registration.mjs'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/admin-order-whatsapp-registration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-order-whatsapp-registration
          fetch-depth: 2
      - name: Apply deterministic patch
        run: python3 scripts/patch-admin-order-whatsapp-registration.py
      - name: GREEN - contract and browser syntax
        run: |
          node scripts/test-admin-order-whatsapp-registration.mjs
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['vitrine/admin/index.html','cadastro/index.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`${file} inline script ${i+1}: ${e.message}`)}});
          }
          console.log('inline syntax OK');
          NODE
          git diff --check
      - name: Commit patched runtime files when needed
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/admin-products-live-v1/index.ts supabase/functions/storefront-v2/index.ts vitrine/admin/index.html cadastro/index.html
          if git diff --cached --quiet; then
            echo 'Runtime patch already applied; nothing to commit.'
          else
            git commit -m 'feat: add order WhatsApp and linked registration actions'
            git push origin HEAD:feat/admin-order-whatsapp-registration
          fi
