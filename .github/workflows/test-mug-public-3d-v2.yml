name: Testar UX pública de canecas

on:
  push:
    paths:
      - 'index.html'
      - 'app-next/src/product-media.js'
      - 'app-next/src/mug-public-thumbnails-v2.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-ux-v1.js'
      - 'scripts/test-mug-public-3d-v2.mjs'
      - '.github/workflows/test-mug-public-3d-v2.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app-next/src/product-media.js'
      - 'app-next/src/mug-public-thumbnails-v2.js'
      - 'app-next/src/mug-public-runtime-v6.js'
      - 'app-next/src/mug-public-ux-v1.js'
      - 'scripts/test-mug-public-3d-v2.mjs'
      - '.github/workflows/test-mug-public-3d-v2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar UX pública de canecas
        run: node scripts/test-mug-public-3d-v2.mjs
