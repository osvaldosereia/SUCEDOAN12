name: Attendance v2 Phase 1B TDD
on:
  push:
    branches: [feat/attendance-central-v2-phase1b-outbound]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Outbound canonical RED/GREEN
        run: |
          set -euo pipefail
          node scripts/test-papoai-outbound-canonical-v1.mjs
          node scripts/test-papoai-canonical-message-v1.mjs
