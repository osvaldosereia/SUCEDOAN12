name: Attendance v2 Phase 1B TDD
on:
  push:
    branches: [feat/attendance-central-v2-phase1b-outbound]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Outbound canonical contract
        run: |
          set -euo pipefail
          node scripts/test-papoai-outbound-canonical-v1.mjs
          node scripts/test-papoai-outbound-bridge-v1.mjs
          node scripts/test-papoai-canonical-message-v1.mjs
          node scripts/test-papoai-canonical-baseline-v1.mjs
      - name: Attendance regression
        run: |
          set -euo pipefail
          for f in scripts/test-admin-attendance-*.mjs; do
            echo "==> $f"
            node "$f"
          done
          if [ -f scripts/test-papoai-attendance-transport-v1.mjs ]; then node scripts/test-papoai-attendance-transport-v1.mjs; fi
      - name: Admin syntax
        run: |
          set -euo pipefail
          node --check vitrine/admin/atendimento/attendance.js
