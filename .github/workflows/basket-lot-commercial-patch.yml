name: Apply basket lot commercial patch
on:
  push:
    branches: [codex/basket-lot-commercial-fields]
    paths:
      - scripts/patch-basket-lot-commercial-fields.py
      - .github/workflows/basket-lot-commercial-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/basket-lot-commercial-fields
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch-basket-lot-commercial-fields.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts supabase/functions/storefront-v2/index.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: wire commercial fields into basket lot flow"
          git push origin HEAD:codex/basket-lot-commercial-fields
