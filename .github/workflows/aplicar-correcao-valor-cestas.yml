name: Aplicar correção do valor das cestas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-correcao-valor-cestas.yml'

permissions:
  contents: write

concurrency:
  group: correcao-valor-cestas
  cancel-in-progress: false

jobs:
  corrigir-e-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-next/package.json

      - name: Aplicar correção definitiva
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function patch(path, replacements) {
            let source = fs.readFileSync(path, 'utf8');
            for (const [before, after] of replacements) {
              if (!source.includes(before)) {
                if (source.includes(after)) continue;
                throw new Error(`Trecho esperado não encontrado em ${path}: ${before.slice(0, 100)}`);
              }
              source = source.replace(before, after);
            }
            fs.writeFileSync(path, source, 'utf8');
          }

          patch('app-next/src/commerce.js', [
            [
              "import { findProductByReference } from './catalog.js';",
              "import { findProductByReference } from './catalog.js';\nimport { basketFixedAdjustment } from './basket-pricing.js';"
            ],
            [
              "    const defaultTotal = rows.reduce((sum, row) => sum + Number(row.product.price || 0) * Number(row.qty), 0);\n    const fixedAdjustment = basket.preco ? roundMoney(Number(basket.preco) - defaultTotal) : 0;",
              "    const fixedAdjustment = basketFixedAdjustment(basket, rows);"
            ],
            [
              "      if (fixedAdjustment !== 0) {\n        current.cart[feeId] = 1;",
              "      if (fixedAdjustment !== 0) {\n        current.cart[feeId] = Number(current.cart[feeId] || 0) + 1;"
            ]
          ]);

          patch('app-next/src/ui.js', [
            [
              "import { comboSeoPath, findBasketByReference, findKitByReference } from './bundle-routes.js';",
              "import { comboSeoPath, findBasketByReference, findKitByReference } from './bundle-routes.js';\nimport { basketDraftTotal } from './basket-pricing.js';"
            ],
            [
              "  const total = Object.entries(draft).reduce((sum, [productId, qty]) => sum + Number(context.state.productMap.get(productId)?.price || 0) * Number(qty), 0);",
              "  const total = basketDraftTotal(context.state.productMap, basket, rows, draft);"
            ],
            [
              "<small>${fmt(row.product.price)} cada</small>",
              "<small>${escapeHtml(row.product.embalagem || 'Unidade')}</small>"
            ]
          ]);

          patch('app-next/src/checkout.js', [[
            "<small>${fmt(item.product.price)} cada</small>",
            "<small>${escapeHtml(item.product.embalagem || 'Produto')}</small>"
          ]]);

          const testPath = 'app-next/tests/commerce.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          const marker = "mantém o ajuste oculto para cada unidade da mesma cesta";
          if (!tests.includes(marker)) {
            tests += `\n\ntest('${marker}', async () => {\n  const { CartService } = await import('../src/commerce.js');\n  const products = [\n    { id: 'a', codigo: 'A', name: 'Produto A', price: 10, oldPrice: 10, stock: 20, situacao: '', embalagem: '1un' },\n    { id: 'b', codigo: 'B', name: 'Produto B', price: 10, oldPrice: 10, stock: 20, situacao: '', embalagem: '1un' }\n  ];\n  const state = {\n    products,\n    productMap: new Map(products.map(product => [product.id, product])),\n    productCodeMap: new Map(products.map(product => [product.codigo.toLowerCase(), product])),\n    productExactMap: new Map(products.map(product => [product.codigo.toLowerCase(), product])),\n    virtualFees: {}, cart: {}, cartOrder: [], basketCustomizations: {}, basketDrafts: {},\n    favorites: new Set(), coupons: [], activeCouponCode: '', customerLookupStatus: 'new'\n  };\n  const store = { getState: () => state, mutate(mutator) { mutator(state); } };\n  const cart = new CartService(store, { emit() {} });\n  const basket = { id: 'c1', nome: 'Cesta', preco: 25, produtos: ['1x A', '1x B'] };\n\n  assert.equal(cart.addBasket(basket).ok, true);\n  assert.equal(cart.addBasket(basket).ok, true);\n  assert.equal(state.cart['fee_basket:c1'], 2);\n\n  const pricing = calculateCartPricing(state);\n  assert.equal(pricing.productsSubtotalBefore, 40);\n  assert.equal(pricing.basketAdjustment, 10);\n  assert.equal(pricing.total, 50);\n});\n`;
            fs.writeFileSync(testPath, tests, 'utf8');
          }

          const commerce = fs.readFileSync('app-next/src/commerce.js', 'utf8');
          const ui = fs.readFileSync('app-next/src/ui.js', 'utf8');
          const checkout = fs.readFileSync('app-next/src/checkout.js', 'utf8');
          if (!commerce.includes('basketFixedAdjustment(basket, rows)')) throw new Error('Ajuste oculto não usa a regra central.');
          if (!commerce.includes('Number(current.cart[feeId] || 0) + 1')) throw new Error('Ajuste oculto não acumula ao repetir a cesta.');
          if (!ui.includes('basketDraftTotal(context.state.productMap, basket, rows, draft)')) throw new Error('Total da cesta editada não preserva o ajuste oculto.');
          if (ui.includes('fmt(row.product.price)} cada')) throw new Error('A lista da cesta ainda mostra preço unitário.');
          if (checkout.includes('fmt(item.product.price)} cada')) throw new Error('O checkout ainda mostra preço unitário.');
          NODE

      - name: Verificar sintaxe
        run: |
          node --check app-next/src/commerce.js
          node --check app-next/src/ui.js
          node --check app-next/src/checkout.js

      - name: Executar testes
        working-directory: app-next
        run: |
          npm test
          npm run check

      - name: Publicar correção e remover instalador
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/aplicar-correcao-valor-cestas.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            app-next/src/commerce.js app-next/src/ui.js app-next/src/checkout.js \
            app-next/tests/commerce.test.js .github/workflows/aplicar-correcao-valor-cestas.yml
          git commit -m 'Corrige ajuste oculto e valores das cestas'
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          exit 1
