name: One-shot basket auto suggestions admin
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-basket-auto-suggestions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            scripts/patch-basket-auto-suggestions.py
            .github/workflows/one-shot-basket-auto-suggestions.yml
          sparse-checkout-cone-mode: false
      - name: RED confirm feature absent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          assert 'async function basketAutoRpc(' not in s
          assert 'id="basketAutoSuggestions"' not in s
          print('RED confirmed: basket automatic suggestions UI is absent')
          PY
      - name: Fix patcher whitespace regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-basket-auto-suggestions.py')
          s=p.read_text(encoding='utf-8')
          old="s=s.replace('</style>',CSS+'  </style>',1)"
          new="s=s.replace('  </style>',CSS+'  </style>',1)"
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 scripts/patch-basket-auto-suggestions.py
      - name: GREEN verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          for token in ['basket-auto-suggestions-v1','async function basketAutoRpc(','id="basketAutoSuggestions"','basket_lot_suggestion_approve_v1','basket_lot_automation_settings_admin_v1']:
              assert token in s, token
          print('GREEN basket suggestion UI contract OK')
          PY
          node <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin JS syntax OK');
          NODE
          git diff --check
      - name: Commit and clean one-shot files
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          git rm scripts/patch-basket-auto-suggestions.py .github/workflows/one-shot-basket-auto-suggestions.yml
          git commit -m 'feat(admin): adiciona sugestões automáticas de lotes'
          git push origin HEAD:main
