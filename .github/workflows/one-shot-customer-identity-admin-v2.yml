name: One-shot customer identity admin v2

on:
  push:
    branches: [fix/clientes-identidade-telefone-20261003]
    paths:
      - '.github/workflows/one-shot-customer-identity-admin-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clientes-identidade-telefone-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RED - confirmar regressão antes do patch
        run: |
          if node scripts/test-customer-identity-admin-v2.mjs; then
            echo 'Regression test unexpectedly passed before patch' >&2
            exit 1
          fi
      - name: Aplicar patch mínimo
        run: python3 scripts/patch-customer-identity-admin-v2.py
      - name: GREEN - validar contratos
        run: node scripts/test-customer-identity-admin-v2.mjs
      - name: Commitar arquivos grandes com segurança
        run: |
          git config user.name 'OSSJU'
          git config user.email 'Junior.sereia@hotmail.com'
          git add vitrine/admin/index.html supabase/functions/admin-service-intelligence-v1/index.ts
          git diff --cached --check
          git commit -m 'fix(customers): exclusão, edição atômica e identidade segura'
          git pull --rebase origin fix/clientes-identidade-telefone-20261003
          git push origin HEAD:fix/clientes-identidade-telefone-20261003
