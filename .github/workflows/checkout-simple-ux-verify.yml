name: checkout-simple-ux-verify
on:
  push:
    branches:
      - feat/checkout-ux-simple-public
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkout-ux-simple-public
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded checkout UX patch
        run: |
          if grep -q "checkoutWhatsappUnified" checkout-resilience.js; then
            echo "checkout UX patch already present"
          else
            node scripts/apply-checkout-simple-ux.mjs
          fi
      - name: Checkout simple UX contract
        run: node scripts/test-checkout-simple-ux.mjs
      - name: Existing checkout capture contract
        run: node scripts/test-checkout-customer-capture-v1.mjs
      - name: Commit implementation when changed
        run: |
          if git diff --quiet -- checkout-resilience.js; then
            echo "no implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkout-resilience.js
          git commit -m "feat: simplificar checkout para publico mobile"
          git push origin HEAD:feat/checkout-ux-simple-public
