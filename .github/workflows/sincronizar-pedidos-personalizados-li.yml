name: CanecaFácil · pedidos de canecas Loja Integrada

# EMERGÊNCIA 2026-09-06: TODOS os acionamentos automáticos foram desativados
# para interromper leituras periódicas de pedidos/print_jobs no Firebase.
# Execução somente manual até o fluxo incremental ser implantado.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quantidade de pedidos recentes para revisar (máximo 50)'
        required: false
        default: '50'

permissions:
  contents: read

concurrency:
  group: canecafacil-pedidos-canecas-li
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Carregar token Loja Integrada
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
          printf 'LOJA_INTEGRADA_AUTHORIZATION=%s\n' "$LI_APP_TOKEN" >> "$GITHUB_ENV"
      - name: Vincular CF-ID aos pedidos personalizados
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LI_ORDER_LIMIT: ${{ github.event.inputs.limit || '50' }}
        run: node scripts/sincronizar-pedidos-personalizados-li-v2.mjs
      - name: Sincronizar todos os pedidos que contenham canecas
        if: always()
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LI_ALL_MUG_ORDER_LIMIT: ${{ github.event.inputs.limit || '40' }}
        run: node scripts/sincronizar-pedidos-canecas-li-v2.mjs
      - name: Garantir pagamento e liberação antes da produção
        if: always()
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
        run: node scripts/garantir-liberacao-producao.mjs
