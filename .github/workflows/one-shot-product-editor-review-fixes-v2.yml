name: One-shot product editor review fixes v2
on:
  push:
    branches: [feat/product-editor-complete-20261004]
    paths: ['.github/workflows/one-shot-product-editor-review-fixes-v2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            supabase/functions/admin-products-live-v1/index.ts
            scripts/test-product-editor-complete.mjs
            scripts/patch-product-editor-review-fixes.py
            .github/workflows/one-shot-product-editor-review-fixes-v2.yml
          sparse-checkout-cone-mode: false
      - name: Confirmar RED
        shell: bash
        run: |
          set +e
          node scripts/test-product-editor-complete.mjs > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
      - name: Aplicar patch
        run: python3 scripts/patch-product-editor-review-fixes.py
      - name: Validar GREEN
        run: |
          node scripts/test-product-editor-complete.mjs
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin JS syntax OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm scripts/patch-product-editor-review-fixes.py .github/workflows/one-shot-product-editor-review-fixes-v2.yml
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts scripts/test-product-editor-complete.mjs
          git commit -m 'fix(admin): preservar auditoria fiscal e identidade EAN'
          git push origin HEAD:feat/product-editor-complete-20261004
