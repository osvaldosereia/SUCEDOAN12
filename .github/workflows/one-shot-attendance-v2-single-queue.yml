name: One-shot attendance v2 single queue
on:
  push:
    branches: [feat/attendance-central-v2-phase1]
    paths:
      - scripts/patch-attendance-v2-single-queue.py
      - .github/workflows/one-shot-attendance-v2-single-queue.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-central-v2-phase1
      - name: Apply patch
        run: python scripts/patch-attendance-v2-single-queue.py
      - name: Verify syntax
        run: node --check vitrine/admin/atendimento/attendance.js
      - name: Commit patch
        run: |
          git config user.name "Dona Antonia Ops"
          git config user.email "actions@users.noreply.github.com"
          git add vitrine/admin/atendimento/index.html vitrine/admin/atendimento/attendance.css vitrine/admin/atendimento/attendance.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: use single WhatsApp-style attendance queue"
          git push origin HEAD:feat/attendance-central-v2-phase1
