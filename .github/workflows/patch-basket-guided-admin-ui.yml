name: Patch basket guided admin UI
on:
  push:
    branches: [feat/basket-guided-admin-ui-20261004]
    paths:
      - 'scripts/patch-basket-guided-admin-ui.py'
      - '.github/workflows/patch-basket-guided-admin-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/basket-guided-admin-ui-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/patch-basket-guided-admin-ui.py
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-guided-builder-ui-v1.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-admin-simple-flow.mjs
      - run: node --disable-warning=ExperimentalWarning scripts/test-basket-unified-commercial-model.mjs
      - run: git diff --check
      - name: Commit patched admin
        run: |
          if git diff --quiet -- vitrine/admin/index.html; then
            echo 'Admin already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'feat: integrar editor guiado à seção de Cestas/Kits'
          git push origin HEAD:feat/basket-guided-admin-ui-20261004
