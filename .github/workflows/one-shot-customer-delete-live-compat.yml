name: One-shot customer delete live compatibility

on:
  push:
    branches:
      - fix/customer-delete-live-compat-20261004
    paths:
      - .github/workflows/one-shot-customer-delete-live-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-delete-live-compat-20261004
          fetch-depth: 0
      - name: Patch delete customer request and error
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vitrine/admin/index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('async function deleteCustomer(id){')
          segment = text[start:start + 6000]

          old_request = "const response=await customerApi('vitrine_customer_delete',{id});"
          new_request = "const response=await customerApi('vitrine_customer_delete',{id,customer_id:id});"
          assert segment.count(old_request) == 1, f'expected one delete request, got {segment.count(old_request)}'
          segment = segment.replace(old_request, new_request, 1)

          old_catch = "}catch(err){toast(errorMessage(err),'bad');}"
          new_catch = "}catch(err){console.error('customer_delete_failed',err);toast('Não foi possível excluir o cadastro.','bad');}"
          assert segment.count(old_catch) == 1, f'expected one delete catch, got {segment.count(old_catch)}'
          segment = segment.replace(old_catch, new_catch, 1)

          text = text[:start] + segment + text[start + 6000:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run targeted regression test
        run: node scripts/test-customer-identity-admin-v2.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- vitrine/admin/index.html; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix(clientes): compatibiliza exclusão com Edge publicada'
          git push origin HEAD:fix/customer-delete-live-compat-20261004
