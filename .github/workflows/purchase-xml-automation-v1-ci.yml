name: purchase-xml-automation-v1
on:
  pull_request:
    paths:
      - "vitrine/admin/**"
      - "supabase/functions/admin-products-live-v1/**"
      - "supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/**"
      - "supabase/functions/purchase-xml-v1/**"
      - "supabase/migrations/20261022090000_purchase_xml_product_stock_policy_v1.sql"
      - "scripts/test-purchase-xml-*.mjs"
      - "scripts/test-xml-catalog-details-v2.mjs"
      - "scripts/test-xml-catalog-recovery-v1.mjs"
      - "scripts/test-purchase-xml-note-data-stock-toggle-v1.mjs"
      - "scripts/build-vitrine-admin-runtime.py"
      - ".github/workflows/purchase-xml-automation-v1-ci.yml"
  push:
    branches: [main]
    paths:
      - "vitrine/admin/**"
      - "supabase/functions/admin-products-live-v1/**"
      - "supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/**"
      - "supabase/functions/purchase-xml-v1/**"
      - "supabase/migrations/20261022090000_purchase_xml_product_stock_policy_v1.sql"
      - "scripts/test-purchase-xml-*.mjs"
      - "scripts/test-xml-catalog-details-v2.mjs"
      - "scripts/test-xml-catalog-recovery-v1.mjs"
      - "scripts/test-purchase-xml-note-data-stock-toggle-v1.mjs"
      - "scripts/build-vitrine-admin-runtime.py"
      - ".github/workflows/purchase-xml-automation-v1-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-purchase-xml-daily-dedup-v1.mjs
      - run: node scripts/test-purchase-xml-product-policy-v1.mjs
      - run: node scripts/test-purchase-xml-automation-v1.mjs
      - run: node scripts/test-purchase-xml-publish-bling-v1.mjs
      - run: node scripts/test-purchase-xml-simple-queue-v1.mjs
      - run: node scripts/test-purchase-xml-note-data-stock-toggle-v1.mjs
      - run: node scripts/test-xml-catalog-details-v2.mjs
      - run: node scripts/test-xml-catalog-recovery-v1.mjs
      - run: node scripts/test-purchase-xml-guided-r31.mjs
      - run: node scripts/test-purchase-xml-compact-r33.mjs
      - run: cmp supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts
      - run: node --check vitrine/admin/admin-runtime.js
      - run: python3 scripts/build-vitrine-admin-runtime.py --check
      - run: git diff --check
