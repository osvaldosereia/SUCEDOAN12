name: XML Catalog Comparison V3
on:
  pull_request:
    paths:
      - 'supabase/functions/purchase-xml-v1/**'
      - 'supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/**'
      - 'vitrine/admin/index.html'
      - 'scripts/test-xml-catalog-comparison-v3.mjs'
      - '.github/workflows/xml-catalog-comparison-v3.yml'
  push:
    branches:
      - 'agent/xml-catalog-comparison-v3'
jobs:
  test_xml_catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify XML comparison and safety
        run: node scripts/test-xml-catalog-comparison-v3.mjs
