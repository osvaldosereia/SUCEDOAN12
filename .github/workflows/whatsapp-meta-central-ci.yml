      - {name: Audio recorder JavaScript syntax, run: 'node --check vitrine/admin/atendimento/attendance-audio-recorder.js'}
      - {name: Audio WebCodecs adapter syntax, run: 'node --check vitrine/admin/atendimento/attendance-audio-webcodecs-adapter.js'}
      - {name: Audio PCM worklet syntax, run: 'node --check vitrine/admin/atendimento/attendance-audio-pcm-worklet.js'}
