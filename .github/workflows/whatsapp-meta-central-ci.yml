      - 'supabase/sql/20261004_admin_attendance_meta_media_readiness_compat_v2.sql'
      - 'supabase/sql/20261004_whatsapp_template_events_v1.sql'
      - 'supabase/sql/20261003_whatsapp_ana_jobs_v1.sql'
      - 'supabase/sql/20261003_whatsapp_ana_admin_preview_v1.sql'
      - 'supabase/sql/20261003_whatsapp_ana_preview_stale_claim_recovery_v3.sql'
      - 'supabase/sql/20261003_whatsapp_ana_review_observability_v4.sql'
      - 'supabase/sql/20261003_whatsapp_meta_shadow_media_preserve_v1.sql'
      - 'supabase/migrations/20261004233000_marketing_consent_ledger_v1.sql'
      - 'supabase/migrations/20261004234500_marketing_audience_preview_v1.sql'
      - 'supabase/migrations/20261005002000_marketing_audience_candidates_v2.sql'
      - 'supabase/migrations/20261005004000_marketing_campaign_drafts_v1.sql'
      - 'supabase/migrations/20261005014000_marketing_campaign_execution_v1.sql'
      - 'supabase/migrations/20261005018000_marketing_campaign_worker_support_v1.sql'
      - 'supabase/migrations/20261005021000_marketing_campaign_worker_cron_v1.sql'
      - 'supabase/migrations/20261005024000_marketing_campaign_execution_controls_v1.sql'
      - 'supabase/sql/20261006_marketing_security_hardening_v1.sql'
      - 'scripts/test-attendance-*.mjs'
      - 'scripts/test-whatsapp-ana-*.mjs'
      - 'scripts/test-whatsapp-meta-*.mjs'
      - 'scripts/test-whatsapp-marketing-*.mjs'
      - 'scripts/test-marketing-security-hardening-v1.mjs'
      - 'scripts/test-admin-marketing-*.mjs'
      - '.github/workflows/whatsapp-meta-central-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - {name: Provider-neutral outbox contract, run: 'node scripts/test-attendance-provider-neutral-v3.mjs'}
      - {name: Attendance template picker contract, run: 'node scripts/test-attendance-template-picker-v1.mjs'}
      - {name: Attendance template send UI contract, run: 'node scripts/test-attendance-template-send-ui-v1.mjs'}
      - {name: Meta template transport send contract, run: 'node scripts/test-whatsapp-meta-template-send-v1.mjs'}
      - {name: Admin template send contract, run: 'node scripts/test-admin-attendance-template-send-v1.mjs'}
      - {name: Template PLpgSQL ambiguity regression, run: 'node scripts/test-attendance-meta-template-plpgsql-v1.mjs'}
      - {name: Meta templates contract, run: 'node scripts/test-whatsapp-meta-templates-v1.mjs'}
      - {name: Meta templates admin sync contract, run: 'node scripts/test-whatsapp-meta-template-admin-v1.mjs'}
      - {name: Meta template mutation contract, run: 'node scripts/test-whatsapp-meta-template-mutations-v1.mjs'}
      - {name: Marketing Meta template admin UI contract, run: 'node scripts/test-whatsapp-marketing-template-admin-v1.mjs'}
      - {name: Marketing consent ledger contract, run: 'node scripts/test-whatsapp-marketing-consent-ledger-v1.mjs'}
      - {name: Marketing security hardening contract, run: 'node scripts/test-marketing-security-hardening-v1.mjs'}
      - {name: Marketing audience preview contract, run: 'node scripts/test-whatsapp-marketing-audience-preview-v1.mjs'}
      - {name: Marketing audience shared core contract, run: 'node scripts/test-whatsapp-marketing-audience-core-v2.mjs'}
      - {name: Marketing campaign drafts contract, run: 'node scripts/test-whatsapp-marketing-campaign-drafts-v1.mjs'}
      - {name: Marketing campaign execution contract, run: 'node scripts/test-whatsapp-marketing-campaign-execution-v1.mjs'}
      - {name: Marketing campaign worker contract, run: 'node scripts/test-whatsapp-marketing-worker-v1.mjs'}
      - {name: Marketing campaign worker cron contract, run: 'node scripts/test-whatsapp-marketing-worker-cron-v1.mjs'}
      - {name: Admin marketing audiences contract, run: 'node scripts/test-admin-marketing-audiences-v1.mjs'}
      - {name: Admin marketing campaigns contract, run: 'node scripts/test-admin-marketing-campaigns-v1.mjs'}
      - {name: Admin marketing campaign scheduling contract, run: 'node scripts/test-admin-marketing-campaign-scheduling-v1.mjs'}
      - {name: Marketing audience UI contract, run: 'node scripts/test-whatsapp-marketing-audience-ui-v1.mjs'}
      - {name: Marketing campaign UI contract, run: 'node scripts/test-whatsapp-marketing-campaign-ui-v1.mjs'}
      - {name: Marketing campaign execution UI contract, run: 'node scripts/test-whatsapp-marketing-campaign-execution-ui-v1.mjs'}
      - {name: Marketing intelligence legacy contract, run: 'python scripts/test-marketing-intelligence-contract.py'}
      - {name: Meta transport contract, run: 'node scripts/test-attendance-meta-send-v1.mjs'}
      - {name: Meta media contract, run: 'node scripts/test-attendance-meta-media-v1.mjs'}
      - {name: Meta media content signature contract, run: 'node scripts/test-attendance-meta-media-content-v1.mjs'}
      - {name: Meta media retry/idempotency contract, run: 'node scripts/test-attendance-meta-media-retry-v1.mjs'}
      - {name: Meta media safety contract, run: 'node scripts/test-attendance-meta-media-safety-v1.mjs'}
      - {name: Meta media live graduation contract, run: 'node scripts/test-attendance-meta-media-live-v1.mjs'}
      - {name: Media canary error contract, run: 'node scripts/test-attendance-media-canary-error-contract-v1.mjs'}
      - {name: Audio media UX contract, run: 'node scripts/test-attendance-media-audio-ux-v1.mjs'}
