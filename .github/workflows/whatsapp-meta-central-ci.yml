      - {name: Audio WebCodecs OGG contract, run: 'node scripts/test-attendance-audio-webcodecs-v1.mjs'}
      - {name: Audio Ogg mux behavior, run: 'node scripts/test-attendance-audio-ogg-mux-v1.mjs'}
      - {name: Media status UX contract, run: 'node scripts/test-attendance-media-status-ux-v1.mjs'}
      - {name: Media delivery observer contract, run: 'node scripts/test-attendance-media-delivery-observer-v1.mjs'}
      - {name: Human AI state contract, run: 'node scripts/test-attendance-human-ai-state-v1.mjs'}
      - {name: ANA dry-run contract, run: 'node scripts/test-whatsapp-ana-worker-v1.mjs'}
