name: one-shot-sync-main-library

on:
  push:
    branches:
      - feat/attendance-quick-library-20261003

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-quick-library-20261003
          fetch-depth: 0
      - name: Merge current main with guarded conflict resolution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            :
          else
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' \
              'supabase/functions/_shared/admin-attendance-media-send-v1.mjs' \
              'supabase/functions/_shared/whatsapp-meta-media-v1.mjs' | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              git merge --abort || true
              exit 1
            fi
            git checkout --ours -- \
              supabase/functions/_shared/admin-attendance-media-send-v1.mjs \
              supabase/functions/_shared/whatsapp-meta-media-v1.mjs
            git add \
              supabase/functions/_shared/admin-attendance-media-send-v1.mjs \
              supabase/functions/_shared/whatsapp-meta-media-v1.mjs
            git commit --no-edit
          fi
          git diff --check
          git push origin HEAD:feat/attendance-quick-library-20261003
