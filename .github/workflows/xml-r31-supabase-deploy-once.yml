name: XML R31 deploy Supabase CLI (one-shot)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-xml:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm deploy credential is available (no secrets printed)
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::GitHub Actions does not have SUPABASE_ACCESS_TOKEN. Deployment not attempted."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy existing canonical Edge Function with API bundler
        shell: bash
        run: |
          supabase functions deploy admin-service-intelligence-v1 --project-ref ssbesxgaijknwsjbsbcz --use-api
