name: XML R31 deploy Supabase CLI (one-shot)
on:
  push:
    branches:
      - agent/xml-operacao-simples-20261012
    paths:
      - .github/workflows/xml-r31-supabase-deploy-once.yml
permissions:
  contents: read
jobs:
  deploy-xml:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm deploy credential is available (no secrets printed)
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::GitHub Actions does not have SUPABASE_ACCESS_TOKEN. Deployment not attempted."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy existing canonical Edge Function with API bundler
        shell: bash
        run: |
          supabase functions deploy admin-service-intelligence-v1 --project-ref ssbesxgaijknwsjbsbcz --use-api --debug
