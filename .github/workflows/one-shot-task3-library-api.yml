name: one-shot-task3-library-api

on:
  push:
    branches:
      - feat/attendance-quick-library-20261003

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch gateway through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: feat/attendance-quick-library-20261003
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          repo=os.environ['GH_REPOSITORY']; branch=os.environ['GH_BRANCH']; token=os.environ['GH_TOKEN']
          path='supabase/functions/admin-whatsapp-ops-v1/index.ts'
          api=f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'task3-patcher'}
          req=urllib.request.Request(api,headers=headers)
          with urllib.request.urlopen(req) as r: current=json.load(r)
          source=base64.b64decode(current['content']).decode('utf-8')
          if 'admin-attendance-library-v1.mjs' in source:
              print('Task 3 patch already applied')
              raise SystemExit(0)
          def replace_once(anchor,replacement,label):
              global source
              if source.count(anchor)!=1: raise RuntimeError(f'{label}: expected 1 anchor, got {source.count(anchor)}')
              source=source.replace(anchor,replacement,1)
          replace_once(
              'import {sendAttendanceMediaViaMeta} from "../_shared/admin-attendance-media-send-v1.mjs";',
              'import {sendAttendanceMediaViaMeta} from "../_shared/admin-attendance-media-send-v1.mjs";\nimport {listAttendanceLibrary,prepareAttendanceLibraryUpload,completeAttendanceLibraryUpload,signAttendanceLibraryPreview,updateAttendanceLibraryItem,deactivateAttendanceLibraryItem} from "../_shared/admin-attendance-library-v1.mjs";',
              'library import')
          replace_once(
              'const READ_ACTIONS=new Set(["accounts","queue","conversation","context","products","media","labels","conversation_labels","quick_replies"]);',
              'const READ_ACTIONS=new Set(["accounts","queue","conversation","context","products","media","labels","conversation_labels","quick_replies","library_list","library_preview"]);',
              'read actions')
          replace_once(
              'const SAFE_POST_ACTIONS=new Set(["mark_read","follow_up","issue_catalog","marketing_opt_out","label_save","label_deactivate","conversation_labels_set","quick_reply_save","quick_reply_deactivate","send_text","send_media"]);',
              'const SAFE_POST_ACTIONS=new Set(["mark_read","follow_up","issue_catalog","marketing_opt_out","label_save","label_deactivate","conversation_labels_set","quick_reply_save","quick_reply_deactivate","send_text","send_media","library_upload_prepare","library_upload_complete","library_update","library_deactivate","library_send"]);',
              'post actions')
          get_anchor='    if(req.method==="GET"&&action==="products"){' 
          get_handlers='''    if(req.method==="GET"&&action==="library_list"){
              const data=await listAttendanceLibrary({db,query:url.searchParams.get("q")||"",kind:url.searchParams.get("kind"),category:url.searchParams.get("category"),limit:num(url.searchParams.get("limit"),40,1,100),cursor:url.searchParams.get("cursor")});
              return json(req,data,data?.ok===false?400:200);
            }

            if(req.method==="GET"&&action==="library_preview"){
              const itemId=validUuid(url.searchParams.get("item_id"));
              if(!itemId)return json(req,{ok:false,error:"library_item_invalid"},400);
              const data=await signAttendanceLibraryPreview({db,itemId});
              return json(req,data,data?.ok===false?404:200);
            }

'''+get_anchor
          replace_once(get_anchor,get_handlers,'GET library handlers')
          body_anchor='    const body=await req.json().catch(()=>({}));'
          post_handlers=body_anchor+'''\n\n    if(action==="library_upload_prepare"){
              const data=await prepareAttendanceLibraryUpload({db,adminUserId:auth.user_id,input:body});
              return json(req,data,data?.ok===false?400:200);
            }
            if(action==="library_upload_complete"){
              const data=await completeAttendanceLibraryUpload({db,adminUserId:auth.user_id,input:body});
              return json(req,data,data?.ok===false?400:200);
            }
            if(action==="library_update"){
              const data=await updateAttendanceLibraryItem({db,adminUserId:auth.user_id,input:body});
              return json(req,data,data?.ok===false?400:200);
            }
            if(action==="library_deactivate"){
              const data=await deactivateAttendanceLibraryItem({db,adminUserId:auth.user_id,itemId:body?.item_id});
              return json(req,data,data?.ok===false?404:200);
            }
            if(action==="library_send"){
              if(body?.to_phone_e164!==undefined||body?.whatsapp_account_id!==undefined||body?.account_id!==undefined||body?.phone_number_id!==undefined||body?.waba_id!==undefined||body?.customer_id!==undefined)return json(req,{ok:false,error:"destination_fields_not_allowed"},400);
              const libraryConversationId=validUuid(body?.conversation_id),itemId=validUuid(body?.item_id),idempotencyKey=normalizeIdempotencyKey(body?.idempotency_key);
              if(!libraryConversationId)return json(req,{ok:false,error:"invalid_conversation_id"},400);
              if(!itemId)return json(req,{ok:false,error:"library_item_invalid"},400);
              if(!idempotencyKey)return json(req,{ok:false,error:"invalid_idempotency_key"},400);
              return json(req,{ok:false,error:"library_send_not_ready"},501);
            }'''
          replace_once(body_anchor,post_handlers,'POST library handlers')
          payload=json.dumps({'message':'feat: apply Task 3 library API patch','content':base64.b64encode(source.encode()).decode(),'sha':current['sha'],'branch':branch}).encode()
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(put) as r: result=json.load(r)
          print('Gateway commit',result['commit']['sha'])
          PY
