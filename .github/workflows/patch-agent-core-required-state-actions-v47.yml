name: Patch Agent Core Required State Actions V47

on:
  push:
    branches:
      - fix/agent-core-v45-order-context
    paths:
      - 'scripts/patch-agent-core-required-state-actions-v47.mjs'
      - '.github/workflows/patch-agent-core-required-state-actions-v47.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-core-v45-order-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V47 patch
        run: node scripts/patch-agent-core-required-state-actions-v47.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check patched edges
        run: |
          deno check supabase/functions/dona-antonia-agent-core-v1/index.ts
          deno check supabase/functions/dona-antonia-agent-eval-v1/index.ts
      - name: Validate V47 invariants
        run: |
          grep -q 'function requiredToolForState' supabase/functions/dona-antonia-agent-core-v1/index.ts
          grep -q 'wa_start_basket_checkout' supabase/functions/dona-antonia-agent-core-v1/index.ts
          grep -q 'wa_finalize_basket_order' supabase/functions/dona-antonia-agent-core-v1/index.ts
          grep -q 'wa_find_baskets_by_items' supabase/functions/dona-antonia-agent-eval-v1/index.ts
          grep -q 'mode:"required"' supabase/functions/dona-antonia-agent-eval-v1/index.ts
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/dona-antonia-agent-core-v1/index.ts supabase/functions/dona-antonia-agent-eval-v1/index.ts
          git commit -m 'feat(agent-core): enforce deterministic state transitions V47'
          git push origin HEAD:fix/agent-core-v45-order-context