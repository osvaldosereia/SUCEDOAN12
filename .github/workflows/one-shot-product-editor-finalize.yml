name: One-shot finalize product editor
on:
  push:
    branches: [feat/product-editor-complete-20261004]
    paths: ['.github/workflows/one-shot-product-editor-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            vitrine/admin/index.html
            supabase/functions/admin-products-live-v1/index.ts
            scripts/test-product-editor-complete.mjs
            scripts/patch-product-editor-complete.py
            .github/workflows/one-shot-product-editor-complete.yml
            .github/workflows/one-shot-product-editor-diagnose.yml
            .github/workflows/one-shot-product-editor-finalize.yml
          sparse-checkout-cone-mode: false
      - name: RED
        shell: bash
        run: |
          set +e
          node scripts/test-product-editor-complete.mjs > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
          grep -q 'editor precisa declarar o contrato completo v1' /tmp/red.log
      - name: Corrigir gerador temporario
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-product-editor-complete.py')
          s=p.read_text()
          s=s.replace('admin=pattern.sub(new_editor,admin,count=1)','admin=pattern.sub(lambda _: new_editor,admin,count=1)',1)
          s=s.replace('ADMIN.write_text(admin)',"admin='\\n'.join(line.rstrip() for line in admin.splitlines())+'\\n'\nADMIN.write_text(admin)",1)
          p.write_text(s)
          PY
      - name: Aplicar e validar GREEN
        run: |
          python3 scripts/patch-product-editor-complete.py
          node scripts/test-product-editor-complete.mjs
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('Admin JS syntax OK');
          NODE
          git diff --check
      - name: Commit e push
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f scripts/patch-product-editor-complete.py .github/workflows/one-shot-product-editor-complete.yml .github/workflows/one-shot-product-editor-diagnose.yml .github/workflows/one-shot-product-editor-finalize.yml
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts scripts/test-product-editor-complete.mjs
          git commit -m 'feat(admin): editor completo de produtos'
          git push origin HEAD:feat/product-editor-complete-20261004
