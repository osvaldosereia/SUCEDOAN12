name: Dona Antonia V2 - Validacao isolada
on:
  push:
    branches:
      - agent/dona-antonia-nova-plataforma
    paths:
      - 'projetos/dona-antonia-v2/**'
      - '.github/workflows/dona-antonia-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projetos/dona-antonia-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without postinstall scripts
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript strict check
        run: npm run check
      - name: Domain unit tests
        run: npm test
      - name: Production build smoke test (build only; no deployment)
        run: npm run build
