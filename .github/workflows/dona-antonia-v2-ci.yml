name: Dona Antonia V2 - Validacao isolada
on:
  push:
    branches:
      - agent/dona-antonia-*
    paths:
      - 'projetos/dona-antonia-v2/**'
      - '.github/workflows/dona-antonia-v2-ci.yml'
  pull_request:
    branches:
      - agent/dona-antonia-*
    paths:
      - 'projetos/dona-antonia-v2/**'
      - '.github/workflows/dona-antonia-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dona-antonia-v2-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projetos/dona-antonia-v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies without postinstall scripts
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Lint and formatting
        run: |
          npm run lint
          npm run format:check
      - name: Enforce module boundaries and growth limits
        run: npm run architecture:check
      - name: TypeScript strict check
        run: npm run check
      - name: Domain unit tests
        run: npm test
      - name: Production build smoke test (build only; no deployment)
        run: npm run build
      - name: Install Chromium (test environment only)
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test - mobile and desktop
        run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: dona-antonia-v2-browser-screenshots
          path: projetos/dona-antonia-v2/test-results/
          if-no-files-found: ignore
          retention-days: 7
