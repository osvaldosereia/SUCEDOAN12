name: Alinhar personalizador embutido

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alinhar-personalizador-embutido-once.yml'
      - 'scripts/alinhar-personalizador-embutido-once.mjs'

permissions:
  contents: write

jobs:
  alinhar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar alinhamento
        run: node scripts/alinhar-personalizador-embutido-once.mjs
      - name: Validar JavaScript
        run: |
          node --check admin-canecas/bulk-actions-v1.js
          node --check admin-canecas/product-content-manager-v1.js
          node --check scripts/sincronizar-conteudo-canecafacil.mjs
          node --check loja-integrada/personalizar/app.js
          grep -q 'height:520px' admin-canecas/bulk-actions-v1.js
          ! grep -q 'javascript:(function' admin-canecas/bulk-actions-v1.js
      - name: Ressincronizar produto atual
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: mug-1788185981865-zrkc3z
          FORCE: 'true'
          LIMIT: '1'
        run: node scripts/sincronizar-loja-integrada.mjs
      - name: Publicar e remover temporários
        run: |
          rm -f scripts/alinhar-personalizador-embutido-once.mjs
          rm -f .github/workflows/alinhar-personalizador-embutido-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-canecas/bulk-actions-v1.js admin-canecas/product-content-manager-v1.js scripts/sincronizar-conteudo-canecafacil.mjs scripts/alinhar-personalizador-embutido-once.mjs .github/workflows/alinhar-personalizador-embutido-once.yml
          git commit -m "Alinha todos os caminhos ao personalizador embutido"
          git pull --rebase origin main
          git push origin main
