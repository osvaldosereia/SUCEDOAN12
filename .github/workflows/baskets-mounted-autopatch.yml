name: Apply baskets mounted edit patch
on:
  push:
    branches:
      - fix/baskets-mounted-edit-print-models-20261004
    paths:
      - 'scripts/patch-basket-mounted-edit-print-models.py'
      - '.github/workflows/baskets-mounted-autopatch.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baskets-mounted-edit-print-models-20261004
          fetch-depth: 0
      - run: python3 scripts/patch-basket-mounted-edit-print-models.py
      - run: git diff --check
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-products-live-v1/index.ts vitrine/admin/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: editar e imprimir lotes e modelos de cestas"
          git push origin HEAD:fix/baskets-mounted-edit-print-models-20261004
