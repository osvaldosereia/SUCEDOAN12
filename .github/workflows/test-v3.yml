name: Testar Admin e compatibilidade Vitrine

on:
  push:
    branches: [main]
    paths:
      - 'vitrine-v3/**'
      - 'admin/**'
      - 'tests/creative-studio-admin-contract.test.mjs'
      - 'tests/creative-studio-simplified-contract.test.mjs'
      - 'tests/creative-storyboard-contract.test.mjs'
      - 'supabase/functions/creative-storyboard-director/**'
      - 'supabase/functions/creative-storyboard-projects/**'
      - 'supabase/functions/creative-storyboard-image/**'
      - 'supabase/migrations/20260917114500_creative_video_projects_optional_product.sql'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/config.toml'
      - 'scripts/test-admin-v3-contract.mjs'
      - 'scripts/test-admin-v3-inline-product-controls.mjs'
      - 'scripts/test-admin-v3-product-name-management.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - '.github/workflows/test-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vitrine-v3/**'
      - 'admin/**'
      - 'tests/creative-studio-admin-contract.test.mjs'
      - 'tests/creative-studio-simplified-contract.test.mjs'
      - 'tests/creative-storyboard-contract.test.mjs'
      - 'supabase/functions/creative-storyboard-director/**'
      - 'supabase/functions/creative-storyboard-projects/**'
      - 'supabase/functions/creative-storyboard-image/**'
      - 'supabase/migrations/20260917114500_creative_video_projects_optional_product.sql'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/functions/admin-core-v1/**'
      - 'supabase/functions/admin-product-names-v1/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/config.toml'
      - 'scripts/test-admin-v3-contract.mjs'
      - 'scripts/test-admin-v3-inline-product-controls.mjs'
      - 'scripts/test-admin-v3-product-name-management.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - '.github/workflows/test-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-admin-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compatibilidade Vitrine antiga
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'viewport-fit=cover' vitrine-v3/index.html
          grep -q '../comprar/' vitrine-v3/index.html
          grep -q 'location.replace' vitrine-v3/index.html
      - name: Contrato do Admin oficial
        run: node scripts/test-admin-v3-contract.mjs
      - name: Contrato do Estúdio Criativo
        run: |
          node --test tests/creative-studio-admin-contract.test.mjs
          node --test tests/creative-studio-simplified-contract.test.mjs
          node --test tests/creative-storyboard-contract.test.mjs
      - name: Controles inline do Admin oficial
        run: node scripts/test-admin-v3-inline-product-controls.mjs
      - name: Nomes dos produtos no Admin oficial
        run: node scripts/test-admin-v3-product-name-management.mjs
      - name: Pedidos completos no Admin oficial
        run: node scripts/test-comprar-order-admin-v1.mjs
      - name: Validar JavaScript do Admin
        run: |
          node --check admin/api.js
          node --check admin/app.js
          node --check admin/creative-studio.js
          node --check admin/creative-studio-persistence.js
          node --check admin/orders-integrated-v2.js
          node --check admin/basket-editor.js
          node --check admin/products-inline-controls-v4.js
      - name: Compilar Edge Functions do Admin
        run: |
          deno check supabase/functions/creative-storyboard-director/index.ts
          deno check supabase/functions/creative-storyboard-projects/index.ts
          deno check supabase/functions/creative-storyboard-image/index.ts
          deno check supabase/functions/catalog-v3/index.ts
          deno check supabase/functions/admin-core-v1/index.ts
          deno check supabase/functions/admin-product-names-v1/index.ts
          deno check supabase/functions/admin-simple-v2/index.ts
