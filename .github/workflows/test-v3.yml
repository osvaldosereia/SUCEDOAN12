name: Testar Admin V3 e compatibilidade Vitrine

on:
  push:
    branches:
      - main
    paths:
      - 'vitrine-v3/**'
      - 'admin-v3/**'
      - 'admin/**'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/functions/admin-v3-api/**'
      - 'supabase/functions/admin-v3-product-names/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/config.toml'
      - 'scripts/test-admin-v3-contract.mjs'
      - 'scripts/test-admin-v3-inline-product-controls.mjs'
      - 'scripts/test-admin-v3-product-name-management.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - '.github/workflows/test-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vitrine-v3/**'
      - 'admin-v3/**'
      - 'admin/**'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/functions/admin-v3-api/**'
      - 'supabase/functions/admin-v3-product-names/**'
      - 'supabase/functions/admin-simple-v2/**'
      - 'supabase/config.toml'
      - 'scripts/test-admin-v3-contract.mjs'
      - 'scripts/test-admin-v3-inline-product-controls.mjs'
      - 'scripts/test-admin-v3-product-name-management.mjs'
      - 'scripts/test-comprar-order-admin-v1.mjs'
      - '.github/workflows/test-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compatibilidade Vitrine V3
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'viewport-fit=cover' vitrine-v3/index.html
          grep -q '../comprar/' vitrine-v3/index.html
          grep -q 'location.replace' vitrine-v3/index.html
      - name: Contrato Admin V3
        run: node scripts/test-admin-v3-contract.mjs
      - name: Controles inline Admin V3
        run: node scripts/test-admin-v3-inline-product-controls.mjs
      - name: Gestão de nomes Admin V3
        run: node scripts/test-admin-v3-product-name-management.mjs
      - name: Pedidos completos no Admin oficial
        run: node scripts/test-comprar-order-admin-v1.mjs
      - name: Validar JavaScript Admin
        run: |
          node --check admin-v3/config.js
          node --check admin-v3/api.js
          node --check admin-v3/app.js
          node --check admin-v3/orders-integrated-v2.js
          node --check admin-v3/basket-editor.js
          node --check admin-v3/products-inline-controls-v4.js
          node --check admin-v3/product-name-management.js
      - name: Compilar Edge Functions V3
        run: |
          deno check supabase/functions/catalog-v3/index.ts
          deno check supabase/functions/admin-v3-api/index.ts
          deno check supabase/functions/admin-v3-product-names/index.ts
          deno check supabase/functions/admin-simple-v2/index.ts
