name: Testar Admin V3 e Vitrine V3

on:
  push:
    branches:
      - admin-v3-vitrine-v3-design-20260911
    paths:
      - 'vitrine-v3/**'
      - 'admin-v3/index.html'
      - 'admin-v3/styles.css'
      - 'admin-v3/config.js'
      - 'admin-v3/api.js'
      - 'admin-v3/app.js'
      - 'admin-v3/basket-editor.js'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/functions/admin-v3-api/**'
      - 'supabase/migrations/*storefront_v3*'
      - 'supabase/config.toml'
      - 'scripts/test-storefront-v3-ui.mjs'
      - 'scripts/test-storefront-v3-refinements.mjs'
      - 'scripts/test-storefront-v3-senior-ux-polish.mjs'
      - 'scripts/test-catalog-v3-contract.mjs'
      - 'scripts/test-admin-v3-contract.mjs'
      - '.github/workflows/test-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vitrine-v3/**'
      - 'admin-v3/index.html'
      - 'admin-v3/styles.css'
      - 'admin-v3/config.js'
      - 'admin-v3/api.js'
      - 'admin-v3/app.js'
      - 'admin-v3/basket-editor.js'
      - 'supabase/functions/catalog-v3/**'
      - 'supabase/functions/admin-v3-api/**'
      - 'supabase/migrations/*storefront_v3*'
      - 'supabase/config.toml'
      - 'scripts/test-storefront-v3-ui.mjs'
      - 'scripts/test-storefront-v3-refinements.mjs'
      - 'scripts/test-storefront-v3-senior-ux-polish.mjs'
      - 'scripts/test-catalog-v3-contract.mjs'
      - 'scripts/test-admin-v3-contract.mjs'
      - '.github/workflows/test-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Contrato Vitrine V3
        run: node scripts/test-storefront-v3-ui.mjs
      - name: Refinamentos Vitrine V3
        run: node scripts/test-storefront-v3-refinements.mjs
      - name: Polimento senior UX Vitrine V3
        run: node scripts/test-storefront-v3-senior-ux-polish.mjs
      - name: Contrato catálogo V3
        run: node scripts/test-catalog-v3-contract.mjs
      - name: Contrato Admin V3
        run: node scripts/test-admin-v3-contract.mjs
      - name: Validar JavaScript V3
        run: |
          node --check vitrine-v3/app.js
          node --check vitrine-v3/catalog-api.js
          node --check vitrine-v3/cache.js
          node --check vitrine-v3/state.js
          node --check vitrine-v3/products.js
          node --check vitrine-v3/baskets.js
          node --check vitrine-v3/cart.js
          node --check vitrine-v3/checkout.js
          node --check vitrine-v3/order-api.js
          node --check admin-v3/config.js
          node --check admin-v3/api.js
          node --check admin-v3/app.js
          node --check admin-v3/basket-editor.js
      - name: Compilar Edge Functions V3
        run: |
          deno check supabase/functions/catalog-v3/index.ts
          deno check supabase/functions/admin-v3-api/index.ts
