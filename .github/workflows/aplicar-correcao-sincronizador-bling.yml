name: Aplicar correção segura do sincronizador Bling

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-sincronizar-bling-v2-baseline.mjs"
      - ".github/workflows/aplicar-correcao-sincronizador-bling.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aplicar-correcao-sincronizador-bling
  cancel-in-progress: true

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Aplicar baseline e duplicidades
        run: node scripts/patch-sincronizar-bling-v2-baseline.mjs
      - name: Validar sintaxe
        run: node --check scripts/sincronizar-bling-v2.mjs
      - name: Confirmar proteções
        run: |
          grep -q "SYNC_SCHEMA_VERSION = 2" scripts/sincronizar-bling-v2.mjs
          grep -q "duplicateResolved" scripts/sincronizar-bling-v2.mjs
          grep -q "duplicateLinks" scripts/sincronizar-bling-v2.mjs
          grep -q "legacyEntry" scripts/sincronizar-bling-v2.mjs
          grep -q "outrosBlingIds" scripts/sincronizar-bling-v2.mjs
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sincronizar-bling-v2.mjs
          if git diff --cached --quiet; then
            echo "Correção já aplicada."
            exit 0
          fi
          git commit -m "Conclui baseline e duplicidades seguras no Bling"
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((tentativa * 2))
          done
          exit 1
