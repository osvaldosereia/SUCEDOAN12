name: Finalizar V13 e ressincronizar teste

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalizar-v13-e-ressincronizar-teste-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ajustar produto temporário e mensagens V13
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('loja-integrada/personalizar/app-v13.js')
          s=app.read_text(encoding='utf-8')
          s=s.replace("const BUILD = '20260901-loja-integrada-personalizador-v5-horizontal-2-crops';", "const BUILD = '20260901-loja-integrada-personalizador-v5.1-horizontal-2-crops';")
          s=s.replace("categorias: text(li.categoria_uri) ? [text(li.categoria_uri)] : [],", "categorias: [],")
          s=s.replace("marca: text(li.marca_uri) || null,", "marca: null,")
          app.write_text(s,encoding='utf-8')

          index=Path('loja-integrada/personalizar/index.html')
          h=index.read_text(encoding='utf-8').replace('./app-v13.js?v=20260901-1','./app-v13.js?v=20260901-2')
          index.write_text(h,encoding='utf-8')

          sync=Path('scripts/sincronizar-loja-integrada.mjs')
          w=sync.read_text(encoding='utf-8').replace("missing.push('5 imagens da vitrine')", "missing.push('2 recortes da vitrine')")
          sync.write_text(w,encoding='utf-8')
          PY
      - name: Validar V13
        run: |
          node --check loja-integrada/personalizar/app-v13.js
          node --check scripts/sincronizar-loja-integrada.mjs
          grep -q "action: 'loja_integrada_create_personalized_product'\|action:'loja_integrada_create_personalized_product'" loja-integrada/personalizar/app-v13.js
          grep -q "categorias: \[\]" loja-integrada/personalizar/app-v13.js
          grep -q "marca: null" loja-integrada/personalizar/app-v13.js
          grep -q "2 recortes da vitrine" scripts/sincronizar-loja-integrada.mjs
      - name: Ressincronizar caneca de teste na Loja Integrada
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: mug-1788189915488-38vzvo
          FORCE: 'true'
          LIMIT: '1'
        run: node scripts/sincronizar-loja-integrada.mjs
      - name: Publicar ajustes
        run: |
          rm -f .github/workflows/finalizar-v13-e-ressincronizar-teste-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loja-integrada/personalizar/app-v13.js loja-integrada/personalizar/index.html scripts/sincronizar-loja-integrada.mjs .github/workflows/finalizar-v13-e-ressincronizar-teste-once.yml
          git commit -m "Finaliza V13 e publica personalizador aberto no produto de teste"
          git pull --rebase origin main
          git push origin main
