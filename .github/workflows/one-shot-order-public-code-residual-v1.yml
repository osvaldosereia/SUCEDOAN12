name: One-shot order public code residual v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-order-public-code-residual-v1.yml'
      - 'scripts/patch-order-public-code-residual-v1.py'
      - 'scripts/patch-order-separation-notify-template-gate-v1.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/order-public-code-and-separation-whatsapp-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-public-code-and-separation-whatsapp-v1
          fetch-depth: 1
      - name: Apply public-code residual patch
        run: python3 scripts/patch-order-public-code-residual-v1.py
      - name: Apply template approval gate
        run: python3 scripts/patch-order-separation-notify-template-gate-v1.py
      - name: Contract tests
        run: |
          node scripts/test-order-customer-notifications-v1.mjs
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node scripts/test-admin-orders-clean-flow-v3.mjs
          git diff --check
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-order-public-code-residual-v1.yml
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/order-separation-notify-v1/index.ts .github/workflows/one-shot-order-public-code-residual-v1.yml
          git commit -m 'fix(orders): fechar codigo publico e gate dos templates'
          git push origin HEAD:feat/order-public-code-and-separation-whatsapp-v1
