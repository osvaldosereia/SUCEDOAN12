name: Temporary orders v3 dead cleanup

on:
  push:
    branches: [feat/orders-clean-flow-v3-20261004]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete order WhatsApp UI block
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('vitrine/admin/index.html')
          s=p.read_text()
          start='  function currentOrderWhatsappShareData(){'
          end='  async function openOrder(id){'
          a=s.find(start); b=s.find(end,a)
          if a<0 or b<0:
            raise SystemExit('legacy order WhatsApp block markers not found')
          s=s[:a]+s[b:]
          for symbol in ['COMPANY_WHATSAPP_E164','ORDER_WHATSAPP_4599_E164']:
            if s.count(symbol)==1:
              s=re.sub(r'^  const '+symbol+r'=.*\n','',s,flags=re.M)
          p.write_text(s)
          for legacy in ['currentOrderWhatsappShareData','currentOrderCompanyWhatsappMessage','openNativeWhatsapp','openCurrentOrderCompanyWhatsapp','openCurrentOrder4599Whatsapp','currentOrderCustomerWhatsappMessage','openCurrentOrderCustomerWhatsapp','currentOrderRegistrationUrl','openCurrentOrderRegistrationWhatsapp','copyCurrentOrderRegistrationLink']:
            if legacy in s:
              raise SystemExit('legacy order WhatsApp symbol remains: '+legacy)
          PY
      - name: Verify clean order UI
        run: |
          node scripts/test-admin-orders-clean-flow-v3.mjs
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{const p=`/tmp/admin-${i}.js`;fs.writeFileSync(p,src);cp.execFileSync(process.execPath,['--check',p],{stdio:'inherit'})});
          NODE
          git diff --check
      - name: Commit cleanup
        run: |
          if ! git diff --quiet; then
            git config user.name 'OSSJU'
            git config user.email 'Junior.sereia@hotmail.com'
            git add vitrine/admin/index.html
            git commit -m 'refactor: remove dead order whatsapp ui handlers'
            git push origin HEAD:feat/orders-clean-flow-v3-20261004
          fi
