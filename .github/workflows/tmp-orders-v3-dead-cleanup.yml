name: Temporary orders v3 delivery sync

on:
  push:
    branches: [feat/orders-clean-flow-v3-20261004]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply delivery v3 Bling completion patch
        run: node scripts/patch-orders-v3-delivery-bling.mjs
      - name: Verify delivery and order flow
        run: |
          node scripts/test-admin-orders-clean-flow-v3.mjs
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          git diff --check
      - name: Commit backend patch
        run: |
          if ! git diff --quiet; then
            git config user.name 'OSSJU'
            git config user.email 'Junior.sereia@hotmail.com'
            git add supabase/functions/admin-products-live-v1/index.ts
            git commit -m 'fix: preserve Bling completion after delivery v3'
            git push origin HEAD:feat/orders-clean-flow-v3-20261004
          fi
