name: Apply basket commercial follow-up
on:
  push:
    branches: [codex/basket-lot-commercial-fields]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/basket-lot-commercial-fields
      - run: python scripts/patch-basket-lot-commercial-followup.py
      - name: Commit patched sources
        run: |
          if git diff --quiet -- supabase/functions/admin-products-live-v1/index.ts supabase/functions/storefront-v2/index.ts; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-products-live-v1/index.ts supabase/functions/storefront-v2/index.ts
          git commit -m "fix: preserve basket lot commercial fields"
          git push origin HEAD:codex/basket-lot-commercial-fields
