name: Orders R02 - isolated synthetic homologation
on:
  push:
    branches:
      - 'agent/orders-r2-*'
    paths:
      - 'scripts/sql/orders-r2-*.sql'
      - 'scripts/sql/orders-r2-r3-*.sql'
      - 'scripts/sql/orders-security-*.sql'
      - 'scripts/sql/orders-r2-canonical-bling-stock-*.sql'
      - 'supabase/sql/orders-r2-checkout-minimum-hardening-review-v1.sql'
      - 'supabase/sql/orders-r2-basket-independent-groups-review-v1.sql'
      - 'supabase/sql/orders-r2-r3-checkout-public-number-readback-review-v1.sql'
      - 'supabase/sql/orders-security-public-table-privileges-review-v1.sql'
      - 'scripts/test-orders-r2-transport-offline.mjs'
      - 'supabase/functions/_shared/order-auto-fiscal-policy-v1.mjs'
      - '.github/workflows/orders-r2-isolated-hml-ci.yml'
  pull_request:
    branches:
      - main
      - 'agent/orders-r1-*'
      - 'agent/orders-r2-*'
    paths:
      - 'scripts/sql/orders-r2-hml-*.sql'
      - 'scripts/sql/orders-r2-canonical-*.sql'
      - 'scripts/sql/orders-security-*.sql'
      - 'supabase/sql/orders-security-public-table-privileges-review-v1.sql'
      - 'scripts/test-orders-r2-transport-offline.mjs'
      - 'supabase/functions/_shared/order-auto-fiscal-policy-v1.mjs'
      - '.github/workflows/orders-r2-isolated-hml-ci.yml'
permissions:
  contents: read
jobs:
  offline-postgres:
    name: Ephemeral Postgres 17 + fake providers (NO NETWORK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: synthetic_orders_r2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d synthetic_orders_r2"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: synthetic_orders_r2
      PGUSER: postgres
      PGPASSWORD: postgres
      HOMOLOGATION_TRANSPORT: disabled
      BLING_LIVE_ENABLED: 'false'
      META_LIVE_ENABLED: 'false'
      FISCAL_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      # Pin the existing R03 implementation for an integration test, without
      # merging or rewriting its separate development branch.
      - uses: actions/checkout@v4
        with:
          ref: e7408ad5cbcd6ae8d5ca16e90f2e287a7d61af4c
          path: r03-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert offline mode
        run: |
          set -euo pipefail
          test "$HOMOLOGATION_TRANSPORT" = disabled
          test "$BLING_LIVE_ENABLED" = false
          test "$META_LIVE_ENABLED" = false
          test "$FISCAL_LIVE_ENABLED" = false
      - name: Install SQL client if absent
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client >/dev/null
          fi
      - name: Build isolated contract schema (no Supabase connection)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-hml-schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-hml-assertions.sql
      - name: Two concurrent workers must claim just one pending fiscal intent
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "select coalesce(r2_hml.claim_fiscal_job()::text,'NONE');" > /tmp/r2-worker-a.txt &
          A=$!
          psql -v ON_ERROR_STOP=1 -Atc "select coalesce(r2_hml.claim_fiscal_job()::text,'NONE');" > /tmp/r2-worker-b.txt &
          B=$!
          wait "$A"
          wait "$B"
          FIRST=$(cat /tmp/r2-worker-a.txt)
          SECOND=$(cat /tmp/r2-worker-b.txt)
          if [ "$FIRST" = NONE ]; then
            [[ "$SECOND" =~ ^[0-9]+$ ]]
          else
            [[ "$FIRST" =~ ^[0-9]+$ ]]
            test "$SECOND" = NONE
          fi
          test "$(psql -Atc "select count(*) from r2_hml.dispatch_fiscal_jobs where status='processing'")" = 1
          test "$(psql -Atc "select count(*) from r2_hml.dispatch_fiscal_jobs where status='reconcile' and generation_uncertain")" = 1
          echo "PASS: worker claim mutually exclusive; uncertain invoice not resent"
      - name: Check pure policy and simulated provider responses
        run: |
          set -euo pipefail
          node --check scripts/test-orders-r2-transport-offline.mjs
          node --test scripts/test-orders-r2-transport-offline.mjs scripts/test-order-auto-fiscal-policy-v1.mjs
      - name: SQL schema only contains synthetic records
        run: |
          set -euo pipefail
          test "$(psql -Atc "select count(*) from r2_hml.orders")" = 2
          test "$(psql -Atc "select count(*) from r2_hml.dispatch_fiscal_jobs")" = 2
          psql -Atc "select 'PASS: disposable offline test DB only' "
      - name: Execute canonical checkout and reservation RPCs with synthetic dependencies
        run: |
          set -euo pipefail
          # These SQL function bodies were exported read-only from canonical Supabase.
          # Their dependencies are explicitly synthetic; never connect to production.
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-canonical-dependencies-fixture.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-canonical-checkout-reservation.sql
          psql -v ON_ERROR_STOP=1 -f scripts/sql/orders-r2-canonical-runtime-assertions.sql
      - name: Two actual reservation RPC calls cannot oversell the same stock
        run: |
          set -euo pipefail
          SQL="select public.create_vitrine_cart_order_v3('SYNTHETIC-ONLY','PIX','[{\"qty\":6}]'::jsonb,'{}'::jsonb,'{}'::jsonb)->>'order_id';"
          psql -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/r2-canonical-a.out 2> /tmp/r2-canonical-a.err &
          A=$!
          psql -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/r2-canonical-b.out 2> /tmp/r2-canonical-b.err &
          B=$!
          SUCCESS=0
          if wait "$A"; then SUCCESS=$((SUCCESS+1)); else grep -q 'insufficient_stock' /tmp/r2-canonical-a.err; fi
          if wait "$B"; then SUCCESS=$((SUCCESS+1)); else grep -q 'insufficient_stock' /tmp/r2-canonical-b.err; fi
          test "$SUCCESS" = 1
          test "$(psql -Atc 'select sum(quantity)::integer from public.vitrine_stock_reservations where status='\''reserved'\''')" = 8
          test "$(psql -Atc 'select stock::integer from public.products where id='\''00000000-0000-4000-8000-0000000000aa'\''')" = 10
          test "$(psql -Atc 'select count(*) from public.orders')" = 3
          echo 'PASS: real checkout and reservation functions serialized stock claims with rollback'
      - name: Run actual production separation RPCs in a second disposable database
        run: |
          set -euo pipefail
          createdb synthetic_separation_r2
          PGDATABASE=synthetic_separation_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-separation-fixture.sql
          PGDATABASE=synthetic_separation_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-init-function.sql
          PGDATABASE=synthetic_separation_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-separation-functions.sql
          PGDATABASE=synthetic_separation_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-separation-assertions.sql
          test "$(PGDATABASE=synthetic_separation_r2 psql -Atc \
            "select count(*) from public.order_separation_completions_v1 where phase='completed'")" = 1
          echo 'PASS: canonical separation functions, missing item adjustment, stock reconciliation and phase persistence'
      - name: Real R02 basket-aware initializer regression (no stub)
        run: |
          set -euo pipefail
          PGDATABASE=synthetic_separation_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-init-assertions.sql
          echo 'PASS: canonical init, preserve separated quantities and exclude basket parents'
      - name: Harden unsafe Postgres grants and defaults in a third synthetic DB
        run: |
          set -euo pipefail
          createdb synthetic_security_r2
          PGDATABASE=synthetic_security_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-security-hml-setup.sql
          PGDATABASE=synthetic_security_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-security-public-table-privileges-review-v1.sql
          PGDATABASE=synthetic_security_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-security-hml-assertions.sql
          # Idempotent replay of safe ACL restrictions
          PGDATABASE=synthetic_security_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-security-public-table-privileges-review-v1.sql

      - name: Execute actual checkout base + real reservation RPC (fourth disposable DB)
        run: |
          set -euo pipefail
          createdb synthetic_checkout_full_r2
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-checkout-base-fixture.sql
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-base.sql
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-reservation.sql
          # Baseline reproduction is rolled back; no persistent unsafe order.
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-checkout-base-unsafe-baseline.sql
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-checkout-minimum-hardening-review-v1.sql
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-checkout-base-assertions.sql
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-checkout-minimum-hardening-review-v1.sql
          test "$(PGDATABASE=synthetic_checkout_full_r2 psql -Atc \
            "select count(*) from public.orders")" = 2
          echo 'PASS: real checkout base, minimum R$75 cannot be bypassed by customer snapshot, no orphan reservations'
      - name: Race test real v3_base with two concurrent buyers (NO oversell)
        run: |
          set -euo pipefail
          # ARROZ has 10 units; a previous real checkout reserved 2.
          # Two separate sessions each request 6 units: exactly one wins.
          SQL="select public.create_vitrine_cart_order_v3(null,'PIX','[{\"type\":\"product\",\"id\":\"00000000-0000-4000-8000-0000000000aa\",\"qty\":6}]'::jsonb)->>'order_id';"
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 -Atc "$SQL" \
            > /tmp/r2-real-checkout-a.txt 2>/tmp/r2-real-checkout-a.err &
          A=$!
          PGDATABASE=synthetic_checkout_full_r2 psql -v ON_ERROR_STOP=1 -Atc "$SQL" \
            > /tmp/r2-real-checkout-b.txt 2>/tmp/r2-real-checkout-b.err &
          B=$!
          SUCCEEDED=0
          if wait "$A"; then SUCCEEDED=$((SUCCEEDED+1)); else grep -q 'insufficient_stock' /tmp/r2-real-checkout-a.err; fi
          if wait "$B"; then SUCCEEDED=$((SUCCEEDED+1)); else grep -q 'insufficient_stock' /tmp/r2-real-checkout-b.err; fi
          test "$SUCCEEDED" = 1
          test "$(PGDATABASE=synthetic_checkout_full_r2 psql -Atc "select sum(quantity)::int from public.vitrine_stock_reservations where product_id='00000000-0000-4000-8000-0000000000aa' and status='reserved'")" = 8
          test "$(PGDATABASE=synthetic_checkout_full_r2 psql -Atc "select count(*) from public.orders")" = 3
          test "$(PGDATABASE=synthetic_checkout_full_r2 psql -Atc "select count(*) from public.vitrine_stock_reservations")" = 3
          echo 'PASS: actual 40KB checkout base serialized competing buyers, one committed, one rolled back'
      - name: Real split-kit and mold checkout (fifth disposable DB)
        run: |
          set -euo pipefail
          createdb synthetic_baskets_r2
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-checkout-base-fixture.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-baskets-kit-mold-fixture.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-basket-helpers.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-base.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-reservation.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-checkout-minimum-hardening-review-v1.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-baskets-bug-baseline.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-basket-independent-groups-review-v1.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-baskets-kit-mold-assertions.sql
          PGDATABASE=synthetic_baskets_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-basket-independent-groups-review-v1.sql
          echo 'PASS: real basket checkout in split kits, one group unchanged, legacy stock, selectable mold hidden value'
      # Removed the older race against a DB already mutated by basket
      # functional assertions. The NEXT test runs the same lot locking
      # invariants on a NEW isolated database, without fixture-state coupling.
      - name: Two simultaneous buyers cannot overallocate linked food/hygiene kits
        run: |
          set -euo pipefail
          # Fresh sixth isolated database: avoid coupling to prior basket cases.
          createdb synthetic_basket_race_r2
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-checkout-base-fixture.sql
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-baskets-kit-mold-fixture.sql
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-basket-helpers.sql
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-base.sql
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-reservation.sql
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-checkout-minimum-hardening-review-v1.sql
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-basket-independent-groups-review-v1.sql
          # Explicitly model 3 food and 3 hygiene kits; each buyer requests 2.
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 -c \
            "update public.basket_stock_lots set quantity_available=3 where id in ('00000000-0000-4000-8000-0000000000f1','00000000-0000-4000-8000-0000000000f2')"
          test "$(PGDATABASE=synthetic_basket_race_r2 psql -Atc "select count(*) from public.basket_lot_public_availability_v1 where lot_id in ('00000000-0000-4000-8000-0000000000f1','00000000-0000-4000-8000-0000000000f2') and public_available=3 and availability_reason='available'")" = 2

          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 -Atf \
            scripts/sql/orders-r2-baskets-concurrent-buy.sql \
            >/tmp/r2-basket-buyer-a.txt 2>/tmp/r2-basket-buyer-a.err &
          A=$!
          PGDATABASE=synthetic_basket_race_r2 psql -v ON_ERROR_STOP=1 -Atf \
            scripts/sql/orders-r2-baskets-concurrent-buy.sql \
            >/tmp/r2-basket-buyer-b.txt 2>/tmp/r2-basket-buyer-b.err &
          B=$!
          SUCCEEDED=0
          if wait "$A"; then SUCCEEDED=$((SUCCEEDED+1)); else grep -E -q 'basket_kit_lot_insufficient|basket_hygiene_lot_invalid' /tmp/r2-basket-buyer-a.err; fi
          if wait "$B"; then SUCCEEDED=$((SUCCEEDED+1)); else grep -E -q 'basket_kit_lot_insufficient|basket_hygiene_lot_invalid' /tmp/r2-basket-buyer-b.err; fi
          test "$SUCCEEDED" = 1
          test "$(PGDATABASE=synthetic_basket_race_r2 psql -Atc "select quantity_available from public.basket_stock_lots where id='00000000-0000-4000-8000-0000000000f1'")" = 1
          test "$(PGDATABASE=synthetic_basket_race_r2 psql -Atc "select quantity_available from public.basket_stock_lots where id='00000000-0000-4000-8000-0000000000f2'")" = 1
          test "$(PGDATABASE=synthetic_basket_race_r2 psql -Atc "select count(*) from public.orders")" = 1
          test "$(PGDATABASE=synthetic_basket_race_r2 psql -Atc "select count(*) from public.vitrine_stock_reservations where product_id in ('00000000-0000-4000-8000-0000000000e1','00000000-0000-4000-8000-0000000000e2')")" = 0
          echo 'PASS: linked food/hygiene kits allocated to exactly one buyer without loose stock duplication'
      - name: Integrate actual R03 weekly-number migration with R02 checkout (seventh DB)
        run: |
          set -euo pipefail
          createdb synthetic_r02_r03_checkout
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-checkout-base-fixture.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-baskets-kit-mold-fixture.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-basket-helpers.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-base.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-canonical-checkout-reservation.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-checkout-minimum-hardening-review-v1.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-basket-independent-groups-review-v1.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-r3-integration-fixture.sql
          # This is the EXACT R03 migration from the pinned checkout above.
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f r03-source/supabase/migrations/20261008032000_order_public_identity_at_creation_v1.sql
          # Before fixing, demonstrate legacy checkout returns DA-* while
          # R03 has assigned a different weekly identifier in orders.
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-r3-wrong-number-baseline.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-r3-checkout-public-number-readback-review-v1.sql
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/orders-r2-r3-integration-assertions.sql
          # Replaying the reviewed patch must not rewrite function again.
          PGDATABASE=synthetic_r02_r03_checkout psql -v ON_ERROR_STOP=1 \
            -f supabase/sql/orders-r2-r3-checkout-public-number-readback-review-v1.sql
          echo 'PASS: weekly number R03 coexists with actual R02 v3 checkout, baskets, mold, reservation and snapshot'
      - name: Concurrent R02 checkouts allocate ONLY committed R03 weekly numbers
        run: |
          set -euo pipefail
          # Two real checkout sessions try purchasing all 2 units of the
          # same fictitious product, while the R03 weekly trigger allocates
          # customer numbers inside each checkout transaction.
          DB=synthetic_r02_r03_checkout
          BEFORE="$(PGDATABASE=$DB psql -Atc \
            "select last_seq from public.order_public_weekly_counters_v1 where week_start=(now() at time zone 'America/Cuiaba')::date-(extract(isodow from (now() at time zone 'America/Cuiaba')::date)::integer-1)")"
          test "$BEFORE" = 4
          SQL="select public.create_vitrine_cart_order_v3(null,'PIX','[{\"type\":\"product\",\"id\":\"00000000-0000-4000-8000-0000000000bb\",\"qty\":2}]'::jsonb)->>'order_id';"
          PGDATABASE=$DB psql -v ON_ERROR_STOP=1 -Atc "$SQL" \
            >/tmp/r02-r03-a.txt 2>/tmp/r02-r03-a.err &
          A=$!
          PGDATABASE=$DB psql -v ON_ERROR_STOP=1 -Atc "$SQL" \
            >/tmp/r02-r03-b.txt 2>/tmp/r02-r03-b.err &
          B=$!
          SUCCEEDED=0
          if wait "$A"; then SUCCEEDED=$((SUCCEEDED+1)); else grep -q insufficient_stock /tmp/r02-r03-a.err; fi
          if wait "$B"; then SUCCEEDED=$((SUCCEEDED+1)); else grep -q insufficient_stock /tmp/r02-r03-b.err; fi
          echo "R02+R03 concurrency: successful buyers=$SUCCEEDED"
          echo "R02+R03 A output:"; cat /tmp/r02-r03-a.txt
          echo "R02+R03 B output:"; cat /tmp/r02-r03-b.txt
          echo "R02+R03 A error:"; cat /tmp/r02-r03-a.err
          echo "R02+R03 B error:"; cat /tmp/r02-r03-b.err
          PGDATABASE=$DB psql -v ON_ERROR_STOP=1 -Atc "
            select 'weekly_counter',coalesce(max(last_seq),0)::text from public.order_public_weekly_counters_v1
            union all select 'orders',count(*)::text from public.orders
            union all select 'vitrine_orders',count(*)::text from public.orders where source='vitrine'
            union all select 'numbers',count(distinct order_number)::text from public.orders where source='vitrine'
            union all select 'matching_snapshots',count(*)::text from public.orders o
                 join public.order_public_snapshots_v1 sn on sn.order_id=o.id
                 where o.source='vitrine' and o.order_number=sn.public_code
            union all select 'reserved_bb',coalesce(sum(quantity),0)::text from public.vitrine_stock_reservations
                 where product_id='00000000-0000-4000-8000-0000000000bb' and status='reserved';"
          test "$SUCCEEDED" = 1
          test "$(PGDATABASE=$DB psql -Atc \
            "select last_seq from public.order_public_weekly_counters_v1 where week_start=(now() at time zone 'America/Cuiaba')::date-(extract(isodow from (now() at time zone 'America/Cuiaba')::date)::integer-1)")" = 5
          test "$(PGDATABASE=$DB psql -Atc \
            "select count(*) from public.orders")" = 6
          test "$(PGDATABASE=$DB psql -Atc \
            "select count(distinct order_number) from public.orders where source='vitrine'")" = 5
          test "$(PGDATABASE=$DB psql -Atc \
            "select count(*) from public.orders o join public.order_public_snapshots_v1 s on s.order_id=o.id where o.source='vitrine' and o.order_number=s.public_code")" = 5
          test "$(PGDATABASE=$DB psql -Atc \
