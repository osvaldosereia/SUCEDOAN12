name: One-shot WhatsApp order routing baskets

on:
  push:
    branches:
      - fix/whatsapp-order-routing-baskets

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-order-routing-baskets
          fetch-depth: 0
      - name: Apply focused patch
        run: python scripts/patch-whatsapp-order-routing-baskets.py
      - name: GREEN contract
        run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          p=Path('/tmp/admin-inline.js'); p.write_text('\n'.join(blocks),encoding='utf-8')
          subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: TypeScript syntax sanity
        run: |
          npx --yes esbuild supabase/functions/admin-orders-v1/index.ts --bundle --platform=neutral --format=esm --external:jsr:* --external:npm:* --outfile=/tmp/admin-orders.js
      - name: Diff check
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/admin-orders-v1/index.ts
          git commit -m 'fix(whatsapp): separate admin handoff and checkout retry'
          git push
