name: TEMP Pedidos V4 detail fix

# Última execução: valida V4 + regressão V3 antes do commit canônico.
on:
  push:
    branches: [feat/orders-fiscal-flow-v4-20261004]
    paths:
      - 'scripts/_apply_orders_v4_detail_fix.mjs'
      - '.github/workflows/_temp-orders-v4-detail-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix canonical opened-order detail
        run: node scripts/_apply_orders_v4_detail_fix.mjs
      - name: Verify V4 and V3 contracts
        run: |
          git diff --check
          node scripts/test-admin-orders-fiscal-flow-v4.mjs
          node scripts/test-admin-orders-clean-flow-v3.mjs
      - name: Commit canonical detail fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          git commit -m 'fix: alinhar pedido aberto ao fluxo fiscal V4'
          git push
