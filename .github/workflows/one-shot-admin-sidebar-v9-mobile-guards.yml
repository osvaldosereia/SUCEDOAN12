name: One-shot admin sidebar v9 mobile guards
on:
  push:
    branches: [fix/admin-sidebar-architecture-v9-20261001]
    paths: ['.github/workflows/one-shot-admin-sidebar-v9-mobile-guards.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-sidebar-architecture-v9-20261001
      - name: Restore mobile global guards in v9 ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vitrine/admin/index.html')
          s=p.read_text(encoding='utf-8')
          anchor='      #content.wrap{width:100%;max-width:100%;margin:0;padding:12px 10px 80px}\n'
          guard='''      #content.wrap{width:100%;max-width:100%;margin:0;padding:12px 10px 80px}\n\n      /* MOBILE_GLOBAL_GUARDS_V9 · proteção de largura das telas, independente da navegação */\n      #app,#content,main,.wrap,.panel,.page-head,.toolbar,.history-title,.dispatch-head,\n      .product-stock-breakdown,.basket-admin-card,.basket-composer,.purchase-doc-expanded,\n      .quote-admin-shell,.customer-profile-head,.history-detail-head{min-width:0;max-width:100%}\n      #content img,.panel img{max-width:100%;height:auto}\n      .page-head>*,.toolbar>*,.history-title>*,.dispatch-head>*{min-width:0}\n      input,select,textarea{max-width:100%}\n      button,a{max-width:100%}\n'''
          if s.count(anchor)!=1:
              raise SystemExit(f'expected one mobile content anchor, found {s.count(anchor)}')
          s=s.replace(anchor,guard,1)
          p.write_text(s,encoding='utf-8')
          print('MOBILE_GLOBAL_GUARDS_V9_APPLIED')
          PY
      - name: Verify contract
        run: python3 scripts/test-admin-sidebar-v9.py
      - name: Verify JS and diff
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean).forEach((src,i)=>{new Function(src)});
          console.log('ADMIN_SIDEBAR_V9_JS_OK');
          NODE
          git diff --check
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-admin-sidebar-v9-mobile-guards.yml
          git config user.name 'OSSJU'
          git config user.email 'Junior.sereia@hotmail.com'
          git add vitrine/admin/index.html scripts/test-admin-sidebar-v9.py .github/workflows/one-shot-admin-sidebar-v9-mobile-guards.yml
          git commit -m 'fix(admin): preserva guards mobile na sidebar v9'
          git push origin HEAD:fix/admin-sidebar-architecture-v9-20261001
