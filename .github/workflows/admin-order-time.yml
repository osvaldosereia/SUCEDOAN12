name: Admin order time
on:
  pull_request:
    paths:
      - 'vitrine/admin/index.html'
      - 'vitrine/admin/orders/time.js'
      - 'scripts/test-admin-order-time.mjs'
      - '.github/workflows/admin-order-time.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-order-time.mjs
      - run: node scripts/test-admin-order-read-model.mjs
      - run: node scripts/test-admin-today-cards.mjs
      - run: node scripts/test-admin-controller-contracts.mjs
      - run: node scripts/test-admin-module-load-contract.mjs
      - run: node scripts/test-admin-orders-clean-flow-v3.mjs
      - run: node scripts/test-admin-orders-fiscal-flow-v4.mjs
      - run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
