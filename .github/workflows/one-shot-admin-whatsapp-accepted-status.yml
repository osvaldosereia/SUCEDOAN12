name: One-shot admin WhatsApp accepted status

on:
  push:
    branches:
      - fix/admin-whatsapp-accepted-status-20261002

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-whatsapp-accepted-status-20261002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: python scripts/patch-admin-whatsapp-accepted-status.py
      - name: Contract
        run: node scripts/test-admin-order-whatsapp-ui-integration.mjs
      - name: Inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`vitrine/admin/index.html inline script ${i+1}: ${e.message}`)}});
          console.log(`inline syntax OK (${scripts.length} script blocks)`);
          NODE
      - name: Diff check
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
          else
            git commit -m 'fix(admin): show real WhatsApp delivery state'
            git push
          fi
