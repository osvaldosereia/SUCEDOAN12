name: Apply basket mold storefront R5
permissions:
  contents: write
on:
  push:
    branches: [feat/basket-molds-storefront-r5]
    paths:
      - 'scripts/apply-basket-mold-storefront-r5.py'
      - '.github/workflows/basket-mold-storefront-r5-apply.yml'
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/basket-molds-storefront-r5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-basket-mold-storefront-r5.py
      - name: Commit guarded transformation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/storefront-v2/index.ts vitrine/basket-carousel.js index.html vitrine/index.html
          git commit -m "feat: wire mold compositions into storefront [r5-applied]"
          git push origin HEAD:feat/basket-molds-storefront-r5
