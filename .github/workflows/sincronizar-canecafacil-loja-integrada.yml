name: CanecaFácil · sincronizar Loja Integrada

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Chave Firebase de uma caneca específica (opcional)'
        required: false
        default: ''
      force:
        description: 'Forçar reprocessamento mesmo se já houve erro'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Máximo de produtos nesta execução'
        required: false
        default: '100'
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sincronizar-loja-integrada.mjs'
      - '.github/workflows/sincronizar-canecafacil-loja-integrada.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-loja-integrada
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar credenciais protegidas da Loja Integrada
        env:
          LI_API_KEY: ${{ secrets.LOJA_INTEGRADA_API_KEY }}
          LI_APP_KEY: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_API_KEY" ]; then
            echo "ERRO: configure o secret LOJA_INTEGRADA_API_KEY."
            exit 1
          fi
          if [ -z "$LI_APP_KEY" ]; then
            echo "ERRO: configure o secret LOJA_INTEGRADA_APP_KEY."
            exit 1
          fi
          API_LEN=${#LI_API_KEY}
          APP_LEN=${#LI_APP_KEY}
          if printf '%s' "$LI_API_KEY" | grep -Eq '^[A-Za-z0-9]{20}$'; then API_FMT=ok; else API_FMT=fora_do_padrao; fi
          echo "Diagnóstico seguro: chave_api comprimento=${API_LEN}, formato=${API_FMT}; personal_token comprimento=${APP_LEN}."
          printf 'LOJA_INTEGRADA_AUTHORIZATION=chave_api %s aplicacao %s\n' "$LI_API_KEY" "$LI_APP_KEY" >> "$GITHUB_ENV"
      - name: Inspecionar estrutura do Personal Token sem revelar conteúdo
        env:
          LI_APP_KEY: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          node - <<'NODE'
          const t = process.env.LI_APP_KEY || '';
          const parts = t.split('.');
          const result = {
            length: t.length,
            dot_count: (t.match(/\./g) || []).length,
            dash_count: (t.match(/-/g) || []).length,
            underscore_count: (t.match(/_/g) || []).length,
            jwt_shape: parts.length === 3 && parts.every(p => /^[A-Za-z0-9_-]+$/.test(p)),
          };
          if (result.jwt_shape) {
            try {
              const decode = p => JSON.parse(Buffer.from(p.replace(/-/g,'+').replace(/_/g,'/'), 'base64').toString('utf8'));
              result.jwt_header_keys = Object.keys(decode(parts[0])).sort();
              result.jwt_payload_keys = Object.keys(decode(parts[1])).sort();
            } catch { result.jwt_decode = 'falhou'; }
          }
          console.log('TOKEN_STRUCTURE', JSON.stringify(result));
          NODE
      - name: Detectar formato aceito pela API (somente leitura)
        env:
          LI_API_KEY: ${{ secrets.LOJA_INTEGRADA_API_KEY }}
          LI_APP_KEY: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          URL='https://api.awsli.com.br/v1/categoria?limit=1&offset=0'
          S1=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: chave_api ${LI_API_KEY} aplicacao ${LI_APP_KEY}" "$URL" || true)
          S2=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' -H "chave_api: ${LI_API_KEY}" -H "aplicacao: ${LI_APP_KEY}" "$URL" || true)
          S3=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' -H "chave_api: ${LI_API_KEY}" -H "Authorization: ${LI_APP_KEY}" "$URL" || true)
          S4=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' -H "chave_api: ${LI_API_KEY}" -H "Authorization: Bearer ${LI_APP_KEY}" "$URL" || true)
          S5=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: ${LI_APP_KEY}" "$URL" || true)
          S6=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer ${LI_APP_KEY}" "$URL" || true)
          echo "AUTH_PROBE combined=${S1} separate=${S2} api_plus_direct=${S3} api_plus_bearer=${S4} token_direct=${S5} token_bearer=${S6}"
      - name: Processar fila Firebase → Loja Integrada
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: node scripts/sincronizar-loja-integrada.mjs
