name: CanecaFácil · sincronizar Loja Integrada (arquivado)

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Chave Firebase de uma caneca específica (opcional)'
        required: false
        default: ''
      force:
        description: 'Forçar reprocessamento mesmo se já houve erro'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Máximo de produtos nesta execução'
        required: false
        default: '100'

permissions:
  contents: read

concurrency:
  group: canecafacil-loja-integrada-arquivado
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aviso
        run: echo 'Fluxo arquivado. A sincronização ativa da Loja Integrada voltou para o Make. Use este workflow apenas para diagnóstico manual.'
      - name: Validar credenciais protegidas da Loja Integrada
        env:
          LI_API_KEY: ${{ secrets.LOJA_INTEGRADA_API_KEY }}
          LI_APP_KEY: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_API_KEY" ] || [ -z "$LI_APP_KEY" ]; then
            echo "Credenciais do fluxo GitHub não configuradas ou não utilizadas."
            exit 0
          fi
          printf 'LOJA_INTEGRADA_AUTHORIZATION=chave_api %s aplicacao %s\n' "$LI_API_KEY" "$LI_APP_KEY" >> "$GITHUB_ENV"
      - name: Processar manualmente, se solicitado
        if: ${{ env.LOJA_INTEGRADA_AUTHORIZATION != '' }}
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: node scripts/sincronizar-loja-integrada.mjs
