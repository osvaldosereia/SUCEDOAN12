name: CanecaFácil · sincronizar Loja Integrada

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Chave Firebase de uma caneca específica (opcional)'
        required: false
        default: ''
      force:
        description: 'Forçar reprocessamento'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Máximo de produtos nesta execução'
        required: false
        default: '10'
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/atualizar-catalogo-loja-integrada-v1.mjs'
      - 'scripts/sincronizar-loja-integrada-v3.mjs'
      - 'scripts/sincronizar-loja-integrada-v4.mjs'
      - 'scripts/reconciliar-categorias-produtos-li-v1.mjs'
      - '.github/workflows/sincronizar-canecafacil-loja-integrada.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-loja-integrada-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar Personal Token Loja Integrada
        env:
          LI_APP_TOKEN: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_APP_TOKEN" ]; then
            echo 'ERRO: secret LOJA_INTEGRADA_APP_KEY ausente.'
            exit 1
          fi
          printf 'LOJA_INTEGRADA_AUTHORIZATION=%s\n' "$LI_APP_TOKEN" >> "$GITHUB_ENV"
          echo 'Personal Token carregado com segurança.'
      - name: Atualizar catálogo de categorias · GitHub direto
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
        run: node scripts/atualizar-catalogo-loja-integrada-v1.mjs
      - name: Sincronizar fila CanecaFácil · V4 · categoria específica + galeria oficial
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
        run: node scripts/sincronizar-loja-integrada-v4.mjs
      - name: Reconciliar categorias existentes · GitHub direto · lote seguro
        continue-on-error: true
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          CATEGORY_RECONCILE_LIMIT: '3'
          DRY_RUN: 'false'
        run: node scripts/reconciliar-categorias-produtos-li-v1.mjs
      - name: Auditar cadastros confirmados
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          VERIFY_LIMIT: '10'
          VERIFY_TTL_MINUTES: '360'
        run: node scripts/verificar-cadastros-canecafacil.mjs
