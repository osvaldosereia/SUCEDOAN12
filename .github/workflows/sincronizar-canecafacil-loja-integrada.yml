name: CanecaFácil · sincronizar Loja Integrada

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Chave Firebase de uma caneca específica (opcional)'
        required: false
        default: ''
      force:
        description: 'Forçar reprocessamento mesmo se já houve erro'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Máximo de produtos nesta execução'
        required: false
        default: '100'
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sincronizar-loja-integrada.mjs'
      - '.github/workflows/sincronizar-canecafacil-loja-integrada.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-loja-integrada
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar credenciais protegidas da Loja Integrada
        env:
          LI_API_KEY: ${{ secrets.LOJA_INTEGRADA_API_KEY }}
          LI_APP_KEY: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_API_KEY" ]; then
            echo "ERRO: configure o secret LOJA_INTEGRADA_API_KEY."
            exit 1
          fi
          if [ -z "$LI_APP_KEY" ]; then
            echo "ERRO: configure o secret LOJA_INTEGRADA_APP_KEY."
            exit 1
          fi
          printf 'LOJA_INTEGRADA_AUTHORIZATION=chave_api %s aplicacao %s\n' "$LI_API_KEY" "$LI_APP_KEY" >> "$GITHUB_ENV"
          echo "Credenciais protegidas carregadas."
      - name: Testar autenticação LI com o novo token (somente leitura)
        env:
          LI_API_KEY: ${{ secrets.LOJA_INTEGRADA_API_KEY }}
          LI_APP_KEY: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          URL='https://api.awsli.com.br/v1/categoria?limit=1&offset=0'
          STATUS=$(curl -sS -o /tmp/li-auth-body.txt -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H "Authorization: chave_api ${LI_API_KEY} aplicacao ${LI_APP_KEY}" \
            "$URL" || true)
          echo "LI_AUTH_HTTP=${STATUS}"
          if [ "$STATUS" = "200" ]; then
            echo "AUTENTICACAO_LI_OK"
          else
            MSG=$(head -c 400 /tmp/li-auth-body.txt | tr '\n' ' ')
            echo "AUTENTICACAO_LI_FALHOU HTTP=${STATUS} RESPOSTA=${MSG}"
          fi
      - name: Processar fila Firebase → Loja Integrada
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: node scripts/sincronizar-loja-integrada.mjs
