name: CanecaFácil · sincronizar Loja Integrada

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: 'Chave Firebase de uma caneca específica (opcional)'
        required: false
        default: ''
      force:
        description: 'Forçar reprocessamento mesmo se já houve erro'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Máximo de produtos nesta execução'
        required: false
        default: '100'
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sincronizar-loja-integrada.mjs'
      - '.github/workflows/sincronizar-canecafacil-loja-integrada.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-loja-integrada
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar e normalizar credencial protegida
        env:
          LI_SECRET: ${{ secrets.LOJA_INTEGRADA_AUTHORIZATION }}
        run: |
          if [ -z "$LI_SECRET" ]; then
            echo "ERRO: configure o secret LOJA_INTEGRADA_AUTHORIZATION em Settings > Secrets and variables > Actions."
            exit 1
          fi
          AUTH="$LI_SECRET"
          AUTH="${AUTH#\"}"
          AUTH="${AUTH%\"}"
          AUTH="${AUTH#\'}"
          AUTH="${AUTH%\'}"
          case "$AUTH" in
            Basic\ *|basic\ *) ;;
            *)
              if printf '%s' "$AUTH" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
                AUTH="Basic $AUTH"
              fi
              ;;
          esac
          printf 'LOJA_INTEGRADA_AUTHORIZATION=%s\n' "$AUTH" >> "$GITHUB_ENV"
          echo "Credencial carregada e normalizada com segurança."
      - name: Processar fila Firebase → Loja Integrada
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          PRODUCT_KEY: ${{ github.event.inputs.product_key || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: node scripts/sincronizar-loja-integrada.mjs
