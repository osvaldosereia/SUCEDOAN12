name: CanecaFácil · diagnóstico autenticação Loja Integrada

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/testar-auth-loja-integrada.mjs'
      - '.github/workflows/sincronizar-canecafacil-loja-integrada.yml'

permissions:
  contents: read

concurrency:
  group: canecafacil-li-auth-diagnostic
  cancel-in-progress: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar credenciais protegidas
        env:
          LI_API_KEY: ${{ secrets.LOJA_INTEGRADA_API_KEY }}
          LI_APP_KEY: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
        run: |
          if [ -z "$LI_API_KEY" ]; then echo 'ERRO: LOJA_INTEGRADA_API_KEY ausente'; exit 1; fi
          if [ -z "$LI_APP_KEY" ]; then echo 'ERRO: LOJA_INTEGRADA_APP_KEY ausente'; exit 1; fi
          printf 'LOJA_INTEGRADA_AUTHORIZATION=chave_api %s aplicacao %s\n' "$LI_API_KEY" "$LI_APP_KEY" >> "$GITHUB_ENV"
          echo 'Credenciais carregadas sem exibição dos valores.'
      - name: Testar API Loja Integrada somente leitura
        env:
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
        run: node scripts/testar-auth-loja-integrada.mjs
