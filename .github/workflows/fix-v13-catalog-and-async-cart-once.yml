name: Corrigir V13 catalogo e carrinho

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v13-catalog-and-async-cart-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar patch V13
        run: python scripts/fix-v13-catalog-async-cart-once.py
      - name: Validar sintaxe
        run: |
          node --check scripts/sincronizar-loja-integrada.mjs
          node --check loja-integrada/personalizar/app-v13.js
          grep -q "p.mockup_1" scripts/sincronizar-loja-integrada.mjs
          grep -q "waitTemporaryProduct" loja-integrada/personalizar/app-v13.js
      - name: Verificar imagens da caneca de teste
        run: |
          node - <<'NODE'
          const key='mug-1788189915488-38vzvo';
          const fb='https://cedar-chemist-310801-default-rtdb.firebaseio.com';
          const p=await (await fetch(`${fb}/produtos/${key}.json`)).json();
          console.log(JSON.stringify({mockup_1:Boolean(p?.mockup_1),mockup_2:Boolean(p?.mockup_2),recorte_esquerdo:Boolean(p?.vitrine_recorte_esquerda||p?.vitrine_recortes?.esquerda),recorte_direito:Boolean(p?.vitrine_recorte_direita||p?.vitrine_recortes?.direita)}));
          NODE
      - name: Ressincronizar caneca de teste
        env:
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          PRODUCT_KEY: mug-1788189915488-38vzvo
          FORCE: 'true'
          LIMIT: '1'
        run: node scripts/sincronizar-loja-integrada.mjs
      - name: Publicar
        run: |
          rm -f scripts/fix-v13-catalog-async-cart-once.py
          rm -f .github/workflows/fix-v13-catalog-and-async-cart-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sincronizar-loja-integrada.mjs loja-integrada/personalizar/app-v13.js loja-integrada/personalizar/index.html scripts/fix-v13-catalog-async-cart-once.py .github/workflows/fix-v13-catalog-and-async-cart-once.yml
          git commit -m "Restaura mockups do catalogo e espera carrinho assincrono V13"
          git pull --rebase origin main
          git push origin main
