name: Dona Antônia · Clientes + Histórico Bling

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bling-customer-history-sync-*.mjs'
      - 'scripts/test-bling-customer-history-sync.mjs'
      - 'supabase/migrations/*bling_customer_history*'
      - '.github/workflows/bling-customer-history-sync-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bling-api-global
  cancel-in-progress: true

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar implementação
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/bling-customer-history-sync-core.mjs
          node --check scripts/bling-customer-history-sync-v2.mjs
          node scripts/test-bling-customer-history-sync.mjs
      - name: Validar secrets
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BLING_CLIENT_ID"
          test -n "$BLING_CLIENT_SECRET"
          test -n "$BLING_REFRESH_TOKEN"
      - name: Sincronizar clientes e histórico
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: https://ssbesxgaijknwsjbsbcz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          BLING_REFRESH_TOKEN_FILE: ${{ runner.temp }}/bling-refresh-token
          BLING_SYNC_REPORT_FILE: ${{ runner.temp }}/bling-customer-history-report.json
          BLING_REQUEST_INTERVAL_MS: '460'
          HISTORY_DAYS: '90'
        run: node scripts/bling-customer-history-sync-v2.mjs --apply
      - name: Persistir refresh token rotacionado
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REFRESH_FILE: ${{ runner.temp }}/bling-refresh-token
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$REFRESH_FILE" ]; then
            test -n "$GH_TOKEN" || { echo 'Refresh token renovado, mas GH_SECRETS_TOKEN não está configurado.' >&2; exit 1; }
            gh secret set BLING_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --body "$(cat "$REFRESH_FILE")"
          fi
      - name: Resumo
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/bling-customer-history-report.json
        shell: bash
        run: |
          echo '### Clientes + histórico Bling' >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$REPORT_FILE" ]; then
            node -e "const r=require(process.env.REPORT_FILE); for (const [k,v] of Object.entries(r)) console.log('- '+k+': `'+(typeof v==='object'?JSON.stringify(v):v)+'`')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Sem relatório de importação.' >> "$GITHUB_STEP_SUMMARY"
          fi
