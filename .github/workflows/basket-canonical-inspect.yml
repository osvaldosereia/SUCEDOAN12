name: Basket canonical inspect
on:
  push:
    branches: [feature/baskets-kits-canonical-20261004-exec]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            vitrine/admin/index.html
            vitrine/index.html
            index.html
            vitrine/basket-carousel.js
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/storefront-v2/index.ts
            supabase/sql
            supabase/migrations
            scripts
            .github/workflows/basket-kit-editor-ci.yml
            .github/workflows/basket-carousel-ci.yml
          sparse-checkout-cone-mode: false
      - name: Verify completed canonical contracts
        run: |
          set -euo pipefail
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-commerce.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-mounting.mjs
          cmp supabase/sql/20261004_basket_canonical_commerce_v1.sql supabase/migrations/20261004223000_basket_canonical_commerce_v1.sql
          cmp supabase/sql/20261004_basket_canonical_mounting_v1.sql supabase/migrations/20261004224500_basket_canonical_mounting_v1.sql
      - name: RED canonical admin API
        run: |
          set +e
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-canonical-api.mjs > /tmp/admin-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/admin-red.log
          if [ "$rc" -eq 0 ]; then touch /tmp/admin-already-green; else grep -q 'canonical basket admin action must exist' /tmp/admin-red.log; fi
      - name: Implement canonical admin API
        run: |
          if [ ! -f /tmp/admin-already-green ]; then python scripts/_apply_basket_canonical_admin.py; fi
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-canonical-api.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-kit-suggestions.mjs
          git diff --check
      - name: Commit canonical admin API
        run: |
          if git diff --quiet -- supabase/functions/admin-products-live-v1/index.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-products-live-v1/index.ts
          git commit -m 'feat: expose canonical basket admin model'
          git push origin HEAD:feature/baskets-kits-canonical-20261004-exec
