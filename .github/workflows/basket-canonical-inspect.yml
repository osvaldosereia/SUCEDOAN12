name: Basket canonical inspect
on:
  push:
    branches: [feature/baskets-kits-canonical-20261004-exec]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            vitrine/admin/index.html
            vitrine/index.html
            index.html
            vitrine/basket-carousel.js
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/storefront-v2/index.ts
            supabase/sql
            supabase/migrations
            scripts
          sparse-checkout-cone-mode: false
      - name: Verify canonical contracts
        run: |
          set -euo pipefail
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-commerce.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-mounting.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-canonical-api.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-simple-flow.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-checkout.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-storefront-canonical.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-carousel-service.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-unified-commercial-model.mjs
      - name: RED unified mixed order engine
        run: |
          set +e
          node --disable-warning=ExperimentalWarning scripts/test-basket-unified-order-engine.mjs > /tmp/order-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/order-red.log
          if [ "$rc" -eq 0 ]; then touch /tmp/order-already-green; else grep -Eq 'ENOENT|unified order|legacy|storefront|parallel order|cart' /tmp/order-red.log; fi
      - name: Implement unified mixed order engine
        run: |
          if [ ! -f /tmp/order-already-green ]; then python scripts/_apply_basket_unified_order_engine.py; fi
          node --disable-warning=ExperimentalWarning scripts/test-basket-unified-order-engine.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-checkout.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-storefront-canonical.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-carousel-service.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-unified-commercial-model.mjs
          cmp supabase/sql/20261004_basket_unified_order_engine_v1.sql supabase/migrations/20261004233000_basket_unified_order_engine_v1.sql
          git diff --check
      - name: Commit unified mixed order engine
        run: |
          if git diff --quiet -- index.html vitrine/index.html supabase/functions/storefront-v2/index.ts supabase/sql/20261004_basket_unified_order_engine_v1.sql supabase/migrations/20261004233000_basket_unified_order_engine_v1.sql; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vitrine/index.html supabase/functions/storefront-v2/index.ts supabase/sql/20261004_basket_unified_order_engine_v1.sql supabase/migrations/20261004233000_basket_unified_order_engine_v1.sql
          git commit -m 'feat: support mixed legacy and modern basket orders'
          git push origin HEAD:feature/baskets-kits-canonical-20261004-exec
