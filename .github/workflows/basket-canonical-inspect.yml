name: Basket canonical inspect
on:
  push:
    branches: [feature/baskets-kits-canonical-20261004-exec]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            vitrine/admin/index.html
            vitrine/index.html
            index.html
            vitrine/basket-carousel.js
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/storefront-v2/index.ts
            supabase/sql
            supabase/migrations
            scripts
            .github/workflows/basket-kit-editor-ci.yml
            .github/workflows/basket-carousel-ci.yml
          sparse-checkout-cone-mode: false
      - name: Verify completed canonical contracts
        run: |
          set -euo pipefail
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-commerce.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-canonical-mounting.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-canonical-api.mjs
      - name: RED simplified admin
        run: |
          set +e
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-simple-flow.mjs > /tmp/simple-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/simple-red.log
          if [ "$rc" -eq 0 ]; then touch /tmp/simple-already-green; else grep -Eq 'primary page must use unified|primary page must consume canonical|Pausar venda|pause/resume' /tmp/simple-red.log; fi
      - name: Implement simplified admin
        run: |
          if [ ! -f /tmp/simple-already-green ]; then python scripts/_apply_basket_simple_admin.py; fi
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-simple-flow.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-admin-canonical-api.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-lot-ops-rules.mjs
          node --disable-warning=ExperimentalWarning scripts/test-basket-kit-suggestions.mjs
          git diff --check
      - name: Commit simplified admin
        run: |
          if git diff --quiet -- vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts scripts/test-basket-lot-ops-rules.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitrine/admin/index.html supabase/functions/admin-products-live-v1/index.ts scripts/test-basket-lot-ops-rules.mjs
          git commit -m 'refactor: simplify baskets kits admin workflow'
          git push origin HEAD:feature/baskets-kits-canonical-20261004-exec
