name: XML Catalog R18 Consolidation
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**/purchase-xml-v1/**'
      - 'supabase/functions/purchase-xml-v1/**'
      - 'supabase/migrations/20261009085000_purchase_xml_ingest_error_audit_v5.sql'
      - 'vitrine/admin/index.html'
      - 'docs/projects/purchase-xml-field-*.sql'
      - 'scripts/test-xml-*.mjs'
      - 'scripts/fixtures/xml-field-*.sql'
      - 'scripts/fixtures/xml-field-*.mjs'
      - '.github/workflows/xml-catalog-consolidation-r18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalog, audit, pagination, review and existing-regression contracts
        run: |
          set -eu
          node scripts/test-xml-catalog-consolidation-r18.mjs
          node scripts/test-xml-catalog-comparison-v3.mjs
          node scripts/test-xml-catalog-ingest-audit-v5.mjs
          node scripts/test-xml-catalog-history-pagination-v3.mjs
          node scripts/test-xml-catalog-details-v2.mjs
          node scripts/test-xml-field-review-ledger-v1.mjs
          node scripts/test-xml-field-review-gateway-r15.mjs
          node scripts/test-xml-field-review-admin-r15.mjs
          node scripts/test-xml-field-apply-r16.mjs
          node scripts/test-xml-field-integrated-r17.mjs
          node scripts/test-xml-field-r17-gateway-boundary.mjs
  real-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run NF-e integrity tests with fast-xml-parser
        run: deno run --allow-read scripts/test-xml-catalog-protocol-integrity-v6.mjs
      - name: Type-check both integrated purchase XML Edge modules
        run: deno check supabase/functions/admin-service-intelligence-v1/purchase-xml-v1/index.ts supabase/functions/purchase-xml-v1/index.ts
  transactional-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Disposable database ledger, CAS, role and rollback integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f scripts/test-xml-field-integrated-r17.pg.sql
