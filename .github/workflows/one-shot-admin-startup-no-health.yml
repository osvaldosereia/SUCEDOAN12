name: One-shot admin startup no health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin-startup-no-health.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: RED - verify regression exists
        run: |
          if node scripts/test-admin-startup-no-health.mjs; then
            echo 'Regression test unexpectedly passed before patch' >&2
            exit 1
          fi
      - name: Apply minimal startup fix
        run: python3 scripts/patch-admin-startup-no-health.py
      - name: GREEN - verify behavior and syntax
        run: node scripts/test-admin-startup-no-health.mjs
      - name: Commit fix
        run: |
          git config user.name 'OSSJU'
          git config user.email 'Junior.sereia@hotmail.com'
          git add vitrine/admin/index.html
          git diff --cached --check
          git commit -m 'perf(admin): abrir Central sem health redundante'
          git pull --rebase origin main
          git push origin main
