name: Test Admin Canecas V3

on:
  push:
    branches: [main]
    paths:
      - 'admin-canecas/**'
      - 'loja-integrada/personalizar/**'
      - 'scripts/test-admin-canecas-v3.mjs'
      - 'scripts/test-personalization-contract-v1.mjs'
      - 'scripts/smoke-admin-canecas-firebase.mjs'
      - 'scripts/sincronizar-loja-integrada.mjs'
      - 'scripts/processar-vitrine-canecas.mjs'
      - '.github/workflows/test-admin-canecas-v2.yml'
  pull_request:
    paths:
      - 'admin-canecas/**'
      - 'loja-integrada/personalizar/**'
      - 'scripts/test-admin-canecas-v3.mjs'
      - 'scripts/test-personalization-contract-v1.mjs'
      - 'scripts/smoke-admin-canecas-firebase.mjs'
      - 'scripts/sincronizar-loja-integrada.mjs'
      - 'scripts/processar-vitrine-canecas.mjs'
      - '.github/workflows/test-admin-canecas-v2.yml'

permissions:
  contents: read

jobs:
  structural-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generator syntax
        run: node --check admin-canecas/generator-v1.js
      - name: Check bulk actions syntax
        run: node --check admin-canecas/bulk-actions-v1.js
      - name: Check mug grid syntax
        run: node --check admin-canecas/mug-grid-v1.js
      - name: Check mug list stability syntax
        run: node --check admin-canecas/mugs-stability-v2.js
      - name: Check inline category syntax
        run: node --check admin-canecas/mug-inline-category-v2.js
      - name: Check personalization config syntax
        run: node --check admin-canecas/personalization-config-v1.js
      - name: Check personalization badge syntax
        run: node --check admin-canecas/mug-personalization-badge-v1.js
      - name: Check personalization test link syntax
        run: node --check admin-canecas/personalization-test-link-v1.js
      - name: Check personalization prompt suggestion syntax
        run: node --check admin-canecas/personalization-prompt-suggest-v1.js
      - name: Check personalization contract syntax
        run: node --check loja-integrada/personalizar/personalization-contract-v1.js
      - name: Check personalizer V4 syntax
        run: node --check loja-integrada/personalizar/app-v4.js
      - name: Test personalization contract behavior
        run: node scripts/test-personalization-contract-v1.mjs
      - name: Check LI recovery syntax
        run: node --check admin-canecas/li-recovery-v3.js
      - name: Check LI coordinator syntax
        run: node --check admin-canecas/li-sync-coordinator-v4.js
      - name: Check dual GitHub Make sync syntax
        run: node --check admin-canecas/li-dual-sync-v3.js
      - name: Check GitHub crops UI syntax
        run: node --check admin-canecas/storefront-crops-github-v2.js
      - name: Check GitHub LI worker syntax
        run: node --check scripts/sincronizar-loja-integrada.mjs
      - name: Check crop worker syntax
        run: node --check scripts/processar-vitrine-canecas.mjs
      - name: Validate Admin Canecas V3
        run: node scripts/test-admin-canecas-v3.mjs
      - name: Smoke test Firebase and mug image
        run: node scripts/smoke-admin-canecas-firebase.mjs
