name: Test CanecaFácil V16

on:
  push:
    branches: [main]
    paths:
      - 'admin-canecas/**'
      - 'caneca-print/**'
      - 'loja-integrada/**'
      - 'scripts/test-canecafacil-v16.mjs'
      - 'scripts/test-dashboard-operacional-v2.mjs'
      - 'scripts/test-pedidos-operacional-v2.mjs'
      - 'scripts/test-personalizacao-only.mjs'
      - 'scripts/test-personalization-contract-v1.mjs'
      - 'scripts/test-personalizer-v4-make-contract-v1.mjs'
      - 'scripts/smoke-admin-canecas-firebase.mjs'
      - 'scripts/processar-midia-loja-integrada-v16.mjs'
      - 'scripts/migrar-imagens-loja-integrada-v1.mjs'
      - 'scripts/fila-midia-loja-integrada-v1.mjs'
      - 'scripts/test-fila-midia-github-v1.mjs'
      - 'scripts/atualizar-catalogo-loja-integrada-v1.mjs'
      - 'scripts/sincronizar-loja-integrada-v3.mjs'
      - 'scripts/sincronizar-loja-integrada-v4.mjs'
      - 'scripts/sincronizar-pedidos-personalizados-li.mjs'
      - 'scripts/sincronizar-pedidos-canecas-li-v2.mjs'
      - 'scripts/canecafacil-github-ops-core-v1.mjs'
      - 'scripts/processar-operacoes-github-canecas-v1.mjs'
      - 'scripts/auditar-shadow-github-vs-make-v1.mjs'
      - 'scripts/auditar-shadow-profundo-github-vs-make-v1.mjs'
      - 'scripts/reconciliar-categorias-produtos-li-v1.mjs'
      - 'scripts/test-canecafacil-github-ops-v1.mjs'
      - '.github/workflows/processar-fila-midia-loja-integrada.yml'
      - '.github/workflows/sincronizar-pedidos-personalizados-li.yml'
      - '.github/workflows/testar-substitutos-make-canecafacil.yml'
      - '.github/workflows/test-admin-canecas-v2.yml'
  pull_request:
    paths:
      - 'admin-canecas/**'
      - 'caneca-print/**'
      - 'loja-integrada/**'
      - 'scripts/test-canecafacil-v16.mjs'
      - 'scripts/test-dashboard-operacional-v2.mjs'
      - 'scripts/test-pedidos-operacional-v2.mjs'
      - 'scripts/test-personalizacao-only.mjs'
      - 'scripts/processar-midia-loja-integrada-v16.mjs'
      - 'scripts/migrar-imagens-loja-integrada-v1.mjs'
      - 'scripts/fila-midia-loja-integrada-v1.mjs'
      - 'scripts/test-fila-midia-github-v1.mjs'
      - 'scripts/atualizar-catalogo-loja-integrada-v1.mjs'
      - 'scripts/sincronizar-loja-integrada-v3.mjs'
      - 'scripts/sincronizar-loja-integrada-v4.mjs'
      - 'scripts/sincronizar-pedidos-personalizados-li.mjs'
      - 'scripts/sincronizar-pedidos-canecas-li-v2.mjs'
      - 'scripts/canecafacil-github-ops-core-v1.mjs'
      - 'scripts/processar-operacoes-github-canecas-v1.mjs'
      - 'scripts/auditar-shadow-github-vs-make-v1.mjs'
      - 'scripts/auditar-shadow-profundo-github-vs-make-v1.mjs'
      - 'scripts/reconciliar-categorias-produtos-li-v1.mjs'
      - 'scripts/test-canecafacil-github-ops-v1.mjs'
      - '.github/workflows/processar-fila-midia-loja-integrada.yml'
      - '.github/workflows/sincronizar-pedidos-personalizados-li.yml'
      - '.github/workflows/testar-substitutos-make-canecafacil.yml'
      - '.github/workflows/test-admin-canecas-v2.yml'

permissions:
  contents: read

jobs:
  structural-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            admin-canecas
            caneca-print
            loja-integrada
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Admin generator syntax
        run: |
          node --check admin-canecas/generator-v1.js
          node --check admin-canecas/generator-recovery-v1.js
          node --check admin-canecas/generator-finalize-recovery-v2.js
          node --check admin-canecas/storefront-media-v4.js
          node --check admin-canecas/personalization-config-v1.js
          node --check admin-canecas/personalization-resilience-v1.js
          node --check admin-canecas/creation-order-status-v1.js
          node --check admin-canecas/dashboard-operations-v2.js
          node --check admin-canecas/orders-manager-v2.js
          node --check admin-canecas/production-release-status-v1.js
          node --check admin-canecas/li-sync-coordinator-v4.js
          node --check admin-canecas/li-dual-sync-v3.js
          node --check admin-canecas/li-channel-clarity-v1.js
          node --check admin-canecas/mug-inline-category-v3.js

      - name: Check active storefront syntax
        run: |
          node --check loja-integrada/canecafacil-site-runtime-v1.js
          node --check loja-integrada/canecafacil-storefront-v1.js
          node --check loja-integrada/canecafacil-product-v1.js
          node --check loja-integrada/canecafacil-commerce-runtime-v1.js
          node --check loja-integrada/canecafacil-personalizacao-only-v1.js
          node --check loja-integrada/loader-personalizador-inline-producao-v10.js
          node --check loja-integrada/personalized-order-bridge-v2.js
          node --check loja-integrada/personalized-order-link-hardening-v1.js

      - name: Check legacy compatibility syntax
        run: |
          node --check loja-integrada/personalizar/app-v15.js
          node --check loja-integrada/personalizar/native-cart-v2.js
          node --check loja-integrada/personalizar/creation-device-bridge-v1.js
          node --check loja-integrada/loader-personalizador-inline-producao.js
          node --check loja-integrada/personalizador-inline-v1.js
          node --check loja-integrada/personalizador-inline-v2.js

      - name: Check workers syntax
        run: |
          node --check scripts/processar-midia-loja-integrada-v16.mjs
          node --check scripts/migrar-imagens-loja-integrada-v1.mjs
          node --check scripts/fila-midia-loja-integrada-v1.mjs
          node --check scripts/test-fila-midia-github-v1.mjs
          node --check scripts/test-dashboard-operacional-v2.mjs
          node --check scripts/test-pedidos-operacional-v2.mjs
          node --check scripts/atualizar-catalogo-loja-integrada-v1.mjs
          node --check scripts/sincronizar-loja-integrada-v3.mjs
          node --check scripts/sincronizar-loja-integrada-v4.mjs
          node --check scripts/sincronizar-pedidos-personalizados-li.mjs
          node --check scripts/sincronizar-pedidos-canecas-li-v2.mjs
          node --check scripts/canecafacil-github-ops-core-v1.mjs
          node --check scripts/processar-operacoes-github-canecas-v1.mjs
          node --check scripts/auditar-shadow-github-vs-make-v1.mjs
          node --check scripts/auditar-shadow-profundo-github-vs-make-v1.mjs
          node --check scripts/reconciliar-categorias-produtos-li-v1.mjs
          node --check scripts/test-canecafacil-github-ops-v1.mjs

      - name: Test Dashboard operacional V2
        run: node scripts/test-dashboard-operacional-v2.mjs

      - name: Test Pedidos operacional V2
        run: node scripts/test-pedidos-operacional-v2.mjs

      - name: Test media queue state machine without external writes
        run: node scripts/test-fila-midia-github-v1.mjs

      - name: Test GitHub Ops replacements without Make
        run: node scripts/test-canecafacil-github-ops-v1.mjs

      - name: Live readiness Loja Integrada sem Make · somente leitura
        env:
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          MODE: readiness
          DRY_RUN: 'true'
        run: |
          if [ -z "$LOJA_INTEGRADA_AUTHORIZATION" ]; then
            echo 'SKIP · secret da Loja Integrada indisponível neste evento.'
            exit 0
          fi
          node scripts/processar-operacoes-github-canecas-v1.mjs

      - name: Shadow real · 5 produtos · somente leitura
        env:
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          SHADOW_LIMIT: '5'
          SHADOW_STRICT: 'false'
        run: |
          if [ -z "$LOJA_INTEGRADA_AUTHORIZATION" ]; then
            echo 'SKIP · secret da Loja Integrada indisponível neste evento.'
            exit 0
          fi
          node scripts/auditar-shadow-github-vs-make-v1.mjs

      - name: Deep shadow · preço estoque SEO · 3 produtos · somente leitura
        env:
          LOJA_INTEGRADA_AUTHORIZATION: ${{ secrets.LOJA_INTEGRADA_APP_KEY }}
          FIREBASE_BASE_URL: https://cedar-chemist-310801-default-rtdb.firebaseio.com
          LOJA_INTEGRADA_BASE_URL: https://api.awsli.com.br/v1
          SHADOW_DEEP_LIMIT: '3'
          SHADOW_STRICT: 'false'
        run: |
          if [ -z "$LOJA_INTEGRADA_AUTHORIZATION" ]; then
            echo 'SKIP · secret da Loja Integrada indisponível neste evento.'
            exit 0
          fi
          node scripts/auditar-shadow-profundo-github-vs-make-v1.mjs

      - name: Validate current CanecaFácil architecture
        run: node scripts/test-canecafacil-v16.mjs

      - name: Validate personalization-only default theme mode
        run: node scripts/test-personalizacao-only.mjs

      - name: Test personalization contract behavior
        run: node scripts/test-personalization-contract-v1.mjs

      - name: Test legacy V4 Make contract behavior
        run: node scripts/test-personalizer-v4-make-contract-v1.mjs

      - name: Smoke test Firebase and mug image
        run: node scripts/smoke-admin-canecas-firebase.mjs
