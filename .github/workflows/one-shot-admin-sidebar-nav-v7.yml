name: One-shot admin sidebar navigation v7
on:
  push:
    branches: [feat/admin-sidebar-nav-v7-20261001]
    paths: ['.github/workflows/one-shot-admin-sidebar-nav-v7.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply sidebar patch
        run: python3 scripts/patch-admin-sidebar-nav-v7.py
      - name: Verify navigation
        run: |
          python3 scripts/test-admin-sidebar-nav-v7.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vitrine/admin/index.html').read_text(encoding='utf-8')
          expected=['today','orders','separation','expedition','driver','closure','products','baskets','expiry','quotes','customers','marketing','purchases','balance','gondolas','more']
          missing=[x for x in expected if f'data-tab="{x}"' not in s]
          assert not missing, 'missing tabs: '+', '.join(missing)
          assert s.count('id="adminNavToggle"')==1
          assert s.count('id="adminNav"')==1
          assert s.count('id="adminNavBackdrop"')==1
          print('ADMIN_SIDEBAR_NAV_ITEMS_OK')
          PY
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log('ADMIN_JS_SYNTAX_OK');
          NODE
          git diff --check
      - name: Commit and clean temporary files
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/index.html
          git rm -f scripts/patch-admin-sidebar-nav-v7.py scripts/test-admin-sidebar-nav-v7.py .github/workflows/test-admin-sidebar-nav-v7.yml .github/workflows/one-shot-admin-sidebar-nav-v7.yml
          git commit -m 'feat(admin): move menu to sidebar and mobile drawer'
          git push origin HEAD:feat/admin-sidebar-nav-v7-20261001
