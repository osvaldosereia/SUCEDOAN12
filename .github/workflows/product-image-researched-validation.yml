name: Product Image Research — Validation

on:
  push:
    branches:
      - main
    paths:
      - .automation/product-image-researched-validation-run-once

permissions:
  contents: read

concurrency:
  group: product-image-researched-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: product-studio-u2net-v1

      - name: Install deterministic image dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            pillow==11.3.0 \
            requests==2.32.5 \
            opencv-python-headless==4.11.0.86 \
            'rembg[cpu]==2.0.69'

      - name: Process researched product images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python automation/product-image-studio/enrich_researched_products.py \
            --limit 4 \
            --report artifacts/product-image-studio-production/researched-products-validation.json

      - name: Print result
        if: always()
        run: |
          test -f artifacts/product-image-studio-production/researched-products-validation.json && cat artifacts/product-image-studio-production/researched-products-validation.json || true
