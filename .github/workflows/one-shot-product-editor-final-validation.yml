name: One-shot product editor final validation
on:
  push:
    branches: [feat/product-editor-complete-20261004]
    paths: ['.github/workflows/one-shot-product-editor-final-validation.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            index.html
            vitrine/index.html
            vitrine/admin/index.html
            pedido/index.html
            p/index.html
            checkout-resilience.js
            supabase/functions/admin-orders-v1/index.ts
            supabase/functions/admin-products-live-v1/index.ts
            supabase/functions/storefront-v2/index.ts
            supabase/functions/order-public-view-v1/index.ts
            supabase/migrations/20261003043000_order_public_short_link.sql
            scripts/test-product-editor-complete.mjs
            scripts/test-products-operational-list.mjs
            scripts/test-mobile-products-quick-edit.mjs
            scripts/test-admin-pending-data-baskets-public-v1.mjs
            .github/workflows/one-shot-product-editor-final-validation.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testes do produto e guardas do Admin
        run: |
          node scripts/test-product-editor-complete.mjs
          node scripts/test-products-operational-list.mjs
          node scripts/test-mobile-products-quick-edit.mjs
          node scripts/test-admin-pending-data-baskets-public-v1.mjs
      - name: Sintaxe do JavaScript inline
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vitrine/admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach((src,i)=>{try{new Function(src)}catch(e){throw new Error(`inline script ${i+1}: ${e.message}`)}});
          console.log(`Admin JS syntax OK (${scripts.length} inline scripts)`);
          NODE
      - name: TypeScript diferencial contra main
        shell: bash
        run: |
          git show origin/main:supabase/functions/admin-products-live-v1/index.ts > /tmp/admin-products-main.ts
          set +e
          deno check /tmp/admin-products-main.ts > /tmp/main-check.log 2>&1
          main_code=$?
          deno check supabase/functions/admin-products-live-v1/index.ts > /tmp/branch-check.log 2>&1
          branch_code=$?
          set -e
          echo '--- baseline main ---'
          grep -oE 'TS[0-9]+' /tmp/main-check.log | sort | uniq -c || true
          echo '--- branch ---'
          grep -oE 'TS[0-9]+' /tmp/branch-check.log | sort | uniq -c || true
          grep -oE 'TS[0-9]+' /tmp/main-check.log | sort > /tmp/main-codes.txt || true
          grep -oE 'TS[0-9]+' /tmp/branch-check.log | sort > /tmp/branch-codes.txt || true
          if [ "$main_code" -eq 0 ]; then
            echo 'Baseline main passou; portanto a branch também precisa passar.'
            test "$branch_code" -eq 0
          else
            echo 'Baseline main já contém dívida de typecheck; exigindo zero erros adicionais por código.'
            diff -u /tmp/main-codes.txt /tmp/branch-codes.txt
            if grep -Eq 'productDetail|saveProductEditorFiscal|syncProductEditorIdentifiers|validateProductEditorExtras|normalizedFiscal|editorGtins|editorTags' /tmp/branch-check.log; then
              echo 'Erro TypeScript encontrado no código novo do editor.' >&2
              cat /tmp/branch-check.log
              exit 1
            fi
          fi
          echo 'TypeScript diferencial OK: nenhum erro novo introduzido pelo editor.'
      - name: Integridade do diff
        run: git diff --check origin/main...HEAD
      - name: Remover workflow temporario
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-product-editor-final-validation.yml
          git commit -m 'chore: remover validacao temporaria do editor'
          git push origin HEAD:feat/product-editor-complete-20261004
