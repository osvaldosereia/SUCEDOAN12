name: Attendance v2 Phase 3 TDD
on:
  push:
    branches: [feat/attendance-central-v2-phase3]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Phase 3 contracts
        run: |
          set -euo pipefail
          node scripts/test-admin-attendance-commercial-sql-v1.mjs
          node scripts/test-admin-attendance-commercial-api-v1.mjs
          node scripts/test-admin-attendance-products-v2.mjs
          node scripts/test-admin-attendance-commerce-integration-v1.mjs
          node scripts/test-admin-attendance-templates-ui-v1.mjs
      - name: Attendance regression
        run: |
          set -euo pipefail
          for f in scripts/test-admin-attendance-*.mjs; do node "$f"; done
          node --check vitrine/admin/atendimento/attendance.js
