name: Admin Chat Comprar

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'admin-v3/**'
      - 'comprar/help.js'
      - 'comprar/styles.css'
      - 'supabase/functions/_shared/chat-intelligence-config.js'
      - 'supabase/functions/admin-service-intelligence-simple-v1/**'
      - 'supabase/functions/shopping-chat-v1/**'
      - 'supabase/functions/shopping-chat-menu-v1/**'
      - 'scripts/test-admin-canonical-v1.mjs'
      - 'scripts/test-comprar-help-quick-questions-v1.mjs'
      - 'tests/admin-v3-service-strategy-shopping-chat-final.mjs'
      - 'tests/chat-intelligence-presets-v1.mjs'
      - '.github/workflows/admin-v3-chat-center-tests.yml'
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'admin-v3/**'
      - 'comprar/help.js'
      - 'comprar/styles.css'
      - 'supabase/functions/_shared/chat-intelligence-config.js'
      - 'supabase/functions/admin-service-intelligence-simple-v1/**'
      - 'supabase/functions/shopping-chat-v1/**'
      - 'supabase/functions/shopping-chat-menu-v1/**'
      - 'scripts/test-admin-canonical-v1.mjs'
      - 'scripts/test-comprar-help-quick-questions-v1.mjs'
      - 'tests/admin-v3-service-strategy-shopping-chat-final.mjs'
      - 'tests/chat-intelligence-presets-v1.mjs'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-comprar-help-quick-questions-v1.mjs
      - run: node scripts/test-admin-canonical-v1.mjs
      - run: node --check admin/service-strategy.js
      - run: node tests/admin-v3-service-strategy-shopping-chat-final.mjs
      - run: node tests/chat-intelligence-presets-v1.mjs
