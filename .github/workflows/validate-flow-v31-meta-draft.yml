name: Validate WhatsApp Flow V31 Meta Draft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-whatsapp-flow-v31-meta-draft
  cancel-in-progress: false

jobs:
  validate-meta-draft:
    runs-on: ubuntu-latest
    env:
      GRAPH_VERSION: v26.0
      WABA_ID: '840102181903253'
      SOURCE_FLOW_ID: '1538860004926321'
      FLOW_NAME: 'Dona Antônia - Cestas Comercial V31 Stable'
      ENDPOINT_URI: 'https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/whatsapp-flow-data-exchange-v1'
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FLOW_JSON: whatsapp/flows/flow-cestas-comercial-v31-stable-text-products.json
    steps:
      - uses: actions/checkout@v4

      - name: Validate local JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$FLOW_JSON" >/dev/null
          python - <<'PY'
          import json
          p='whatsapp/flows/flow-cestas-comercial-v31-stable-text-products.json'
          f=json.load(open(p,encoding='utf-8'))
          assert f['version']=='7.3'
          assert f['data_api_version']=='3.0'
          ids=[s['id'] for s in f['screens']]
          assert len(ids)==len(set(ids))
          assert ids[0]=='CESTAS'
          for s in f['screens']:
              if s['id'].startswith('PRODUTOS_'):
                  raw=json.dumps(s,ensure_ascii=False)
                  assert 'NavigationList' not in raw
                  assert '"type": "Image"' not in raw
          print('v31_local_contract_ok')
          PY

      - name: Require Meta token
        shell: bash
        run: |
          test -n "$META_ACCESS_TOKEN" || { echo 'META_ACCESS_TOKEN missing' >&2; exit 2; }

      - name: Resolve or create DRAFT only
        id: flow
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -sS --fail-with-body -H "Authorization: Bearer $META_ACCESS_TOKEN" "https://graph.facebook.com/$GRAPH_VERSION/$WABA_ID/flows?fields=id,name,status&limit=100")
          FLOW_ID=$(printf '%s' "$LIST" | jq -r --arg NAME "$FLOW_NAME" '.data[]? | select(.name==$NAME) | .id' | head -n1)
          STATUS=$(printf '%s' "$LIST" | jq -r --arg NAME "$FLOW_NAME" '.data[]? | select(.name==$NAME) | .status' | head -n1)
          if [ -z "$FLOW_ID" ]; then
            CREATED=$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $META_ACCESS_TOKEN" \
              --data-urlencode "name=$FLOW_NAME" \
              --data-urlencode 'categories=["OTHER"]' \
              --data-urlencode "clone_flow_id=$SOURCE_FLOW_ID" \
              --data-urlencode "endpoint_uri=$ENDPOINT_URI" \
              "https://graph.facebook.com/$GRAPH_VERSION/$WABA_ID/flows")
            FLOW_ID=$(printf '%s' "$CREATED" | jq -r '.id // empty')
            STATUS=DRAFT
          fi
          test "$STATUS" != 'PUBLISHED' || { echo 'Refusing to modify a published Flow' >&2; exit 3; }
          echo "flow_id=$FLOW_ID" >> "$GITHUB_OUTPUT"
          echo "META_FLOW_ID=$FLOW_ID"

      - name: Upload JSON and validate
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" \
            -F 'asset_type=FLOW_JSON' \
            -F 'name=flow.json' \
            -F "file=@$FLOW_JSON;type=application/json" \
            "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID/assets")
          echo "$RESPONSE" | jq .
          test "$(printf '%s' "$RESPONSE" | jq -r '.success // false')" = true
          test "$(printf '%s' "$RESPONSE" | jq -c '.validation_errors // []')" = '[]'

      - name: Verify remains DRAFT and endpoint is correct
        shell: bash
        run: |
          set -euo pipefail
          FLOW_ID='${{ steps.flow.outputs.flow_id }}'
          META=$(curl -sS --fail-with-body -H "Authorization: Bearer $META_ACCESS_TOKEN" "https://graph.facebook.com/$GRAPH_VERSION/$FLOW_ID?fields=id,name,status,validation_errors,json_version,data_api_version,data_channel_uri")
          echo "$META" | jq .
          test "$(printf '%s' "$META" | jq -r '.status')" = 'DRAFT'
          test "$(printf '%s' "$META" | jq -c '.validation_errors // []')" = '[]'
          test "$(printf '%s' "$META" | jq -r '.data_channel_uri // empty')" = "$ENDPOINT_URI"
          echo 'META_DRAFT_VALIDATION_READY=true'

      - name: Guardrail — publishing intentionally omitted
        run: echo 'This workflow never calls /publish.'
