name: one-shot-product-media-batch

on:
  push:
    branches:
      - feat/attendance-product-media-batch-20261004

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-product-media-batch-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-product-media-batch-v1.mjs
      - run: node scripts/test-admin-attendance-product-media-batch-v1.mjs
      - run: node --check vitrine/admin/atendimento/attendance-product-send.js
      - run: node --check vitrine/admin/atendimento/attendance-app.js
      - run: git diff --check
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/admin/atendimento/attendance-app.js vitrine/admin/atendimento/attendance.css vitrine/admin/atendimento/index.html
          git commit -m "feat: selecionar e enviar produtos com imagem"
          git push origin HEAD:feat/attendance-product-media-batch-20261004
