name: One-shot attendance filter menu
on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/one-shot-attendance-filter-menu-v1.yml'
      - 'scripts/patch-admin-attendance-filter-menu-v1.py'
      - 'scripts/test-admin-attendance-filter-menu-v1.mjs'
      - 'supabase/migrations/20261003_admin_attendance_recent_filters_v1.sql'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-filter-menu-3days-20261003
          fetch-depth: 1
      - name: Apply deterministic Attendance patch
        run: python3 scripts/patch-admin-attendance-filter-menu-v1.py
      - name: Validate new filter contract
        run: node scripts/test-admin-attendance-filter-menu-v1.mjs
      - name: Validate existing Attendance contracts
        run: |
          node scripts/test-admin-attendance-ui-v1.mjs
          node scripts/test-admin-attendance-native-v1.mjs
          node scripts/test-admin-attendance-scroll-layout-v1.mjs
          node scripts/test-admin-attendance-viewport-fit-v1.mjs
          node scripts/test-admin-attendance-native-channel-v1.mjs
          node scripts/test-admin-attendance-organization-api-v1.mjs
          node scripts/test-admin-attendance-unsupported-display-v1.mjs
          node --check vitrine/admin/atendimento/attendance-app.js
      - name: Diff check
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'Dona Antonia Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add vitrine/admin/atendimento/index.html vitrine/admin/atendimento/attendance-app.js vitrine/admin/atendimento/attendance.css supabase/functions/admin-whatsapp-ops-v1/index.ts scripts/test-admin-attendance-organization-api-v1.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: unificar filtros recentes pedidos cadastro e etiquetas'
          git pull --rebase origin feat/attendance-filter-menu-3days-20261003
          git push origin HEAD:feat/attendance-filter-menu-3days-20261003
