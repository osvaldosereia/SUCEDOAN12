name: temp-admin-company-whatsapp-direct

on:
  push:
    branches:
      - fix/admin-company-whatsapp-direct-20261002

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-company-whatsapp-direct-20261002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python scripts/patch-admin-company-whatsapp-direct.py
      - name: Verify direct company WhatsApp handoff
        run: |
          node scripts/test-admin-order-whatsapp-ui-integration.mjs
          node scripts/test-admin-order-expedition-ui-hotfix.mjs
          git diff --check
      - name: Commit tested patch and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-admin-company-whatsapp-direct.yml scripts/patch-admin-company-whatsapp-direct.py
          git add vitrine/admin/index.html scripts/test-admin-order-whatsapp-ui-integration.mjs
          git commit -m 'fix(admin): open company order directly in WhatsApp'
          git push origin HEAD:fix/admin-company-whatsapp-direct-20261002
