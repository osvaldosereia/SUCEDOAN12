name: Apply basket mold cutover guard R6
permissions:
  contents: write
on:
  push:
    branches: [feat/basket-molds-r6-cutover]
    paths:
      - 'scripts/apply-basket-mold-cutover-guard-r6.py'
      - '.github/workflows/basket-mold-cutover-guard-r6-apply.yml'
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r6-guard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/basket-molds-r6-cutover
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-basket-mold-cutover-guard-r6.py
      - name: Commit guarded transformation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/storefront-v2/index.ts
          git commit -m "feat: proteger detalhe de molde no cutover R6 [r6-guard-applied]"
          git push origin HEAD:feat/basket-molds-r6-cutover
