<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Dona Antônia · Compra rápida</title>
  <link rel="stylesheet" href="./styles.css?v=20260915-05-chat-01">
  <link rel="stylesheet" href="./offers.css?v=20260917-02-personalized">

<body>
  <div class="chat-app">
    <header class="chat-topbar">
      <button id="backButton" class="top-icon" type="button" aria-label="Voltar">‹</button>
      <img class="brand-logo" src="../img/logoantonia5.png" alt="Dona Antônia" width="42" height="42">
      <div class="brand-copy"><strong>Dona Antônia</strong><small id="roomStatus">Atendimento online</small></div>
      <button id="cartButton" class="cart-pill" type="button" aria-label="Ver pedido"><span>Pedido</span><b id="cartCount">0</b></button>
    </header>
    <main id="timeline" class="timeline" aria-live="polite"><div id="loadingCard" class="bubble assistant">Abrindo seu atendimento…</div></main>
    <div id="cartBar" class="cart-bar"><div class="cart-bar-total"><small>Seu pedido</small><strong id="cartSummaryText">0 itens · R$ 0,00</strong></div><button id="checkoutButton" type="button" disabled>Ver pedido</button></div>
    <button id="helpToggle" class="help-toggle" type="button" aria-expanded="false" aria-controls="composer">💬 Ajuda</button>
    <div id="recordingBar" class="recording hidden" aria-live="polite"><span class="record-dot"></span><strong id="recordingTime">0:00</strong><span>Gravando</span><button id="cancelRecording" type="button">Cancelar</button></div>
    <form id="composer" class="composer composer-collapsed"><button id="photoButton" class="composer-icon" type="button" aria-label="Enviar foto">＋</button><input id="photoInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><input id="messageInput" type="text" maxlength="800" autocomplete="off" placeholder="Digite aqui…"><button id="micButton" class="composer-icon" type="button" aria-label="Gravar áudio">🎤</button><button id="sendButton" class="send-button" type="submit" aria-label="Enviar">➤</button><button id="helpClose" class="composer-close hidden" type="button" aria-label="Fechar ajuda">×</button></form>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="./config.js?v=20260915-05-chat-01"></script>
  <script src="./admin-test-bridge.js?v=20260915-05-chat-01"></script>

  <script src="./conversation.js?v=20260922-01-address-hotfix"></script>
  <script src="./checkout-ux-fixes.js?v=20260917-01"></script>
  <script src="./papo-identity-ui.js?v=20260917-01"></script>
  <script src="./repeat-purchase-v1.js?v=20260918-metrics-01"></script>
  <script src="./frequent-purchases-v1.js?v=20260917-02"></script>
  <script src="./personalized-start-v1.js?v=20260918-01"></script>
  <script>window.DA_COMPRAR_APP.start().catch(()=>{});</script>
</body>
</html>
