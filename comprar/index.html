<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Dona Antônia · Compra rápida</title>
  <link rel="stylesheet" href="./chat-light-v2.css?v=20260911-02">
  <link rel="stylesheet" href="./chat-helper-menu.css?v=20260911-01">
</head>
<body>
  <div class="chat-app">
    <header class="chat-topbar">
      <button id="backButton" class="top-icon" type="button" aria-label="Voltar">‹</button>
      <div class="brand-mark">DA</div>
      <div class="brand-copy"><strong>Dona Antônia</strong><small id="roomStatus">Atendimento online</small></div>
      <button id="cartButton" class="cart-pill" type="button" aria-label="Ver pedido"><span>Pedido</span><b id="cartCount">0</b></button>
    </header>
    <main id="timeline" class="timeline" aria-live="polite">
      <div id="loadingCard" class="bubble assistant">Abrindo seu atendimento…</div>
    </main>
    <div id="cartBar" class="cart-bar hidden">
      <div><small>Seu pedido</small><strong id="cartTotal">R$ 0,00</strong></div>
      <button id="checkoutButton" type="button">Finalizar</button>
    </div>
    <div id="recordingBar" class="recording hidden" aria-live="polite">
      <span class="record-dot"></span><strong id="recordingTime">0:00</strong><span>Gravando</span>
      <button id="cancelRecording" type="button">Cancelar</button>
    </div>
    <form id="composer" class="composer">
      <button id="photoButton" class="composer-icon" type="button" aria-label="Enviar foto">＋</button>
      <input id="photoInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
      <input id="messageInput" type="text" maxlength="800" autocomplete="off" placeholder="Digite aqui…">
      <button id="micButton" class="composer-icon" type="button" aria-label="Gravar áudio">🎤</button>
      <button id="sendButton" class="send-button" type="submit" aria-label="Enviar">➤</button>
    </form>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="./config.js?v=20260911-03"></script>
  <script src="./chat-light-v2.js?v=20260911-02"></script>
  <script src="./chat-helper-menu.js?v=20260911-01"></script>
</body>
</html>
