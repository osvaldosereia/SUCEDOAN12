<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Dona Antônia · Compra rápida</title>
  <link rel="stylesheet" href="./chat-light-v2.css?v=20260912-03">
  <link rel="stylesheet" href="./cart-fixed-actions-v1.css?v=20260914-01">
  <link rel="stylesheet" href="./chat-checkout-quantity-v1.css?v=20260914-03">
  <link rel="stylesheet" href="./chat-helper-menu.css?v=20260911-01">
  <link rel="stylesheet" href="./comprar-ux-polish-v1.css?v=20260914-01">
  <link rel="stylesheet" href="./product-detail-v1.css?v=20260915-01">
  <link rel="stylesheet" href="./checkout-final-v2.css?v=20260915-01">
  <link rel="stylesheet" href="./storefront-visual-v2.css?v=20260915-01">
</head>
<body>
  <div class="chat-app">
    <header class="chat-topbar">
      <button id="backButton" class="top-icon" type="button" aria-label="Voltar">‹</button>
      <img class="brand-logo" src="../img/logoantonia5.png" alt="Dona Antônia" width="42" height="42">
      <div class="brand-copy"><strong>Dona Antônia</strong><small id="roomStatus">Atendimento online</small></div>
      <button id="cartButton" class="cart-pill" type="button" aria-label="Ver pedido"><span>Pedido</span><b id="cartCount">0</b></button>
    </header>
    <main id="timeline" class="timeline" aria-live="polite">
      <div id="loadingCard" class="bubble assistant">Abrindo seu atendimento…</div>
    </main>
    <div id="cartBar" class="cart-bar">
      <div class="cart-bar-total"><small>Seu pedido</small><strong id="cartTotal">R$ 0,00</strong></div>
      <div class="cart-bar-actions">
        <button id="cartAddProducts" class="cart-add-products" type="button">Adicionar produtos</button>
        <button id="checkoutButton" type="button" disabled>Ver pedido</button>
      </div>
    </div>
    <button id="helpToggle" class="help-toggle" type="button" aria-expanded="false" aria-controls="composer">💬 Ajuda</button>
    <div id="recordingBar" class="recording hidden" aria-live="polite">
      <span class="record-dot"></span><strong id="recordingTime">0:00</strong><span>Gravando</span>
      <button id="cancelRecording" type="button">Cancelar</button>
    </div>
    <form id="composer" class="composer composer-collapsed">
      <button id="photoButton" class="composer-icon" type="button" aria-label="Enviar foto">＋</button>
      <input id="photoInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
      <input id="messageInput" type="text" maxlength="800" autocomplete="off" placeholder="Digite aqui…">
      <button id="micButton" class="composer-icon" type="button" aria-label="Gravar áudio">🎤</button>
      <button id="sendButton" class="send-button" type="submit" aria-label="Enviar">➤</button>
    </form>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="./config.js?v=20260915-02"></script>
  <script src="./product-detail-v1.js?v=20260915-01"></script>
  <script src="./admin-test-bridge.js?v=20260914-02"></script>
  <script src="./chat-checkout-quantity-v1.js?v=20260915-04"></script>
  <script src="./admin-test-after-checkout.js?v=20260914-01"></script>
  <script src="./checkout-message-context-v1.js?v=20260915-01"></script>
  <script src="./checkout-final-v2.js?v=20260915-01"></script>
  <script src="./chat-light-v2.js?v=20260914-04"></script>
  <script src="./storefront-visual-v2.js?v=20260915-01"></script>
  <script src="./phone-retry-v1.js?v=20260914-01"></script>
  <script src="./chat-helper-menu.js?v=20260911-01"></script>
</body>
</html>
