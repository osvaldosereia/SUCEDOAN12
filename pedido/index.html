<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Seu pedido · Dona Antônia</title>
  <style>
    :root{--ink:#18221c;--muted:#657069;--line:#e3e8e4;--soft:#f5f7f5;--brand:#176b43;--danger:#9d2235;--danger-soft:#fff4f4}
    *{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.wrap{width:min(100%,1120px);margin:auto;padding:18px 14px 48px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:92px;height:46px;object-fit:contain}.head div{flex:1}.head strong{display:block;font-size:19px}.head small{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.hero h1{font-size:23px;margin:0 0 3px}.muted{color:var(--muted)}.status{display:inline-flex;border-radius:999px;padding:6px 9px;background:#edf5f0;color:#135938;font-size:12px;font-weight:800;margin-top:10px}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.box{background:var(--soft);border-radius:12px;padding:11px}.box small{display:block;color:var(--muted);font-size:11px}.box strong{display:block;margin-top:3px}.section-title{font-size:17px;font-weight:900;margin:0 0 10px}.basket{border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-top:12px}.basket-head{display:flex;align-items:center;gap:12px;padding:12px;background:var(--soft)}.basket-head img{width:60px;height:60px;border-radius:11px;object-fit:contain;background:#fff}.basket-head strong{display:block}.basket-head small{color:var(--muted)}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.basket .product-grid{padding:12px}.product-card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff;position:relative}.product-card img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px;background:#fff}.product-placeholder{width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--soft)}.product-name{font-weight:750;font-size:13px;line-height:1.25;margin-top:8px;min-height:32px}.product-qty{display:inline-flex;align-self:flex-start;margin-top:auto;padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:900}.product-card.missing{border-color:#e6a8ae;background:var(--danger-soft)}.product-card.missing::after{content:'FALTOU';position:absolute;top:8px;right:8px;border-radius:999px;padding:5px 8px;background:var(--danger);color:#fff;font-size:10px;font-weight:950;letter-spacing:.03em}.product-card.missing .product-name{text-decoration:line-through;text-decoration-thickness:1px}.group-title{display:block;margin:14px 0 8px}.financial{display:grid;gap:8px}.financial-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.financial-row strong{font-size:17px}.financial-row.final{padding-top:10px;border-top:1px solid var(--line);font-size:18px}.financial-row.final strong{font-size:24px}.financial-row.discount strong{color:var(--danger)}.address{white-space:pre-line}.note{font-size:12px;color:var(--muted);margin-top:12px}.actions{display:grid;gap:9px;margin-top:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:12px;text-decoration:none;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.error{text-align:center;padding:50px 20px}.loading{text-align:center;padding:42px;color:var(--muted)}
    @media(min-width:760px){.product-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:520px){.wrap{padding:12px 10px 36px}.card{padding:12px}.summary{grid-template-columns:1fr}.product-grid{gap:9px}.product-card{padding:8px}.product-name{font-size:12px;min-height:30px}}
    @page{size:A4 portrait;margin:12mm}
    @media print{body{background:#fff;font-size:12px;color:#000}.wrap{width:100%;padding:0}.head,.hero,.summary,.financial{break-inside:avoid}.card{border-radius:0;margin-top:8px;padding:10px}.actions,.note{display:none!important}.product-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.product-card{break-inside:avoid;page-break-inside:avoid;border-radius:8px;padding:7px}.product-card img,.product-placeholder{height:30mm;aspect-ratio:auto}.product-name{font-size:11px;min-height:28px}.product-qty{font-size:11px;padding:4px 6px}.basket{overflow:visible;border-radius:0}.basket-head,.group-title,.section-title{break-after:avoid}.basket-head img{width:42px;height:42px}.box,.basket-head,.product-qty{background:#f5f7f5;print-color-adjust:exact}.product-card.missing::after{print-color-adjust:exact}}
  </style>
</head>
<body><main class="wrap"><div class="head"><img class="logo" src="/img/logoantonia5.png" alt="Dona Antônia"><div><strong>Dona Antônia</strong><small>Acompanhamento do seu pedido</small></div></div><div id="app" class="card loading">Carregando seu pedido…</div></main>
<script>
(()=>{'use strict';
const API='https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/order-public-view-v1';
const addonHash=new URLSearchParams(location.hash.replace(/^#/,''));
const addonRaw=(addonHash.get('a')||'').trim(),addonToken=/^[A-Za-z0-9_-]{32,96}$/.test(addonRaw)?addonRaw:'';
const app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),qty=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:3}),uuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v),token=v=>/^[a-f0-9]{16}$/i.test(v);
const statusLabel=s=>({storefront_received:'Recebido',received:'Recebido',confirmed:'Confirmado',processing:'Em separação',ready:'Separado',out_for_delivery:'Em entrega',delivered:'Entregue',cancelled:'Cancelado',returned:'Devolvido'}[String(s||'').toLowerCase()]||'Pedido recebido');
const paymentLabel=v=>({pix:'PIX',dinheiro:'Dinheiro',cash:'Dinheiro',credito:'Cartão de crédito',credit_card:'Cartão de crédito',alimentacao:'Cartão alimentação',refeicao:'Cartão refeição',food_card:'Cartão alimentação/refeição',meal_card:'Cartão alimentação/refeição'}[String(v||'').toLowerCase()]||String(v||'A confirmar'));
function img(url,alt){return url?'<img src="'+esc(url)+'" alt="'+esc(alt)+'" loading="eager">':'<div class="product-placeholder" aria-hidden="true"></div>'}
function itemHtml(x){const missing=String(x.separation_state||'')==='missing';return '<article class="product-card'+(missing?' missing':'')+'">'+img(x.image_url,x.name)+'<div class="product-name">'+esc(x.name)+'</div><div class="product-qty">Quantidade: '+esc(qty(x.quantity))+'</div></article>'}
function address(d){const lines=[];if(d.street)lines.push(d.street+(d.number?', '+d.number:''));if(d.complement)lines.push(d.complement);if(d.district)lines.push(d.district);if(d.city)lines.push(d.city+(d.state?' - '+d.state:''));if(d.reference)lines.push('Referência: '+d.reference);return lines.join('\n')||'Endereço confirmado no pedido'}
let printing=false;
async function printOrderVitrine(){if(printing)return;printing=true;const button=document.getElementById('printVitrine');if(button)button.disabled=true;let timeout;try{const photos=Array.from(document.images).map(image=>{image.loading='eager';return typeof image.decode==='function'?image.decode().catch(()=>{}):Promise.resolve()});await Promise.race([Promise.all(photos),new Promise(resolve=>{timeout=setTimeout(resolve,8000)})]);window.print()}finally{clearTimeout(timeout);printing=false;if(button)button.disabled=false}}
function render(data){const s=data.snapshot||{},items=Array.isArray(s.items)?s.items:[],baskets=Array.isArray(s.baskets)?s.baskets:[],groups=new Map(),standalone=[];for(const x of items){const bn=String(x.basket_name||'').trim();if(bn){if(!groups.has(bn))groups.set(bn,[]);groups.get(bn).push(x)}else standalone.push(x)}let products='';for(const [name,list] of groups){const basket=baskets.find(b=>String(b.name||'')===name)||{};products+='<div class="basket"><div class="basket-head"><div><strong>'+esc(name)+'</strong><small>'+esc(qty(basket.quantity||1))+' cesta(s)</small></div></div><div class="product-grid">'+list.map(itemHtml).join('')+'</div></div>'}if(standalone.length)products+='<div><strong class="group-title">Produtos avulsos</strong><div class="product-grid">'+standalone.map(itemHtml).join('')+'</div></div>';
  const d=s.delivery||{},code=data.public_code||s.order_code||'',original=Number(s.original_total??s.total??0),missing=Number(s.missing_subtotal||0),finalTotal=Number(s.final_total??s.total??0);
  const financial=missing>0?'<section class="card financial"><div class="financial-row"><span>Total original</span><strong>'+esc(money(original))+'</strong></div><div class="financial-row discount"><span>Valor abatido</span><strong>− '+esc(money(missing))+'</strong></div><div class="financial-row final"><span>Total final</span><strong>'+esc(money(finalTotal))+'</strong></div></section>':'<section class="card financial"><div class="financial-row final"><span>Total do pedido</span><strong>'+esc(money(finalTotal))+'</strong></div></section>';
  const addonAction=addonToken&&String(data.current_status||'').toLowerCase()==='storefront_received'?'<section class="card"><h2 class="section-title">Esqueceu alguma coisa?</h2><p class="muted">Por alguns minutos, você pode acrescentar produtos sem criar outro pedido.</p><div class="actions"><a class="btn primary" href="/adicionar/#t='+encodeURIComponent(addonToken)+'">Adicionar produtos ao mesmo pedido</a></div></section>':'';
  app.className='';app.innerHTML='<section class="card hero"><h1>Pedido '+esc(code)+'</h1><div class="muted">Acompanhe aqui o que será entregue.</div><span class="status">'+esc(statusLabel(data.current_status))+'</span><div class="summary"><div class="box"><small>Entrega</small><strong>'+esc(d.delivery_label||d.delivery_date||'A confirmar')+'</strong></div><div class="box"><small>Pagamento</small><strong>'+esc(paymentLabel(s.payment_label))+'</strong></div></div></section><section class="card"><h2 class="section-title">Produtos do pedido</h2>'+products+'</section>'+financial+addonAction+'<section class="card"><h2 class="section-title">Entrega</h2><strong>'+esc(s.customer_name||'Cliente')+'</strong><div class="address muted" style="margin-top:7px">'+esc(address(d))+'</div></section><div class="note">Quando algum produto não estiver disponível, ele aparece marcado como <strong>FALTOU</strong> e o valor é abatido do total final.</div>';
}
async function main(){const qs=new URLSearchParams(location.search),k=(qs.get('k')||'').trim(),o=(qs.get('o')||'').trim();let query='';if(token(k))query='?k='+encodeURIComponent(k);else if(uuid(o))query='?o='+encodeURIComponent(o);else{app.className='card error';app.innerHTML='<h2>Pedido não encontrado</h2><p class="muted">Confira se você abriu o link completo recebido no WhatsApp.</p>';return}try{const response=await fetch(API+query,{cache:'no-store',referrerPolicy:'no-referrer'}),data=await response.json();if(!response.ok||data.ok!==true)throw new Error('not_found');render(data);if(qs.get('print')==='1')await printOrderVitrine()}catch{app.className='card error';app.innerHTML='<h2>Não consegui abrir o pedido</h2><p class="muted">Tente novamente em alguns instantes.</p>'}}
main()})();
</script></body></html>
