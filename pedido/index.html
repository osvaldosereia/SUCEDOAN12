<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Seu pedido · Dona Antônia</title>
  <style>
    :root{--ink:#18221c;--muted:#657069;--line:#e3e8e4;--soft:#f5f7f5;--brand:#176b43;--danger:#9d2235}
    *{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.wrap{width:min(100%,1120px);margin:auto;padding:18px 14px 48px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:92px;height:46px;object-fit:contain}.head div{flex:1}.head strong{display:block;font-size:19px}.head small{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.hero h1{font-size:23px;margin:0 0 3px}.muted{color:var(--muted)}.status{display:inline-flex;border-radius:999px;padding:6px 9px;background:#edf5f0;color:#135938;font-size:12px;font-weight:800;margin-top:10px}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.box{background:var(--soft);border-radius:12px;padding:11px}.box small{display:block;color:var(--muted);font-size:11px}.box strong{display:block;margin-top:3px}.section-title{font-size:17px;font-weight:900;margin:0 0 10px}.basket{border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-top:12px}.basket-head{display:flex;align-items:center;gap:12px;padding:12px;background:var(--soft)}.basket-head img{width:60px;height:60px;border-radius:11px;object-fit:contain;background:#fff}.basket-head strong{display:block}.basket-head small{color:var(--muted)}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.basket .product-grid{padding:12px}.product-card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff;position:relative;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}.product-card img{width:100%;aspect-ratio:1/1;object-fit:contain;border:0;border-radius:12px;background:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}.product-placeholder{width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--soft);touch-action:manipulation;user-select:none;-webkit-user-select:none}.product-name{font-weight:750;font-size:13px;line-height:1.25;margin-top:8px;min-height:32px}.product-qty{font-size:22px;font-weight:900;line-height:1.1;margin-top:auto;padding-top:10px}.product-qty span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.product-card.separated{border-color:#48a274;background:#f5fbf7;box-shadow:0 0 0 2px #d7efe1}.product-card.separated::after{content:'✓';position:absolute;top:7px;right:7px;width:29px;height:29px;border-radius:999px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.15)}.product-card.separated .product-name::after{content:' · Separado';color:var(--brand);font-weight:900}.group-title{display:block;margin:14px 0 8px}.total{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:18px}.total strong{font-size:24px}.address{white-space:pre-line}.note{font-size:12px;color:var(--muted);margin-top:12px}.actions{display:grid;gap:9px;margin-top:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:12px;text-decoration:none;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.complete-separation{display:none;background:#0f5836;color:#fff}.complete-separation.visible{display:flex}.complete-separation:disabled{opacity:.6;cursor:wait}.error{text-align:center;padding:50px 20px}.loading{text-align:center;padding:42px;color:var(--muted)}
    @media(min-width:760px){.product-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:520px){.wrap{padding:12px 10px 36px}.card{padding:12px}.summary{grid-template-columns:1fr}.product-grid{gap:9px}.product-card{padding:8px}.product-name{font-size:12px;min-height:30px}.product-qty{font-size:21px}}
    @page{size:A4 portrait;margin:12mm}
    @media print{body{background:#fff;font-size:12px;color:#000}.wrap{width:100%;padding:0}.head,.hero,.summary,.total{break-inside:avoid}.card{border-radius:0;margin-top:8px;padding:10px}.actions,.note{display:none!important}.product-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.product-card,.product-card.separated{break-inside:avoid;page-break-inside:avoid;border-radius:8px;padding:7px;background:#fff;border-color:var(--line);box-shadow:none}.product-card.separated::after,.product-card.separated .product-name::after{display:none}.product-card img,.product-placeholder{height:30mm;aspect-ratio:auto}.product-name{font-size:11px;min-height:28px}.product-qty{font-size:19px}.basket{overflow:visible;border-radius:0}.basket-head,.group-title,.section-title{break-after:avoid}.basket-head img{width:42px;height:42px}.box,.basket-head{background:#f5f7f5;print-color-adjust:exact}}
  </style>
</head>
<body><main class="wrap"><div class="head"><img class="logo" src="/img/logoantonia5.png" alt="Dona Antônia"><div><strong>Dona Antônia</strong><small>Conferência do seu pedido</small></div></div><div id="app" class="card loading">Carregando seu pedido…</div></main>
<script>
(()=>{'use strict';
const API='https://ssbesxgaijknwsjbsbcz.supabase.co/functions/v1/order-public-view-v1',CHANNELS={'0975':'5565998150975','1018':'5565984491018'},SEPARATION_TAPS=3,SEPARATION_TAP_WINDOW_MS=900;const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const qty=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});const uuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v);const token=v=>/^[a-f0-9]{16}$/i.test(v);const statusLabel=s=>({storefront_received:'Recebido',received:'Recebido',confirmed:'Confirmado',processing:'Em separação',separating:'Em separação',separated:'Separado',ready:'Pronto',expedition:'Em expedição',out_for_delivery:'Saiu para entrega',delivered:'Entregue',cancelled:'Cancelado'}[String(s||'').toLowerCase()]||'Pedido recebido');const paymentLabel=v=>({pix:'PIX',dinheiro:'Dinheiro',cash:'Dinheiro',credito:'Cartão de crédito',credit_card:'Cartão de crédito',alimentacao:'Cartão alimentação',refeicao:'Cartão refeição',food_card:'Cartão alimentação/refeição'}[String(v||'').toLowerCase()]||String(v||'A confirmar'));
let currentData=null,currentToken='',separationFingerprint='',checkedIndexes=new Set(),activeTapIndex=null,tapCount=0,lastTapAt=0,finishing=false;
function img(url,alt){return url?'<img src="'+esc(url)+'" alt="'+esc(alt)+'" loading="lazy" draggable="false">':'<div class="product-placeholder" aria-hidden="true"></div>'}
function itemHtml(x,index){return '<article class="product-card" data-separation-index="'+index+'">'+img(x.image_url,x.name)+'<div class="product-name">'+esc(x.name)+'</div><div class="product-qty"><span>Quantidade:</span>'+esc(qty(x.quantity))+'</div></article>'}
function address(d){const l=[];if(d.street)l.push(d.street+(d.number?', '+d.number:''));if(d.complement)l.push(d.complement);if(d.district)l.push(d.district);if(d.city)l.push(d.city+(d.state?' - '+d.state:''));if(d.reference)l.push('Referência: '+d.reference);return l.join('\n')||'Endereço confirmado no pedido'}
function whatsappPhone(channel){return CHANNELS[String(channel||'')]||CHANNELS['0975']}
function talkToWhatsapp(channel){const phone=whatsappPhone(channel),deep='whatsapp://send?phone='+phone,fallback='https://wa.me/'+phone;let hidden=false;const onVisibility=()=>{if(document.visibilityState==='hidden')hidden=true};document.addEventListener('visibilitychange',onVisibility,{once:true});window.location.href=deep;setTimeout(()=>{if(!hidden&&document.visibilityState==='visible')window.location.href=fallback},850)}
function bindWhatsapp(channel){const b=document.getElementById('talkWhatsapp');if(b)b.onclick=()=>talkToWhatsapp(channel)}
let printing=false;
async function printOrderVitrine(){if(printing)return;printing=true;const button=document.getElementById('printVitrine');if(button)button.disabled=true;let timeout;try{const photos=Array.from(document.images).map(image=>{image.loading='eager';return typeof image.decode==='function'?image.decode().catch(()=>{}):Promise.resolve()});await Promise.race([Promise.all(photos),new Promise(resolve=>{timeout=setTimeout(resolve,8000)})]);window.print()}finally{clearTimeout(timeout);printing=false;if(button)button.disabled=false}}
function storageKey(){return currentToken&&separationFingerprint?'da:separation:'+currentToken+':'+separationFingerprint:''}
function loadSeparationProgress(){checkedIndexes=new Set();const key=storageKey();if(!key)return;try{const a=JSON.parse(localStorage.getItem(key)||'[]');for(const v of Array.isArray(a)?a:[]){const n=Number(v);if(Number.isInteger(n)&&n>=0)checkedIndexes.add(n)}}catch{}}
function saveSeparationProgress(){const key=storageKey();if(!key)return;try{localStorage.setItem(key,JSON.stringify([...checkedIndexes].sort((a,b)=>a-b)))}catch{}}
function canSeparate(){return Boolean(currentToken)&&['confirmed','processing'].includes(String(currentData?.current_status||''))}
function separationCards(){return typeof document.querySelectorAll==='function'?[...document.querySelectorAll('[data-separation-index]')]:[]}
function paintSeparationState(){const cards=separationCards();for(const card of cards){const i=Number(card.getAttribute('data-separation-index'));card.className=checkedIndexes.has(i)?'product-card separated':'product-card'}const complete=document.getElementById('completeSeparation');if(complete){const all=cards.length>0&&checkedIndexes.size===cards.length&&cards.every(card=>checkedIndexes.has(Number(card.getAttribute('data-separation-index'))));complete.classList.toggle('visible',canSeparate()&&all)}}
function handleProductTap(ev){if(!canSeparate())return;const imageArea=ev.target?.closest?.('[data-separation-index] img,[data-separation-index] .product-placeholder');if(!imageArea)return;const card=imageArea.closest('[data-separation-index]'),index=Number(card?.getAttribute('data-separation-index'));if(!Number.isInteger(index))return;const now=Date.now();if(index!==activeTapIndex||now-lastTapAt>SEPARATION_TAP_WINDOW_MS){activeTapIndex=index;tapCount=1}else tapCount+=1;lastTapAt=now;if(tapCount<SEPARATION_TAPS)return;activeTapIndex=null;tapCount=0;lastTapAt=0;if(checkedIndexes.has(index))checkedIndexes.delete(index);else checkedIndexes.add(index);saveSeparationProgress();paintSeparationState()}
async function completeSeparation(){if(finishing||!canSeparate())return;const cards=separationCards(),all=cards.length>0&&checkedIndexes.size===cards.length&&cards.every(card=>checkedIndexes.has(Number(card.getAttribute('data-separation-index'))));if(!all)return;finishing=true;const b=document.getElementById('completeSeparation');if(b){b.disabled=true;b.textContent='Concluindo separação…'}try{const r=await fetch(API+'?k='+encodeURIComponent(currentToken),{method:'POST',cache:'no-store',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'complete_separation',checked_indexes:[...checkedIndexes].sort((a,b)=>a-b),separation_fingerprint:separationFingerprint})}),d=await r.json();if(!r.ok||d.ok!==true)throw new Error(String(d.error||'separation_failed'));const key=storageKey();if(key)try{localStorage.removeItem(key)}catch{}currentData.current_status='ready';checkedIndexes=new Set();render(currentData)}catch(e){alert(String(e?.message||e)==='separation_snapshot_changed'?'O pedido foi atualizado. Reabra a vitrine e confira novamente.':'Não foi possível concluir a separação agora. Abra o pedido no Admin e confira o motivo.');if(b){b.disabled=false;b.textContent='Concluir separação'}}finally{finishing=false}}
function render(data){currentData=data;separationFingerprint=String(data.separation_fingerprint||'');const s=data.snapshot||{},items=Array.isArray(s.items)?s.items:[],baskets=Array.isArray(s.baskets)?s.baskets:[],groups=new Map(),standalone=[];items.forEach((x,index)=>{const row={...x,__index:index},bn=String(x.basket_name||'').trim();if(bn){if(!groups.has(bn))groups.set(bn,[]);groups.get(bn).push(row)}else standalone.push(row)});let products='';for(const [name,list] of groups){const bm=baskets.find(b=>String(b.name||'')===name)||{};products+='<div class="basket"><div class="basket-head">'+(bm.image_url?'<img src="'+esc(bm.image_url)+'" alt="'+esc(name)+'">':'')+'<div><strong>'+esc(name)+'</strong><small>'+esc(qty(bm.quantity||1))+' cesta(s) · itens escolhidos por você</small></div></div><div class="product-grid">'+list.map(x=>itemHtml(x,x.__index)).join('')+'</div></div>'}if(standalone.length)products+='<div><strong class="group-title">Produtos avulsos</strong><div class="product-grid">'+standalone.map(x=>itemHtml(x,x.__index)).join('')+'</div></div>';const d=s.delivery||{},code=data.public_code||s.order_code||'';app.className='';app.innerHTML='<section class="card hero"><h1>Pedido '+esc(code)+'</h1><div class="muted">Pedido salvo para conferência</div><span class="status">'+esc(statusLabel(data.current_status))+'</span><div class="summary"><div class="box"><small>Entrega</small><strong>'+esc(d.delivery_label||d.delivery_date||'A confirmar')+'</strong></div><div class="box"><small>Pagamento</small><strong>'+esc(paymentLabel(s.payment_label))+'</strong></div></div></section><section class="card"><h2 class="section-title">Produtos do pedido</h2>'+products+'</section><section class="card"><h2 class="section-title">Entrega</h2><strong>'+esc(s.customer_name||'Cliente')+'</strong><div class="address muted" style="margin-top:7px">'+esc(address(d))+'</div></section><section class="card total"><span>Total do pedido</span><strong>'+esc(money(s.total))+'</strong></section><div class="note">Esta página é somente para conferência. Ela não altera os produtos nem as quantidades do pedido.</div><div class="actions"><button class="btn complete-separation" type="button" id="completeSeparation">Concluir separação</button><button class="btn primary" type="button" id="talkWhatsapp">Falar no WhatsApp</button><button class="btn secondary" type="button" id="printVitrine">Imprimir vitrine</button><a class="btn secondary" href="/">Voltar à vitrine</a></div>';bindWhatsapp(data.channel_origin);document.getElementById('printVitrine').onclick=printOrderVitrine;const done=document.getElementById('completeSeparation');if(done)done.onclick=completeSeparation;loadSeparationProgress();paintSeparationState()}
async function main(){const qs=new URLSearchParams(location.search),k=(qs.get('k')||'').trim(),o=(qs.get('o')||'').trim();let query='';if(token(k)){currentToken=k;query='?k='+encodeURIComponent(k)}else if(uuid(o))query='?o='+encodeURIComponent(o);else{app.className='card error';app.innerHTML='<h2>Pedido não encontrado</h2><p class="muted">Confira se você abriu o link completo recebido no WhatsApp.</p>';return}try{const r=await fetch(API+query,{cache:'no-store',referrerPolicy:'no-referrer'}),d=await r.json();if(!r.ok||d.ok!==true)throw new Error('not_found');render(d);if(qs.get('print')==='1')await printOrderVitrine()}catch{app.className='card error';app.innerHTML='<h2>Não consegui abrir o pedido</h2><p class="muted">Tente novamente ou fale com a Dona Antônia.</p><div class="actions"><button class="btn primary" type="button" id="talkWhatsapp">Falar no WhatsApp</button></div>';bindWhatsapp('0975')}}
if(typeof app.addEventListener==='function')app.addEventListener('pointerup',handleProductTap,{passive:true});
main()})();
</script></body></html>
