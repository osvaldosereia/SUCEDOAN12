<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AME MAIS · Gestão de Produtos</title><link rel="stylesheet" href="./styles.css?v=20260913-7"></head><body><header class="app-head"><div><small>AME MAIS</small><h1>Produtos</h1><p>Cadastre, atualize e conte estoque pelo celular.</p></div><span id="liStatus" class="status">Loja não conectada</span></header><nav class="mode-nav"><button id="modeCreate" class="active">Cadastrar</button><button id="modeProducts">Produtos</button><button id="modeCount">Contagem</button></nav><main>
<section id="createView" class="view"><div class="card"><h2>Novo produto</h2><label>EAN <input id="eanInput" inputmode="numeric" placeholder="Digite ou leia o código"></label><div class="row"><label class="action">📷 Ler EAN<input id="scanEanInput" type="file" accept="image/*" capture="environment" hidden></label><label class="action">📷 Tirar fotos<input id="cameraInput" type="file" accept="image/*" capture="environment" multiple hidden></label><label class="action">Galeria<input id="photoInput" type="file" accept="image/*" multiple hidden></label></div><span id="photoCount">0/3</span><div id="photoPreviews"></div><div id="eanMessage"></div><label>Valor <input id="priceInput" inputmode="decimal" placeholder="R$ 0,00"></label><button id="analyzeButton" class="primary">Criar cadastro inteligente</button></div><div id="progressCard" class="card hidden"><strong id="progressTitle"></strong><span id="progressText"></span><b id="progressPercent"></b><div class="bar"><i id="progressBar"></i></div></div><section id="resultArea" class="card hidden"><small id="resultMeta"></small><label>Nome<input id="productName"></label><label>Descrição<textarea id="ecommerceDescription" rows="7"></textarea></label><div id="imageGrid"></div><button id="publishLi" class="primary">Salvar na Loja Integrada</button><button id="newProduct">Novo produto</button></section></section>
<section id="productsView" class="view hidden"><div class="card"><h2>Produtos da loja</h2><div class="search"><input id="liSearch" placeholder="Nome, SKU ou EAN"><button id="liSearchButton">Buscar</button></div><div id="liProductList" class="product-list"></div></div><div id="productEditor" class="card hidden"><h2 id="editTitle">Editar produto</h2><label>Nome<input id="editName"></label><label>EAN<input id="editEan" inputmode="numeric"></label><label>Preço<input id="editPrice" inputmode="decimal"></label><label>Estoque<input id="editStock" inputmode="numeric"></label><label>Descrição<textarea id="editDescription" rows="5"></textarea></label><div class="row"><button id="saveProduct" class="primary">Salvar alterações</button><button id="toggleActive">Desativar</button></div></div></section>
<section id="countView" class="view hidden"><div class="card count-card"><h2>Contagem rápida</h2><p>Leia o EAN, informe a quantidade física e salve.</p><label>EAN<input id="countEan" inputmode="numeric" autocomplete="off" placeholder="EAN"></label><label class="action big">📷 Ler código<input id="countScan" type="file" accept="image/*" capture="environment" hidden></label><div id="countProduct" class="count-product">Aguardando produto</div><label>Quantidade contada<input id="countQuantity" inputmode="numeric" autocomplete="off"></label><div class="seg"><button id="countTotal" class="active">Informar total</button><button id="countAdd">Somar +1</button></div><button id="saveCount" class="primary big">Salvar e próximo</button></div></section>
<section class="card"><h2>3 últimas criações</h2><div id="recentCreations"></div></section><p id="mainMessage"></p></main><div id="toastRegion"></div><div id="imageModal" class="modal hidden"><button id="modalClose">×</button><img id="modalImage"></div><script type="module" src="./app.js?v=20260913-7"></script></body></html>
